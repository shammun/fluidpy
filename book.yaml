# Chapter map for Kundu, Cohen & Dowling, *Fluid Mechanics*, 5th ed. (Academic Press, 2012).
# GENERATED from the PDF's own bookmark outline (exact PDF page numbers) by tools/detect_chapters.py, then annotated.
#   pdf_start/pdf_end : 1-based PDF page numbers, inclusive (tools/split_pdf.py uses these: no offset guessing)
#   printed_start/end : page numbers printed in the book (pdf = printed + 27 for chapters 1-16)
#   sections          : the numbered sections exactly as printed (from the outline)
#   viz_seeds         : a PRIOR shortlist of interactive-explainer ideas for the concept-curator, not a decision
#   do_chapter        : false = skipped by /do-chapter (appendices are reference material only)

project:
  package: fluidpy
  repo: shammun/fluidpy              # GitHub user/repo (public). Change it here only: every tool reads this block.
  branch: main
  site_url: https://shammun.github.io/fluidpy
  site_title: "Fluid Mechanics (Kundu, Cohen & Dowling, 5th ed.) — worked in Python, with interactive explainers"
  author: "Shammunul Islam"
  min_explainers_per_chapter: 4      # every chapter integrates 4–5 interactive explainers
  max_explainers_per_chapter: 5
  max_parallel_viz: 3                # viz-builder agents running at once (each runs a headless browser audit)

book:
  title: "Fluid Mechanics"
  edition: "5th"
  authors: ["Pijush K. Kundu", "Ira M. Cohen", "David R. Dowling"]
  publisher: "Academic Press (Elsevier)"
  year: 2012
  pdf: auto                          # the single *.pdf in the repo root
  pdf_pages: 919
  printed_offset: 27                 # pdf_page = printed_page + 27
  nomenclature_pdf_pages: [23, 27]   # the book's symbol list: agents may READ it (private); knowledge/notation.md is written in our own words

