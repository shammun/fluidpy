.viz-step-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.viz-step-text p { margin: 0 0 6px; } .viz-step-text p:last-child { margin-bottom: 0; }
.viz-step-text { font-size: 14px; color: var(--viz-text-soft); line-height: 1.5; }
.viz-step-extras { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; min-height: 0; }
.viz-step-eq { background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 6px 8px; }
.viz-app[data-dense="2"] .viz-step-text, .viz-app[data-dense="3"] .viz-step-text { font-size: 13px; line-height: 1.4; }
.viz-app[data-dense="3"] .viz-step-title { font-size: 14.5px; }
.viz-app[data-layout="portrait"] .viz-steps-chips .viz-step-chip { min-width: 24px; height: 24px; font-size: 12px; }

/* ---------- highlight (walkthrough points at a control / readout / equation) ---------- */
.viz-hl { outline: 2px solid var(--viz-orange); outline-offset: 2px; border-radius: 8px; animation: viz-pulse 1.6s ease-in-out 2; }
@keyframes viz-pulse { 0%, 100% { outline-color: var(--viz-orange); } 50% { outline-color: transparent; } }

/* ---------- linked views (stage.views) ---------- */
.viz-stage { display: flex; flex-direction: column; }
.viz-stage.multi { background: transparent; border: 0; box-shadow: none; gap: 6px; overflow: hidden; }
.viz-views { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.viz-row { display: flex; gap: 6px; min-height: 0; }
.viz-view { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.viz-stage.multi .viz-view { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); padding: 4px 6px; }
.viz-view-title { flex: 0 0 auto; font-size: 12.5px; color: var(--viz-muted); line-height: 1.3; padding: 1px 2px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viz-view-title b { font-weight: 600; }
.viz-view-title b:not([class*="c-"]) { color: var(--viz-text); }
.viz-view-holder { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.viz-view-holder > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viz-3d-canvas { z-index: 0; } .viz-view-holder > canvas.viz-canvas { z-index: 1; }
.viz-3d-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--viz-muted); font-size: 13px; z-index: 2; }
.viz-app[data-layout="portrait"] .viz-hide-portrait { display: none !important; }
.viz-app[data-layout="portrait"] .viz-transport .viz-optional { display: none !important; }
.viz-app[data-layout="portrait"] .viz-transport .viz-control-label { display: none; }
.viz-app[data-layout="portrait"][data-dense="2"] .viz-view-title, .viz-app[data-layout="portrait"][data-dense="3"] .viz-view-title,
.viz-app[data-layout="landscape"][data-dense="3"] .viz-view-title { display: none; }
.viz-app[data-layout="portrait"][data-dense="3"] .viz-presets-label { display: none; }
.viz-step-card .viz-card-title { text-transform: none; letter-spacing: 0; }
.viz-subhead-like { margin-top: 2px; }
.viz-app[data-layout="portrait"] .viz-stage.multi { min-height: max(260px, 54%, var(--viz-stage-need, 0px)); }

/* ---------- stage top strip: modes · presets · status ---------- */
.viz-stage-top { flex: 0 0 auto; display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; padding: 4px 6px; }
.viz-stage:not(.multi) .viz-stage-top { border-bottom: 1px solid var(--viz-border); }
.viz-stage.multi .viz-stage-top { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); }
.viz-seg { display: inline-flex; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: 999px; padding: 2px; gap: 2px; }
.viz-seg-btn { border: 0; background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--viz-text-soft); min-height: 24px; white-space: nowrap; }
.viz-seg-btn[aria-pressed="true"] { background: var(--viz-accent); color: #fff; }
.viz-presets { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
.viz-presets-label { font-size: 12px; color: var(--viz-muted); }
.viz-preset { border: 1px solid color-mix(in srgb, var(--viz-orange) 45%, var(--viz-border)); background: color-mix(in srgb, var(--viz-orange) 9%, var(--viz-card));
  color: var(--viz-text); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; cursor: pointer; min-height: 24px; white-space: nowrap; }
.viz-preset[aria-pressed="true"] { background: var(--viz-orange); border-color: var(--viz-orange); color: #fff; }
.viz-status { margin-left: auto; font-size: 12.5px; font-weight: 650; padding: 2px 10px; border-radius: 999px; background: var(--viz-accent-soft); color: var(--viz-accent-dark); max-width: 100%; }
.viz-status[data-tone="good"] { background: color-mix(in srgb, var(--viz-teal) 14%, var(--viz-card)); color: var(--viz-teal); }
.viz-status[data-tone="warn"] { background: color-mix(in srgb, var(--viz-orange) 14%, var(--viz-card)); color: var(--viz-orange); }
.viz-status[data-tone="bad"] { background: color-mix(in srgb, var(--viz-rose) 12%, var(--viz-card)); color: var(--viz-rose); }
.viz-status[hidden] { display: none; }

/* ---------- transport: play · step · restart · time scrubber · speed ---------- */
.viz-transport { flex: 0 0 auto; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; padding: 4px 6px; }
.viz-stage:not(.multi) .viz-transport { border-top: 1px solid var(--viz-border); }
.viz-stage.multi .viz-transport { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); }
.viz-transport .viz-control { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; align-items: center; column-gap: 6px; }
.viz-transport .viz-control input[type="range"] { grid-column: 2; grid-row: 1; margin: 0; }
.viz-transport .viz-control .viz-control-label { grid-column: 1; grid-row: 1; font-size: 12.5px; white-space: nowrap; }
.viz-transport .viz-control .viz-control-value { grid-column: 3; grid-row: 1; }
.viz-transport .viz-scrub { flex: 3 1 180px; min-width: 150px; }
.viz-transport .viz-speed { flex: 1 1 150px; min-width: 140px; }

/* ---------- explore pager items ---------- */
.viz-subhead { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--viz-muted); margin-top: 2px; }
.viz-muted { color: var(--viz-muted); }

/* ---------- term-by-term bars ---------- */
.viz-terms { display: flex; flex-direction: column; gap: 5px; }
.viz-term { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
.viz-term[aria-pressed="true"] { border-color: var(--term-color); box-shadow: 0 0 0 2px color-mix(in srgb, var(--term-color) 25%, transparent); }
.viz-term-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.viz-term-label { color: var(--term-color); font-weight: 600; min-width: 0; }
.viz-term-val { font-family: var(--viz-mono); font-size: 12.5px; white-space: nowrap; }
.viz-term-track { height: 9px; background: var(--viz-card-2); border-radius: 5px; overflow: hidden; }
.viz-term-fill { display: block; height: 100%; border-radius: 5px; transition: width .2s; }
.viz-term.neg .viz-term-fill { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 3px, transparent 3px 6px) !important; }
.viz-term-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13.5px; border-top: 2px solid var(--viz-accent); padding-top: 4px; }

/* ---------- inspector · right now ---------- */
.viz-inspect, .viz-notes { font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-inspect { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 7%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 5px 9px; }
.viz-notes { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 5px 9px; }
.viz-notes p, .viz-inspect p { margin: 0 0 4px; } .viz-notes p:last-child, .viz-inspect p:last-child { margin-bottom: 0; }

/* ---------- step-by-step working (Viz.work helpers) ---------- */
.viz-work-h { font-size: 13px; font-weight: 650; color: var(--viz-accent); margin: 4px 0 0; }
.viz-work-ln { font-size: 13px; line-height: 1.45; padding: 2px 0; border-bottom: 1px dashed var(--viz-border); }
.viz-work-ln b { font-variant-numeric: tabular-nums; }
.viz-work-why { color: var(--viz-muted); font-size: 12px; margin-left: 4px; }
.viz-work-res { font-size: 13px; line-height: 1.45; padding: 4px 9px; border-radius: 8px; border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 9%, var(--viz-card)); }
.viz-work-res.teal { border-left-color: var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 9%, var(--viz-card)); }
.viz-work-table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.viz-work-table th, .viz-work-table td { padding: 2px 8px 2px 0; text-align: left; border-bottom: 1px solid var(--viz-border); }
.viz-work-table th { color: var(--viz-muted); font-weight: 600; }
.viz-work-table tr.cur td { background: color-mix(in srgb, var(--viz-orange) 12%, var(--viz-card)); font-weight: 600; }
.viz-work-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; margin-right: 6px;
  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-work-hint { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--viz-muted); font-style: italic; }
.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

/* ---------- derivation stepper ---------- */
.viz-der-line { display: block; min-width: 0; border-radius: 8px; padding: 2px 6px; }
.viz-der-tag { display: block; font-size: 12px; line-height: 1.2; color: var(--viz-muted); font-variant-numeric: tabular-nums; }
.viz-der-chain { display: flex; align-items: center; gap: 6px; }
.viz-der-chain .viz-eq-body { flex: 1 1 auto; min-width: 0; }
.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }
.viz-der-chain .viz-eq-body { font-size: 14px; }
.viz-der-block { font-size: 13.5px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-der-block ol { margin: 2px 0 0 18px; padding: 0; } .viz-der-block li { margin: 0 0 2px; }
.viz-der-did { font-weight: 650; color: var(--viz-orange); padding-left: 6px; }
.viz-der-why { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-why b.k { color: var(--viz-teal); }
.viz-der-plain { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp { border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.viz-der-pick { flex-wrap: wrap; }
.viz-app[data-dense="2"] .viz-der-block, .viz-app[data-dense="3"] .viz-der-block { font-size: 13px; line-height: 1.4; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-stage { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-side { flex: 1 1 auto; }
/* phones: the derivation keeps ONE view of the picture (derivation.view, else the first) and drops the strips */
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage { min-height: max(150px, 30%); flex: 0 0 auto; height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage.multi { min-height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage-top,
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-der-off { display: none !important; }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-side { flex: 1 1 auto; }
.c-accent { color: var(--viz-accent); font-weight: 650; } .c-teal { color: var(--viz-teal); font-weight: 650; }
.c-orange { color: var(--viz-orange); font-weight: 650; } .c-rose { color: var(--viz-rose); font-weight: 650; } .c-blue { color: var(--viz-blue); font-weight: 650; }

/* ---------- code tab ---------- */
.viz-code-card { min-width: 0; }
.viz-code-title { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; font-size: 13px; font-weight: 600; color: var(--viz-text-soft); margin-bottom: 3px; }
.viz-code { background: #1f2940; color: #dce6f5; border-radius: 9px; padding: 6px 8px; font-family: var(--viz-mono); font-size: 12.5px; line-height: 1.5; }
.viz-code-ln { white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 4px; padding: 0 4px 0 30px; position: relative; }
.viz-code-ln.cur { background: rgba(123,92,214,.5); box-shadow: inset 3px 0 0 #b9a5ec; }
.viz-code-no { position: absolute; left: 2px; width: 22px; text-align: right; color: #6f7fa3; user-select: none; }
.viz-code .cm { color: #8d9cc0; } .viz-code .st { color: #a5e3a0; } .viz-code .num { color: #f6b86e; }
.viz-code .kw { color: #f290c8; } .viz-code .fn { color: #7ce0d3; }
.viz-code-live { color: #ffe08a; font-weight: 700; }
.viz-step-code .viz-code { font-size: 12.5px; }

/* ---------- pager: an item taller than a page is shown in slices (Pager in viz_lib.js) ---------- */
.viz-pages { position: relative; }
.viz-pager-cue { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; display: flex; align-items: flex-end; justify-content: flex-end;
  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--viz-card) 45%); padding-right: 2px; }
.viz-pager-cue[hidden] { display: none; }
.viz-pages.viz-cont-top { box-shadow: inset 0 2px 0 0 color-mix(in srgb, var(--viz-accent) 45%, transparent); }
/* a paged text panel on portrait keeps exactly the height its pages were packed for: the stage stays at its floor */
.viz-app[data-layout="portrait"][data-paged] .viz-stage { flex-grow: 0; }
.viz-app[data-layout="portrait"][data-paged] .viz-side { flex: 1 1 0; }
.viz-pages > .viz-sliced { flex-shrink: 0; position: relative; }   /* contains KaTeX's hidden MathML, else it overflows the page */
/* room: fit() moves the portrait split between picture and text when one side cannot fit its content —
   "stage": views were squeezed below 60 px (a full text page); "text": one formula/row is taller than a text page */
.viz-app[data-layout="portrait"][data-room="stage"] .viz-stage.multi { min-height: max(300px, 62%, var(--viz-stage-need, 0px)); }
.viz-app[data-layout="portrait"][data-room="text"] .viz-stage { min-height: max(140px, 26%); }
.viz-app[data-layout="portrait"][data-room="text"] .viz-stage.multi { min-height: max(140px, 26%, var(--viz-stage-need, 0px)); }
.viz-app[data-layout="portrait"][data-room="text"][data-tab="derive"] .viz-stage { height: max(140px, 24%); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* VIZ_BASE_CSS:END */

  .viz-stage-top .viz-presets { flex-wrap: wrap; }
  .viz-pager-label { white-space: nowrap; min-width: 52px; }
  .viz-status { white-space: normal; border-radius: 12px; }
  /* phones: the preset chips go outside Explore (the walkthrough sets the cases; the status names the regime) */
  .viz-app[data-layout="landscape"] .viz-presets { display: none !important; }

  @media (max-height: 700px) {
    .viz-app[data-layout="portrait"] .viz-presets { display: none !important; }
  }
  /* the short landscape frame: the surface beside the velocity, one row; the budget view goes (its two numbers are
     in the velocity title and the readouts); a one-line transport */
  .viz-app[data-layout="landscape"] .viz-views { flex-direction: row; }
  .viz-app[data-layout="landscape"] .viz-views > .viz-row { flex: 1 1 0 !important; min-width: 0; }
  .viz-app[data-layout="landscape"] .viz-view[data-view="budget"] { display: none !important; }
  .viz-app[data-layout="landscape"] .viz-transport .viz-optional,
  .viz-app[data-layout="landscape"] .viz-transport .viz-speed { display: none !important; }
  /* a chain line cut over two pages must not be re-centred in its slice */
  .viz-der-chain.viz-sliced { align-items: flex-start; }
  /* the short landscape frame: the derivation's title would take a page of its own (the chips and the step name stay) */
  .viz-app[data-layout="landscape"][data-tab="derive"] .viz-side .viz-step-title { display: none !important; }
</style>

<div id="app"></div>
<script id="viz-lib">

     cLong(H)                            <->  ch13.long_wave_speed(H)                   c = sqrt(g H)

  if (d.regime === 'wide') return 'This bump is wider than $\\Lambda$ (' + km(2 * d.a * d.Lam) + ' against ' + km(d.Lam) + '): rotation wins. Only the two edges adjust, each over about one $\\Lambda$; the middle keeps ' + pct(R.centre) + ' of its height and only ' + pct(R.relEnd / (2 * d.a * 0.5)) + ' of the potential energy is released. Two opposite jets circle the high with the high on their ' + d.sd.turns + ' (' + d.sd.name + ' hemisphere).';
  let t = 'The water starts toward the low side, is turned by the Coriolis force to its ' + d.sd.turns + ' (' + d.sd.name + ' hemisphere; to its ' + other + ' in the other one), and ends as a jet <i>along</i> the step, in the ' + d.sd.jet + ' direction, whose Coriolis force holds the remaining slope. Only water within about one Rossby radius, ' + km(d.Lam) + ', of the step ever crossed it; gravity gets back only the energy stored there.';
  if (d.regime === 'ext') t += ' For the external mode $\\Lambda$ is ' + km(d.Lam) + (d.planet ? ', larger than the earth itself' : ', the size of an ocean basin') + ': on the scale of a weather system or an eddy the external mode adjusts almost as if there were no rotation, which is why tides and tsunamis behave like ordinary long waves.';
  else if (d.lat < 10) t += ' So close to the equator $f$ is small and $\\Lambda$ large: a wide band of ocean takes part, and the adjustment takes ' + Viz.fmtTime(d.Ti) + ' per inertial period.';
  return t;
}

/* ---------- drawing -------------------------------------------------------------------------------- */
function xAxis(d) { const big = XV * d.Lam / 1000 >= 2e4; return { k: d.Lam / 1000 / (big ? 1000 : 1), unit: big ? '1000 km' : 'km' }; }
function scaled(arr, k, n) { const o = new Array(n === undefined ? arr.length : n); for (let i = 0; i < o.length; i++) o[i] = arr[i] * k; return o; }
function midpoints(xs) { const o = new Array(xs.length - 1); for (let i = 0; i < o.length; i++) o[i] = 0.5 * (xs[i] + xs[i + 1]); return o; }
function vline(P, x, o) { const X = P.X(x); if (X < P.px.x || X > P.px.x + P.px.w) return false; const ctx = P.ctx; ctx.save(); ctx.strokeStyle = o.color; ctx.lineWidth = o.width || 1; ctx.setLineDash(o.dash || []); ctx.beginPath(); ctx.moveTo(X, P.px.y); ctx.lineTo(X, P.px.y + P.px.h); ctx.stroke(); ctx.restore(); return true; }

function drawEta(g, s) {
  const v = g.view('eta'); v.clear(); if (v.w < 60 || v.h < 60) { ETAP = null; return; }
  const d = N(s), c = now(s), R = d.run, ctx = v.ctx, small = v.w < 340 || v.h < 150, tiny = v.h < 105, roomy = v.w >= 560 && v.h >= 170, ax = xAxis(d), cm = ETA0 * 100;
  const yl = d.bump ? [-0.7, 1.6] : [-1.7, 1.7], xs = scaled(R.xs, ax.k), muted = Viz.color('muted'), text = Viz.color('text'), orange = Viz.color('orange');
  const P = v.plot({ xlim: [-XV * ax.k, XV * ax.k], ylim: [yl[0] * cm, yl[1] * cm], xlabel: tiny ? null : 'x across the step [' + ax.unit + ']', ylabel: 'η [cm]', pad: { l: 46, r: 10, t: 8, b: tiny ? 18 : 34 } })
    .axes({ yticks: d.bump ? [0, 5] : [-5, 0, 5] });
  ETAP = P;
  const edges = d.bump ? [-d.a, d.a] : [0];
  P.clip(() => {
    // the water (below the surface), and the band of one Rossby radius on each side of every edge
    P.fillBetween(xs, scaled(c.es, cm), yl[0] * cm, { color: Viz.color('blue'), alpha: 0.1 });
    if (d.rot) edges.forEach(xe => { ctx.save(); ctx.fillStyle = Viz.alpha(Viz.color('teal'), 0.1); ctx.fillRect(P.X((xe - 1) * ax.k), P.px.y, P.sx(2 * ax.k), P.px.h); ctx.restore(); });
    // departing fronts at +-(a + c t)
    if (c.t > 0.02) [-1, 1].forEach(sg => vline(P, sg * c.xf * ax.k, { color: Viz.alpha(muted, 0.8), dash: [2, 4] }));
    P.line(xs, scaled(R.init, cm), { color: Viz.alpha(muted, 0.55), width: 1.4 });
    P.line(xs, scaled(R.endE, cm), { color: text, width: 1.6, dash: [6, 4] });
    P.line(xs, scaled(c.e, cm), { color: Viz.alpha(orange, 0.4), width: 1 });
    P.line(xs, scaled(c.es, cm), { color: orange, width: 2.6 });
    if (c.M) P.line(xs, scaled(c.M.e, cm), { color: Viz.color('teal'), width: 1.6 });
    // the current along the step: circles with a cross (into the page, +y) or a dot (out of the page)
    const yb = P.px.y + P.px.h - 13;
    for (let m = -5; m <= 5; m++) {
      const k = NWIN / 2 + Math.round(m * 0.8 * NPL), vv = 0.5 * (c.v[k] + c.v[k - 1]) * d.sgn, r = clamp(Math.abs(vv) * 9, 0, 10); if (r < 2.2) continue;
      const X = P.X(m * 0.8 * ax.k);
      ctx.save(); ctx.strokeStyle = ctx.fillStyle = Viz.color('accent'); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(X, yb, r, 0, 2 * PI); ctx.stroke();
      if (vv > 0) { const q = r * 0.62; ctx.beginPath(); ctx.moveTo(X - q, yb - q); ctx.lineTo(X + q, yb + q); ctx.moveTo(X - q, yb + q); ctx.lineTo(X + q, yb - q); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(X, yb, Math.max(1.4, r * 0.28), 0, 2 * PI); ctx.fill(); }
      ctx.restore();
    }
    // the probe
    const pr = probe(s); vline(P, pr.xc * ax.k, { color: Viz.alpha(text, 0.45), width: 1 }); P.dot(pr.xc * ax.k, pr.eta * 100, 4, { color: orange, stroke: Viz.color('card'), strokeWidth: 1.5 });
  });
  if (!small) {
    if (d.rot) Viz.text(ctx, 'Λ', P.X((edges[edges.length - 1] + 0.5) * ax.k), P.px.y + (d.bump ? 50 : 10), { size: 12, weight: 700, color: Viz.color('teal'), align: 'center', baseline: 'middle', bg: true });
    const Xf = P.X(c.xf * ax.k);
    if (c.t > 0.05 && Xf < P.px.x + P.px.w - 34) Viz.text(ctx, 'c t →', Xf + 5, P.px.y + P.px.h * 0.5, { size: 12, color: muted, baseline: 'middle', bg: true });
    const leg = !roomy ? '' : d.rot ? (d.bump ? '⊗ current into the page (+y) · ⊙ out of it (−y)' : d.sd.sym + ' current along the step, ' + d.sd.page + ' (' + d.sd.jet + ')') : 'no current along the step: v = 0';
    if (leg) Viz.text(ctx, leg, P.px.x + 6, P.px.y + (d.bump && d.rot ? 30 : 10), { size: 12, color: Viz.color('accent'), baseline: 'middle', bg: true });
    if (v.w >= 760) Viz.text(ctx, 'click: probe a point · thin orange: raw march', P.px.x + P.px.w - 6, P.px.y + P.px.h - 12, { size: 12, color: muted, align: 'right', baseline: 'middle', bg: true });
  }
  if (d.bump && d.rot && v.w >= 380 && !tiny) Viz.text(ctx, 'dashed: ' + LABEL_CONV, P.px.x + 6, P.px.y + 10, { size: 12, color: text, baseline: 'middle', bg: true, maxWidth: P.px.w - 12 });
  if (g.app && g.app.holding) {
    const M = c.M;
    const lines = !d.rot ? ['everything radiated away: the surface is flat between the two fronts', 'released potential energy that stayed: 0']
      : d.bump ? ['waves gone: ' + pct(R.centre) + ' of the bump\'s height remains at its centre · jets of ' + f3(R.jetMax * d.V0) + ' m/s along its edges', 'KE kept / PE released = ' + f3(R.ratio) + ' (' + LABEL_CONV + ')']
        : ['waves gone: a front of width Λ = ' + km(d.Lam) + ' remains · jet ' + f3(d.V0) + ' m/s along ' + d.sd.jet, 'one third of the released energy stayed · mean over the last inertial period is ' + pct(M ? M.D.errE : NaN) + ' of η₀ from the prediction'];
    Viz.card(ctx, v.w / 2, P.px.y + (d.bump && d.rot ? 66 : 46), lines, { maxWidth: v.w - 12 });
  }
}

function drawJet(g, s) {
  const v = g.view('jet'); v.clear(); if (v.w < 60 || v.h < 60) { JETP = null; return; }
  const d = N(s), c = now(s), R = d.run, ctx = v.ctx, small = v.w < 340 || v.h < 150, tiny = v.h < 105, ax = xAxis(d);
  const mm = d.V0 < 0.05, vf = d.V0 * (mm ? 1000 : 100), ym = Math.max(1.3, R.vmax * 1.08), xs = scaled(R.xs, ax.k), muted = Viz.color('muted'), text = Viz.color('text'), accent = Viz.color('accent');
  const P = v.plot({ xlim: [-XV * ax.k, XV * ax.k], ylim: [-ym * vf, ym * vf], xlabel: tiny ? null : 'x across the step [' + ax.unit + ']', ylabel: 'velocity [' + (mm ? 'mm/s' : 'cm/s') + ']', pad: { l: 46, r: 10, t: 8, b: tiny ? 18 : 34 } }).axes();
  JETP = P;
  const sv = vf * (d.rot ? d.sgn : 1);
  P.clip(() => {
    if (d.rot && !d.bump) P.line([-XV * ax.k, XV * ax.k], [sv, sv], { color: Viz.alpha(accent, 0.55), width: 1, dash: [2, 4] });
    if (c.t > 0.02) [-1, 1].forEach(sg => vline(P, sg * c.xf * ax.k, { color: Viz.alpha(muted, 0.8), dash: [2, 4] }));
    P.line(xs, scaled(c.us, vf), { color: Viz.color('blue'), width: 1.5 });
    P.line(xs, scaled(R.endV, sv), { color: text, width: 1.6, dash: [6, 4] });
    P.line(xs, scaled(c.v, sv), { color: accent, width: 2.6 });
    if (c.M) P.line(xs, scaled(c.M.v, sv), { color: Viz.color('teal'), width: 1.6 });
    const pr = probe(s); vline(P, pr.xc * ax.k, { color: Viz.alpha(text, 0.45), width: 1 }); P.dot(pr.xc * ax.k, pr.v * (mm ? 1000 : 100), 4, { color: accent, stroke: Viz.color('card'), strokeWidth: 1.5 });
  });
  if (!small) {
    if (d.rot && !d.bump) Viz.text(ctx, 'gη₀/c', P.px.x + P.px.w - 6, P.Y(sv) + (d.sgn > 0 ? -10 : 10), { size: 12, color: accent, align: 'right', baseline: 'middle', bg: true });
    if (v.w >= 380) Viz.text(ctx, 'purple: v along the step · blue: u across it', P.px.x + 6, d.sgn < 0 ? P.px.y + 10 : P.px.y + P.px.h - 10, { size: 12, color: muted, baseline: 'middle', bg: true, maxWidth: P.px.w - 12 });
  }
}

function drawBudget(g, s) {
  const v = g.view('budget'); v.clear(); if (v.w < 60 || v.h < 60) return;
  const d = N(s), c = now(s), R = d.run, ctx = v.ctx, W = v.w, Hh = v.h, ax = xAxis(d), muted = Viz.color('muted'), text = Viz.color('text'), amber = Viz.color('amber');
  const barsH = clamp(Hh * 0.42, 78, 99), pvH = Hh - barsH - 4, compact = pvH < 64;
  if (pvH >= 40) {
    const ex = d.rot ? Math.floor(Math.log10(d.Q0)) : 0, qk = d.rot ? d.sgn * d.Q0 / Math.pow(10, ex) : 1, qa = Math.abs(qk) * 1.5 || 1;
    const P = v.plot({ rect: { x: 0, y: 0, w: W, h: pvH }, xlim: [-XV * ax.k, XV * ax.k], ylim: [-qa, qa], xlabel: null, ylabel: pvH < 90 ? null : 'ζ − fη/H', pad: { l: 46, r: 10, t: compact ? 4 : 8, b: compact ? 4 : 18 } }).axes({ xticks: compact ? [] : null, yticks: !d.rot || compact ? [0] : [-Number(Math.abs(qk).toPrecision(2)), 0, Number(Math.abs(qk).toPrecision(2))] });
    const xm = midpoints(scaled(R.xs, ax.k));
    P.clip(() => { P.line(xm, scaled(c.q0, qk), { color: Viz.alpha(muted, 0.55), width: 5 }); P.line(xm, scaled(c.q, qk), { color: amber, width: 1.8 }); });
    if (!compact) Viz.text(ctx, d.rot ? 'unit 10' + sup(ex) + ' 1/s' : 'f = 0: ζ − fη/H is ζ = 0, no memory', d.sgn > 0 ? P.px.x + P.px.w - 5 : P.px.x + 5, P.px.y + 10, { size: 12, color: d.rot ? amber : muted, align: d.sgn > 0 ? 'right' : 'left', baseline: 'middle', bg: true, maxWidth: P.px.w * (d.rot && !d.bump ? 0.5 : 1) - 10 });
  }
  // energy bars: now (filled) against the end state (tick)
  const y0 = Hh - barsH, rowH = barsH / 3, x0 = 8, x1 = W - 8, bw = x1 - x0;
  const rows = [['PE released', c.rel, R.relEndW, Viz.color('orange')], ['KE of the flow along the step', c.kev, R.keEndW, Viz.color('accent')], ['everything else: waves', Math.max(0, c.rest), R.relEndW - R.keEndW, muted]];
  const mx = Math.max(R.relMax, R.relEndW, 1e-9) * 1.04;
  rows.forEach((r, i) => {
    const y = y0 + i * rowH, by = y + rowH - 9, wv = clamp(r[1] / mx, 0, 1) * bw, Xt = x0 + clamp(r[2] / mx, 0, 1) * bw;
    Viz.text(ctx, W < 260 ? r[0].split(':')[0].replace(' of the flow along the step', ' along the step') : r[0], x0, y + rowH - 19, { size: 12, color: r[3], weight: 650, baseline: 'middle', halo: false, maxWidth: bw - 96 });
    Viz.text(ctx, f3(r[1] * d.E0) + ' J/m', x1, y + rowH - 19, { size: 12, color: text, align: 'right', baseline: 'middle', halo: false });
    ctx.save(); ctx.fillStyle = Viz.alpha(muted, 0.16); Viz.roundRect(ctx, x0, by, bw, 7, 3); ctx.fill();
    ctx.fillStyle = r[3]; Viz.roundRect(ctx, x0, by, Math.max(1, wv), 7, 3); ctx.fill();
    ctx.strokeStyle = text; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(Xt, by - 3); ctx.lineTo(Xt, by + 10); ctx.stroke(); ctx.restore();
  });
}

/* ---------- Explain ("Explanation & interpretation") ---------------------------------------------- */
function explainHtml(s) {
  const d = N(s), R = d.run, W = Viz.work, pr = probe(s), xa = Math.abs(pr.xc), ex = Math.exp(-xa);

  let o = W.step(0, 'What the views show') +
    W.say('This whole topic is ' + ours + ': the book writes the shallow-water equations and names the Rossby radius; what happens to a released step is our derivation D16, checked against our own time march.') +
    W.say('<b class="c-orange">Orange</b> = the surface now; grey = where it started; <b>dashed</b> = where the algebra says it ends; <b class="c-teal">teal line</b> = the mean over the last inertial period. <b class="c-accent">Purple</b> = the current along the step (circles: ⊗ into the page, ⊙ out of it); <b class="c-blue">blue</b> = the flow across it. <b class="c-amber">Amber</b> = the linear potential vorticity, which never changes.');
  o += W.step(1, 'The Rossby radius') +
    W.line(TX`$c=\sqrt{gH}=\sqrt{${t4(G)}\times${t4(d.H)}}$`, f3(d.c) + ' m/s', d.mode === 'ext' ? 'long waves on the whole 4200 m' : 'a layer of depth 1.33 m moves like our first baroclinic mode');
  if (d.rot) {
    o += W.line(TX`$f=2\Omega\sin\theta$ (13.8) $=2\times7.292\times10^{-5}\times\sin(${sgnLat(d)}^\circ)$`, f3(d.f) + ' 1/s', d.f < 0 ? 'negative: southern hemisphere' : 'positive: northern hemisphere') +
      W.box(TX`$\Lambda\equiv\dfrac{c}{|f|}=\dfrac{${t3(d.c)}}{${t3(Math.abs(d.f))}}=\mathbf{${tkm(d.Lam)}}$ km (ours as a tool here; the book only names it): the distance a long wave travels in the time $1/|f|$`) +
      W.line(TX`inertial period $T_i=\dfrac{2\pi}{|f|}$`, Viz.fmtTime(d.Ti), 'the clock of the run: the slider counts these');
  } else {
    o += W.line(TX`$f=2\Omega\sin\theta$ (13.8) at $\theta=0$`, '0', 'no Coriolis force on horizontal motion at the equator') +
      W.box(TX`With $f=0$ the radius $\Lambda=c/|f|$ is infinite. The axes borrow the scales of 35°: $\Lambda_{35}=${tkm(d.Lam)}$ km and $T_{35}=$ ${Viz.fmtTime(d.Ti)}.`);
  }
  o += W.step(2, 'What cannot change') +
    W.say(TX`From the linear shallow-water set $\dfrac{\partial\eta}{\partial t}+H\Big(\dfrac{\partial u}{\partial x}+\dfrac{\partial v}{\partial y}\Big)=0$, $\dfrac{\partial u}{\partial t}-fv=-g\dfrac{\partial\eta}{\partial x}$, $\dfrac{\partial v}{\partial t}+fu=-g\dfrac{\partial\eta}{\partial y}$ (13.45) with nothing depending on $y$ (ours):`) +
    W.box(TX`$\dfrac{\partial}{\partial t}\Big(\textcolor{${C_Q}}{\zeta-\dfrac{f\eta}{H}}\Big)=0$ at every $x$, with $\zeta=\partial v/\partial x$: each column remembers the height it started with`) +
    (d.rot ? W.line(TX`its size where $\eta=\eta_0$: $\dfrac{|f|\eta_0}{H}=\dfrac{${t3(Math.abs(d.f))}\times${t3(ETA0)}}{${t4(d.H)}}$`, f3(d.Q0) + ' 1/s') +
      W.line('largest change anywhere during the march', Viz.fmt(R.pvDrift * d.Q0, { sig: 2, keepTiny: true }) + ' 1/s', 'round-off: the scheme keeps it exactly')
      : W.say('Here $f=0$, so the conserved quantity is only $\\zeta=0$: it holds no memory of $\\eta$, and nothing pins a slope.'));
  o += W.step(3, 'The end state of the surface');
  if (!d.rot) o += W.say('Without rotation the only steady state is a flat surface, $\\eta=0$ between the fronts.');
  else if (!d.bump) o += W.say(TX`Conservation plus a steady balance $fv=g\,\partial\eta/\partial x$ give (ours, D16) $\eta_\infty=\eta_0\,\mathrm{sgn}(x)\big(1-e^{-|x|/\Lambda}\big)$.`) +
    W.line(TX`at the probe, $x=${t3(pr.xc)}\,\Lambda=${tkm(pr.x)}$ km: $${t3(ETA0)}\times(${pr.xc < 0 ? '-1' : '1'})\times(1-e^{-${t3(xa)}})$`, f3(pr.endE) + ' m', 'click a view to move the probe') +
    W.box(TX`The step is smoothed over a few $\Lambda$, not removed: at $|x|=\Lambda$ the surface has reached $1-e^{-1}=${t3(1 - Math.exp(-1))}$ of $\eta_0$.`);

    W.line(TX`at the probe, $x=${t3(pr.xc)}\,\Lambda$`, f3(pr.endE) + ' m', LABEL_CONV) +

    W.box('The jet runs along <b>' + d.sd.jet + '</b> (' + d.sd.page + ', ' + d.sd.sym + '), with the high side on its <b>' + d.sd.turns + '</b>: ' + d.sd.name + ' hemisphere. Flip the hemisphere and it reverses.');

    W.box('Two opposite jets, up to ' + f3(R.jetMax * d.V0) + ' m/s, circle the high with the high on their <b>' + d.sd.turns + '</b> (' + d.sd.name + ' hemisphere).');

    W.say('The orange curve is our forward–backward march of the three equations on ' + NCELL + ' cells of $\\Lambda/' + NPL + '$ (the Python function <code>linear_1d_run</code>; the parity rows compare the two). The bold curve is drawn after a light three-point smoothing that removes ripples a few cells long; the thin orange line is the raw march, and every number here uses the raw fields.');
  if (d.rot) {
    const cur = now(s).t, rows = [1, 3, 5, 6].map(p => { const q = offAt(R, p); return [p + ' ' + tUnit(d), pct(q.inst), pct(q.mean), pct(q.instV), pct(q.meanV)]; });
    o += W.table(['after', 'η now', 'η mean', 'v now', 'v mean'], rows, cur >= 5.5 ? 3 : cur >= 4 ? 2 : cur >= 2 ? 1 : cur >= 0.5 ? 0 : -1) +

  o += W.step(7, 'At the current time') +
    W.line('$t$', Viz.live('t') + ' ' + (d.rot ? 'inertial periods' : 'periods of 35°') + ' = ' + Viz.live('th')) +
    W.line(TX`slope force across the edge, $\textcolor{${C_P}}{-g\,\partial\eta/\partial x}$`, Viz.live('pgf') + ' m/s²', 'averaged over ±Λ/2 about the ' + (d.bump ? 'right-hand edge' : 'step')) +

    W.line('<b class="c-orange">released</b> = <b class="c-accent">along-step KE</b> + everything else', Viz.live('bud') + ' J/m') +
    W.interpret(readingOf(s), 'Reading the current setting');
  return o;
}

  notes: s => '<p>' + readingOf(s) + '</p>',
  stage: {
    rows: [1.15, 1],
    views: [
      { id: 'eta', row: 0, flex: 1, title: s => { const d = N(s), c = now(s), tt = 't = ' + c.t.toFixed(2) + ' ' + tUnit(d);
        if (short()) return '<b>Surface η</b> · ' + tt + (d.rot ? ' · <b class="c-orange">' + pct(c.D.errE) + '</b> off' : '');
        return '<b>Surface height η(x, t)</b> · ' + tt + ' = ' + Viz.fmtTime(c.t * d.Ti) + (d.rot ? ' · <b class="c-orange">now ' + pct(c.D.errE) + '</b> of η₀ off the dashed end state' + (c.M ? ' · <b class="c-teal">period mean ' + pct(c.M.D.errE) + '</b>' : '') : ' · no rotation: the dashed end state is a flat surface'); } },
      { id: 'jet', row: 1, flex: 1, title: s => { const d = N(s), R = d.run;
        if (short()) return '<b>Current v</b> · kept/released <b class="c-accent">' + f2(R.ratio) + '</b>';
        return '<b>Current along the step v(x, t)</b> · ' + (d.rot ? 'jet max <b class="c-accent">' + f3(R.jetMax * d.V0) + ' m/s</b> · kept / released = <b>' + f3(R.ratio) + '</b>' : 'no jet: v = 0 · kept / released = <b>0</b>'); } },
      { id: 'budget', row: 1, flex: 0.8, hidePortrait: true, title: s => { const d = N(s); return '<b>Potential vorticity</b> ' + (d.rot ? '<b class="c-amber">now</b> on grey · moved ' + Viz.fmt(d.run.pvDrift * d.Q0, { sig: 1, keepTiny: true }) + ' 1/s' : '· nothing is pinned') + ' · <b>energy</b>'; } }
    ],
    draw(g, s) { drawEta(g, s); drawJet(g, s); drawBudget(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const P = ev.viewId === 'eta' ? ETAP : ev.viewId === 'jet' ? JETP : null; if (!P) return false;
      const drag = ev.type === 'pointerdown' || (ev.type === 'pointermove' && v.pointer.down);
      if (!drag || !P.inside(v.pointer.x, v.pointer.y)) return false;
      const k = xAxis(N(s)).k, x = clamp(Math.round(P.ix(v.pointer.x) / k * 20) / 20, -XV + 0.05, XV - 0.05);
      g.app.set('px', x); return true;
    }
  },
  explore: {
    intro: 'Press ▶ to release the water. Click a view to move the probe.',
    controls: ['lat', 'hemi', 'mode', 'shape', 'px'],
    readouts: ['Lam', 'jet', 'ratio', 'bal', 'Ti', 'off', 'offm', 'pv'],
    callouts: [{ kind: 'try', html: 'Play "no rotation", then "mid-latitude, baroclinic", and compare the end cards. Then halve $f$ (latitude 16.7°): the front doubles in width.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
</script>
</body>
