  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }

.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }

.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }

      P.dot(xk, y, j === n.i ? 5 : 4, { color: j === 1 ? amber : (j === 0 ? Viz.alpha(acc, 0.6) : acc), stroke: Viz.color('card'), strokeWidth: 1.5 });
    });
    const ys = n.w !== 0 ? Math.log10(Math.abs(n.w)) : NaN;
    if (n.w === 0) { arrow2(ctx, [Xk, px.y + px.h - 30], [Xk, px.y + px.h - 3], amber, 2.4, 8); lab('ω = 0', Xk + (right ? 8 : -8), px.y + px.h - 26, { align: right ? 'left' : 'right', color: amber, weight: 650, bg: true }); }
    else if (ys > YMAX) lab('above the frame ↑', Xk + (right ? 8 : -8), px.y + 12, { align: right ? 'left' : 'right', color: n.i === 1 ? amber : acc, weight: 650, bg: true });
    else if (ys < YMIN) lab('below the frame ↓', Xk + (right ? 8 : -8), px.y + px.h - 12, { align: right ? 'left' : 'right', color: n.i === 1 ? amber : acc, weight: 650, bg: true });
    else if (!tiny) lab(fT(n.period), Xk + (right ? 13 : -13), Viz.clamp(Y(ys) + (n.i === 0 ? 12 : -12), px.y + 9, px.y + px.h - 9), { align: right ? 'left' : 'right', color: n.i === 1 ? amber : acc, weight: 650, bg: true });

}

/** the four terms of the cubic for the selected root, as signed bars on a logarithmic scale */
const DEC = 6;
function drawTerms(v, s, n) {
  v.clear();
  const ctx = v.ctx, W = v.w, Hh = v.h; if (W < 60 || Hh < 50) return;
  const mut = Viz.color('muted'), axis = Viz.color('axis'), soft = Viz.color('text-soft');
  if (!n.ok) { Viz.card(ctx, W / 2, Hh / 2, ['no three real roots here', 'the β-plane is stretched too far'], { color: mut, maxWidth: W - 12 }); return; }
  const vals = termVals(n.T), vmax = n.vmax;
  if (!(vmax > 0)) { Viz.card(ctx, W / 2, Hh / 2, ['zero frequency: all four terms vanish', 'a steady geostrophic flow'], { color: Viz.color('amber'), maxWidth: W - 12 }); return; }
  // narrow views (the short landscape frame): label and value on one line, the bar under it
  const cols = termCols(), axisH = Hh >= 118 ? 32 : 17, sumH = Hh >= 150 ? 20 : 0, top = 3, rowH = (Hh - top - axisH - sumH) / 4;
  const stack = W < 250 && rowH >= 28, labW = stack ? 8 : (W < 230 ? 58 : 68);
  const x0 = labW, x1 = W - 8, xc = 0.5 * (x0 + x1), hw = 0.5 * (x1 - x0), bh = stack ? Viz.clamp(rowH * 0.3, 5, 12) : Viz.clamp(rowH * 0.62, 7, 22);
  const frac = a => (a > 0 ? Viz.clamp(1 + Math.log10(a / vmax) / DEC, 0, 1) : 0), yb = top + 4 * rowH;
  const lab = (str, x, y, o) => Viz.text(ctx, str, x, y, Object.assign({ size: 12, weight: 500, color: mut, halo: false }, o || {}));
  // decade grid and its labels: the share of the largest term
  const decs = hw >= 96 ? [0, 2, 4] : (hw >= 72 ? [0, 3] : [0]);
  ctx.save(); ctx.strokeStyle = Viz.color('grid'); ctx.lineWidth = 1; ctx.beginPath();
  decs.forEach(d => [-1, 1].forEach(sg => { const xx = Math.round(xc + sg * hw * (1 - d / DEC)) + 0.5; ctx.moveTo(xx, top); ctx.lineTo(xx, yb); }));
  ctx.stroke(); ctx.strokeStyle = Viz.alpha(axis, 0.8); ctx.beginPath(); ctx.moveTo(Math.round(xc) + 0.5, top); ctx.lineTo(Math.round(xc) + 0.5, yb + 3); ctx.stroke(); ctx.restore();
  decs.forEach(d => [-1, 1].forEach(sg => { const xx = xc + sg * hw * (1 - d / DEC); lab(d === 0 ? (sg < 0 ? '−1' : '+1') : pow10(-d), xx, yb + 3, { align: d === 0 ? (sg < 0 ? 'left' : 'right') : 'center', baseline: 'top', color: axis }); }));
  if (axisH > 20) lab(W >= 300 ? 'share of the largest term, log scale' : '÷ largest (log scale)', W / 2, yb + 17, { align: 'center', baseline: 'top', color: soft });
  else if (decs.length === 1) lab('log scale', xc, yb + 3, { align: 'center', baseline: 'top', color: soft });
  vals.forEach((val, j) => {
    const ym = top + rowH * (j + 0.5), yc = stack ? ym + rowH * 0.24 : ym, L = hw * frac(Math.abs(val)), sg = val < 0 ? -1 : 1;
    if (stack) {
      const lw = lab(TERM_LAB[j], x0, ym - rowH * 0.2, { color: cols[j], weight: 650 });
      ctx.save(); ctx.font = Viz.font(12, 600);
      const cand = [(val > 0 ? '+' : '') + f2(val), (val > 0 ? '+' : '') + Viz.fmt(val, { sig: 1, keepTiny: true })].filter(c => ctx.measureText(c).width + lw + 8 <= x1 - x0);
      ctx.restore();
      if (cand.length) lab(cand[0], x1, ym - rowH * 0.2, { align: 'right', color: soft, weight: 600 });
    }
    else lab(TERM_LAB[j], labW - 6, yc, { align: 'right', color: cols[j], weight: 650 });
    ctx.save(); ctx.fillStyle = Viz.alpha(cols[j], j === n.small ? 0.55 : 0.9);
    if (L >= 1.5) ctx.fillRect(sg > 0 ? xc : xc - L, yc - bh / 2, L, bh); else ctx.fillRect(xc - 1.5, yc - bh / 2, 3, bh);
    ctx.restore();
    let str = (val > 0 ? '+' : '') + f3(val);
    ctx.save(); ctx.font = Viz.font(12, 600); let tw = ctx.measureText(str).width;
    if (tw > hw - 8) { str = (val > 0 ? '+' : '') + f2(val); tw = ctx.measureText(str).width; }
    const tag = j === n.small ? ' · smallest' : (j === n.big ? ' · largest' : '');
    if (tag && tw + ctx.measureText(tag).width < hw - 8) str += tag;
    ctx.restore();
    if (!stack && tw <= hw - 2) lab(str, sg > 0 ? xc - 6 : xc + 6, yc, { align: sg > 0 ? 'right' : 'left', color: soft, weight: 600 });
  });
  if (sumH) {
    const rel = Math.abs(n.T.sum) / vmax;
    lab(W >= 330 ? 'sum of the four = 0' + (rel > 0 ? ' (round-off ' + Viz.fmt(rel, { sig: 1, keepTiny: true }) + ' of the largest)' : ' exactly') : 'sum of the four = 0', W / 2, Hh - 3, { align: 'center', baseline: 'bottom', color: soft, weight: 600 });
  }
}

/** the selected wave seen from above: crests moving, one parcel and its orbit */
function drawPlan(v, s, n) {
  v.clear();
  const ctx = v.ctx, W = v.w, Hh = v.h; if (W < 60 || Hh < 60) return;
  const mut = Viz.color('muted'), soft = Viz.color('text-soft'), blue = Viz.color('blue'), orange = Viz.color('orange');
  if (!n.ok) { Viz.card(ctx, W / 2, Hh / 2, ['no three real roots here', 'the β-plane is stretched too far: no wave to draw'], { color: mut, maxWidth: W - 12 }); return; }
  const col = n.i === 1 ? Viz.color('amber') : Viz.color('accent');
  const two = W >= 520, bw = two ? Math.round(W * 0.62) : W, box = { x: 3, y: 3, w: bw - 6, h: Hh - 6 };
  const pxl = Viz.clamp(box.w / 3, 60, 320), ln = s.ln || 0, sg = Math.sign(n.w), t = s.t || 0;
  const ymax = box.h / pxl, qmax = box.w / pxl + ln * ymax, M = 20;
  const Xq = (q, yp) => box.x + (q - ln * yp) * pxl;                     // screen x of the phase line q at the height yp (in wavelengths)
  ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip();
  ctx.fillStyle = Viz.alpha(blue, 0.04); ctx.fillRect(box.x, box.y, box.w, box.h);
  const shift = sg * t, m0 = Math.floor(-shift) - 1, m1 = Math.ceil(qmax - shift) + 1;
  for (let m = m0; m <= m1; m++) {
    for (let j = 0; j < M; j++) {
      const qa = m + j / M + shift - 0.5 / M, qb = qa + 1 / M + 0.002, a = 0.5 + 0.5 * Math.cos(2 * PI * j / M);
      if (qb < 0 || qa > qmax) continue;
      ctx.fillStyle = Viz.alpha(blue, 0.02 + 0.34 * a * a);
      ctx.beginPath(); ctx.moveTo(Xq(qa, 0), box.y + box.h); ctx.lineTo(Xq(qb, 0), box.y + box.h); ctx.lineTo(Xq(qb, ymax), box.y); ctx.lineTo(Xq(qa, ymax), box.y); ctx.closePath(); ctx.fill();
    }
    const qc = m + shift; ctx.strokeStyle = Viz.alpha(blue, 0.75); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(Xq(qc, 0), box.y + box.h); ctx.lineTo(Xq(qc, ymax), box.y); ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.strokeStyle = Viz.color('border'); ctx.lineWidth = 1; ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1); ctx.restore();
  const lab = (str, x, y, o) => Viz.text(ctx, str, x, y, Object.assign({ size: 12, weight: 600, color: soft, bg: true }, o || {}));
  // the parcel: displacement and velocity from (13.80), drawn large
  const a = n.amp, yp0 = 0.5 * ymax, q0 = 1.3, ph = 2 * PI * (q0 - shift);
  const cx = Xq(q0, yp0), cy = box.y + box.h / 2, cph = Math.cos(ph), sph = Math.sin(ph);
  const vel = p => [a[0][0] * Math.cos(p) - a[0][1] * Math.sin(p), a[1][0] * Math.cos(p) - a[1][1] * Math.sin(p)];
  const vmaxv = Math.max(Math.hypot(a[0][0], a[1][0]), Math.hypot(a[0][1], a[1][1])) || 1;
  // displacement = velocity / (-i w): X^ = i u^/w
  const dsp = p => (n.w !== 0 ? [(-a[0][1] * Math.cos(p) - a[0][0] * Math.sin(p)) / n.w, (-a[1][1] * Math.cos(p) - a[1][0] * Math.sin(p)) / n.w] : [0, 0]);
  const dmax = n.w !== 0 ? vmaxv / Math.abs(n.w) : 1;
  const drawOrbit = (ox, oy, Rr, big) => {
    const V = vel(ph), D = dsp(ph), pxy = [ox + D[0] / dmax * Rr, oy - D[1] / dmax * Rr];
    if (n.w !== 0) {
      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = big ? 2.2 : 1.6; ctx.beginPath();
      for (let j = 0; j <= 72; j++) { const d = dsp(2 * PI * j / 72), xx = ox + d[0] / dmax * Rr, yy = oy - d[1] / dmax * Rr; if (j) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy); }
      ctx.stroke(); ctx.restore();
    }
    const al = (big ? 0.62 : 0.9) * Rr;
    arrow2(ctx, pxy, [pxy[0] + V[0] / vmaxv * al, pxy[1] - V[1] / vmaxv * al], orange, big ? 2.6 : 2, big ? 9 : 7);
    ctx.save(); ctx.fillStyle = orange; ctx.strokeStyle = Viz.color('card'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pxy[0], pxy[1], big ? 5 : 4, 0, 2 * PI); ctx.fill(); ctx.stroke(); ctx.restore();
  };
  drawOrbit(cx, cy, Math.min(26, box.h * 0.2), false);
  // which way the crests and the energy go
  if (box.h >= 110) {
    const row = (y, d, color, text) => { const L = 15, o = [box.x + 24, y]; if (d) arrow2(ctx, [o[0] - d[0] * L, o[1] + d[1] * L], [o[0] + d[0] * L, o[1] - d[1] * L], color, 2.4, 8); else { ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(o[0], o[1], 3.5, 0, 2 * PI); ctx.fill(); ctx.restore(); } lab(text, box.x + 46, y, { color }); };
    row(box.y + 15, sg !== 0 ? [sg * n.k / n.K, sg * n.l / n.K] : null, col, sg !== 0 ? 'crests ' + f3(n.cK) + ' m/s ' + compass(sg * n.k, sg * n.l) : 'crests at rest');
    row(box.y + 37, n.cgm > 0 ? [n.cg[0] / n.cgm, n.cg[1] / n.cgm] : null, Viz.color('text'), n.cgm > 0 ? 'energy (ours) ' + f3(n.cgm) + ' m/s ' + compass(n.cg[0], n.cg[1]) : 'energy (ours) at rest');
    // one wavelength as a scale bar
    const xa = Math.max(box.x + 8, box.x + box.w - pxl - 14), yb = box.y + box.h - 10;
    ctx.save(); ctx.strokeStyle = soft; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(xa, yb - 4); ctx.lineTo(xa, yb + 4); ctx.moveTo(xa, yb); ctx.lineTo(xa + pxl, yb); ctx.moveTo(xa + pxl, yb - 4); ctx.lineTo(xa + pxl, yb + 4); ctx.stroke(); ctx.restore();
    lab(fmtKm(s.lam) + (ln ? ' along x' : ''), xa + pxl / 2, yb - 12, { align: 'center' });
    lab('N ↑', box.x + box.w - 6, box.y + 13, { align: 'right', color: mut });
  }
  if (two) {
    const pw = W - bw, ox = bw + pw / 2, lines = pw >= 250 && Hh >= 150 ? 2 : 1, textH = 18 * lines + 22, oy = 22 + (Hh - textH - 4) / 2;
    const Rr = Math.max(14, Math.min(pw * 0.36, (Hh - textH - 12) * 0.44));
    lab('the parcel, magnified', ox, 11, { align: 'center', bg: false, color: soft });
    ctx.save(); ctx.strokeStyle = Viz.alpha(mut, 0.45); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ox - Rr - 8, oy); ctx.lineTo(ox + Rr + 8, oy); ctx.moveTo(ox, oy - Rr - 6); ctx.lineTo(ox, oy + Rr + 6); ctx.stroke(); ctx.restore();
    lab('E', ox + Rr + 14, oy, { align: 'center', bg: false, color: mut, weight: 500 }); lab('N', ox, oy - Rr - 10, { align: 'center', bg: false, color: mut, weight: 500 });
    drawOrbit(ox, oy, Rr, true);
    const yT = Hh - 18 * lines + 4;
    if (n.w === 0) { lab('a steady current along the crests (ω = 0)', ox, yT, { align: 'center', bg: false, color: col, maxWidth: pw - 8 }); if (lines > 1) lab('no orbit, no propagation', ox, yT + 18, { align: 'center', bg: false, weight: 500, maxWidth: pw - 8 }); }
    else {
      const fastLike = n.ratio >= 1;
      lab((n.turn < 0 ? '↻ ' : '↺ ') + senseWord(n.turn) + ' · axes ' + f3(fastLike ? n.ratio : 1 / n.ratio) + ' : 1', ox, yT, { align: 'center', bg: false, color: col, maxWidth: pw - 8 });
      if (lines > 1) lab(fastLike ? '= |ω/f₀| · long axis along the travel' : '= |f₀/ω| · long axis along the crests', ox, yT + 18, { align: 'center', bg: false, weight: 500, maxWidth: pw - 8 });
    }
  }
}

/* ---- text ------------------------------------------------------------------------------------------------------------ */
function statusOf(s) {
  const n = N(s), lay = layout();
  const land = lay === 'landscape';
  if (!n.ok) return { text: lay === 'wide' ? '⚠️ no three real roots at this wavelength (discriminant below zero): shorten the wave or move poleward' : (land ? '⚠️ no three real roots here' : '⚠️ no three real roots here: shorten the wave or move poleward'), tone: 'warn' };
  const rat = '|ω| = ' + f3(n.ratio) + ' |f₀|';
  if (n.i === 1) {
    if (n.w === 0) return { text: land ? '🧊 β = 0: slow root ω = 0, steady' : '🧊 with β = 0 the slow root is ω = 0, a steady geostrophic flow', tone: 'info' };
    const sm = Math.abs(n.T.omega3) / n.vmax, rel = n.ratio < 0.3 ? ' ≪ |f₀|' : ' < |f₀|';
    if (lay !== 'wide') return { text: '🐢 slow root: ' + rat + (land ? ' · needs β' : ' · only because of β'), tone: 'good' };
    return { text: '🐢 slow root: |ω| = ' + f3(n.ratio) + ' |f₀|' + rel + ' — the ω³ term is ' + Viz.fmt(sm, { sig: 2, keepTiny: true }) + ' of the largest; this wave exists only because of β', tone: 'good' };
  }
  const bt = Math.abs(n.T.beta) / n.vmax, btxt = n.beta === 0 ? 'β is off' : 'the β term is ' + Viz.fmt(bt, { sig: 2, keepTiny: true }) + ' of the largest';
  if (n.ratio < 1.05) return { text: lay === 'wide' ? '🌀 near-inertial: ' + rat + ' — the water circles, the surface hardly moves; ' + btxt : '🌀 near-inertial: ' + rat + (land ? '' : ' · the water circles'), tone: 'info' };
  if (n.reg.regime === 'high') return { text: lay === 'wide' ? '🌊 fast root: ' + rat + ' — a gravity wave that hardly feels rotation; ' + btxt : '🌊 fast root: ' + rat + (land ? ' · gravity' : ' · hardly feels rotation'), tone: 'info' };
  return { text: lay === 'wide' ? '🌊 fast root: ' + rat + ' — a gravity wave bent by rotation; ' + btxt : '🌊 fast root: ' + rat + (land ? ' · bent by f' : ' · bent by rotation'), tone: 'info' };
}

function readingText(s) {
  const n = N(s), out = [];
  if (!n.ok) {
    out.push(R`The discriminant is negative: the cubic has one real root and a complex pair. That is not a new kind of wave. It only says that $f$ can no longer be frozen at $f_0$ over a wave this long at ` + s.lat + R`°, where $\beta c/f_0^2=` + t3(n.bcf) + R`\ge1$. Nothing is plotted in the grey band; shorten the wave, move poleward or switch to the baroclinic mode.`);
    return out.join(' ');
  }
  if (n.i === 1) {
    if (n.w === 0) out.push(R`Without $\beta$ the slow root sits at $\omega=0$: a steady geostrophic flow that neither propagates nor decays, which is what geostrophic adjustment leaves behind. Switch $\beta$ back on and this motionless pattern starts to drift west.`);
    else {
      out.push('The <b class="c-amber">slow root</b> is ' + f3(1 / n.slowfast) + ' times slower than the fast pair: one period takes ' + fT(n.period) + R`. With $|\omega|=` + t3(n.ratio) + R`\,|f_0|` + (n.ratio < 0.3 ? R`\ll|f_0|` : R`<|f_0|`) + R`$ the $\omega^3$ bar is ` + Viz.fmt(Math.abs(n.T.omega3) / n.vmax, { sig: 2, keepTiny: true }) + R` of the largest: drop it and what remains is the Rossby wave, $\omega=-\dfrac{\beta k}{k^2+l^2+f_0^2/c^2}$ (13.118).`);
      out.push(n.KLam < 1 ? R`This wave is longer than $2\pi\Lambda=` + t3(2 * PI * n.Lam / 1e3) + R`$ km ($K\Lambda=` + t3(n.KLam) + R`<1$): crests and energy both go west (energy speed: ours — not in the book).` : R`This wave is shorter than $2\pi\Lambda=` + t3(2 * PI * n.Lam / 1e3) + R`$ km ($K\Lambda=` + t3(n.KLam) + R`>1$): the crests go west` + (n.cg[0] > 0 ? ' while the energy goes east (energy speed: ours — not in the book).' : '.'));
    }
  } else {
    if (n.ratio < 1.05) out.push(R`Near the inertial limit, $|\omega|=` + t3(n.ratio) + R`\,|f_0|$: the wave is so long ($K\Lambda=` + t3(n.KLam) + R`$) that gravity hardly acts. The water moves in near-circles once every ` + fT(n.period) + ' and the surface hardly moves.' + (n.ratio < 1 ? R` The ratio is even a little below 1: $\beta$ splits the fast pair, and the westward root dips under $|f_0|$.` : ''));
    else if (n.reg.regime === 'high') out.push(R`A gravity wave that hardly notices rotation ($|\omega|>3|f_0|$, our threshold): $|\omega|=` + t3(Math.abs(n.w)) + R`$ 1/s against $cK=` + t3(n.c * n.K) + R`$ 1/s, ` + f2(100 * Math.abs(Math.abs(n.w) / (n.c * n.K) - 1)) + ' % apart. The <b class="c-accent">ω³</b> and <b class="c-orange">gravity</b> bars carry the balance.');
    else out.push(R`Rotation matters here ($|f_0|\le|\omega|\le3|f_0|$): the <b class="c-teal">rotation</b> bar is ` + f2(100 * Math.abs(n.T.rotation) / n.vmax) + R` % of the largest, the frequency cannot fall below about $|f_0|$, and the current traces an ellipse with axis ratio $|\omega/f_0|=` + t3(n.ratio) + '$.');
    out.push(n.beta === 0 ? R`With $\beta=0$ the two fast roots are exactly $\pm\sqrt{f_0^2+c^2K^2}$.` : 'The <b class="c-amber">β</b> bar is ' + Viz.fmt(Math.abs(n.T.beta) / n.vmax, { sig: 2, keepTiny: true }) + ' of the largest: a fast wave is over before the planet’s curvature can act.');
  }
  if (s.mode === 'bc') out.push(R`First baroclinic mode: $c=` + t3(n.c) + R`$ m/s gives a Rossby radius of only ` + f3(n.Lam / 1e3) + ' km, so the same wavelength is far “longer” in units of Λ than for the external mode.');
  if (n.f0 < 0) out.push(R`Southern hemisphere: the cubic contains only $f_0^2$, so no frequency changes; the parcel turns ` + senseWord(n.turn) + ' instead.');
  return out.join(' ');
}

function inspectHtml(s) {
  const n = N(s);
  if (!n.ok) return 'At $\\lambda=' + t3(s.lam) + R`$ km the discriminant is negative ($\Delta/4P^3=` + t3(n.Dn) + '$): ' + NOROOT + '.';
  const v = termVals(n.T);
  return 'At $\\lambda=' + t3(s.lam) + R`$ km, ` + ROOT_NAME[n.i] + R` root $\omega=` + t3(n.w) + R`$ 1/s:<br>` +
    v.map((x, j) => '<span class="' + TERM_CLS[j] + '">$' + TERM_TEX[j] + '=' + t3(x) + '$</span>').join('<br>') +
    R`<br>sum $=\mathbf{0}$ 1/s³ (round-off ` + Viz.fmt(Math.abs(n.T.sum) / (n.vmax || 1), { sig: 1, keepTiny: true }) + ' of the largest)';
}

const CUBIC = R`\omega^3-c^2\omega K^2-f_0^2\omega-c^2\beta k=0`;
const EQ82 = R`\omega^2=f^2+gHK^2`;
const EQ118 = R`\omega=-\dfrac{\beta k}{k^2+l^2+f_0^2/c^2}`;
const EQ75 = R`\dfrac{\partial^3v}{\partial t^3}-gH\dfrac{\partial}{\partial t}\nabla_H^2v+f_0^2\dfrac{\partial v}{\partial t}-gH\beta\dfrac{\partial v}{\partial x}=0`;

function slipHtml(s, n) {
  const k = n.k, l = n.l, T2 = n.Tall[2], T1 = n.Tall[1], r2 = Math.abs(n.roots[2]) / n.fa, r1 = Math.abs(n.roots[1]) / n.fa;
  const rank = T => { const a = termVals(T).map(Math.abs), w3 = a[0]; return a.filter(x => x > w3).length; };   // how many terms are larger than w^3
  const word = r => ['the largest', 'the second largest', 'the third largest', 'the smallest'][r];
  const btn = s.claim === 'printed'

function explainLive(s) {
  const n = N(s), t = s.t || 0;
  if (!n.ok || n.w === 0) return { tp: t.toFixed(2), treal: '—', uu: '—', vv: '—' };
  const a = n.amp, ph = 2 * PI * (1.3 - Math.sign(n.w) * t), vm = Math.max(Math.hypot(a[0][0], a[1][0]), Math.hypot(a[0][1], a[1][1])) || 1;
  const u = (a[0][0] * Math.cos(ph) - a[0][1] * Math.sin(ph)) / vm, vv = (a[1][0] * Math.cos(ph) - a[1][1] * Math.sin(ph)) / vm;
  const mn = x => x.toFixed(2).replace('-', '−');
  return { tp: t.toFixed(2), treal: fT(t * n.period), uu: mn(u), vv: mn(vv) };
}

    { name: 'no roots there: JS null <-> Python NaN flag', js: cubicRoots(k20, 0, 202.95, f12, b12) === null ? 1 : 0, py: '1.0*np.isnan(ch13.shallow_water_omega(' + K20 + ', 0.0, 202.95, ' + F12 + ', ' + B12 + ')[1])', rtol: 0, atol: 0 },

    { name: 'kelvin', js: kelvin(k, 202.95), py: 'ch13.kelvin_omega(' + KS + ', 202.95)', rtol: 1e-13 },
    { name: 'rossby: -beta k/(K^2 + f0^2/c^2)', js: rossby(k, 0, b35, f35, 202.95), py: 'ch13.rossby_omega(' + KS + ', 0.0, ' + B + ', ' + F + ', 202.95)', rtol: 1e-12 },
    { name: 'rossby formula, l = 1.5 k, 35 S', js: rossby(k7, 1.5 * k7, b35, f35S, 3.6096), py: 'ch13.rossby_omega(' + K7 + ', 1.5*' + K7 + ', ' + B + ', ' + FS + ', 3.6096)', rtol: 1e-12 },
    { name: 'Rossby radius (35 S)', js: rossbyRadius(202.95, f35S), py: 'ch13.rossby_radius(202.95, ' + FS + ')', rtol: 1e-13 },
    { name: 'regime ratio', js: regime(4.0e-4, f35).ratio, py: 'ch13.shallow_water_regime(4.0e-4, ' + F + ')["ratio"]', rtol: 1e-12 },
    reg(4.0e-4, 'high'), reg(1.0e-4, 'near-inertial'), reg(1.0e-6, 'low'),
    { name: 'orbit u (N)', js: ob.u, py: OB + '["u"]', rtol: 1e-10 },
    { name: 'orbit v (N)', js: ob.v, py: OB + '["v"]', rtol: 1e-10 },
    { name: 'axis ratio S', js: obS.axis_ratio, py: OBS + '["axis_ratio"]', rtol: 1e-10 },
    { name: 'orbit sense words N / S', js: (ob.sense === 'clockwise' && obS.sense === 'counter-clockwise') ? 1 : 0, py: '1.0 if (' + OB + '["sense"] == "clockwise" and ' + OBS + '["sense"] == "counter-clockwise") else 0.0', rtol: 0, atol: 0 },
    { name: 'amplitude Re u^', js: am[0][0], py: 'np.real(' + AM + '[0])', rtol: 1e-12 },
    { name: 'amplitude Im u^', js: am[0][1], py: 'np.imag(' + AM + '[0])', rtol: 1e-12 },
    { name: 'amplitude Re v^', js: am[1][0], py: 'np.real(' + AM + '[1])', rtol: 1e-12 },
    { name: 'amplitude Im v^', js: am[1][1], py: 'np.imag(' + AM + '[1])', rtol: 1e-12 },
    { name: 'group velocity x, beta = 0, fast + root', js: gv0[0], py: 'ch13.poincare_group_velocity(' + KS + ', 0.7*' + KS + ', ' + F + ', 202.95)[0]', rtol: 1e-10 },
    { name: 'group velocity y, beta = 0, fast + root', js: gv0[1], py: 'ch13.poincare_group_velocity(' + KS + ', 0.7*' + KS + ', ' + F + ', 202.95)[1]', rtol: 1e-10 },
    { name: 'group velocity x, slow root vs quasi-geostrophic formula (approximation, O((w/f)^2))', js: gvs[0], py: 'ch13.rossby_group_velocity(' + KS + ', 0.0, ' + B + ', ' + F + ', 202.95)[0]', rtol: 5e-3 },
    { name: 'group velocity x, slow root, l = 0.7 k vs quasi-geostrophic formula (approximation, O((w/f)^2))', js: gvl[0], py: 'ch13.rossby_group_velocity(' + KS + ', 0.7*' + KS + ', ' + B + ', ' + F + ', 202.95)[0]', rtol: 5e-3 },
    { name: 'group velocity y, slow root, l = 0.7 k vs quasi-geostrophic formula (approximation, O((w/f)^2))', js: gvl[1], py: 'ch13.rossby_group_velocity(' + KS + ', 0.7*' + KS + ', ' + B + ', ' + F + ', 202.95)[1]', rtol: 5e-3 },
    { name: 'group velocity x, baroclinic slow root, 35 S vs quasi-geostrophic formula (approximation, O((w/f)^2))', js: gvb[0], py: 'ch13.rossby_group_velocity(' + KS + ', 0.0, ' + B + ', ' + FS + ', 3.6096)[0]', rtol: 1e-4 },
    { name: 'group velocity x, beta = 0, fast - root = minus the Poincare value', js: -gvm[0], py: 'ch13.poincare_group_velocity(' + KS + ', 0.7*' + KS + ', ' + F + ', 202.95)[0]', rtol: 1e-10 },
    { name: 'slow root vs the Rossby formula (approximation, O((w/f)^2))', js: r[1], py: 'ch13.rossby_omega(' + KS + ', 0.0, ' + B + ', ' + F + ', 202.95)', rtol: 2e-3 },
    // invariants
    { name: 'group velocity x = centred difference of the slow root (step 1e-4 k)', js: gvs[0] / fd(1), expect: 1, rtol: 1e-6 },
    { name: 'group velocity x = centred difference of the fast + root (step 1e-4 k)', js: groupVel(k, 0, 202.95, f35, b35, r[2])[0] / fd(2), expect: 1, rtol: 1e-6 },
    { name: 'roots sum to 0', js: (r[0] + r[1] + r[2]) / r[2], expect: 0, atol: 1e-12 },
    { name: 'product of the roots = c^2 beta k', js: r[0] * r[1] * r[2] / (202.95 * 202.95 * b35 * k), expect: 1, rtol: 1e-12 },
    { name: 'cubic residual, fast - root', js: res(k, 0, 202.95, f35, b35, r[0]), expect: 0, atol: 1e-12 },
    { name: 'cubic residual, slow root', js: res(k, 0, 202.95, f35, b35, r[1]), expect: 0, atol: 1e-12 },
    { name: 'cubic residual, fast + root', js: res(k, 0, 202.95, f35, b35, r[2]), expect: 0, atol: 1e-12 },
    { name: 'beta = 0: slow root is exactly 0', js: r0[1], expect: 0, atol: 0 },
    { name: 'beta = 0: fast + root = sqrt(f^2 + c^2 K^2)', js: r0[2] / poincare(Math.hypot(k, 0.7 * k), f35, 202.95), expect: 1, rtol: 1e-13 },
    { name: 'velocity turns clockwise for f > 0 (fast +, fast -, slow)', js: (turning(k, 0, r[2], f35) === -1 && turning(k, 0, r[0], f35) === -1 && turning(k, 0, r[1], f35) === -1) ? 1 : 0, expect: 1, atol: 0 },
    { name: 'velocity turns counter-clockwise for f < 0', js: turning(k, 0, r[2], f35S) === 1 ? 1 : 0, expect: 1, atol: 0 },
    { name: 'no band at 35 N external (beta c < f0^2)', js: curves(35, 0, 'ext', true).bands.length, expect: 0, atol: 0 },
    { name: 'one band at 12 N external', js: curves(12, 0, 'ext', true).bands.length, expect: 1, atol: 0 }
  ];
}

/* ---- the app -------------------------------------------------------------------------------------------------------- */
const dash = '—';
const app = Viz.app({
  title: 'Poincaré, Kelvin, Rossby — separate theories?',
  subtitle: 'One cubic for every wave of a rotating shallow layer: its three roots on one frequency–wavenumber diagram, the four terms that balance for the selected root, and that wave seen from above',
  autoplay: false,
  params: {
    lam: { label: R`Wavelength $2\pi/k$`, min: LMIN, max: LMAX, step: 'any', log: true, value: DEF.lam, fmt: v => fmtKm(v), help: '10 km: far shorter than the Rossby radius · 600 000 km: a mathematical limit (the Earth is 40 000 km round)' },
    lat: { label: 'Latitude', min: 1, max: 80, step: 1, value: DEF.lat, fmt: v => v + '°', help: '1°: almost no Coriolis force, and the β-plane fails for long waves · 80°: f near its maximum, β small' },
    mode: { type: 'select', label: 'Vertical mode', options: [['ext', 'external √(gH)'], ['bc', '1st baroclinic']], value: DEF.mode, display: 'chips' },
    root: { type: 'select', label: 'Root', options: [['plus', 'fast +'], ['minus', 'fast −'], ['slow', 'slow']], value: DEF.root, display: 'chips' },
    betaOn: { type: 'toggle', label: 'β: f grows northward', value: DEF.betaOn },
    hemi: { type: 'select', label: 'Hemisphere', options: [['N', 'N · f > 0'], ['S', 'S · f < 0']], value: DEF.hemi, display: 'chips', optional: true },
    ln: { label: R`North–south wavenumber $l/k$`, min: 0, max: 3, step: 0.1, value: DEF.ln, optional: true, fmt: v => Number(v).toFixed(1), help: '0: crests run north–south · 3: crests nearly east–west' },
    claim: { type: 'select', label: 'Slip #7 sentence', options: [['corrected', 'corrected'], ['printed', 'as printed']], value: DEF.claim, display: 'chips', optional: true },
    t: { label: 'time', min: 0, max: 3, step: 'any', value: 0, optional: true, fmt: v => Number(v).toFixed(2) + ' periods' }
  },
  transport: { param: 't', min: 0, max: 3, rate: 0.25, end: 'loop', step: 0.125 },
  presets: [
    { label: 'reference', set: st8({}), title: '35° N, external mode, 3100 km, fast + root (our illustrative values)' },
    { label: 'inertial limit', set: st8({ lam: 300000, root: 'plus' }), title: 'a very long wave: the fast roots sit at |f₀|' },
    { label: 'K = 1/Λ', set: st8({ lam: LAM_PEAK, root: 'slow' }), title: 'wavelength 2πΛ: the slow branch peaks' },
    { label: 'baroclinic', set: st8({ mode: 'bc', root: 'slow' }), title: 'first baroclinic mode: c = N H/π' },
    { label: 'weak rotation', set: st8({ lat: 1, betaOn: false, root: 'plus' }), title: '1° latitude, β off: the fast curve collapses onto ω = cK' },
    { label: '12° N: gap', set: st8({ lat: 12, lam: 20000, root: 'slow' }), title: 'low latitude, external mode: a band without three real roots' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'wf', label: R`$\omega/|f_0|$`, value: s => { const n = N(s); return n.ok ? n.w / n.fa : NaN; }, fmt: v => (isFinite(v) ? f3(v) : dash) },
    { id: 'T', label: 'Period', value: s => { const n = N(s); return n.ok ? n.period : NaN; }, fmt: v => (v === Infinity ? 'steady (ω = 0)' : isFinite(v) ? Viz.fmtTime(v) : dash) },
    { id: 'cph', label: 'Crest speed', value: s => { const n = N(s); return n.ok ? n.cK : NaN; }, fmt: (v, s) => { const n = N(s || DEF); return !isFinite(v) ? dash : (n.w === 0 ? 'at rest' : f3(v) + ' m/s ' + compass(Math.sign(n.w) * n.k, Math.sign(n.w) * n.l)); } },
    { id: 'cg', label: 'Energy speed (ours)', value: s => { const n = N(s); return n.ok ? n.cgm : NaN; }, fmt: (v, s) => { const n = N(s || DEF); return !isFinite(v) ? dash : (v === 0 ? 'at rest' : f3(v) + ' m/s ' + compass(n.cg[0], n.cg[1])); } },
    { id: 'sf', label: 'Slow / fast', value: s => { const n = N(s); return n.ok ? n.slowfast : NaN; }, fmt: v => (isFinite(v) ? Viz.fmt(v, { sig: 3, keepTiny: true }) : dash) },
    { id: 'disc', label: 'Discriminant', value: s => N(s).Dn, fmt: v => (v >= 0 ? '> 0 · three real roots' : '< 0 · no three real roots') },
    { id: 'Lam', label: R`Rossby radius $c/|f_0|$`, value: s => N(s).Lam / 1e3, fmt: v => fmtKm(v) }
  ],
  stage: {
    rows: [1.35, 1],
    views: [
      { id: 'disp', row: 0, flex: 1.5, title: s => { const n = N(s), sel = n.ok ? '<b class="' + ROOT_CLS[n.i] + '">' + ROOT_NAME[n.i] + '</b> · ' + (n.w === 0 ? 'ω = 0' : fT(n.period) + ' · |ω| = ' + f3(n.ratio) + ' |f₀|') : 'no three real roots here';
        return layout() === 'wide' ? '<b>Frequency against wavenumber</b> · <b class="c-accent">fast ±</b> · <b class="c-amber">slow</b> · <b class="c-teal">Kelvin</b> · ' + sel : sel; } },
      { id: 'terms', row: 0, flex: 0.9, title: s => { const n = N(s); return layout() === 'wide' ? '<b>The four terms of the cubic</b> [1/s³]' + (n.ok ? ' · ' + ROOT_NAME[n.i] + ' root' : '') : '<b>Four terms</b> [1/s³], log bars'; } },
      { id: 'plan', row: 1, flex: 1, hidePortrait: true, title: s => { const n = N(s); return '<b>The selected wave from above</b> · blue = crests' + (n.ok ? ' · ' + (n.w === 0 ? 'steady' : 'real period ' + fT(n.period) + ' (4 s here)') + ' · orbit not to scale · energy arrow: ours, not in the book' : ''); } }
    ],
    draw(g, s) { const n = N(s); drawDisp(g.view('disp'), s, n); drawTerms(g.view('terms'), s, n); drawPlan(g.view('plan'), s, n); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer || ev.viewId !== 'disp' || !DP) return false;
      const p = v.pointer;
      if (!(ev.type === 'pointerdown' || (ev.type === 'pointermove' && p.down))) return false;
      const x = Viz.clamp(DP.ix(p.x), Math.log10(2 * PI / (LMAX * 1e3)), Math.log10(2 * PI / (LMIN * 1e3)));
      const k = Math.pow(10, x), set = { lam: Number((2 * PI / k / 1e3).toPrecision(4)) };
      if (ev.type === 'pointerdown') {
        const n = N(s), r = cubicRoots(k, (s.ln || 0) * k, n.c, n.f0, n.beta);
        if (r) { let best = -1, bd = 26; r.forEach((w, j) => { const y = Math.log10(Math.abs(w)); if (!isFinite(y)) return; const d = Math.abs(DP.Y(y) - p.y); if (d < bd) { bd = d; best = j; } }); if (best >= 0) set.root = ['minus', 'slow', 'plus'][best]; }
      }
      g.app.set(set); return true;
    }
  },
  terms: {
    title: 'The four terms, as shares of the largest (linear bars)',
    items: [
      { id: 'omega3', label: R`acceleration: $\omega^3$`, color: TERM_HEX[0], value: s => share(s, 'omega3') },
      { id: 'gravity', label: R`gravity: $-c^2K^2\omega$`, color: TERM_HEX[1], value: s => share(s, 'gravity') },
      { id: 'rotation', label: R`rotation: $-f_0^2\omega$`, color: TERM_HEX[2], value: s => share(s, 'rotation') },
      { id: 'beta', label: R`β: $-c^2\beta k$`, color: TERM_HEX[3], value: s => share(s, 'beta') }
    ],
    total: { label: 'sum (zero for a root)', value: s => { const n = N(s); return n.ok ? (n.vmax > 0 && Math.abs(n.T.sum) > 1e-9 * n.vmax ? n.T.sum / n.vmax : 0) : NaN; } }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a dot in the diagram to select that root.',
  notes: s => '<p>' + readingText(s) + '</p>',
  explore: {
    intro: 'Drag the orange cursor in the diagram, or click one of its dots to select that root. The bars show which terms of the cubic carry the balance.',
    controls: ['lam', 'lat', 'mode', 'root', 'betaOn', 'hemi', 'ln'],
    readouts: ['wf', 'T', 'cph', 'cg', 'sf', 'disc', 'Lam'],
    callouts: [{ kind: 'try', html: R`Select the slow root and sweep the wavelength through $2\pi\Lambda$: the crests always go west, but the energy turns from west to east. The energy speed is ours — not in the book; the Explain tab works it out.` }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
