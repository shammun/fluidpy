  const BL = Viz.color('blue'), NV = Viz.color('navy'), AM = Viz.color('amber'), MU = Viz.color('muted'), TX = Viz.color('text');
  const r1 = st.r1, H = st.H, gpH = st.gp * H;
  const lo = -5, hi = 0;
  const kmin = Math.pow(10, lo);
  const cand = [wInt(kmin, r1), st.deep ? Infinity : wTwo(kmin, H, r1)[1]].filter(isFinite);
  const ymin = Math.max(-9, Math.floor(L10(Math.min(...cand)) - 0.3)), ymax = 1;
  const P = logAxes(v, [lo, hi], [ymin, ymax], { pad: small ? { l: 40, r: 8, t: 6, b: 20 } : { l: 50, r: 12, t: 8, b: 32 },
                                                 xlabel: small ? '' : 'wavenumber k [rad/m]', ylabel: small ? '' : 'ω [rad/s]' });
  const f = fn => lk => { const y = fn(Math.pow(10, lk)); return y > 0 ? L10(y) : NaN; };
  const hl = s.hl || null;
  P.clip(() => {
    if (!st.deep) {
      const xk = -L10(H);                                         // kH = 1
      if (xk > lo && xk < hi) P.line([xk, xk], [ymin, ymax], { color: Viz.alpha(MU, 0.6), width: 1, dash: [2, 4] });
      P.fn(f(k => Math.sqrt(gpH) * k), { color: AM, width: 1.8, dash: [2, 4], n: 60 });
    }
    P.fn(f(k => wInt(k, r1)), { color: Viz.alpha(NV, 0.85), width: 1.6, dash: [7, 5], n: 60 });
    P.fn(f(k => Math.sqrt(G * k)), { color: BL, width: hl === 'bt' ? 4.5 : 2.4, n: 60, alpha: st.deep ? 0.45 : 1 });
    if (!st.deep) P.fn(f(k => wTwo(k, H, r1)[1]), { color: NV, width: hl === 'bc' ? 4.5 : 2.4, n: 200 });
    const xk = L10(st.k);
    P.line([xk, xk], [ymin, ymax], { color: Viz.alpha(TX, 0.35), width: 1 });
  });
  const xk = L10(st.k);
  if (st.deep) dotPx(ctx, P.X(xk), P.Y(L10(st.wi)), 6.5, NV);
  else {
    const bt = st.mode === 'barotropic';
    dotPx(ctx, P.X(xk), P.Y(L10(st.w[0])), bt ? 6.5 : 4, BL);
    dotPx(ctx, P.X(xk), P.Y(L10(st.w[1])), bt ? 4 : 6.5, NV);
  }
  if (tiny) return;
  // curve labels near the right end (big) or none but the kH = 1 tag (small)
  if (!small) {
    const lab = (txt, lk, y, col, dy) => { if (isFinite(y)) Viz.text(ctx, txt, P.X(lk), P.Y(y) + dy, { size: 12, color: col, weight: 650, align: 'right', bg: true }); };
    lab('√(gk)', -0.15, L10(Math.sqrt(G * 0.7)), BL, -12);
    lab('ε√(gk)', -0.15, L10(wInt(0.7, r1)), NV, -12);
    if (!st.deep) {
      const lkl = lo + 1.2, yl = L10(Math.sqrt(gpH) * Math.pow(10, lkl));
      if (yl > ymin + 0.4) Viz.text(ctx, '√(g′H) k', P.X(lkl), P.Y(yl) - 12, { size: 12, color: AM, weight: 650, bg: true });
      const xkh = -L10(H); if (xkh > lo + 0.3 && xkh < hi - 0.3) Viz.text(ctx, 'kH = 1', P.X(xkh) + 4, P.px.y + P.px.h - 12, { size: 12, color: MU, weight: 600, bg: true });
    }
  }
}

/* ---- view 3: surface signal and speed ratio vs Δρ/ρ₂ -------------------------------------------------------------- */
function drawRatio(g, s) {
  const v = g.view('ratio'); v.clear(); if (v.w < 80 || v.h < 60) return;
  const st = ST(s), ctx = v.ctx, small = v.w < 420 || v.h < 170;
  const NV = Viz.color('navy'), OR = Viz.color('orange'), MU = Viz.color('muted'), TX = Viz.color('text');
  const lo = -4, hi = L10(0.5), k = st.k, H = st.H;
  const ez = d => (d / (1 - d)) * Math.exp(-k * H);
  const cr = d => (st.deep ? Math.sqrt(d / (2 - d)) : wTwo(k, H, rho1Of(d))[1] / Math.sqrt(G * k));
  let ymin = Math.min(L10(cr(1e-4)), st.deep ? 0 : L10(Math.max(ez(1e-4), 1e-300)));
  ymin = Math.max(-8, Math.floor(ymin - 0.2));
  const P = logAxes(v, [lo, hi], [ymin, 0.3], { pad: small ? { l: 40, r: 8, t: 6, b: 20 } : { l: 50, r: 12, t: 8, b: 32 },
                                               xlabel: small ? '' : 'density step Δρ/ρ₂', ylabel: small ? '' : 'ratio', xw: 44 });
  const f = fn => ld => { const y = fn(Math.pow(10, ld)); return y > 0 ? L10(y) : NaN; };
  P.clip(() => {
    if (!st.deep) P.fn(f(ez), { color: NV, width: 2.4, n: 120 });
    P.fn(f(cr), { color: OR, width: 2.4, n: 120 });
    const xd = L10(s.drho); P.line([xd, xd], [ymin, 0.3], { color: Viz.alpha(TX, 0.35), width: 1 });
  });
  const xd = L10(s.drho);
  if (!st.deep && ez(s.drho) > 0 && L10(ez(s.drho)) > ymin) dotPx(ctx, P.X(xd), P.Y(L10(ez(s.drho))), 5.5, NV);
  dotPx(ctx, P.X(xd), P.Y(L10(cr(s.drho))), 5.5, OR);
  if (!small) {
    Viz.text(ctx, st.deep ? 'ω/√(gk) = ε' : 'c_bc / c_bt', P.px.x + 6, P.px.y + 12, { size: 12, color: OR, weight: 650, bg: true });
    if (!st.deep) Viz.text(ctx, '|η/ζ| baroclinic', P.px.x + 6, P.px.y + 30, { size: 12, color: NV, weight: 650, bg: true });
    else Viz.text(ctx, 'no surface: η/ζ does not exist', P.px.x + 6, P.px.y + 30, { size: 12, color: MU, weight: 600, bg: true });
  }
}

function drawAll(g, s) { drawSide(g, s); drawDisp(g, s); drawRatio(g, s); }

/* ---- text builders ------------------------------------------------------------------------------------------------ */
function interpretText(s) {
  const st = ST(s);
  if (st.mode === 'barotropic') return `The whole column moves together: surface and interface rise and fall in phase, the interface smaller by $e^{-kH}$ = ${f3(1 / st.ezBt)}, and $u$ is continuous across it (no rose sheet). The density step hardly matters: the period ${Viz.fmtTime(st.Tbt)} is that of a deep-water surface wave. Tides and storm surges are barotropic.`;
  if (st.mode === 'baroclinic') {
    const q = st.cs / st.cl;
    return `The interface heaves ${f3(1 / Math.abs(st.ezBc))} times more than the surface, in antiphase, and the two layers slide past each other: $u$ jumps across the interface, a vortex sheet (rose). ` +
      (st.kH < 0.3 ? `These are long waves ($kH$ = ${f3(st.kH)}): the speed ${spd(st.c)} is close to $\\sqrt{g'H}$ = ${spd(st.cl)}, ${f3(q)} times slower than a surface wave on a layer ${lenStr(st.H)} deep. This is the thermocline's own slow dynamics, the basis of Ch. 13's reduced-gravity models.`
        : st.kH > 3 ? `Here $kH$ = ${f3(st.kH)}: the interface no longer feels the far surface and the wave follows $\\omega=\\varepsilon\\sqrt{gk}$, the two-deep-fluid result.`
          : `With $kH$ = ${f3(st.kH)} the wave is between the long-wave limit $\\sqrt{g'H}$ and the two-deep-fluid limit $\\varepsilon\\sqrt{gk}$.`);
  }
  return `No free surface: only the interfacial wave, a deep-water wave slowed by $\\varepsilon$ = ${f3(st.eps)}. Its period ${Viz.fmtTime(st.Tint)} is ${f3(1 / st.eps)} times the ${Viz.fmtTime(st.Tbt)} of a surface wave of the same length. $u$ reverses across the interface: a vortex sheet, the seed of Kelvin–Helmholtz instability (Ch. 11).`;
}

function explainHtml(s) {
  const W = Viz.work, st = ST(s);
  let o = '';
  o += W.step(0, 'What the views show') +
    W.say('<b>Side view</b> (two wavelengths, depth not to scale): <span class="c-blue">blue</span> = the free surface η, <span class="c-navy">navy</span> = the interface ζ and the heavy lower layer, arrows = the horizontal velocity u, <span class="c-rose">rose halo</span> = where u jumps across the interface. The two lines have separate magnifications, printed beside them. <b>ω(k)</b>: <span class="c-blue">blue</span> barotropic, <span class="c-navy">navy</span> baroclinic, <span class="c-navy">navy dashed</span> $\\varepsilon\\sqrt{gk}$, <span class="c-amber">amber dotted</span> $\\sqrt{g\'H}\\,k$.') +
    W.hint('On phones the <b>surface signal vs Δρ/ρ₂</b> window is hidden; sections 3 and 6 carry its numbers.');
  o += W.step(1, 'The densities') +
    W.line(`$\\rho_1=\\rho_2(1-\\Delta\\rho/\\rho_2)=1025\\times(1-${t3(s.drho)})$`, `${rhoStr(st.r1)} kg/m³`, 'the light upper layer; ρ₂ = 1025 kg/m³ below') +
    W.line(`$\\varepsilon^2=\\dfrac{\\rho_2-\\rho_1}{\\rho_2+\\rho_1}=\\dfrac{${t4(st.r2 - st.r1)}}{${t4(st.r2 + st.r1)}}$`, f3(st.e2), `ε = ${f3(st.eps)}`) +
    W.line(`$g'=g\\,\\dfrac{\\rho_2-\\rho_1}{\\rho_2}=9.81\\times\\dfrac{${t4(st.r2 - st.r1)}}{1025}$`, `${Viz.fmt(st.gp, { sig: 4 })} m/s²`, 'reduced gravity with ρ₂ below the line, as in $g\'=g(\\rho_2-\\rho_1)/\\rho_2$ (7.117)') +
    W.box(`$g'=\\mathbf{${t4(st.gp)}}$ m/s² with $\\rho_2$; with $\\rho_1$ below the line (Ch. 4) $${t4(st.gp1)}$ m/s², ${f3(100 * Math.abs(st.gp1 / st.gp - 1))} % apart`);
  if (!st.deep) {
    o += W.step(2, 'The barotropic mode') +
      W.line(`$k=2\\pi/\\lambda=2\\pi/${lenTex(s.lam)}$`, `${Viz.fmt(st.k, { sig: 4 })} rad/m`, `kH = ${f3(st.kH)}`) +
      W.line(`$\\omega^2=gk$ (7.111): $\\omega=\\sqrt{9.81\\times${t4(st.k)}}$`, `${Viz.fmt(st.w[0], { sig: 4 })} rad/s`, `T = ${Viz.fmtTime(st.Tbt)}, c = ${spd(st.w[0] / st.k)}`) +
      W.box(`$b=a\\,e^{-kH}$ (7.112) $=\\mathbf{${t3(1 / st.ezBt)}}\\,a$: the interface moves in phase, smaller`);
    const sh = Math.sinh(st.kH), ch = Math.cosh(st.kH);
    o += W.step(3, 'The baroclinic mode') +
      W.line(`$\\omega^2=\\dfrac{gk(\\rho_2-\\rho_1)\\sinh kH}{\\rho_2\\cosh kH+\\rho_1\\sinh kH}$ (7.113)`, `${Viz.tnum(st.w[1] ** 2, 4)} rad²/s²`,
        st.kH < 20 ? `sinh kH = ${f3(sh)}, cosh kH = ${f3(ch)}` : 'sinh kH ≈ cosh kH: the $\\omega=\\varepsilon\\sqrt{gk}$ (7.95) limit') +
      W.box(`$\\omega=\\mathbf{${t3(st.w[1])}}$ rad/s, $T=\\mathbf{${Viz.fmtTime(st.Tbc).replace(' ', '\\ \\text{')}}}$, $c=${t3(st.w[1] / st.k)}$ m/s`) +
      W.line(`$\\dfrac{\\eta}{\\zeta}=-\\dfrac{\\rho_2-\\rho_1}{\\rho_1}\\,e^{-kH}$ (7.114)`, Viz.fmt(st.ezBc, { sig: 3 }), 'negative: antiphase; tiny: the surface hardly moves');
    o += W.step(4, 'The long-wave limit') +
      W.line(`$c=\\sqrt{g'H}$ (7.116) $=\\sqrt{${t3(st.gp)}\\times${t3(st.H)}}$`, `${Viz.fmt(st.cl, { sig: 3 })} m/s`, st.kH < 0.3 ? `kH = ${f3(st.kH)} ≪ 1: close to the exact ${spd(st.w[1] / st.k)}` : `kH = ${f3(st.kH)} is not small: the exact speed is ${spd(st.w[1] / st.k)}`) +
      W.line(`surface wave on a layer $H$ deep: $\\sqrt{gH}$`, `${f3(st.cs)} m/s`, 'the book\'s comparison after (7.116)') +
      W.box(`$\\sqrt{gH}/\\sqrt{g'H}=\\sqrt{\\rho_2/(\\rho_2-\\rho_1)}=\\mathbf{${t3(st.cs / st.cl)}}$: internal waves are slow`);
  }
  o += W.step(st.deep ? 2 : 5, 'Two deep fluids') +
    W.line(`$\\omega=\\varepsilon\\sqrt{gk}$ (7.95) $=${t3(st.eps)}\\times\\sqrt{9.81\\times${t4(st.k)}}$`, `${Viz.fmt(st.wi, { sig: 3 })} rad/s`, `T = ${Viz.fmtTime(st.Tint)}`) +
    W.say(st.deep ? 'This is the only wave: with no free surface there is no barotropic mode.' : `The baroclinic branch for $kH\\gg1$; now the baroclinic ω is ${f3(st.w[1] / st.wi)} × this.`);
  const E = eInt(s.amp, st.r1, st.r2), aeq = s.amp * Math.sqrt((st.r2 - st.r1) / st.r2);
  o += W.step(st.deep ? 3 : 6, `An interface wave ${lenStr(s.amp)} high`) +
    (st.deep ? '' : W.line(`surface signal $|\\eta|=${t3(s.amp)}\\times|\\eta/\\zeta|$`, lenStr(Math.abs(s.amp * st.ezBc)), 'baroclinic mode')) +
    W.line(`$E=\\tfrac12(\\rho_2-\\rho_1)ga^2$ (7.96) $=\\tfrac12\\times${t4(st.r2 - st.r1)}\\times9.81\\times${t3(s.amp)}^2$`, `${Viz.fmt(E, { sig: 3 })} J/m²`, 'two deep fluids: E_k = E_p = ¼Δρga²') +
    W.box(`a surface wave with the same energy, $\\tfrac12\\rho_2ga^2$, is only $\\mathbf{${lenTex(aeq)}}$ high`);
  o += W.step(st.deep ? 4 : 7, 'At the current time') +
    W.line('$t=\\tau T$', Viz.live('t')) +
    W.line(`at $x$ = ${s.probe !== null && s.probe !== undefined && isFinite(s.probe) ? lenStr(s.probe * s.lam) + ' (your probe)' : '0'}: surface η, interface ζ`, Viz.live('ez'));
  o += W.interpret(interpretText(s), 'Reading the current setting');
  return o;
}

function notesHtml(s) {
  const st = ST(s), n = narrow();
  const p = pointAt(s, 0);
  let h = `<p><b>Right now</b> at x = 0: ${st.deep ? '' : `η = ${lenStr(p.eta)}, `}ζ = ${lenStr(p.zeta)}; u just above the interface ${spd(p.uA)}, just below ${spd(p.uB)}${Math.abs(p.UB - p.UA) > 1e-9 * Math.abs(p.UA) + 1e-15 ? ' — a jump' : ''}.</p>`;
  const rows = [['ρ₂ (the book)', f3(st.gp), f3(Math.sqrt(st.gp * st.H))], ['ρ₁ (Ch. 4)', f3(st.gp1), f3(Math.sqrt(st.gp1 * st.H))], ['mean ρ', f3(st.gpm), f3(Math.sqrt(st.gpm * st.H))]];
  h += '<p><b>Which ρ below the line?</b> ' + `the ρ₁ and ρ₂ forms of g′ differ by ${f3(100 * Math.abs(st.gp1 / st.gp - 1))} %` + (s.drho < 0.01 ? ' — negligible in the ocean.' : ' — no longer negligible.') + '</p>';
  h += Viz.work.table(n ? ['g′ with', 'g′ [m/s²]', '√(g′H)'] : ['g′ with', 'g′ [m/s²]', 'c = √(g′H) [m/s]'], rows, 0);
  return h;
}
function inspectHtml(s) {
  if (s.probe === undefined || s.probe === null || !isFinite(s.probe)) return null;
  const st = ST(s), x = s.probe * s.lam, p = pointAt(s, x), t = tNow(s);
  let h = `At $x = ${lenTex(x)}$, $t = ${t3(t)}$ s: $\\theta=kx-\\omega t=${t3(p.th)}$, $\\cos\\theta=${t3(p.c)}$. `;
  if (!st.deep) h += `$\\eta=a\\cos\\theta=${t3(st.etaA)}\\times${t3(p.c)}=\\mathbf{${t3(p.eta)}}$ m; `;
  h += `$\\zeta=b\\cos\\theta=${t3(st.zetaA)}\\times${t3(p.c)}=\\mathbf{${t3(p.zeta)}}$ m; `;
  h += `$u_1=${t3(p.uA)}$, $u_2=${t3(p.uB)}$ m/s at the interface, jump $u_2-u_1=\\mathbf{${t3(p.uB - p.uA)}}$ m/s.`;
  return h;
}

let APP = null;
/** Per-mode control hiding: the root carries the mode; CSS hides H and the barotropic readouts for two deep fluids. */
function markMode(s, a) {
  const r = document.documentElement, changed = r.dataset.tlMode !== s.mode;
  r.dataset.tlMode = s.mode;
  if (changed && a && typeof a.fit === 'function') requestAnimationFrame(() => a.fit());
}
