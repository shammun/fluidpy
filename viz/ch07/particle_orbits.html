/* ---- the explainer's state → the physics ---------------------------------------------------------------------- */

/* ---- formatting ------------------------------------------------------------------------------------------------- */
const f3 = v => Viz.fmt(v, { sig: 3 });

/* ---- pixel helpers ------------------------------------------------------------------------------------------------ */

/** Plot with the rotated y title in its own 18 px strip on views narrower than 420 px (ch01/ch05 lesson). */

/* ---- view 1: the water column ------------------------------------------------------------------------------------ */

/* ---- view 2: orbit size vs depth ---------------------------------------------------------------------------------- */
function drawAxes(g, s) {
  const v = g.view('axes'); v.clear();
  if (v.w < 60 || v.h < 40) return;
  const n = N(s), ctx = v.ctx, shortV = v.h < 150, RS = runSel(s);
  const A0 = orbitAxes(0, n.a, K, n.H).A, xmax = 1.15 * Math.max(A0, n.a);
  const P = gutterPlot(v, { xlim: [0, xmax], ylim: [-n.H, 0], xlabel: 'half-axis [m]', ylabel: 'z₀ [m]', pad: { t: 8, r: 10, b: shortV ? 20 : 34 } },
    { xlabel: shortV ? '' : (v.w < 420 ? 'half-axis [m]' : 'orbit half-width A, half-height B [m]'), yticks: shortV ? [0, -n.H] : undefined, xticks: v.w < 260 ? [0, xmax / 2.3, xmax / 1.15].map(x => Number(x.toPrecision(2))) : undefined });
  const TE = Viz.color('teal'), AC = Viz.color('accent'), MU = Viz.color('muted'), TX = Viz.color('text');
  const zs = Viz.num.linspace(-n.H, 0, 160);
  const uLmax = stokesDrift(0, n.a, K, n.H), su = 0.85 * xmax / uLmax;
  P.clip(() => {
    P.line(zs.map(z => n.a * Math.exp(K * z)), zs, { color: Viz.alpha(MU, 0.9), width: 1.4, dash: [2, 3] });
    P.line(zs.map(z => orbitAxes(z, n.a, K, n.H).A), zs, { color: TE, width: 2.6 });
    P.line(zs.map(z => orbitAxes(z, n.a, K, n.H).B), zs, { color: TE, width: 2, dash: [7, 4] });
    if (n.exact) {
      P.line(zs.map(z => stokesDrift(z, n.a, K, n.H) * su), zs, { color: AC, width: 2.2 });
      P.dot(n.st.drift_speed * su, n.z0, 4.5, { color: AC, stroke: '#fff' });
      const Xd = P.X(RS.meas / n.T * su), Yd = P.Y(n.z0);
      ctx.save(); ctx.fillStyle = Viz.color('card'); ctx.strokeStyle = AC; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(Xd, Yd - 7); ctx.lineTo(Xd + 6, Yd); ctx.lineTo(Xd, Yd + 7); ctx.lineTo(Xd - 6, Yd); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    P.line([0, xmax], [n.z0, n.z0], { color: Viz.alpha(TX, 0.5), width: 1, dash: [3, 3] });
    P.dot(n.st.A, n.z0, 4.5, { color: TE, stroke: '#fff' });
    P.dot(n.st.B, n.z0, 4.5, { color: Viz.color('card'), stroke: TE, strokeWidth: 2 });
  });
  const lab = (str, x, y, o) => Viz.text(ctx, str, x, y, Object.assign({ size: 12, bg: true, pad: 2 }, o));
  if (!shortV && v.w >= 300) {
    const zl = -0.72 * n.H, Al = orbitAxes(zl, n.a, K, n.H);
    lab('A', P.X(Al.A) + 6, P.Y(zl), { color: TE, weight: 700 });
    if (Al.A - Al.B > 0.08 * xmax) lab('B', P.X(Al.B) + 6, P.Y(zl), { color: TE, weight: 700 });
    if (n.exact) lab(v.w < 420 ? `ū_L(0) ${cms(uLmax)}` : `purple: ū_L, surface ${cms(uLmax)} · ◇ measured`, P.px.x + P.px.w - 4, P.px.y + P.px.h - 12, { color: AC, align: 'right', weight: 650 });
  }
}

/* ---- inspector, status, notes ------------------------------------------------------------------------------------- */

function statusOf(s) {

}
function interpText(s) {
  const n = N(s), st = n.st;
  if (n.aH > 0.25) return `The amplitude is ${f2(n.aH * 100)} % of the depth (a = ${f3(n.a)} m, H = ${f3(n.H)} m): the linear theory behind these orbits assumes a ≪ H and a ≪ λ, so read the shapes as a sketch. Lower the steepness $ka$ to make the picture trustworthy.`;
  if (n.exact && n.ka > 0.15) return `Finite amplitude: the loops do not close. The drift $\\bar u_L=a^2\\omega ke^{2kz_0}$ (7.85) is ka = ${f3(n.ka)} times the orbital speed at the surface (${cms(n.uL0)} vs ${f3(n.a * n.om)} m/s) and dies away twice as fast as the orbits, $e^{2kz_0}$ against $e^{kz_0}$: only the top few metres are carried.`;
  if (n.exact) return `Exact path lines at small steepness: each loop misses closing by $\\bar u_LT$ = ${f3(st.drift_per_period)} m per period at your depth — ${f3(100 * st.drift_per_period / (2 * st.A))} % of the loop width — so the dye line leans only slowly. The drift grows like $a^2$: double $ka$ and it grows fourfold.`;
  if (n.reg === REG.deep) return `Deep water, small amplitude: circles that shrink like $e^{kz_0}$ — halved every ${f3(Math.LN2 / K)} m. At half a wavelength down (−10 m) only ${f3(100 * Math.exp(-PI))} % is left, so a diver there hardly feels the wave. The bottom plays no part.`;
  if (n.reg === REG.shallow) return `Shallow water: every parcel sloshes back and forth by nearly the same $a/kH$ = ${f3(n.a / n.kH)} m, while its vertical motion $a(1+z_0/H)$ falls linearly to zero at the bottom. The sea bed is swept to and fro — this is how waves move sand.`;
  return `Between the limits: the loops are ellipses with $B/A=\\tanh k(z_0+H)$ = ${f3(st.B_over_A)} at your depth. Near the surface they are almost circles, near the bottom they flatten into lines; the foci stay ${f3(2 * st.focal_half)} m apart at every depth.`;
}

const STEEP = { kH: 4, ka: 0.25, model: 'exact', z0: -1, hl: '', stream: false };
const DERIV = [

    start: { tex: '\\frac{dx_p}{dt}=u(x_p,z_p,t),\\qquad \\frac{dz_p}{dt}=w(x_p,z_p,t)', plain: `The path-line equations (7.32), shown above: a parcel moves with the velocity at its own position, here the linear wave velocity (7.27), ${EQ727u}.` },
    plan: ['Insert the velocities.', 'Split the position into mean + small excursion.', 'Freeze the right sides at the mean position.', 'Integrate in time.'],

      { did: 'Split the position', tex: 'x_p=x_0+\\xi(t),\\qquad z_p=z_0+\\zeta(t)',

function codeRun(s) {

}

g, k = 9.81, 2*np.pi/20       # λ = 20 m
H, a = {{rH}}, {{ra}}         # depth, amplitude [m]
w = np.sqrt(g*k*np.tanh(k*H))  # ω = {{rw}} rad/s
def vel(x, z, t):             # u, w at the parcel
    th = k*x - w*t
    C = np.cosh(k*(z + H))/np.sinh(k*H)
    S = np.sinh(k*(z + H))/np.sinh(k*H)
    return a*w*C*np.cos(th), a*w*S*np.sin(th)
dt = 2*np.pi/w/100            # 100 steps a period
x, z, t = 0.0, {{rz}}, 0.0     # on the dye line
for _ in range(1000):         # RK4, 10 periods
    u1, w1 = vel(x, z, t)
    u2, w2 = vel(x+dt/2*u1, z+dt/2*w1, t+dt/2)
    u3, w3 = vel(x+dt/2*u2, z+dt/2*w2, t+dt/2)
    u4, w4 = vel(x+dt*u3, z+dt*w3, t+dt)
    x += dt/6*(u1 + 2*u2 + 2*u3 + u4)
    z += dt/6*(w1 + 2*w2 + 2*w3 + w4)
    t += dt

    live: s => { const n = N(s); return `\\begin{aligned}\\frac{a}{kH}&=${t3(n.a / n.kH)}\\ \\text{m}\\\\ a\\big(1+\\tfrac{z_0}{H}\\big)&=${t3(n.a * (1 + n.z0 / n.H))}\\ \\text{m}\\end{aligned}`; }, note: 'For $H<0.07\\lambda$.' },
  { id: 'taylor', title: 'Taylor-expanded path line', ref: 'Eq. (7.84a)', tex: '\\frac{dx_p}{dt}=u(x_0,z_0,t)+\\xi\\Big(\\frac{\\partial u}{\\partial x}\\Big)_{x_0,z_0}+\\zeta\\Big(\\frac{\\partial u}{\\partial z}\\Big)_{x_0,z_0}+\\ldots',
    note: 'The two correction terms are what the frozen model drops; their average is the drift.' },
  { id: 'drift', title: 'Stokes drift, deep water', ref: 'Eq. (7.85)', tex: '\\bar u_L=a^2\\omega ke^{2kz_0}',
    live: s => { const n = N(s); return `\\bar u_L=${t3(stokesDeep(n.z0, n.a, K, n.H) * 100)}\\ \\text{cm/s}`; }, symbols: [['\\bar u_L', 'Lagrangian mean (drift) velocity', 'm/s']] },
  { id: 'driftH', title: 'Stokes drift, any depth', ref: 'Eq. (7.86)', tex: '\\bar u_L=a^2\\omega k\\frac{\\cosh 2k(z_0+H)}{2\\sinh^2kH}',
    live: s => { const n = N(s); return `\\bar u_L=${t3(n.st.drift_speed * 100)}\\ \\text{cm/s}`; }, note: 'The vertical drift is zero; the mean velocity at a fixed point is zero.' }
];
const QUIZ = [
  { q: 'In deep water, how deep must you go for the orbit to shrink to 1 % of its surface size?', a: '$e^{kz_0}=0.01$ gives $z_0=-\\ln 100/k=-4.61/0.314=-14.7$ m, about 0.73 λ. Set the depth to −14.7 m at kH = 6 and compare A with the surface value.', set: { kH: 6, ka: 0.1, model: 'linear', z0: -14.7 } },
  { q: 'In shallow water, which is larger at the bottom: the horizontal or the vertical excursion?', a: 'The horizontal one: $A\\approx a/kH$ at every depth, while $\\zeta\\cong a(1+z_0/H)\\cos(kx_0-\\omega t)$ (7.50) falls to 0 at the bottom — the bottom parcel only slides.', set: { kH: 0.3, ka: 0.03, model: 'linear', z0: -0.955 } },
  { q: 'On the steep exact wave, double $ka$ from 0.1 to 0.2. By what factor does the drift grow?', a: 'By 4: $\\bar u_L=a^2\\omega ke^{2kz_0}$ (7.85) grows like $a^2$ (ω does not change). Watch the drift readout go from about 5.6 to 22 cm/s at the surface.', set: { kH: 4, ka: 0.1, model: 'exact', z0: 0 } },
  { q: 'Why does a current meter fixed 3 m down read zero mean flow while a float at 3 m drifts?', a: 'The meter averages whatever water passes it: $u\\propto\\cos(kx_0-\\omega t)$ averages to exactly 0 (Explain §6). The float follows one parcel, which is further forward — in faster water — at the top of its loop.', set: { kH: 4, ka: 0.25, model: 'exact', z0: -3 } }
];

/* ---- selftest: parity with fluidpy.ch07 (py) and invariants (expect) ------------------------------------------------ */
function selftestRows() {
  const k = K, a1 = 0.1 / k, H3 = 3 / k, H6 = 6 / k, H1 = 1 / k, a4 = 0.25 / k, H4 = 4 / k, Hb = 0.5 / k;
  const T4 = 2 * PI / omegaG(k, H4);
  const A = '0.3183098861837907, 0.3141592653589793', A4 = '0.7957747154594768, 0.3141592653589793';
  const pp = z => pathRK4(0, z, T4, a4, k, H4, 4000, 'exact', 'orbit');
  return [
    { name: 'omega kH 3', js: omegaG(k, H3), py: 'ch07.omega_gravity(0.3141592653589793, 9.549296585513721)', rtol: 1e-13 },
    { name: 'A at -2 m (kH 3)', js: orbitAxes(-2, a1, k, H3).A, py: `ch07.orbit_semi_axes(-2.0, ${A}, 9.549296585513721)["A"]`, rtol: 1e-12 },
    { name: 'B at -2 m (kH 3)', js: orbitAxes(-2, a1, k, H3).B, py: `ch07.orbit_semi_axes(-2.0, ${A}, 9.549296585513721)["B"]`, rtol: 1e-12 },
    { name: 'focal half (kH 1)', js: orbitAxes(-1, a1, k, H1).focal_half, py: `ch07.orbit_semi_axes(-1.0, ${A}, 3.183098861837907)["focal_half"]`, rtol: 1e-12 },
    { name: 'A at the bottom (kH 0.5)', js: orbitAxes(-Hb, a1, k, Hb).A, py: `ch07.orbit_semi_axes(-1.5915494309189535, ${A}, 1.5915494309189535)["A"]`, rtol: 1e-12 },
    { name: 'B at the bottom is 0', js: orbitAxes(-Hb, a1, k, Hb).B, py: `ch07.orbit_semi_axes(-1.5915494309189535, ${A}, 1.5915494309189535)["B"]`, atol: 1e-15 },
    { name: 'A deep H = inf', js: orbitAxes(-3, a1, k, Infinity).A, py: `ch07.orbit_semi_axes(-3.0, ${A}, np.inf)["A"]`, rtol: 1e-13 },
    { name: 'orbit_linear xi', js: orbitLinear(1.3, -2, 0.7, a1, k, H1)[0], py: `ch07.orbit_linear(1.3, -2.0, 0.7, ${A}, 3.183098861837907)[0]`, rtol: 1e-12 },
    { name: 'orbit_linear zeta', js: orbitLinear(1.3, -2, 0.7, a1, k, H1)[1], py: `ch07.orbit_linear(1.3, -2.0, 0.7, ${A}, 3.183098861837907)[1]`, rtol: 1e-12 },
    { name: 'drift surface (kH 6)', js: stokesDrift(0, a1, k, H6), py: `ch07.stokes_drift(0.0, ${A}, 19.098593171027442)`, rtol: 1e-12 },
    { name: 'drift at -2 m (kH 3)', js: stokesDrift(-2, a1, k, H3), py: `ch07.stokes_drift(-2.0, ${A}, 9.549296585513721)`, rtol: 1e-12 },
    { name: 'drift shallow (kH 0.3)', js: stokesDrift(-0.5, 0.03 / k, k, 0.3 / k), py: 'ch07.stokes_drift(-0.5, 0.0954929658551372, 0.3141592653589793, 0.954929658551372)', rtol: 1e-12 },
    { name: 'drift deep H = inf', js: stokesDrift(-1, a1, k, Infinity), py: `ch07.stokes_drift(-1.0, ${A}, np.inf)`, rtol: 1e-12 },
    { name: 'orbit_state B/A (kH 1)', js: orbitState(-3, a1, k, H1).B_over_A, py: `ch07.orbit_state(-3.0, ${A}, 3.183098861837907)["B_over_A"]`, rtol: 1e-12 },
    { name: 'orbit_state drift per period', js: orbitState(-3, a1, k, H1).drift_per_period, py: `ch07.orbit_state(-3.0, ${A}, 3.183098861837907)["drift_per_period"]`, rtol: 1e-12 },
    { name: 'orbit_state orbital speed', js: orbitState(-3, a1, k, H1).orbital_speed, py: `ch07.orbit_state(-3.0, ${A}, 3.183098861837907)["orbital_speed"]`, rtol: 1e-12 },
    { name: 'orbit_state T', js: orbitState(-3, a1, k, H1).T, py: `ch07.orbit_state(-3.0, ${A}, 3.183098861837907)["T"]`, rtol: 1e-13 },
    { name: 'exact path x after 1 T (ka 0.25, kH 4)', js: pp(-1).x, py: `ch07.particle_path(0.0, -1.0, [0.0, ${T4}], ${A4}, 12.732395447351628, model="exact")["x"][1]`, rtol: 1e-8 },
    { name: 'exact path z after 1 T', js: pp(-1).z, py: `ch07.particle_path(0.0, -1.0, [0.0, ${T4}], ${A4}, 12.732395447351628, model="exact")["z"][1]`, rtol: 1e-9 },
    { name: 'linear path x at t = 1.1 s', js: pathRK4(0.4, -2, 1.1, a4, k, H4, 2000, 'linear', 'orbit').x, py: `ch07.particle_path(0.4, -2.0, [0.0, 1.1], ${A4}, 12.732395447351628, model="linear")["x"][1]`, rtol: 1e-9 },
    { name: 'dyed line x (z0 -1, t = T)', js: pathRK4(0, -1, T4, a4, k, H4, 4000, 'exact', 'mean').x, py: `ch07.dyed_line([-1.0, -3.0], ${T4}, ${A4}, 12.732395447351628)["x"][0]`, rtol: 1e-7 },
    { name: 'dyed line x (z0 -3, t = T)', js: pathRK4(0, -3, T4, a4, k, H4, 4000, 'exact', 'mean').x, py: `ch07.dyed_line([-1.0, -3.0], ${T4}, ${A4}, 12.732395447351628)["x"][1]`, rtol: 1e-7 },
    { name: 'measured drift per period (kH 3, z0 -2)', js: driftNumeric(-2, a1, k, H3, 10), py: `ch07.orbit_state(-2.0, ${A}, 9.549296585513721, periods=10, model="exact")["drift_numeric"]`, rtol: 1e-7 },
    { name: 'Eulerian mean at a fixed point', js: eulerianMean(0, -2, a4, k, H4), py: `ch07.eulerian_mean_u(-2.0, ${A4}, 12.732395447351628)`, atol: 1e-12 },
    { name: 'invariant: focal constant', js: orbitAxes(-1, a1, k, H1).focal_half - Math.sqrt(orbitAxes(-2.5, a1, k, H1).A ** 2 - orbitAxes(-2.5, a1, k, H1).B ** 2), expect: 0, atol: 1e-12 },
    { name: 'invariant: ellipse equation = 1', js: (e => (e[0] / orbitAxes(-2, a1, k, H1).A) ** 2 + (e[1] / orbitAxes(-2, a1, k, H1).B) ** 2)(orbitLinear(0.3, -2, 2.2, a1, k, H1)), expect: 1, rtol: 1e-12 },
    { name: 'invariant: B/A = tanh k(z0 + H)', js: orbitState(-1.5, a1, k, H1).B_over_A - Math.tanh(k * (H1 - 1.5)), expect: 0, atol: 1e-13 },
    { name: 'invariant: clockwise (moving forward at the top)', js: vel(0, -1, 0, a1, k, H1, omegaG(k, H1))[0] > 0 && orbitLinear(0, -1, 0, a1, k, H1)[1] > 0 ? 1 : 0, expect: 1, atol: 0 },
    { name: 'invariant: any-depth drift -> deep drift', js: stokesDrift(-1, a1, k, 60 / k) / stokesDeep(-1, a1, k, 60 / k), expect: 1, rtol: 1e-12 },
    { name: 'invariant: drift grows like a^2', js: stokesDrift(-1, 2 * a1, k, H3) / stokesDrift(-1, a1, k, H3), expect: 4, rtol: 1e-13 },
    { name: 'invariant: display RK4 drift = fine RK4 drift', js: (() => { const RS = runSel({ kH: 3, ka: 0.1, z0: -2, tau: 0, model: 'exact' }); RUNS = { key: '' }; return RS.meas; })(), expect: driftNumeric(-2, a1, k, H3, 10), rtol: 1e-5 }
  ];
}

/* ---- the app ------------------------------------------------------------------------------------------------------ */
const CFG = {
  title: 'What does the water under a wave actually do?',
  subtitle: 'Water parcels under a surface wave travelling to the right: linear orbits (circles in deep water, flat ellipses in shallow water) and exact path lines whose loops open — the Stokes drift',
  autoplay: false,
  params: {
    kH: { label: 'Depth ratio $kH$', min: 0.2, max: 6, step: 0.01, value: 3, log: true, fmt: v => `${f3(v)} · H ${f3(v / K)} m`, help: 'kH = 2πH/λ with λ = 20 m fixed: this sets the depth H' },
    ka: { label: 'Steepness $ka$', min: 0.01, max: 0.3, step: 0.005, value: 0.1, fmt: v => `${f3(v)} · a ${f3(v / K)} m`, help: 'the surface amplitude a = ka/k' },
    z0: { label: 'Ringed parcel depth $z_0$', min: -19.1, max: 0, step: 0.01, value: -1, unit: 'm', optional: true, help: 'or click the water; clamped to the bottom −H' },
    stream: { type: 'toggle', label: 'Streamlines now', value: false, optional: true },
    tau: { label: 'time $t/T$', min: 0, max: NPER, step: 'any', value: 0, optional: true, fmt: v => `${f3(v)} T` }
  },
  modes: { param: 'model', label: 'Path model', options: [['linear', 'linear (frozen)'], ['exact', 'exact path lines']], value: 'linear' },
  transport: { param: 'tau', min: 0, max: NPER, rate: 0.5, end: 'hold', hold: 3, unit: 'T' },
  presets: [
    { label: 'deep', set: Object.assign({}, DEEP), title: 'kH = 3, ka = 0.1: circles' },
    { label: 'intermediate', set: { kH: 1, ka: 0.1, model: 'linear', z0: -1.6, hl: '' }, title: 'kH = 1: ellipses flattening with depth' },
    { label: 'shallow', set: { kH: 0.3, ka: 0.03, model: 'linear', z0: -0.5, hl: '' }, title: 'kH = 0.3 (H = 0.95 m): flat ellipses of equal width' },
    { label: 'steep (exact)', set: Object.assign({}, STEEP), title: 'kH = 4, ka = 0.25, exact path lines: the Stokes drift' },
    { label: 'bottom parcel', set: { kH: 0.5, ka: 0.1, model: 'linear', z0: -0.5 / K, hl: '' }, title: 'the parcel on the bottom only slides back and forth' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'A', label: 'Half-width $A$', value: s => N(s).st.A, unit: 'm' },
    { id: 'B', label: 'Half-height $B$', value: s => N(s).st.B, unit: 'm' },
    { id: 'uL', label: 'Drift $\\bar u_L$', value: s => N(s).st.drift_speed * 100, unit: 'cm/s' },
    { id: 'T', label: 'Period $T$', value: s => N(s).T, unit: 's' }
  ],
  stage: {
    rows: [1.35, 1],
    views: [
      { id: 'column', row: 0, flex: 1.5, title: s => columnTitle(s) },
      { id: 'axes', row: 1, flex: 1, title: s => axesTitle(s) },
      { id: 'track', row: 1, flex: 1.2, title: s => trackTitle(s) }
    ],
    draw(g, s) { CUR = s; drawColumn(g, s); drawAxes(g, s); drawTrack(g, s); },
    onPointer(g, ev, s) {
      if (ev.viewId !== 'column' || ev.type !== 'pointerdown' || !COL.P) return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y, P = COL.P;
      if (!P.inside(X, Y)) return false;
      let best = null, bd = 18 * 18;
      COL.drawn.forEach(d => { const dd = (d.X - X) ** 2 + (d.Y - Y) ** 2; if (dd < bd) { bd = dd; best = d; } });
      const H = N(s).H;
      let z0 = best ? best.z0 : Math.round(P.iy(Y) * 100) / 100;
      z0 = Math.max(-H, Math.min(0, z0));
      g.app.set({ z0 });
      return true;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a parcel (or any depth in the water): the ringed parcel moves to that depth and its arithmetic appears here.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Drag the depth ratio and the steepness, switch the path model, and click the water to ring a parcel at another depth.',
    controls: ['kH', 'ka', 'z0', 'stream'],
    readouts: ['A', 'B', 'uL', 'T'],
    callouts: [{ kind: 'try', html: 'Press <b>steep (exact)</b>, then play: the rose dye line bends forward near the surface only — the drift $\\bar u_L\\propto e^{2kz_0}$ dies twice as fast as the orbits.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => {
    if (key === 'kH') { const H = s.kH / K; if (s.z0 < -H) a.set({ z0: -H }); }
  }
};
const app = Viz.app(CFG);
CUR = app.state;
</script>
