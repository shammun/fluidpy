}

/* ---- view 1 in pond mode: a stone's disturbance spreading from x = 0 ------------------------------------------------- */
function pondFrame(t) {
  const PG = pondGrid(), PS = PG.PS, cw = new Float64Array(PS.n), eta = new Array(POND_NX);
  for (let j = 0; j < PS.n; j++) cw[j] = PS.Aj[j] * Math.cos(PS.wj[j] * t);
  for (let i = 0; i < POND_NX; i++) { let sum = 0; const o = i * PS.n; for (let j = 0; j < PS.n; j++) sum += PG.cosM[o + j] * cw[j]; eta[i] = sum; }
  return { xs: PG.xs, eta };
}
function drawPond(v, s, st) {
  const ctx = v.ctx, t = tNow(s), small = v.w < 480 || v.h < 170, tiny = v.h < 110;
  const BL = Viz.color('blue'), AC = Viz.color('accent'), MU = Viz.color('muted'), TX = Viz.color('text');
  const fr = pondFrame(t);
  let m = 0; for (let i = 0; i < POND_NX; i++) if (fr.xs[i] > 0.03 || t < 0.05) m = Math.max(m, Math.abs(fr.eta[i]));
  const ym = Math.max(1e-4, 1.25 * m);
  const P = gutterPlot(v, { xlim: [0, 100], ylim: [-ym, ym], pad: small ? { l: 42, r: 14, t: 6, b: 20 } : { l: 52, r: 10, t: 8, b: 32 },
                            xlabel: small ? '' : 'distance from the splash x [cm]  ·  clean water, deep  ·  height auto-scaled', ylabel: 'η / a' },
                       { yticks: [-Number((ym / 1.25).toPrecision(2)), 0, Number((ym / 1.25).toPrecision(2))] });
  WAVEP = { P, U: { f: 100, u: 'cm' }, cen: 0, pond: true };
  const r = CGM.cg_min * t, xu = fr.xs.map(x => 100 * x);
  P.clip(() => {
    if (r > 0) { ctx.save(); ctx.fillStyle = Viz.alpha(AC, 0.07); ctx.fillRect(P.px.x, P.px.y, P.X(100 * r) - P.px.x, P.px.h); ctx.restore(); }
    P.line(xu, fr.eta, { color: BL, width: 1.9 });
    if (r > 0) P.line([100 * r, 100 * r], [-ym, ym], { color: AC, width: 2, dash: [6, 5] });
    if (s.probe !== undefined && s.probe !== null && isFinite(s.probe) && s.probe >= 0) {
      const xp = Math.min(1, s.probe); P.line([100 * xp, 100 * xp], [-ym, ym], { color: Viz.alpha(TX, 0.7), width: 1, dash: [3, 3] });
    }
  });

    Viz.text(ctx, small ? `calm r = ${lenStr(r)}` : `calm disc: r = c_g,min t = ${lenStr(r)}`, P.X(100 * r) + 6, P.px.y + 12, { size: 12.5, color: AC, weight: 650, bg: true });
    dotPx(ctx, P.X(100 * r), P.Y(0), 5.5, AC);
  }
  if (!small && t > 0.3) Viz.text(ctx, 'long waves lead →', P.px.x + P.px.w - 6, P.px.y + P.px.h - 12, { size: 12, color: MU, align: 'right', weight: 600, bg: true });
  if (!small) Viz.text(ctx, `t = ${Viz.fmtTime(t)}`, P.px.x + P.px.w - 6, P.px.y + 12, { size: 12, color: MU, weight: 500, align: 'right', bg: true });
  if (APP && APP.holding) Viz.card(ctx, P.px.x + P.px.w * 0.6, P.px.y + P.px.h * 0.75,
    [`After ${Viz.fmtTime(t)} the calm disc reaches ${lenStr(r)}:`, `no ripple energy is slower than ${spd(CGM.cg_min)}`], { colors: [AC, TX], maxWidth: P.px.w - 20 });
}

/* ---- view 2: ω(k) with the chord (c) and the tangent (c_g) ----------------------------------------------------------- */
function drawDisp(g, s) {
  const v = g.view('disp'); v.clear(); if (v.w < 60 || v.h < 50) return;
  const st = ST(s), ctx = v.ctx, small = v.w < 420 || v.h < 170, tiny = v.h < 110;
  const OR = Viz.color('orange'), AC = Viz.color('accent'), TX = Viz.color('text'), MU = Viz.color('muted');
  const D = st.D, k0 = st.k0, w0 = st.w0, kmax = 3 * k0;
  const wf = k => om(D, k);
  const ytop = 1.12 * Math.max(wf(kmax), w0 + Math.abs(st.cg) * (kmax - k0), st.c * kmax * 0.75);
  const P = gutterPlot(v, { xlim: [0, kmax], ylim: [0, ytop], pad: small ? { l: 40, r: 8, t: 6, b: 20 } : { l: 52, r: 12, t: 8, b: 32 },
                            xlabel: small ? '' : 'wavenumber k [rad/m]', ylabel: 'ω [rad/s]' });
  P.clip(() => {
    P.fn(k => st.c * k, { color: Viz.alpha(OR, 0.9), width: 1.8 });                                   // chord: slope c
    P.fn(k => w0 + st.cg * (k - k0), { color: AC, width: 2 });                                          // tangent: slope c_g
    if (st.mode === 'beats') {
      const B = st.B, sl = B.cg_finite;
      P.fn(k => B.w1 + sl * (k - B.k1), { color: Viz.alpha(AC, 0.75), width: 1.6, dash: [6, 4] });      // chord Δω/Δk
    }
    P.fn(wf, { color: TX, width: 2.6, n: 300 });                                                        // the dispersion curve
  });
  if (st.mode === 'beats') { dotPx(ctx, P.X(st.B.k1), P.Y(st.B.w1), 4.5, AC); dotPx(ctx, P.X(st.B.k2), P.Y(st.B.w2), 4.5, AC); }
  dotPx(ctx, P.X(k0), P.Y(w0), 6, OR);
  if (!tiny) {
    const kc = Math.min(2.9 * k0, 0.9 * ytop / st.c), yc = st.c * kc;
    Viz.text(ctx, small ? `slope c` : `chord: slope ω/k = c = ${spd(st.c)}`, P.X(kc) - 8, P.Y(yc), { size: 12, color: OR, align: 'right', weight: 650, bg: true });
    const kt = 2.7 * k0, ytg = w0 + st.cg * (kt - k0);
    if (ytg > 0 && ytg < ytop) Viz.text(ctx, small ? `slope c_g` : `tangent: slope dω/dk = c_g = ${spd(st.cg)}`, P.X(kt), P.Y(ytg) + 13, { size: 12, color: AC, align: 'right', weight: 650, bg: true });
    if (st.mode === 'pond' && !small) Viz.text(ctx, 'the flattest tangent: the slowest energy', P.X(k0) + 8, P.Y(w0) - 14, { size: 12, color: AC, weight: 600, bg: true });
    if (st.mode === 'beats' && !small) Viz.text(ctx, `dashed: Δω/Δk = ${spd(st.B.cg_finite)}`, P.X(st.B.k2) + 6, P.Y(st.B.w2) + 30, { size: 12, color: AC, align: 'left', weight: 600, bg: true });
  }
}

/* ---- view 3: energy density along the group (pond: the spectrum and c_g(k)) ------------------------------------------ */
function drawEnergy(g, s) {
  const v = g.view('energy'); v.clear(); if (v.w < 80 || v.h < 60) return;
  const st = ST(s), ctx = v.ctx, small = v.w < 420 || v.h < 170;
  const AC = Viz.color('accent'), BL = Viz.color('blue'), MU = Viz.color('muted'), TX = Viz.color('text');
  if (st.mode === 'pond') {
    const PS = pondGrid().PS, kx = 450, ymaxv = 0.6;
    const P = gutterPlot(v, { xlim: [0, kx], ylim: [0, ymaxv], pad: small ? { l: 40, r: 8, t: 6, b: 20 } : { l: 50, r: 12, t: 8, b: 32 },
                              xlabel: small ? '' : 'wavenumber k [rad/m]', ylabel: 'c_g [m/s]' });
    const ks = Viz.num.linspace(1, kx, 300), amp = ks.map(k => ymaxv * 0.9 * Math.exp(-0.5 * (k * PS.width) ** 2));
    P.clip(() => {
      P.fillBetween(ks, amp, 0, { color: BL, alpha: 0.16 });
      P.line(ks, ks.map(k => cgv(k, Infinity, G, SIG, RHO)), { color: AC, width: 2.4 });
      P.line([0, kx], [CGM.cg_min, CGM.cg_min], { color: Viz.alpha(AC, 0.7), width: 1.2, dash: [5, 5] });
    });
    dotPx(ctx, P.X(CGM.k), P.Y(CGM.cg_min), 5.5, AC);
    Viz.text(ctx, `c_g,min = ${spd(CGM.cg_min)}`, P.X(CGM.k) + 8, P.Y(CGM.cg_min) + 14, { size: 12, color: AC, weight: 650, bg: true });
    if (!small) Viz.text(ctx, 'blue: how much of each k the splash holds', P.px.x + P.px.w - 6, P.px.y + 12, { size: 12, color: BL, align: 'right', weight: 600, bg: true });
    return;
  }
  const t = tNow(s), U = unitFor(st.lam0), cen = st.cgMove * t, x0 = cen - st.Wh, x1 = cen + st.Wh;
  const per = st.eref.per * st.eref.a ** 2, peak = st.mode === 'beats' ? 4 * per : per;
  const kJ = peak >= 1000, sc = kJ ? 1e-3 : 1;
  const P = gutterPlot(v, { xlim: [x0 * U.f, x1 * U.f], ylim: [0, 1.25 * peak * sc], pad: small ? { l: 40, r: 8, t: 6, b: 20 } : { l: 52, r: 10, t: 8, b: 32 },
                            xlabel: small ? '' : `x [${U.u}]`, ylabel: kJ ? 'E [kJ/m²]' : 'E [J/m²]' });
  const n = 400, xs = Viz.num.linspace(x0, x1, n), xu = xs.map(x => x * U.f);
  const E = xs.map(x => { const e = waveAt(st, s, x, t).envelope; return per * e * e * sc; });
  P.clip(() => { P.fillBetween(xu, E, 0, { color: AC, alpha: 0.28 }); P.line(xu, E, { color: AC, width: 2 }); });
  // flux arrow at the energy peak
  const xp = st.mode === 'packet' ? cen : cen, Ep = Math.max(...E), Fp = Ep / sc * st.cg;
  const X = P.X(xp * U.f), Y = P.Y(Ep * 0.55);
  arrowPx(ctx, X - 30, Y, X + 30, Y, TX, 2.6, 9);
  Viz.text(ctx, small ? `F ${fStr(Fp)}` : `flux F = E c_g = ${fStr(Fp)}`, X, Y - 15, { size: 12.5, color: TX, align: 'center', weight: 650, bg: true });
  if (st.mode === 'packet' && !small) {
    const tot = Viz.num.trapz(E.map(e => e / sc), xs);
    Viz.text(ctx, `∫E dx = ${tot >= 1e6 ? f3(tot / 1e6) + ' MJ/m' : tot >= 1e3 ? f3(tot / 1e3) + ' kJ/m' : f3(tot) + ' J/m'} (constant)`, P.px.x + 6, P.px.y + 12, { size: 12, color: AC, weight: 600, bg: true });
  }
}

function drawAll(g, s) { drawWave(g, s); drawDisp(g, s); drawEnergy(g, s); }

/* ---- text builders ------------------------------------------------------------------------------------------------- */
function regimeOf(st) { if (st.mode === 'pond') return 'pond'; const r = st.cg / st.c; return Math.abs(r - 1) <= 5e-3 ? 'cg=c' : (r < 1 ? 'cg<c' : 'cg>c'); }
function omegaTex(D) {
  if (D.kind === 'deep') return '\\omega=\\sqrt{gk}';
  if (D.kind === 'finite') return '\\omega=\\sqrt{gk\\tanh kH}';
  if (D.kind === 'shallow') return '\\omega=k\\sqrt{gH}';
  return '\\omega=\\sqrt{\\sigma k^3/\\rho}';
}
function omegaSub(D, k) {
  if (D.kind === 'deep') return `\\sqrt{9.81\\times${t4(k)}}`;
  if (D.kind === 'finite') return `\\sqrt{9.81\\times${t4(k)}\\times\\tanh(${t3(k * D.H)})}`;
  if (D.kind === 'shallow') return `${t4(k)}\\times\\sqrt{9.81\\times${t3(D.H)}}`;
  return `\\sqrt{0.07274\\times(${t4(k)})^3/998.2}`;
}
/** "Right now": where the tracked crest is in its group and when it leaves it. */
function crestNow(s) {
  const st = ST(s), t = tNow(s), xi = crestXi(st, t), half = st.span / 2, rel = st.c - st.cgMove;
  const fromRear = (xi + half) / st.lamC;
  let left = Infinity, edge = '';
  if (Math.abs(rel) > 5e-3 * st.c) { if (rel > 0) { left = (half - xi) / rel; edge = 'front'; } else { left = (xi + half) / -rel; edge = 'rear'; } }
  return { xi, fromRear, left, edge };
}
function interpretText(s) {
  const st = ST(s);
  if (st.mode === 'pond') return `All wavelengths start together at the splash, and each leaves at its own $c_g$: the long gravity waves run ahead, the short ripples follow, and nothing moves slower than $c_{g,min}$ = ${spd(CGM.cg_min)}. So the water inside $r = c_{g,min}t$ empties: the calm disc grows at ${spd(CGM.cg_min)} while the ripples spread outward.`;
  const reg = regimeOf(st), D = st.D;
  if (reg === 'cg=c') return `No dispersion: every component moves at $\\sqrt{gH}$ = ${spd(st.c)}, so ${st.mode === 'beats' ? 'the beat pattern' : 'the packet'} keeps its shape and $c_g = c$. A tsunami's energy arrives together with its crests.` + (D.kind === 'shallow' && s.lam0 < 14 * s.H ? ` (Careful: with λ₀ = ${lenStr(s.lam0)} and H = ${lenStr(s.H)} real water is not shallow; choose "finite H" to see the difference.)` : '');
  if (reg === 'cg<c') {
    const deep = D.kind === 'deep' || (D.kind === 'finite' && TWO_PI / s.lam0 * s.H > 3);
    return (deep ? 'Deep water: the group moves at half the crest speed.' : `Finite depth: $c_g/c$ = ${f3(st.ratio)}, between ½ (deep) and 1 (shallow).`) +
      ' Follow the orange crest: it appears at the back of the group, runs through it, and fades at the front. Swell "sets" arrive at $c_g$, and so does their energy.';
  }
  return `Ripples: surface tension makes $c_g$ = ${f3(st.ratio)} $c$, larger than $c$. Crests appear at the front of the group and slide backwards through it; the energy still travels at $c_g$.`;
}

    p += Viz.work.table(n ? ['swell T', 'c_g [m/s]', '1000 km [h]'] : ['swell T', 'λ [m]', 'c [m/s]', 'c_g [m/s]', '1000 km [h]'], rows, cur);

}

/** Per-mode control hiding: the root carries the mode and the water type; CSS hides the controls that do not apply. */
function markMode(s, a) {
  const r = document.documentElement, changed = r.dataset.gvMode !== s.mode || r.dataset.gvDisp !== s.disp;
  r.dataset.gvMode = s.mode; r.dataset.gvDisp = s.disp;
  if (changed && a && typeof a.fit === 'function') requestAnimationFrame(() => a.fit());
}
function inspectHtml(s) {
  if (s.probe === undefined || s.probe === null || !isFinite(s.probe)) return null;
  const st = ST(s), t = tNow(s);
  if (st.mode === 'pond') {
    const x = Math.min(1, Math.max(0, s.probe)), PS = pondGrid().PS, e = pondEta(PS, x, t);
    return `At $x = ${lenTex(x)}$, $t = ${t3(t)}$ s: $\\eta/a = \\sum_{j=1}^{${PS.n}} A_j\\cos(k_jx)\\cos(\\omega_jt) = \\mathbf{${t3(e)}}$ ${x < CGM.cg_min * t ? '(inside the calm disc)' : ''}`;
  }
  const x = st.cgMove * t + s.probe * st.lam0;
  if (st.mode === 'beats') {
    const B = st.B, r = beatAt(B, x, t);
    return `At $x = ${lenTex(x)}$: $\\eta/a = 2\\cos(\\tfrac12\\Delta k\\,x-\\tfrac12\\Delta\\omega\\,t)\\cos(kx-\\omega t) = ${t3(r.envelope)}\\times${t3(r.carrier)} = \\mathbf{${t3(r.eta)}}$`;
  }
  const r = packetAt(st.PK, x, t);
  if (st.PK.w2 === 0) return `At $x = ${lenTex(x)}$: $\\eta/a = a(x-c_gt)\\cos(k_0x-\\omega_0t) = ${t3(r.envelope)}\\times${t3(r.carrier)} = \\mathbf{${t3(r.eta)}}$ (7.68)`;
  return `At $x = ${lenTex(x)}$: $\\eta/a = |A|\\cos(k_0x-\\omega_0t+\\arg A) = ${t3(r.envelope)}\\times\\cos(${t3(((r.theta + r.argA) % TWO_PI + TWO_PI) % TWO_PI)}) = \\mathbf{${t3(r.eta)}}$ (ω″ kept)`;
}
