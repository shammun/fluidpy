.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }

      P.line([0, 0.65], [1, 1], { color: muted, width: 1.5, dash: [5, 4] });
      P.fn(x => 1 + x / 2, { color: Viz.color('orange'), width: 2.4 });
    });
    P.dot(s.aH, 1 + s.aH / 2, 6, { color: Viz.color('orange'), stroke: '#fff', strokeWidth: 2 });
    Viz.text(ctx, 'linear c₀', P.X(0.6), P.Y(1) - 10, { size: 12, align: 'right', color: Viz.color('text-soft'), bg: true });
    return;
  }
  const Fr = Viz.num.linspace(0.3, 6, 240), rr = Fr.map(f => jump(1, f).ratio), ll = Fr.map(f => jump(1, f).head_loss);
  const P = v.plot({ xlim: [0.3, 6], ylim: [-1.5, 11.5], pad: { l: small ? 34 : 44, r: 12, t: 6, b: small ? 28 : 34 } })
    .axes({ xlabel: 'upstream Froude number Fr₁', ylabel: small ? '' : '× H₁', xticks: [1, 2, 3, 4, 5, 6], yticks: v.h < 110 ? [0, 8] : [0, 2, 4, 6, 8, 10] });
  lastCurve = { P };
  const X1 = P.X(1);
  ctx.save(); ctx.fillStyle = Viz.alpha(muted, 0.18); ctx.fillRect(P.px.x, P.px.y, X1 - P.px.x, P.px.h); ctx.restore();
  P.clip(() => {
    P.line([0.3, 6], [1, 1], { color: muted, width: 1.3, dash: [2, 4] });
    P.line([1.7, 1.7], [-1.5, 11.5], { color: Viz.alpha(muted, 0.7), width: 1, dash: [4, 4] });
    P.line([0.3, 6], [0, 0], { color: Viz.alpha(ink, 0.4), width: 1 });
    P.line(Fr, ll, { color: rose, width: 2.4 });
    P.line(Fr, rr, { color: ink, width: 2.4 });
  });
  const J = jump(1, s.Fr1);
  P.line([s.Fr1, s.Fr1], [-1.5, 11.5], { color: Viz.alpha(ink, 0.3), width: 1 });
  P.dot(s.Fr1, J.ratio, 6, { color: ink, stroke: '#fff', strokeWidth: 2 });
  P.dot(s.Fr1, J.head_loss, 6, { color: rose, stroke: '#fff', strokeWidth: 2 });
  if (v.h >= 110) {
    Viz.text(ctx, 'H₂/H₁', P.X(5.9), P.Y(jump(1, 5.9).ratio) - 12, { size: 12, align: 'right', color: ink, bg: true });
    Viz.text(ctx, small ? 'loss/H₁' : 'head loss / H₁', P.X(4.6), P.Y(jump(1, 4.6).head_loss) + 14, { size: 12, align: 'left', color: rose, bg: true });
    Viz.text(ctx, small ? 'gain ⛔' : 'would create energy ⛔', P.px.x + 4, P.Y(9.5), { size: 12, color: Viz.color('text-soft'), bg: true, maxWidth: Math.max(60, X1 - P.px.x + 60) });
    if (!small) Viz.text(ctx, 'undular | roller', P.X(1.7), P.Y(10.6), { size: 12, align: 'center', color: Viz.color('text-soft'), bg: true });
  }
}

function drawBudget(v, s) {
  v.clear();
  const ctx = v.ctx, W = v.w, Hh = v.h, ink = Viz.color('text'), soft = Viz.color('text-soft');
  if (W < 60 || Hh < 60) return;
  const lw = Math.min(118, 0.34 * W), x0 = lw + 6, bw = W - x0 - 12;
  if (s.fate === 'solitary') {
    const a = s.aH * s.H1, K = kdvTerms(a, s.H1, xiFront(a, s.H1));
    const rows = [['∂η/∂t (rising)', K.loc, Viz.color('blue')], ['c₀ ∂η/∂x', K.adv, Viz.color('muted')], ['steepening', K.steep, Viz.color('orange')], ['dispersion', K.disp, Viz.color('teal')], ['sum', K.sum, ink]];
    const mx = Math.max(...rows.map(r => Math.abs(r[1]))), rh = Math.min(30, (Hh - 26) / rows.length), xm = x0 + bw / 2;
    Viz.text(ctx, 'KdV terms at the front face [m/s]', 6, 10, { size: 12, color: soft });
    rows.forEach(([lab, val, col], i) => {
      const y = 22 + i * rh, wv = Math.abs(val) / mx * (bw / 2 - 4);
      ctx.save(); ctx.fillStyle = Viz.alpha(col, 0.85); ctx.fillRect(val < 0 ? xm - wv : xm, y + 3, wv, rh - 8); ctx.restore();
      Viz.text(ctx, lab, 6, y + rh / 2, { size: 12, color: col === Viz.color('muted') ? soft : col, maxWidth: lw });
      Viz.text(ctx, Math.abs(val) < 1e-12 * mx * 1e3 ? '0' : Viz.fmt(val, { sig: 3 }), val < 0 ? xm + 4 : xm - 4, y + rh / 2, { size: 12, align: val < 0 ? 'left' : 'right', color: ink });
    });
    ctx.save(); ctx.strokeStyle = Viz.alpha(ink, 0.5); ctx.beginPath(); ctx.moveTo(xm, 20); ctx.lineTo(xm, 22 + rows.length * rh); ctx.stroke(); ctx.restore();
    return;
  }
  const J = ST(s), purple = Viz.color('accent'), amber = Viz.color('amber'), rose = Viz.color('rose'), blue = Viz.color('blue');
  const M1 = J.mom_in + J.p_in, M2 = J.mom_out + J.p_out, Mx = Math.max(M1, M2), Ex = Math.max(J.E1, J.E2);
  const rh = Math.min(34, (Hh - 20) / 4.4);
  let y = 6;
  const bar = (lab, segs, total, sub) => {
    Viz.text(ctx, lab, 6, y + rh / 2, { size: 12, color: ink, weight: 650, maxWidth: lw });
    let x = x0;
    segs.forEach(([val, col, scale, hatch]) => {
      const wv = val / scale * bw;
      ctx.save(); ctx.fillStyle = Viz.alpha(col, hatch ? 0.35 : 0.85); ctx.fillRect(x, y + 3, wv, rh - 8);
      if (hatch) { ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.75, y + 3.75, Math.max(0, wv - 1.5), rh - 9.5); }
      ctx.restore(); x += wv;
    });
    Viz.text(ctx, total, Math.min(x + 4, x0 + bw), y + rh / 2, { size: 12, align: x + 90 > x0 + bw ? 'right' : 'left', color: sub || ink, bg: true });
    y += rh;
  };
  bar('face 1: M₁', [[J.mom_in, purple, Mx], [J.p_in, amber, Mx]], fmtN(M1));
  bar('face 2: M₂', [[J.mom_out, purple, Mx], [J.p_out, amber, Mx]], fmtN(M2));
  Viz.text(ctx, bw > 330 ? 'M = ρQu + ½ρgH²: equal on both faces (momentum balance)' : bw > 200 ? 'M = ρQu + ½ρgH² on both faces' : 'M₁ = M₂', x0, y + 7, { size: 12, color: soft });
  y += 16;
  const lost = J.dE < 0;
  bar('energy E₁', [[J.E1, Viz.color('muted'), Ex]], f3(J.E1) + ' J/kg');
  bar('energy E₂', lost ? [[J.E2, blue, Ex], [-J.dE, rose, Ex, true]] : [[J.E1, blue, Ex], [J.dE, '#dc2626', Ex, true]],
    lost ? (bw > 260 ? f3(J.E2) + ' J/kg · lost ' + f3(-J.dE) + ' J/kg' : 'lost ' + f3(-J.dE) + ' J/kg') : '⛔ gained ' + f3(J.dE) + ' J/kg', lost ? ink : '#dc2626');
}

/* ---------------------------------------------------------------------------------------------------
   TeX of the book's equations (shown next to every number that cites them)
   --------------------------------------------------------------------------------------------------- */
const EQ = {
  fr: '\\mathrm{Fr}\\equiv u/\\sqrt{gH}',
  mass: 'Q=u_1H_1=u_2H_2',
  mom: '\\rho Q(u_2-u_1)=\\tfrac12\\rho g(H_1^2-H_2^2)',
  e80: 'Q^2\\Big(\\frac{1}{H_2}-\\frac{1}{H_1}\\Big)=\\tfrac12g(H_1^2-H_2^2)',
  e81: '\\frac{H_2}{H_1}=\\tfrac12\\big(-1+\\sqrt{1+8\\mathrm{Fr}_1^2}\\big)',
  e81i: '\\tfrac{H_2}{H_1}=\\tfrac12(-1+\\sqrt{1+8\\mathrm{Fr}_1^2})',
  loss: 'E_2-E_1=-\\frac{g(H_2-H_1)^3}{4H_1H_2}',
  e87s: '\\eta_t+c_0\\eta_x+\\tfrac32\\tfrac{c_0}{H}\\eta\\eta_x+\\tfrac16c_0H^2\\eta_{xxx}=0',
  e87: '\\begin{aligned}&\\frac{\\partial\\eta}{\\partial t}+c_0\\frac{\\partial\\eta}{\\partial x}\\\\ &+\\frac32\\frac{c_0}{H}\\eta\\frac{\\partial\\eta}{\\partial x}+\\frac16c_0H^2\\frac{\\partial^3\\eta}{\\partial x^3}=0\\end{aligned}',
  e88s: '\\eta=a\\,\\mathrm{sech}^2\\big[(\\tfrac{3a}{4H^3})^{1/2}(x-ct)\\big]',
  e88: '\\begin{aligned}\\eta&=a\\,\\mathrm{sech}^2\\Big[\\Big(\\frac{3a}{4H^3}\\Big)^{1/2}(x-ct)\\Big]\\\\ c&=c_0\\Big(1+\\frac{a}{2H}\\Big)\\end{aligned}',
  cs: 'c=c_0(1+a/2H)'
};
const $ = t => '$' + t + '$';
const colI = (cls, html) => `<b class="${cls}">${html}</b>`;

      o += W.step(n++, 'The stream after the jump') +
