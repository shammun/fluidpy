.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }

    }
  } else {
    const d = [-(Math.sign(st.k) || 1) * st.m / st.K, Math.abs(st.k) / st.K];     // unit vector ⟂ K (particle motion)
    const xs = [-0.6, -0.2, 0.2, 0.6].map(f => f * P.xlim[1]), zs = [-0.55, 0, 0.55].map(f => f * P.ylim[1]);
    for (const x0 of xs) for (const z0 of zs) {
      const env = s.mode === 'packet' ? packetEnv(st, P, t, x0, z0) : 1;
      pts.push({ x0, z0, dir: d, amp: A * env, val: -Math.sin(st.k * x0 + st.m * z0 - st.omega * t) });
    }

    const X0 = P.X(p.x0), Y0 = P.Y(p.z0), ax = P.sx(p.amp) * p.dir[0], ay = -P.sx(p.amp) * p.dir[1];
    if (P.sx(p.amp) >= 5) dblArrowPx(ctx, X0 - ax, Y0 - ay, X0 + ax, Y0 + ay, Viz.alpha(TE, 0.6), small ? 1.3 : 1.6);

  }
}

/* ---- view 2: the wavenumber plane ------------------------------------------------------------------------------------- */
let KP = null;
/** Half-range of the wavenumber plane [rad/m]: zoom levels ≥ 1.4 K, frozen while the tip is dragged. */
const KLEVELS = [0.25, 0.35, 0.5, 0.65, 0.8, 1, 1.25, 1.5, 1.75, 2, 2.4, 2.75, 3.25, 3.75, 4.5, 5.5];
let KDRAG = null;
function kRange(K) { if (KDRAG) return KDRAG; for (const L of KLEVELS) if (L >= 1.1 * K) return L; return KLEVELS[KLEVELS.length - 1]; }
function drawK(g, s) {
  const v = g.view('kplane'); v.clear(); KP = null; if (v.w < 50 || v.h < 50) return;
  const st = ST(s), ctx = v.ctx, small = v.w < 420 || v.h < 200, tiny = v.h < 120;
  const OR = Viz.color('orange'), AC = Viz.color('accent'), MU = Viz.color('muted'), TX = Viz.color('text');
  const KR = kRange(s.K);
  const P = squarePlot(v, KR, small);
  KP = P;
  const Rr = 4 * Math.max(P.xlim[1], P.ylim[1]);
  P.clip(() => {
    // rays of constant ω/N (grey) and the circle |K| = const
    for (const r of [0.25, 0.5, 0.75]) {
      const th = Math.acos(r);
      for (const [a, b] of [[1, 1], [-1, 1], [-1, -1], [1, -1]]) P.line([0, a * Rr * Math.cos(th)], [0, b * Rr * Math.sin(th)], { color: Viz.alpha(MU, 0.55), width: 1, dash: [4, 4] });
    }
    const ang = Viz.num.linspace(0, TWO_PI, 181);
    P.line(ang.map(a => st.K * Math.cos(a)), ang.map(a => st.K * Math.sin(a)), { color: Viz.alpha(MU, 0.7), width: 1.2 });
  });

      const th = Math.acos(r), rr = Math.min(0.86 * P.ylim[1] / Math.sin(th), 0.86 * P.xlim[1] / Math.cos(th));
      const X = P.X(qx * rr * Math.cos(th)), Y = P.Y(qy * rr * Math.sin(th));
      Viz.text(ctx, !small ? `ω/N = ${r}` : `${r}`, X + 5 * qx, Y, { size: 12, color: MU, weight: 600, align: qx > 0 ? 'left' : 'right', bg: true });
    }
  }
  // velocity arrows from the origin on their own scale: c (orange, along K) and c_g (purple, ⟂ K)
  const Lmax = Math.min(Math.max(36, 0.85 * P.sx(st.K)), 0.46 * Math.min(P.px.w, P.px.h)), vs = Lmax / Math.max(st.c, st.cg, 1e-30);
  const X0 = P.X(0), Y0 = P.Y(0);

  // Fig. 7.31: c − c_g is horizontal (dashed)

  arrowPx(ctx, X0, Y0, cX, cY, Viz.alpha(OR, 0.9), 6, 13);
  if (st.cg * vs > 2) arrowPx(ctx, X0, Y0, gX, gY, AC, 4, 11);
  // right-angle mark between c and c_g
  if (st.cg * vs > 14 && st.c * vs > 14) {
    const q = 10, e1 = [st.cx / st.c, -st.cz / st.c], e2 = [st.cgx / st.cg, -st.cgz / st.cg];
    linePx(ctx, [[X0 + q * e1[0], Y0 + q * e1[1]], [X0 + q * (e1[0] + e2[0]), Y0 + q * (e1[1] + e2[1])], [X0 + q * e2[0], Y0 + q * e2[1]]], TX, 1.4);

      const e = [st.cx / st.c, -st.cz / st.c], gside = st.cg > 0 ? [st.cgx / st.cg, -st.cgz / st.cg] : [e[1], -e[0]];
      Viz.text(ctx, 'c', X0 + 0.55 * (cX - X0) - 14 * gside[0], Y0 + 0.55 * (cY - Y0) - 14 * gside[1], { size: 13, color: OR, weight: 800, align: 'center', bg: true });
    }
    if (st.cg * vs > 16) Viz.text(ctx, 'c_g', gX + 14 * st.cgx / st.cg, gY - 14 * st.cgz / st.cg, { size: 13, color: AC, weight: 800, align: 'center', bg: true });
    if (!small) Viz.text(ctx, 'drag K · c, c_g on their own scale', P.px.x + 6, P.px.y + P.px.h - 12, { size: 12, color: MU, weight: 500, bg: true });
  }
}

/* ---- view 3: ω/N and |c_g|K/N against θ ------------------------------------------------------------------------------- */
function drawCurve(g, s) {

                            xlabel: small ? '' : 'θ = angle of K above the horizontal = beam from the vertical [°]', ylabel: 'ω/N,  |c_g|K/N' },
                       { xticks: [0, 15, 30, 45, 60, 75, 90], yticks: [0, 0.5, 1] });
  const th = st.theta_K_deg;
  P.clip(() => {
    P.line([th, th], [0, 1.1], { color: Viz.alpha(TX, 0.45), width: 1, dash: [3, 3] });
    P.fn(d => Math.sin(d * Math.PI / 180), { color: AC, width: 2.4 });

  if (!small) {

    Viz.text(ctx, '|c_g|K/N = sin θ', P.X(20), P.Y(Math.sin(20 * Math.PI / 180)) + 14, { size: 12, color: AC, weight: 650, bg: true });

}

function drawAll(g, s) { drawTank(g, s); drawK(g, s); drawCurve(g, s); }

/* ---- text builders ------------------------------------------------------------------------------------------------ */
function phaseEnergyWords(st) { return st.m > 0 ? { ph: 'up', en: 'down' } : { ph: 'down', en: 'up' }; }

  if (r === 'nearN') return { text: n ? `↕ ${v}° from vertical: columns bob, c_g small` : `↕ beams only ${v}° from the vertical (${h}° from the horizontal): columns bob, the energy barely moves`, tone: 'warn' };
  if (r === 'low') return { text: n ? `〰 beams ${v}° from vertical: nearly flat` : `〰 beams ${v}° from the vertical (${h}° from the horizontal): nearly flat, layered flow`, tone: 'info' };
  return { text: n ? `✳ beams ${v}° from vertical · phase ${pe.ph === 'up' ? '↑' : '↓'} ⇒ energy ${pe.en === 'up' ? '↑' : '↓'}` : `✳ beams ${v}° from the vertical (${h}° from the horizontal) · phase ${pe.ph} ⇒ energy ${pe.en}`, tone: 'good' };
}
function interpretText(s) {

  const head = `ω/N = ${f3(s.wN)}: `;
  if (r === 'nearN') return head + `$\\mathbf K$ is nearly horizontal, so the water moves nearly vertically, like the bobbing parcel of Ch. 1, and $|\\mathbf c_g| = N\\sin\\theta/K$ = ${spd(st.cg)} is small: the energy hardly leaves the source. At ω = N exactly it would not leave at all.`;

  return head + `the classic cross. In each beam the phase lines move across the beam while the energy moves along it; here the phase goes ${pe.ph} and the energy goes ${pe.en}, and the horizontal parts point the same way. The beam makes ${deg1(st.theta_K_deg)}° with the vertical at every |K|, so a source of one frequency radiates only along these four directions.`;
