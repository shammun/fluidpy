<meta name="viz:concept" content="Stokes&#x27; second problem: the periodic flow above a plate oscillating as U cos(omega t); the complex form turns the diffusion equation into i omega f = nu f&#x27;&#x27;, only the decaying root (1+i)/delta survives, and the Stokes layer is u = U exp(-y/delta) cos(omega t - y/delta) with delta = sqrt(2 nu/omega); the book&#x27;s depth 4 sqrt(nu/omega) is 2 sqrt(2) delta, where 5.9 % of the wall motion is left; crests climb at sqrt(2 nu omega) (C11)">

/* ---- start from rest: Crank–Nicolson in η = y/δ_e, τ = t/T (ch08.crank_nicolson_1d) ---------------------------- */
const CN = { N: 201, L: 20, steps: 800, per: 200 };

    cp[0] = c / b; dp[0] = rhs[0] / b;

    for (let i = n - 2; i >= 0; i--) u[i + 1] = dp[i] - cp[i] * u[i + 2];

/** u/U from rest at height η (linear interpolation between nodes), at the step nearest τ. */

/* ---- the explainer's state → every number on screen ------------------------------------------------------------- */
const SI = s => ({ U: s.U, omega: s.omega, nu: s.nu });

/* ---- formatting --------------------------------------------------------------------------------------------------- */
const f3 = v => Viz.fmt(v, { sig: 3 });
const f4 = v => Viz.fmt(v, { sig: 4 });
const t3 = v => Viz.tnum(v, 3);
const t4 = v => Viz.tnum(v, 4);
/** A length unit for a magnitude: [name, factor from metres]. */

function tL(m) { const [u, f] = lenUnit(m); return t3(m * f) + '\\ \\text{' + (u === 'µm' ? '}\\mu\\text{m' : u) + '}'; }
function fV(v) { if (!isFinite(v)) return '—'; const [u, f] = lenUnit(v); return f3(v * f) + ' ' + u + '/s'; }
const fT = t => Viz.fmtTime(t);
const pct = v => f3(100 * v) + ' %';
function lay() { const r = document.querySelector('.viz-app'); return r ? r.getAttribute('data-layout') : 'wide'; }

const PHASE_TEX = ['0', '\\pi/2', '\\pi', '3\\pi/2'];

/* ---- pixel helpers (local; ch08 siblings carry the same) ------------------------------------------------------------ */
function arrowPx(ctx, x0, y0, x1, y1, color, width = 2, head = 7) {
  const Ln = Math.hypot(x1 - x0, y1 - y0); if (Ln < 1) return;
  const ang = Math.atan2(y1 - y0, x1 - x0), hd = Math.min(head, Ln * 0.6);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - hd * 0.7 * Math.cos(ang), y1 - hd * 0.7 * Math.sin(ang)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - hd * Math.cos(ang - 0.42), y1 - hd * Math.sin(ang - 0.42));
  ctx.lineTo(x1 - hd * Math.cos(ang + 0.42), y1 - hd * Math.sin(ang + 0.42)); ctx.closePath(); ctx.fill(); ctx.restore();

/** Plot with the rotated y title in its own 18 px strip on views narrower than 420 px (ch01/ch05 lesson). */

  const P = v.plot(o);

  if (narrowV && yl) { const c = v.ctx; c.save(); c.font = Viz.font(12, 500); c.fillStyle = Viz.color('text-soft'); c.translate(9, P.px.y + P.px.h / 2); c.rotate(-PI / 2); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(yl, 0, 0); c.restore(); }

}

  ctx.strokeStyle = Viz.alpha(color, 0.6); ctx.lineWidth = 1.2; ctx.beginPath();

/** The vertical axis of the plate and profile views: y/δ_e, or metres (mm, cm, …) with the same 0 … 6 δ_e range. */
function axisInfo(n, s) {

/* ---- view 1: the plate and the fluid ------------------------------------------------------------------------------ */
const TRACERS = [0.3, 0.8, 1.3, 2, 2.8, 3.8, 5];
let PLP = null;
function drawPlate(g, s) {
  const v = g.view('plate'); v.clear(); PLP = null;
  if (v.w < 40 || v.h < 40) return;
  const n = N(s), A = axisInfo(n, s), ctx = v.ctx, small = v.w < 330 || v.h < 190, ph = n.ph;
  const BL = Viz.color('blue'), AC = Viz.color('accent'), RO = Viz.color('rose'), AM = Viz.color('amber'), TE = Viz.color('teal'), MU = Viz.color('muted'), TX = Viz.color('text');
  const P = gutterPlot(v, { xlim: [-1.45, 1.45], ylim: [-0.1 * A.top, A.top], pad: small ? { l: 40, r: 6, t: 6, b: 6 } : { l: 48, r: 10, t: 8, b: 8 }, ylabel: A.label },
    () => ({ grid: false, zeroLines: false, xticks: [], yticks: ticks0(A.top, small ? 3 : 5), xlabel: '' }));
  PLP = P;
  const Y = eta => P.Y(eta * A.f), X = x => P.X(x);
  const es = Viz.num.linspace(0, ETA_TOP * 1.05, 140);
  const xOf = e => (s.rest ? cnDisp(e, s.tau) : dispRel(e, ph));   // periodic state, or displacement from rest (CN)
  P.clip(() => {
    // the region the wall can reach: ±e^{−η} (grey), the rest position
    ctx.save(); ctx.beginPath();
    es.forEach((e, i) => { const px = X(Math.exp(-e)), py = Y(e); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
    for (let i = es.length - 1; i >= 0; i--) ctx.lineTo(X(-Math.exp(-es[i])), Y(es[i]));
    ctx.closePath(); ctx.fillStyle = Viz.alpha(MU, 0.09); ctx.fill(); ctx.restore();
    P.line(es.map(e => Math.exp(-e)), es.map(e => e * A.f), { color: MU, width: 1.1, dash: [5, 4], alpha: 0.8 });
    P.line(es.map(e => -Math.exp(-e)), es.map(e => e * A.f), { color: MU, width: 1.1, dash: [5, 4], alpha: 0.8 });
    P.line([0, 0], [0, A.top], { color: MU, width: 1, dash: [2, 4], alpha: 0.7 });
    // book depth and δ_e
    P.line([-1.45, 1.45], [BOOK_ETA * A.f, BOOK_ETA * A.f], { color: AM, width: 2, dash: [7, 5] });
    if (s.yax === 'phys') P.line([-1.45, 1.45], [A.f, A.f], { color: MU, width: 1, dash: [2, 3] });
    // probe height
    P.line([-1.45, 1.45], [n.eta * A.f, n.eta * A.f], { color: TE, width: 1.6, dash: [3, 3] });

      const len = P.sx(0.42 * u);
      if (Math.abs(len) > 3) arrowPx(ctx, X(x), py, X(x) + len, py, BL, small ? 1.6 : 2, small ? 5 : 7);
      ctx.save(); ctx.fillStyle = AC; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(X(x), py, small ? 3.5 : 4.5, 0, 2 * PI); ctx.fill(); ctx.stroke(); ctx.restore();
    });

    // probe marker on the dyed line
    ctx.save(); ctx.fillStyle = TE; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(xOf(n.eta)), Y(n.eta), 5.5, 0, 2 * PI); ctx.fill(); ctx.stroke(); ctx.restore();
  });

  ctx.save(); ctx.strokeStyle = TX; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(P.px.x, yb); ctx.lineTo(P.px.x + P.px.w, yb); ctx.stroke(); ctx.restore();

}
function plateTitle(s) {

/* ---- view 2: u(y, t) ------------------------------------------------------------------------------------------------ */
let PRP = null;
function drawProfile(g, s) {
  const v = g.view('profile'); v.clear(); PRP = null;
  if (v.w < 50 || v.h < 40) return;
  const n = N(s), A = axisInfo(n, s), ctx = v.ctx, small = v.w < 330 || v.h < 190, ph = n.ph;
  const BL = Viz.color('blue'), AM = Viz.color('amber'), TE = Viz.color('teal'), MU = Viz.color('muted'), OR = Viz.color('orange'), RO = Viz.color('rose'), TX = Viz.color('text');

      P.line(eg.map(e => B * Math.exp(e)), eg.map(e => e * A.f), { color: RO, width: 1.2, dash: [4, 4], alpha: 0.7 });
      P.line(eg.map(e => -B * Math.exp(e)), eg.map(e => e * A.f), { color: RO, width: 1.2, dash: [4, 4], alpha: 0.7 });
      P.line(eg.map(e => B * uGrow(e, ph)), eg.map(e => e * A.f), { color: RO, width: 2.4, dash: [2, 4] });
    }

    P.line([-1.15, 1.15], [n.eta * A.f, n.eta * A.f], { color: TE, width: 1.4, dash: [3, 3] });

    if (n.etaC <= ETA_TOP - 0.3) { const xr = Math.exp(-n.etaC) > 0.55; lab(ctx, 'crest ↑', P.X(Math.exp(-n.etaC)) + (xr ? -9 : 9), P.Y(n.etaC * A.f) - (xr ? 12 : 0), { color: BL, weight: 700, align: xr ? 'right' : 'left' }); }

}
function profileTitle(s) {
  const n = N(s);

  return `<b>u(y, t)</b> · <span class="c-blue">now</span> · <span class="c-muted">envelope ±e^(−y/δ_e); faint: ωt = 0, π/2, π, 3π/2</span> · <span class="c-teal">probe</span>${s.rest ? ' · <span class="c-orange">○ from rest</span>' : ''}`;

/* ---- view 3: u(t) at the wall and at the probe ---------------------------------------------------------------------- */
function drawClock(g, s) {
  const v = g.view('clock'); v.clear();
  if (v.w < 60 || v.h < 40) return;
  const n = N(s), ctx = v.ctx, shortV = v.h < 130, A = n.st.amplitude / n.S.U, phi = n.st.phase_lag;
  const RO = Viz.color('rose'), TE = Viz.color('teal'), OR = Viz.color('orange'), MU = Viz.color('muted');
  const P = gutterPlot(v, { xlim: [0, 4], ylim: [-1.2, 1.35], pad: { l: 50, r: 12, t: 8, b: shortV ? 22 : 34 }, xlabel: shortV ? '' : 't/T (periods)', ylabel: 'u/U' },
    () => ({ xticks: [0, 1, 2, 3, 4], yticks: [-1, 0, 1], xlabel: shortV ? '' : 't/T (periods)' }));
  const ts = Viz.num.linspace(0, 4, 481), tsNow = ts.filter(x => x <= s.tau + 1e-9).concat([s.tau]);
  const wall = x => Math.cos(2 * PI * x), probe = x => A * Math.cos(2 * PI * x - phi);
  P.clip(() => {
    P.line(ts, ts.map(wall), { color: RO, width: 1.4, alpha: 0.3 });

    P.line(tsNow, tsNow.map(wall), { color: RO, width: 2.6 });

/* ---- real Stokes layers ---------------------------------------------------------------------------------------------- */
const CASES = [
  ['plate 1 Hz in water', 2 * PI, 1e-6],
  ['M₂ tide, molecular ν', OMEGA_M2, 1e-6],
  ['M₂ tide, eddy ν', OMEGA_M2, 1e-2],
  ['sound 1 kHz in air', 2 * PI * 1e3, 1.5e-5],
  ['Ekman look-alike (f, eddy ν)', 1e-4, 1e-2]
];
function nearestCase(s) {
  let best = -1, d = 0.15;
  CASES.forEach(([, w, nu], i) => { const e = Math.abs(Math.log10(s.omega / w)) + Math.abs(Math.log10(s.nu / nu)); if (e < d) { d = e; best = i; } });
  return best;
}
function caseRows() { return CASES.map(([nm, w, nu]) => [nm, Viz.fmt(w, { sig: 3 }), Viz.fmt(nu, { sig: 2 }), fL(layer({ omega: w, nu }).delta_e)]); }

function interpText(s) {
  const n = N(s), L = n.L, k = nearestCase(s);
  let t = `Faster shaking or a less viscous fluid confines the layer (δ_e ∝ √(ν/ω)): here δ_e = ${fL(L.delta_e)}, and the wall is felt up to about 4√(ν/ω) = ${fL(L.delta_book)}. The lag grows by 1 rad per δ_e while the amplitude falls by e, so the profile looks like a wave climbing at √(2νω) = ${fV(L.phase_speed)} — but no restoring force acts: it is diffusion from a shaking wall.`;
  if (k === 4) t += ' This is not an Ekman layer: ω here is a shaking frequency. In Ch. 13 the Coriolis parameter f takes its place and the same (1 + i)/δ exponent makes the Ekman spiral.';
  else if (L.delta_e >= 1) t += ' Metres thick: with an eddy viscosity standing in for turbulence, this is the tidal bottom boundary layer of a shelf sea.';
  else if (L.delta_e < 2e-4) t += ' A fraction of a millimetre: an acoustic boundary layer. The viscous loss inside it is why a wall absorbs a little sound.';
  if (n.eta > BOOK_ETA) t += ` Your probe sits above the book's depth: less than 5.9 % of the wall's motion reaches it (${pct(n.st.amplitude / n.S.U)}).`;
  else if (n.eta > PI) t += ' Your probe is more than half a period late: for part of each cycle it moves against the wall.';
  return t;
}

/** A number as Python would print it (short): 1e-06 style below 1e-3 and above 1e5. */
function pn(v, k = 4) {
  const a = Math.abs(v); if (a < 1e-300) return '0';
  if (a < 1e-3 || a >= 1e5) { const [m, e] = v.toExponential(k - 1).split('e'); const E = Number(e); return String(Number(m)) + 'e' + (E < 0 ? '-' : '+') + String(Math.abs(E)).padStart(2, '0'); }
  return String(Number(v.toPrecision(k)));
}

/* ---- selftest: parity with fluidpy (py) and invariants (expect) --------------------------------------------------- */
function selftestRows() {
  const S0 = { U: 1.0, omega: 2 * PI, nu: 1e-6 }, Ssea = { U: 0.5, omega: OMEGA_M2, nu: 1e-2 }, Sair = { U: 0.0025, omega: 2 * PI * 1e3, nu: 1.5e-5 };

  const h = 1e-6, dt = 1e-5, y = 7e-4, t = 0.3;
  const ut = (uStokes(y, t + dt, S0) - uStokes(y, t - dt, S0)) / (2 * dt);
  const uyy = (uStokes(y + h, t, S0) - 2 * uStokes(y, t, S0) + uStokes(y - h, t, S0)) / (h * h);
  const cnU = n => `ch08.crank_nicolson_1d(np.zeros(201), np.linspace(0, 20, 201), 2*np.pi/200, ${n}, 0.5, np.cos, 0.0)`;
  return [
    { name: 'u Stokes layer, 1 Hz water, y = 1 mm, t = 0.3 s', js: uStokes(1e-3, 0.3, S0), py: 'ch08.stokes_second_problem(1e-3, 0.3, U=1.0, omega=2*np.pi, nu=1e-6)', rtol: 1e-12 },
    { name: 'u Stokes layer, 1 Hz water, y = 2.5 mm, t = 0.8 s', js: uStokes(2.5e-3, 0.8, S0), py: 'ch08.stokes_second_problem(2.5e-3, 0.8, U=1.0, omega=2*np.pi, nu=1e-6)', rtol: 1e-12 },
    { name: 'u Stokes layer, M2 tide eddy nu, y = 5 m, t = 3 h', js: uStokes(5, 10800, Ssea), py: 'ch08.stokes_second_problem(5.0, 10800.0, U=0.5, omega=2*np.pi/(12.42*3600), nu=1e-2)', rtol: 1e-12 },
    { name: 'u Stokes layer, 1 kHz air, y = 0.05 mm', js: uStokes(5e-5, 2e-4, Sair), py: 'ch08.stokes_second_problem(5e-5, 2e-4, U=0.0025, omega=2*np.pi*1e3, nu=1.5e-5)', rtol: 1e-12 },
    { name: 'envelope U e^(-y/de)', js: envelope(2e-3, { U: 0.1, omega: 2 * PI, nu: 1e-6 }), py: 'ch08.stokes_layer_envelope(2e-3, U=0.1, omega=2*np.pi, nu=1e-6)', rtol: 1e-12 },
    { name: 'layer delta_e', js: L0.delta_e, py: 'ch08.stokes_layer(1e-6, 2*np.pi)["delta_e"]', rtol: 1e-12 },
    { name: 'layer k', js: L0.k, py: 'ch08.stokes_layer(1e-6, 2*np.pi)["k"]', rtol: 1e-12 },
    { name: 'layer delta_book 4 sqrt(nu/omega)', js: L0.delta_book, py: 'ch08.stokes_layer(1e-6, 2*np.pi)["delta_book"]', rtol: 1e-12 },
    { name: 'layer ratio_book_to_e', js: L0.ratio_book_to_e, py: 'ch08.stokes_layer(1e-6, 2*np.pi)["ratio_book_to_e"]', rtol: 1e-14 },
    { name: 'layer phase_speed sqrt(2 nu omega)', js: L0.phase_speed, py: 'ch08.stokes_layer(1e-6, 2*np.pi)["phase_speed"]', rtol: 1e-12 },
    { name: 'layer wavelength', js: L0.wavelength, py: 'ch08.stokes_layer(1e-6, 2*np.pi)["wavelength"]', rtol: 1e-12 },
    { name: 'layer amplitude_at_delta_book', js: L0.amplitude_at_delta_book, py: 'ch08.stokes_layer(1e-6, 2*np.pi)["amplitude_at_delta_book"]', rtol: 1e-14 },
    { name: 'layer delta_e, M2 tide eddy nu', js: layer(Ssea).delta_e, py: 'ch08.stokes_layer(1e-2, 2*np.pi/(12.42*3600))["delta_e"]', rtol: 1e-12 },
    { name: 'layer delta_e, 1 kHz air', js: layer(Sair).delta_e, py: 'ch08.stokes_layer(1.5e-5, 2*np.pi*1e3)["delta_e"]', rtol: 1e-12 },
    { name: 'state time_lag (1 mm, 1 Hz)', js: ST.time_lag, py: 'ch08.stokes_layer_state(1e-6, 2*np.pi, 1e-3)["time_lag"]', rtol: 1e-12 },
    { name: 'state amplitude (1 mm, 1 Hz)', js: ST.amplitude, py: 'ch08.stokes_layer_state(1e-6, 2*np.pi, 1e-3)["amplitude"]', rtol: 1e-12 },
    { name: 'state phase_lag (1 mm, 1 Hz)', js: ST.phase_lag, py: 'ch08.stokes_layer_state(1e-6, 2*np.pi, 1e-3)["phase_lag"]', rtol: 1e-12 },
    { name: 'state period', js: ST.period, py: 'ch08.stokes_layer_state(1e-6, 2*np.pi, 1e-3)["period"]', rtol: 1e-14 },
    { name: 'state amplitude, tide 5 m, U = 0.5', js: sea.amplitude, py: 'ch08.stokes_layer_state(1e-2, 2*np.pi/(12.42*3600), 5.0, U=0.5)["amplitude"]', rtol: 1e-12 },
    { name: 'state crest_speed, tide', js: sea.crest_speed, py: 'ch08.stokes_layer_state(1e-2, 2*np.pi/(12.42*3600), 5.0, U=0.5)["crest_speed"]', rtol: 1e-12 },
    { name: 'Crank-Nicolson from rest, node 10, 4 periods', js: C.H[800][10], py: `${cnU(800)}[10]`, rtol: 1e-10 },
    { name: 'Crank-Nicolson from rest, node 30, 4 periods', js: C.H[800][30], py: `${cnU(800)}[30]`, rtol: 1e-10 },
    { name: 'Crank-Nicolson from rest, node 10, half a period', js: C.H[100][10], py: `${cnU(100)}[10]`, rtol: 1e-10 },
    { name: 'invariant: book depth amplitude e^(-4/sqrt2)', js: Math.exp(-4 * Math.sqrt(1 / 2)) - state(layer(S0).delta_book, S0).amplitude, expect: 0, atol: 1e-14 },
    { name: 'invariant: complex route = real formula', js: uComplex(1e-3, 0.3, S0) - uStokes(1e-3, 0.3, S0), expect: 0, atol: 1e-14 },

    { name: 'invariant: residual of the diffusion equation by finite differences', js: (ut - 1e-6 * uyy) / Math.abs(ut), expect: 0, atol: 1e-4 },
    { name: 'invariant: crest speed = omega delta_e', js: L0.phase_speed / (2 * PI * L0.delta_e), expect: 1, rtol: 1e-14 },
    { name: 'invariant: march from rest within 0.1 % after 4 periods', js: cnErrAt(4), expect: 0, atol: 1e-3 }
  ];
}
