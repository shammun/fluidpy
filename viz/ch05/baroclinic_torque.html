  { q: 'Lock exchange: what happens as δ → 0?', a: 'The rate grows as 1/δ (slope −1 on the log axes), but the tank\'s circulation rate $\\bar\\rho gH(1/\\rho_1-1/\\rho_2)$ does not change: the same circulation is squeezed into a thinner layer — a vortex sheet forms.', set: { mode: 'lock', delta: 0.01 } }
];

/* ---- selftest: parity with fluidpy.ch05 (py) and invariants (expect) --------------------------------------------------- */
function selftestRows() {
  const E0 = element({ R: 0.01, grho: 10, theta: 90 }), E1 = element({ R: 0.1, grho: 10, theta: 180 / PI });
  const PT1 = 'ch05.pressure_torque_on_element(radius=0.1, grad_rho=(10*np.sin(1.0), -10*np.cos(1.0)))';
  const LF = 'ch05.lock_exchange_fields()';
  return [
    { name: 'spin R 1 cm', js: E0.spin, py: 'ch05.pressure_torque_on_element()["spin_up"]', rtol: 1e-9 },
    { name: 'torque R 1 cm', js: E0.torque, py: 'ch05.pressure_torque_on_element()["torque"]', rtol: 1e-6 },
    { name: 'x_G R 1 cm', js: E0.xG[0], py: 'ch05.pressure_torque_on_element()["x_G"][0]', rtol: 1e-6 },
    { name: 'I_G R 1 cm (exact)', js: E0.IG, py: 'ch05.pressure_torque_on_element()["I_G"]', rtol: 1e-9 },
    { name: 'pressure force up', js: E0.F[1], py: 'ch05.pressure_torque_on_element()["force"][1]', rtol: 1e-9 },
    { name: 'mass of the disc', js: E0.mass, py: 'ch05.pressure_torque_on_element()["mass"]', rtol: 1e-9 },
    { name: 'oblique 1 rad, R 10 cm: spin', js: E1.spin, py: PT1 + '["spin_up"]', rtol: 1e-8 },
    { name: 'oblique 1 rad, R 10 cm: ratio', js: E1.ratio, py: PT1 + '["ratio"]', rtol: 1e-9 },
    { name: 'oblique 1 rad, R 10 cm: torque', js: E1.torque, py: PT1 + '["torque"]', rtol: 1e-6 },
    { name: 'baroclinic formula', js: baroRate([10, 0], [0, -9810], 1000), py: 'ch05.baroclinic_rate_2d([10.0, 0.0], [0.0, -9810.0], 1000.0)', rtol: 1e-12 },
    { name: 'sea breeze spin (scenario)', js: element({ R: 0.01, grho: 4e-7, theta: 90, rho0: 1.2 }).spin, py: 'ch05.baroclinic_element_scenario(tilt=np.pi/2, grad_rho=4e-7, R=0.01, rho0=1.2)["spin_up"]', rtol: 1e-9 },
    { name: 'element scenario offset at 30 deg', js: element({ R: 0.05, grho: 5, theta: 30 }).xG[0], py: 'ch05.baroclinic_element_scenario(tilt=np.pi/6, grad_rho=5.0, R=0.05)["offset"][0]', rtol: 1e-12 },
    { name: 'lock rate fresh/salt', js: lockRate(1000, 1025, 0.1), py: 'ch05.lock_exchange_initial_vorticity_rate(1000.0, 1025.0, 0.1)', rtol: 1e-12 },
    { name: 'lock rate sharp front', js: lockRate(1000, 1025, 0.01), py: 'ch05.lock_exchange_initial_vorticity_rate(1000.0, 1025.0, 0.01)', rtol: 1e-12 },
    { name: 'lock field source at x 3 cm', js: lockField(0.03, 0.5, {}).bz, py: `ch05.baroclinic_rate_2d(${LF}["grad_rho"](0.03, 0.5), ${LF}["grad_p"](0.03, 0.5), ${LF}["rho"](0.03, 0.5))`, rtol: 1e-12 },
    { name: 'lock field density at x 3 cm', js: lockField(0.03, 0.5, {}).rho, py: `${LF}["rho"](0.03, 0.5)`, rtol: 1e-14 },
    { name: 'lock source by stencils (h 1e-4)', js: lockField(0.03, 0.5, {}).bz, py: `ch05.baroclinic_term(${LF}["rho_fn"], ${LF}["p_fn"], np.array([0.03, 0.5]))[2]`, rtol: 1e-5 },
    { name: 'tank circulation rate (trapz)', js: lockCirc(1000, 1025, 0.1), py: `${LF}["circulation_rate"]`, rtol: 1e-9 },
    { name: 'invariant: barotropic no torque', js: element({ R: 0.05, grho: 20, theta: 0 }).torque, expect: 0, atol: 1e-15 },
    { name: 'invariant: top-heavy no torque', js: element({ R: 0.05, grho: 20, theta: 180 }).torque, expect: 0, atol: 1e-15 },
    { name: 'invariant: routes agree at R 1 mm', js: element({ R: 0.001, grho: 10, theta: 60 }).ratio - 1, expect: 0, atol: 1e-10 },
    { name: 'invariant: dense side left spins ccw', js: Math.sign(element({ R: 0.01, grho: 10, theta: 270 }).spin), expect: 1, atol: 0 },
    { name: 'invariant: interface peak equals D07', js: lockField(0, 0.5, {}).bz / lockRate(1000, 1025, 0.1) - 1, expect: 0, atol: 1e-12 },
    { name: 'invariant: circulation closed form vs trapz', js: lockCircExact(1000, 1025, 0.1) / lockCirc(1000, 1025, 0.1) - 1, expect: 0, atol: 1e-10 }
  ];
}

/* ---- the app ----------------------------------------------------------------------------------------------------------- */
const CTRL = { element: ['theta', 'grho', 'R', 'fluid'], lock: ['drho', 'delta'] };
const RDS = { element: ['off', 'torque', 'spin', 'baro'], lock: ['lock', 'circ'] };
const CFG = {
  title: 'How can density make fluid spin?',
  subtitle: 'A small fluid disc where isobars and isopycnals cross: the pressure force misses the centre of mass and spins it up at (∇ρ×∇p)/ρ² — then the same torque tips over a lock exchange',
  autoplay: false,
  params: {
    theta: { label: 'Angle θ from ∇p to ∇ρ', min: 0, max: 360, step: 1, value: 90, unit: '°', help: '0° heavy below (stable), 90° dense side right, 180° heavy on top; or drag in the picture' },
    grho: { label: 'Density gradient $|\\nabla\\rho|$', min: 1e-7, max: 50, log: true, value: 10, unit: 'kg/m⁴', help: 'log slider: 4×10⁻⁷ is a sea breeze, 10 a salty lab tank' },
    R: { label: 'Element radius $R$', min: 0.001, max: 0.5, log: true, value: 0.01, fmt: v => fmtLen(v), help: 'log slider; the spin-up rate does not depend on R' },
    fluid: { type: 'select', label: 'Fluid', options: [['water', 'water ρ₀ 1000'], ['air', 'air ρ₀ 1.2']], value: 'water', display: 'chips', help: 'sets ρ₀ [kg/m³]' },
    drho: { label: 'Contrast $\\rho_2-\\rho_1$', min: 0.5, max: 50, step: 0.5, value: 25, unit: 'kg/m³', help: 'heavy fluid on the left; ρ₁ = 1000 kg/m³' },
    delta: { label: 'Interface thickness $\\delta$', min: 0.01, max: 0.5, log: true, value: 0.1, fmt: v => fmtLen(v), help: 'log slider' },
    tau: { label: 'time $t/t_{20}$', min: 0, max: 1, step: 'any', value: 0, optional: true, fmt: v => Viz.fmtTime(v * N(CUR).tEnd) }
  },
  modes: { param: 'mode', label: 'System', options: [['element', 'fluid element'], ['lock', 'lock exchange']] },
  transport: { param: 'tau', min: 0, max: 1, rate: 0.25, end: 'hold', hold: 2, label: 'time', unit: 's' },
  presets: [
    { label: 'crossed 90°', set: { mode: 'element', theta: 90, grho: 10, R: 0.01, fluid: 'water', tau: 0 }, title: 'dense side on the right: clockwise' },
    { label: 'stable 0°', set: { mode: 'element', theta: 0, fluid: 'water', tau: 0 }, title: 'barotropic: heavy below, no torque' },
    { label: 'top-heavy 180°', set: { mode: 'element', theta: 180, fluid: 'water', tau: 0 }, title: 'barotropic but unstable: no torque' },
    { label: 'sea breeze', set: { mode: 'element', theta: 90, fluid: 'air', grho: 4e-7, R: 0.01, tau: 0 }, title: '5 K over 50 km in air, sea on the right' },
    { label: 'fresh/salt lock', set: { mode: 'lock', drho: 25, delta: 0.1, tau: 0 }, title: '1025 | 1000 kg/m³, δ = 10 cm' },
    { label: 'sharp front', set: { mode: 'lock', drho: 25, delta: 0.01, tau: 0 }, title: 'δ = 1 cm: ten times the rate' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'off', label: 'Offset of G', value: s => N(s).el.off, fmt: x => fmtLen(x) },
    { id: 'torque', label: 'Torque about G', unit: 'N m/m', value: s => N(s).el.torque, fmt: x => Viz.fmt(x, { sig: 3, keepTiny: true, unit: 'N m/m' }) },
    { id: 'spin', label: 'Spin-up (torque)', unit: '1/s²', value: s => (N(s).el.valid ? N(s).el.spin : NaN), fmt: x => Viz.fmt(x, { sig: 4, keepTiny: true, unit: '1/s²' }) },
    { id: 'baro', label: '$(\\nabla\\rho\\times\\nabla p)/\\rho^2$', unit: '1/s²', value: s => N(s).el.baro, fmt: x => Viz.fmt(x, { sig: 4, keepTiny: true, unit: '1/s²' }) },
    { id: 'lock', label: 'Interface rate', unit: '1/s²', value: s => N(s).lk },
    { id: 'circ', label: 'Tank $d\\Gamma/dt$', unit: 'm²/s²', value: s => N(s).circ },
    { id: 'omt', label: 'Vorticity now', unit: '1/s', value: s => N(s).omt }
  ],
  terms: { title: 'Terms of Dω/Dt at t = 0⁺ (fluid at rest)', unit: '1/s²',
    items: [
      { id: 'stt', label: 'stretching + tilting $(\\boldsymbol\\omega+2\\boldsymbol\\Omega)\\cdot\\nabla\\mathbf u$', color: Viz.color('teal'), value: () => 0 },
      { id: 'bar', label: 'baroclinic $\\frac1{\\rho^2}\\nabla\\rho\\times\\nabla p$', color: Viz.color('orange'), value: s => N(s).rate },
      { id: 'dif', label: 'diffusion $\\nu\\nabla^2\\boldsymbol\\omega$', color: Viz.color('rose'), value: () => 0 }
    ],
    total: { label: '$D\\omega_z/Dt$' } },
  stage: {
    rows: [1.3, 1],
    views: [
      { id: 'main', row: 0, flex: 1, title: s => mainTitle(s) },
      { id: 'curve', row: 1, flex: 1.1, title: s => curveTitle(s) },
      { id: 'aux', row: 1, flex: 1, hidePortrait: true, title: s => auxTitle(s) }
    ],
    draw(g, s) { CUR = s; if (s.mode === 'lock') drawTank(g, s); else drawDisc(g, s); drawCurve(g, s); drawAux(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel' || ev.type === 'pointerleave') { const was = !!DRAG; DRAG = null; return was; }
      if (ev.viewId !== 'main' || !MAIN.P) return false;
      const P = MAIN.P, wx = P.ix(X), wy = P.iy(Y);
      const setTheta = () => { const phi = Math.atan2(wy, wx) * 180 / PI; g.app.set({ theta: Math.round((((phi + 90) % 360) + 360) % 360) }); };
      if (s.mode !== 'lock' && MAIN.mode === 'element') {
        if (ev.type === 'pointermove') { if (DRAG !== 'rot') return false; setTheta(); return true; }
        if (ev.type !== 'pointerdown') return false;
        const r = Math.hypot(wx, wy);
        if (Math.abs(r - MAIN.Rd) < 0.22 * MAIN.Rd) { g.app.set({ ip: Math.round(Math.atan2(wy, wx) * 180 / PI) }); return true; }
        DRAG = 'rot'; g.app.play(false); setTheta(); return true;
      }
      if (ev.type !== 'pointerdown' || !P.inside(X, Y)) return false;
      g.app.set({ lx: Math.max(-1, Math.min(1, wx)), ly: Math.max(0, Math.min(1, wy)) }); return true;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Element: click a point on the rim to see its push worked out; drag inside or outside the disc to turn the dense side toward the pointer. Lock: click the tank.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Pick the element or the lock exchange above the picture. Drag in the disc to turn the dense side; click the rim to inspect one push.',
    controls: ['theta', 'grho', 'R', 'fluid', 'drho', 'delta'],
    readouts: ['off', 'torque', 'spin', 'baro', 'lock', 'circ'],
    callouts: [{ kind: 'try', html: 'Sweep θ from 0° to 360°: the orange dot and the ◇ ride the same sine. Then shrink R: the rate stays, only the torque shrinks as R⁴.' }]
  },
  explain: {
    html: s => explainHtml(s),
    live: s => { const n = N(s); return { t: Viz.fmtTime(n.t), w: Viz.fmt(n.omt, { sig: 3 }), ang: Viz.fmt(n.ang * 180 / PI, { sig: 3 }) }; }
  },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => { if (key === 'mode') { applyMode(a); a.fit(); } }
};
function applyMode(a) {
  const m = a.state.mode === 'lock' ? 'lock' : 'element';
  Object.keys(CTRL).forEach(k => CTRL[k].forEach(p => document.querySelectorAll('.viz-side [data-viz-key="param:' + p + '"]').forEach(el => el.classList.toggle('bt-off', k !== m))));
  Object.keys(RDS).forEach(k => RDS[k].forEach(r => document.querySelectorAll('.viz-side [data-viz-key="readout:' + r + '"]').forEach(el => el.classList.toggle('bt-off', k !== m))));
}
const app = Viz.app(CFG);
CUR = app.state;
applyMode(app); app.fit();
</script>
</body>
</html>
