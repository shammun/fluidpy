    { name: 'transient stretching R=1mm t=1', js: trn.str, py: VB + '.stretching_tilting[2]', rtol: 1e-5 },

/* ---- the app ----------------------------------------------------------------------------------------------------------- */
const CTRL = { lin: ['rate', 'ang', 'line'], burgers: ['rate', 'nu', 'probe', 'sig0'], custom: ['g1', 'g2', 'g3', 'ang', 'line'] };
const RDS = { lin: ['rate_s', 'gain', 'turn'], burgers: ['core', 'sig', 'peak'] };
let SETKEYS = null;
const CFG = {
  title: 'How can a flow spin fluid faster without a torque?',
  subtitle: 'A vortex line rides a chosen flow: stretching (purple) spins it up, tilting (blue) turns it, both vanish in 2-D; in Burgers\' vortex viscosity (rose) balances stretching',
  autoplay: false,
  params: {
    rate: { label: 'Strain rate α (or s)', min: -1, max: 2, step: 0.05, value: 1, unit: '1/s', help: 'axial and Burgers: α; shear and planar: s; negative = compression' },
    ang: { label: 'Initial tilt of ω from z', min: 0, max: 90, step: 1, value: 0, unit: '°', help: 'turned toward x; straight line only' },
    line: { type: 'select', label: 'Vortex line', options: [['straight', 'straight'], ['helix', 'curved (helix)']], value: 'straight', display: 'chips', optional: true, help: 'a curved line shows the natural frame e_s, e_n, e_m' },
    nu: { label: 'Viscosity $\\nu$', min: 1e-7, max: 1e-4, log: true, value: 1e-6, unit: 'm²/s', fmt: v => Viz.fmt(v, { sig: 2, unit: 'm²/s' }), help: 'log slider; water 10⁻⁶ m²/s' },
    probe: { label: 'Probe radius $R$', min: 0, max: 8, step: 0.05, value: 1, unit: 'mm', help: 'where the term bars are evaluated; or click the profile' },
    sig0: { label: 'Start core $\\sigma_0$', min: 0.5, max: 8, step: 0.1, value: 4, unit: 'mm', optional: true, help: 'the Gaussian core at t = 0' },
    g1: { label: 'Stretch along z', min: -1, max: 2, step: 0.05, value: 1, unit: '1/s', help: 'diag(−g/2, −g/2, g)' },
    g2: { label: 'Shear w = s x', min: -1, max: 1.5, step: 0.05, value: 0.5, unit: '1/s' },
    g3: { label: 'Rotation about z', min: -1, max: 1, step: 0.05, value: 0, unit: 'rad/s' },
    t: { label: 'time $t$', min: 0, max: TMAX, step: 'any', value: 0, unit: 's', optional: true }
  },
  modes: { param: 'flow', label: 'Flow', options: [['axial', 'axial'], ['shear', 'shear'], ['planar', 'planar 2-D'], ['burgers', 'Burgers'], ['custom', 'custom']] },
  transport: { param: 't', min: 0, max: TMAX, rate: 0.5, end: 'hold', hold: 1.5, label: 'time', unit: 's' },
  presets: [
    { label: 'skater', set: { flow: 'axial', rate: 1, ang: 0, line: 'straight', t: 0 }, title: 'axial stretch along ω: |ω| × e^{αt}' },
    { label: 'stretch at 45°', set: { flow: 'axial', rate: 1, ang: 45, line: 'straight', t: 0 }, title: 'stretching and tilting at once' },
    { label: 'shear tilt', set: { flow: 'shear', rate: 1, ang: 90, line: 'straight', t: 0 }, title: 'w = s x turns ω_x into ω_z' },
    { label: 'flat 2-D', set: { flow: 'planar', rate: 1, ang: 0, line: 'straight', t: 0 }, title: 'ω ⟂ plane: nothing happens' },
    { label: 'curved line', set: { flow: 'axial', rate: 1, line: 'helix', t: 0 }, title: 'a helical vortex line with its natural frame' },
    { label: 'compression', set: { flow: 'axial', rate: -0.5, ang: 0, line: 'straight', t: 0 }, title: 'squashed along ω: spins down' },
    { label: 'Burgers', set: { flow: 'burgers', rate: 1, nu: 1e-6, probe: 1, sig0: 4, t: 0 }, title: 'stretching balanced by diffusion' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'rate_s', label: 'Stretch rate e_s·Ge_s', unit: '1/s', value: s => (isB(s) ? NaN : lin(s, s.t).sp.rate), fmt: x => Viz.fmt(x, { sig: 3, unit: '1/s' }) },
    { id: 'gain', label: 'Growth |ω|/|ω₀|', value: s => (isB(s) ? NaN : lin(s, s.t).gain), fmt: x => '×' + Viz.fmt(x, { sig: 3 }) },
    { id: 'turn', label: 'Turned since t = 0', unit: '°', value: s => (isB(s) ? NaN : lin(s, s.t).turn), fmt: x => Viz.fmt(x, { sig: 3 }) + '°' },
    { id: 'core', label: 'Core √(4ν/α)', value: s => (s.rate > 0 ? burgersCore(s.rate, s.nu) : NaN), fmt: x => mmf(x) },
    { id: 'sig', label: 'Core now σ(t)', value: s => burg(s, s.t).sig, fmt: x => mmf(x) },
    { id: 'peak', label: 'Peak ω_z now', unit: '1/s', value: s => burg(s, s.t).peak, fmt: x => Viz.fmt(x, { sig: 3, unit: '1/s' }) }
  ],
  stage: {
    rows: [1.3, 1],
    views: [
      { id: 'scene', row: 0, flex: 1, title: s => sceneTitle(s) },
      { id: 'growth', row: 1, flex: 1.1, title: s => growthTitle(s) },
      { id: 'bars', row: 1, flex: 1, title: s => barsTitle(s) }
    ],
    draw(g, s) { CUR = s; drawScene(g, s); drawGrowth(g, s); drawBars(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel' || ev.type === 'pointerleave') {
        const d = DRAG; DRAG = null; if (!d) return false;
        if (ev.type === 'pointerup' && d.moved < 5 && d.view === 'scene' && SCENE.mark && Math.hypot(X - SCENE.mark.x, Y - SCENE.mark.y) < 26 && !isB(s)) g.app.set({ insp: s.insp ? 0 : 1 });
        return true;
      }
      if (ev.type === 'pointermove') {
        if (!DRAG || DRAG.view !== 'scene') return false;

        const xv = GROW.P.ix(X);

        else { g.app.play(false); g.app.set({ t: Math.max(0, Math.min(TMAX, xv)) }); }
        return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click the dot on the vortex line to see G e_s, the stretching rate and the two parts worked out (Burgers: move the probe).',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Pick a flow above the picture, press ▶, drag the 3-D view to orbit, click the dot for the arithmetic.',
    controls: ['rate', 'ang', 'line', 'nu', 'probe', 'sig0', 'g1', 'g2', 'g3'],
    readouts: ['rate_s', 'gain', 'turn', 'core', 'sig', 'peak'],
    callouts: [{ kind: 'try', html: 'Axial strain: sweep the tilt from 0° to 90°. At 0° pure stretching; at 90° the line is squashed ($e^{-\\alpha t/2}$); in between it turns toward z.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => {
    if (key === 'flow') {

      }
      applyMode(a); a.fit();
    }
  }
};
function applyMode(a) {
  const f = a.state.flow, m = f === 'burgers' ? 'burgers' : f === 'custom' ? 'custom' : 'lin';
  const shown = new Set(CTRL[m]);
  const allC = new Set([].concat(CTRL.lin, CTRL.burgers, CTRL.custom));
  allC.forEach(p => document.querySelectorAll('.viz-side [data-viz-key="param:' + p + '"]').forEach(el => el.classList.toggle('vst-off', !shown.has(p))));
  const rm = m === 'burgers' ? 'burgers' : 'lin';
  Object.keys(RDS).forEach(k => RDS[k].forEach(r => document.querySelectorAll('.viz-side [data-viz-key="readout:' + r + '"]').forEach(el => el.classList.toggle('vst-off', k !== rm))));
}
const app = Viz.app(CFG);
{ const _set = app.set; app.set = function (k, v) { const prev = SETKEYS; SETKEYS = typeof k === 'object' && k ? Object.keys(k) : [k]; try { return _set.call(app, k, v); } finally { SETKEYS = prev; } }; }
CUR = app.state;
applyMode(app); app.fit();
