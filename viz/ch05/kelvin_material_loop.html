      W.line('$\\partial\\Gamma/\\partial t=-\\Gamma_0e^{-q}q/(t+t_0)$, $q=r^2/4\\nu(t+t_0)$', LV('dGLO') + ' m²/s²', 'equals the viscous loop integral above: that is (5.11), $' + EQ.k511 + '$');
  } else if (f === 'baroclinic') {

      W.line('$-\\oint_C\\frac{dp}{\\rho}=\\bar\\rho g\\,s\\Big(\\frac1{\\rho_{\\text{right}}}-\\frac1{\\rho_{\\text{left}}}\\Big)$', fz(BC.rb * BC.g * BC.side, 5) + ' × (' + fz(1 / rp, 6) + ' − ' + fz(1 / rm, 6) + ') = ' + fz(R.rate, 4) + ' m²/s²', 'dp = −ρ̄g dy only on the vertical sides; ρ differs there') +
      W.line('Stokes: $\\int_A\\frac{(\\nabla\\rho\\times\\nabla p)_z}{\\rho^2}dA$', fz(fluxRoute('baroclinic', p), 6) + ' m²/s²', 'the same number from the area: crossed isobars and isopycnals') +
      W.say('Here p and ρ are both single-valued, yet the integral is not zero: the book\'s “single valued” is not enough; what makes $\\oint dp/\\rho$ vanish is $\\rho=\\rho(p)$, because then $dp/\\rho=d\\mathcal P$ is exact.');

      W.line('$\\Gamma_a=\\Gamma+2\\Omega A_z$ with $\\Omega=' + tz(p.Om, 3) + '$ rad/s', LV('Ga') + ' m²/s', 'flat: $' + EQ.ga + '$ (5.33)') +
      W.line('closed form $\\Gamma=2\\Omega A_0(1-e^{-\\alpha t})$', LV('Gcl') + ' m²/s', 'what fluidpy returns');
  } else if (f === 'fixed') {
    o += W.step(5, 'Why a fixed loop changes') +
      W.line('for a loop fixed in space $\\frac{d\\Gamma}{dt}=\\oint_C\\frac{\\partial u_i}{\\partial t}dx_i$', LV('meas') + ' m²/s²', 'the loop does not move, so only ∂u/∂t counts; the cells drift at c = 0.5 m/s') +
      W.line('the dashed purple material loop', fz(R.Gmat, 4) + ' m²/s, always', 'Kelvin: same particles, same Γ');
  } else if (f === 'helmholtz') {
    o += W.step(5, 'Helmholtz: still on the wall') +
      W.line('flux through a loop of the same area facing ω: $|\\omega|A$', LV('wA') + ' m²/s', 'what the loop would carry if it wrapped the tube') +
      W.line('Γ of the painted loop', LV('G') + ' m²/s', 'zero at t = 0 (ω·n = 0 on the wall) and still zero: the loop never leaves a tube wall');

  o += W.interpret(readingLive(f, s), 'Reading the current setting');

}
function readingLive(f, s) {
  switch (f) {
    case 'cellular': return 'The loop is now ×' + LV('str') + ' longer and wound into a spiral, yet on balance its fluid is never pushed along it: pressure and gravity are exact differentials round the loop, so Γ is frozen. That is Kelvin.';
    case 'rankine': return 'Part of the loop lies in the spinning core, part outside it; the shear winds it up, but Γ stays twice the area of the core inside the loop (core vorticity 2 s⁻¹).';
    case 'viscous': return 'Vorticity diffuses outward through the loop: the net viscous force along the loop points backwards, so Γ leaks away. Try a larger ν.';
    case 'baroclinic': return 'Density changes sideways while pressure changes vertically, so ρ is not a function of p and the pressure makes circulation from rest: the interface starts to tumble, heavy fluid under light.';
    case 'rotating': return 'In the turning frame the Coriolis force does net work round the shrinking loop: Γ grows, but Γₐ = Γ + 2ΩA stays flat (the frame\'s spin is traded for relative spin, the start of Ch. 13\'s potential vorticity).';
    case 'fixed': return 'Different fluid, with different vorticity, streams through a loop held still, so its Γ swings although the flow is ideal. Kelvin is about loops made of the same particles.';
    case 'helmholtz': return 'The loop was painted on a vortex tube wall: no vorticity pierces it, and Kelvin keeps its zero while the tube narrows and stretches. So it is still on a tube wall: vortex lines move with the fluid.';
  }
  return '';
}
function explainLive(s) {
  const M = current(s), tr = M.terms, F = x => fz(x, 4);
  const o = { t: fz(M.t, 4), G: F(M.G), dG: fz(M.G - M.G0, 3), L: F(M.len), str: fz(M.len / M.len0, 3), A: F(M.A[2]), acc: fz(tr.acceleration, 3), con: fz(tr.contour, 2),
    pr: fz(tr.pressure, 3), bo: fz(tr.body, 2), vi: fz(tr.viscous, 4), co: fz(tr.coriolis, 4), sum: fz(M.flow === 'fixed' ? tr.total : tr.total, 4), meas: fz(M.meas, 4) };
  if (M.flow === 'viscous') { o.GLO = fz(M.LOc[0], 6); o.dGLO = fz(M.LOc[1], 5); o.tt = fz(M.t + LO.t0, 4); }
  if (M.flow === 'rotating') { o.Ga = F(M.Ga); o.Gcl = F(2 * M.p.Om * PI * ROT.r0 * ROT.r0 * (-Math.expm1(-ROT.al * M.t))); }
  if (M.flow === 'helmholtz') { o.Rw = F(M.Rw); o.wA = fz(M.wA, 3); }
  return o;
}

  const f = flowOf(a.state), keep = { loopr: !!USES_R[f], nu: f === 'viscous', Om: f === 'rotating' };
  Object.keys(keep).forEach(k => document.querySelectorAll('.viz-side [data-viz-key="param:' + k + '"]').forEach(el => el.classList.toggle('kml-off', !keep[k])));
  document.querySelectorAll('.viz-side [data-viz-key="readout:Ga"]').forEach(el => el.classList.toggle('kml-off', f !== 'rotating'));
}
Object.assign(CFG, { derivations: DERIV, code: CODE, tour: TOUR, equations: EQS, check: QUIZ, selftest: selftestRows });
const app = Viz.app(CFG);
if (FLOWS.indexOf(app.state.flow) < 0) app.set('flow', 'cellular');
applyFlow(app); app.fit();

</script>
