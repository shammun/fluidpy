/* ---- inspector: the pressure at a clicked point, worked out ---------------------------------------------------------- */
function inspectHtml(s) {

  }

    return at + `:<br>$\\begin{aligned}p-p_\\infty&=-\\frac{\\rho\\Gamma^2}{8\\pi^2r^2}-\\rho gz\\\\&=-\\frac{(${t4(rho)})(${t3(Gam)})^2}{8\\pi^2(${t3(r)})^2}\\\\&\\quad-(${t4(rho)})(9.81)(${t3(z)})\\\\&=${t4(-A)}${-B >= 0 ? '+' : '-'}${t4(Math.abs(B))}=\\mathbf{${t4(-A - B)}}\\ \\text{Pa}\\end{aligned}$`;

function realRow(s) { if (s.mode === 'tank') return Math.abs(s.Om - 5) < 0.05 ? 1 : 0; if (s.mode === 'line') return 2; if (s.mode === 'rankine' && s.fluid === 'air') return s.Gamma > 2000 ? 4 : 3; return -1; }
function explainHtml(s) {
  const W = Viz.work, n = N(s), sc = n.sc, F = n.F, rho = F.rho, mu = F.mu, r = n.r, k = s.mode, water = s.fluid !== 'air';
  let o = W.step(0, 'What the views show') +
    W.say(`<b>The vortex in cross-section</b>: the <b class="c-teal">${water ? 'free surface' : 'isobar through the reference point'}</b>, <b class="c-orange">isobars</b> (dashed) over an orange wash of $p$, and the probe (small square) at radius $r$. <b>Along r</b> plots the swirl <b class="c-teal">$u_\\theta$</b>, the Bernoulli function <b class="c-amber">$B$</b> and the viscous stress <b class="c-rose">$\\sigma_{r\\theta}$</b>, each divided by its largest value.`) +
    W.hint('<b>Forces on the probe</b> (hidden on phones) shows the element from above with the stresses on its faces; its bars are also in Explore.');
  // 1. swirl
  o += W.step(1, 'The swirl at the probe, $r = ' + texLen(r) + '$');
  if (k === 'tank') o += W.line('$\\omega = 2\\Omega = 2\\times' + t3(s.Om) + '$', f3(n.omega) + ' 1/s', 'the vorticity is twice the tank\'s rotation rate (the book\'s tank figure writes "2ω": a slip)') +
    W.box('$u_\\theta=\\omega r/2$ (5.1) $=' + t3(n.omega) + '\\times' + t3(r) + '/2=\\mathbf{' + t3(sc.u_theta) + '}$ m/s');
  else if (k === 'line') o += W.box('$u_\\theta=\\Gamma/2\\pi r$ (5.2) $=' + t3(n.Gam) + '/(2\\pi\\times' + t3(r) + ')=\\mathbf{' + t3(sc.u_theta) + '}$ m/s');
  else {
    if (k === 'cylinder') o += W.line('$\\Gamma=\\pi a^2\\omega=\\pi(' + t3(n.a) + ')^2(' + t3(n.omega) + ')$', f3(n.Gam) + ' m²/s', 'the rod turns at Ω = ω/2 and drags the fluid with it (no slip at r = a)');
    o += r <= n.a ? W.box((k === 'cylinder' ? 'inside the rod: ' : 'inside the core: ') + '$u_\\theta=\\Gamma r/2\\pi a^2=\\mathbf{' + t3(sc.u_theta) + '}$ m/s (rigid, like the tank)')
      : W.box('outside the core: $u_\\theta=\\Gamma/2\\pi r$, the line vortex $u_\\theta=\\Gamma/2\\pi r$ (5.2): $\\mathbf{' + t3(sc.u_theta) + '}$ m/s');
  }
  // 2. push
  o += W.step(2, 'The inward push it needs') +
    W.line('$u_\\theta^2/r=(' + t3(sc.u_theta) + ')^2/' + t3(r) + '$', f3(sc.centripetal) + ' m/s²', 'every parcel on a circle is accelerating toward the axis at this rate');
  // 3. pressure gradient
  o += W.step(3, 'The pressure gradient that supplies it') +
    W.line('$\\partial p/\\partial r=\\rho u_\\theta^2/r=' + t4(rho) + '\\times' + t3(sc.centripetal) + '$', f4(rho * sc.centripetal) + ' Pa/m', 'the radial balance $-\\rho u_\\theta^2/r=-\\partial p/\\partial r$ (5.5a)') +
    W.line('slope of the pressure field at the probe', f4(sc.dp_dr) + ' Pa/m', 'measured by a finite difference of $p(r)$: the two agree, so the pressure field really does the pushing') +
    W.line('$\\partial p/\\partial z=-\\rho g=-' + t4(rho) + '\\times9.81$', f4(-rho * G) + ' Pa/m', 'the vertical balance $0=-\\partial p/\\partial z-\\rho g$ (5.5b): plain hydrostatics');
  // 4. pressure field
  o += W.step(4, 'The pressure field');
  if (k === 'tank') o += W.say('$p-p_o=\\tfrac18\\rho\\omega^2r^2-\\rho gz$ (5.6), with $p_o$ on the axis at the vertex height $z=0$. At the probe, at that height:') +
    W.box('$p-p_o=\\tfrac18(' + t4(rho) + ')(' + t3(n.omega) + ')^2(' + t3(r) + ')^2=\\mathbf{' + t4(sc.p) + '}$ Pa');
  else {
    o += W.say('$p-p_\\infty=-\\dfrac{\\rho\\Gamma^2}{8\\pi^2r^2}-\\rho gz$ (5.7) outside any core, with $p_\\infty$ far away at the same height.' + (n.a > 0 ? ' Inside a Rankine core the rigid part adds a paraboloid, and $p$ and $\\partial p/\\partial r$ are continuous at $a$.' : '')) +
      W.box('at the probe, same height as far away: $p-p_\\infty=\\mathbf{' + t4(sc.p) + '}$ Pa');
    if (n.a > 0) o += W.line('core edge $-\\rho\\Gamma^2/8\\pi^2a^2$', f4(-n.edgeDef) + ' Pa', 'the funnel formula at r = a') +
      (k === 'rankine' ? W.line('axis $-\\rho\\Gamma^2/4\\pi^2a^2$', f4(-n.axisDef) + ' Pa', 'twice the edge value: the core\'s bowl adds the other half') : '');
  }
  // 5. free surface
  o += W.step(5, water ? 'The free surface' : 'The isobar through the reference point');
  if (k === 'tank') {
    o += W.line('rim–centre height $\\dfrac{\\omega^2R^2}{8g}=\\dfrac{' + t3(n.omega) + '^2\\times0.1^2}{8\\times9.81}$', fmtLen(n.rimCentre), 'set $p=p_o$ in the isobar $z=\\omega^2r^2/8g-(p-p_o)/\\rho g$') +
      W.line('vertex (water volume kept)', fmtLen(n.tk.zv) + ' above the bottom', 'the bowl sinks at the centre as much as it rises at the rim') +
      (n.tk.rdry > 0 ? W.box('the vertex is below the bottom: dry disc out to $r=' + texLen(n.tk.rdry) + '$') : W.box('the surface is a paraboloid, $\\mathbf{' + texLen(n.rimCentre) + '}$ from rim to centre'));
  } else {
    o += W.line('$\\dfrac{\\Gamma^2}{8\\pi^2r^2g}$ at the probe', fmtLen(n.dip), 'set $p=p_\\infty$ in $z=-\\Gamma^2/8\\pi^2r^2g-(p-p_\\infty)/\\rho g$');
    if (k === 'rankine') o += W.box('the funnel has a rounded bottom: ' + fmtLen(n.axisDef / (rho * G)) + ' below the far level on the axis');
    else if (k === 'line') o += W.box('$z\\to-\\infty$ as $r\\to0$: a funnel with no bottom');
    else o += W.box('the surface meets the rod ' + fmtLen(n.edgeDef / (rho * G)) + ' below the far level');
    o += W.say('The book calls these surfaces "hyperboloids of the second degree", but $(c-z)\\,r^2=$ const is a cubic surface.');
  }
  // 6. Bernoulli
  o += W.step(6, 'Bernoulli across the streamlines');
  if (k === 'tank') o += W.line('$B-B(0)=\\omega^2r^2/4=' + t3(n.omega) + '^2\\times' + t3(r) + '^2/4$', f3(sc.B) + ' J/kg', 'B grows outward: rotational flow, $B$ is constant only along each circle');
  else if (r > n.a || k === 'line') o += W.line('$B-B_\\infty$ at the probe', f3(Math.abs(sc.B) < 1e-9 ? 0 : sc.B) + ' J/kg', 'irrotational: $\\tfrac12u_\\theta^2+gz+p/\\rho$ is the same everywhere (compare Ch. 4\'s which-Bernoulli explainer)');
  else o += W.line('$B-B_\\infty=\\dfrac{\\Gamma^2}{4\\pi^2a^2}\\Big(\\dfrac{r^2}{a^2}-1\\Big)$', f3(sc.B) + ' J/kg', 'inside the core B changes from circle to circle; outside it is uniform');
  // 7. stress and force
  o += W.step(7, 'Viscous stress, net force and torque');
  if (k === 'tank' || !sc.in_fluid || r < n.a) o += W.box('$\\sigma_{r\\theta}=\\mu r\\,\\partial(u_\\theta/r)/\\partial r=0$: rigid rotation, $u_\\theta/r$ is constant, no element deforms');
  else {
    o += W.line('$\\sigma_{r\\theta}=-\\mu\\Gamma/\\pi r^2=-(' + t3(mu) + ')(' + t3(n.Gam) + ')/(\\pi\\times' + t3(r) + '^2)$', f3(sc.sigma_rtheta) + ' Pa', 'nonzero: the angular speed falls outward, so neighbouring rings slide');
    o += isNaN(sc.net_viscous_force) ? W.box('at $r=a$ the stress jumps from 0 to ' + f3(sc.edge_line_force) + ' Pa: the viscous force sits on the edge line (' + f3(sc.edge_line_force) + ' N/m² of edge), with no finite value per volume')
      : W.box('net viscous force $\\dfrac{1}{r^2}\\dfrac{d}{dr}\\big(r^2\\sigma_{r\\theta}\\big)=\\mathbf{0}$ N/m³ — irrotational means no net viscous force, not no stress');
    o += W.line('torque per length $2\\pi r^2\\sigma_{r\\theta}=-2\\mu\\Gamma$', f3(sc.torque) + ' N m/m', 'the same at every radius: the torque travels outward undiminished');
  }
  // 8. current time
  const ang = angSpeed(s, r) * tReal(s);
  o += W.step(8, 'At the current time') + W.line('probe turns', Viz.live('tt')) + W.line('time $t$', Viz.live('treal') + ' s', 'one turn of the probe takes $2\\pi r/u_\\theta=' + (isFinite(n.Tp) ? t3(n.Tp) : '\\infty') + '$ s') +
    W.line('inner face ahead of outer face', Viz.live('lead') + '°', k === 'tank' || r < n.a ? 'zero: the element turns rigidly' : 'the element is sheared: its inner edge turns faster');
  // 9. real vortices
  const cur = realRow(s);
  o += W.step(9, 'Real vortices') + REAL.map((q, i) => i === cur ? W.box('<b>' + q.name + '</b> (' + q.what + '): ' + q.val() + ' ← closest to yours') : W.line(q.name + ' (' + q.what + ')', q.val())).join('') +
    W.hint('Ch. 3\'s paddle-wheel explainer shows the same two vortices turning (or not) a paddle wheel.');
  o += W.interpret(interpText(s) + (k === 'tank' ? ' Written with the speed, $\\tfrac12u_\\theta^2=\\omega^2r^2/8$, so $-\\tfrac12u_\\theta^2+gz+p/\\rho$ is constant: the Bernoulli function grows outward, as it must in a rotational flow.' : ''), 'Reading the current setting');
  void ang;
  return o;
}

/* ---- derivations (design Part F: D02 10 steps, D03 9 steps) ----------------------------------------------------------- */

    plan: ['Show the stress is pure pressure, so Euler\'s equation applies.', 'Compute the particle acceleration in polar coordinates.', 'Write the $r$- and $z$-components, $-\\rho u_\\theta^2/r=-\\partial p/\\partial r$ (5.5a) and $0=-\\partial p/\\partial z-\\rho g$ (5.5b).', 'Integrate each and match them.'],
    uses: ['Newtonian stress with $S_{ij}=0$ (Ch. 4)', 'the turning unit vector $\\partial\\mathbf e_\\theta/\\partial\\theta=-\\mathbf e_r$ (Ch. 3)', 'partial integration with an unknown function', 'hydrostatics (Ch. 1)'],

    total: { label: 'sum: $-u_\\theta^2/r+\\frac1\\rho\\frac{\\partial p}{\\partial r}=0$' } },
  stage: {
    rows: [1.3, 1],
    views: [
      { id: 'section', row: 0, flex: 1, title: s => sectionTitle(s) },
      { id: 'profiles', row: 1, flex: 1.25, title: s => profTitle(s) },
      { id: 'balance', row: 1, flex: 1, title: s => balTitle(s) }
    ],
    draw(g, s) { CUR = s; drawSection(g, s); drawProfiles(g, s); drawBalance(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel' || ev.type === 'pointerleave') { const was = !!DRAG; DRAG = null; return was; }
      const setR = (P, uR) => { const rr = Math.abs(P.ix(X) * uR); g.app.set({ rq: Math.max(0.02, Math.min(1, rr / rmaxOf(s))) }); };
      if (ev.viewId === 'section' && SEC.P) {
        if (ev.type === 'pointermove') { if (DRAG !== 'section') return false; setR(SEC.P, SEC.uR); return true; }
        if (ev.type !== 'pointerdown') return false;
        if (SEC.px !== undefined && Math.hypot(X - SEC.px, Y - SEC.py) < 22) { DRAG = 'section'; g.app.play(false); return true; }
        if (!SEC.P.inside(X, Y)) return false;
        g.app.set({ ir: SEC.P.ix(X) * SEC.uR, iz: SEC.P.iy(Y) * SEC.uZ }); return true;
      }
      if (ev.viewId === 'profiles' && PRO.P) {
        if (ev.type === 'pointermove') { if (DRAG !== 'profiles') return false; setR(PRO.P, PRO.uR); return true; }
        if (ev.type !== 'pointerdown' || !PRO.P.inside(X, Y)) return false;
        DRAG = 'profiles'; g.app.play(false); setR(PRO.P, PRO.uR); return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click anywhere in the fluid of the cross-section to see its pressure worked out; drag the small square to move the probe.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Pick a vortex above the picture, drag the probe (the small square) along $r$, and click the fluid to see its pressure worked out.',
    controls: ['Om', 'Gamma', 'a', 'rq', 'fluid'],
    readouts: ['u', 'p', 'dip', 'stress', 'force'],
    callouts: [{ kind: 'try', html: 'In the tank, move the probe from the axis to the wall: the stress stays 0. In the line vortex, do the same: the stress changes, the net force stays 0.' }]
  },
  explain: {
    html: s => explainHtml(s),
    live: s => { const T = tReal(s), n = N(s), r = n.r, lead = (s.mode === 'tank' || r < n.a) ? 0 : (angSpeed(s, 0.9 * r) - angSpeed(s, 1.1 * r)) * T * 180 / PI; return { tt: (s.tt || 0).toFixed(2), treal: isFinite(T) ? Viz.fmt(T, { sig: 3 }) : '0', lead: Viz.fmt(lead, { sig: 3 }) }; }
  },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => {
    if (key === 'mode') { applyMode(a); a.fit(); }
    if (key === 'mode' || key === 'a') { CUR = s; (a.controls && a.controls.rq || []).forEach(c => c.sync(s.rq)); }
  }
};
function applyMode(a) {
  const keep = CTRL[a.state.mode] || [];
  ['Om', 'Gamma', 'a'].forEach(k => document.querySelectorAll('.viz-side [data-viz-key="param:' + k + '"]').forEach(el => el.classList.toggle('vpf-off', keep.indexOf(k) < 0)));
}
const app = Viz.app(CFG);
CUR = app.state;
applyMode(app); (app.controls && app.controls.rq || []).forEach(c => c.sync(app.state.rq)); app.fit();
</script>
</body>
