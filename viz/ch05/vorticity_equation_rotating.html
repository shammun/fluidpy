    if (s.scene === 'burgers') return 'No rotation and uniform density: the planetary and baroclinic bars are zero and the equation is the inertial one again. Inflow carries vorticity in, stretching amplifies it, diffusion spreads it — in exact balance.';
    const b = bud(s);
    return `A column at rest is stretched: at first only the planetary bar acts (2Ωα = ${f3(b.planetary)} s⁻²), because the planet's spin 2Ω is being stretched. As ζ grows, relative stretching joins in (${f3(b.stretching_tilting)} s⁻² now). Stretching acts on the absolute vorticity ζ + 2Ω.`;
  }
  const c = col(s);
  if (Math.abs(c.f) < 1e-12) return `At the equator f = 0: the column encloses no planetary vorticity, so squashing it changes ζ only in proportion to its own ζ₀ (here ζ = ${f3(c.zeta)} s⁻¹).`;
  if (Math.abs(c.z0 + c.f) < 1e-15) return 'The column starts with zero absolute vorticity (ζ₀ = −f): (ζ + f)/h = 0 stays 0, so ζ = −f the whole way — nothing to stretch.';
  const sh = s.lat < 0 ? ' In the Southern Hemisphere f < 0, so every sense flips: cyclones turn clockwise.' : '';
  if (c.h < H0 - 1e-6) return `Over the ridge the column is squashed to ${f3(c.h)} m: its absolute vorticity must fall with h, so it turns anticyclonically (ζ = ${f3(c.zeta)} s⁻¹) — why highs sit over mountains.${sh}`;
  if (c.h > H0 + 1e-6) return `Into the trough the column is stretched to ${f3(c.h)} m and borrows spin from the planet: cyclonic, ζ = ${f3(c.zeta)} s⁻¹.${sh}`;
  return `At h = h₀ the column has its starting spin ζ₀ = ${f3(c.z0)} s⁻¹; press ▶ and watch it change over the ${s.bump >= 0 ? 'ridge' : 'trough'}.${sh}`;
}

    live: () => `\\text{lock exchange: }${t4(budget('lock_exchange').baroclinic)}\\ \\text{s}^{-2}`, note: 'Zero when ρ = ρ(p) (barotropic): ∇ρ ∥ ∇p. Boussinesq, to leading order: ∇ρ′ × g/ρ₀.',

const QUIZ = [

  { q: 'A column starting with ζ₀ = −f (zero absolute vorticity) crosses the ridge. What is ζ over the crest?', a: 'Still −f: $(\\zeta+f)/h=0$ stays 0, so there is no absolute vorticity to stretch or squash.', set: { mode: 'column', lat: 45, bump: 200, zeta0: -1, t: 0.5 } },

/* ---- selftest: parity with fluidpy.ch05 (py) and invariants (expect) ----------------------------------------------------- */
function selftestRows() {
  const A5 = PI * 2.5e11, RING = 'np.stack([5e5*np.cos(np.linspace(0, 2*np.pi, 64, endpoint=False)), 5e5*np.sin(np.linspace(0, 2*np.pi, 64, endpoint=False))])';
  const L3 = 'np.stack([3.0*np.cos(np.linspace(0, 2*np.pi, 64, endpoint=False)), 3.0*np.sin(np.linspace(0, 2*np.pi, 64, endpoint=False))])';
  const pageCol = col({ lat: 45, bump: 200, zeta0: 0, t: 0.5 }), pageTr = col({ lat: -45, bump: -300, zeta0: 0.2, t: 0.5 + 5e4 / (2 * XMAX) });
  const ringPg = ring({ lat0: 30, lat1: 60, rad: 500, t: 1 });
  return [
    { name: 'column 1100 m', js: columnZeta(1100, 1000, 0, 1e-4), py: 'ch05.column_relative_vorticity(1100.0, 1000.0, 0.0, 1e-4)', rtol: 1e-12 },
    { name: 'column with zeta0', js: columnZeta(800, 1000, 2e-5, 1.2e-4), py: 'ch05.column_relative_vorticity(800.0, 1000.0, 2e-5, 1.2e-4)', rtol: 1e-12 },
    { name: 'f at 45 deg', js: fOf(45), py: 'ch05.column_over_slope(0.0, lat_deg=45.0)["f"]', rtol: 1e-12 },
    { name: 'page column over crest zeta', js: pageCol.zeta, py: 'ch05.column_over_slope(0.0, "ridge", lat_deg=45.0, bump=0.2)["zeta"]', rtol: 1e-12 },
    { name: 'page column over crest h', js: pageCol.h, py: 'ch05.column_over_slope(0.0, "ridge", lat_deg=45.0, bump=0.2)["h"]', rtol: 1e-12 },
    { name: 'column at 100 km zeta', js: columnOverSlope(1e5, 45, 0, 0.2).zeta, py: 'ch05.column_over_slope(100000.0, "ridge", lat_deg=45.0, bump=0.2)["zeta"]', rtol: 1e-12 },
    { name: 'SH trough, zeta0 = 0.2 f, zeta', js: pageTr.zeta, py: 'ch05.column_over_slope(50000.0, "ridge", lat_deg=-45.0, zeta0=0.2*ch05.column_over_slope(0.0, lat_deg=-45.0)["f"], bump=-0.3)["zeta"]', rtol: 1e-11 },
    { name: 'SH trough ratio', js: pageTr.ratio, py: 'ch05.column_over_slope(50000.0, "ridge", lat_deg=-45.0, zeta0=0.2*ch05.column_over_slope(0.0, lat_deg=-45.0)["f"], bump=-0.3)["ratio"]', rtol: 1e-11 },
    { name: 'ring 30 to 60 N', js: ringGamma(0, A5, 30, A5, 60), py: 'ch05.relative_circulation_after_move(0.0, np.pi*2.5e11, 30.0, np.pi*2.5e11, 60.0)', rtol: 1e-10 },
    { name: 'page ring Gamma', js: ringPg.G, py: 'ch05.relative_circulation_after_move(0.0, np.pi*2.5e11, 30.0, np.pi*2.5e11, 60.0)', rtol: 1e-10 },
    { name: 'ring to equator, area change', js: ringGamma(1e7, A5, 30, 1.5 * A5, 0), py: 'ch05.relative_circulation_after_move(1e7, np.pi*2.5e11, 30.0, 1.5*np.pi*2.5e11, 0.0)', rtol: 1e-10 },
    { name: 'ring vector area (spectral loop)', js: A5, py: `ch05.loop_vector_area(${RING})[2]`, rtol: 1e-10 },
    { name: 'budget burgers stretching (stencil)', js: budget('burgers').stretching_tilting, py: 'ch05.vorticity_budget_preset("burgers")["stretching_tilting"]', rtol: 1e-5 },
    { name: 'budget burgers advective (stencil)', js: budget('burgers').advective, py: 'ch05.vorticity_budget_preset("burgers")["advective"]', rtol: 1e-5 },
    { name: 'budget burgers diffusion (stencil)', js: budget('burgers').diffusion, py: 'ch05.vorticity_budget_preset("burgers")["diffusion"]', rtol: 1e-5 },
    { name: 'budget lock baroclinic', js: budget('lock_exchange').baroclinic, py: 'ch05.vorticity_budget_preset("lock_exchange")["baroclinic"]', rtol: 1e-6 },
    { name: 'budget lock local', js: budget('lock_exchange').local, py: 'ch05.vorticity_budget_preset("lock_exchange")["local"]', rtol: 1e-6 },
    { name: 'budget rotating column planetary', js: budget('rotating_column').planetary, py: 'ch05.vorticity_budget_preset("rotating_column")["planetary"]', rtol: 1e-6 },
    { name: 'budget rotating column local, Om 0.8, t 3', js: budget('rotating_column', { Omega: 0.8, t: 3 }).local, py: 'ch05.vorticity_budget_preset("rotating_column", Omega=0.8, t=3.0)["local"]', rtol: 1e-7 },
    { name: 'budget rotating column relative stretching, t 3', js: budget('rotating_column', { Omega: 0.8, t: 3 }).stretching_tilting, py: 'ch05.vorticity_budget_preset("rotating_column", Omega=0.8, t=3.0)["stretching_tilting"]', rtol: 1e-7 },
    { name: 'budget rotating column planetary, Om 0.8', js: budget('rotating_column', { Omega: 0.8, t: 3 }).planetary, py: 'ch05.vorticity_budget_preset("rotating_column", Omega=0.8, t=3.0)["planetary"]', rtol: 1e-9 },
    { name: 'planetary stretching, Earth', js: planetaryTerm([[0, 0, 0], [0, 0, 0], [0, 0, 1e-5]], [0, 0, OMEGA_E])[2], py: 'ch05.planetary_vorticity_terms([[0, 0, 0], [0, 0, 0], [0, 0, 1e-5]], [0, 0, 7.292115e-5])[2]', rtol: 1e-12 },
    { name: 'planetary tilting, x-component', js: planetaryTerm([[0, 0, 2e-5], [0, 0, 0], [0, 0, 0]], [0, 0, OMEGA_E])[0], py: 'ch05.planetary_vorticity_terms([[0, 0, 2e-5], [0, 0, 0], [0, 0, 0]], [0, 0, 7.292115e-5])[0]', rtol: 1e-12 },
    { name: 'absolute vorticity', js: absVort(1e-5, OMEGA_E), py: 'ch05.absolute_vorticity(1e-5, 7.292115e-5)', rtol: 1e-12 },
    { name: 'absolute circulation, planet at rest', js: absCirc(0, 0.5, PI * 9), py: `ch05.absolute_circulation(ch05.vortex_velocity_field("solid", Gamma=0.0), ${L3}, 0.5)[1]`, rtol: 1e-10 },
    { name: 'relative circulation of inertial rest', js: -2 * 0.5 * PI * 9, py: `ch05.absolute_circulation(ch05.vortex_velocity_field("solid", Gamma=-np.pi, sigma=1.0), ${L3}, 0.5)[0]`, rtol: 1e-10 },
    { name: 'invariant: (zeta+f)/h conserved', js: (columnZeta(800, 1000, 0, 1e-4) + 1e-4) / 800 - 1e-4 / 1000, expect: 0, atol: 1e-18 },
    { name: 'invariant: page ratio = start ratio', js: pageCol.ratio - pageCol.q0, expect: 0, atol: 1e-20 },
    { name: 'invariant: Gamma_a unchanged by the move', js: ringPg.G + ringPg.pl - ringPg.Ga, expect: 0, atol: 1e-4 },
    { name: 'invariant: budget residuals', js: Math.abs(budget('burgers').residual) + Math.abs(budget('rotating_column', { t: 4 }).residual) + Math.abs(budget('lock_exchange').residual), expect: 0, atol: 1e-12 },
    { name: 'invariant: change of zeta = (zeta0+f) dh/h0 at the end', js: (() => { const c = col({ lat: 45, bump: 200, zeta0: 0.3, t: 1 }); return (c.zeta - c.z0) / (c.z0 + c.f) - (c.h - H0) / H0; })(), expect: 0, atol: 1e-15 }
  ];
}

/* ---- the app --------------------------------------------------------------------------------------------------------------- */
const CTRL = { column: ['lat', 'bump', 'zeta0'], ring: ['lat0', 'lat1', 'rad'], budget: ['scene', 'Om'] };
const RDS = { column: ['f', 'h', 'z', 'q'], ring: ['G1', 'Ga', 'zr'], budget: ['pl', 'ba', 'res'] };
const CFG = {
  title: 'What does a spinning planet add to the vorticity equation?',
  subtitle: 'A column crossing a ridge, a ring of air moving poleward and the term bars of the rotating vorticity equation: the relative vorticity changes, (ζ + f)/h and the absolute circulation do not',
  autoplay: false,
  params: {
    lat: { label: 'Latitude $\\varphi$', min: -90, max: 90, step: 0.1, value: 45, unit: '°', help: 'negative = Southern Hemisphere (f < 0)' },
    bump: { label: 'Ridge height $b$', min: -400, max: 400, step: 10, value: 200, unit: 'm', help: 'negative = a trough; the layer is 1000 m deep' },
    zeta0: { label: 'Start spin $\\zeta_0/f$', min: -1, max: 1, step: 0.05, value: 0, unit: '× f', help: 'relative vorticity where h = h₀, in units of f' },
    lat0: { label: 'From latitude $\\varphi_0$', min: 0, max: 90, step: 1, value: 30, unit: '°', help: 'the ring starts at rest here' },
    lat1: { label: 'To latitude $\\varphi_1$', min: 0, max: 90, step: 1, value: 60, unit: '°' },
    rad: { label: 'Ring radius $r$', min: 100, max: 2000, step: 50, value: 500, unit: 'km', help: 'the area πr² is kept fixed' },
    scene: { type: 'select', label: 'Scene', options: [['burgers', 'Burgers'], ['lock', 'lock exchange'], ['column', 'rotating column']], value: 'column', display: 'chips' },
    Om: { label: 'Frame rotation $\\Omega$', min: 0, max: 1, step: 0.05, value: 0.5, unit: 'rad/s', help: 'rotating-column scene only' },
    t: { label: 'journey', min: 0, max: 1, step: 'any', value: 0, unit: '× trip', optional: true }
  },
  modes: { param: 'mode', label: 'Scene', options: [['column', 'column'], ['ring', 'ring'], ['budget', 'budget']] },
  transport: { param: 't', min: 0, max: 1, rate: 0.125, end: 'hold', hold: 2, label: 'journey', unit: '× trip' },
  presets: [
    { label: 'ridge 45° N', set: { mode: 'column', lat: 45, bump: 200, zeta0: 0, t: 0 }, title: 'a column squashed over a 200 m ridge' },
    { label: 'trough', set: { mode: 'column', bump: -200, zeta0: 0, t: 0 }, title: 'a column stretched into a 200 m trough' },
    { label: 'S. Hemisphere', set: { mode: 'column', lat: -45, t: 0 }, title: 'f < 0: every sense flips' },
    { label: 'ring 30→60° N', set: { mode: 'ring', lat0: 30, lat1: 60, rad: 500, t: 0 }, title: 'poleward: anticyclonic' },
    { label: 'ring → equator', set: { mode: 'ring', lat0: 30, lat1: 0, t: 0 }, title: 'equatorward: cyclonic' },
    { label: 'stretched column', set: { mode: 'budget', scene: 'column', Om: 0.5, t: 0 }, title: 'budget: the planetary term 2Ω ∂w/∂z' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'f', label: 'f = 2Ω sin φ', unit: '1/s', value: s => col(s).f, fmt: x => Viz.fmt(x, { sig: 3, unit: '1/s' }) },
    { id: 'h', label: 'Column height h', unit: 'm', value: s => col(s).h, fmt: x => Viz.fmt(x, { sig: 4, unit: 'm' }) },
    { id: 'z', label: 'Relative vorticity ζ', unit: '1/s', value: s => col(s).zeta, fmt: x => Viz.fmt(x, { sig: 3, unit: '1/s' }) },
    { id: 'q', label: '(ζ + f)/h', unit: '1/(m s)', value: s => col(s).ratio, fmt: x => Viz.fmt(x, { sig: 4, unit: '1/(m s)' }) },
    { id: 'G1', label: 'Relative Γ now', unit: 'm²/s', value: s => ring(s).G, fmt: x => Viz.fmt(x, { sig: 3, unit: 'm²/s' }) },
    { id: 'Ga', label: 'Absolute Γ_a', unit: 'm²/s', value: s => ring(s).Ga, fmt: x => Viz.fmt(x, { sig: 3, unit: 'm²/s' }) },
    { id: 'zr', label: 'Mean ζ = Γ/A', unit: '1/s', value: s => ring(s).zr, fmt: x => Viz.fmt(x, { sig: 3, unit: '1/s' }) },
    { id: 'pl', label: 'Planetary 2(Ω·∇)u', unit: '1/s²', value: s => bud(s).planetary, fmt: x => Viz.fmt(x, { sig: 3, unit: '1/s²' }) },
    { id: 'ba', label: 'Baroclinic term', unit: '1/s²', value: s => bud(s).baroclinic, fmt: x => Viz.fmt(x, { sig: 3, unit: '1/s²' }) },
    { id: 'res', label: 'Residual', unit: '1/s²', value: s => bud(s).residual, fmt: x => Viz.fmt(x, { sig: 2, unit: '1/s²' }) }
  ],
  terms: { title: 'Terms of the rotating vorticity equation', unit: '1/s²', items: [
    { id: 'loc', label: 'local ∂ω/∂t', color: Viz.color('blue'), value: s => bud(s).local },
    { id: 'adv', label: 'advective', color: Viz.color('muted'), value: s => bud(s).advective },
    { id: 'str', label: 'relative stretching', color: Viz.color('accent'), value: s => bud(s).stretching_tilting },
    { id: 'pl', label: 'planetary 2(Ω·∇)u', color: Viz.color('amber'), value: s => bud(s).planetary },
    { id: 'ba', label: 'baroclinic', color: Viz.color('orange'), value: s => bud(s).baroclinic },
    { id: 'di', label: 'diffusion', color: Viz.color('rose'), value: s => bud(s).diffusion }],
    total: { label: 'residual (left − right)', value: s => bud(s).residual } },
  stage: {
    rows: [1.3, 1],
    views: [
      { id: 'layer', row: 0, flex: 1, title: s => layerTitle(s) },
      { id: 'ratio', row: 1, flex: 1.35, title: s => ratioTitle(s) },
      { id: 'table', row: 1, flex: 1, hidePortrait: true, title: s => tableTitle(s) }
    ],
    draw(g, s) { drawLayer(g, s); drawRatio(g, s); drawTable(g, s); },
    onPointer(g, ev, s) {
      if (ev.type !== 'pointerdown') return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.viewId === 'layer' && s.mode === 'column' && LAYER.P && LAYER.P.inside(X, Y)) {
        g.app.play(false); g.app.set({ t: Math.max(0, Math.min(1, (LAYER.P.ix(X) + 300) / 600)) }); return true;
      }
      if (ev.viewId === 'ratio' && s.mode === 'ring' && RATIO.P && RATIO.P.inside(X, Y)) {
        g.app.set({ lat1: Math.max(0, Math.min(90, Math.round(RATIO.P.ix(X)))) }); return true;
      }
      return false;
    }
  },
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Pick a scene above the picture, press ▶, click the layer to move the column (ring: click the graph to choose the destination).',
    controls: ['lat', 'bump', 'zeta0', 'lat0', 'lat1', 'rad', 'scene', 'Om'],
    readouts: ['f', 'h', 'z', 'q', 'G1', 'Ga', 'zr', 'pl', 'ba', 'res'],
    callouts: [{ kind: 'try', html: 'Column: set ζ₀/f = −1. The column has no absolute vorticity, so the ridge cannot change its spin: ζ stays −f.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => { if (key === 'mode') { applyMode(a); a.fit(); } }
};
function applyMode(a) {
  const m = a.state.mode || 'column';
  document.querySelectorAll('.viz-app').forEach(el => el.setAttribute('data-ver-mode', m));
  const allC = [].concat(CTRL.column, CTRL.ring, CTRL.budget), shown = new Set(CTRL[m]);
  allC.forEach(p => document.querySelectorAll('.viz-side [data-viz-key="param:' + p + '"]').forEach(el => el.classList.toggle('ver-off', !shown.has(p))));
  Object.keys(RDS).forEach(k => RDS[k].forEach(r => document.querySelectorAll('.viz-side [data-viz-key="readout:' + r + '"]').forEach(el => el.classList.toggle('ver-off', k !== m))));
  document.querySelectorAll('.viz-panel[data-panel="explore"] .viz-terms').forEach(el => {
    el.classList.toggle('ver-off', m !== 'budget');
    const hd = el.previousElementSibling; if (hd && hd.classList.contains('viz-subhead')) hd.classList.toggle('ver-off', m !== 'budget');
  });
}
const app = Viz.app(CFG);
{ // mark D15's result page before the library packs it (the CSS above hides its 15-line chain)
  const _go = app.goDerive;
  app.goDerive = function (i, s, o) {
    const d = DERIV[Math.max(0, Math.min(DERIV.length - 1, i))];
    const res = d && d.id === 'D15' && s >= d.steps.length + 1;
    document.querySelectorAll('.viz-app').forEach(el => (res ? el.setAttribute('data-ver-res', '1') : el.removeAttribute('data-ver-res')));
    return _go.call(this, i, s, o);
  };
}
applyMode(app); app.fit();
</script>
