  logTicks(yl[0], yl[1]).forEach(e => { const Y = P.Y(e); ctx.beginPath(); ctx.moveTo(P.px.x, Y); ctx.lineTo(P.px.x + P.px.w, Y); ctx.stroke(); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(fz(Math.pow(10, e), 2), P.px.x - 4, Y); });

function drawDistance(g, s) {
  const v = g.view('distance'); v.clear(); if (v.w < 60 || v.h < 50) return;
  const M = cur(s), c = C(), G = M.p.G, ctx = v.ctx;
  if (M.shape === 'segment' || M.shape === 'half' || M.shape === 'tube' || M.shape === 'helix') {
    const xl = [-2, 1.5], yl = [Math.log10(G) - 3.2, Math.log10(G) + 1.6];
    const P = v.plot({ xlim: xl, ylim: yl, pad: { l: 44, t: 8, r: 10, b: 36 } });
    logAxes(P, ctx, xl, yl, M.shape === 'helix' ? 'distance d from the helix axis [m]' : 'distance d [m]');
    const pz = M.shape === 'tube' ? 0 : M.x[2];
    const segAt = (d, za, zb) => G / (FOURPI * d) * ((pz - za) / Math.hypot(d, pz - za) - (pz - zb) / Math.hypot(d, pz - zb));
    P.clip(() => {
      P.fn(L => Math.log10(G / (2 * PI * Math.pow(10, L))), { color: Viz.alpha(c.muted, 0.95), width: 1.5, dash: [6, 4] });
      P.fn(L => Math.log10(G / (FOURPI * Math.pow(10, L))), { color: Viz.alpha(c.muted, 0.8), width: 1.5, dash: [2, 3] });
      if (M.shape === 'segment') P.fn(L => Math.log10(segAt(Math.pow(10, L), -M.p.ell, M.p.ell)), { color: c.teal, width: 2.6 });
      if (M.shape === 'half') P.fn(L => Math.log10(segAt(Math.pow(10, L), 0, LHALF)), { color: c.teal, width: 2.6 });
      if (M.shape === 'tube') P.fn(L => Math.log10(Math.abs(tubeU(Math.pow(10, L), G, SIG, 1))), { color: c.teal, width: 2.6 });
      if (M.shape === 'helix') { const Ph = polyline('helix', M.n, HLX); for (let L = -1.9; L <= 1.45; L += 0.12) { const d = Math.pow(10, L), uu = norm(filVel([d, 0, pz], Ph, G, false)); if (uu > 0) P.dot(L, Math.log10(uu), 2.6, { color: c.accent }); } }
      const uu = M.tube ? Math.abs(M.ut) : M.un;
      if (M.d > 0 && uu > 0) P.dot(Math.log10(M.d), Math.log10(uu), 6.5, { color: c.orange, stroke: '#fff', strokeWidth: 2 });
      if (M.shape === 'segment' && M.p.ell > 0.01) { const X = P.X(Math.log10(M.p.ell)); ctx.save(); ctx.strokeStyle = Viz.alpha(c.teal, 0.5); ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(X, P.px.y); ctx.lineTo(X, P.px.y + P.px.h); ctx.stroke(); ctx.restore(); if (v.w > 260) { const right = X > P.px.x + P.px.w - 44; Viz.text(ctx, 'd = ℓ', right ? X - 4 : X + 4, P.px.y + 12, { size: 12, color: c.teal, weight: 600, align: right ? 'right' : 'left' }); } }
    });
    return;
  }
  // loops: u_z on the symmetry axis against z (ring: closed form teal, polygon purple dots; square: exact sides)
  const R = M.shape === 'ring' ? M.p.ell : M.shape === 'square' ? M.p.ell : HLX.R, zmax = 3 * R;
  const f = M.shape === 'ring' ? (z => ringAxis(z, R, G)) : (z => filVel([0, 0, z], polyline('square', 4, { side: 2 * M.p.ell }), G, true)[2]);
  const ymax = 1.15 * f(0);
  const P = v.plot({ xlim: [-zmax, zmax], ylim: [0, ymax], xlabel: 'height z on the axis [m]', pad: { l: 46, t: 8, r: 10, b: 36 } }).axes();
  P.clip(() => {
    P.fn(f, { color: c.teal, width: 2.6 });
    if (M.shape === 'ring') for (let z = -zmax; z <= zmax + 1e-9; z += zmax / 8) P.dot(z, filVel([0, 0, z], M.P, G, true)[2], 3.2, { color: c.accent });
    if (Math.abs(M.x[0]) < 1e-9) P.dot(M.x[2], M.u[2], 7, { color: c.orange, stroke: '#fff', strokeWidth: 2 });
  });
  if (Math.abs(M.x[0]) > 1e-9 && v.w > 260) Viz.text(ctx, 'your point is off the axis (x = ' + fz(M.x[0], 3) + ' m)', P.px.x + P.px.w - 6, P.px.y + 12, { size: 12, color: c.orange, align: 'right', weight: 600 });
}
function distanceTitle(s) {
  const M = cur(s);
  if (M.shape === 'ring') return '<b>On the axis</b> u_z(z) [m/s] · teal ΓR²/2(R² + z²)^{3/2} · dots: M pieces';
  if (M.shape === 'square') return '<b>On the axis</b> u_z(z) [m/s] · four straight sides';
  if (M.shape === 'helix') return '<b>Speed vs distance</b> [m/s] (log–log) · grey dashed Γ/2πd';
  return '<b>Speed vs distance</b> [m/s] (log–log) · grey dashed Γ/2πd, dotted Γ/4πd';
}

   STATUS, NOTES

function relGap(a, b) { return Math.abs(a - b) / Math.max(Math.abs(b), 1e-300); }
function statusText(s) {
  const M = cur(s), nw = narrow(), u = fz(M.un, 4), cf = fz(M.cf.val, 4);
  switch (M.shape) {
    case 'segment': {
      const pct = 100 * M.cf.val / M.ul;
      if (pct > 99.5) return nw ? '📏 → line: Γ/2πd = ' + fz(M.ul, 4) + ' m/s' : '📏 → infinite line: Γ/2πd = ' + fz(M.ul, 4) + ' m/s, reached within ' + fz(100 - pct, 2) + ' %';
      return nw ? '✅ ' + u + ' = closed form · ' + fz(pct, 3) + ' % of Γ/2πd' : '✅ sum of ' + M.n + ' pieces = closed form ' + cf + ' m/s · ' + fz(pct, 3) + ' % of the infinite line';
    }
    case 'half': return nw ? '½ line: ' + u + ' m/s' : '½ of a line: sum ' + u + ' m/s = closed form ' + cf + ' m/s' + (Math.abs(M.x[2]) < 1e-9 ? ' = Γ/4πd' : '');
    case 'square': return Math.hypot(M.x[0], M.x[2]) < 1e-9 ? (nw ? '✅ centre: ' + u + ' m/s = 2√2Γ/πL' : '✅ square centre: four straight sides give 2√2Γ/πL = ' + fz(M.cf.centre, 4) + ' m/s') : (nw ? '✅ ' + u + ' m/s, 4 exact sides' : '✅ four straight sides, each exact: |u| = ' + u + ' m/s');
    case 'ring': return nw ? '⭕ ' + u + ' vs exact ' + cf + ' m/s' : '⭕ ring: sum of ' + M.n + ' pieces ' + u + ' m/s vs exact ' + cf + ' m/s (polygon error ' + fz(100 * relGap(M.un, M.cf.val), 2) + ' %)';
    case 'helix': return nw ? '🌀 ' + u + ' vs ' + cf + ' m/s' : '🌀 helix: sum of ' + M.n + ' pieces ' + u + ' m/s vs fine polygon ' + cf + ' m/s (' + fz(100 * relGap(M.un, M.cf.val), 2) + ' %)';
    case 'tube': return M.p.sign > 0 ? (nw ? '✅ +1/(4π): u_θ = ' + fz(M.ut, 4) + ' m/s' : '✅ corrected +1/(4π): u_θ = ' + fz(M.ut, 4) + ' m/s, turning with ω')
      : (nw ? '⚠️ printed −1/(4π): swirl reversed' : '⚠️ printed −1/(4π): u_θ = ' + fz(M.ut, 4) + ' m/s — the swirl is reversed; the correct factor is +1/(4π)');
  }
  return '';
}
function readingText(s) {
  const M = cur(s);
  switch (M.shape) {
    case 'segment': {
      const pct = 100 * M.cf.val / M.ul;
      return pct > 99.5 ? 'The ends are far away: cos θa → 1, cos θb → −1, and the push is the line vortex\'s Γ/2πd = ' + fz(M.ul, 4) + ' m/s.'
        : 'Your point sees the segment\'s ends at θa = ' + fz(M.cf.ta * 180 / PI, 3) + '° and θb = ' + fz(M.cf.tb * 180 / PI, 3) + '°: it gets only ' + fz(pct, 3) + ' % of the infinite line\'s push. Stretch ℓ and watch the percentage climb.';
    }
    case 'half': return 'Half of every infinite line: at the foot of the end, Γ/4πd. A wing\'s trailing vortices start at the wing, so the downwash there is half its value far behind.';
    case 'square': return 'Four straight sides, each integrated exactly by the segment law, so M does not matter here; at the centre every side pushes the same way, along +z.';
    case 'ring': return Math.abs(M.x[0]) < 1e-9 ? 'On the axis every piece of the ring pushes the same way along the axis: Γ/2R at the centre, fading as 1/z³ far away. The polygon of ' + M.n + ' pieces errs by ' + fz(100 * relGap(M.un, M.cf.val), 2) + ' % (∝ 1/M²).' : 'Off the axis the pieces push in different directions and partly cancel; the exact value needs elliptic integrals, which the polygon matches to ' + fz(100 * relGap(M.un, M.cf.val), 2) + ' %.';
    case 'helix': return 'Nearby turns dominate; far from the helix it looks like a straight line (along its axis) plus a stack of rings — try the distance view.';
    case 'tube': return M.p.sign > 0 ? 'Outside the core the tube acts like a line (minus its finite length); inside, the push is less than Γ/2πr because only the vorticity inside r counts.' : 'With the printed −1/(4π) the fluid circles against the tube\'s own vorticity: impossible, so the printed sign must be wrong.';
  }
  return '';
}

/* ===================================================================================================
   EQUATIONS (TeX, shown with their numbers everywhere)
   =================================================================================================== */
const XD = '\\mathbf x-\\mathbf x\'';
const AXD = '\\lvert\\mathbf x-\\mathbf x\'\\rvert';
const EQ = {
  poisson: '\\nabla\\times\\boldsymbol\\omega=-\\nabla^2\\mathbf u',
  green: '\\mathbf u(\\mathbf x,t)=+\\frac{1}{4\\pi}\\int_{V\'}\\frac{\\nabla\'\\times\\boldsymbol\\omega(\\mathbf x\',t)}{' + AXD + '}\\,d^3x\'',
  greenM: '\\mathbf u(\\mathbf x,t)=+\\frac{1}{4\\pi}\\int_{V\'}\\frac{\\nabla\'\\times\\boldsymbol\\omega}{' + AXD + '}\\,d^3x\'',
  greenS: '\\mathbf u=+\\tfrac{1}{4\\pi}\\textstyle\\int_{V\'}\\tfrac{\\nabla\'\\times\\boldsymbol\\omega}{' + AXD + '}\\,d^3x\'',
  greenBookS: '\\mathbf u=-\\tfrac{1}{4\\pi}\\textstyle\\int_{V\'}\\tfrac{\\nabla\'\\times\\boldsymbol\\omega}{' + AXD + '}\\,d^3x\'',
  curlgauss: '\\begin{aligned}&\\textstyle\\int_{V\'}\\nabla\'\\times\\Big(\\frac{\\boldsymbol\\omega}{' + AXD + '}\\Big)d^3x\'\\\\&\\quad=\\textstyle\\int_{A\'}\\frac{\\mathbf n\\times\\boldsymbol\\omega}{' + AXD + '}\\,d^2x\'\\end{aligned}',
  bs: '\\mathbf u(\\mathbf x,t)=\\frac1{4\\pi}\\int_{V\'}\\frac{\\boldsymbol\\omega(\\mathbf x\',t)\\times(' + XD + ')}{' + AXD + '^3}\\,d^3x\'',
  bsS: '\\mathbf u=\\tfrac1{4\\pi}\\textstyle\\int\\tfrac{\\boldsymbol\\omega\\times(' + XD + ')}{' + AXD + '^3}d^3x\'',
  fil: 'd\\mathbf u=\\frac{\\Gamma\\,dl}{4\\pi}\\,\\mathbf e_\\omega\\times\\frac{' + XD + '}{' + AXD + '^3}',
  filS: 'd\\mathbf u=\\tfrac{\\Gamma\\,dl}{4\\pi}\\mathbf e_\\omega\\times\\tfrac{' + XD + '}{' + AXD + '^3}',
  seg: 'u=\\frac{\\Gamma}{4\\pi d}(\\cos\\theta_a-\\cos\\theta_b)',
  segS: '\\tfrac{\\Gamma}{4\\pi d}(\\cos\\theta_a-\\cos\\theta_b)',
  line: 'u_\\theta=\\frac{\\Gamma}{2\\pi r}',
  lineS: 'u_\\theta=\\Gamma/2\\pi r',
  ring: 'u_z=\\frac{\\Gamma R^2}{2(R^2+z^2)^{3/2}}'

function pyKw(M) {
  const p = M.p;

    case 'segment': case 'tube': return ', half_length=' + pyNum(p.ell);
    case 'square': return ', side=' + pyNum(2 * p.ell);
    case 'ring': return ', R=' + pyNum(p.ell);
    default: return '';
  }
}

        if (M.tube) { g.app.set({ px: Math.max(RMIN_TUBE, Math.min(1.5, Math.round(1500 * (v.pointer.x - 46) / Math.max(v.w - 56, 1)) / 1000)) }); return true; }
        const U = unrolled(M); let Smax = U.Stot; if (M.shape === 'half') Smax = Math.min(U.Stot, Math.max(10 * M.d, 4 * Math.abs(M.x[2]) + 4 * M.d, 3));
        const P = v.plot({ xlim: [0, Smax], ylim: [0, 1], pad: { t: 8, r: 10, b: 38 } }), sv = P.ix(v.pointer.x);
        const j = U.bars.findIndex(b => sv >= b.s0 && sv < b.s1);

    }
  },
  explore: {
    intro: 'Pick a filament above the picture. Drag the orange point, click a piece to trace its push, drag empty space to turn the view, press ▶ to add the pieces one by one.',
    controls: ['Gamma', 'ell', 'M', 'sign', 'px', 'pz'],
    readouts: ['u', 'uc', 'd', 'ul'],
    callouts: [{ kind: 'try', html: 'Predict, then check: how long must a segment be (ℓ in units of d) to give 99 % of Γ/2πd?' }]
  },
  terms: { title: 'The sum, quarter by quarter (along û)', unit: 'm/s',
    items: [
      { id: 'q1', label: '1st quarter', color: '#4f3dd0', value: s => cur(s).quart[0] },
      { id: 'q2', label: '2nd quarter', color: '#6c5ce7', value: s => cur(s).quart[1] },
      { id: 'q3', label: '3rd quarter', color: '#8e7ff0', value: s => cur(s).quart[2] },
      { id: 'q4', label: '4th quarter', color: '#b1a6f5', value: s => cur(s).quart[3] }
    ],
    total: { label: 'sum $|\\mathbf u|$' } },
  inspect: s => {
    const M = cur(s), j = pickOf(M, s); if (j === null) return null;
    const I = pieceInfo(M, j);
    return 'Piece ' + (j + 1) + ' of ' + M.n + ': $dl=' + tz(I.dl, 3) + '$ m at $\\mathbf x\'=' + vec(I.xm) + '$ m<br>' +
      '$' + XD + '=' + vec(I.rv) + '$ m, $' + AXD + '=' + tz(I.rn, 4) + '$ m' + (M.shape === 'segment' ? ', θ = ' + fz(I.th * 180 / PI, 3) + '°' : '') + '<br>' +
      '$\\mathbf e_\\omega\\times\\frac{' + XD + '}{' + AXD + '^3}=' + vec(I.k) + '$ m⁻²<br>' +
      '$d\\mathbf u=\\frac{\\Gamma\\,dl}{4\\pi}\\times$ that $=' + vec(I.duMid, 4) + '$ m/s (exact for the straight piece: $' + vec(I.duEx, 4) + '$)';
  },
  inspectHint: 'Click a piece of the filament (or a bar of the unrolled sum) to trace its push.',
  notes: s => '<p>' + readingText(s) + '</p>',
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  onChange: (s, key, a) => { if (key === 'shape') applyShape(a); }
};
function applyShape(a) {
  const tube = (a.state.shape || 'segment') === 'tube', lineLike = ['segment', 'half', 'tube', 'helix'].indexOf(a.state.shape || 'segment') >= 0;

  document.querySelectorAll('[data-viz-key="param:M"]').forEach(el => el.classList.toggle('bsf-off', tube));
  document.querySelectorAll('[data-viz-key="param:pz"]').forEach(el => el.classList.toggle('bsf-off', tube));
  document.querySelectorAll('[data-viz-key="readout:ul"]').forEach(el => el.classList.toggle('bsf-off', !lineLike));
  if (tube && Math.abs(a.state.px) < RMIN_TUBE) a.set('px', 0.5);

Object.assign(CFG, { derivations: DERIV, code: CODE, tour: TOUR, equations: EQS, check: QUIZ, selftest: selftestRows });
const app = Viz.app(CFG);
if (SHAPES.indexOf(app.state.shape) < 0) app.set('shape', 'segment');
applyShape(app); app.fit();
</script>
