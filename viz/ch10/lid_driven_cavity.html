.viz-transport { flex: 0 0 auto; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; padding: 4px 6px; }
.viz-stage:not(.multi) .viz-transport { border-top: 1px solid var(--viz-border); }
.viz-stage.multi .viz-transport { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); }

  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }

.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }

.viz-der-chain .viz-eq-body { flex: 1 1 auto; min-width: 0; }
.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }
.viz-der-chain .viz-eq-body { font-size: 14px; }
.viz-der-block { font-size: 13.5px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-der-block ol { margin: 2px 0 0 18px; padding: 0; } .viz-der-block li { margin: 0 0 2px; }
.viz-der-did { font-weight: 650; color: var(--viz-orange); padding-left: 6px; }
.viz-der-why { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }

.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }

  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--viz-card) 45%); padding-right: 2px; }
.viz-pager-cue[hidden] { display: none; }

.viz-app[data-layout="portrait"][data-paged] .viz-stage { flex-grow: 0; }

.viz-app[data-layout="portrait"][data-room="text"] .viz-stage { min-height: max(140px, 26%); }

  .viz-seg { flex-wrap: wrap; max-width: 100%; }

/* =====================================================================================================================
   PHYSICS — mirrors fluidpy.core.mac (re-exported by ch10): dt_limit (Eqs. 10.127-10.128), predictor (Eqs. 10.119-10.120,
   the discrete form of the predictor (10.116): central convective differences with the face averages of MAC.predictor,
   linear wall ghosts u_g = 2U - u_0, lid U = 1 passed explicitly), project (the Poisson equation (10.124) with one
   corner value pinned, factorised once per grid, then the correction (10.121)-(10.122)), cavity (dt = 0.8 dt_limit, march
   from rest, steady when max|du|/dt < tol_steady), streamfunction, curl (corner vorticity), primary_vortex_centre,
   cavity_centreline; and ch10.cavity_error_vs_ghia, ch10.richardson_three / ch10.grid_convergence_index (D23).
   Everything is non-dimensional as in Section 10.4: lengths in L, velocities in the lid speed U, time in L/U, Re = UL/nu.
   Layout: u[j*(n+1) + i] on the vertical faces x = i dx, y = (j + 1/2) dy; v[j*n + i] on the horizontal faces
   x = (i + 1/2) dx, y = j dy; p[j*n + i] at the cell centres (row j = y, column i = x), as fluidpy's [j, i].
   ===================================================================================================================== */
const LIVE = [16, 24, 32], TOL = 1e-6, SNAP = 0.25, WCLIP = 5;
const TEND = { 100: 40, 400: 60 };            // t_end of scripts/ch10_cavity.py (the cached fluidpy runs)
const MCK_TEND = { 100: 30, 400: 50 };

/** ch10.dt_limit(umax, vmax, Re, dx, safety) with dy = dx — Eqs. (10.127)-(10.128) */
function dtLim(umax, vmax, Re, dx, safety = 0.8) {
  const dy = dx, s2 = umax * umax + vmax * vmax;
  const dtc = s2 > 0 ? 2 / (s2 * Re) : Infinity;             // (10.127): (1/2)(u^2 + v^2) dt Re <= 1
  const dtd = Re / (2 * (1 / (dx * dx) + 1 / (dy * dy)));    // (10.128): 4 dt/(Re dx^2) <= 1
  return safety * Math.min(dtc, dtd);
}

/* ---- the pressure Poisson matrix (10.124), corner-pinned, LU-factorised once per grid in band storage ---------------
   (fluidpy: sparse LU of the same matrix; the pinned matrix minus its first row is negative definite, so elimination
   without pivoting is stable and the band of half-width n never fills beyond itself) */
const _LU = new Map();
function bandLU(n) {
  if (_LU.has(n)) return _LU.get(n);
  const N = n * n, w = n, W = 2 * w + 1, B = new Float64Array(N * W), a = n * n;   // a = 1/dx^2
  const at = (r, c) => r * W + w + c - r;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const k = j * n + i;
    if (k === 0) { B[at(0, 0)] = 1; continue; }                  // the pinned row: p_0 = 0
    if (i > 0) { B[at(k, k)] -= a; B[at(k, k - 1)] += a; }      // a wall face adds no link (Neumann built in)
    if (i < n - 1) { B[at(k, k)] -= a; B[at(k, k + 1)] += a; }
    if (j > 0) { B[at(k, k)] -= a; B[at(k, k - n)] += a; }
    if (j < n - 1) { B[at(k, k)] -= a; B[at(k, k + n)] += a; }
  }
  for (let k = 0; k < N; k++) {
    const pk = B[at(k, k)], cm = Math.min(N - 1, k + w);
    for (let r = k + 1; r <= cm; r++) {
      const ir = at(r, k), l = B[ir] / pk;
      if (l === 0) continue;
      B[ir] = l;
      const br = r * W + w - r, bk = k * W + w - k;
      for (let c = k + 1; c <= cm; c++) B[br + c] -= l * B[bk + c];
    }
  }
  const L = { n, N, w, W, B };
  _LU.set(n, L);
  return L;
}
function bandSolve(L, b) {
  const { N, w, W, B } = L, x = Float64Array.from(b);
  for (let r = 1; r < N; r++) { const br = r * W + w - r; let s = x[r]; for (let k = Math.max(0, r - w); k < r; k++) s -= B[br + k] * x[k]; x[r] = s; }
  for (let r = N - 1; r >= 0; r--) { const br = r * W + w - r, cm = Math.min(N - 1, r + w); let s = x[r]; for (let c = r + 1; c <= cm; c++) s -= B[br + c] * x[c]; x[r] = s / B[br + r]; }
  return x;
}

/** one MAC step (MAC.step): predictor (10.119)-(10.120) -> Poisson (10.124) -> correction (10.121)-(10.122) */
function macStep(u, v, n, Re, dt, lid) {
  const nu = n + 1, dx = 1 / n, dy = dx, us = Float64Array.from(u), vs = Float64Array.from(v);
  for (let j = 0; j < n; j++) for (let i = 1; i < n; i++) {         // interior u faces
    const k = j * nu + i, uc = u[k], ur = u[k + 1], ul = u[k - 1];
    const up = j < n - 1 ? u[k + nu] : 2 * lid - uc, dn = j > 0 ? u[k - nu] : 2 * 0 - uc;   // lid / wall ghosts
    const vb = 0.25 * (v[j * n + i - 1] + v[j * n + i] + v[(j + 1) * n + i - 1] + v[(j + 1) * n + i]);
    const ux = (ur - ul) / (2 * dx), uy = (up - dn) / (2 * dy);
    const lap = (ur - 2 * uc + ul) / (dx * dx) + (up - 2 * uc + dn) / (dy * dy);
    us[k] = uc + dt * (-(uc * ux + vb * uy) + lap / Re);
  }
  for (let j = 1; j < n; j++) for (let i = 0; i < n; i++) {         // interior v faces
    const k = j * n + i, vc = v[k], vu = v[k + n], vd = v[k - n];
    const vr = i < n - 1 ? v[k + 1] : 2 * 0 - vc, vl = i > 0 ? v[k - 1] : 2 * 0 - vc;
    const ub = 0.25 * (u[(j - 1) * nu + i] + u[(j - 1) * nu + i + 1] + u[j * nu + i] + u[j * nu + i + 1]);
    const vx = (vr - vl) / (2 * dx), vy = (vu - vd) / (2 * dy);
    const lap = (vr - 2 * vc + vl) / (dx * dx) + (vu - 2 * vc + vd) / (dy * dy);
    vs[k] = vc + dt * (-(ub * vx + vc * vy) + lap / Re);
  }
  // projection: the Poisson right-hand side div(u*)/dt, one corner value pinned, then the mean removed
  const N = n * n, b = new Float64Array(N);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) b[j * n + i] = ((us[j * nu + i + 1] - us[j * nu + i]) / dx + (vs[(j + 1) * n + i] - vs[j * n + i]) / dy) / dt;
  b[0] = 0;
  const p = bandSolve(bandLU(n), b);
  let m = 0; for (let k = 0; k < N; k++) m += p[k]; m /= N;
  for (let k = 0; k < N; k++) p[k] -= m;
  for (let j = 0; j < n; j++) for (let i = 1; i < n; i++) us[j * nu + i] -= dt * ((p[j * n + i] - p[j * n + i - 1]) / dx);
  for (let j = 1; j < n; j++) for (let i = 0; i < n; i++) vs[j * n + i] -= dt * ((p[j * n + i] - p[(j - 1) * n + i]) / dy);
  return { u: us, v: vs, p };
}

/* ---- a run: ch10.cavity(Re, n, t_end, tol_steady) marched incrementally, snapshots every SNAP time units ---------- */
function newRun(Re, n, tEnd, tol) {
  const dt = 0.8 * dtLim(1, 0, Re, 1 / n, 1.0);
  const cur = { u: new Float64Array(n * (n + 1)), v: new Float64Array((n + 1) * n), t: 0, k: 0, res: NaN };
  return { Re, n, dt, tEnd, tol, nsteps: Math.ceil(tEnd / dt), cur, snaps: [cur], nextSnap: SNAP, hist: [], done: false, converged: false, tSteady: null, want: 0 };
}
/** march until t >= tTarget, the steady test or t_end; stop early after budgetMs (returns true when finished) */
function advance(run, tTarget, budgetMs) {
  const t0 = Date.now();
  let c = run.cur;
  while (!run.done && c.t < tTarget - 1e-12) {
    const r = macStep(c.u, c.v, run.n, run.Re, run.dt, 1.0);
    let m = 0;
    for (let q = 0; q < r.u.length; q++) { const d = Math.abs(r.u[q] - c.u[q]); if (d > m) m = d; }
    for (let q = 0; q < r.v.length; q++) { const d = Math.abs(r.v[q] - c.v[q]); if (d > m) m = d; }
    c = { u: r.u, v: r.v, p: r.p, t: c.t + run.dt, k: c.k + 1, res: m / run.dt };
    run.cur = c;
    if (c.k % 10 === 0) run.hist.push([c.t, c.res]);
    if (c.t >= run.nextSnap - 1e-9) { run.snaps.push(c); while (run.nextSnap <= c.t + 1e-9) run.nextSnap += SNAP; }
    if (run.tol && c.res < run.tol) { run.done = true; run.converged = true; run.tSteady = c.t; }
    else if (c.k >= run.nsteps) run.done = true;
    if (!run.done && (c.k & 7) === 0 && budgetMs >= 0 && Date.now() - t0 > budgetMs) break;
  }
  if (run.done && run.snaps[run.snaps.length - 1] !== c) run.snaps.push(c);
  return run.done || c.t >= tTarget - 1e-12;
}
/** the stored state at time t (the last snapshot at or before t; the newest state when t is ahead) */
function stateAt(run, t) {
  if (t >= run.cur.t - 1e-9) return run.cur;
  const S = run.snaps;
  let lo = 0, hi = S.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (S[mid].t <= t + 1e-9) lo = mid; else hi = mid - 1; }
  return S[lo];
}
/** a whole run synchronously — ch10.cavity(Re, n, t_end, tol_steady, cache=False) — for the selftest */

/* =====================================================================================================================

function drawLogPanel(v, s, Q, S, rect) {

    ms.forEach(m => { const on = S.ns.indexOf(m) >= 0; P.dot(L(1 / m), E(fOf(Re, m, s.qty) - S.f_ext), on ? 5 : 3.5, { color: col('teal'), alpha: on ? 1 : 0.5 }); });

    Viz.text(ctx, `slope 2`, P.X(L(1 / 18)), P.Y(E(Math.abs(S.f1 - S.f_ext) * Math.pow((1 / 18) * S.ns[2], 2))) + 12, { color: col('muted'), size: 12, bg: true });
  }
}
function drawRichPanel(v, s, Q, S, rect) {

  const ms = GRIDS(Re), vals = ms.map(m => fOf(Re, m, qty)).concat([S.f_ext]);

    if (Q.q.kind !== 'mck' && CAV.mac[Re][Q.q.n]) P.dot(1 / Q.q.n, fOf(Re, Q.q.n, qty), 9, { color: 'rgba(0,0,0,0)', stroke: col('text'), strokeWidth: 1.6 });

function star(ctx, x, y, r, c) {

function convTitle(s) {

/* =====================================================================================================================

function picked(s, n) { const k = Math.round(s.pick); if (k < 0 || k >= n * n) return null; return { i: k % n, j: Math.floor(k / n) }; }

  const rich3 = ph ? ` · 📈 p ${S.p.toFixed(2)}, ★ ${f4(S.f_ext)}` : ` · 📈 p = ${S.p.toFixed(2)} from ${S.ns.join('/')}²; Richardson ${QN[s.qty]} = ${f5(S.f_ext)}`;
  if (Q.q.kind === 'cached') return { text: (ph ? `📦 ${Q.q.n}² cached: ${pct(Q.e.rel_max)} % of U from Ghia` : `📦 cached ${Q.q.n}² steady run (fluidpy): max deviation from Ghia ${f3(Q.e.max_dev)} = ${pct(Q.e.rel_max)} % of U`) + rich3, tone: 'info' };
  if (Q.q.kind === 'mck') return { text: ph ? `📦 MacCormack 64²: ${pct(Q.e.rel_max)} % of U from Ghia` : `📦 MacCormack 64² (weakly compressible, Ma = 0.08, cached): ${pct(Q.e.rel_max)} % of U from Ghia · mass drift ${pct(Q.q.tab.drift)} %`, tone: 'info' };
  if (Q.lag) return { text: `⏳ computing … reached t = ${tfix(Q.run.cur.t)}`, tone: 'warn' };
  if (Q.steady) return { text: ph ? `✅ steady t = ${tfix(Q.run.tSteady)} · 📏 ${pct(Q.e.rel_max)} % from Ghia` : `✅ steady: max|Δu|/Δt < 10⁻⁶ at t = ${tfix(Q.run.tSteady)} · 📏 within ${pct(Q.e.rel_max)} % of Ghia (max deviation ${f3(Q.e.max_dev)} at y = ${f3(CAV.ghia[Q.q.Re].y[Q.e.k])})`, tone: 'good' };

  const r = Q.st.k === 0 ? 'fluid at rest' : `max|Δu|/Δt = ${fe(Q.st.res)}`;
  return { text: ph ? `⏳ spinning up · ${r}` : `⏳ spinning up: ${r} at t = ${tfix(Q.st.t)} · ${pct(Q.e.rel_max)} % of U from Ghia so far`, tone: 'warn' };
}
function interpText(s) {

  if (Q.q.kind === 'live' && !Q.steady && !(Q.run.done && Q.st === Q.run.cur)) return `A benchmark is a steady state: wait for the start-up transient to die. At t = ${tfix(Q.st.t)} the flow still changes by max|Δu|/Δt = ${fe(Q.st.res)}; at Re = ${Re} it settles after about ${Re === 100 ? 22 : 55} lid transits.`;
  if (Re === 400) return `Re = 400: faster circulation, thinner shear layers. The same ${Q.q.n}² grid is ${Q.q.n <= 32 ? 'much less' : 'less'} converged — ${pct(Q.e.rel_max)} % of U from Ghia against ${pct(CAV.mac[100][Q.q.n] ? CAV.mac[100][Q.q.n].dev : Q.e.rel_max)} % at Re = 100 — and the eddy centre has moved down toward the middle.`;
  if (Q.q.n <= 24) return `The ${Q.q.n}² grid already has the right pattern, one big eddy and two corner eddies, but its u-minimum is too shallow (${f3(Q.umin)} against Ghia's smallest sample ${f3(Math.min(...CAV.ghia[100].u))}): the coarse grid smears the thin shear region. Refine and the curve sinks onto the black dots.`;
  if (Q.q.n === 128) return `128² sits ${pct(Q.e.rel_max)} % of U from Ghia — further than 64²! Ghia's own 129² solution carries errors of a few tenths of a per cent; below that level the comparison measures Ghia, not us. The self-convergence (teal) keeps falling like h²: that is the cleaner test.`;
  return `Within ${pct(Q.e.rel_max)} % of U of an independent, published solution — evidence that the code solves the equations it was meant to (verification, not proof). Three grids add the order: p = ${study(Re, s.qty).p.toFixed(2)}, the scheme's formal 2.`;
}
/** benchmark table (Ghia, Hou, ours per grid, MacCormack), the current row lit; on phones only the benchmarks and your row */
function benchTable(s) {

function inspectHtml(s) {

    { name: 'streamfunction 16 [10][7]', js: b.psi[10 * 17 + 7], py: `ch10.streamfunction(${PYC(100, 16)}["u"], ${PYC(100, 16)}["v"], ${PYC(100, 16)}["g"])[10][7]`, rtol: 1e-11 },
    { name: 'vorticity 16 [16][3] (lid)', js: b.om[16 * 17 + 3], py: `ch10.vorticity(${PYC(100, 16)}["u"], ${PYC(100, 16)}["v"], ${PYC(100, 16)}["g"])[16][3]`, rtol: 1e-11 },

    { name: 'cavity 32 steady: u_min on x = 1/2', js: c.umin, py: `ch10.cavity_centreline(${PYC(100, 32)})["u"].min()`, rtol: 1e-11 },
    { name: 'cavity 32 steady: max dev from Ghia', js: c.dev, py: `ch10.cavity_error_vs_ghia(${PYC(100, 32)}, 100)["max_dev"]`, rtol: 1e-11 },
    { name: 'cavity 32 steady: rms dev from Ghia', js: c.rms, py: `ch10.cavity_error_vs_ghia(${PYC(100, 32)}, 100)["rms_dev"]`, rtol: 1e-11 },
    { name: 'richardson tiny example f_ext', js: rich(1.000625, 1.0025, 1.01, 2).f_ext, py: 'ch10.richardson_three(1.000625, 1.0025, 1.01, 2.0)["f_ext"]', rtol: 1e-12 },
    { name: 'richardson tiny example p', js: tiny.p, py: 'ch10.richardson_three(1.000625, 1.0025, 1.01, 2.0)["p"]', rtol: 1e-12 },
    { name: 'richardson psi 32/64/128 p', js: S.p, py: `ch10.richardson_three(${PYPSI(100, 128)}, ${PYPSI(100, 64)}, ${PYPSI(100, 32)})["p"]`, rtol: 1e-12 },
    { name: 'richardson psi 32/64/128 f_ext', js: S.f_ext, py: `ch10.richardson_three(${PYPSI(100, 128)}, ${PYPSI(100, 64)}, ${PYPSI(100, 32)})["f_ext"]`, rtol: 1e-12 },
    { name: 'GCI_fine psi 32/64/128', js: S.gci_fine, py: `ch10.grid_convergence_index(${PYPSI(100, 128)}, ${PYPSI(100, 64)}, ${PYPSI(100, 32)})["gci_fine"]`, rtol: 1e-11 },
    { name: 'richardson u_min 16/32/64 p', js: Su.p, py: `ch10.richardson_three(ch10.cavity_centreline(${PYC(100, 64)})["u"].min(), ch10.cavity_centreline(${PYC(100, 32)})["u"].min(), ch10.cavity_centreline(${PYC(100, 16)})["u"].min())["p"]`, rtol: 1e-12 },
    { name: 'richardson psi Re 400 p', js: S4.p, py: `ch10.richardson_three(${PYPSI(400, 128)}, ${PYPSI(400, 64)}, ${PYPSI(400, 32)})["p"]`, rtol: 1e-12 },
    { name: 'table: psi_min 64 (cached run)', js: T[100][64].psi, py: PYPSI(100, 64), rtol: 1e-12 },
    { name: 'table: max dev Re 400, 64', js: T[400][64].dev, py: `ch10.cavity_error_vs_ghia(${PYC(400, 64)}, 400)["max_dev"]`, rtol: 1e-12 },

    { name: 'table: MacCormack 64 mass drift', js: M[100][64].drift, py: 'ch10.cavity_maccormack(Re=100.0, Ma=0.08, n=64, t_end=30.0, tol_steady=1e-6)["mass_drift"]', rtol: 1e-12 },

    { name: 'ghia table u[3] (Re 400)', js: CAV.ghia[400].u[3], py: 'ch10.ghia_centreline(400)["u"][3]', rtol: 1e-6 },

    { name: 'JS errGhia on the 6-digit 64 curve = table dev', js: errGhia({ y: T[100][64].y, u: T[100][64].u }, 100).max_dev, expect: T[100][64].dev, rtol: 2e-3 },

}

/* =====================================================================================================================
   the app
   ===================================================================================================================== */
const app = Viz.app({
  title: 'How do I know my CFD answer is right?',
  subtitle: 'A lid-driven cavity computed live by the MAC projection method (16²–32²) next to cached finer and MacCormack runs: the eddy spins up, the centreline approaches the Ghia et al. benchmark, and three grids give the observed order and a Richardson estimate',
  autoplay: false,
  params: {
    Re: { type: 'select', label: 'Reynolds number', display: 'chips', value: '100', options: [['100', 'Re 100'], ['400', 'Re 400']] },
    grid: { type: 'select', label: 'Grid', display: 'chips', value: '16', help: '16²–32² run live; (c) = a cached fluidpy steady run', options: [['16', '16²'], ['24', '24²'], ['32', '32²'], ['64', '64² (c)'], ['128', '128² (c)'], ['mck', 'MacC 64² (c)']] },
    qty: { type: 'select', label: 'Three-grid quantity', display: 'chips', value: 'psi', options: [['psi', 'ψ_min'], ['umin', 'u_min']], optional: true },
    others: { type: 'toggle', label: 'Show the other grids', value: false, optional: true },
    t: { label: 'Time $t$', min: 0, max: 60, step: 0.01, value: 6, unit: 'L/U', optional: true },
    pick: { label: 'Clicked cell', min: -1, max: 1100, step: 1, value: -1, optional: true },
    tick: { label: 'refresh', min: 0, max: 100000, step: 1, value: 0, optional: true }
  },
  transport: { param: 't', min: 0, max: 60, rate: 3, end: 'hold', hold: 3, unit: 'L/U' },
  presets: [
    { label: 'Re 100 · 16²', set: { Re: '100', grid: '16', t: 30 }, title: 'live, coarse: the right pattern, a shallow minimum' },
    { label: 'Re 100 · 32²', set: { Re: '100', grid: '32', t: 30 }, title: 'live: within 1 % of Ghia' },
    { label: '128² cached', set: { Re: '100', grid: '128' }, title: 'our finest run (fluidpy)' },
    { label: 'Re 400 · 32²', set: { Re: '400', grid: '32', t: 60 }, title: 'live, faster flow: thinner layers' },
    { label: 'MacCormack', set: { Re: '100', grid: 'mck' }, title: 'weakly compressible, Ma = 0.08 (cached)' },
    { label: 'three grids', set: Object.assign({}, THREE), title: 'observed order and Richardson (D23)' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 't', label: 'Time t', value: s => V(s).st.t, fmt: (x, s) => (V(s).q.kind === 'live' ? tfix(x) + ' L/U' : 'steady (cached)') },
    { id: 'steps', label: 'Steps', value: s => V(s).st.k, fmt: (x, s) => (V(s).q.kind === 'live' ? String(x) : String(V(s).q.tab.steps)) },
    { id: 'res', label: 'max|Δu|/Δt', value: s => V(s).st.res, fmt: (x, s) => (V(s).q.kind !== 'live' ? '< 10⁻⁶' : isFinite(x) ? fe(x) + ' U²/L' : '—') },
    { id: 'dev', label: 'Max dev. from Ghia', value: s => V(s).e.max_dev, fmt: x => `${f3(x)} (${pct(x)} % of U)` },
    { id: 'centre', label: 'Eddy centre', value: s => (V(s).c ? V(s).c.x : NaN), fmt: (x, s) => { const c = V(s).c; return c ? `(${f3(c.x)}, ${f3(c.y)}) L` : '—'; } },
    { id: 'p', label: 'Observed order p', value: s => study(Number(s.Re), s.qty).p, fmt: (x, s) => `${x.toFixed(2)} (${study(Number(s.Re), s.qty).ns.join('/')}²)` },
    { id: 'div', label: 'max|∇·u|', value: s => V(s).d.div, fmt: x => fe(x) }
  ],
  stage: {
    rows: [1.3, 1],
    views: [
      { id: 'cavity', row: 0, flex: 1.05, title: s => cavTitle(s) },
      { id: 'centre', row: 0, flex: 1, title: s => centreTitle(s) },
      { id: 'conv', row: 1, flex: 1, hidePortrait: true, title: s => convTitle(s) }
    ],
    step(g, s, dt) { if (TRACERS && dt > 0) TRACERS.step(Math.min(0.08, dt * 3), 0); },
    draw(g, s) { drawCavity(g, s); drawCentre(g, s); drawConv(g, s); },
    onPointer(g, ev, s) {
      if (ev.viewId !== 'cavity' || ev.type !== 'pointerdown' || !PCAV) return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const P = PCAV.P, X = v.pointer.x, Y = v.pointer.y;
      if (!P.inside(X, Y)) return false;
      const n = PCAV.n, i = Math.min(n - 1, Math.floor(P.ix(X) * n)), j = Math.min(n - 1, Math.floor(P.iy(Y) * n));
      g.app.set({ pick: j * n + i }); return true;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a cell of the cavity: its velocity, its divergence (four faces) and its vorticity, with every number.',
  notes: s => '<p>' + interpText(s) + '</p>' + benchTable(s),
  explore: {
    intro: 'Choose Re and a grid, press ▶ to march the live solver from rest (or drag t); the cached grids are fluidpy steady runs. Click the cavity to trace a cell.',
    controls: ['Re', 'grid', 'qty', 'others'],
    readouts: ['t', 'res', 'dev', 'centre', 'p'],
    callouts: [{ kind: 'try', html: 'Run 16², 24² and 32² to steady state in turn with <b>Show the other grids</b> on: the blue curve sinks onto the black dots.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange(s, key) { if (key === 'grid' || key === 'Re') { if (s.pick >= 0) { const q = sel(s); if (s.pick >= q.field * q.field) s.pick = -1; } } }
});
APP = app;
</script>
