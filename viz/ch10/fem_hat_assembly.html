function inspectHtml(s) {

    const syms = cs.map(c => (cs.length > 1 ? `\\big(${sym[c.a][c.b]}\\big)` : sym[c.a][c.b])).join('+');
    const nums = cs.map(c => { const x = blk[c.a][c.b]; return x < 0 && cs.length > 1 ? `(${t4(x)})` : t4(x); }).join('+');

  { id: 'D11', title: 'Galerkin to matrix form', short: 'D11 M,K', ref: 'Eqs. (10.55), (10.56), (10.57), (10.58)', view: 'matrix',

const pn = (v, k = 4) => (!isFinite(v) ? 'nan' : Math.abs(v) < 1e-300 ? '0.0' : Math.abs(v) < 1e-3 || Math.abs(v) >= 1e5 ? v.toExponential(k - 1).replace(/\.?0+e/, 'e') : String(Number(v.toPrecision(k))));

function selftestRows() {
  const tr4 = assemble(meshNodes(4), 1, 0.25, 3, false).K, tr2 = assemble(meshNodes(4), 1, 0.25, 2, false).K;
  const lumpM = assemble(meshNodes(4), 1, 0.25, 4, true).M;
  const d4 = solveSteady(4, 1, 0.25, 'dirichlet');
  const rs = rowStencil(0.25, 1, 0.25), K10 = assemble(meshNodes(10), 1, 0.1, 10, false).K;
  let rsum = 0; for (let i = 1; i < 10; i++) rsum = Math.max(rsum, Math.abs(K10[i].reduce((a, b) => a + b, 0)));   // interior rows
  return [
    { name: 'k21 (h 0.25, u 1, D 0.25)', js: elem(0.25, 1, 0.25).k[1][0], py: 'ch10.element_matrices_linear(0.25, 1.0, 0.25)[1][1][0]', rtol: 1e-12 },
    { name: 'm11 (h 0.25)', js: elem(0.25, 1, 0.25).m[0][0], py: 'ch10.element_matrices_linear(0.25, 1.0, 0.25)[0][0][0]', rtol: 1e-12 },
    { name: 'k12 (h 0.1, u 1, D 0.025)', js: elem(0.1, 1, 0.025).k[0][1], py: 'ch10.element_matrices_linear(0.1, 1.0, 0.025)[1][0][1]', rtol: 1e-12 },
    { name: 'steady T2 (n 4, D 0.25, T(1) = 1)', js: d4[2], py: 'ch10.solve_steady(np.linspace(0.0, 1.0, 5), 1.0, 0.25, T_L=1.0)["T"][2]', rtol: 1e-12 },
    { name: 'steady T3 (n 4, D 0.1, wiggles)', js: solveSteady(4, 1, 0.1, 'dirichlet')[3], py: 'ch10.solve_steady(np.linspace(0.0, 1.0, 5), 1.0, 0.1, T_L=1.0)["T"][3]', rtol: 1e-12 },
    { name: 'steady natural T8 (n 8, D 0.25, q 1)', js: solveSteady(8, 1, 0.25, 'neumann', 1)[8], py: 'ch10.solve_steady(np.linspace(0.0, 1.0, 9), 1.0, 0.25, q=1.0)["T"][8]', rtol: 1e-12 },
    { name: 'steady natural T5 (n 13, D 0.07, q 1)', js: solveSteady(13, 1, 0.07, 'neumann', 1)[5], py: 'ch10.solve_steady(np.linspace(0.0, 1.0, 14), 1.0, 0.07, q=1.0)["T"][5]', rtol: 1e-12 },

    { name: 'steady_cd_fd central T5 (n 10, R 10)', js: fdCentral(10, 10).T[5], py: 'ch10.steady_cd_fd(10, 10.0)["T"][5]', rtol: 1e-12 },
    { name: 'steady_cd_exact(0.25, R 4)', js: exactD(0.25, 4), py: 'ch10.steady_cd_exact(0.25, 4.0)', rtol: 1e-12 },
    { name: 'steady_cd_exact(0.9, R 40)', js: exactD(0.9, 40), py: 'ch10.steady_cd_exact(0.9, 40.0)', rtol: 1e-12 },

    { id: 'dmax', label: 'max |FE − FD|', value: s => M(s).dmax, fmt: v => (isFinite(v) ? fdTxt(v) : 'fixed ends only') },
    { id: 'slope', label: 'FE slope at x = 1', value: s => M(s).slopeFE, fmt: v => Viz.fmt(v, { sig: 3 }) + ' (q = 1)', optional: true }
  ],
  terms: { title: 'Row A of K·d at the solution', unit: 'm/s', items: [
    { id: 'conv', label: 'convection u/2 (d₊ − d₋)', color: Viz.color('rose'), value: s => M(s).conv },
    { id: 'diff', label: 'diffusion D/h (−d₋ + 2d − d₊)', color: Viz.color('teal'), value: s => M(s).diff }], total: { label: 'sum = F_A = 0' } },
  stage: {
    rows: [1, 1.15],
    views: [
      { id: 'mesh', row: 0, flex: 1, title: s => meshTitle(s) },
      { id: 'matrix', row: 1, flex: 1, title: s => matTitle(s) },
      { id: 'row', row: 1, flex: 1.25, hidePortrait: true, title: s => rowTitle(s) }
    ],
    draw(g, s) { drawMesh(g, s); drawMatrix(g, s); drawRow(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer || ev.type !== 'pointerdown') return false;
      if (ev.viewId === 'matrix' && LAYM) {
        const j = Math.floor((v.pointer.x - LAYM.x0) / LAYM.cs), i = Math.floor((v.pointer.y - LAYM.y0) / LAYM.cs);
        if (i >= 0 && j >= 0 && i < LAYM.N && j < LAYM.N) { g.app.set({ ci: i, cj: j }); return true; }
        return false;
      }
      if (ev.viewId === 'mesh' && PM && PM.inside(v.pointer.x, v.pointer.y)) {
        const n = Math.round(s.nel), A = clamp(Math.round(PM.ix(v.pointer.x) * n), 1, n - 1);
        g.app.set({ A, ci: A, cj: A }); return true;
      }
      return false;
    }
  },
  onChange(s, key, a) { if (key === 'nel') { a.cfg.transport.step = 1 / Math.round(s.nel); } },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a cell of the matrix to see which elements added into it; click a node in the hats view to pick the test function.',
  notes: s => interpText(s),
  explore: {
    intro: 'Press ▶ to run the element loop. Change the number of elements and the Péclet number, click a matrix cell to trace it, and switch the right end between fixed and natural.',
    controls: ['nel', 'R', 'A', 'mat', 'mass'],
    readouts: ['h', 'Rc', 'row', 'dA', 'dmax'],
    callouts: [{ kind: 'try', html: 'Press <b>R = 10 wiggles</b>: the blue dots zigzag and sit exactly on the orange crosses. Then <b>fine mesh</b>: both smooth out together — FE cannot beat centred FD here, because it <i>is</i> centred FD.' },
      { kind: 'watch', html: 'Row 2 of K times h reads (−u/2 − D/h, 2D/h, u/2 − D/h): convection makes it lopsided, diffusion symmetric.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});

</script>
