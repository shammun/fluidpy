    uses: ['linearity (superposition)', 'Fourier modes (R04)', 'Euler\'s formula and complex exponentials (Ch. 1 P45, Ch. 6 P153)'],
    steps: [
      { did: 'Write FTCS for the exact discrete solution', tex: R`\begin{aligned}T^{n+1}_i=T^n_i&-\alpha(T^n_{i+1}-T^n_{i-1})\\&+\beta(T^n_{i+1}-2T^n_i+T^n_{i-1})\end{aligned}`,
        why: R`The FTCS rule (10.10) with "=" because $T$ is by definition the exact solution of the discrete system.`, plain: 'The rule, obeyed perfectly.' },
      { did: 'Write it for the computed values', tex: R`\begin{aligned}\overline T^{\,n+1}_i=\overline T^{\,n}_i&-\alpha(\overline T^{\,n}_{i+1}-\overline T^{\,n}_{i-1})\\&+\beta(\overline T^{\,n}_{i+1}-2\overline T^{\,n}_i+\overline T^{\,n}_{i-1})\end{aligned}`,
        why: 'The computer applies the same rule to its own (slightly wrong) numbers; we follow how an error present at step $n$ travels on.', plain: 'The rule, applied to the numbers we actually hold.' },
      { did: 'Subtract step 2 from step 1', tex: R`\begin{aligned}\xi^{n+1}_i=\xi^n_i&-\alpha(\xi^n_{i+1}-\xi^n_{i-1})\\&+\beta(\xi^n_{i+1}-2\xi^n_i+\xi^n_{i-1})\end{aligned}`,
        why: R`The rule is linear, so the difference of two solutions is again a solution, with $\xi=T-\overline T$ (10.18). This is the move the book skips.`, plain: 'The error obeys the same rule as the temperature.',
        watch: 'The error view marches the kick with exactly this rule: it obeys the same rule as T.' },
      { did: 'Collect the coefficients', tex: R`\begin{aligned}\xi^{n+1}_i={}&(\alpha+\beta)\xi^n_{i-1}+(1-2\beta)\xi^n_i\\&+(\beta-\alpha)\xi^n_{i+1}\end{aligned}`,
        why: R`Gather the terms of $\xi_{i-1}$ ($+\alpha+\beta$), $\xi_i$ ($1-2\beta$) and $\xi_{i+1}$ ($-\alpha+\beta$); this is the book's (10.19).`, plain: 'Each new error is a weighted mix of three old ones.',
        live: s => { const n = N(s); return R`\xi^{n+1}_i=${t3(n.a + n.b)}\,\xi_{i-1}+${t3(1 - 2 * n.b)}\,\xi_i+${t3(n.b - n.a)}\,\xi_{i+1}`; } },
      { did: 'Follow one Fourier wave', tex: R`\xi^n_j=\hat\xi^n\,e^{\mathrm i\pi kx_j}\qquad(10.21)`,
        why: R`Any grid error is a sum of such waves, $\xi^n_j=\sum_k g^n(k)e^{\mathrm i\pi kx_j}$ (10.20) (R04); the rule is linear and a wave stays a wave, so each can be followed alone.`,
        plain: 'One wave, with an amplitude that may change from step to step (index renamed $j$; amplitude $\\hat\\xi^n$ is the book\'s $g^n(k)$).' },
      { did: 'The same wave one step later', tex: R`\xi^{n+1}_j=\hat\xi^{n+1}e^{\mathrm i\pi kx_j}\qquad(10.22)`,
        why: 'The shape in space is fixed by $k$; only the amplitude can change — that is what we want to find.', plain: 'Same wave, new amplitude.' },
      { did: 'Substitute into the error equation (step 4)', tex: R`\begin{aligned}\hat\xi^{n+1}e^{\mathrm i\pi kx_j}=\hat\xi^n\big[&(\alpha+\beta)e^{\mathrm i\pi kx_{j-1}}\\&+(1-2\beta)e^{\mathrm i\pi kx_j}\\&+(\beta-\alpha)e^{\mathrm i\pi kx_{j+1}}\big]\end{aligned}`,
        why: 'Steps 5 and 6 inserted in step 4, point by point; this is the book\'s line $g^{n+1}e^{\\mathrm i\\pi kx_i}=g^n[\\dots]$ (10.23).', plain: 'The rule applied to the wave.' },
      { did: 'Shift the neighbours', tex: R`e^{\mathrm i\pi kx_{j\pm1}}=e^{\mathrm i\pi kx_j}\,e^{\pm\mathrm i\theta},\quad\theta=k\pi\Delta x`,
        why: R`$x_{j\pm1}=x_j\pm\Delta x$ and $e^{a+b}=e^ae^b$; $\theta$ is the phase change per cell (the book's convention: $k$ counts half-waves per unit length).`, plain: 'A neighbour\'s wave value is ours, turned by θ.',
        live: s => { const n = N(s); return R`\theta=${piTex(n.th)}:\ e^{\pm\mathrm i\theta}=${t3(Math.cos(n.th))}\pm${t3(Math.sin(n.th))}\,\mathrm i`; } },
      { did: R`Divide by $\hat\xi^ne^{\mathrm i\pi kx_j}$`, tex: R`\begin{aligned}G\equiv\frac{\hat\xi^{n+1}}{\hat\xi^n}={}&(\alpha+\beta)e^{-\mathrm i\theta}+(1-2\beta)\\&+(\beta-\alpha)e^{\mathrm i\theta}\end{aligned}`,
        why: R`$e^{\mathrm i\pi kx_j}$ is never zero and appears in every term, so it cancels; we assume $\hat\xi^n\ne0$ (a wave that is present). The result no longer depends on $j$: the book's (10.24).`,
        plain: 'One complex number G per wave.', highlight: ['readout:G'],
        live: s => { const n = N(s); return R`G(${piTex(n.th)})=${ctex(G(n.th, n.a, n.b, 'ftcs'))}`; } },
      { did: 'Repeat n times', tex: R`\hat\xi^n=G^n\hat\xi^0,\qquad\lvert\hat\xi^n\rvert=\lvert G\rvert^n\lvert\hat\xi^0\rvert`,
        why: 'G is the same at every step (constant α, β), so the amplitude is multiplied by G again and again; the modulus of a product is the product of moduli.', plain: 'After n steps the wave has grown or shrunk by $\\lvert G\\rvert^n$.',
        live: s => { const n = N(s), k = Math.max(1, Math.floor(s.n) || 100); return R`\lvert G\rvert^{${k}}=${t3(n.gm)}^{${k}}=${Viz.tnum(Math.pow(n.gm, k), 3, { keepTiny: true })}`; } },
      { did: 'Demand no growth for every wave', tex: R`\Big\lvert\frac{g^{n+1}}{g^n}\Big\rvert=\lvert G(\theta)\rvert\le1\ \ \text{for all }\theta\in[0,\pi]`,
        why: R`One wave with $\lvert G\rvert>1$ grows without bound from round-off; $G(-\theta)$ is the complex conjugate of $G(\theta)$, so $\theta\in[0,\pi]$ covers every wave the grid can carry.`,
        plain: 'Stable means no wave grows — the book\'s condition (10.25).', set: { alpha: 0, beta: 0.51, theta: PI, n: 0 }, watch: 'At β = 0.51 the zigzag θ = π has |G| = 1.04: the error view climbs from 10⁻¹⁰.' }
    ],
    result: { tex: R`\begin{aligned}\xi^{n+1}_i&=(\alpha+\beta)\xi^n_{i-1}+(1-2\beta)\xi^n_i+(\beta-\alpha)\xi^n_{i+1}\\ G&=(\alpha+\beta)e^{-\mathrm i\theta}+(1-2\beta)+(\beta-\alpha)e^{\mathrm i\theta}\\ \text{stable}&\iff\lvert G(\theta)\rvert\le1\ \ \forall\theta\end{aligned}`,
      plain: 'Eq. (10.19), Eq. (10.24) and the condition (10.25): the error of a linear scheme obeys the scheme, and every wave of it is multiplied by $G(\\theta)$ each step.' },
    interpret: s => { const n = N(s); return `With α = ${f3(n.a)}, β = ${f3(n.b)}: max|G| = ${fG(n.v.Gmax)} — ${pretty(n.v.reason)}.`; },
    check: `G is dimensionless ✓. θ = 0 (a constant error): G = (α + β) + (1 − 2β) + (β − α) = 1 — a constant offset neither grows nor decays ✓. θ = π/2, α = 0.1, β = 0.2: G = ${ctxt(G(PI / 2, 0.1, 0.2, 'ftcs'))} ✓ (selftest rows against ch10.amplification_factor).` },

  { id: 'D05', title: 'The size of G', short: 'D05 |G|²', ref: 'Eq. (10.26)', view: 'plane', set: Object.assign({}, C02),
    goal: 'Turn the complex G into a real formula whose size can be compared with 1.',
    start: { tex: R`\begin{aligned}G={}&(\alpha+\beta)e^{-\mathrm i\theta}+(1-2\beta)\\&+(\beta-\alpha)e^{\mathrm i\theta}\end{aligned}`, plain: R`The factor one wave is multiplied by, Eq. (10.24) with $\theta=k\pi\Delta x$.` },
    plan: ['Split $G$ into real and imaginary parts with Euler\'s formula.', 'Rewrite $1-\\cos\\theta$ with a half angle.', 'Square and add.'],
    uses: ['Euler\'s formula (Ch. 1 P45)', 'half-angle identities (primer P225)', 'the modulus of a complex number (Ch. 6 P153)'],
    steps: [
      { did: 'Insert Euler\'s formula', tex: R`\begin{aligned}G={}&(\alpha+\beta)(\cos\theta-\mathrm i\sin\theta)+(1-2\beta)\\&+(\beta-\alpha)(\cos\theta+\mathrm i\sin\theta)\end{aligned}`,
        why: R`$e^{\pm\mathrm i\theta}=\cos\theta\pm\mathrm i\sin\theta$ (P45); we want $G$ as "real + i·real".`, plain: 'The two turned neighbours written with cos and sin.' },
      { did: 'Collect the real part', tex: R`\begin{aligned}\mathrm{Re}\,G&=(\alpha+\beta+\beta-\alpha)\cos\theta+1-2\beta\\&=1-2\beta(1-\cos\theta)\end{aligned}`,
        why: R`The α terms cancel in the real part; $2\beta\cos\theta+1-2\beta$ regroups as $1-2\beta(1-\cos\theta)$.`, plain: 'Diffusion alone sets the real part.', highlight: ['term:re'] },
      { did: 'Collect the imaginary part', tex: R`\mathrm{Im}\,G=\big[-(\alpha+\beta)+(\beta-\alpha)\big]\sin\theta=-2\alpha\sin\theta`,
        why: 'Now the β terms cancel; only convection survives.', plain: 'Convection alone sets the imaginary part.', highlight: ['term:im'] },
      { did: 'Use the half-angle identity', tex: R`1-\cos\theta=2\sin^2\tfrac\theta2`,
        why: 'P225; it turns a quantity running from 0 to 2 into 2 × (a square between 0 and 1), which makes step 7 and D06 clean.', plain: 'A cosine rewritten as a square.' },
      { did: 'Rewrite the real part', tex: R`\mathrm{Re}\,G=1-4\beta\sin^2\tfrac\theta2`,
        why: R`Substitute step 4 into step 2: $2\beta\times2\sin^2=4\beta\sin^2$.`, plain: 'The real part drops from 1 as the wave gets shorter.' },
      { did: 'Assemble G', tex: R`G=\big(1-4\beta\sin^2\tfrac\theta2\big)-2\mathrm i\alpha\sin\theta`,
        why: 'Steps 5 and 3 together; a compact form for plotting (the curve in the complex plane).', plain: 'G = (damping part) − i (turning part).',
        live: s => { const n = N(s); return R`G=${t3(1 - 4 * n.b * n.sh2)}-${t3(2 * n.a * Math.sin(n.th))}\,\mathrm i\ \ (\theta=${piTex(n.th)})`; } },
      { did: 'Square and add', tex: R`\lvert G\rvert^2=\big(1-4\beta\sin^2\tfrac\theta2\big)^2+(2\alpha\sin\theta)^2`,
        why: R`$\lvert a+\mathrm ib\rvert^2=a^2+b^2$ (P153); the sign of the imaginary part disappears in the square.`, plain: 'The squared size of the factor.', highlight: ['term:re', 'term:im'] },
      { did: 'Apply the stability condition', tex: R`\big(1-4\beta\sin^2\tfrac\theta2\big)^2+(2\alpha\sin\theta)^2\le1`,
        why: R`The condition $\lvert G\rvert\le1$ (10.25) squared (both sides are non-negative, so squaring keeps the inequality); the result is the book's (10.26).`, plain: 'The book\'s stability condition for FTCS, for every θ.',
        live: s => { const n = N(s); return R`\lvert G\rvert^2=${t3(Math.pow(1 - 4 * n.b * n.sh2, 2))}+${t3(Math.pow(2 * n.a * Math.sin(n.th), 2))}=${t3(mod2(n.th, n.a, n.b))}`; } }
    ],
    result: { tex: R`\lvert G\rvert^2=\big(1-4\beta\sin^2\tfrac\theta2\big)^2+(2\alpha\sin\theta)^2\le1`, plain: R`Eq. (10.26), $\lvert G\rvert^2\le1$: the real part carries diffusion, the imaginary part convection, and the squared size must not exceed 1.` },
    interpret: s => { const n = N(s); return `At your θ = ${piTxt(n.th)}: diffusion part ${f3(Math.pow(1 - 4 * n.b * n.sh2, 2))} + convection part ${f3(Math.pow(2 * n.a * Math.sin(n.th), 2))} = ${f3(mod2(n.th, n.a, n.b))}.`; },
    check: `θ = π/2, α = 0.1, β = 0.2: (1 − 0.4)² + 0.2² = ${f2(mod2(PI / 2, 0.1, 0.2))} = |0.6 − 0.2i|² ✓. α = 0, θ = π: |G| = |1 − 4β|, the zigzag factor ✓. Selftest: the closed form against ch10.ftcs_amplification_modulus2 and |G|² of ch10.amplification_factor.` },

  { id: 'D06', title: "Noye's region, the diffusion limit and pure convection", short: 'D06 Noye', ref: 'Eq. (10.27), (10.28)', view: 'region', set: Object.assign({}, C02),
    goal: 'Replace "|G| ≤ 1 for every wave" by conditions on α and β alone — the book cites Noye (1983) without proof; we derive it.',
    start: { tex: R`\begin{aligned}&\big(1-4\beta\sin^2\tfrac\theta2\big)^2+(2\alpha\sin\theta)^2\le1\\&\text{for all }\theta\in[0,\pi]\end{aligned}`, plain: R`No wave may grow: the condition $\lvert G\rvert^2\le1$ of Eq. (10.26).` },
    plan: ['Change variable to $s=\\sin^2(\\theta/2)\\in[0,1]$.', 'Factor $\\lvert G\\rvert^2-1$ = s × (a straight line in s).', 'A line is ≤ 0 on an interval iff it is ≤ 0 at both ends.', 'Read the special cases.'],
    uses: ['half-angle identities (P225)', 'sign of a linear function on an interval (primer P226)'],
    steps: [
      { did: 'Name s = sin²(θ/2)', tex: R`s=\sin^2\tfrac\theta2\in[0,1]\quad\text{for }\theta\in[0,\pi]`,
        why: 'As θ runs over [0, π], θ/2 runs over [0, π/2] and its sine squared over [0, 1]: one variable instead of two trigonometric functions.', plain: 's = 0 is the longest wave, s = 1 the zigzag.' },
      { did: 'Express sin²θ through s', tex: R`\sin^2\theta=4\sin^2\tfrac\theta2\cos^2\tfrac\theta2=4s(1-s)`,
        why: R`The double-angle rule $\sin\theta=2\sin\frac\theta2\cos\frac\theta2$ and $\cos^2=1-\sin^2$ (P225) put the convective term in the same variable $s$.`, plain: 'The convective term, in the same variable.' },
      { did: 'Rewrite |G|² in s', tex: R`\lvert G\rvert^2=(1-4\beta s)^2+16\alpha^2s(1-s)`,
        why: R`Substitute steps 1–2 into (10.26): $(2\alpha)^2\cdot4s(1-s)=16\alpha^2s(1-s)$.`, plain: '|G|² is a quadratic in s.' },
      { did: 'Expand the square', tex: R`\lvert G\rvert^2=1-8\beta s+16\beta^2s^2+16\alpha^2s-16\alpha^2s^2`,
        why: R`$(1-4\beta s)^2=1-8\beta s+16\beta^2s^2$; multiply out the second term.`, plain: 'Every term written separately.' },
      { did: 'Subtract 1 and factor out s', tex: R`\lvert G\rvert^2-1=s\big[16\alpha^2-8\beta+s(16\beta^2-16\alpha^2)\big]`,
        why: 'The constant 1 cancels and every remaining term contains $s$.', plain: 'Growth minus one equals s times a straight line in s.' },
      { did: 'Handle the longest wave, s = 0', tex: R`s=0:\ \lvert G\rvert^2-1=0`,
        why: 'θ = 0 is a constant error, G = 1 (D04 check): it never grows, so it imposes no condition.', plain: 'A constant offset is harmless.' },
      { did: 'Divide by s > 0', tex: R`\begin{aligned}f(s)&\equiv16\alpha^2-8\beta\\&\quad+s(16\beta^2-16\alpha^2)\\&\le0\ \ \text{for all }s\in(0,1]\end{aligned}`,
        why: 'Dividing an inequality by a positive number keeps its direction ($s>0$ here).', plain: 'Stability ⇔ a straight line stays below zero.',
        live: s => { const n = N(s); return R`f(s)=${t3(16 * n.a * n.a - 8 * n.b)}+${t3(16 * n.b * n.b - 16 * n.a * n.a)}\,s`; } },
      { did: 'Use the endpoint rule for a line', tex: R`f\le0\text{ on }(0,1]\iff f(0^+)\le0\ \text{and}\ f(1)\le0`,
        why: 'P226: a linear function takes its largest value at an end of the interval; at the open end we need the limit s → 0⁺, i.e. f(0) ≤ 0 by continuity.', plain: 'Check the two ends only.' },
      { did: 'The long-wave end, s → 0⁺', tex: R`16\alpha^2-8\beta\le0\iff4\alpha^2\le2\beta`,
        why: 'Put $s=0$ in $f$ and divide by 4. This is the edge where convection kicks long waves harder than diffusion damps them.', plain: 'Enough diffusion for the long waves.',
        set: { alpha: 0.3, beta: 0.18, scheme: 'ftcs', huge: false }, watch: 'The dot sits on the parabola 4α² = 2β: on the long-wave edge, still stable.' },
      { did: 'The zigzag end, s = 1', tex: R`\begin{aligned}16\beta^2-8\beta&\le0\\ \iff8\beta(2\beta-1)&\le0\\ \iff0\le\beta&\le\tfrac12\end{aligned}`,
        why: 'At $s=1$ the α² terms cancel; a product of two factors is ≤ 0 when they have opposite signs, which with β ≥ 0 gives 2β ≤ 1.', plain: 'Diffusion must not overshoot the shortest wave.',
        set: { alpha: 0, beta: 0.5, scheme: 'ftcs', huge: false }, watch: 'The dot sits on the top edge 2β = 1: the zigzag keeps its size exactly.' },
      { did: 'Combine the two ends', tex: R`0\le4\alpha^2\le2\beta\le1`,
        why: R`$4\alpha^2\ge0$ always; steps 9 and 10 chained; both are needed and together sufficient (step 8). This is the book's (10.27).`, plain: "Noye's region: a lens in the (α, β) plane.",
        set: Object.assign({}, C02), live: s => { const n = N(s); return R`0\le${t3(4 * n.a * n.a)}\ ${4 * n.a * n.a <= 2 * n.b + 1e-12 ? R`\le` : '>'}\ ${t3(2 * n.b)}\ ${2 * n.b <= 1 + 1e-12 ? R`\le` : '>'}\ 1`; } },
      { did: 'Pure diffusion, u = 0', tex: R`0\le\beta\le\tfrac12\iff\Delta t\le\tfrac12\frac{\Delta x^2}{D}`,
        why: R`α = 0 makes step 9 automatic; step 10 remains; $\beta=D\Delta t/\Delta x^2$ (10.11) solved for Δt gives the book's (10.28). Ch. 1's $r\le\frac12$ (R05).`, plain: 'The diffusion time-step limit.',
        set: { alpha: 0, beta: 0.51, scheme: 'ftcs', huge: false }, watch: 'β = 0.51, just above ½: the dot has left the lens through the top edge.',
        live: s => R`\begin{aligned}&\Delta x=0.01\text{ m},\ D=0.01\text{ m}^2/\text{s}:\\ &\Delta t\le0.005\text{ s}\end{aligned}` },
      { did: 'Pure convection, D = 0', tex: R`\begin{aligned}\beta=0:\ \lvert G\rvert^2&=1+4\alpha^2\sin^2\theta\\&>1\ \ (0<\theta<\pi,\ \alpha\ne0)\end{aligned}`,
        why: R`With β = 0, step 9 demands $4\alpha^2\le0$, i.e. $u=0$; directly, (10.26) becomes $1+(2\alpha\sin\theta)^2$, larger than 1 for every wave except θ = 0, π. The book's "never satisfied".`,
        plain: 'FTCS cannot do pure convection at any time step.', set: { alpha: 0.2, beta: 0, scheme: 'ftcs', huge: false }, watch: 'The dot lies on the α axis, outside the lens for every α > 0.' }
    ],
    result: { tex: R`\begin{aligned}&0\le4\alpha^2\le2\beta\le1\\ &u=0:\ \Delta t\le\tfrac12\frac{\Delta x^2}{D}\\ &D=0:\ \text{never stable}\end{aligned}`,
      plain: R`Eq. (10.27), $0\le4\alpha^2\le2\beta\le1$, and Eq. (10.28), $\Delta t\le\frac12\frac{\Delta x^2}{D}$: FTCS is stable exactly when diffusion is strong enough for the long waves (4α² ≤ 2β) and gentle enough for the zigzag (2β ≤ 1).`, set: Object.assign({}, C02) },
    interpret: s => { const n = N(s); return `Your point: 4α² = ${f3(4 * n.a * n.a)}, 2β = ${f3(2 * n.b)} — ${n.noyeOK ? 'inside' : 'outside'} the lens (${n.sc === 'ftcs' ? pretty(n.v.reason) : 'the lens is the FTCS test; switch to FTCS'}). In physical terms 4α² ≤ 2β means u²Δt ≤ 2D.`; },
    check: `(α, β) = (0.1, 0.2): 0.04 ≤ 0.4 ≤ 1 ✓ stable; (0.4, 0.2): 0.64 > 0.4 ✗ (the scan finds max|G| = ${fG(Gmax('ftcs', 0.4, 0.2))} at θ = ${piTxt(worstTheta('ftcs', 0.4, 0.2))}); (0, 0.51): 1.02 > 1 ✗ (|G(π)| = ${fG(Gmax('ftcs', 0, 0.51))}). The rose scan dots of the region view agree with the closed form.` },

  { id: 'D07', title: 'BTCS is stable for every time step', short: 'D07 BTCS', ref: 'Eq. (10.13)', view: 'plane', set: { alpha: 0.1, beta: 0.2, scheme: 'btcs', huge: false, theta: PI / 2 },
    goal: 'Show what the book asserts ("it can easily be shown"): the implicit scheme never lets an error grow, whatever Δt.',
    start: { tex: R`\begin{aligned}T^n_i&+\alpha(T^n_{i+1}-T^n_{i-1})\\&-\beta(T^n_{i+1}-2T^n_i+T^n_{i-1})\\&\approx T^{n-1}_i\end{aligned}`, plain: R`The implicit scheme $T^n_i+\dots\approx T^{n-1}_i$ (10.13): the space differences taken at the new level.` },
    plan: ['The error obeys the same rule (as D04).', 'Insert one wave.', 'Divide instead of multiply.', 'Bound the denominator.'],
    uses: ['D04 steps 1–9', 'Euler\'s formula (P45)', 'half-angle identity (P225)', 'modulus of a quotient (P153)'],
    steps: [
      { did: 'Error equation for BTCS', tex: R`\begin{aligned}\xi^n_j&+\alpha(\xi^n_{j+1}-\xi^n_{j-1})\\&-\beta(\xi^n_{j+1}-2\xi^n_j+\xi^n_{j-1})\\&=\xi^{n-1}_j\end{aligned}`,
        why: 'The implicit scheme is linear, so the difference of two solutions obeys it (D04 step 3); index renamed $j$.', plain: 'The error follows the implicit rule.' },
      { did: 'Insert one wave', tex: R`\begin{aligned}\hat\xi^n\big[1&+\alpha(e^{\mathrm i\theta}-e^{-\mathrm i\theta})\\&-\beta(e^{\mathrm i\theta}-2+e^{-\mathrm i\theta})\big]\\&=\hat\xi^{n-1}\end{aligned}`,
        why: R`Put $\xi^n_j=\hat\xi^ne^{\mathrm i\pi kx_j}$, shift the neighbours by $e^{\pm\mathrm i\theta}$ and divide by $e^{\mathrm i\pi kx_j}$ (D04 steps 5–9).`, plain: 'The new amplitude times a bracket equals the old amplitude.' },
      { did: 'Simplify the convective bracket', tex: R`e^{\mathrm i\theta}-e^{-\mathrm i\theta}=2\mathrm i\sin\theta`,
        why: "Euler's formula: the cosines cancel, the sines add.", plain: 'Convection contributes an imaginary part.' },
      { did: 'Simplify the diffusive bracket', tex: R`e^{\mathrm i\theta}-2+e^{-\mathrm i\theta}=2\cos\theta-2=-4\sin^2\tfrac\theta2`,
        why: "Euler's formula, then 1 − cos θ = 2 sin²(θ/2) (P225).", plain: 'Diffusion contributes a real, positive part (after the minus sign).' },
      { did: 'Divide to get G', tex: R`G=\frac{\hat\xi^n}{\hat\xi^{n-1}}=\frac1{1+4\beta\sin^2\frac\theta2+2\mathrm i\alpha\sin\theta}`,
        why: 'Steps 3–4 in step 2; the unknowns sit at the new level, so the bracket multiplies $\\hat\\xi^n$ and we divide by it.', plain: 'The implicit scheme divides instead of multiplying.',
        live: s => { const n = N(s), d = [1 + 4 * n.b * n.sh2, 2 * n.a * Math.sin(n.th)]; return R`G=1/(${ctex(d)})=${ctex(G(n.th, n.a, n.b, 'btcs'))}`; } },
      { did: 'Bound the denominator', tex: R`\begin{aligned}\big\lvert1+4\beta s+2\mathrm i\alpha\sin\theta\big\rvert&\ge1+4\beta s\ge1,\\ s&=\sin^2\tfrac\theta2\end{aligned}`,
        why: 'The modulus of a complex number is at least its real part; with β ≥ 0 and s ≥ 0 the real part is at least 1.', plain: 'The denominator is never smaller than 1.' },
      { did: 'Conclude', tex: R`\begin{aligned}\lvert G\rvert&=1/\lvert d\rvert\le1,\\ d&=1+4\beta s+2\mathrm i\alpha\sin\theta\end{aligned}`,
        why: 'The modulus of a quotient is the quotient of moduli; a number ≥ 1 in the denominator gives ≤ 1. No condition on α or β remains.', plain: 'No wave can grow, for every Δt — unconditional stability.',
        set: { scheme: 'btcs', huge: true, alpha: 0.1, theta: PI }, watch: 'β = 100: the curve shrinks to a small loop near 0 and every wave dies.',
        live: s => { const n = N(s); return R`\beta=${t3(n.b)},\ \theta=${piTex(n.th)}:\ \lvert G\rvert=${t4(n.gm)}`; } }
    ],

    alpha: { label: R`Convection $\alpha=u\Delta t/(2\Delta x)$`, min: 0, max: 0.6, step: 0.005, value: 0.1, help: 'α = uΔt/(2Δx): how far the current moves in one step' },
    beta: { label: R`Diffusion $\beta=D\Delta t/\Delta x^2$`, min: 0, max: 0.8, step: 0.005, value: 0.2, help: 'β = DΔt/Δx²: how far diffusion reaches in one step' },
    theta: { label: R`Probe wave $\theta=k\pi\Delta x$`, min: 0, max: PI, step: PI / 180, value: PI / 2, unit: 'rad', optional: true, help: 'θ = π is the 2Δx zigzag, small θ a long wave' },
    huge: { type: 'toggle', label: 'Huge time step: β = 100', value: false, optional: true, help: 'overrides the β slider (try it with BTCS)' },
    n: { label: 'Step $n$', min: 0, max: NMAX, step: 1, value: 0, optional: true }
  },
  modes: { param: 'scheme', label: 'Scheme', options: [['ftcs', 'FTCS'], ['btcs', 'BTCS'], ['upwind', 'upwind'], ['cn', 'CN']], value: 'ftcs' },
  transport: { param: 'n', min: 0, max: NMAX, rate: 60, end: 'hold', hold: 2, unit: 'steps' },
  presets: [
    { label: 'β = 0.50', set: { alpha: 0, beta: 0.5, scheme: 'ftcs', huge: false, theta: PI, n: 0 }, title: 'pure diffusion on the edge: stable' },
    { label: 'β = 0.51', set: { alpha: 0, beta: 0.51, scheme: 'ftcs', huge: false, theta: PI, n: 0 }, title: 'just past the edge: the zigzag grows' },
    { label: 'pure convection', set: { alpha: 0.2, beta: 0, scheme: 'ftcs', huge: false, theta: PI / 2, n: 0 }, title: 'D = 0: every wave grows' },
    { label: 'Noye edge', set: { alpha: 0.3, beta: 0.18, scheme: 'ftcs', huge: false, theta: PI / 3, n: 0 }, title: '4α² = 2β: the long-wave edge' },
    { label: 'α 0.1, β 0.2', set: Object.assign({}, C02, { n: 0 }), title: 'the C02 worked example' },
    { label: 'BTCS β = 100', set: { scheme: 'btcs', huge: true, alpha: 0.1, theta: PI, n: 0 }, title: 'implicit: stable for any Δt' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'G', label: '|G(θ)| at the probe', value: s => N(s).gm, fmt: v => fG(v) },
    { id: 'gmax', label: 'max |G| over θ', value: s => N(s).v.Gmax, fmt: v => fG(v) },
    { id: 'worst', label: 'worst θ / π', value: s => N(s).v.theta_worst / PI, fmt: v => v.toFixed(3) },
    { id: 'noye', label: '4α² vs 2β', value: s => 4 * N(s).a * N(s).a - 2 * N(s).b, fmt: (v, s) => { const n = N(s); return `${f3(4 * n.a * n.a)} ${v <= 1e-12 ? '≤' : '>'} ${f3(2 * n.b)}`; } },
    { id: 'grow', label: 'steps to grow ×10⁶', value: s => N(s).grow, fmt: v => (isFinite(v) ? f3(v) : 'never') }
  ],
  terms: {
    title: '|G|² at the probe = (Re G)² + (Im G)²', unit: '–',
    items: [
      { id: 're', label: 'diffusion part (Re G)²', color: '#0fa39c', value: s => Math.pow(N(s).g[0], 2) },
      { id: 'im', label: 'convection part (Im G)²', color: '#f97316', value: s => Math.pow(N(s).g[1], 2) }
    ],
    total: { label: '|G|² (stable if ≤ 1)' }
  },
  stage: {
    rows: [1.25, 1],
    views: [
      { id: 'plane', row: 0, flex: 1, title: s => planeTitle(s) },
      { id: 'region', row: 0, flex: 1, title: s => regionTitle(s) },
      { id: 'march', row: 1, flex: 1, title: s => marchTitle(s) }
    ],
    draw(g, s) { drawPlane(g, s); drawRegion(g, s); drawMarch(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const Xp = v.pointer.x, Yp = v.pointer.y;
      if (ev.viewId === 'region' && PRG && (ev.type === 'pointerdown' || (ev.type === 'pointermove' && v.pointer.down)) && PRG.P.inside(Xp, Yp)) {
        const a = Viz.clamp(Math.round(PRG.P.ix(Xp) / 0.005) * 0.005, 0, 0.6), b = Viz.clamp(Math.round(PRG.P.iy(Yp) / 0.005) * 0.005, 0, 0.8);
        g.app.set({ alpha: Number(a.toFixed(3)), beta: Number(b.toFixed(3)), huge: false }); return true;
      }
      if (ev.viewId === 'plane' && PPL && ev.type === 'pointerdown') {
        const n = N(s); let best = null, bd = 30;
        TH.forEach((t, i) => { if (i % 4) return; const z = G(t, n.a, n.b, n.sc), d = Math.hypot(PPL.P.X(z[0]) - Xp, PPL.P.Y(z[1]) - Yp); if (d < bd) { bd = d; best = t; } });
        if (best !== null) { g.app.set({ theta: Math.round(best / (PI / 180)) * (PI / 180) }); return true; }
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click the G curve to pick a wave θ and see the arithmetic of G; drag the dot in the (α, β) plane.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Drag the dot in the (α, β) plane or the sliders, switch the scheme, then press ▶ to march a 10⁻¹⁰ kick.',
    controls: ['alpha', 'beta', 'theta', 'huge'],
    readouts: ['G', 'gmax', 'worst', 'noye', 'grow'],
    callouts: [{ kind: 'try', html: 'Press <b>β = 0.50</b> then ▶: the kick never grows. Press <b>β = 0.51</b> and ▶: the zigzag hits the cap after about 350 steps.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
</script>
