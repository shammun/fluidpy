    { name: 'live next eigenvalue P1P1 n4 = table', js: i14.beta_nonspurious, expect: INFSUP.P1P1[4][1], rtol: 2e-6 },
    { name: 'shapes sum to 1 at xi = 0.27, eta = 0.41', js: sum6, expect: 1, rtol: 1e-14 },
    { name: 'centroid: corner shape = -1/9', js: phi2(1 / 3, 1 / 3)[0], expect: -1 / 9, rtol: 1e-14 },
    { name: 'centroid: mid-edge shape = 4/9', js: phi2(1 / 3, 1 / 3)[4], expect: 4 / 9, rtol: 1e-14 },
    { name: 'rule: integral of a corner shape = 0', js: I1, expect: 0, atol: 1e-15 },
    { name: 'rule: integral of a mid-edge shape = 1/6', js: I4, expect: 1 / 6, rtol: 1e-13 },
    { name: 'invisible P1P1 pattern: max|Bq| = 0 (n4)', js: i14.patBq, expect: 0, atol: 1e-10 },
    { name: 'counting bound P1P1 n2 = spurious found', js: cnt(2, 'P1P1').bound, expect: i12.n_spurious, rtol: 0 },
    { name: 'closed-form counts = mesh (P2 n6 nodes)', js: cnt(6, 'P2P1').nodes, expect: m6.N, rtol: 0 }
  ];
}

/* =====================================================================================================================
   APP
   ===================================================================================================================== */
let lastN = null, lastPair = null;
const app = Viz.app({
  title: 'Why can’t velocity and pressure use the same elements?',
  subtitle: 'A slow lid-driven box solved with finite elements: P1–P1 (the same triangles for both) against Taylor–Hood P2–P1 — the unknowns counted, the computed pressure, and the inf–sup constant as the mesh is refined',
  autoplay: false,
  params: {
    k: { label: 'Mesh $n\\times n$', min: 0, max: NLIST.length - 1, step: 1, value: K(4), fmt: v => { const n = NLIST[Math.max(0, Math.min(7, Math.round(v)))]; return n + ' × ' + n; }, help: 'squares per side; the pressure is solved live up to 6 × 6' },
    count: { type: 'toggle', label: 'show counting', value: false },
    spur: { type: 'toggle', label: 'show an invisible pressure pattern', value: false },
    elem: { type: 'toggle', label: 'one element', value: false },
    phi: { label: 'Shape function $\\phi_a$, $a$', min: 1, max: 6, step: 1, value: 4, optional: true, help: 'or click a node of the parent triangle' },
    pick: { label: 'Clicked triangle', min: -1, max: 600, step: 1, value: -1, optional: true }
  },
  modes: { param: 'pair', label: 'Element pair', options: [['P1P1', 'P1–P1'], ['P2P1', 'P2–P1']], value: 'P1P1' },
  transport: { param: 'k', min: 0, max: NLIST.length - 1, rate: 1, end: 'hold', hold: 2, step: 1, unit: '' },
  presets: [
    { label: 'P1–P1, 2 × 2 (count)', set: { pair: 'P1P1', k: K(2), count: true, elem: false, spur: false, pick: -1 }, title: 'more pressure constraints than velocity unknowns' },
    { label: 'P1–P1, 4 × 4', set: { pair: 'P1P1', k: K(4), count: false, elem: false, spur: false, pick: -1 }, title: 'the speckled pressure' },
    { label: 'invisible pattern', set: { pair: 'P1P1', k: K(4), elem: false, spur: true, pick: -1 }, title: 'a pressure no velocity feels' },
    { label: 'P2–P1, 4 × 4', set: { pair: 'P2P1', k: K(4), count: false, elem: false, spur: false, pick: -1 }, title: 'Taylor–Hood: smooth' },
    { label: 'P2–P1, 6 × 6', set: { pair: 'P2P1', k: K(6), count: false, elem: false, spur: false, pick: -1 }, title: 'the finest live mesh' },
    { label: 'refinement sweep', set: { k: 0, elem: false, spur: false, pick: -1 }, action: a => a.play(true), title: 'n = 2 → 16' },
    { label: 'one element', set: { elem: true }, title: 'the six quadratic shapes' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'nu', label: 'Velocity unknowns $n_u$', value: s => cnt(nOf(s), s.pair).nu, fmt: v => String(v) },
    { id: 'np', label: 'Pressure unknowns $n_p$', value: s => cnt(nOf(s), s.pair).V, fmt: v => String(v) },
    { id: 'nsp', label: 'Spurious modes', value: s => betaOf(nOf(s), s.pair).n_spurious, fmt: v => String(v), tone: v => (v > 0 ? 'neg' : 'pos') },
    { id: 'beta', label: 'Inf–sup $\\beta_h$', value: s => betaOf(nOf(s), s.pair).beta, fmt: v => (v ? pn(v, 3) : '0'), tone: v => (v > 0 ? 'pos' : 'neg') },
    { id: 'prange', label: 'Pressure range', value: s => (nOf(s) <= NLIVE ? stokes(nOf(s), s.pair).p_range : NaN), fmt: v => (isNaN(v) ? 'not solved' : pn(v, 3)) }
  ],
  stage: {
    rows: [1.25, 1],
    views: [
      { id: 'mesh', row: 0, flex: 1, title: s => meshTitle(s) },
      { id: 'press', row: 0, flex: 1, title: s => pressTitle(s) },
      { id: 'beta', row: 1, flex: 1, hidePortrait: true, title: () => '<b>Inf–sup constant β_h</b> · <span class="c-blue">P2–P1</span> · <span class="c-rose">P1–P1</span> (× = 0, ○ next eigenvalue) · <span style="color:var(--viz-amber)">your n</span>' }
    ],
    draw(g, s) { drawMesh(g, s); drawPress(g, s); drawBeta(g, s); },
    onPointer(g, ev, s) {
      if (ev.type !== 'pointerdown') return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.viewId === 'beta' && PBETA) {
        if (!PBETA.P.inside(X, Y)) return false;
        const x = PBETA.P.ix(X); let best = 0; NLIST.forEach((k, i) => { if (Math.abs(Math.log10(k) - x) < Math.abs(Math.log10(NLIST[best]) - x)) best = i; });
        g.app.play(false); g.app.set({ k: best }); return true;
      }
      const T = ev.viewId === 'mesh' ? PMESH : ev.viewId === 'press' ? PPRESS : null;
      if (!T) return false;
      if (T.elem) {
        if (T.thumbs) for (const b of T.thumbs) if (X >= b.x && X <= b.x + b.w && Y >= b.y && Y <= b.y + b.h) { g.app.set({ phi: b.k + 1 }); return true; }
        let best = -1, bd = 22; PNODE.forEach(([x, e], k) => { const d = Math.hypot(T.P.X(x) - X, T.P.Y(e) - Y); if (d < bd) { bd = d; best = k; } });
        if (best >= 0) { g.app.set({ phi: best + 1 }); return true; }
        return false;
      }
      if (!T.P.inside(X, Y)) return false;
      const n = nOf(s), x = T.P.ix(X), y = T.P.iy(Y);
      const i = Math.min(n - 1, Math.max(0, Math.floor(x * n))), j = Math.min(n - 1, Math.max(0, Math.floor(y * n)));
      const fx = x * n - i, fy = y * n - j;
      g.app.play(false); g.app.set({ pick: 2 * (j * n + i) + (fy <= fx ? 0 : 1) }); return true;
    }
  },
  onChange(s, key) {
    if (key === 'k' || key === 'pair') { const n = nOf(s); if ((lastN !== null && n !== lastN) || (lastPair !== null && s.pair !== lastPair)) s.pick = -1; lastN = n; lastPair = s.pair; }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a triangle (mesh or pressure view): its nodes, J, the shape values at its centroid and its pressures. In “one element”, click a node.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Switch the pair (top), step the mesh with ▶ or the slider, and click a triangle to trace its numbers.',
    controls: ['k', 'count', 'spur', 'elem', 'phi'],
    readouts: ['nu', 'np', 'nsp', 'beta', 'prange'],
    callouts: [{ kind: 'try', html: 'Choose <b>P1–P1</b> and switch on the invisible pattern, then switch to <b>P2–P1</b>: the pattern the velocity now feels least is smooth, and β_h tells how weakly.' }]
  },
  explain: { html: s => explainHtml(s), live: s => ({ now: `${PN[s.pair]}, n = ${nOf(s)}${nOf(s) <= NLIVE ? ' (solved live)' : ' (from our table)'}` }) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
</script>
