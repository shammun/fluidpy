/* ---- view 1 (FTCS mode): the travelling, spreading pulse with the FTCS stencil at the probe ---------------------------- */

    const T1 = xs.map(x => gaussD(x, TF, n.u, DD, 0));

/* ---- view 2: |error| against h on log-log axes (stencil) or E(x) along the pulse (FTCS) --------------------------------- */
function drawErrorView(g, s) {

  const n = ST(s), ctx = v.ctx, C = col(n.kind), MU = Viz.color('muted'), RO = Viz.color('rose'), TX = Viz.color('text');
  const yr = [-17, 0.6], P = logAxes(v, [LHMIN, LHMAX], yr, { xlabel: 'step h (log scale)', ylabel: '|error| (log scale)' });
  PERR = { P };
  const L = Viz.num.linspace(LHMIN, LHMAX, 241), lg = e => Math.log10(Math.max(Math.abs(e), 1e-17));
  const curve = kind => L.map(lh => lg(stencilErr(n.name, n.x0, Math.pow(10, lh), kind)));
  const lhNow = -s.sh;
  P.clip(() => {
    // round-off band (rose): the estimate eps * sum|w||f| / h^m and everything below it

    P.fillBetween(L, ro, yr[0], { color: RO, alpha: 0.12 });

    const cy = curve(n.kind);

    GUIDE.forEach(p => { const gd = guide(n, p); lab(ctx, `slope ${p}`, P.X(gd.x1) - 4, P.Y(gd.y1), { color: TX, align: 'right' }); });

    lab(ctx, `◆ best h ≈ ${f3(n.best.h)}`, P.X(n.best.lh), P.Y(Math.log10(n.best.err)) + 18, { color: TX, align: 'center' });

    Viz.card(ctx, P.px.x + P.px.w * 0.5, P.px.y + P.px.h * 0.22, [`best h ≈ ${f3(n.best.h)} for ${KINDS[n.kind].name}: error ≈ ${f3(n.best.err)}`, 'below this, round-off wins'], { color: C, maxWidth: P.px.w - 8 });

}
function errorTitle(s) {

function termsTitle(s) {

/* ---- status, inspector, notes ------------------------------------------------------------------------------------------ */
function statusOf(s) {
  const sm = phone();

    if (nearSixth(s)) return { text: sm ? 'β = 1/6, but u ≠ 0' : 'β = 1/6, but u = 0.5 m/s keeps the u² part of the time term: no cancellation', tone: 'warn' };
    return { text: sm ? 'E ≈ 3 terms: O(Δt) + O(Δx²)' : 'E ≈ 3 terms: first order in Δt, second order in Δx', tone: 'info' };
  }
  const n = ST(s);
  if (n.regime === 'trunc') return { text: sm ? `📉 truncation · slope ${n.p} · ÷${f3(n.ratio)}` : `📉 truncation-dominated: slope ${n.p} — halving h divides the error by ${f3(n.ratio)}`, tone: 'good' };
  if (n.regime === 'round') return { text: sm ? `🎲 round-off ≈ ${f3(n.ro)}` : `🎲 round-off dominated: error ≈ ε/h scale = ${f3(n.ro)} — a smaller h makes it worse`, tone: 'bad' };
  return { text: sm ? '⚖️ near the best h' : '⚖️ near the best h: truncation ≈ round-off', tone: 'warn' };
}
function inspectHtml(s) {

      `dispersive $u\\tfrac{\\Delta x^2}{6}T_{xxx} = ${t3(n.u)}\\cdot\\tfrac{${t3(n.dx * n.dx)}}{6}(${t4(n.Txxx)}) = ${t4(n.conv)}$ 1/s<br>` +
      `diffusive $-D\\tfrac{\\Delta x^2}{12}T_{xxxx} = -0.01\\cdot\\tfrac{${t3(n.dx * n.dx)}}{12}(${t4(n.Txxxx)}) = ${t4(n.diff)}$ 1/s<br>` +
      `$E = \\mathbf{${t4(n.total)}}$ 1/s, measured $${t4(n.measured)}$ 1/s`;
  }
  if (s.probe === null || s.probe === undefined) return null;
  const q = Object.assign({}, s, { sh: s.probe }), n = ST(q), K = n.K;
  const fl = K.offs.map(o => `$f(${p12(n.x0 + o * n.h)}) = ${p12(fk(n.name, n.x0 + o * n.h, 0))}$`).join('<br>');
  return `At $h = ${t3(n.h)}$:<br>${fl}<br>stencil $= \\tfrac{1}{h^{${K.m}}}\\sum_j w_jf_j = ${p12(n.D)}$<br>exact $${DTEX[K.m]}(x_0) = ${p12(n.exact)}$<br>` +
    `error $= \\mathbf{${t4(n.err)}}$<br>leading term $${n.T.lead.tex()}\\,h^{${n.p}}${DTEX[K.m + n.p]}(x_0) = ${t4(n.lead)}$`;
}
function notesHtml(s) {
  if (s.mode === 'ftcs') {
    const n = FT(s);
    if (Number(s.u) === 0 && nearSixth(s)) return `<p><b>Right now</b>: pure diffusion at $\\beta = 1/6$. The time term $\\tfrac{\\Delta t}{2}T_{tt} = \\tfrac{\\beta}{2}D\\Delta x^2T_{xxxx}$ and the diffusive term $-\\tfrac{D\\Delta x^2}{12}T_{xxxx}$ cancel; what is left (measured ${f3(n.measured)} 1/s) is fourth order.</p>`;
    return `<p><b>Right now</b>: $E = ${t3(n.total)}$ 1/s at $x = ${t3(s.xp)}$ m. Halving $\\Delta x$ at fixed $\\beta$ (so $\\Delta t$ falls by 4) divides the measured residual by ${f3(n.ratio)}: every term is $\\propto \\Delta x^2$ here.</p>`;
  }
  const n = ST(s);
  if (n.regime === 'trunc') return `<p><b>Right now</b>: truncation rules. The error ${f3(n.err)} is almost exactly the leading Taylor term ${f3(n.lead)}; each halving of $h$ divides it by $2^p = ${Math.pow(2, n.p)}$ (measured ${f3(n.ratio)}).</p>`;
  if (n.regime === 'round') return `<p><b>Right now</b>: round-off rules. The values $f(x_0 + s_jh)$ agree in their first ${Math.max(0, Math.round(-Math.log10(n.h * Math.abs(fk(n.name, n.x0, 1)) / Math.max(Math.abs(n.exact), 1e-300) + 1e-300)))} digits, so their difference keeps only the rest. A larger $h$ (or a higher-order stencil) is more accurate.</p>`;
  return `<p><b>Right now</b>: at the bottom of the V. Truncation (${f3(n.tr)}) and round-off (${f3(n.ro)}) are comparable; this is about the best this stencil can do in double precision.</p>`;
}

/* ---- Explain: "Explanation & interpretation" ----------------------------------------------------------------------------- */
function explainStencil(s) {
  const W = Viz.work, n = ST(s), K = n.K, T = n.T, c = KINDS[n.kind].col, m = n.m, p = n.p;
  const lineName = m === 1 ? (K.offs.length === 3 && !T.w[1].zero ? 'parabola through the three points (dashed: its tangent at x₀)' : 'straight line through the stencil\'s points') : 'parabola through the three points';
  let o = W.step(0, 'What you are looking at') +
    W.say(`<b>The stencil</b>: grey is $f(x) = ${FTEX[n.name]}$, dashed grey its exact ${m === 1 ? 'tangent' : 'parabola'} at $x_0 = ${t3(n.x0)}$, <span class="c-${c}">${KINDS[n.kind].col}</span> the ${lineName}; its ${m === 1 ? 'slope' : 'curvature'} is the stencil's answer. <b>|error| against h</b>: the bold curve is your stencil's error for every $h$ down to yours (the dot); faint grey curves are the other four stencils; the <span class="c-rose">rose band</span> is where round-off lives; ◆ marks the best $h$.`) +
    W.hint('On phones the Taylor-terms view is hidden; its key numbers (order $p$ and the leading term) are in the error view\'s title and in sections 2–3 below.');
  const wTex = T.w.map(f => f.tex()).join(',\\ ');
  o += W.step(1, 'The weights of your stencil') +
    W.say(`Offsets $s = (${K.offs.join(', ')})$, derivative $m = ${m}$. The stencil is $${DTEX[m]}(x_0) \\approx h^{-${m}}\\sum_j w_jf(x_0 + s_jh)$, and the weights solve the Taylor-matching conditions $\\sum_j w_js_j^k/k! = \\delta_{km}$ for $k = 0, \\dots, ${K.offs.length - 1}$.`) +
    W.box(`$w = (${wTex})$`) +
    W.say(`Why: then the stencil returns $${DTEX[m]}$ exactly for $1, x, \\dots, x^{${K.offs.length - 1}}$; it fails first at the next power.`);
  const rows = T.cs.map((cf, k) => [String(k), `$${cf.tex()}$`, cf.zero ? 'cancels' : k === m ? 'the derivative survives' : k === m + p ? '<b class="c-rose">first survivor → the error</b>' : k < m ? '—' : 'later, smaller'].concat([]));
  o += W.step(2, 'Which Taylor terms cancel') +
    W.say('Insert $f(x_0 + sh) = \\sum_k \\frac{(sh)^k}{k!}f^{(k)}(x_0)$ into the stencil: the coefficient of $h^{k-m}f^{(k)}(x_0)$ is $c_k = \\sum_j w_js_j^k/k!$.') +
    W.table(['$k$', '$c_k$', 'what happens'], rows, m + p) +
    W.box(`first survivor $c_{${m + p}} = ${T.lead.tex()}$ ⇒ error $\\approx ${T.lead.tex()}\\,h^{${p}}${DTEX[m + p]}(x_0)$: order $p = \\mathbf{${p}}$`) +
    W.table(['stencil', 'weights', '$p$', 'leading $c$'], KIND_LIST.map(k => { const Q = taylorFr(k); return [KINDS[k].name, Q.w.map(f => f.txt()).join(', '), String(Q.order), `$${Q.lead.tex()}$`]; }), KIND_LIST.indexOf(n.kind)) +
    W.say('With $h = \\Delta x$ and $f = T$ this is where the orders of $\\frac{T_{i+1}-T_{i-1}}{2\\Delta x}+O(\\Delta x^2)$ (10.6) and $\\frac{T_{i+1}-2T_i+T_{i-1}}{\\Delta x^2}+O(\\Delta x^2)$ (10.7) come from.');
  o += W.step(3, 'The error with your h') +
    K.offs.map(off => W.line(`$f(${p12(n.x0 + off * n.h)})$`, p12(fk(n.name, n.x0 + off * n.h, 0)))).join('') +
    W.line(`stencil $= \\tfrac{1}{h^{${m}}}\\sum_j w_jf_j$`, p12(n.D), `with $h = ${t3(n.h)}$`) +
    W.line(`exact $${DTEX[m]}(x_0)$`, p12(n.exact), `the ${m === 1 ? 'slope of the dashed tangent' : 'curvature of the dashed parabola'}`) +
    W.box(`error $= ${t4(n.err)}$; leading term $${T.lead.tex()}(${t3(n.h)})^{${p}}(${t4(fk(n.name, n.x0, m + p))}) = \\mathbf{${t4(n.lead)}}$`) +
    W.line('halve $h$: ratio $e(h)/e(h/2)$', f3(n.ratio), `$2^p = ${Math.pow(2, p)}$ while truncation rules`);
  const sw = T.w.reduce((a, f) => a + Math.abs(f.val()), 0);
  o += W.step(4, 'Round-off') +
    W.line('machine $\\varepsilon$', '2.22×10⁻¹⁶', 'relative error of every stored $f$ value') +
    W.line(`$\\sum_j|w_j|/h^{${m}}$`, f3(sw / Math.pow(n.h, m)), 'how much the stencil amplifies it') +
    W.line('round-off estimate $\\varepsilon\\sum_j|w_j||f_j|/h^m$', f3(n.ro)) +
    W.line('truncation estimate $|\\sum_k c_kh^{k-m}f^{(k)}|$', f3(n.tr)) +
    W.box(`${n.regime === 'round' ? 'round-off' : 'truncation'} wins by a factor ${f3(n.regime === 'round' ? n.ro / Math.max(n.tr, 1e-300) : n.tr / Math.max(n.ro, 1e-300))}; model best $h^* \\approx \\mathbf{${t3(n.best.h)}}$ with error $\\approx ${t3(n.best.err)}$`) +
    W.say(`Why a best $h$: truncation falls like $h^{${p}}$, round-off grows like $h^{-${m}}$; their sum is smallest where they are comparable, $h^* \\sim \\varepsilon^{1/(p+m)} = \\varepsilon^{1/${p + m}}$.`);
  o += W.step(5, 'The scheme\'s leftover (FTCS mode)') +
    W.hint('Switch the mode chip to <b>FTCS truncation</b>: the same Taylor bookkeeping applied to the whole scheme leaves $E^n_i=\\frac{\\Delta t}{2}T_{tt}+u\\frac{\\Delta x^2}{6}T_{xxx}-D\\frac{\\Delta x^2}{12}T_{xxxx}+O(\\Delta t^2,\\Delta x^4)$ (10.17).');
  o += W.step(6, 'At the current h (moves with ▶)') +
    W.line('$h$', Viz.live('h')) + W.line('error', Viz.live('err'), 'the dot on the error view') + W.line('leading term', Viz.live('lead'));
  const one = n.kind === 'onesided2' ? ' One-sided second order costs three points instead of two but keeps $p = 2$ at a wall, where no left neighbour exists; the cavity\'s wall densities use the same idea.' : '';
  o += W.interpret(n.regime === 'trunc' ? `You are on the straight part of the curve: every halving of $h$ cuts the error by $2^p = ${Math.pow(2, p)}$ (measured ${f3(n.ratio)}). This is what "order ${p}" means.${one}`
    : n.regime === 'best' ? `You are at the bottom of the V (best $h \\approx ${t3(n.best.h)}$): the best this stencil can do in double precision.${one}`
      : `Round-off rules: the difference of nearly equal numbers keeps only ~16 digits and is then divided by a tiny $h^{${m}}$. Use a larger $h$, or a higher-order stencil.${one}`, 'Reading the current setting');
  return o;
}
function explainFtcs(s) {
  const W = Viz.work, n = FT(s), xi = (s.xp - n.xc) / n.sT;
  let o = W.step(0, 'What you are looking at') +
    W.say('<b>The pulse</b>: the exact solution of $T_t + uT_x = DT_{xx}$ (10.1), a Gaussian that moves with $u$ and spreads (dashed: $t = 0$; solid: $t = 0.1$ s), with the three old values of the FTCS stencil in <span class="c-orange">orange</span>. <b>E(x)</b>: the truncation error along the pulse, split into <span class="c-amber">time</span>, <span class="c-accent">dispersive</span> and <span class="c-teal">diffusive</span> terms; the black curve is their sum, grey dots the measured one-step residual.') +
    W.hint('On phones the bar view is hidden; the probe\'s numbers are in section 3 below.');
  o += W.step(1, 'The grid numbers') +
    W.line('$u,\\ D$', `${f3(n.u)} m/s, 0.01 m²/s`, 'fixed') +
    W.line(`$\\Delta t = \\beta\\Delta x^2/D = ${t3(n.beta)}\\times${t3(n.dx)}^2/0.01$`, Viz.fmtTime(n.dt), 'the diffusive time-step rule') +
    W.box(`$\\alpha = u\\frac{\\Delta t}{2\\Delta x} = \\mathbf{${t3(n.alpha)}}$, $\\beta = D\\frac{\\Delta t}{\\Delta x^2} = \\mathbf{${t3(n.beta)}}$ (10.11); Courant $C = 2\\alpha = ${t3(n.C)}$`);
  o += W.step(2, 'The exact solution at the probe') +
    W.line(`width $s = \\sqrt{s_0^2 + 2Dt} = \\sqrt{0.05^2 + 2(0.01)(0.1)}$`, f4(n.sT) + ' m') +
    W.line(`centre $x_c = x_0 + ut = 0.3 + ${t3(n.u)}(0.1)$`, f3(n.xc) + ' m') +
    W.line(`$\\xi = (x - x_c)/s$ at $x = ${t3(s.xp)}$ m`, f3(xi)) +
    W.line('$T_{xxx}$, $T_{xxxx}$', `${f4(n.Txxx)} 1/m³, ${f4(n.Txxxx)} 1/m⁴`, 'Hermite polynomials times the Gaussian') +
    W.line('$T_{tt} = u^2T_{xx} - 2uDT_{xxx} + D^2T_{xxxx}$', f4(n.Ttt) + ' 1/s²', 'the exact T obeys the PDE, so each $\\partial_t$ is $-u\\partial_x + D\\partial_{xx}$');
  o += W.step(3, 'The three terms of E') +
    W.line(`<span class="c-amber">time</span> $\\tfrac{\\Delta t}{2}T_{tt}$`, f4(n.time) + ' 1/s') +
    W.line(`<span class="c-accent">dispersive</span> $u\\tfrac{\\Delta x^2}{6}T_{xxx}$`, f4(n.conv) + ' 1/s', 'odd derivative: shifts the phase') +
    W.line(`<span class="c-teal">diffusive</span> $-D\\tfrac{\\Delta x^2}{12}T_{xxxx}$`, f4(n.diff) + ' 1/s', 'even derivative: acts like extra diffusion') +
    W.box(`$E^n_i = \\mathbf{${t4(n.total)}}$ 1/s; measured one-step residual $${t4(n.measured)}$ 1/s`) +
    W.say(`They differ by ${f3(Math.abs(n.total - n.measured))} 1/s (${f3(100 * Math.abs(n.total - n.measured) / Math.max(Math.abs(n.measured), 1e-300))} %), the $O(\\Delta t^2, \\Delta x^4)$ remainder of $E^n_i=\\frac{\\Delta t}{2}T_{tt}+u\\frac{\\Delta x^2}{6}T_{xxx}-D\\frac{\\Delta x^2}{12}T_{xxxx}+O(\\Delta t^2,\\Delta x^4)$ (10.17).`);
  o += W.step(4, 'The order, measured') +
    W.line(`residual at $\\Delta x/2 = ${t3(n.dx / 2)}$ m, same $\\beta$`, f4(n.half.measured) + ' 1/s', '$\\Delta t$ falls by 4') +
    W.box(`ratio $= ${t3(n.ratio)} \\approx 4$: with $\\Delta t \\propto \\Delta x^2$ every term of E scales like $\\Delta x^2$`);
  const pd = DD * n.dx * n.dx * (n.beta / 2 - 1 / 12) * n.Txxxx;
  o += W.step(5, 'Pure diffusion: the special β') +
    W.say('With $u = 0$, $T_{tt} = D^2T_{xxxx}$ and $\\Delta t = \\beta\\Delta x^2/D$, so the time and diffusive terms combine:') +
    W.line(`$E = D\\Delta x^2(\\tfrac{\\beta}{2} - \\tfrac{1}{12})T_{xxxx}$ with your $\\beta$`, f4(pd) + ' 1/s', Number(s.u) === 0 ? 'your setting' : 'what it would be with u = 0 at this probe') +
    W.box('zero at $\\beta = 1/6$: the two leading errors cancel');
  o += W.interpret(Number(s.u) === 0 && nearSixth(s) ? 'Pure diffusion at β = 1/6: the amber and teal terms are equal and opposite, so the second-order error vanishes and the residual left over is fourth order — a free accuracy upgrade from choosing Δt well.'
    : Number(s.u) === 0 ? `Pure diffusion: E is set by $\\beta/2 - 1/12 = ${t3(n.beta / 2 - 1 / 12)}$. Move $\\beta$ to 1/6 to cancel it.`
      : `With the current flowing, the dispersive term (odd, antisymmetric about the pulse centre) shifts the pulse, while the time and diffusive terms change its height. E is first order in Δt and second in Δx: the scheme is consistent.`, 'Reading the current setting');
  return o;
}
