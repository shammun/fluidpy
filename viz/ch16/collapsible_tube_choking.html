  { q: 'Is P positive or negative in a collapsed tube? And its slope?', a: 'Negative: from $' + LAW + '$ (16.188), −P = α⁻ⁿ − 1 > 0 for α < 1. Its slope dP/dα = nα⁻ⁿ⁻¹ is positive (trap T9) — check the inspector at the cursor.' }
];

/* ---- selftest: parity with fluidpy (py) and invariants (expect) ------------------------------------------------------------- */
function selftestRows() {
  const vein = { L: 0.1, A0: PI * 16e-6, rho: 1060, Kp: 200, n: 1.5, mu: 3.5e-3, friction: true };
  const PRM = "{'L': 0.1, 'A0': np.pi*0.004**2, 'Kp': 200.0, 'n': 1.5, 'rho': 1060.0, 'mu': 3.5e-3}";
  const lim = flowLimit(vein), st3 = starling(-3 * MMHG, vein, lim), st5 = starling(-5 * MMHG, vein, lim);
  const vein8 = Object.assign({}, vein, { mu: 8e-3 }), lim8 = flowLimit(vein8);
  const A0t = PI * 36e-6, Qs = chokingFlux(0.35, A0t, 200, 1000, 1.5), H = 200 * tubeLaw(0.35, 1.5) + 0.5 * 1000 * Math.pow(Qs / (0.35 * A0t), 2);
  const A0f = x => A0t * (1 + (x / 0.05) * (x / 0.05));
  const QS = 'ch16.choking_flux(0.35, np.pi*0.006**2, 200.0, 1000.0, 1.5)', HP = `(200.0*ch16.collapsible_tube_law(0.35) + 0.5*1000.0*(${QS}/(0.35*np.pi*0.006**2))**2)`;
  const tr = terms(0.6, 1.2e-5, vein), trJ = terms(0.3, 1e-5, Object.assign({}, vein, { dzdx: -1 }));
  const trT = terms(0.5, 3e-5, { A0: A0f(0.03), dA0dx: A0t * 2 * 0.03 / 0.0025, Kp: 200, n: 1.5, rho: 1000, friction: false });
  const qj = 1e-5, aeq = Math.sqrt(8 * PI * 3.5e-3 * qj / (1060 * G0 * vein.A0 * vein.A0));
  const nT = N(S(THROAT));
  return [
    { name: 'tube law P(0.5), n = 1.5', js: tubeLaw(0.5, 1.5), py: 'ch16.collapsible_tube_law(0.5, n=1.5)', rtol: 1e-14 },
    { name: 'wave speed c(0.5), Kp 200 Pa, rho 1060', js: waveSpeed(0.5, 200, 1060, 1.5), py: 'ch16.collapsible_wave_speed(0.5, 200.0, 1060.0, 1.5)', rtol: 1e-12 },
    { name: 'wave speed c(0.25), Kp 250 Pa, rho 1000 (quiz)', js: waveSpeed(0.25, 250, 1000, 1.5), py: 'ch16.collapsible_wave_speed(0.25, 250.0, 1000.0, 1.5)', rtol: 1e-12 },
    { name: 'speed index S = u/c', js: speedIndex(0.4, 0.78), py: 'ch16.speed_index(0.4, 0.78)', rtol: 1e-15 },
    { name: 'Shapiro M, n = 1.5', js: shapiroM(1.5), py: 'ch16.shapiro_M(0.5, 1.5)', rtol: 1e-12 },
    { name: 'Shapiro M, n = 1.2', js: shapiroM(1.2), py: 'ch16.shapiro_M(0.7, 1.2)', rtol: 1e-12 },
    { name: 'choking flux Q* at alpha 0.5, vein', js: chokingFlux(0.5, PI * 16e-6, 200, 1060, 1.5), py: 'ch16.choking_flux(0.5, np.pi*0.004**2, 200.0, 1060.0, 1.5)', rtol: 1e-12 },
    { name: 'drivers: friction term, alpha 0.6, Q 12 mL/s', js: tr.friction, py: `ch16.collapsible_terms(0.6, 1.2e-5, ${PRM})["friction"]`, rtol: 1e-12 },
    { name: 'drivers: dalpha/dx, alpha 0.6, Q 12 mL/s', js: tr.dalpha_dx, py: `ch16.collapsible_terms(0.6, 1.2e-5, ${PRM})["dalpha_dx"]`, rtol: 1e-12 },
    { name: 'drivers: S^2, alpha 0.6, Q 12 mL/s', js: tr.S2, py: `ch16.collapsible_terms(0.6, 1.2e-5, ${PRM})["S2"]`, rtol: 1e-12 },
    { name: 'jugular: gravity term, alpha 0.3, dz/dx -1', js: trJ.gravity, py: `ch16.collapsible_terms(0.3, 1e-5, ${PRM}, dzdx=-1.0)["gravity"]`, rtol: 1e-12 },
    { name: 'jugular: driver, alpha 0.3, dz/dx -1', js: trJ.driver, py: `ch16.collapsible_terms(0.3, 1e-5, ${PRM}, dzdx=-1.0)["driver"]`, rtol: 1e-12 },
    { name: 'jugular: driver at alpha_eq is 0', js: terms(aeq, qj, Object.assign({}, vein, { dzdx: -1 })).driver, py: `ch16.collapsible_terms(${aeq.toPrecision(17)}, 1e-5, ${PRM}, dzdx=-1.0)["driver"]`, atol: 1e-9, rtol: 0 },
    { name: 'throat: area term at x = 3 cm (fluidpy differentiates A0(x))', js: trT.area, py: "ch16.collapsible_terms(0.5, 3e-5, {'A0': lambda x: " + A0t.toPrecision(17) + "*(1 + (x/0.05)**2), 'Kp': 200.0, 'n': 1.5, 'rho': 1000.0, 'friction': False}, x=0.03)['area']", rtol: 1e-7 },
    { name: 'Starling: Q_choke, default vein [m^3/s]', js: lim.Q_lim, py: `ch16.flow_limitation_curve([-15*133.322387415], p1=0.0, pe=0.0, prm=${PRM})["Q_choke"]`, rtol: 1e-9 },
    { name: 'Starling: p2 at the choke [Pa]', js: lim.p2_lim, py: `ch16.flow_limitation_curve([-15*133.322387415], p1=0.0, pe=0.0, prm=${PRM})["p2_choke"]`, rtol: 1e-8 },
    { name: 'Starling: Q_choke, mu = 8 mPa s', js: lim8.Q_lim, py: "ch16.flow_limitation_curve([-25*133.322387415], p1=0.0, pe=0.0, prm={'L': 0.1, 'A0': np.pi*0.004**2, 'Kp': 200.0, 'n': 1.5, 'rho': 1060.0, 'mu': 8e-3})['Q_choke']", rtol: 1e-9 },
    { name: 'Starling: Q at p2 = -3 mmHg', js: st3.Q, py: `ch16.starling_state(0.0, -3*133.322387415, 0.0, ${PRM})["Q"]`, rtol: 1e-8 },
    { name: 'Starling: alpha_out at p2 = -3 mmHg', js: st3.alpha_out, py: `ch16.starling_state(0.0, -3*133.322387415, 0.0, ${PRM})["alpha_out"]`, rtol: 1e-8 },
    { name: 'Starling: S_out at p2 = -5 mmHg', js: st5.S_out, py: `ch16.starling_state(0.0, -5*133.322387415, 0.0, ${PRM})["S_out"]`, rtol: 1e-8 },
    { name: 'Starling: limited alpha at p2 = -15 mmHg', js: lim.a_star, py: `ch16.starling_state(0.0, -15*133.322387415, 0.0, ${PRM})["alpha_out"]`, rtol: 1e-9 },
    { name: 'throat: critical flux Q*(alpha_t 0.35), a0 6 mm', js: Qs, py: QS, rtol: 1e-12 },
    { name: 'throat: alpha at x = -12 cm (sub branch)', js: frictionlessAlpha(Qs, H, A0f(-0.12), 200, 1000, 1.5, 'sub'), py: `ch16.collapsible_frictionless_alpha(${QS}, ${HP}, np.pi*0.006**2*(1 + (-0.12/0.05)**2), 200.0, 1000.0, 1.5, branch='sub')`, rtol: 1e-10 },
    { name: 'throat: alpha at x = +6 cm (super branch)', js: frictionlessAlpha(Qs, H, A0f(0.06), 200, 1000, 1.5, 'super'), py: `ch16.collapsible_frictionless_alpha(${QS}, ${HP}, np.pi*0.006**2*(1 + (0.06/0.05)**2), 200.0, 1000.0, 1.5, branch='super')`, rtol: 1e-9 },
    { name: 'throat: alpha at x = +6 cm, Q = 0.7 Q* (sub)', js: frictionlessAlpha(0.7 * Qs, H, A0f(0.06), 200, 1000, 1.5, 'sub'), py: `ch16.collapsible_frictionless_alpha(0.7*${QS}, ${HP}, np.pi*0.006**2*(1 + (0.06/0.05)**2), 200.0, 1000.0, 1.5, branch='sub')`, rtol: 1e-10 },
    { name: 'state: throat-preset upstream alpha (x = -12 cm)', js: nT.prof.al[0], py: `ch16.collapsible_frictionless_alpha(${QS}, ${HP}, np.pi*0.006**2*(1 + (-0.12/0.05)**2), 200.0, 1000.0, 1.5, branch='sub')`, rtol: 1e-10 },
    { name: 'state: default Starling flow (p2 = -3 mmHg)', js: NDEF.Q, py: `ch16.starling_state(0.0, -3*133.322387415, 0.0, ${PRM})["Q"]`, rtol: 1e-8 },
    { name: 'invariant: throat H = -41.47 Pa (H <= 0)', js: H, expect: throatH(0.35, 200, 1.5), rtol: 1e-12 },
    { name: 'invariant: alpha_t max = 0.25^(2/3) for n = 1.5', js: alphaTmax(1.5), expect: Math.pow(0.25, 2 / 3), rtol: 1e-14 },
    { name: 'invariant: x(alpha*) = L at Q_lim', js: xOfAlpha(lim.a_star, 1, lim.Q_lim, vein), expect: 0.1, rtol: 1e-9 },
    { name: 'invariant: S = 1 at alpha* (Q_lim)', js: Math.sqrt(terms(lim.a_star, lim.Q_lim, vein).S2), expect: 1, rtol: 1e-12 },
    { name: 'invariant: P < 0 when collapsed (alpha 0.5)', js: tubeLaw(0.5, 1.5) < 0 ? 1 : 0, expect: 1, rtol: 0 },
    { name: 'invariant: throat-preset S at the throat = 1', js: nT.star.S, expect: 1, rtol: 1e-7 }
  ];
}

/* ---- the app ---------------------------------------------------------------------------------------------------------------------- */
function markMode(a) { if (a && a.root) { const m = a.state.mode; if (a.root.getAttribute('data-ctm') !== m) { a.root.setAttribute('data-ctm', m); if (a._ready) a.fit(); } } }
const app = Viz.app({
  title: 'Why can\'t you suck harder through a floppy straw?',
  subtitle: 'A soft tube carries blood: lower its outlet pressure and the flow rises, then stalls — the outlet has reached its own wave speed, S = 1.',
  autoplay: false,
  params: {
    p2: { label: 'Outlet pressure $p_2-p_e$', min: -25, max: 0, step: 0.1, value: -3, unit: 'mmHg', fmt: v => FX(v, 1) + ' mmHg', help: 'below p₂* the flow is limited' },
    mu: { label: 'Viscosity $\\mu$ (friction)', min: 1, max: 8, step: 0.1, value: 3.5, unit: 'mPa s', fmt: v => FX(v, 1) + ' mPa s', help: 'blood ≈ 3.5, water 1' },
    at: { label: 'Throat area ratio $\\alpha_t$', min: 0.15, max: 0.39, step: 0.005, value: 0.35, unit: '', fmt: v => FX(v, 3), help: 'fit needs αₜ ≤ (1 − n/2)^(1/n)' },
    qr: { label: 'Flow $Q/Q^*$', min: 0.3, max: 1, step: 0.01, value: 1, unit: '', fmt: v => FX(v, 2), help: '1: S = 1 at the throat' },
    Q: { label: 'Flow $Q$', min: 1, max: 15, step: 0.1, value: 10, unit: 'mL/s', fmt: v => FX(v, 1) + ' mL/s', help: 'blood draining down the neck' },
    n: { label: 'Tube-law exponent $n$', min: 1.2, max: 1.9, step: 0.05, value: 1.5, unit: '', fmt: v => FX(v, 2), optional: true, help: 'Shapiro: 3/2' },
    Kp: { label: 'Bending stiffness $K_p$', min: 100, max: 500, step: 10, value: 200, unit: 'Pa', fmt: v => FX(v, 0) + ' Pa', optional: true, help: 'stiffer wall: faster waves' },
    xc: { label: 'Cursor $x_c$ (share of length)', min: 0, max: 1, step: 0.01, value: 0.3, unit: '', fmt: v => FX(v, 2), optional: true, help: 'or click the α, S view' }
  },
  modes: { param: 'mode', label: 'System', options: [['starling', 'Starling'], ['throat', 'Throat'], ['jugular', 'Jugular']] },
  transport: { param: 't', min: 0, max: 2, value: 0, rate: 0.25, end: 'loop', step: 0.02, label: 'time $t$ (slow motion)', unit: 's' },
  presets: [
    { label: 'open', set: { mode: 'starling', p2: -0.5 }, title: 'small suction: far from the limit' },
    { label: 'onset', set: { mode: 'starling', p2: -7.1 }, title: 'just past p₂*: S reaches 1 at the outlet' },
    { label: 'deep', set: { mode: 'starling', p2: -15 }, title: 'deep suction: the same flow' },
    { label: 'throat S = 1', set: { mode: 'throat', qr: 1, at: 0.35 }, title: 'a smooth passage through S = 1' },
    { label: 'jugular', set: { mode: 'jugular', Q: 10 }, title: 'a giraffe neck vein, dz/dx = −1' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'Q', label: 'Flow $Q$', unit: 'mL/s', value: s => N(s).Q * 1e6, fmt: v => FX(v, 2) + ' mL/s' },
    { id: 'aS', label: 'Area ratio α at ★', unit: '', value: s => N(s).star.al, fmt: v => FX(v, 4) },
    { id: 'SS', label: 'Speed index S at ★', unit: '', value: s => N(s).star.S, fmt: v => FX(v, 4), tone: v => (v >= 0.9995 ? 'neg' : '') },
    { id: 'cS', label: 'Wave speed c at ★', unit: 'm/s', value: s => N(s).star.t.c, fmt: v => FX(v, 3) + ' m/s' },
    { id: 'M', label: 'Shapiro M = 2 − n', unit: '', value: s => shapiroM(s.n), fmt: v => FX(v, 2) },
    { id: 'pS', label: '$p-p_e$ at ★', unit: 'Pa', value: s => N(s).star.p, fmt: v => FX(v, 1) + ' Pa', optional: true },
    { id: 'om', label: '1 − S² at the cursor', unit: '', value: s => N(s).cur.t.one_minus_S2, fmt: v => FX(v, 4), optional: true },
    { id: 'dadx', label: 'dα/dx at the cursor', unit: '1/m', value: s => N(s).cur.t.dalpha_dx, fmt: v => (isFinite(v) ? SG(v, 3) + ' 1/m' : '0/0'), optional: true }
  ],
  terms: { title: 'Drivers of dα/dx at the cursor', unit: '1/m', sig: 3, items: [
    { id: 'area', label: 'area $\\tfrac{S^2}{A_0}\\tfrac{dA_0}{dx}$', color: C('teal'), value: s => N(s).cur.t.area, help: 'a widening reference area' },
    { id: 'ext', label: 'outside pressure', color: C('orange'), value: s => N(s).cur.t.external, help: 'zero here: pₑ uniform' },
    { id: 'grav', label: 'gravity', color: C('text'), value: s => N(s).cur.t.gravity, help: 'the jugular: dz/dx = −1' },
    { id: 'fric', label: 'friction $-\\tfrac{\\mathrm RQ}{\\rho c^2}$', color: C('rose'), value: s => N(s).cur.t.friction, help: 'always narrows a subcritical tube' },
    { id: 'stiff', label: 'stiffness', color: C('muted'), value: s => N(s).cur.t.stiffness, help: 'zero here: Kₚ uniform' }
  ], total: { label: 'driver (sum)' } },
  inspect: s => inspectHtml(s),
  inspectTitle: 'Inspector · the cursor',
  notes: s => notesHtml(s),
  stage: {
    rows: [0.95, 1],
    views: [
      { id: 'tube', row: 0, flex: 1, title: s => tubeTitle(s) },
      { id: 'along', row: 1, flex: 1.25, title: s => alongTitle(s) },
      { id: 'side', row: 1, flex: 1, hidePortrait: true, title: s => sideTitle(s) }
    ],
    setup(g) { APP = g.app; markMode(g.app); },
    draw(g, s) {
      APP = g.app || APP; markMode(APP);
      const n = N(s);
      drawSide(g.view('side'), s, n);
      drawTube(g.view('tube'), s, n, g.app);
      drawAlong(g.view('along'), s, n);
    },
    onPointer(g, ev, s) {
      if (ev.viewId !== 'along' || !ALONGP) return false;
      if (ev.type !== 'pointerdown' && !(ev.type === 'pointermove' && ev.buttons)) return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (!ALONGP.inside(v.pointer.x, Math.min(ALONGP.px.y + ALONGP.px.h - 1, Math.max(ALONGP.px.y + 1, v.pointer.y)))) return false;
      const n = N(s), x = ALONGP.ix(v.pointer.x) / 100, f = (x - n.x0) / (n.x1 - n.x0);
      g.app.set({ xc: Math.round(Math.max(0, Math.min(1, f)) * 100) / 100 });
      return true;
    }
  },
  onChange(s, key, a) { if (key === 'mode') markMode(a); },
  explore: {
    intro: 'Pick a system, then drag its slider. Click the α, S view to move the cursor.',
    controls: ['p2', 'mu', 'at', 'qr', 'Q', 'n', 'Kp', 'xc'],
    readouts: ['Q', 'aS', 'SS', 'cS', 'M', 'pS', 'om', 'dadx'],
    callouts: [{ kind: 'try', html: 'Predict first: raise the stiffness $K_p$. Does the plateau rise or fall? (Hint: $' + C189I + '$ (16.189).)' }]
  },
  explain: { html: s => explainHtml(s), live: s => ({ t: FX(s.t, 2), news: newsLive(s) }) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
