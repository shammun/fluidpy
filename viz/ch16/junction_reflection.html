  return [
    { name: 'R, daughters 0.8 a1 (Y 0.64 each)', js: RT(1, [0.64, 0.64])[0], py: 'ch16.junction_coefficients(Y_parent=1.0, Y_daughters=[0.64, 0.64])[0]', rtol: 1e-14 },

    { name: 'R, Murray fork from geometry', js: gM.R, py: 'ch16.junction_from_geometry(a_parent=1.0, a_daughters=[2**(-1/3), 2**(-1/3)], c_parent=5.0, c_daughters=[5.0, 5.0], rho=1060.0)["R"]', rtol: 1e-12 },
    { name: 'sum Y / Y1, asymmetric stiff daughters', js: gA.ratio, py: 'ch16.junction_from_geometry(a_parent=5e-3, a_daughters=[4e-3, 2.5e-3], c_parent=5.0, c_daughters=7.5, rho=1060.0)["ratio"]', rtol: 1e-12 },
    { name: 'R, asymmetric stiff daughters', js: gA.R, py: 'ch16.junction_from_geometry(a_parent=5e-3, a_daughters=[4e-3, 2.5e-3], c_parent=5.0, c_daughters=7.5, rho=1060.0)["R"]', rtol: 1e-12 },
    { name: 'Y1 = pi a^2/(rho c), a 5 mm, c 5 m/s', js: Yof(PI * 25e-6, 1060, 5), py: 'ch16.tube_admittance(A=np.pi * 0.005**2, rho=1060.0, c=5.0)', rtol: 1e-14 },

    { name: 'energy transmitted, Y = 0.2, 0.9', js: energy(1, [0.2, 0.9]).transmitted, py: 'ch16.junction_energy(Y_parent=1.0, Y_daughters=[0.2, 0.9])["transmitted"]', rtol: 1e-13 },

    { name: 'grid echo R (network_pulse_run) vs closed form', js: asymR[0], py: 'ch16.network_pulse_run(L_parent=1.2, L_daughters=[1.0, 1.0], c_parent=5.0, c_daughters=7.5, Y_parent=1.0, Y_daughters=[0.4**2/1.5, 0.6**2/1.5], width=0.05)["R_measured"]', rtol: 1e-6 },

      { id: 'net', row: 0, flex: 1, title: s => netTitle(s) },
      { id: 'probe', row: 1, flex: 1.35, title: s => probeTitle(s) },
      { id: 'bars', row: 1, flex: 0.85, hidePortrait: true, title: () => barsTitle() }
    ],
    setup(g) { APP = g.app; },
    draw(g, s) {
      APP = g.app || APP;
      const n = N(s);
      drawBars(g.view('bars'), s, n);
      drawNet(g.view('net'), s, n, g.app);
      drawProbe(g.view('probe'), s, n);
    },
    onPointer(g, ev, s) {
      if (ev.viewId !== 'net' || !NETP) return false;
      if (ev.type !== 'pointerdown' && !(ev.type === 'pointermove' && ev.buttons)) return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const x = (v.pointer.x - NETP.XJ) / NETP.k, dy = Math.abs(v.pointer.y - NETP.YJ);
      if (x < -LP - 0.05 || x > 0.02 || dy > NETP.hw0 * 3 + 12) return false;
      g.app.set({ xp: Math.round(Math.max(-1.15, Math.min(-0.05, x)) * 100) / 100 });
      return true;
    }
  },
  explore: {
    intro: 'Change the daughters\' radius and stiffness, press ▶, and watch what comes back. Click the parent tube to move the probe.',
    controls: ['r', 's', 'asym', 'r2', 'w', 'xp'],
    readouts: ['ratio', 'R', 'T', 'er', 'esum', 'pp', 'pq'],
    callouts: [{ kind: 'try', html: 'Predict first: with daughters as wide as the parent ($a_j=a_1$), is the echo a bump or a dip, and how big? Then click "open-end-like".' }]
  },
  explain: { html: s => explainHtml(s), live: s => { const n = N(s); return { t: FX(s.t, 3), pp: SG(n.pr.p, 3), pq: SG(n.pr.Q, 3) }; } },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
</script>
</body>
</html>
