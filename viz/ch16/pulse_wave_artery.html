/* ---- view 1: the artery from the side ------------------------------------------------------------------------------- */
let PA = null, PG = null, PS = null;
function drawArtery(g, s) {
  const v = g.view('artery'); v.clear(); PA = null;

  const a0mm = s.a0, hmm = K.h * 1e3, ymax = 1.62 * a0mm + hmm;
  const pad = { l: small ? 8 : 40, r: 8, t: 4, b: tiny ? 18 : 34 };
  const P = v.plot({ xlim: XL, ylim: [-ymax, ymax], pad });
  PA = P;
  P.axes({ grid: false, zeroLines: false, xticks: v.w < 300 ? [0, 0.5, 1] : [0, 0.2, 0.4, 0.6, 0.8, 1], yticks: small ? [] : [-a0mm, 0, a0mm] });
  if (!small) { ctx.save(); ctx.font = Viz.font(12, 500); ctx.fillStyle = Viz.color('text-soft'); ctx.translate(10, P.px.y + P.px.h / 2); ctx.rotate(-PI / 2); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('r [mm]', 0, 0); ctx.restore(); }

    const dx = (XL[1] - XL[0]) / (n - 1);

      if (p > 0.02) { ctx.globalAlpha = Math.min(0.5, 0.5 * p); ctx.fillStyle = C.OR; const X = P.X(xs[i] - dx / 2); ctx.fillRect(X, P.Y(rs[i]), P.sx(dx) + 0.8, P.Y(-rs[i]) - P.Y(rs[i])); }

/* ---- view 2: p(x) and u(x) now ------------------------------------------------------------------------------------ */

    o += `$u = \\dfrac{p}{\\rho c} = \\dfrac{${t4(q.p)}}{1060\\times${t3(cm)}} = \\mathbf{${t3(q.u)}}$ m/s, from $\\hat p_1=\\rho c\\hat u_1$ (16.68)<br>`;
  }
  o += isFinite(q.a) ? `tube law $a=a_0\\left[1-\\frac{a_0}{Eh}(p-p_e)\\right]^{-1}$ (16.41):<br>$a = ${t3(s.a0)}/(1-${t4(q.p)}/${t4(K.Eha)}) = \\mathbf{${t4(q.a * 1e3)}}$ mm<br>`
    : `$a=a_0\\left[1-\\frac{a_0}{Eh}(p-p_e)\\right]^{-1}$ (16.41): $p \\ge Eh/a_0$ — no finite radius<br>`;
  o += `parcel shift so far $\\int_0^t u\\,dt' = \\mathbf{${t3(K.sh * 1e3)}}$ mm`;
  return o;
}
function reading(s) {
  const K = W(s);
  let r;
  if (s.E < 0.2) r = 'A soft wall: a slow pulse and a big bulge — a vein-like tube.';
  else if (s.E <= 0.8) r = `A young aorta: the pulse covers 0.5 m in about ${f2(1e3 * K.arrive)} ms, a tenth of a second.`;
  else r = 'A stiff wall: the pulse races ahead — clinicians read a high pulse-wave velocity as arterial stiffening.';
  if (!K.ok) r += ' At this amplitude the crest pressure exceeds the wall stiffness Eh/a₀: the Hookean tube law has no finite radius, so nothing here is trustworthy.';
  else if (K.beta > 0.3) r += ` But p̂/(Eh/a₀) = ${f2(K.beta)} is not small: a real pulse this strong would steepen as it travels.`;
  else if (K.beta > 0.1) r += ` p̂/(Eh/a₀) = ${f2(K.beta)}: linear theory is only roughly right.`;
  return r;
}
function statusOf(s) {
  const K = W(s), ph = phone(), b = f2(K.beta), uc = f2(K.uc);
  if (!K.ok) return { text: ph ? '⛔ p̂ ≥ Eh/a₀ · no finite radius' : `⛔ p̂ ≥ Eh/a₀ (ratio ${b}): the Hookean tube law has no finite radius`, tone: 'bad' };
  if (K.beta > 0.3) return { text: ph ? `⛔ too strong · p̂/(Eh/a₀) ${b}` : `⛔ too strong for linear theory: p̂/(Eh/a₀) = ${b}, u/c = ${uc} — the pulse would steepen`, tone: 'bad' };
  if (K.beta > 0.1) return { text: ph ? `⚠️ mildly nonlinear · p̂/(Eh/a₀) ${b}` : `⚠️ mildly nonlinear: p̂/(Eh/a₀) = ${b}, u/c = ${uc} — the linear tube law is first order only`, tone: 'warn' };
  return { text: ph ? `✅ linear · p̂/(Eh/a₀) ${b} · u/c ${uc}` : `✅ linear theory fine: p̂/(Eh/a₀) = ${b}, u/c = ${uc}`, tone: 'info' };
}

        { did: 'Read off the stiffness', tex: R`\frac{\partial p}{\partial A}=\frac{Eh}{2a_0A_0}\;\;(16.58)`,
          why: 'The derivative of the linear law.',
          plain: 'How many pascals one more square metre of area costs.' }
      ],
      result: { tex: R`\begin{aligned}\frac{\partial A}{\partial t}+A_0\frac{\partial u}{\partial x}&=0\;\;(16.56)\\ \rho\frac{\partial u}{\partial t}&=-\frac{\partial p}{\partial x}\;\;(16.57)\\ p-p_e&=\frac{Eh}{2a_0A_0}(A-A_0)\;\;(16.58)\end{aligned}`, plain: 'Small pulses obey linear laws, so they add and travel without changing shape.' },
      interpret: s => { const K = W(s); return `With your pulse p̂/(Eh/a₀) = ${f2(K.beta)} and u/c = ${f2(K.uc)}: ` + (K.beta < 0.1 ? 'both small — the linear laws are a good model.' : K.ok ? 'not small — a real pulse this strong would steepen as it travels.' : 'beyond the tube law itself.'); },
      check: 'Units of Eh/(2a₀A₀): Pa·m/(m·m²) = Pa/m² ✓. Our illustrative aorta with a 25 mmHg pulse: p̂/(Eh/a₀) = 0.067 and u/c = 0.13 — both small. Selftest rows "linear tube law" and "u/c".' },

    { id: 'D12', title: 'The wave equation and the Moens–Korteweg speed', short: 'Wave speed', ref: 'Eq. (16.61)–(16.62)', view: 'graph', set: { ic: 'right', t: 0.08 },
      goal: 'Combine the linear laws into one wave equation for the pressure and read off its speed.',
      start: { tex: R`\begin{aligned}\frac{\partial A}{\partial t}+A_0\frac{\partial u}{\partial x}&=0\\ \rho\frac{\partial u}{\partial t}&=-\frac{\partial p}{\partial x}\end{aligned}`,
        plain: R`The linear laws $\frac{\partial A}{\partial t}+A_0\frac{\partial u}{\partial x}=0$ (16.56), $\rho\frac{\partial u}{\partial t}=-\frac{\partial p}{\partial x}$ (16.57) and $p-p_e=\frac{Eh}{2a_0A_0}(A-A_0)$ (16.58).` },
      plan: ['Differentiate across.', 'Swap the mixed derivative.', 'Eliminate u.', 'Turn area into pressure.'],
      uses: ['cross-differentiation (Ch. 15)', "Schwarz's theorem: mixed partial derivatives commute", 'chain rule'],
      steps: [
        { did: 'Differentiate the area law in time', tex: R`\frac{\partial^2A}{\partial t^2}+A_0\frac{\partial^2u}{\partial t\,\partial x}=0`,
          why: R`$\partial/\partial t$ of $\frac{\partial A}{\partial t}+A_0\frac{\partial u}{\partial x}=0$ (16.56); $A_0$ is constant.`,
          plain: 'How the swelling accelerates.' },
        { did: 'Differentiate momentum in space', tex: R`\rho\frac{\partial^2u}{\partial x\,\partial t}=-\frac{\partial^2p}{\partial x^2}`,
          why: R`$\partial/\partial x$ of $\rho\frac{\partial u}{\partial t}=-\frac{\partial p}{\partial x}$ (16.57); $\rho$ is constant.`,
          plain: 'How the acceleration changes along the tube.' },
        { did: 'Swap the order of the mixed derivative', tex: R`\frac{\partial^2u}{\partial t\,\partial x}=\frac{\partial^2u}{\partial x\,\partial t}`,
          why: "Schwarz's theorem for a smooth u; it lets steps 1 and 2 share a term.",
          plain: 'Same quantity, two orders.' },
        { did: 'Eliminate the velocity', tex: R`\frac{\partial^2A}{\partial t^2}=\frac{A_0}{\rho}\frac{\partial^2p}{\partial x^2}\;\;(16.59)`,
          why: R`Step 2 gives the mixed term as $-\frac1\rho\partial^2p/\partial x^2$; put it in step 1.`,
          plain: 'The tube swells faster where the pressure is curved.', set: { ic: 'rest', t: 0 }, play: true },
        { did: 'Turn area into pressure', tex: R`\frac{\partial^2p}{\partial t^2}=\frac{\partial p}{\partial A}\frac{\partial^2A}{\partial t^2}\;\;(16.60)`,
          why: R`$p$ depends on $t$ only through $A$ by $p-p_e=\frac{Eh}{2a_0A_0}(A-A_0)$ (16.58), with a constant slope, so the chain rule applied twice gives no extra term.`,
          plain: 'Pressure follows area with a fixed factor.' },
        { did: 'Combine', tex: R`\begin{aligned}\frac{\partial^2p}{\partial t^2}&=c^2\frac{\partial^2p}{\partial x^2}\;\;(16.61)\\c^2&=\frac{A_0}{\rho}\frac{\partial p}{\partial A}\end{aligned}`,
          why: R`Put $\frac{\partial^2A}{\partial t^2}=\frac{A_0}{\rho}\frac{\partial^2p}{\partial x^2}$ (16.59) into step 5; the constant is positive (a tube that resists swelling), so it is a speed squared.`,
          plain: 'The pressure obeys the wave equation of Ch. 15.' },
        { did: 'Insert the Hookean slope', tex: R`c=\sqrt{\frac{A_0}{\rho}\frac{Eh}{2a_0A_0}}=\sqrt{\frac{Eh}{2\rho a_0}}\;\;(16.62)`,
          why: R`The slope $\frac{\partial p}{\partial A}=\frac{Eh}{2a_0A_0}$ (16.58); $A_0$ cancels. With a general tube law the form $c^2=\frac A\rho\frac{dp}{dA}$ stays (Bramwell–Hill).`,
          plain: 'The Moens–Korteweg speed: wall stiffness against blood inertia.',
          live: s => { const K = W(s); return R`c=\sqrt{\frac{${t4(K.Eha)}}{2\times1060}}=${t3(K.c)}\ \text{m/s}`; } }
      ],
      result: { tex: R`\begin{aligned}\frac{\partial^2p}{\partial t^2}&=c^2\frac{\partial^2p}{\partial x^2}\;\;(16.61)\\ c&=\sqrt{\frac{Eh}{2\rho a_0}}=\sqrt{\frac A\rho\frac{dp}{dA}}\;\;(16.62)\end{aligned}`, plain: 'The pulse is a wave of wall stretch; its speed measures the wall.' },
      interpret: s => { const K = W(s); return `Your wall gives c = ${f3(K.c)} m/s: the blood under the crest moves at ${f3(K.uHat)} m/s, ${f2(K.c / K.uHat)} times slower.`; },
      check: 'Units: Pa·m/(kg m⁻³·m) = m²/s² ✓. Easy numbers: E = 0.72 MPa, h/a₀ = 0.1, ρ = 1000 kg/m³ give c² = 36, c = 6 m/s. E → ∞ gives c → ∞, a rigid tube. Selftest rows "MK", "midwall" and "Bramwell–Hill".' }
  ].map(d => { d.steps.forEach(st => { if (st.play === undefined) st.play = false; }); return d; }),

  /* ---- code ---------------------------------------------------------------------------------------------------------------- */
  code: [
    { id: 'mk', title: 'The pulse with fluidpy', ref: 'Eq. (16.62)',
      src: `from fluidpy import ch16
E, h, a0, rho = {{E}}e6, {{h}}, {{a0}}, 1060.0  # Pa, m, m, kg/m^3
c = ch16.moens_korteweg_speed(E, h, rho, a0)   # {{c}} m/s
p = {{P}} * ch16.MMHG                    # crest {{Pp}} Pa
eta = ch16.wall_bulge(p, a0=a0, E=E, h=h)   # {{eta}} m
u = ch16.velocity_from_pulse(p, rho, c)     # {{u}} m/s
s = ch16.pulse_state({{x}}, {{t}}, c=c, amplitude=p,
        width=0.1, rho=rho, a0=a0, E=E, h=h,
        ic="{{ic}}", x0={{x0}})          # p = {{pp}} Pa
r = ch16.linearisation_ratios(p, 100 * ch16.MMHG, u, c,
        Eh_over_a0=E * h / a0)           # strain {{st}}, u/c {{uc}}`,
      live: s => { const K = W(s); return { E: String(s.E), h: K.h.toPrecision(4), a0: K.a0.toPrecision(4), c: f4(K.c), P: String(s.P), Pp: f4(K.P),
        eta: isFinite(K.eta) ? K.eta.toExponential(3) : 'nan', u: f3(K.u), x: s.xp.toFixed(2), t: s.t.toFixed(3), ic: s.ic, x0: K.x0.toFixed(1), pp: f3(K.st.p), st: f2(K.beta), uc: f2(K.uc) }; } },
    { id: 'scratch', title: 'From scratch', ref: 'Eq. (16.41), (16.62), (16.68)',
      src: `import numpy as np
c = np.sqrt(E * h / (2 * rho * a0))     # (16.62): {{c}} m/s
a = a0 / (1 - a0 * p / (E * h))         # (16.41): {{a}} mm
xi = ({{x}} - {{x0}} - c * {{t}}) / 0.1          # right-going crest
p_x = p * np.exp(-xi**2)                # {{px}} Pa
u_x = p_x / (rho * c)                   # (16.68): {{ux}} m/s
assert np.isclose(c, ch16.moens_korteweg_speed(E, h, rho, a0))`,
      live: s => { const K = W(s), xi = (s.xp - K.x0 - K.c * s.t) / WID, px = K.P * Math.exp(-xi * xi);
        return { c: f4(K.c), a: isFinite(K.aMax) ? f4(K.aMax * 1e3) : 'nan', x: s.xp.toFixed(2), x0: K.x0.toFixed(1), t: s.t.toFixed(3), px: f3(px), ux: f3(px / (RHO * K.c)) }; } }
  ],

  /* ---- walkthrough ------------------------------------------------------------------------------------------------------- */
  tour: [
    { title: 'What do you feel at the wrist?', text: 'When you feel a pulse at your wrist, is that blood arriving from the heart — or something else? Guess, then step on.',
      set: { E: 0.4, ha: 0.125, a0: 12, P: 25, ic: 'right', t: 0, xp: 0.4 }, play: false },
    { title: 'Release a pulse', text: 'Press play. A bulge of <b class="c-orange">pressure</b> runs along the artery at about 5 m/s; the <b class="c-teal">wall</b> swells as it passes and relaxes behind it.',
      set: { E: 0.4, ha: 0.125, a0: 12, P: 25, ic: 'right', t: 0 }, play: true },
    { title: 'The blood barely moves', text: 'Watch the <b class="c-blue">blue dots</b>: each blood parcel jumps forward under the crest and stops — millimetres, not metres. Click the artery to trace the numbers.',
      set: { E: 0.4, ha: 0.125, a0: 12, P: 25, ic: 'right', t: 0.08, xp: 0.4 }, play: false, inspect: true, eq: 'imp' },
    { title: 'Why it travels', text: 'The swelling pushes blood forward, which swells the next slice: the pressure obeys the wave equation $\\frac{\\partial^2p}{\\partial t^2}=c^2\\frac{\\partial^2p}{\\partial x^2}$ (16.61).',
      set: { ic: 'right', t: 0.08 }, play: false, eq: 'wave', derive: { id: 'D12', step: 4 } },
    { title: 'Stiffness sets the speed', text: 'Moens–Korteweg, $c=\\sqrt{Eh/(2\\rho a_0)}$ (16.62): here $E$ is quadrupled to 1.6 MPa, a stiff older aorta. The pulse runs twice as fast and the wall bulges about four times less.',
      set: { E: 1.6, ha: 0.125, a0: 12, P: 25, ic: 'right', t: 0 }, play: true, code: { id: 'mk', lines: [3, 3] }, readouts: ['c'] },
    { title: 'Two halves', text: 'A bump released at rest (no initial push) splits into two halves, each half as high, running apart at ±c. Under the left half the blood moves backward.',
      set: { E: 0.4, ha: 0.125, a0: 12, P: 25, ic: 'rest', t: 0, xp: 0.3 }, play: true },
    { title: 'Your turn', text: 'Predict first: how long does the pulse need to cover 0.5 m when $E$ = 0.8 MPa? Then drag $E$ and read the arrival time.',
      set: { E: 0.4, ha: 0.125, a0: 12, P: 25, ic: 'right', t: 0 }, play: false, controls: ['E', 'ha', 'a0'], readouts: ['arrive'] }
  ],

  /* ---- equations ------------------------------------------------------------------------------------------------------------ */
  equations: [
    { id: 'hoop', title: 'Hoop stress', ref: 'Eq. (16.39)', tex: R`\sigma_{\theta\theta}=\frac{(p-p_e)a}{h}`,
      live: s => { const K = W(s); return K.ok ? R`\sigma_{\theta\theta}=\frac{${t4(K.P)}\times${t3(K.aMax)}}{${t3(K.h)}}=${t3(K.sig / 1e3)}\ \text{kPa}` : R`\text{no finite radius}`; },
      note: 'Laplace\'s law for a thin tube: the wall tension holds the pressure', symbols: [['\\sigma_{\\theta\\theta}', 'hoop (circumferential) stress', 'Pa'], ['p-p_e', 'transmural pressure', 'Pa'], ['h', 'wall thickness', 'm']] },
    { id: 'law', title: 'Tube law', ref: 'Eq. (16.41)', tex: R`a=a_0\left[1-\frac{a_0}{Eh}(p-p_e)\right]^{-1}`,
      live: s => { const K = W(s); return K.ok ? R`a=\frac{${t3(s.a0)}\ \text{mm}}{1-${t3(K.beta)}}=${t4(K.aMax * 1e3)}\ \text{mm}` : R`a_0\hat p/Eh=${t3(K.beta)}\ge1`; },
      note: 'singular when a₀(p − pₑ)/Eh reaches 1 — an artefact of a linear law at the deformed radius', symbols: [['a_0', 'unstressed radius', 'm'], ['E', "Young's modulus of the wall", 'Pa']] },
    { id: 'lin', title: 'Linearised laws', ref: 'Eq. (16.56)–(16.58)', tex: R`\begin{aligned}\frac{\partial A}{\partial t}+A_0\frac{\partial u}{\partial x}&=0\\ \rho\frac{\partial u}{\partial t}&=-\frac{\partial p}{\partial x}\\ p-p_e&=\frac{Eh}{2a_0A_0}(A-A_0)\end{aligned}`,
      live: s => { const K = W(s); return R`\frac{\partial p}{\partial A}=${t3(K.dpdA)}\ \text{Pa/m}^{2}`; },
      note: 'valid while p̂/(Eh/a₀) and u/c are small', symbols: [['A', 'cross-section area', 'm^{2}'], ['u', 'blood speed along x', 'm/s'], ['\\rho', 'blood density', 'kg/m^{3}']] },
    { id: 'wave', title: 'Wave equation', ref: 'Eq. (16.61)', tex: R`\frac{\partial^2p}{\partial t^2}=c^2\frac{\partial^2p}{\partial x^2}`,
      live: s => { const K = W(s); return R`c^2=${t3(K.c * K.c)}\ \text{m}^{2}/\text{s}^{2}`; },
      note: 'any shape travels unchanged at ±c', symbols: [['c', 'pulse-wave speed', 'm/s']] },
    { id: 'mk', title: 'Moens–Korteweg', ref: 'Eq. (16.62)', tex: R`c=\sqrt{\frac{Eh}{2\rho a_0}}=\sqrt{\frac A\rho\frac{dp}{dA}}`,
      live: s => { const K = W(s); return R`c=\sqrt{\frac{${t4(K.Eha)}}{2\times1060}}=${t3(K.c)}\ \text{m/s}`; },
      note: 'with the diameter $d=2a_0$ it reads $\\sqrt{Eh/(\\rho d)}$; thick wall: $c=\\sqrt{Eh/(2\\rho(a_0+h/2))}$ (16.63)', symbols: [['h', 'wall thickness', 'm'], ['a_0', 'radius', 'm']] },
    { id: 'imp', title: 'Pressure and blood speed', ref: 'Eq. (16.68)', tex: R`\hat p_1=\rho c\hat u_1,\qquad\hat p_2=-\rho c\hat u_2`,
      live: s => { const K = W(s); return R`\hat u_1=\frac{${t4(K.P)}}{1060\times${t3(K.c)}}=${t3(K.u)}\ \text{m/s}`; },
      note: 'forward under a right-going crest, backward under a left-going one', symbols: [['\\hat p_1,\\hat u_1', 'right-going amplitudes', 'Pa, m/s'], ['\\hat p_2,\\hat u_2', 'left-going amplitudes', 'Pa, m/s']] }
  ],

  /* ---- check yourself --------------------------------------------------------------------------------------------------- */
  check: [
    { q: 'Quadruple E. What happens to the pulse speed c?',
      a: R`It doubles: $c=\sqrt{Eh/(2\rho a_0)}$ (16.62) grows as $\sqrt E$. From 4.86 to 9.71 m/s for the illustrative aorta.`, set: { E: 1.6, ha: 0.125, a0: 12 } },
    { q: 'Under the crest, how fast does the blood move compared with the pulse?',
      a: R`From $\hat p_1=\rho c\hat u_1$ (16.68), $\hat u/c=\hat p/(\rho c^2)\approx0.13$: the blood is about eight times slower than the pulse and moves only while the crest passes.`, set: { E: 0.4, ha: 0.125, a0: 12, P: 25, ic: 'right', t: 0.08 } },
    { q: 'Release a bump at rest. How high is each half, and which way does the blood under the left half move?',
      a: R`Half the height; backward, because $\hat p_2=-\rho c\hat u_2$ (16.68) for a left-going wave.`, set: { ic: 'rest', t: 0.05, xp: 0.26 } },
    { q: 'Why does a bigger radius at the same wall thickness h give a slower pulse?',
      a: R`The hoop stress $\sigma_{\theta\theta}=(p-p_e)a/h$ (16.39) is larger, so the wall stretches more per pascal: a softer spring, and $c=\sqrt{Eh/(2\rho a_0)}$ (16.62) falls as $1/\sqrt{a_0}$.` }
  ],

  /* ---- selftest: JS ↔ fluidpy parity -------------------------------------------------------------------------------- */
  selftest: () => {
    const c0 = cMK(0.4e6, 1.5e-3, 12e-3, 1060, false), P0 = 25 * MMHG;
    const o = { c: 4.856429311786321, P: 3333.06, w: 0.1, rho: 1060, a0: 12e-3, E: 0.4e6, h: 1.5e-3, x0: 0 };
    const oR = Object.assign({}, o, { x0: 0.5 });
    const A0 = PI * 12e-3 * 12e-3;
    const ts = Viz.num.linspace(0, 0.2, 4001), uPath = ts.map(t => state(0.37, t, 'rest', oR).u);
    const PY = 'c=4.856429311786321, amplitude=3333.06, width=0.1, rho=1060.0, a0=12e-3, E=0.4e6, h=1.5e-3';
    return [
      { name: 'MK', js: c0, py: 'ch16.moens_korteweg_speed(0.4e6, 1.5e-3, 1060.0, 12e-3)', rtol: 1e-12 },
      { name: 'midwall', js: cMK(0.4e6, 1.5e-3, 12e-3, 1060, true), py: 'ch16.moens_korteweg_speed(0.4e6, 1.5e-3, 1060.0, 12e-3, midwall=True)', rtol: 1e-12 },
      { name: 'bulge', js: bulge(P0, 12e-3, 0.4e6, 1.5e-3), py: 'ch16.wall_bulge(25*133.322387415, a0=12e-3, E=0.4e6, h=1.5e-3)', rtol: 1e-12 },
      { name: 'tube law (100 mmHg)', js: aOf(100 * MMHG, 12e-3, 0.4e6, 1.5e-3), py: 'ch16.tube_radius_hookean(100*133.322387415, 0.0, 12e-3, 0.4e6, 1.5e-3)', rtol: 1e-12 },
      { name: 'hoop stress', js: hoop(100 * MMHG, 0, aOf(100 * MMHG, 12e-3, 0.4e6, 1.5e-3), 1.5e-3), py: 'ch16.hoop_stress(100*133.322387415, 0.0, ch16.tube_radius_hookean(100*133.322387415, 0.0, 12e-3, 0.4e6, 1.5e-3), 1.5e-3)', rtol: 1e-12 },
      { name: 'u', js: uOf(3333.06, 1060, 4.856429311786321), py: 'ch16.velocity_from_pulse(3333.06, 1060.0, 4.856429311786321)', rtol: 1e-12 },
      { name: 'state p', js: state(0.4, 0.08, 'right', o).p, py: `ch16.pulse_state(0.4, 0.08, ${PY}, ic="right")["p"]`, rtol: 1e-10 },
      { name: 'state a', js: state(0.4, 0.08, 'right', o).a, py: `ch16.pulse_state(0.4, 0.08, ${PY}, ic="right")["a"]`, rtol: 1e-10 },
      { name: 'state u (rest, x0 0.5)', js: state(0.37, 0.03, 'rest', oR).u, py: `ch16.pulse_state(0.37, 0.03, ${PY}, ic="rest", x0=0.5)["u"]`, rtol: 1e-10 },
      { name: 'state p (rest, x0 0.5)', js: state(0.62, 0.03, 'rest', oR).p, py: `ch16.pulse_state(0.62, 0.03, ${PY}, ic="rest", x0=0.5)["p"]`, rtol: 1e-10 },
      { name: 'E from c', js: Einv(6.0, 1.5e-3, 1060, 12e-3, false), py: 'ch16.youngs_modulus_from_pwv(6.0, 1.5e-3, 1060.0, 12e-3)', rtol: 1e-12 },
      { name: 'u/c', js: ratios(3333.06, 100 * MMHG, 0.6475, 4.8564, 5e4).u_over_c, py: 'ch16.linearisation_ratios(3333.06, 100*133.322387415, 0.6475, 4.8564, Eh_over_a0=5e4)["u_over_c"]', rtol: 1e-12 },
      { name: 'strain', js: ratios(3333.06, 100 * MMHG, 0.6475, 4.8564, 5e4).strain, py: 'ch16.linearisation_ratios(3333.06, 100*133.322387415, 0.6475, 4.8564, Eh_over_a0=5e4)["strain"]', rtol: 1e-12 },
      { name: 'linear tube law', js: lawLin(1.05 * A0, A0, 0.4e6, 1.5e-3, 12e-3), py: 'ch16.tube_law_linear(1.05*math.pi*12e-3**2, math.pi*12e-3**2, 0.4e6, 1.5e-3, 12e-3)', rtol: 1e-12 },
      { name: 'Bramwell–Hill', js: cBH(A0, 0.4e6 * 1.5e-3 / (2 * 12e-3 * A0), 1060), py: 'ch16.bramwell_hill_speed(math.pi*12e-3**2, 0.4e6*1.5e-3/(2*12e-3*math.pi*12e-3**2), 1060.0)', rtol: 1e-12 },
      { name: 'half height', js: state(c0 * 0.2, 0.2, 'rest', Object.assign({}, o, { c: c0 })).p / 3333.06, expect: 0.5, rtol: 1e-6 },
      { name: 'Bramwell–Hill = MK', js: cBH(A0, 0.4e6 * 1.5e-3 / (2 * 12e-3 * A0), 1060), expect: c0, rtol: 1e-12 },
      { name: 'parcel shift = path integral of u', js: shift(0.37, 0.2, 'rest', oR), expect: Viz.num.trapz(uPath, ts), rtol: 1e-5 },
      { name: 'u/c = 2 p/(Eh/a0)', js: uOf(P0, 1060, c0) / c0, expect: 2 * P0 / (0.4e6 * 1.5e-3 / 12e-3), rtol: 1e-12 }
    ];
  }
});
