.viz-work-table th { color: var(--viz-muted); font-weight: 600; }

.viz-work-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; margin-right: 6px;
  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-work-hint { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--viz-muted); font-style: italic; }
.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

.viz-der-chain { display: flex; align-items: center; gap: 6px; }

.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }

.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage-top,
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }

.viz-pages { position: relative; }

  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--viz-card) 45%); padding-right: 2px; }

    { name: 'invariant: still column psi = psi_soil', js: column(20, -0.1e6, 0, 25e-6, 1e-3).psi / (-0.1e6), expect: 1, rtol: 1e-12 },

    { name: 'invariant: p(H_max) = p_cav', js: (n => column(n.hmax, n.ps, n.u, n.a, MU_W).p / P_CAV)(M(S())), expect: 1, rtol: 1e-12 },
    { name: 'invariant: Poiseuille mean speed = u', js: poiseuilleQ(25e-6, column(1, 0, 1e-3, 25e-6, 1e-3).grad, 1, 1e-3) / (PI * 625e-12), expect: 1e-3, rtol: 1e-12 },
    { name: 'invariant: pores do not fit for N > (a/r)^2', js: sieve(1e-15, 1e-3, 10e-6, 1e-6, 300e-6, 1e-6, 101) === null ? 1 : 0, expect: 1, rtol: 0 },
    { name: 'invariant: book units (S30): rho g z / 1e6 bar = SI / 1e5', js: (1 * 980 * 3000 / 1e6) / (1000 * 9.80 * 30 / 1e5), expect: 1, rtol: 1e-12 }
  ];
}

/* ---- the app ------------------------------------------------------------------------------------------------------------ */
const PRE = [
  { label: 'houseplant', set: { mode: 'xylem', H: 0.5, u: 0.5, a: 25, ps: -0.1 }, title: '0.5 m: capillarity alone would almost do' },
  { label: '30 m tree', set: { mode: 'xylem', H: 30, u: 1.0, a: 25, ps: -0.1 }, title: 'the illustrative tree of the notebook: top p = −0.778 MPa' },
  { label: '100 m giant', set: { mode: 'xylem', H: 100, u: 1.0, a: 25, ps: -0.1 }, title: 'beyond the illustrative −2 MPa limit' },
  { label: 'drought', set: { mode: 'xylem', H: 30, u: 1.0, a: 25, ps: -1.5 }, title: 'dry soil: ψ_soil = −1.5 MPa' }
];
const app = Viz.app({
  title: 'How does water climb a 30-metre tree?',
  subtitle: 'Follow water from soil to leaf through pressure, solutes and height: the sap climbs by being pulled, under tension.',
  autoplay: false,
  params: {
    H: { label: 'Tree height $H$', min: 0.5, max: 120, log: true, value: 30, unit: 'm', fmt: v => FX(v, v < 10 ? 2 : 1) + ' m', help: '30 m: a tall oak (illustrative)' },
    u: { label: 'Sap speed in a conduit $u$', min: 0, max: 3, step: 0.05, value: 1.0, unit: 'mm/s', fmt: v => FX(v, 2) + ' mm/s', help: '0: stomata closed, no flow' },
    a: { label: 'Conduit radius $a$', min: 5, max: 100, log: true, value: 25, unit: 'µm', fmt: v => FX(v, 1) + ' µm', help: 'xylem vessels are 5–100 µm' },
    ps: { label: 'Soil water potential $\\psi_{soil}$', min: -2, max: 0, step: 0.05, value: -0.1, unit: 'MPa', fmt: v => FX(v, 2) + ' MPa', help: '−0.1: moist soil · −1.5: drought' },
    st: { type: 'select', label: 'Station', options: [['soil', 'soil'], ['z', 'height z'], ['top', 'stem top'], ['leaf', 'leaf cell']], value: 'top', display: 'chips' },
    cl: { label: 'Leaf cell solutes $c$', min: 0.1, max: 1.0, step: 0.05, value: 0.5, unit: 'mol/L', fmt: v => FX(v, 2) + ' mol/L', optional: true, help: 'sets the leaf\'s −RᵤTc term' },
    zf: { label: 'Probe height $z/H$', min: 0, max: 1, step: 0.01, value: 0.5, unit: '', fmt: v => FX(v, 2), optional: true, help: 'or click the profile' },
    N: { label: 'Pores per sieve plate $N$', min: 1, max: 100, step: 1, value: 50, unit: '', fmt: v => String(Math.round(v)), optional: true, help: 'phloem mode; at most (a/r)² = 100 fit' }
  },
  modes: { param: 'mode', label: 'System', options: [['xylem', 'xylem'], ['phloem', 'phloem']], value: 'xylem' },
  presets: PRE,
  status: s => statusOf(s),
  readouts: [
    { id: 'ptop', label: 'Top pressure $p$', unit: 'MPa', value: s => M(s).top.p / 1e6, fmt: v => FX(v, 3) + ' MPa' },
    { id: 'psitop', label: 'ψ at the top', unit: 'MPa', value: s => M(s).top.psi / 1e6, fmt: v => FX(v, 3) + ' MPa' },
    { id: 'visc', label: 'Viscous share of drop', unit: '%', value: s => 100 * M(s).vshare, fmt: v => FX(v, 1) + ' %' },
    { id: 'Re', label: 'Re in a conduit', unit: '', value: s => M(s).Re, fmt: v => Viz.fmt(v, { sig: 3 }) },
    { id: 'cap', label: 'Capillary rise', unit: 'm', value: s => M(s).cap, fmt: v => FX(v, 2) + ' m' },
    { id: 'hmax', label: 'Tallest before limit', unit: 'm', value: s => M(s).hmax, fmt: v => FX(v, 1) + ' m' },
    { id: 'turg', label: 'Leaf turgor $p$', unit: 'MPa', value: s => M(s).turg / 1e6, fmt: v => FX(v, 3) + ' MPa', optional: true },
    { id: 'share', label: 'Plates\' share (phloem)', unit: '%', value: s => (M(s).sv ? 100 * M(s).sv.plate_share : NaN), fmt: v => FX(v, 1) + ' %', optional: true }
  ],
  terms: { title: 'ψ at the station you pick', unit: 'MPa', items: [
    { id: 'p', label: 'pressure $p$', color: C('orange'), value: s => M(s).sel.p / 1e6 },
    { id: 'osm', label: 'solutes $-R_uTc$', color: C('teal'), value: s => M(s).sel.osm / 1e6 },
    { id: 'grav', label: 'height $\\rho gz$', color: C('amber'), value: s => M(s).sel.grav / 1e6 }
  ], total: { label: 'ψ' } },
  inspect: s => inspectHtml(s),
  inspectTitle: 'Inspector · the station you picked',
  notes: s => notesHtml(s),
  stage: {
    animate: true,
    rows: [1],
    views: [
      { id: 'tree', row: 0, flex: 1.15, title: s => treeTitle(s) },
      { id: 'profile', row: 0, flex: 1, title: s => profTitle(s) }
    ],
    setup(g) { APP = g.app; },
    step(g, s, dt) { PHASE = (PHASE + dt * (s.mode === 'phloem' ? 0.12 : 0.1 * Math.min(3, s.u))) % 1; },
    draw(g, s) {
      APP = g.app || APP;
      const n = M(s);
      drawTree(g.view('tree'), s, n);
      drawProfile(g.view('profile'), s, n);
    },
    onPointer(g, ev, s) {
      if (ev.type !== 'pointerdown') return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.viewId === 'profile' && VW.prof) {
        const P = VW.prof;
        if (s.mode === 'phloem') { g.app.set({ N: Math.max(1, Math.min(100, Math.round(Math.pow(10, P.ix(X))))) }); return true; }
        const z = P.iy(Y);
        if (z < 0) g.app.set({ st: 'soil' });
        else if (z >= s.H * 0.995) g.app.set({ st: 'top' });
        else g.app.set({ st: 'z', zf: Math.max(0.01, Math.round(100 * z / s.H) / 100) });
        return true;
      }
      if (ev.viewId === 'tree' && s.mode === 'xylem' && VW.stations.length) {
        let best = null, bd = 1e9;
        VW.stations.forEach(q => { const d = Math.hypot(q.x - X, q.y - Y); if (d < bd) { bd = d; best = q; } });
        if (best && bd < 36) { g.app.set({ st: best.id }); return true; }
        if (VW.tree) { const z = VW.tree.iy(Y); if (z > 0 && z < s.H) { g.app.set({ st: 'z', zf: Math.round(100 * z / s.H) / 100 }); return true; } }
      }
      return false;
    }
  },
  explore: {
    intro: 'Click a station on the tree or a height on the profile; the bars show its three terms.',
    controls: ['H', 'u', 'a', 'ps', 'st', 'cl', 'zf', 'N'],
    readouts: ['ptop', 'psitop', 'visc', 'Re', 'cap', 'hmax', 'turg', 'share'],
    callouts: [{ kind: 'try', html: 'Predict first: if you halve the conduit radius at 1 mm/s, does the tallest possible tree shrink a little or a lot? Then drag $a$ from 25 to 12.5 µm and read the readout.' }]
  },
  explain: { html: s => explainHtml(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
</script>
