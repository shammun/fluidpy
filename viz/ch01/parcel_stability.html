  if (M.ts.kind !== 'none' && v.w > 240 && M.ts.seconds < M.tEnd) {
    const lab = M.ts.kind === 'period' ? 'period' : 'e-fold';
    P.text(T(M.ts.seconds), P.ylim[1], lab, { dx: 4, dy: 9, size: 12, color: Viz.color('muted'), align: 'left' });
  }
  if (N.off && v.w > 200 && s.u < 1 - 1e-9) P.text(T(R.tStop), Zd(N.z), 'stopped at the column edge', { dx: -8, dy: N.z > 0 ? 14 : -14, size: 12, align: 'right', color: Viz.color('rose'), weight: 650 });
  if (s.u >= 1 - 1e-9 && v.w > 220) {
    let msg;
    if (M.code === 1) msg = Viz.fmt(M.tEnd / M.ts.seconds, { sig: 2 }) + ' oscillations, period ' + fmtT(M.ts.seconds, M.medium) + ' · undamped here (real fluids damp it)';
    else if (M.code === 0) msg = 'no force at any height: the parcel stays at ζ₀';
    else msg = R.stopped ? 'ran away: |ζ| reached ' + fmtZ(M.cap, M.medium) + ' after ' + fmtT(R.tStop, M.medium) : 'ran away: ζ grew to ' + fmtZ(R.zs[R.zs.length - 1], M.medium) + ' in ' + fmtT(M.tEnd, M.medium);
    P.text((P.xlim[0] + P.xlim[1]) / 2, P.ylim[0], msg, { dy: -12, align: 'center', weight: 700, size: 12.5, color: Viz.color('accent') });
  }
}

/* ===================================================================================================
   TEXT BLOCKS reused by notes, explain, status
   =================================================================================================== */
function convTable(s, M) {
  const ok = M.code === 1 ? '<span class="ps-ok">✓ stable</span>' : M.code === 0 ? '<span class="ps-amber">= neutral</span>' : '<span class="ps-no">✗ unstable</span>';
  // one small table per convention: two pager items, so each fits a 360x640 page
  const H = ['convention', 'stable if', 'Γ vs Γa now'];
  return '<div class="ps-conv">' + Viz.work.table(H, [['<b>Kundu</b><br>Γ = dT/dz', 'Γ > Γa', M.bareK + ' ' + ok]], s.conv === 'kundu' ? 0 : -1) + '</div>' +
    '<div class="ps-conv">' + Viz.work.table(H, [['<b>meteorology</b><br>Γ = −dT/dz', 'Γ < Γa', M.bareM + ' ' + ok]], s.conv === 'kundu' ? -1 : 0) + '</div>';
}
function densityTable(s, M) {
  const ok = M.code === 1 ? '<span class="ps-ok">✓ stable</span>' : M.code === 0 ? '<span class="ps-amber">= neutral</span>' : '<span class="ps-no">✗ unstable</span>';
  return Viz.work.table(['form', 'value', 'stable if', 'now'], [
    ['(1.29) $N^2$', f3(M.N2, '1/s²'), '$N^2 > 0$', ok],
    ['(1.35) $d\\rho_\\theta/dz$', f3(M.drhoth, 'kg/m⁴'), '$< 0$', ok]
  ], -1);
}
function regimeText(s, M) {
  const ts = M.ts, md = M.medium;
  if (md === 'atm' && s.inv && M.zo >= MIX_TOP && M.zo < INV_TOP)
    return 'Inside the inversion the temperature rises with height: very stable (' + tsText(M) + '). Smoke and pollution trapped below cannot mix up through it.';
  if (md === 'atm' && s.inv && M.zo < MIX_TOP)
    return 'The mixed layer follows the dry adiabat, so a parcel is at home at every height: this is the well-mixed boundary layer. Released from rest it stays put.';
  if (md !== 'atm') {
    if (M.code === 1) return 'The water gets denser downward faster than the parcel\'s own density changes, so a lifted parcel is heavier than its new surroundings and sinks back, overshoots and oscillates (' + tsText(M) + ').';
    if (M.code === 0) return 'The parcel and its surroundings change density at the same rate: no restoring force, the parcel stays where it is put.';
    return 'Dense water sits on light water: a lifted parcel is lighter than its new surroundings and accelerates away (' + tsText(M) + '). The column overturns.';
  }
  if (M.code === 1 && M.G >= 0) return 'Your environment does not cool with height at all (dT/dz = ' + Viz.fmt(M.G * 1e3, { sig: 3 }) + ' K/km) while a rising parcel cools 9.76 K/km, so a lifted parcel ends up much colder and denser than the air around it. It sinks back, overshoots and oscillates, ' + tsText(M) + ': a strongly stable layer. Real air damps the oscillation by mixing.';
  if (M.code === 1) return 'Your environment cools more slowly than a rising parcel (' + Viz.fmt(-M.G * 1e3, { sig: 3 }) + ' vs 9.76 K/km in the meteorology sign), so a lifted parcel ends up colder and denser than the air around it. It sinks back, overshoots and oscillates, ' + tsText(M) + ': a buoyancy (Brunt–Väisälä) oscillation. Real air damps it by mixing.';
  if (M.code === 0) return 'The environment lies exactly on the dry adiabat: a parcel is at home at every height, like the well-mixed boundary layer on a sunny afternoon.';
  return 'The environment cools faster than the parcel (' + Viz.fmt(-M.G * 1e3, { sig: 3 }) + ' vs 9.76 K/km in the meteorology sign): a lifted parcel stays warmer and lighter than its surroundings and accelerates away, ' + tsText(M) + '. That is convection: thermals and towering cumulus.';
}

  derivations: [
    { id: 'D18', title: 'The parcel equation and $N^2$', short: 'D18 · N²', ref: 'Eq. (1.29)', view: 'zeta',
      goal: 'Find how a small blob of fluid moves after it is pushed a little way up in a fluid at rest, and the one number that decides whether it comes back.',
      start: { tex: '\\rho_p V\\,\\frac{d^2\\zeta}{dt^2} = \\sum F_z', plain: "Newton's second law for a parcel of volume V and density ρ_p, displaced by ζ from its rest height z_o." },
      plan: ['List the forces: weight and buoyancy.', 'Write the densities of the parcel and of its new surroundings to first order in ζ.', 'Keep first-order terms only.', 'Name the coefficient $N^2$ and solve.'],
      uses: ["Newton's second law", 'buoyancy (Archimedes)', 'first-order Taylor expansion', 'linear 2nd-order ODE', '$\\sqrt{\\text{negative}}$'],
      set: { medium: 'ocean', drhodz: -0.01, compress: false, zeta0: 50, u: 0 },
      steps: [
        { did: "Name the parcel's two vertical forces", tex: '\\sum F_z = -\\rho_p V g + F_b', why: 'Its weight points down; the pressure of the surrounding fluid gives a net force F_b. Nothing else acts on a frictionless parcel.', plain: 'Weight down, buoyancy up.' },
        { did: 'Use buoyancy at the new height', tex: 'F_b = \\rho(z_o + \\zeta)\\,V g', why: "The parcel's pressure matches its surroundings, so the net push is the weight of the environment fluid it displaces at z_o + ζ (Archimedes).", plain: 'The parcel is buoyed by the fluid it pushes aside at its new height.', set: { u: 0 } },
        { did: "Insert both forces into Newton's law", tex: '\\rho_p V\\,\\frac{d^2\\zeta}{dt^2} = -\\rho_p V g + \\rho(z_o+\\zeta)\\,V g', why: 'The start says mass × acceleration equals the sum of the forces; steps 1 and 2 give that sum term by term.', plain: 'The parcel accelerates according to the difference between buoyancy and weight.' },
        { did: "Divide by the parcel's mass $\\rho_p V$", tex: '\\frac{d^2\\zeta}{dt^2} = -g\\,\\frac{\\rho_p - \\rho(z_o+\\zeta)}{\\rho_p}', why: 'ρ_pV ≠ 0, so we may divide both sides by it; collecting the g terms leaves the acceleration alone on the left.', plain: 'A parcel heavier than its surroundings accelerates down.' },
        { did: "Expand the parcel's density along its path", tex: '\\rho_p = \\rho(z_o) + \\frac{d\\rho_a}{dz}\\,\\zeta', why: 'First-order Taylor. The parcel starts with the environment density ρ(z_o) and changes adiabatically at the isentropic rate dρ_a/dz as it meets new pressure.', plain: "The parcel's density changes at its own rate." },
        { did: "Expand the environment's density", tex: '\\rho(z_o+\\zeta) = \\rho(z_o) + \\frac{d\\rho}{dz}\\,\\zeta', why: "First-order Taylor of the static background profile; dρ/dz is the environment's gradient.", plain: 'The surroundings have their own, different rate.' },
        { did: 'Subtract the two', tex: '\\rho_p - \\rho(z_o+\\zeta) = \\Big(\\frac{d\\rho_a}{dz} - \\frac{d\\rho}{dz}\\Big)\\zeta', why: 'ρ(z_o) cancels because parcel and environment matched at rest; what remains is first order in ζ.', plain: 'The density difference grows in proportion to the displacement.',
          live: s => { const M = model(s); if (M.medium === 'atm') return '\\text{switch to ocean or lab to see numbers}'; return '(' + tn(M.drhoa) + ' - (' + tn(M.drho) + '))\\times' + tn(M.zeta0) + ' = ' + tn((M.drhoa - M.drho) * M.zeta0) + '\\ \\text{kg/m}^3'; } },
        { did: 'Keep the leading term in the denominator', tex: '\\rho_p \\approx \\rho(z_o)', why: 'The numerator is already proportional to ζ; the correction (dρ_a/dz)ζ below would only add terms of order ζ², which we drop for a small displacement.', plain: "For the inertia, the parcel's density is its starting density." },
        { did: 'Substitute steps 7 and 8 into step 4', tex: '\\frac{d^2\\zeta}{dt^2} = -\\frac{g}{\\rho(z_o)}\\Big(\\frac{d\\rho_a}{dz} - \\frac{d\\rho}{dz}\\Big)\\zeta', why: 'Replace the density difference and the denominator.', plain: 'The acceleration is proportional to the displacement: a spring.' },
        { did: 'Swap the bracket, move it left', tex: '\\frac{d^2\\zeta}{dt^2} - \\frac{g}{\\rho(z_o)}\\Big(\\frac{d\\rho}{dz} - \\frac{d\\rho_a}{dz}\\Big)\\zeta = 0', why: '−(a − b) = (b − a); then subtract the right side from both sides. This is the book\'s form.', plain: 'The parcel equation of §1.10.' },
        { did: 'Name the coefficient $N^2$', tex: 'N^2 \\equiv -\\frac{g}{\\rho(z_o)}\\Big(\\frac{d\\rho}{dz} - \\frac{d\\rho_a}{dz}\\Big)', why: 'This is the book\'s definition of $N^2$ (1.29), the line above, chosen so the equation reads $\\zeta\'\' + N^2\\zeta = 0$, the oscillator form.', plain: 'One number collects gravity and the two density gradients.',
          live: s => { const M = model(s); if (M.medium === 'atm') return 'N^2 = \\tfrac{g}{T}(\\Gamma-\\Gamma_a) = ' + tn(M.N2) + '\\ \\text{s}^{-2}'; return 'N^2 = -\\tfrac{9.807}{' + tn(M.rho0, 4) + '}(' + tn(M.drho) + ' - (' + tn(M.drhoa) + ')) = ' + tn(M.N2) + '\\ \\text{s}^{-2}'; } },
        { did: 'Try an exponential solution', tex: '\\zeta = e^{\\lambda t}\\ \\Rightarrow\\ \\lambda^2 + N^2 = 0', why: 'For a linear equation with constant coefficients e^{λt} turns derivatives into powers of λ; e^{λt} ≠ 0 divides out.', plain: 'The motion is set by the roots λ = ±√(−N²).' },
        { did: 'Release from rest when $N^2 \\neq 0$', tex: '\\zeta(t) = \\begin{cases} \\zeta_0\\cos Nt & N^2 > 0\\\\ \\zeta_0\\cosh\\sqrt{-N^2}\\,t & N^2 < 0 \\end{cases}', why: 'ζ(0) = ζ₀ and ζ′(0) = 0 pick the even combination of e^{±λt}: cos for imaginary λ, cosh for real λ.', plain: 'Oscillate or run away.', set: { u: 0 }, play: true,
          watch: 'In the thermocline preset the grey dashed curve has period 2π/N = 10.7 min.' },
        { did: 'Treat the double root $N^2 = 0$', tex: '\\zeta = A + Bt,\\quad \\zeta\'(0) = B = 0\\ \\Rightarrow\\ \\zeta = \\zeta_0', why: 'λ = 0 is a double root, so the second solution is t, not another exponential; release from rest removes it.', plain: 'A neutral parcel stays where it is put.',

      result: { tex: '\\frac{d^2\\zeta}{dt^2} + N^2\\zeta = 0,\\quad N^2 = -\\frac{g}{\\rho(z_o)}\\Big(\\frac{d\\rho}{dz} - \\frac{d\\rho_a}{dz}\\Big)', plain: "A displaced parcel is a harmonic oscillator with squared frequency N², positive when the environment's density falls with height faster than the parcel's own." },

    { id: 'D19', title: 'The adiabatic lapse rate for any fluid', short: 'D19 · Γa', ref: 'Eq. (1.30)', view: 'profile',
      goal: 'Find how fast the temperature of a parcel changes as it rises isentropically through a fluid in hydrostatic balance, for any fluid, then read it in both sign conventions.',
      start: { tex: 'T\\,ds = dh - v\\,dp,\\quad ds = 0,\\quad \\frac{dp}{dz} = -\\rho g', plain: "The parcel's entropy stays constant, and the pressure it feels is the hydrostatic pressure of its surroundings." },
      plan: ['Write dh for the isentropic parcel.', 'Expand dh in T and p: this brings in C_p and an unknown $(\\partial h/\\partial p)_T$.', 'Find that unknown with the Gibbs free energy, a Maxwell relation and α.', 'Divide by dz and use hydrostatics.'],
      uses: ['Gibbs $T\\,ds = dh - v\\,dp$ (1.18)', '$C_p \\equiv (\\partial h/\\partial T)_p$ (1.14)', '$\\alpha \\equiv -\\tfrac{1}{\\rho}(\\partial\\rho/\\partial T)_p$ (1.20)', 'chain rule in two variables', 'Maxwell relation', '$dp/dz = -\\rho g$ (1.8)'],
      set: { medium: 'atm', dTdz: -6.5, conv: 'kundu', showTheta: false, inv: false, u: 0 },
      steps: [
        { did: 'Set $ds = 0$ in the Gibbs relation', tex: 'dh = v\\,dp', why: 'No heat and no friction, so the entropy is constant. We use the enthalpy form because it contains dp, which hydrostatics will supply.', plain: "The parcel's enthalpy changes only through the pressure it meets." },
        { did: 'Expand $dh$ in T and p', tex: 'dh = \\Big(\\frac{\\partial h}{\\partial T}\\Big)_p dT + \\Big(\\frac{\\partial h}{\\partial p}\\Big)_T dp', why: 'Two properties fix the state, so h = h(T, p); the chain rule gives its differential. We want dT to appear.', plain: 'h changes because T changes and because p changes.' },
        { did: 'Recognise $C_p$', tex: 'dh = C_p\\,dT + \\Big(\\frac{\\partial h}{\\partial p}\\Big)_T dp', why: 'The definition $C_p \\equiv (\\partial h/\\partial T)_p$ (1.14). One coefficient is now a known property; the other still needs work.', plain: 'The first part is the specific heat times the temperature change.' },
        { did: 'Gibbs relation at fixed T', tex: '\\Big(\\frac{\\partial h}{\\partial p}\\Big)_T = T\\Big(\\frac{\\partial s}{\\partial p}\\Big)_T + v', why: 'dh = T ds + v dp holds for any change; take a change at constant T and divide by dp. This trades the unknown for an entropy derivative.', plain: 'How h depends on p at fixed T involves how s does.' },
        { did: 'Introduce the Gibbs free energy', tex: 'g \\equiv h - Ts,\\qquad dg = v\\,dp - s\\,dT', why: 'dg = dh − T ds − s dT (product rule) and dh = T ds + v dp; the T ds terms cancel. Its natural variables are exactly p and T.', plain: 'A helper state function whose changes involve only dp and dT.' },
        { did: 'Read off its partial derivatives', tex: '\\Big(\\frac{\\partial g}{\\partial p}\\Big)_T = v,\\qquad \\Big(\\frac{\\partial g}{\\partial T}\\Big)_p = -s', why: 'Compare dg = v dp − s dT term by term with the chain rule dg = (∂g/∂p)_T dp + (∂g/∂T)_p dT.', plain: 'v and −s are the slopes of g.' },
        { did: 'Equate the mixed second derivatives', tex: '\\Big(\\frac{\\partial v}{\\partial T}\\Big)_p = -\\Big(\\frac{\\partial s}{\\partial p}\\Big)_T', why: 'g is smooth, so ∂²g/∂T∂p = ∂²g/∂p∂T. This Maxwell relation turns an entropy derivative into a measurable one.', plain: 'How entropy changes with pressure is set by thermal expansion.' },
        { did: 'Express $(\\partial v/\\partial T)_p$ with α', tex: '\\Big(\\frac{\\partial v}{\\partial T}\\Big)_p = v\\,\\alpha', why: 'v = 1/ρ gives (∂v/∂T)_p = −(1/ρ²)(∂ρ/∂T)_p, and $\\alpha \\equiv -\\tfrac{1}{\\rho}(\\partial\\rho/\\partial T)_p$ (1.20) gives (∂ρ/∂T)_p = −ρα, so the result is α/ρ = vα.', plain: 'Heating at fixed pressure swells unit mass by vα per kelvin.' },
        { did: 'Insert into the Maxwell relation', tex: '\\Big(\\frac{\\partial s}{\\partial p}\\Big)_T = -\\,v\\,\\alpha', why: 'Steps 7 and 8. The sign matters: squeezing at fixed T lowers the entropy when α > 0.', plain: 'Entropy falls with pressure at the rate vα.' },
        { did: 'Complete $(\\partial h/\\partial p)_T$', tex: '\\Big(\\frac{\\partial h}{\\partial p}\\Big)_T = v\\,(1 - \\alpha T)', why: 'Substitute step 9 into step 4: −Tvα + v.', plain: 'The pressure part of dh, now in measurable properties.' },
        { did: 'Equate the two expressions for $dh$', tex: 'C_p\\,dT + v(1 - \\alpha T)\\,dp = v\\,dp', why: 'Step 3 (with step 10) and step 1 describe the same change of the same parcel.', plain: 'Two bookkeepings of one enthalpy change.' },
        { did: 'Subtract $v\\,dp$ from both sides', tex: 'C_p\\,dT = v\\,\\alpha\\,T\\,dp', why: 'v(1 − αT)dp − v dp = −vαT dp; move it across. The temperature change is now tied to the pressure change alone.', plain: 'A parcel warms when compressed and cools when the pressure drops (α > 0).' },
        { did: 'Divide by $dz$ along the path', tex: 'C_p\\,\\frac{dT_a}{dz} = v\\,\\alpha\\,T\\,\\frac{dp}{dz}', why: 'Both sides are changes along the vertical path; dividing by dz turns them into rates. The subscript a marks the adiabatic parcel.', plain: 'Temperature rate per metre ↔ pressure rate per metre.' },
        { did: 'Use hydrostatics with $v = 1/\\rho$', tex: 'C_p\\,\\frac{dT_a}{dz} = -\\,\\alpha\\,T\\,g', why: "The parcel's pressure is the environment's, $dp/dz = -\\rho g$ (1.8); at the release height the parcel's v equals 1/ρ, so vρ = 1.", plain: 'The pressure drop with height sets the cooling.', highlight: ['readout:ref'] },
        { did: 'Divide by $C_p$', tex: '\\frac{dT_a}{dz} \\equiv \\Gamma_a = -\\,\\frac{g\\,\\alpha\\,T}{C_p}', why: 'C_p > 0. This is $\\Gamma_a = -g\\alpha T/C_p$ (1.30), derived without any perfect-gas relation.', plain: 'The adiabatic lapse rate of any fluid.',
          live: s => { const M = model(s), T = M.medium === 'atm' ? M.T0 : 288.15; return '\\begin{aligned}\\alpha T &= (1/' + tn(T, 5) + ')\\times' + tn(T, 5) + ' = 1\\\\ \\Gamma_a &= -9.807/1004.7 = ' + tn(GA) + '\\ \\text{K/m}\\end{aligned}'; } },
        { did: 'Specialise to a perfect gas', tex: '\\Gamma_a = -\\,\\frac{g}{C_p} = -9.76\\ \\text{K/km}', why: '$\\alpha = 1/T$ for a perfect gas (1.28), so αT = 1; g = 9.807 m/s² and C_p = 1004.7 J/(kg K).', plain: 'Dry air cools 9.76 K for every kilometre it rises.', watch: "The dashed purple adiabat's slope is exactly this." }

      result: { tex: '\\Gamma_a = \\frac{dT_a}{dz} = -\\frac{g\\alpha T}{C_p};\\quad \\text{dry air: } -\\frac{g}{C_p} = -9.76\\ \\text{K/km}', plain: 'Kundu (Γ ≡ dT/dz): Γa = −9.76 K/km, stable when Γ > Γa (−6.5 > −9.76). Meteorology (Γ ≡ −dT/dz): Γa = +9.76 K/km, stable when Γ < Γa (6.5 < 9.76). Multiplying by −1 flips the inequality; the verdict is the same.' },
      interpret: s => { const M = model(s); if (M.medium !== 'atm') return 'Switch to the atmosphere to compare your lapse rate with Γa.'; return 'Your environment: $dT/dz = ' + tn(M.G * 1e3) + '$ vs $\\Gamma_a = ' + tn(GA * 1e3) + '$ K/km (Kundu) ⇔ $\\Gamma_{\\rm met} = ' + tn(-M.G * 1e3) + '$ vs $+' + tn(-GA * 1e3) + '$ K/km (meteorology) → ' + regimeWord(M.code) + ': “' + M.stab.text + '”.'; },

    rows.push({ name: 'N² from lapse (288.15 K, −6.5)', js: N2FromLapse(288.15, -0.0065), py: 'ch01.brunt_vaisala_sq_from_lapse(288.15, -0.0065)', rtol: 1e-12 });
    rows.push({ name: 'N² density, thermocline', js: N2Density(1025, -0.01, 0), py: 'ch01.brunt_vaisala_sq(1025.0, -0.01, 0.0)', rtol: 1e-12 });
    rows.push({ name: 'N² density, compressible', js: N2Density(1025, -0.01, isentropicDensityGradient(1025, 1500)), py: 'ch01.brunt_vaisala_sq(1025.0, -0.01, ch01.isentropic_density_gradient(1025.0, 1500.0))', rtol: 1e-12 });
    rows.push({ name: 'N² from θ', js: N2FromTheta(300, 0.003), py: 'ch01.brunt_vaisala_sq_from_theta(300.0, 0.003)', rtol: 1e-12 });
    rows.push({ name: 'period N² = 1e-4 [s]', js: stabilityTimescale(1e-4).seconds, py: 'ch01.stability_timescale(1e-4)[1]', rtol: 1e-12 });
    rows.push({ name: 'e-fold N² = −1e-4 [s]', js: stabilityTimescale(-1e-4).seconds, py: 'ch01.stability_timescale(-1e-4)[1]', rtol: 1e-12 });
    rows.push({ name: 'ζ linear stable [m]', js: parcelDisplacement(300, 100, 1.1097e-4, 0), py: 'ch01.parcel_displacement(300.0, 100.0, 1.1097e-4)', rtol: 1e-12 });
    rows.push({ name: 'ζ linear unstable [m]', js: parcelDisplacement(200, 100, -7.6e-5, 0), py: 'ch01.parcel_displacement(200.0, 100.0, -7.6e-5)', rtol: 1e-12 });
    rows.push({ name: 'accel atm ζ=100 [m/s²]', js: parcelAccelAtm(100, 288.15, -0.0065), py: 'ch01.parcel_acceleration_atmosphere(100.0, 288.15, -0.0065)', rtol: 1e-12 });
    rows.push({ name: 'ζ nonlinear atm t=300 s [m]', js: parcelOdeAtmosphere(300, 50, 288.15, -0.0065), py: 'ch01.parcel_ode_atmosphere(300.0, 50.0, 288.15, -0.0065)', rtol: 1e-6 });
    rows.push({ name: 'ζ runaway before cap t=300 s [m]', js: parcelOdeAtmosphere(300, 100, 288.15, -0.012, CP_AIR, G0, 0, 1500), py: 'ch01.parcel_ode_atmosphere(300.0, 100.0, 288.15, -0.012, zeta_max=1500.0)', rtol: 1e-6 });
    rows.push({ name: 'runaway capped: NaN at t=1200 s', js: isNaN(parcelOdeAtmosphere(1200, 100, 288.15, -0.012, CP_AIR, G0, 0, 1500)) ? 1 : 0, py: 'np.isnan(ch01.parcel_ode_atmosphere(1200.0, 100.0, 288.15, -0.012, zeta_max=1500.0))', rtol: 0, atol: 0 });
    rows.push({ name: 'ζ nonlinear ocean t=200 s [m]', js: parcelOdeGradients(200, 5, 1025, -0.01, 0), py: 'ch01.parcel_ode_from_gradients(200.0, 5.0, 1025.0, -0.01, 0.0)', rtol: 1e-6 });
    rows.push({ name: 'θ(250 K, 500 hPa) [K]', js: potentialTemperature(250, 5e4), py: 'ch01.potential_temperature(250.0, 50000.0)', rtol: 1e-12 });
    rows.push({ name: 'dθ/dz (288.15 K, −6.5, 900 hPa)', js: thetaGradient(288.15, -0.0065, potentialTemperature(288.15, 9e4)), py: 'ch01.potential_temperature_gradient(288.15, -0.0065, p=90000.0)', rtol: 1e-12 });
    rows.push({ name: 'p linear lapse z=1500 m [Pa]', js: linearLapsePressure(1500, P_ATM, 288.15, -0.0065), py: 'ch01.linear_lapse_pressure(1500.0, 101325.0, 288.15, -0.0065)', rtol: 1e-12 });
    rows.push({ name: 'p isothermal z=1500 m [Pa]', js: linearLapsePressure(1500, P_ATM, 250, 0), py: 'ch01.linear_lapse_pressure(1500.0, 101325.0, 250.0, 0.0)', rtol: 1e-12 });
    rows.push({ name: 'dρa/dz seawater [kg/m⁴]', js: isentropicDensityGradient(1025, 1500), py: 'ch01.isentropic_density_gradient(1025.0, 1500.0)', rtol: 1e-12 });
    rows.push({ name: 'ocean criterion (1.35)', js: oceanCriterion(-0.01, 1025, 1500), py: 'ch01.ocean_potential_density_gradient(-0.01, 1025.0, 1500.0)', rtol: 1e-12 });
    rows.push({ name: 'seawater ρ(20 °C, 35) [kg/m³]', js: seawaterLinear(293.15, 35), py: 'ch01.seawater_density_linear(293.15, 35.0)', rtol: 1e-12 });
    rows.push({ name: 'BL profile z=500 m (neutral mixed)', js: blProfile(500, 288.15, 800, 200, 0.01, GA, -0.0065), py: 'ch01.synthetic_boundary_layer_profile(500.0, upper_dT_dz=-0.0065)', rtol: 1e-12 });
    rows.push({ name: 'BL profile z=900 m (inversion)', js: blProfile(900, 288.15, 800, 200, 0.01, GA, -0.0065), py: 'ch01.synthetic_boundary_layer_profile(900.0, upper_dT_dz=-0.0065)', rtol: 1e-12 });
    rows.push({ name: 'BL profile z=2000 m (above)', js: blProfile(2000, 288.15, 800, 200, 0.01, GA, -0.0065), py: 'ch01.synthetic_boundary_layer_profile(2000.0, upper_dT_dz=-0.0065)', rtol: 1e-12 });
    rows.push({ name: 'BL mixed-layer N² is exactly 0', js: N2FromLapse(283, GA), py: 'ch01.brunt_vaisala_sq_from_lapse(283.0, ch01.MIXED_LAYER_DT_DZ)', rtol: 0, atol: 1e-18 });
    // invariants: the verdict never depends on the convention and matches the sign of N² outside the round-off band
    let same = 1, sign = 1;
    for (let k = -1500; k <= 1000; k++) {
      const x = k * 1e-5, a = lapseStability(x, null, 'kundu'), b = lapseStability(x, null, 'meteorology');
      if (a.code !== b.code || a.margin !== b.margin) same = 0;
      const n2 = N2FromLapse(288.15, x);
      if (Math.abs(a.margin) > 1e-9 && a.code !== Math.sign(n2)) sign = 0;
    }
    rows.push({ name: 'verdict convention-free (2501 lapse rates)', js: same, expect: 1, atol: 0 });
    rows.push({ name: 'code = sign N² (2501 lapse rates)', js: sign, expect: 1, atol: 0 });
    const M0 = model(Object.assign({}, DEFAULTS, { dTdz: -12 }));
    rows.push({ name: 'stage runaway run stops, no overflow', js: M0.run.stopped && M0.run.zs.every(isFinite) ? 1 : 0, expect: 1, atol: 0 });
    return rows;
  }
});
