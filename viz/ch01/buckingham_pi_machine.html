    if (w1 < 40 || h1 < 26) continue;
    const score = Math.abs(Math.log((w1 / h1) / 2.1)) + (w1 < 120 ? 0.4 : 0);
    if (score < best) { best = score; cols = c; }
  }
  const rows = Math.ceil(n / cols);
  const cw = (W - gap * (cols + 1)) / cols, ch = Math.min(92, (H - gap * (rows + 1)) / rows);
  const units = M.natural ? 'natural' : (s.units === 'natural' ? 'SI' : s.units);
  const singular = M.err && M.err.kind === 'singular';
  const full = cw >= 128 && ch >= 50;
  list.forEach((q, i) => {
    const x = gap + (i % cols) * (cw + gap), y = gap + Math.floor(i / cols) * (ch + gap);
    const off = q.id === M.drop, isRep = M.rep.indexOf(q.id) >= 0 && !off, isSol = q.id === M.P.solution;
    const repC = singular ? Viz.color('rose') : Viz.color('accent');
    ctx.save(); if (off) ctx.globalAlpha = 0.42;
    rrect(ctx, x, y, cw, ch, 9);
    ctx.fillStyle = isRep ? Viz.alpha(repC, 0.1) : Viz.color('card'); ctx.fill();
    ctx.setLineDash(off ? [4, 3] : []); ctx.lineWidth = isRep ? 2.2 : 1; ctx.strokeStyle = isRep ? repC : Viz.color('border'); ctx.stroke(); ctx.setLineDash([]);
    const px = ch > 70 ? 18 : 16, tx = x + 8;

    if (isSol) text(ctx, '★', tx + symW + 2, y + 10, 12, Viz.color('rose'), 'left', 700);
    const bw = full ? Math.min(58, cw * 0.36) : Math.min(46, cw - symW - (isSol ? 30 : 22)), textW = cw - bw - 16;
    ctx.save(); ctx.beginPath(); ctx.rect(tx, y, textW, ch); ctx.clip();
    if (full) {
      text(ctx, off ? 'removed' : q.name, tx, y + px + 17, 12, off ? Viz.color('rose') : Viz.color('muted'));
      if (ch > 62) text(ctx, off ? '' : cnum(M.cur[q.id]) + ' ' + unitStr(q, units), tx, y + px + 34, 12, Viz.color('text-soft'), 'left', 400, true);
    } else if (ch >= 44) text(ctx, off ? 'off' : cnum(M.cur[q.id], 2), tx, y + ch - 10, 12, off ? Viz.color('rose') : Viz.color('text-soft'), 'left', 400, true);
    ctx.restore();
    // exponent bars (height = exponent; colour = base dimension)
    if (bw < 22) { ctx.restore(); HIT.vars.push({ x, y, w: cw, h: ch, id: q.id }); return; }
    const bx = x + cw - bw - 6, labels = full && ch > 58, mid = y + (labels ? ch * 0.46 : ch * 0.5), unit = Math.min(7, (ch - (labels ? 30 : 12)) / 6), step = bw / 4;
    ctx.strokeStyle = Viz.color('border'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx, mid); ctx.lineTo(bx + bw, mid); ctx.stroke();
    BASIS.forEach((b, j) => {
      const e = q.dim[j].valueOf(), hh = -e * unit, cx = bx + step * j + step / 2, bar = Math.min(8, step - 2);
      if (e !== 0) { ctx.fillStyle = C[b]; ctx.fillRect(cx - bar / 2, Math.min(mid, mid + hh), bar, Math.abs(hh)); }
      if (labels) text(ctx, b, cx, y + ch - 9, 12, e !== 0 ? C[b] : Viz.alpha(Viz.color('muted'), 0.6), 'center', 600);
    });
    ctx.restore();
    HIT.vars.push({ x, y, w: cw, h: ch, id: q.id });
  });
}

function drawMatrix(v, s, M, app) {
  v.clear();
  const ctx = v.ctx, W = v.w, H = v.h, C = DIMC(), pad = 6, n = M.n, m = M.m;
  if (W < 60 || H < 60) return;
  const sc = scanState(s, M); SCAN_N = sc.N;
  const units = M.natural ? 'natural' : (s.units === 'natural' ? 'SI' : s.units);
  const lw = 30, cw = Math.min(78, (W - 2 * pad - lw) / n), tw = lw + n * cw, x0 = Math.max(pad, (W - tw) / 2);
  const narrow = cw < 52;
  const base = H - 2 * pad, hh = H < 130 ? 22 : 26;
  let vh = 22, fh = 24, mapH = H > 200 ? Math.min(40, H * 0.16) : 0;
  if (base - hh - m * 22 - vh - fh - mapH < 0) mapH = 0;
  if (base - hh - m * 18 - vh - fh < 0) vh = 0;
  if (base - hh - m * 18 - vh - fh < 0) fh = 0;
  const rh = Math.max(14, Math.min(40, (base - hh - vh - fh - mapH) / m));
  const bodyH = hh + m * rh + vh + fh + mapH, y0 = pad + Math.max(0, (H - 2 * pad - bodyH) / 2);
  const colX = j => x0 + lw + j * cw, rowY = i => y0 + hh + i * rh;
  const selCol = M.minor && M.rep.length === M.r ? M.minor.cols : [], selRow = M.minor ? M.minor.rows : [];
  const singular = M.err && (M.err.kind === 'singular');
  // repeating column bands
  M.dm.names.forEach((k, j) => {
    if (M.rep.indexOf(k) < 0) return;
    rrect(ctx, colX(j) + 2, y0 + 1, cw - 4, hh + m * rh - 2, 7);
    ctx.fillStyle = Viz.alpha(singular ? Viz.color('rose') : Viz.color('accent'), 0.1); ctx.fill();
  });
  // header
  M.dm.names.forEach((k, j) => {
    const q = M.V[k], isRep = M.rep.indexOf(k) >= 0, cx = colX(j) + cw / 2;
    const runs = runsFor(q, null, narrow ? 14 : 16), w = runsW(ctx, runs);
    drawRuns(ctx, runs, cx - w / 2, y0 + hh - 9, isRep ? (singular ? Viz.color('rose') : Viz.color('accent')) : Viz.color('text'));
    if (k === M.P.solution) text(ctx, '★', cx + w / 2 + 1, y0 + 8, 12, Viz.color('rose'), 'left', 700);
  });
  ctx.strokeStyle = Viz.color('border'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, y0 + hh); ctx.lineTo(x0 + tw, y0 + hh); ctx.moveTo(x0 + lw - 2, y0 + 2); ctx.lineTo(x0 + lw - 2, y0 + hh + m * rh); ctx.stroke();
  // cells
  const sel = s.sel || {};
  M.dm.rows.forEach((b, i) => {
    const y = rowY(i), inMinor = selRow.indexOf(i) >= 0;
    text(ctx, b, x0 + lw / 2 - 2, y + rh / 2, 14, C[b], 'center', 700);
    M.dm.A[i].forEach((e, j) => {
      const x = colX(j), val = e.valueOf();
      if (val !== 0) { rrect(ctx, x + 4, y + 2, cw - 8, rh - 4, 5); ctx.fillStyle = Viz.alpha(C[b], 0.13); ctx.fill(); }
      text(ctx, e.txt(), x + cw / 2, y + rh / 2 + 1, rh > 26 && !narrow ? 15 : 13, val === 0 ? Viz.alpha(Viz.color('muted'), 0.75) : C[b], 'center', val === 0 ? 400 : 700, true);
      if (M.minor && inMinor && selCol.indexOf(j) >= 0) { ctx.lineWidth = 2; ctx.strokeStyle = singular ? Viz.color('rose') : Viz.color('accent'); rrect(ctx, x + 2, y + 1, cw - 4, rh - 2, 6); ctx.stroke(); }
      if (sel.kind === 'cell' && sel.id === M.dm.names[j] && sel.row === b) { ctx.lineWidth = 2.5; ctx.strokeStyle = Viz.color('orange'); rrect(ctx, x + 1, y, cw - 2, rh, 6); ctx.stroke(); }
    });
  });
  // scanned minor (slow-motion rank search)
  if (!sc.done && M.search.length) {
    const cur = M.search[sc.idx];
    ctx.setLineDash([5, 3]); ctx.lineWidth = 2.5; ctx.strokeStyle = Viz.color('amber');
    cur.rows.forEach(i => cur.cols.forEach(j => { rrect(ctx, colX(j) + 1, rowY(i), cw - 2, rh, 6); ctx.stroke(); }));
    ctx.setLineDash([]);
  }
  // value row (the numbers of each variable in the current units)
  const yv = y0 + hh + m * rh + vh / 2 + 1;
  if (vh) {
  text(ctx, units === 'natural' ? '=' : '#', x0 + lw / 2 - 2, yv, 12, Viz.color('muted'), 'center', 600);
  M.dm.names.forEach((k, j) => {
    const isRep = M.natural && M.rep.indexOf(k) >= 0;
    text(ctx, cnum(M.cur[k], narrow ? 2 : 3), colX(j) + cw / 2, yv, 12, isRep ? Viz.color('accent') : Viz.color('text-soft'), 'center', isRep ? 700 : 400, true);
  });
  }
  // footer: rank, count, determinant of the repeating block
  const yf = y0 + hh + m * rh + vh + fh / 2 + 2;
  let fx = x0;
  if (!fh) { /* too short: the readouts carry r and n − r */ }
  else if (!sc.done) {
    const cur = M.search[sc.idx];
    const t = 'testing ' + cur.k + '×' + cur.k + ' minor ' + (sc.idx + 1) + '/' + sc.N + ': det = ' + cur.det.txt();
    text(ctx, t, x0, yf, 13, cur.det.isZero() ? Viz.color('rose') : Viz.color('amber'), 'left', 650);
  } else {
    fx += text(ctx, 'r = ' + M.r, fx, yf, 15, Viz.color('accent'), 'left', 750) + 12;
    fx += text(ctx, 'n − r = ' + M.n + ' − ' + M.r + ' = ' + (M.n - M.r), fx, yf, 13, Viz.color('text'), 'left', 600) + 12;
    if (M.minor && W > 330) {
      const ok = !M.minor.det.isZero();
      const t = 'det(' + M.minor.cols.map(j => plain(M.V[M.dm.names[j]])).join(',') + ') = ' + M.minor.det.txt() + (ok ? ' ✓' : ' ✗');
      ctx.font = font(13, 650); const tw2 = ctx.measureText(t).width;

    }
  }
  // minor map: every minor the search visits (purple = det ≠ 0, rose = 0, grey = not tested yet)
  const mapCells = [];
  if (mapH > 0) {
    const N = sc.N, ym = y0 + hh + m * rh + vh + fh + 4, avail = Math.min(W - 2 * pad, Math.max(tw, 240)) - 62;
    const perRow = Math.max(1, Math.ceil(N / Math.max(1, Math.floor((mapH - 4) / 13))));
    const sq = Math.max(7, Math.min(16, Math.floor(avail / Math.max(perRow, Math.ceil(N / 2))) - 2));
    const cols2 = Math.max(1, Math.floor(avail / (sq + 2))), rowsN = Math.ceil(N / cols2);
    const sqq = Math.min(sq, Math.floor((mapH - 4) / Math.max(1, rowsN)) - 2);
    const mx = Math.max(pad, (W - Math.min(N, cols2) * (sqq + 2) - 62) / 2);
    const nz = M.search.filter(x => !x.det.isZero()).length;
    text(ctx, sc.done ? nz + '/' + N + ' ≠ 0' : 'minors', mx, ym + Math.min(rowsN, 3) * (sqq + 2) / 2, 12, sc.done ? Viz.color('accent') : Viz.color('muted'), 'left', 600);
    M.search.forEach((mn, i) => {
      const cx = mx + 60 + (i % cols2) * (sqq + 2), cy = ym + Math.floor(i / cols2) * (sqq + 2);
      const tested = sc.done || i <= sc.idx;
      ctx.fillStyle = !tested ? Viz.alpha(Viz.color('muted'), 0.18) : mn.det.isZero() ? Viz.alpha(Viz.color('rose'), 0.55) : Viz.color('accent');
      ctx.fillRect(cx, cy, sqq, sqq);
      if ((!sc.done && i === sc.idx) || (sel.kind === 'minor' && sel.idx === i)) { ctx.lineWidth = 2; ctx.strokeStyle = Viz.color('amber'); ctx.strokeRect(cx - 1.5, cy - 1.5, sqq + 3, sqq + 3); }
      mapCells.push({ x: cx - 1, y: cy - 1, s: sqq + 2, i });
    });
  }
  HIT.matrix = { x0, y0, lw, cw, hh, rh, m, n, mapCells };
}

function drawGroups(v, s, M) {
  v.clear(); HIT.groups = [];
  const ctx = v.ctx, W = v.w, H = v.h, pad = 8;
  if (W < 60 || H < 40) return;
  const et = errText(M);
  if (et) {
    const bw = Math.min(W - 2 * pad, 600), bx = (W - bw) / 2;
    ctx.font = font(13, 500); const words = et.d.split(' '), lines = []; let line = '';
    words.forEach(wd => { const t = line ? line + ' ' + wd : wd; if (ctx.measureText(t).width > bw - 24) { lines.push(line); line = wd; } else line = t; }); lines.push(line);
    const show = lines.slice(0, Math.max(1, Math.floor((H - 2 * pad - 44) / 18)));
    const bh = Math.min(H - 2 * pad, 44 + show.length * 18), by = (H - bh) / 2;
    rrect(ctx, bx, by, bw, bh, 12); ctx.fillStyle = Viz.alpha(Viz.color('rose'), 0.08); ctx.fill(); ctx.strokeStyle = Viz.color('rose'); ctx.lineWidth = 1.5; ctx.stroke();
    text(ctx, '⚠ ' + et.t, W / 2, by + 20, bw < 380 ? 14 : 16, Viz.color('rose'), 'center', 700);
    show.forEach((l, i) => text(ctx, l, W / 2, by + 42 + i * 18, 13, Viz.color('text-soft'), 'center', 500));
    return;
  }
  const k = M.groups.length;
  let fh = 26;
  if ((H - 2 * pad - fh) / k < 24) fh = 0;
  const twoCol = k > 1 && (H - 2 * pad - fh) / k < 22;
  const nrow = twoCol ? Math.ceil(k / 2) : k, CW = twoCol ? W / 2 : W;
  const wide = !twoCol && W >= 600, mid = !twoCol && W >= 420;
  const showAll = mid;
  const hdr = showAll && (H - 2 * pad - fh) / (k + 1) >= 26 ? 18 : 0;
  const rh = Math.max(20, Math.min(64, (H - 2 * pad - fh - hdr) / nrow));
  const px = rh >= 46 ? 16 : 14;
  const top = pad + hdr + Math.max(0, (H - 2 * pad - fh - hdr - rh * nrow) / 2);
  const units = M.natural ? 'natural' : (s.units === 'natural' ? 'SI' : s.units);
  const sysCols = showAll ? ['SI', 'cgs', 'imperial'].concat(M.natural ? ['natural'] : []) : [units];
  const valW = showAll ? Math.max(60, Math.min(96, (W * (wide ? 0.5 : 0.46)) / sysCols.length)) : Math.min(twoCol ? 76 : 120, CW * 0.3);
  const valX0 = CW - pad - valW * sysCols.length;
  const dimX = mid ? valX0 - (wide ? 104 : 70) : null;
  if (showAll && hdr) sysCols.forEach((u, c) => text(ctx, UNIT_LABEL[u], valX0 + valW * c + valW / 2, pad + 8, 12, u === units ? Viz.color('accent') : Viz.color('muted'), 'center', u === units ? 700 : 500));
  M.groups.forEach((g, i) => {
    const ox = twoCol ? (i % 2) * CW : 0, y = top + (twoCol ? Math.floor(i / 2) : i) * rh, ym = y + rh / 2, selected = s.sel && s.sel.kind === 'group' && s.sel.i === i;
    if (selected || (twoCol ? (Math.floor(i / 2) + i) % 2 === 0 : i % 2 === 0)) { rrect(ctx, ox + pad / 2, y + 1, CW - pad, rh - 2, 8); ctx.fillStyle = selected ? Viz.alpha(Viz.color('orange'), 0.12) : Viz.alpha(Viz.color('muted'), 0.06); ctx.fill(); }
    ctx.save(); ctx.translate(ox, 0);
    let x = pad + 4;
    x += text(ctx, PI_TXT(i) + ' =', x, ym, px, Viz.color('accent'), 'left', 700) + 8;
    const avail = (dimX || valX0) - x - 8;
    const stacked = rh >= fractionH(g, px);
    if (stacked && drawFraction(ctx, M, g, 0, 0, px, '', true) <= avail) drawFraction(ctx, M, g, x, ym, px, Viz.color('text'), false);
    else if (rh >= fractionH(g, 14) && drawFraction(ctx, M, g, 0, 0, 14, '', true) <= avail && px > 14) drawFraction(ctx, M, g, x, ym, 14, Viz.color('text'), false);
    else drawInline(ctx, M, g, x, ym, drawInline(ctx, M, g, 0, 0, 15, '', true) <= avail ? 15 : 13, Viz.color('text'), false);
    if (dimX) {
      const zero = M.vals[i].dim.every(d => d.isZero());
      const t = wide ? M.dm.rows.map(b => b + '⁰').join('') + (zero ? ' ✓' : ' ✗') : (zero ? '[1] ✓' : '✗');
      text(ctx, t, dimX + 4, ym, 13, zero ? Viz.color('teal') : Viz.color('rose'), 'left', 650);
    }
    sysCols.forEach((u, c) => {
      const val = u === 'natural' ? M.vals[i].cur : M.vals[i][u] !== undefined ? M.vals[i][u] : M.vals[i].cur;
      text(ctx, valW < 84 ? cnum(val) : nf(val), valX0 + valW * c + valW / 2, ym, valW < 84 ? 12 : 13, u === units ? Viz.color('text') : Viz.color('muted'), 'center', u === units ? 700 : 400, true);
    });
    ctx.restore();
    HIT.groups.push({ x0: ox, x1: ox + CW, y0: y, y1: y + rh, i });
  });
  // footer: the law and the independence badge
  if (!fh) return;
  const yf = top + nrow * rh + fh / 2 + 2;
  const law = k === 1 ? 'one group → Π₁ = constant' : 'Π₁ = φ(' + M.groups.slice(1).map((_, i) => PI_TXT(i + 1)).join(', ') + ')';
  text(ctx, law, pad + 4, yf, 14, Viz.color('text'), 'left', 650);
  if (W > 300) text(ctx, (M.indep ? 'independent ✓' : 'dependent ✗') + (showAll ? (hdr ? ' · same value in every unit system' : ' · columns: SI · cgs · imperial') : ''), W - pad, yf, 12, M.indep ? Viz.color('teal') : Viz.color('rose'), 'right', 600);
}

/** keep the select option labels in step with the problem (the engine builds selects once) */
function syncOptions(s) {
  const P = PROBLEMS[s.problem] || PROBLEMS.pipe;
  const scanTxt = s.scan >= 1 - 1e-9 ? 'all ' + SCAN_N : (Math.min(SCAN_N, Math.floor(s.scan * SCAN_N) + 1)) + ' / ' + SCAN_N;
  document.querySelectorAll('[data-viz-key="param:scan"] .viz-control-value').forEach(el => { if (el.textContent !== scanTxt) el.textContent = scanTxt; });
  document.querySelectorAll('[data-viz-key="param:rep"] select').forEach(sel => {
    Array.prototype.forEach.call(sel.options, o => { const ok = o.value === 'custom' || !!P.reps[o.value]; o.hidden = !ok; o.disabled = !ok; const t = repLabel(P, o.value); if (o.textContent !== t) o.textContent = t; });
    if (sel.value !== s.rep) sel.value = s.rep;
  });
  document.querySelectorAll('[data-viz-key="param:drop"] select').forEach(sel => {
    Array.prototype.forEach.call(sel.options, o => { const ok = o.value === 'none' || P.drops.indexOf(o.value) >= 0; o.hidden = !ok; o.disabled = !ok; });
    if (sel.value !== s.drop) sel.value = s.drop;
  });
}
