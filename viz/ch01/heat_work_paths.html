    // click the p–v or T–s route → probe + move the dot there; drag sideways on the gas → scrub the progress
    onPointer(g, ev, s) {
      const v = ev.vizView || g.view(ev.viewId), M = model(s), x = v.pointer.x, y = v.pointer.y;
      if (ev.viewId === 'gas') {
        if (ev.type !== 'pointerdown' && !(ev.type === 'pointermove' && v.pointer.down)) return false;
        const bx = g.gasBox || { x0: 14, x1: v.w * 0.6 };
        if (ev.type === 'pointerdown') g.app.play(false);
        g.app.set('prog', Math.max(0, Math.min(1, (x - bx.x0) / Math.max(20, bx.x1 - bx.x0))));
        return true;
      }
      if (ev.type !== 'pointerdown' || !M.legs.some(L => !L.zero)) return false;
      const u = nearestU(M, v.plot(ev.viewId === 'pv' ? PV_BOUNDS(M) : TS_BOUNDS(M)), x, y, ev.viewId);

      g.app.play(false); g.app.set({ prog: u, probe: u });
      return true;
    }

w = np.concatenate(([0.0], np.cumsum(dw)))

de = cv * (T - T[0])  # {{desf}} kJ/kg
q = de - w            # (1.10): {{qsf}} kJ/kg`,
