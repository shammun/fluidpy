    DOTS.forEach(d => { if (d.r < fAt(f, d.eta)) P.dot(d.x * W, G.Y(d.eta), G.small ? 1.6 : 2.1, { color: Viz.alpha(Viz.color('orange'), 0.85) }); });
  }
  // molecules hopping between layers, each carrying the value of the layer it came from
  MOLS.forEach((m, mi) => {
    if (G.small && mi % 2) return;
    const x = zone0 + m.x * Z, y = G.Y(m.eta), c = mode === 'heat' ? shade('heat', m.c, 1) : Viz.alpha(mode === 'species' ? Viz.color('orange') : col.teal, 0.25 + 0.75 * Viz.clamp(m.c, 0, 1));
    P.dot(x, y, G.small ? 2.6 : 3.6, { color: c, stroke: Viz.alpha(col.text, 0.55), strokeWidth: 1 });
  });
  // surface AB at mid-gap and the flux across it
  const yAB = G.Y(0.5), ax0 = zone0 + Z * (mode === 'momentum' ? 0.34 : 0.62), ax1 = ax0 + Z * (mode === 'momentum' ? 0.30 : 0.22);
  ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = col.text; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(ax0, yAB); ctx.lineTo(ax1, yAB); ctx.stroke(); ctx.restore();
  P.text(ax0 - 4, yAB, 'A', { align: 'right', weight: 700, size: 12.5 }); P.text(ax1 + 4, yAB, 'B', { weight: 700, size: 12.5 });
  const mag = Viz.clamp(Math.abs(M.slopeAB) / 1.6, 0, 1.1);
  if (mode === 'momentum') {
    P.arrow((ax0 + ax1) / 2 - mag * Z * 0.12, yAB - 9, mag * Z * 0.24, 0, { color: col.rose, width: 3, head: 9 });
    P.text((ax0 + ax1) / 2, yAB + 11, G.small ? 'τ' : 'τ on AB = ' + fluxStr(M.fluxAB, M), { align: 'center', color: col.rose, size: 12, weight: 650 });
  } else {
    const len = mag * (G.yBot - G.yTop) * 0.32, xm = (ax0 + ax1) / 2;
    P.arrow(xm, yAB - len / 2, 0, len, { color: col.rose, width: 3, head: 9 });
    if (!G.small) P.text(ax0 - 18, yAB + 13, M.MT.flux + ' on AB = ' + fluxStr(M.fluxAB, M) + ' (down)', { align: 'right', color: col.rose, size: 12, weight: 650 });
  }
  if (v.app && v.app.holding) {
    const M1 = M, steadyTxt = M.mode === 'momentum' ? 'τ = μU/h = ' + fluxStr(M.flux0, M) + ' at every height'
      : M.mode === 'heat' ? 'q = −kΔT/h = ' + fluxStr(M.flux0, M) + ' at every height' : 'J = −ρκₘΔY/h = ' + fluxStr(M.flux0, M) + ' everywhere';
    const lines = ['Steady after t ≈ 0.54 h²/' + M.MT.Dtxt + ' = ' + humanTime(T_STEADY * M1.clock), steadyTxt];
    if (M.mode === 'momentum' && !G.small) lines.push('force on a 10 cm × 10 cm plate: ' + fm(M.flux0 * 0.01) + ' N');
    card(ctx, W * 0.5, (G.yTop + G.yBot) / 2, lines, { color: col.rose });
  }
}

function profilePlot(v, s, M) {
  return v.plot({ xlim: [0, M.top * 1.08], ylim: [0, s.h], xlabel: M.MT.xlabel, ylabel: 'y [mm]', pad: { r: 10 } });
}
const TRAIL = [0.005, 0.02, 0.05, 0.1, 0.2, 0.4];
function drawProfile(v, s, M) {
  v.clear(); if (v.w < 60 || v.h < 60) return;
  const P = profilePlot(v, s, M).axes(), top = M.top, hmm = s.h, ys = ETA.map(e => e * hmm);
  P.clip(() => {
    P.line([0, top], [0, hmm], { color: Viz.alpha(Viz.color('muted'), 0.9), width: 1.6, dash: [7, 5] });   // steady ghost
    TRAIL.forEach(tk => { if (tk < M.tau - 1e-9) P.line(profileAt(tk).map(x => x * top), ys, { color: Viz.alpha(Viz.color('teal'), 0.22), width: 1.3 }); });
    P.line(M.f.map(x => x * top), ys, { color: Viz.color('teal'), width: 3.2 });
    if (v.h > 160) M.f.forEach((x, j) => P.dot(x * top, ys[j], 1.8, { color: Viz.color('teal') }));
    const ye = Viz.num.linspace(0, 1, 121);                      // exact series on top, thin dashed: a check
    P.line(ye.map(e => couetteStartup(e, M.tau, 1, 1, 1) * top), ye.map(e => e * hmm), { color: Viz.color('orange'), width: 1.3, dash: [5, 4] });
    // AB and the local slope there (the stress on AB is μ × this slope)
    P.line([0, top * 1.08], [hmm / 2, hmm / 2], { color: Viz.alpha(Viz.color('text'), 0.45), width: 1, dash: [4, 4] });
    const fab = M.f[20], d = 0.14;
    P.line([top * (fab - M.slopeAB * d), top * (fab + M.slopeAB * d)], [hmm * (0.5 - d), hmm * (0.5 + d)], { color: Viz.color('rose'), width: 2.4 });
    P.dot(top * fab, hmm / 2, 4, { color: Viz.color('rose'), stroke: '#fff', strokeWidth: 1.5 });
    if (s.probe !== undefined && s.probe !== null) {
      const i = s.probe, fi = M.f[i], sl = (M.f[i + 1] - M.f[i - 1]) / (2 * DETA), yi = ys[i];
      P.line([0, top * 1.08], [yi, yi], { color: Viz.alpha(Viz.color('accent'), 0.6), width: 1, dash: [2, 3] });
      P.line([top * (fi - sl * 0.1), top * (fi + sl * 0.1)], [yi - hmm * 0.1, yi + hmm * 0.1], { color: Viz.color('accent'), width: 2 });
      P.dot(top * M.f[i - 1], ys[i - 1], 3, { color: Viz.color('accent') }); P.dot(top * M.f[i + 1], ys[i + 1], 3, { color: Viz.color('accent') });
      P.dot(top * fi, yi, 4.5, { color: Viz.color('accent'), stroke: '#fff', strokeWidth: 1.5 });
    }
  });
  if (v.w > 200) P.text(top * 1.06, hmm / 2, 'AB', { align: 'right', baseline: 'bottom', dy: -3, color: Viz.color('text-soft'), size: 12 });
}

function drawStress(v, s, M) {
  v.clear(); if (v.w < 60 || v.h < 60) return;
  const ylab = M.mode === 'momentum' ? 'τ_w / (μU/h)' : M.mode === 'heat' ? 'q_w / q_steady' : 'J_w / J_steady';
  const P = v.plot({ xlim: [0, TAU_MAX], ylim: [0, 3], xlabel: 't / (h²/' + M.MT.Dtxt + ')  [–]', ylabel: ylab + ' [–]', pad: { t: v.h > 170 ? 22 : 12 } }).axes();
  const idx = [], stride = 10;
  for (let n = 0; n <= NS; n += stride) idx.push(n);
  const xs = idx.map(n => n * DTAU), cur = Math.round(Viz.clamp(M.tau / DTAU, 0, NS) / stride);
  P.clip(() => {
    P.line([0, TAU_MAX], [1, 1], { color: Viz.alpha(Viz.color('muted'), 0.9), width: 1.2, dash: [6, 4] });
    P.line([T_STEADY, T_STEADY], [0, 3], { color: Viz.alpha(Viz.color('muted'), 0.9), width: 1, dash: [2, 4] });
    P.line(xs, idx.map(n => WT[n]), { color: Viz.alpha(Viz.color('rose'), 0.3), width: 2 });
    P.line(xs, idx.map(n => WB[n]), { color: Viz.alpha(Viz.color('blue'), 0.3), width: 2 });
    P.line(xs.slice(0, cur + 1), idx.slice(0, cur + 1).map(n => WT[n]), { color: Viz.color('rose'), width: 3 });
    P.line(xs.slice(0, cur + 1), idx.slice(0, cur + 1).map(n => WB[n]), { color: Viz.color('blue'), width: 3 });
    const ex = Viz.num.linspace(0.004, TAU_MAX, 160), eg = ex.map(exactWallGradients);   // exact series on top, thin
    P.line(ex, eg.map(e => e.t), { color: Viz.color('orange'), width: 1, dash: [3, 4] });
    P.line(ex, eg.map(e => e.b), { color: Viz.color('orange'), width: 1, dash: [3, 4] });
    P.dot(M.tau, Math.min(M.wt, 3), 4.5, { color: Viz.color('rose'), stroke: '#fff', strokeWidth: 1.5 });
    P.dot(M.tau, M.wb, 4.5, { color: Viz.color('blue'), stroke: '#fff', strokeWidth: 1.5 });
  });
  const small = v.w < 330 || v.h < 150;
  if (v.h > 140) {
    P.text(0.2, 2.4, 'top wall', { color: Viz.color('rose'), weight: 650, size: 12 });
    P.text(0.2, 0.3, 'bottom wall', { color: Viz.color('blue'), weight: 650, size: 12 });
  }
  if (!small) {
    P.text(T_STEADY, 2.1, ' within 1 %', { color: Viz.color('text-soft'), size: 12 });
    P.text(0.03, 2.8, '↑ top wall starts off-scale', { color: Viz.color('rose'), size: 12 });
  }
  if (v.h > 170 && v.w > 380) [0.5, 1.0, 1.5].forEach(x => P.text(x, 3, humanTime(x * M.clock), { align: x === 1.5 ? 'right' : 'center', baseline: 'bottom', dy: -3, color: Viz.color('text-soft'), size: 12, halo: false }));
}

   APP
   --------------------------------------------------------------------------------------------------- */
let syncing = false;
const app = Viz.app({
  title: 'How does the fluid learn that a plate moved?',
  subtitle: 'One clock, three views: the gap, the profile and the stress on each wall',
  params: {
    fluid: { type: 'select', label: 'Fluid (20 °C)', display: 'chips', value: 'water',

    U:     { label: 'Plate speed $U$', min: 0.1, max: 5, step: 0.1, value: 1, unit: 'm/s', help: 'or drag the top plate sideways' },

    rho:   { label: 'Density $\\rho$', min: 0.5, max: 2000, log: true, value: FLUIDS.water.rho, optional: true, help: 'dragging makes a custom fluid', fmt: v => fm(v) + ' kg/m³' },
    dT:    { label: 'Wall step $\\Delta T$ (heat)', min: 1, max: 50, step: 1, value: 10, unit: 'K', optional: true },
    tau:   { label: 'time $t/(h^2/D)$', min: 0, max: TAU_MAX, step: 'any', value: 0, optional: true, fmt: v => v.toFixed(3) }
  },
  onChange(s, key, a) {
    if (syncing) return;

    try {

    } finally { syncing = false; }
  },
  transport: { param: 'tau', min: 0, max: TAU_MAX, rate: 0.1, end: 'hold', hold: 3, step: 0.01 },
  modes: { param: 'mode', label: 'What diffuses', options: [['momentum', 'momentum'], ['heat', 'heat'], ['species', 'species']] },
  presets: [
    { label: 'air', set: { fluid: 'air' }, title: 'μ small, ν large', action: a => { a.set('tau', 0); a.play(true); } },
    { label: 'water', set: { fluid: 'water' }, title: 'the reference', action: a => { a.set('tau', 0); a.play(true); } },
    { label: 'honey', set: { fluid: 'honey' }, title: 'a million times air’s μ', action: a => { a.set('tau', 0); a.play(true); } },
    { label: 'water’s μ, air’s ρ', set: { logmu: -3, rho: 1.2 }, title: 'same stress, a thousand times faster clock', action: a => { a.set('tau', 0); a.play(true); } },
    { label: 'wide gap', set: { h: 10 }, title: 'h = 10 mm: the clock grows 100×', action: a => { a.set('tau', 0); a.play(true); } }
  ],
  status: s => {
    const M = model(s);
    if (M.tau < T_STEADY) return { text: '⏳ spreading · t = ' + M.tau.toFixed(2) + ' h²/' + M.MT.Dtxt + ' = ' + humanTime(M.t), tone: 'warn' };
    return { text: '✅ ' + M.MT.steady + ': ' + M.MT.flux + ' = ' + fluxStr(M.flux0, M) + ' everywhere', tone: 'good' };
  },
  readouts: [
    { id: 'nu', label: '$\\nu = \\mu/\\rho$', value: s => props(s).nu, fmt: v => fm(v) + ' m²/s' },
    { id: 'D', label: 'Diffusivity $D$', value: s => model(s).D, fmt: v => fm(v) + ' m²/s' },
    { id: 'clock', label: 'Clock $h^2/D$', value: s => model(s).clock, fmt: v => humanTime(v) },

  ],
  stage: {
    rows: [1.15, 1],
    views: [
      { id: 'gap', row: 0, flex: 1, title: s => { const M = model(s); return '<b>The gap</b> · ' + M.p.name + ' · t = ' + humanTime(M.t); } },
      { id: 'profile', row: 1, flex: 1, title: s => '<b>' + MODE[s.mode].fSym + '(y, t)</b> · <span class="c-teal">FTCS</span> · <span class="c-orange">exact</span> · dashed = steady' },
      { id: 'stress', row: 1, flex: 1.05, hidePortrait: true, title: s => '<b>Wall ' + (MODE[s.mode] || MODE.momentum).flux + '(t)</b> · <span class="c-rose">top</span> · <span class="c-blue">bottom</span>' }
    ],
    step(g, s, dt) {
      const M = model(s), sd = Math.sqrt(Math.max(dt, 0)) * 0.22;
      MOLS.forEach(m => {
        m.eta += (rnd() - 0.5) * 2 * sd; if (m.eta < 0.03) m.eta = 0.06 - m.eta; if (m.eta > 0.97) m.eta = 1.94 - m.eta;
        m.x = (m.x + (rnd() - 0.5) * dt * 0.4 + 1) % 1;
        m.c += (fAt(M.f, m.eta) - m.c) * Math.min(1, 2.5 * dt);
      });
    },
    reset() { MOLS.forEach(m => { m.c = 0; }); },
    draw(g, s) {
      const M = model(s);
      drawGap(g.view('gap'), s, M);
      drawProfile(g.view('profile'), s, M);
      drawStress(g.view('stress'), s, M);
    },
    onPointer(g, ev, s) {
      const v = ev.view;
      if (ev.viewId === 'profile' && ev.type === 'pointerdown') {
        const M = model(s), P = profilePlot(v, s, M), eta = P.iy(v.pointer.y) / s.h;
        g.app.set('probe', Viz.clamp(Math.round(eta * (N - 1)), 1, N - 2));
        return true;
      }
      if (ev.viewId === 'gap' && s.mode === 'momentum') {
        const G = gapGeom(v);
        if (ev.type === 'pointerdown' && v.pointer.y < G.yTop + 12) { drag = { x: v.pointer.x, U: s.U }; return false; }
        if (ev.type === 'pointermove' && drag && v.pointer.down) { g.app.set('U', Math.round(Viz.clamp(drag.U + (v.pointer.x - drag.x) / G.W * 5, 0.1, 5) * 10) / 10); return true; }
        if (ev.type === 'pointerup' || ev.type === 'pointercancel') drag = null;
      }
      return false;
    }
  },
  explore: {
    intro: 'Press ▶ and watch the <span class="c-teal">profile</span> creep down the gap. Switch fluids and compare the clock $h^2/D$.',
    controls: ['fluid', 'h', 'U', 'logmu', 'rho', 'dT'],
    readouts: ['nu', 'clock', 'tnow', 'fluxTop', 'fluxBot'],
    callouts: [{ kind: 'try', html: 'Air and water in the same 1 mm gap: predict which clock is shorter before you click.' }]
  },
  inspect: s => {
    if (s.probe === undefined || s.probe === null) return null;
    const M = model(s), i = s.probe, dy = M.h / (N - 1), a = M.f[i + 1] * M.top, b = M.f[i - 1] * M.top, grad = (a - b) / (2 * dy);
    const head = `At $y = ${tn(i * dy * 1e3)}$ mm (node ${i}), t = ${humanTime(M.t)}:<br>`;
    if (M.mode === 'momentum') return head + `$\\dfrac{du}{dy} \\approx \\dfrac{u_{${i + 1}} - u_{${i - 1}}}{2\\Delta y} = \\dfrac{${tn(a, 4)} - ${tn(b, 4)}}{2 \\times ${tn(dy)}} = ${tn(grad)}$ 1/s<br>` +
      `$\\tau = \\mu\\,\\dfrac{du}{dy} = ${tn(M.p.mu)} \\times ${tn(grad)} = \\mathbf{${tn(M.p.mu * grad)}}$ Pa`;
    if (M.mode === 'heat') return head + `$\\dfrac{dT}{dy} \\approx \\dfrac{${tn(a, 4)} - ${tn(b, 4)}}{2 \\times ${tn(dy)}} = ${tn(grad)}$ K/m<br>` +
      `$q = -k\\,\\dfrac{dT}{dy} = -${tn(M.p.k)} \\times ${tn(grad)} = \\mathbf{${tn(-M.p.k * grad)}}$ W/m²`;
    return head + `$\\dfrac{dY}{dy} \\approx \\dfrac{${tn(a, 4)} - ${tn(b, 4)}}{2 \\times ${tn(dy)}} = ${tn(grad)}$ 1/m<br>` +
      `$J = -\\rho\\kappa_m\\dfrac{dY}{dy} = -${tn(M.p.rho)} \\times ${tn(M.p.km)} \\times ${tn(grad)} = \\mathbf{${tn(-M.p.rho * M.p.km * grad)}}$ kg/(m² s)`;
  },
  inspectHint: 'Click the profile at any height: the stress (or flux) there is worked out from the two neighbouring grid values.',
  notes: s => {
    const M = model(s), hm = M.h, keys = Object.keys(FLUIDS);
    const Dk = k => M.mode === 'momentum' ? FLUIDS[k].mu / FLUIDS[k].rho : M.mode === 'heat' ? thermalDiffusivity(FLUIDS[k].k, FLUIDS[k].rho, FLUIDS[k].cp) : FLUIDS[k].kappa_m;
    const rows = keys.map(k => [NAMES[k], fm(FLUIDS[k].mu), fm(Dk(k)), humanTime(hm * hm / Dk(k))]);
    const cur = keys.indexOf(s.fluid);
    const water = Dk('water'), ratio = M.D / water;
    const cmp = s.fluid === 'water' ? `Water is the reference: $h^2/${M.MT.Dtex}$ = ${humanTime(M.clock)} for your ${fm(s.h)} mm gap.`
      : `${M.p.name[0].toUpperCase() + M.p.name.slice(1)}: $${M.MT.Dtex}$ is ${fm(ratio >= 1 ? ratio : 1 / ratio)}× ${ratio >= 1 ? 'larger' : 'smaller'} than water’s, so it settles ${fm(ratio >= 1 ? ratio : 1 / ratio)}× ${ratio >= 1 ? 'faster' : 'slower'} in the same gap.`;
    return `<p>${cmp}</p>` + Viz.work.table(['fluid', 'μ [Pa s]', M.MT.Dtxt + ' [m²/s]', 'h²/' + M.MT.Dtxt], rows, cur);
  },
  explain: {
    html: s => {
      const W = Viz.work, M = model(s), p = M.p, MT = M.MT, h = M.h;
      let o = W.step(0, 'What you are looking at');

      else o += W.say('Same run, other meaning. The shading and the <span class="c-teal">teal</span> profile are now ' + (M.mode === 'heat' ? 'temperature above the cold wall' : 'the mass fraction $Y$ (orange dots mark where the species has reached)') + '. The <span class="c-rose">rose</span> arrow is the ' + (M.mode === 'heat' ? 'heat flux $q$' : 'mass flux $J_m$') + ' across AB; it points down, from high to low, as the minus sign in ' + MT.law + ' says.');
      o += W.hint('On a phone the wall-flux graph is hidden; turn the phone sideways to see it.');
      o += W.step(1, 'From μ to ν') +
        W.line('$\\mu$', fm(p.mu) + ' Pa s', p.named ? p.name + ' at 20 °C (fluidpy FLUIDS)' : 'your override') +
        W.line('$\\rho$', fm(p.rho) + ' kg/m³', '') +
        W.box(`$\\nu = \\mu/\\rho = ${tn(p.mu)}/${tn(p.rho)} = \\mathbf{${tn(p.nu)}}$ m²/s`) +

def ftcs_step(f, r):  # ends held fixed (Dirichlet)
    assert r <= 0.5, "FTCS unstable"  # here r = D Δt/Δy² = 0.4
