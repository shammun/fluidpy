.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }

.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }

.viz-der-why { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }

.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }

.viz-app[data-dense="2"] .viz-der-block, .viz-app[data-dense="3"] .viz-der-block { font-size: 13px; line-height: 1.4; }

    t: { label: 'Time $t$', min: 0, max: TMAX, step: 0.05, value: 6, unit: 's', fmt: v => fz(v, 3) + ' s' }
  },
  modes: { param: 'kit', label: 'Kit', options: KITS },
  transport: { param: 't', min: 0, max: TMAX, rate: 1, end: 'loop', label: 'time', unit: 's' },
  presets: [
    { label: 'stream only', set: { kit: 'custom', U: 1, m: 0, ms: 0, d: 0, G: 0 }, title: 'nothing stops the stream' },
    { label: 'half-body', set: { kit: 'hb', U: 1, m: TP }, title: 'U = 1 m/s, m = 2π m²/s: a = 1 m' },
    { label: 'Rankine oval', set: { kit: 'oval', U: 1, m: TP, eps: 1 }, title: 'equal source and sink: a closed body' },
    { label: 'pair → doublet', set: { kit: 'pair', m: 1, eps: 1 }, title: 'then press Squeeze' },
    { label: 'cylinder', set: { kit: 'cyl', U: 1, d: TP }, title: 'a = 1 m' },
    { label: 'lifting cylinder', set: { kit: 'lift', U: 1, d: TP, G: -TP }, title: 'clockwise Γ = 2π m²/s: stagnation points at −30° and −150°' }
  ],
  presetsLabel: 'Special cases',
  status: s => statusOf(s),
  readouts: [
    { id: 'xS', label: 'Stagnation $x_S$', unit: 'm', value: s => model(s).xS, fmt: v => isFinite(v) ? fz(v, 4) + ' m' : '—' },
    { id: 'width', label: 'Width $2h_{\\max}$', unit: 'm', value: s => model(s).width, fmt: v => isFinite(v) ? fz(v, 4) + ' m' : '—' },
    { id: 'halfLen', label: 'Half-length', unit: 'm', value: s => { const M = model(s); return M.ov ? M.ov.half_length : NaN; }, fmt: v => isFinite(v) ? fz(v, 4) + ' m' : '—' },
    { id: 'halfWid', label: 'Half-width', unit: 'm', value: s => { const M = model(s); return M.ov ? M.ov.half_width : NaN; }, fmt: v => isFinite(v) ? fz(v, 4) + ' m' : '—' },
    { id: 'rad', label: 'Radius $a$', unit: 'm', value: s => model(s).a, fmt: v => isFinite(v) ? fz(v, 4) + ' m' : '—' },
    { id: 'perr', label: 'Off the doublet by', unit: '%', value: s => { const M = model(s); return M.kit === 'pair' && M.perr <= 1 ? 100 * M.perr : NaN; }, fmt: v => isFinite(v) ? fz(v, 3) + ' %' : '— (ε not small)' },
    { id: 'cp', label: '$C_p$ at probe', unit: '', value: s => { const M = model(s), pr = probeOf(s); return state(M.E, pr[0], pr[1]).cp; }, fmt: v => isFinite(v) ? fz(v, 4) : '— (U = 0)' },
    { id: 'sum', label: 'Σ sources $\\Sigma m$', unit: 'm²/s', value: s => model(s).net, fmt: v => fz(v, 4) + ' m²/s' }
  ],
  terms: { title: 'u at the probe, element by element', unit: 'm/s', items: [
    { id: 'uni', label: 'stream $U$', color: Viz.color('blue'), value: s => partU(s, 'uni') },
    { id: 'src', label: 'source', color: Viz.color('teal'), value: s => partU(s, 'src') },
    { id: 'snk', label: 'sink', color: Viz.color('rose'), value: s => partU(s, 'snk') },
    { id: 'dbl', label: 'doublet', color: Viz.color('accent'), value: s => partU(s, 'dbl') },
    { id: 'vtx', label: 'vortex', color: Viz.color('amber'), value: s => partU(s, 'vtx') }], total: { label: 'total $u$' } },
  stage: {
    rows: [1.35, 1],
    views: [
      { id: 'flow', row: 0, flex: 1, title: s => flowTitle(s) },
      { id: 'terms', row: 1, flex: 1, title: s => termsTitle(s) },
      { id: 'cp', row: 1, flex: 1.1, hidePortrait: true, title: s => cpTitle(s) }
    ],
    draw(g, s) { drawFlow(g, s); drawTerms(g, s); drawCp(g, s); },
    onPointer(g, ev, s) {
      const M = model(s);
      if (ev.viewId === 'terms') {
        if (ev.type !== 'pointerdown' || !TROWS) return false;
        const v = ev.vizView || g.view('terms'), i = Math.floor((v.pointer.y - TROWS.head) / TROWS.rh);
        if (i < 0 || i >= TROWS.rows.length) return false;
        const id = TROWS.rows[i].id; g.app.set('focus', id === 'sum' || s.focus === id ? null : id); return true;
      }
      if (ev.viewId !== 'flow' || !PF) return false;
      const v = ev.vizView || g.view('flow'), X = v.pointer.x, Y = v.pointer.y;
      if (ev.type === 'pointerdown') {
        const e = nearSourceSink(M, X, Y);
        if (e && USE.eps.indexOf(s.kit) >= 0) { DRAG = { kind: 'eps' }; return true; }
        if (!PF.inside(X, Y)) return false;
        DRAG = { kind: 'probe' }; const p = probeClamp(M, PF.ix(X), PF.iy(Y)); g.app.set({ px: p[0], py: p[1] }); return true;
      }
      if (ev.type === 'pointermove') {
        if (!DRAG || !v.pointer.down) return false;
        if (DRAG.kind === 'eps') { g.app.set('eps', Math.min(3, Math.max(0.02, Math.abs(PF.ix(X))))); return true; }
        if (PF.inside(X, Y)) { const p = probeClamp(M, PF.ix(X), PF.iy(Y)); g.app.set({ px: p[0], py: p[1] }); }
        return true;
      }
      if (ev.type === 'pointerup' || ev.type === 'pointercancel') { const had = !!DRAG; DRAG = null; return had; }
      return false;
    }
  },
  explore: {
    intro: 'Choose a kit above the picture, slide the strengths, click the flow to move the probe ✚ (drag a source or sink to change ε) and press ▶ for the tracers.',
    controls: ['U', 'm', 'eps', 'ms', 'd', 'G', 'squeeze', 'map'],
    readouts: ['xS', 'width', 'halfLen', 'halfWid', 'rad', 'perr', 'cp', 'sum'],
    callouts: [{ kind: 'try', html: 'Predict first: in the Rankine oval, move the sink twice as far away (drag it). Does the body get longer or fatter?' }]
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click the flow: the velocity at that point, element by element.',
  notes: s => notesHtml(s),
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  onChange: (s, key, a) => { if (key !== 't') applyVisibility(a); }
};
function partU(s, id) { const M = model(s), pr = probeOf(s), e = M.E.find(q => q.id === id); return e ? elVel(e, pr[0], pr[1])[0] : 0; }
Object.assign(CFG, { derivations: DERIV, code: CODE, tour: TOUR, equations: EQS, check: QUIZ, selftest: selftestRows });
const app = Viz.app(CFG);
applyVisibility(app); app.fit();

</script>
