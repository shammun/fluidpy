  const th = Viz.num.linspace(-180, 180, 241), E = th.map(d => [Math.cos(d * PI / 180), Math.sin(d * PI / 180), 0]);
  const ps = E.map(e => surfP(e, U, A, a)), st = ps.map(p => p.steady), ac = ps.map(p => p.acc), to = ps.map(p => p.total);
  let lo = Math.min(0, ...st, ...ac, ...to), hi = Math.max(0, ...st, ...ac, ...to);
  if (hi - lo < 1) { lo -= 1; hi += 1; }
  const padY = 0.12 * (hi - lo); lo -= padY; hi += padY;
  const axisName = s.mode === 'release' ? 'straight up' : 'the axis of motion';
  const P = gutterPlot(v, { xlim: [-180, 180], ylim: [lo, hi], xlabel: 'θ [deg]', ylabel: 'p − p∞ [Pa]', pad: { t: 8, r: 10, b: shortV ? 20 : 34 } },
    { xticks: v.w < 300 ? [-180, 0, 180] : [-180, -90, 0, 90, 180], xlabel: shortV ? '' : (v.w < 520 ? `θ [deg] from ${s.mode === 'release' ? 'up' : 'the axis'}` : `θ [deg] on the surface, measured from ${axisName}`), yticks: shortV ? [0] : undefined });
  PTH = { P };
  const TX = Viz.color('text'), TE = Viz.color('teal'), OR = Viz.color('orange'), AC = Viz.color('accent'), MU = Viz.color('muted');
  P.clip(() => {
    // where the speed part crosses p∞: cos²ψ = 5/9 (ψ ≈ 41.8° and 138.2° from u_s)
    if (n.us > 1e-9 && !shortV) {
      const z = Math.acos(Math.sqrt(5 / 9)) * 180 / PI;
      [z, 180 - z, -z, z - 180].forEach(d => { const x = degN(n.thU + d); P.dot(x, 0, 3, { color: Viz.alpha(TE, 0.9) }); });
    }
    if (n.us > 1e-9) P.line([degN(n.thU), degN(n.thU)], [lo, hi], { color: Viz.alpha(TX, 0.45), width: 1.2, dash: [4, 4] });
    if (n.da > 1e-9) P.line([degN(n.thA), degN(n.thA)], [lo, hi], { color: Viz.alpha(OR, 0.6), width: 1.2, dash: [4, 4] });
    P.line(th, to, { color: TX, width: s.show === 'total' ? 3.4 : 2.4 });
    P.line(th, st, { color: TE, width: s.show === 'steady' ? 3 : 2 });
    P.line(th, ac, { color: OR, width: s.show === 'accel' ? 3 : 2 });
    P.line([s.ths, s.ths], [lo, hi], { color: Viz.alpha(AC, 0.5), width: 1.2 });
    P.dot(s.ths, n.p.steady, 4, { color: TE, stroke: '#fff' });
    P.dot(s.ths, n.p.acc, 4, { color: OR, stroke: '#fff' });
    P.dot(s.ths, n.p.total, 5, { color: AC, stroke: '#fff', strokeWidth: 1.8 });
  });
  if (!shortV && v.w >= 360) {
    const l = (str, x, y, c, al) => Viz.text(ctx, str, x, y, { size: 12, weight: 650, color: c, align: al || 'left', bg: true, pad: 2 });
    const lx = (d, str) => { const X = P.X(degN(d)); return X > P.px.x + P.px.w - 70 ? [X - 4, 'right'] : [X + 4, 'left']; };
    if (n.us > 1e-9) { const q = lx(n.thU); l(v.w < 520 ? 'uₛ' : 'front (uₛ)', q[0], P.px.y + 10, TX, q[1]); }
    if (n.da > 1e-9 && (n.us < 1e-9 || Math.abs(degN(n.thA - n.thU)) > 25)) { const q = lx(n.thA); l('duₛ/dt', q[0], P.px.y + 26, OR, q[1]); }
  }
}
function pthetaTitle(s) {

  return `<b>Surface pressure p − p∞ against θ</b> · <span class="c-teal">speed part</span> + <span class="c-orange">acceleration part</span> = <span class="c-ink">total</span> · <span class="c-accent">probe θ = ${s.ths}°: ${f3(n.p.total)} Pa</span>`;

/* ---- view 3: time ------------------------------------------------------------------------------------------------- */
let TCACHE = { key: '', v: null };
function timeCurves(s) {
  const key = [s.mode, s.us, s.dus, s.ang, s.a, s.dens, s.ths].join('|');
  if (TCACHE.key === key) return TCACHE.v;
  const ts = Viz.num.linspace(0, TEND, 121), a = s.a, e = [Math.cos(s.ths * PI / 180), Math.sin(s.ths * PI / 180), 0];
  let v;
  if (s.mode === 'prescribed') {
    const ps = ts.map(t => { const K = kin(s, t); return surfP(e, K.U, K.A, a); });
    v = { ts, st: ps.map(p => p.steady), ac: ps.map(p => p.acc), to: ps.map(p => p.total) };
  } else if (s.mode === 'oscillating') {
    const M = addedMass(a), os = ts.map(t => oscill(t, a));
    const Fq = ts.map(t => { const o = oscill(t, a); return forceQuad(E => surfP(E, [o.u, 0, 0], [o.du, 0, 0], a).total, a)[0]; });   // (6.98) by quadrature
    v = { ts, F: Fq, Mdu: os.map(o => -M * o.du), z: os.map(o => o.z), amp: M * AMP * OMG * OMG };
  } else {
    const mo = motion(massOf(s), a), mo0 = motion(massOf(s), a, RHO, GRAV, false);
    v = { ts, u: ts.map(mo.u), u0: ts.map(t => (isFinite(mo0.a0) ? mo0.u(t) : NaN)), mo, mo0 };
  }
  TCACHE = { key, v };
  return v;
}
function drawTime(g, s) {
  const v = g.view('time'); v.clear();

  const C = timeCurves(s), n = N(s), ctx = v.ctx, shortV = v.h < 150, tNow = s.t;
  const TX = Viz.color('text'), TE = Viz.color('teal'), OR = Viz.color('orange'), MU = Viz.color('muted'), AC = Viz.color('accent');
  const upto = (xs, ys) => { const k = xs.findIndex(x => x > tNow + 1e-12); return k < 0 ? [xs, ys] : [xs.slice(0, k).concat([tNow]), ys.slice(0, k).concat([ys[Math.max(0, k - 1)]])]; };
  const lbl = (str, x, y, c, al) => Viz.text(ctx, str, x, y, { size: 12, weight: 650, color: c, align: al || 'left', bg: true, pad: 2 });
  if (s.mode === 'prescribed') {
    let lo = Math.min(0, ...C.st, ...C.ac, ...C.to), hi = Math.max(0, ...C.st, ...C.ac, ...C.to);
    if (hi - lo < 1) { lo -= 1; hi += 1; } const pd = 0.1 * (hi - lo);
    const P = gutterPlot(v, { xlim: [0, TEND], ylim: [lo - pd, hi + pd], xlabel: 't [s]', ylabel: 'probe p − p∞ [Pa]', pad: { t: 8, r: 10, b: shortV ? 20 : 34 } }, { yticks: shortV ? [0] : undefined, xlabel: shortV ? '' : 't [s]' });
    const k = n.p;
    P.clip(() => {
      [[C.st, TE], [C.ac, OR], [C.to, TX]].forEach(([ys, c]) => { P.line(C.ts, ys, { color: Viz.alpha(c, 0.3), width: 1.6 }); const u = upto(C.ts, ys); P.line(u[0], u[1], { color: c, width: 2.6 }); });
      P.dot(tNow, k.steady, 4, { color: TE, stroke: '#fff' }); P.dot(tNow, k.acc, 4, { color: OR, stroke: '#fff' }); P.dot(tNow, k.total, 5, { color: AC, stroke: '#fff' });
    });
  } else if (s.mode === 'oscillating') {
    const A = C.amp * 1.25;

    const zs = C.z.map(z => 0.55 * z / AMP * C.amp);          // x_s drawn at 55 % of the force amplitude: same phase
    P.clip(() => {
      P.line(C.ts, zs, { color: Viz.alpha(MU, 0.55), width: 1.4, dash: [2, 3] });

    if (hi - lo < 0.5) { lo -= 0.5; hi += 0.5; } const pd = 0.08 * (hi - lo);
    const P = gutterPlot(v, { xlim: [0, TEND], ylim: [lo - pd, hi + pd], xlabel: 't [s]', ylabel: 'u [m/s] (up +)', pad: { t: 8, r: 10, b: shortV ? 20 : 34 } }, { yticks: shortV ? [0] : undefined, xlabel: shortV ? '' : 't [s]' });
    P.clip(() => {
      if (isFinite(u0)) P.line(C.ts, C.u0, { color: MU, width: 1.8, dash: [6, 5] });

      P.line(C.ts, C.u, { color: Viz.alpha(TX, 0.25), width: 1.6 });
      const u = upto(C.ts, C.u); P.line(u[0], u[1], { color: TX, width: 2.8 });

      else if (isFinite(u0) && Math.abs(u0) > 1e-9) lbl('without M', P.X(0.8 * TEND), P.Y(mo0.u(0.8 * TEND)) + (u0 > 0 ? -14 : 14), MU, 'right');

}
function timeTitle(s) {

/* ---- inspector, status, notes ------------------------------------------------------------------------------------- */
function inspectHtml(s) {
  const n = N(s), c = n.c, u2 = n.us * n.us, lab = s.mode === 'release' ? 'up' : 'the axis';
  return `Probe (purple) at $\\theta=${s.ths}^\\circ$ from ${lab}:<br>$\\begin{aligned}\\mathbf e_\\xi&=(${t3(n.e[0])},\\ ${t3(n.e[1])})\\\\ \\mathbf u_s\\cdot\\mathbf e_\\xi&=${t4(fz(c, n.us))}\\ \\text{m/s}\\\\ |\\mathbf u_a|&=\\big|\\tfrac32(\\mathbf u_s\\cdot\\mathbf e_\\xi)\\mathbf e_\\xi-\\tfrac12\\mathbf u_s\\big|\\\\&=${t3(n.uan)}\\ \\text{m/s}\\\\ p_{\\text{speed}}&=\\rho\\big[\\tfrac98(${t3(fz(c, n.us))})^2-\\tfrac58(${t3(u2)})\\big]\\\\&=\\mathbf{${t4(fz(n.p.steady, 1))}}\\ \\text{Pa}\\\\ p_{\\text{acc}}&=\\rho\\tfrac a2\\,\\mathbf e_\\xi\\cdot\\tfrac{d\\mathbf u_s}{dt}\\\\&=1000\\times${t3(s.a / 2)}\\times${tp(fz(n.eA, n.da))}\\\\&=\\mathbf{${t4(fz(n.p.acc, 1))}}\\ \\text{Pa}\\\\ p-p_\\infty&=\\mathbf{${t4(fz(n.p.total, 1))}}\\ \\text{Pa}\\end{aligned}$`;
}
function statusOf(s) {

    if (s.dens === '1') return { text: sm ? `${word}: a = 0, stays put` : `${word}: neutrally buoyant — (m + M) du/dt = 0, it stays put`, tone: 'info' };
    if (s.dens === '0') return { text: sm ? `${word}: ${f3(a0)} m/s² = 2g` : `${word}: a = ρVg/(½ρV) = ${f3(a0)} m/s² = 2g — without M it would be ∞`, tone: 'good' };
    return { text: sm ? `${word}: ${accG(a0)}` : `${word}: a = ${accG(a0)} ${a0 > 0 ? 'up' : 'down'} · without M ${accG(n.mo0.a0)}`, tone: 'info' };
  }

  return { text: sm ? `🚀 Fₛ ${F} N, M ${M} kg` : `🚀 accelerating: the fluid pushes back, Fₛ = −M duₛ/dt = ${F} N with M = ${M} kg`, tone: 'warn' };
}
function interpText(s) {

  if (s.mode === 'release') {
    if (s.dens === '0') return `Almost no mass of its own: the bubble's motion is ruled by the added mass $M=${M}$ kg. Buoyancy $\\rho Vg$ acting on $\\tfrac12\\rho V$ gives $2g=${f3(2 * GRAV)}$ m/s² — the fluid it must push aside is its only inertia.`;
    if (s.dens === '7.8') return `Heavy: $M$ adds only $0.5/7.8\\approx6\\,\\%$ to the ball's inertia, so it sinks at ${accG(n.mo.a0)} instead of ${accG(n.mo0.a0)}.`;
    if (s.dens === '0.6') return `Wood: $m=0.6\\rho V$ and $M=0.5\\rho V$ are comparable, so added mass nearly halves the upward start: ${accG(n.mo.a0)} instead of ${accG(n.mo0.a0)}.`;
    return 'Water in water: buoyancy cancels weight, no force, no acceleration — added mass never shows.';
  }
  if (s.mode === 'oscillating') return `The fluid force $F_s=-M\\,du_s/dt$ is in phase with the displacement $x_s$ (because $\\ddot x_s=-\\omega^2x_s$) and largest at the turning points, where the sphere is momentarily at rest — no speed, all acceleration. At the centre, at top speed, it is zero.`;
  if (n.da < 1e-9) return `No acceleration: only the teal speed part, the same pressures as a still sphere in a stream, $1-\\tfrac94\\sin^2\\theta_s$ (6.106) — symmetric front to back, so zero force (d'Alembert in 3-D).`;
  if (Math.abs(n.angUA) > 5 && n.us > 1e-9) return `The force follows the acceleration, not the velocity: $F_s=${f3(fz(n.FacC + n.FstC, n.M))}$ N points against $d\\mathbf u_s/dt$ at ${deg(Math.abs(n.angUA))}° to $\\mathbf u_s$. The speed part never contributes.`;
  return `The orange part is high in front of the acceleration and low behind: the fluid ahead must be pushed aside and the fluid behind must fill in. That costs a force $M\\,|d\\mathbf u_s/dt|$ with $M=${M}$ kg — half the ${md} kg of water displaced.`;
}

/* ---- derivations (design Part F: D28 5 steps, D29 14, D30 9, D31 10) ---------------------------------------------- */

  { id: 'D28', title: 'The potential of a moving sphere', short: 'D28 φ', ref: 'Eqs. (6.96), (6.97)', view: 'sphere',
    set: Object.assign({}, S0),
    goal: 'Write the velocity potential of a sphere moving with any velocity $\\mathbf u_s(t)$ through still fluid, and check that the fluid moves with the sphere\'s surface.',
    start: { tex: '\\phi=\\Big(\\mathbf U-\\frac{\\mathbf d}{4\\pi|\\mathbf x|^3}\\Big)\\cdot\\mathbf x', plain: 'The sphere at rest in a stream $\\mathbf U$ (6.92), with its doublet $\\mathbf d=-2\\pi a^3\\mathbf U$.' },
    plan: ['Move the centre to $\\mathbf x_s(t)$.', 'Remove the stream.', 'Choose the dipole from the sphere\'s frame.', 'Substitute.', 'Check the surface condition.'],
    uses: ['the sphere in a stream $\\phi=(\\mathbf U-\\mathbf d/4\\pi|\\mathbf x|^3)\\cdot\\mathbf x$ (6.92)', 'Galilean frames (Ch. 3)', 'no flow through a moving wall: $\\mathbf n\\cdot\\mathbf u=\\mathbf n\\cdot\\mathbf U_s$'],
    steps: [
      { did: 'Centre the sphere at x_s(t)', tex: '\\mathbf x\\ \\to\\ \\boldsymbol\\xi=\\mathbf x-\\mathbf x_s(t)',
        why: 'The sphere-in-a-stream potential $\\phi=(\\mathbf U-\\frac{\\mathbf d}{4\\pi|\\mathbf x|^3})\\cdot\\mathbf x$ (6.92) is for a sphere at the origin; shifting the argument moves the sphere.', plain: 'Measure positions from the sphere\'s centre.' },
      { did: 'Drop the stream', tex: '\\phi=-\\frac{\\mathbf d\\cdot(\\mathbf x-\\mathbf x_s)}{4\\pi|\\mathbf x-\\mathbf x_s|^3}',
        why: 'With $\\mathbf U=0$ the fluid far away is at rest, as required; only the doublet remains. This is (6.96), shown above.', plain: 'A moving sphere looks like a moving doublet.' },
      { did: 'Pick the dipole from the sphere\'s frame', tex: '\\mathbf d(t)=-2\\pi a^3\\big(-\\mathbf u_s(t)\\big)=2\\pi a^3\\mathbf u_s(t)',
        why: 'Seen from the sphere the fluid streams past at $-\\mathbf u_s$; a sphere in a stream $\\mathbf V$ needs $\\mathbf d=-2\\pi a^3\\mathbf V$.', plain: 'The dipole points along the sphere\'s velocity and follows it.' },
      { did: 'Substitute d(t)', tex: '\\phi=-\\frac{a^3}{2|\\boldsymbol\\xi|^3}\\mathbf u_s\\cdot\\boldsymbol\\xi',
        why: '$2\\pi a^3/4\\pi=a^3/2$. This is (6.97), shown above.', plain: 'The potential depends on time only through $\\mathbf x_s(t)$ and $\\mathbf u_s(t)$.',
        live: s => { const n = N(s), ph = -(s.a / 2) * n.us; return `\\phi_{\\text{front}}=-\\tfrac a2|\\mathbf u_s|=${t3(fz(ph))}\\ \\text{m}^{2}\\text{/s}`; } },
      { did: 'Check the surface condition', tex: '\\begin{aligned}\\frac{\\partial\\phi}{\\partial|\\boldsymbol\\xi|}\\Big|_a&=\\frac{a^3}{|\\boldsymbol\\xi|^3}\\mathbf u_s\\cdot\\mathbf e_\\xi\\Big|_a\\\\&=\\mathbf u_s\\cdot\\mathbf e_\\xi\\end{aligned}',
        why: 'Write $\\mathbf u_s\\cdot\\boldsymbol\\xi=|\\boldsymbol\\xi|\\,\\mathbf u_s\\cdot\\mathbf e_\\xi$, so φ ∝ 1/|ξ|²; its radial derivative on |ξ| = a is the fluid\'s normal speed, which must equal the sphere\'s.',
        plain: 'The fluid moves out of the way exactly as fast as the surface arrives.', watch: 'the normal velocity of the fluid equals the sphere\'s all round: the teal u_a arrow at the front equals u_s.' }
    ],
    result: { tex: '\\phi=-\\frac{a^3}{2|\\mathbf x-\\mathbf x_s|^3}\\mathbf u_s\\cdot(\\mathbf x-\\mathbf x_s)', plain: 'A sphere moving at $\\mathbf u_s$ carries a dipole $2\\pi a^3\\mathbf u_s$ with it (6.97); its grey loops are drawn round the sphere.' },
    interpret: s => { const n = N(s); return `Your sphere: a = ${f3(s.a)} m at |u_s| = ${f3(n.us)} m/s carries a dipole of strength 2πa³|u_s| = ${f3(2 * PI * s.a ** 3 * n.us)} m⁴/s. The flow is set instantly by the current velocity; the time dependence through x_s and u_s is what makes the pressure feel the acceleration (D29).`; },
    check: 'Units: $a^3u_s/\\xi^2$ is m²/s ✓. At the front the fluid velocity (6.104) equals $\\mathbf u_s$; at the side it is $-\\tfrac12\\mathbf u_s$ (selftest rows for φ and ∇φ against fluidpy).' },
  { id: 'D29', title: 'The pressure on an arbitrarily moving sphere', short: 'D29 p', ref: 'Eq. (6.105)', view: 'ptheta',
    set: Object.assign({}, S0),
    goal: 'Find the pressure at every point of the surface of a sphere moving with any velocity and acceleration through still ideal fluid.',
    start: { tex: '\\Big[\\frac{\\partial\\phi}{\\partial t}+\\frac12|\\nabla\\phi|^2+\\frac p\\rho\\Big]_{\\text{surface}}=\\frac{p_\\infty}{\\rho}', plain: 'Unsteady Bernoulli between the surface and far away (6.99), with the moving dipole $\\phi=-\\frac{a^3}{2|\\boldsymbol\\xi|^3}\\mathbf u_s\\cdot\\boldsymbol\\xi$ (6.97).' },
    plan: ['Bernoulli on the surface.', '$\\partial\\phi/\\partial t$ by the chain rule through $\\mathbf x_s$ and $\\mathbf u_s$.', '$\\nabla\\phi$ and its value on the surface.', 'Combine and simplify; then the steady limit.'],
    uses: ['unsteady Bernoulli (Ch. 4)', 'the chain rule along a path', 'a function of $\\mathbf x-\\mathbf x_s$: $\\partial/\\partial\\mathbf x_s=-\\nabla$', '$|\\mathbf A-\\mathbf B|^2=\\mathbf A\\cdot\\mathbf A-2\\mathbf A\\cdot\\mathbf B+\\mathbf B\\cdot\\mathbf B$'],
    steps: [
      { did: 'Evaluate Bernoulli on the surface', tex: '\\frac{p_a-p_\\infty}{\\rho}=-\\Big(\\frac{\\partial\\phi}{\\partial t}\\Big)_a-\\frac12|\\nabla\\phi|_a^2',
        why: 'Rearrange $[\\partial_t\\phi+\\frac12|\\nabla\\phi|^2+p/\\rho]_{\\text{surface}}=p_\\infty/\\rho$ (6.99); the subscript a means on |ξ| = a. This is (6.100), shown above.', plain: 'Surface pressure is lowered by the changing potential and by the speed.' },
      { did: 'Differentiate φ at a fixed point', tex: '\\frac{\\partial\\phi}{\\partial t}=\\frac{\\partial\\phi}{\\partial(x_s)_i}\\frac{d(x_s)_i}{dt}+\\frac{\\partial\\phi}{\\partial(u_s)_i}\\frac{d(u_s)_i}{dt}',
        why: 'At a fixed x, φ changes only because x_s and u_s change: the chain rule along a path.', plain: 'The potential at a point changes because the sphere moves and because it speeds up.' },
      { did: 'Use ∂φ/∂x_s = −∇φ', tex: '\\frac{\\partial\\phi}{\\partial(x_s)_i}=-\\frac{\\partial\\phi}{\\partial x_i}=-u_i',
        why: 'φ depends on x and x_s only through ξ = x − x_s, so moving x_s forward is like moving x backward.', plain: 'Moving the sphere is like moving the observer the other way.' },
      { did: 'Insert dx_s/dt = u_s', tex: '\\frac{\\partial\\phi}{\\partial(x_s)_i}\\frac{d(x_s)_i}{dt}=-\\mathbf u\\cdot\\mathbf u_s',
        why: 'The sphere\'s velocity is the rate of change of its position.', plain: 'The first part of ∂φ/∂t.' },
      { did: 'Differentiate with respect to u_s', tex: '\\frac{\\partial\\phi}{\\partial\\mathbf u_s}\\cdot\\frac{d\\mathbf u_s}{dt}=-\\frac{a^3}{2|\\boldsymbol\\xi|^3}\\boldsymbol\\xi\\cdot\\frac{d\\mathbf u_s}{dt}',
        why: 'φ is linear in $\\mathbf u_s$, so its $\\mathbf u_s$-gradient is $-a^3\\boldsymbol\\xi/2|\\boldsymbol\\xi|^3$. Steps 4 and 5 together are (6.101): $\\partial_t\\phi=-\\mathbf u\\cdot\\mathbf u_s-\\frac{a^3}{2|\\boldsymbol\\xi|^3}\\boldsymbol\\xi\\cdot\\frac{d\\mathbf u_s}{dt}$.', plain: 'The second part: how the potential responds to acceleration.' },
      { did: 'Put the point on the surface', tex: '\\Big(\\frac{\\partial\\phi}{\\partial t}\\Big)_a=-\\mathbf u_a\\cdot\\mathbf u_s-\\frac a2\\mathbf e_\\xi\\cdot\\frac{d\\mathbf u_s}{dt}',
        why: 'On the surface $\\boldsymbol\\xi=a\\mathbf e_\\xi$, so $a^3/(2a^3)\\times a=a/2$. This is (6.102), shown above.', plain: 'On the surface ∂φ/∂t has a speed part and an acceleration part.' },
      { did: 'Take the gradient of φ', tex: '\\nabla\\phi=-\\frac{a^3}{2}\\Big[-\\frac{3\\boldsymbol\\xi\\,(\\mathbf u_s\\cdot\\boldsymbol\\xi)}{|\\boldsymbol\\xi|^5}+\\frac{\\mathbf u_s}{|\\boldsymbol\\xi|^3}\\Big]',
        why: 'Product rule on $(\\mathbf u_s\\cdot\\boldsymbol\\xi)|\\boldsymbol\\xi|^{-3}$ with $\\nabla(\\mathbf u_s\\cdot\\boldsymbol\\xi)=\\mathbf u_s$ and $\\nabla|\\boldsymbol\\xi|^{-3}=-3\\boldsymbol\\xi/|\\boldsymbol\\xi|^5$. This is (6.103), shown above, with ξ = x − x_s.', plain: 'The fluid velocity round the moving sphere.' },
      { did: 'Evaluate on the surface ξ = a e_ξ', tex: '\\begin{aligned}\\mathbf u_a&=-\\frac{a^3}{2}\\Big[-\\frac{3a\\mathbf e_\\xi}{a^5}\\,\\mathbf u_s\\cdot a\\mathbf e_\\xi+\\frac{\\mathbf u_s}{a^3}\\Big]\\\\&=\\tfrac32(\\mathbf u_s\\cdot\\mathbf e_\\xi)\\mathbf e_\\xi-\\tfrac12\\mathbf u_s\\end{aligned}',
        why: 'Substitute and cancel powers of a. ⚠️ The book\'s middle expression of (6.104) prints −u_s/a³ in the bracket; (6.103) gives +u_s/a³, which the final form needs.',
        plain: 'In front the fluid moves with the sphere; at the side it moves backwards at ½u_s.', set: { ths: 90 },
        live: s => { const n = N(s), ub = surfVel(n.e, n.U, true), eu = n.us > 1e-12 ? n.U.map(c => c / n.us) : [1, 0, 0]; return `\\begin{aligned}\\theta=${s.ths}^\\circ:\\ \\mathbf u_a\\cdot\\hat{\\mathbf u}_s&=${t3(fz(dot(n.ua, eu)))}\\ \\text{m/s}\\\\ \\text{printed bracket:}\\ &${t3(fz(dot(ub, eu)))}\\ \\text{m/s}\\end{aligned}`; },
        watch: 'at θ = 90° the teal u_a arrow points backwards, half as long as u_s.' },
      { did: 'Substitute into step 1', tex: '\\frac{p_a-p_\\infty}{\\rho}=\\mathbf u_a\\cdot\\mathbf u_s+\\frac a2\\mathbf e_\\xi\\cdot\\frac{d\\mathbf u_s}{dt}-\\frac12|\\mathbf u_a|^2',
        why: 'The minus sign in step 1 flips both terms of step 6; and $|\\nabla\\phi|_a^2=|\\mathbf u_a|^2$.', plain: 'Three terms: two from the speed, one from the acceleration.', set: { ths: 60 } },
      { did: 'Expand u_a·u_s', tex: '\\mathbf u_a\\cdot\\mathbf u_s=\\tfrac32(\\mathbf u_s\\cdot\\mathbf e_\\xi)^2-\\tfrac12|\\mathbf u_s|^2',
        why: 'Dot step 8 with u_s. The book skips this move.', plain: 'The first speed term.' },
      { did: 'Expand |u_a|² carefully', tex: '\\begin{aligned}|\\mathbf u_a|^2&=\\tfrac94c^2-\\tfrac32c^2+\\tfrac14|\\mathbf u_s|^2\\\\&=\\tfrac34c^2+\\tfrac14|\\mathbf u_s|^2\\end{aligned}',
        why: 'c = u_s·e_ξ. |A − B|² = A·A − 2A·B + B·B with A = (3/2)c e_ξ and B = ½u_s; the cross term is 2 × (3/2)(½)c².', plain: 'The surface speed squared.' },
      { did: 'Collect the speed terms', tex: '\\begin{aligned}&\\tfrac32c^2-\\tfrac12|\\mathbf u_s|^2-\\tfrac38c^2-\\tfrac18|\\mathbf u_s|^2\\\\&=\\tfrac98c^2-\\tfrac58|\\mathbf u_s|^2\\end{aligned}',
        why: 'Step 10 minus half of step 11.', plain: 'The speed part of the surface pressure.',
        live: s => { const n = N(s); return `\\tfrac98(${t3(fz(n.c, n.us))})^2-\\tfrac58(${t3(n.us * n.us)})=${t4(fz(n.p.steady / RHO))}=p_{\\text{speed}}/\\rho`; } },
      { did: 'Factor out ½|u_s|²', tex: '\\begin{aligned}\\frac{p_a-p_\\infty}{\\rho}=\\;&\\frac12|\\mathbf u_s|^2\\Big(\\frac94\\frac{(\\mathbf u_s\\cdot\\mathbf e_\\xi)^2}{|\\mathbf u_s|^2}-\\frac54\\Big)\\\\&+\\frac a2\\mathbf e_\\xi\\cdot\\frac{d\\mathbf u_s}{dt}\\end{aligned}',
        why: '$\\tfrac98=\\tfrac12\\times\\tfrac94$ and $\\tfrac58=\\tfrac12\\times\\tfrac54$. This is (6.105), shown above.', plain: 'Surface pressure = a speed part + an acceleration part.', set: { dus: 2 },
        watch: 'the orange curve appears: high in front of the acceleration, low behind.' },
      { did: 'Set the acceleration to zero', tex: '\\Big(\\frac{p_a-p_\\infty}{\\frac12\\rho|\\mathbf u_s|^2}\\Big)_{\\text{steady}}=\\frac94\\cos^2\\theta_s-\\frac54=1-\\frac94\\sin^2\\theta_s',
        why: '$\\mathbf u_s\\cdot\\mathbf e_\\xi=|\\mathbf u_s|\\cos\\theta_s$, θ_s the angle from the velocity; cos² = 1 − sin². This is (6.106), the same as the still sphere\'s $C_p=1-\\frac94\\sin^2\\theta$ (6.91).', plain: 'A steadily moving sphere feels exactly the pressures of a still sphere in a stream.', set: { dus: 0 } }
    ],
    result: { tex: '\\begin{aligned}\\frac{p_a-p_\\infty}{\\rho}=\\;&\\frac12|\\mathbf u_s|^2\\Big(\\frac94\\frac{(\\mathbf u_s\\cdot\\mathbf e_\\xi)^2}{|\\mathbf u_s|^2}-\\frac54\\Big)\\\\&+\\frac a2\\mathbf e_\\xi\\cdot\\frac{d\\mathbf u_s}{dt}\\end{aligned}', plain: 'The pressure on a moving sphere (6.105) is a fore–aft-symmetric part set by its speed, $\\propto|\\mathbf u_s|^2$, plus a part set by its acceleration, $\\frac a2\\mathbf e_\\xi\\cdot d\\mathbf u_s/dt$, high on the side it accelerates toward.', set: { dus: 2 } },
    interpret: s => { const n = N(s); return `With your numbers at θ = ${s.ths}°: speed part ${f3(fz(n.p.steady))} Pa + acceleration part ${f3(fz(n.p.acc))} Pa = ${f3(fz(n.p.total))} Pa. From rest (u_s = 0) only the acceleration part is left.`; },
    check: 'Units: $|\\mathbf u_s|^2$ and $a\\,d\\mathbf u_s/dt$ are both m²/s² ✓. u_s = 1 m/s, du_s/dt = 2 m/s², a = 0.1 m, water, front point: 500 + 100 = 600 Pa ✓ (selftest row). The steady limit is (6.91) with θ_s = π − θ.' },
  { id: 'D30', title: 'The force on an accelerating sphere: added mass', short: 'D30 M', ref: 'Eq. (6.108)', view: 'sphere',
    set: Object.assign({}, S0, { dus: 2 }),
    goal: 'Integrate the surface pressure (6.105) over the sphere to find the fluid\'s force, then write Newton\'s second law for a submerged sphere.',
    start: { tex: '\\mathbf F_s=-\\int_{\\text{sphere}}(p-p_\\infty)\\,\\mathbf n\\,dA', plain: 'The pressure force (6.98) with the surface pressure (6.105) and $\\mathbf n=\\mathbf e_\\xi$.' },
    plan: ['Split the pressure into its two parts.', 'The speed part gives nothing.', 'Orient the axes and integrate the acceleration part.', 'Newton\'s second law with the fluid force.'],
    uses: ['surface integrals on a sphere, $dA=a^2\\sin\\theta\\,d\\theta\\,d\\varphi$', 'spherical unit vectors', 'symmetry (even integrands)'],
    steps: [
      { did: 'Split the pressure excess', tex: '\\begin{aligned}p-p_\\infty&=S(\\mathbf e_\\xi)+\\frac{\\rho a}{2}\\mathbf e_\\xi\\cdot\\frac{d\\mathbf u_s}{dt}\\\\ S&=\\rho\\Big[\\tfrac98(\\mathbf u_s\\cdot\\mathbf e_\\xi)^2-\\tfrac58|\\mathbf u_s|^2\\Big]\\end{aligned}',
        why: 'The surface pressure $\\frac{p_a-p_\\infty}{\\rho}$ (6.105) times ρ; the integral of a sum is the sum of the integrals.', plain: 'A speed part and an acceleration part, integrated separately.' },
      { did: 'Show the speed part gives no force', tex: 'S(-\\mathbf e_\\xi)=S(\\mathbf e_\\xi)\\ \\Rightarrow\\ \\oint S(\\mathbf e_\\xi)\\,\\mathbf e_\\xi\\,dA=0',
        why: 'S depends on (u_s·e)², unchanged when e → −e: opposite points carry equal pressures on opposite normals, which cancel. The book says "no drag" without integrating.',
        plain: 'Steady motion: no force (d\'Alembert in 3-D).', set: { dus: 0 }, highlight: ['term:steady'], watch: 'the teal speed-part force bar stays at 0.' },
      { did: 'Point the acceleration along e_z', tex: '\\frac{d\\mathbf u_s}{dt}=\\Big|\\frac{d\\mathbf u_s}{dt}\\Big|\\mathbf e_z\\ \\Rightarrow\\ \\mathbf e_\\xi\\cdot\\frac{d\\mathbf u_s}{dt}=\\Big|\\frac{d\\mathbf u_s}{dt}\\Big|\\cos\\theta',
        why: 'We may choose the axes at the instant of interest; θ is then the polar angle from the acceleration.', plain: 'The acceleration part is largest at the front, zero at the equator, negative behind.', set: { dus: 2 } },
      { did: 'Write e_ξ and dA in spherical coordinates', tex: '\\begin{aligned}\\mathbf e_\\xi&=(\\sin\\theta\\cos\\varphi,\\ \\sin\\theta\\sin\\varphi,\\ \\cos\\theta)\\\\ dA&=a^2\\sin\\theta\\,d\\theta\\,d\\varphi\\end{aligned}',
        why: 'The outward unit normal and the area element of a sphere of radius a.', plain: 'Everything is now a function of the two angles.' },
      { did: 'Substitute into the force integral', tex: '\\mathbf F_s=-\\rho\\frac a2\\Big|\\frac{d\\mathbf u_s}{dt}\\Big|\\int_0^\\pi\\!\\!\\int_0^{2\\pi}\\cos\\theta\\,\\mathbf e_\\xi\\,a^2\\sin\\theta\\,d\\varphi\\,d\\theta',
        why: 'Only the acceleration part $\\frac{\\rho a}{2}|d\\mathbf u_s/dt|\\cos\\theta$ remains (step 2). This is (6.107), shown above.', plain: 'A double integral over the sphere.' },
      { did: 'Integrate over φ first', tex: '\\int_0^{2\\pi}\\cos\\varphi\\,d\\varphi=\\int_0^{2\\pi}\\sin\\varphi\\,d\\varphi=0,\\quad\\int_0^{2\\pi}d\\varphi=2\\pi',
        why: 'Over a full turn cos φ and sin φ cancel: the x and y components vanish; the z component gains 2π.', plain: 'The force points along the acceleration.' },
      { did: 'Keep the z-component', tex: '\\mathbf F_s=-\\pi\\rho a^3\\Big|\\frac{d\\mathbf u_s}{dt}\\Big|\\,\\mathbf e_z\\int_0^\\pi\\cos^2\\theta\\sin\\theta\\,d\\theta',
        why: 'ρ(a/2) × a² × 2π = πρa³. ⚠️ The book\'s (6.108) still writes dφ inside after this integration; it is done.', plain: 'One integral left.' },
      { did: 'Integrate over θ', tex: '\\begin{aligned}\\int_0^\\pi\\cos^2\\theta\\sin\\theta\\,d\\theta&=\\Big[-\\tfrac13\\cos^3\\theta\\Big]_0^\\pi=\\tfrac23\\\\ \\Rightarrow\\ \\mathbf F_s&=-\\tfrac23\\pi\\rho a^3\\,\\frac{d\\mathbf u_s}{dt}\\equiv-M\\frac{d\\mathbf u_s}{dt}\\end{aligned}',
        why: 'Substitute $s=\\cos\\theta$. This is (6.108), shown above, with $M=2\\pi\\rho a^3/3$.', plain: 'The fluid pushes back with half the displaced mass times the acceleration.', highlight: ['term:accel'],
        live: s => { const n = N(s); return `F=-\\tfrac23\\pi\\times1000\\times${t3(s.a)}^3\\times${t3(n.da)}=${t4(fz(-n.M * n.da))}\\ \\text{N}`; } },
      { did: 'Write Newton\'s law for the sphere', tex: '\\begin{aligned}\\mathbf F_E+\\mathbf F_s&=m\\frac{d\\mathbf u_s}{dt}\\\\ \\Rightarrow\\ \\mathbf F_E&=\\Big(m+\\frac{2\\pi}{3}\\rho a^3\\Big)\\frac{d\\mathbf u_s}{dt}\\end{aligned}',
        why: 'The sphere of mass m feels the external force $\\mathbf F_E$ and the fluid force $\\mathbf F_s$; move $\\mathbf F_s$ to the right. This is (6.109), shown above.', plain: 'Under water a sphere behaves as if it were heavier by half the displaced mass.' }
    ],
    result: { tex: '\\mathbf F_s=-M\\frac{d\\mathbf u_s}{dt},\\quad M=\\frac{2\\pi a^3\\rho}{3}', plain: 'An ideal fluid exerts no force on a steadily moving sphere but opposes its acceleration as an extra mass of half the displaced fluid (6.108); Newton becomes $\\mathbf F_E=(m+M)\\,d\\mathbf u_s/dt$ (6.109).', set: { dus: 2 } },
    interpret: s => { const n = N(s); return `Your sphere: M = ${f3(n.M)} kg (half of ${f3(n.md)} kg); force ${f3(fz(n.FacC, n.M))} N against the acceleration; the 32 × 64-point surface sum gives ${f4(fz(n.FacC, n.M))} N, the formula ${f4(fz(-n.M * n.da))} N.`; },
    check: 'Units: ρa³ du/dt is kg·m/s² = N ✓. a = 0.1 m, water: M = 2.094 kg (displaced 4.189 kg); du_s/dt = 2 m/s² gives F_s = −4.189 N and the surface sum agrees (selftest). A bubble (m → 0) with buoyancy ρVg: du/dt = ρVg/M = 2g ✓.' },
  { id: 'D31', title: 'Added mass from the fluid\'s kinetic energy', short: 'D31 T', ref: 'Eq. (6.108)', view: 'sphere',
    set: Object.assign({}, S0, { ke: true }),
    goal: 'Find the kinetic energy of the fluid set moving by a sphere at speed U, and show it equals ½MU² with the same M = 2πρa³/3 as the force route.',
    start: { tex: 'T=\\frac12\\rho\\int_{r>a}|\\nabla\\phi|^2\\,dV,\\qquad\\phi=-\\frac{a^3U\\cos\\theta}{2r^2}', plain: 'The fluid\'s kinetic energy outside the sphere, with the moving dipole (6.97) for $\\mathbf u_s=U\\mathbf e_z$, the sphere at the origin.' },
    plan: ['Turn $|\\nabla\\phi|^2$ into a divergence.', 'Gauss: volume → surfaces.', 'The far surface vanishes.', 'Evaluate on the sphere.', 'Read off M.'],
    uses: ['Green\'s first identity $\\nabla\\cdot(\\phi\\nabla\\phi)=|\\nabla\\phi|^2+\\phi\\nabla^2\\phi$', 'the divergence theorem (Ch. 2)', 'surface integrals on a sphere'],
    steps: [
      { did: 'Apply Green\'s first identity', tex: '\\nabla\\cdot(\\phi\\nabla\\phi)=|\\nabla\\phi|^2+\\phi\\nabla^2\\phi',
        why: 'The product rule for the divergence of a scalar times a vector, here φ times ∇φ.', plain: 'The energy density is almost a divergence.' },
      { did: 'Use Laplace\'s equation', tex: '|\\nabla\\phi|^2=\\nabla\\cdot(\\phi\\nabla\\phi)',
        why: '∇²φ = 0 for a potential flow of constant density.', plain: 'Exactly a divergence.' },
      { did: 'Apply the divergence theorem', tex: '\\begin{aligned}\\int_{a<r<R}|\\nabla\\phi|^2dV=&\\oint_{r=R}\\phi\\frac{\\partial\\phi}{\\partial r}dA\\\\&-\\oint_{r=a}\\phi\\frac{\\partial\\phi}{\\partial r}dA\\end{aligned}',
        why: 'Gauss on the shell between the sphere and a big sphere R; on the inner surface the normal pointing out of the fluid is −e_r, hence the minus.', plain: 'The fluid\'s energy is set by what happens on its two boundaries.' },
      { did: 'Let the outer sphere grow', tex: '\\phi\\frac{\\partial\\phi}{\\partial r}=O(R^{-5}),\\ \\ dA=O(R^2)\\ \\Rightarrow\\ \\oint_{r=R}\\to0',
        why: 'φ ~ r⁻² and ∂φ/∂r ~ r⁻³; the area grows only as R², so the integral falls as R⁻³.', plain: 'The far fluid barely moves and carries no energy.' },
      { did: 'Evaluate φ and ∂φ/∂r on r = a', tex: '\\phi(a,\\theta)=-\\tfrac12Ua\\cos\\theta,\\qquad\\frac{\\partial\\phi}{\\partial r}\\Big|_a=U\\cos\\theta',
        why: 'Substitute r = a; the second is the kinematic condition u_r = U cos θ (D28 step 5).', plain: 'On the surface the fluid moves out at the sphere\'s normal speed.' },
      { did: 'Insert into the inner surface term', tex: '-\\oint_{r=a}\\phi\\frac{\\partial\\phi}{\\partial r}dA=\\frac12U^2a\\int_0^{2\\pi}\\!\\!\\int_0^\\pi\\cos^2\\theta\\,a^2\\sin\\theta\\,d\\theta\\,d\\varphi',
        why: 'The product is −½U²a cos²θ; the two minus signs cancel; dA = a² sin θ dθ dφ.', plain: 'One surface integral left.' },
      { did: 'Integrate', tex: '\\frac12U^2a^3\\cdot2\\pi\\cdot\\frac23=\\frac{2\\pi}{3}a^3U^2',
        why: '∫dφ = 2π and ∫cos²θ sin θ dθ = 2/3.', plain: 'The volume integral of |∇φ|² equals (2π/3)a³U².',
        live: s => { const n = N(s), U = n.us; return `\\tfrac{2\\pi}{3}a^3U^2=\\tfrac{2\\pi}{3}\\times${t3(s.a)}^3\\times${t3(U)}^2=${t3(fz(2 * PI / 3 * s.a ** 3 * U * U))}\\ \\text{m}^{5}\\text{/s}^{2}`; } },
      { did: 'Multiply by ½ρ', tex: 'T=\\frac12\\rho\\cdot\\frac{2\\pi}{3}a^3U^2',
        why: 'The kinetic energy per unit volume is ½ρ|∇φ|², and step 7 gave the volume integral of |∇φ|².', plain: 'The fluid\'s kinetic energy.',
        live: s => { const n = N(s); return `T=${t4(fz(0.5 * n.M * n.us * n.us))}\\ \\text{J}\\ \\text{at}\\ U=${t3(n.us)}\\ \\text{m/s}`; } },
      { did: 'Define M by T = ½MU²', tex: '\\tfrac12MU^2=\\tfrac12\\cdot\\frac{2\\pi}{3}\\rho a^3U^2\\ \\Rightarrow\\ M=\\frac{2\\pi}{3}\\rho a^3',
