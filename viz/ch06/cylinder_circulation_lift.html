function inspectHtml(s) {

}
function statusOf(s) {
  const n = N(s), st = n.st, sm = narrow(), G = n.G;
  if (s.frame === 'fluid') return { text: sm ? `🚀 fluid frame · L ${f3(fz(st.L, st.L_KJ))} N/m` : `🚀 fluid frame: the body moves left at U; same pressure, L = ${f3(fz(st.L, st.L_KJ))} N/m, D = 0 · ${bothText(s, G)}`, tone: 'info' };
  if (Math.abs(s.gam) < 1e-9) return { text: sm ? `⚖️ d'Alembert · Γ = 0 · L = D = 0` : `⚖️ d'Alembert: Γ = 0 — no lift, no drag · stagnation at 0° and 180°`, tone: 'info' };
  if (st.regime === REGIME.two) return { text: sm ? `🟢 ${gText(s, G, false)} ⇔ ${s.conv === 'ccw' ? 'Γ_cw ' + f3(G) : 'Γ_ccw ' + f3(-G)} m²/s` : `🟢 two surface points · sin θ = ${f3(-st.ratio)} · ${bothText(s, G)}`, tone: 'good' };
  if (st.regime === REGIME.free) return { text: sm ? `🟣 free point r = ${f3(st.r_free)} m` : `🟣 free stagnation point at r = ${f3(st.r_free)} m · ${bothText(s, G)}`, tone: 'warn' };
  return { text: sm ? `🔵 ${st.regime}` : `🔵 ${st.regime} (θ = ${d1(st.theta1_deg)}°): |Γ| = 4πaU · ${bothText(s, G)}`, tone: 'info' };
}
function interpText(s) {
  const n = N(s), st = n.st, g = s.gam, L = f3(fz(st.L, st.L_KJ)), up = n.G > 0 ? 'upward' : 'downward';
  if (s.frame === 'fluid') return `Seen from the still fluid, the cylinder moves left at $U$ and the streamlines are the doublet's loops${Math.abs(g) > 1e-6 ? ' plus the vortex\'s circles' : ''}. This flow is unsteady, but at each instant the pressure on the body — so $L=${L}$ N/m and $D=0$ — is the same as in the body frame (Galilean invariance, Ch. 3).`;
  if (Math.abs(g) < 1e-9) return `d'Alembert: $C_p=1-4\\sin^2\\theta$ is symmetric front–back and top–bottom, so the +${f3(n.q)} Pa at the stagnation points and the ${f3(-3 * n.q)} Pa at the shoulders cancel in pairs — no force at all. A real cylinder separates and does feel drag (switch on the qualitative real band).`;
  if (st.regime === REGIME.two) return `Two stagnation points ${n.G > 0 ? 'below' : 'above'} the axis (${d1(st.theta1_deg)}° and ${d1(st.theta2_deg)}°). The fluid is faster on ${n.G > 0 ? 'top' : 'the bottom'} (${f3(n.G > 0 ? st.speed_top : st.speed_bottom)} vs ${f3(n.G > 0 ? st.speed_bottom : st.speed_top)} m/s), so the pressure is lower there: lift $L=\\rho U\\Gamma=${L}$ N/m ${up}. Front and back still mirror each other, so the drag stays 0.`;
  if (st.regime === REGIME.free) return `The stagnation point has left the body: it sits ${f3(st.r_free)} m from the centre on the ${n.G > 0 ? 'lower' : 'upper'} axis, and a ring of fluid circulates round the cylinder for ever (ideal flow). Lift $L=${L}$ N/m ${up}, still no drag.`;
  return `The two stagnation points have merged at ${n.G > 0 ? 'the bottom' : 'the top'} ($|\\Gamma|=4\\pi aU$): the surface speed is zero there and $2U+2U=4U$ on the opposite side. Lift $L=${L}$ N/m ${up}; any stronger circulation lifts the point off the body.`;
}

    { name: 'p at -120 deg, ccw input', js: surfPressure(-2 * PI / 3, 12, 0.2, -3), py: 'ch06.cylinder_surface_pressure(-2.0943951023931957, 12.0, 0.2, Gamma_ccw=3.0, rho=1.2)', rtol: 1e-12 },
    { name: 'surface speed u_theta', js: surfSpeed(1.0, 10, 0.1, 2), py: 'ch06.cylinder_surface_speed(1.0, 10.0, 0.1, Gamma_cw=2.0)', rtol: 1e-12 },
    { name: 'ratio', js: ST(2).ratio, py: PY('2.0') + '["ratio"]', rtol: 1e-12 },
    { name: 'separated band lo at 120 deg from front', js: separatedBand(120)[0], expect: -1.3, atol: 1e-12 },
    { name: 'separated band hi at 30 deg from front', js: separatedBand(30)[1], expect: Math.min(1 - 4 * 0.25 + 0.15, 1), atol: 1e-12 },
    { name: 'regime word: two', js: regime(10, 0.1, 2) === 'two surface points' ? 1 : 0, expect: 1, atol: 0 },
    { name: 'regime word: merged', js: regime(10, 0.1, Gm) === 'merged at the bottom' ? 1 : 0, expect: 1, atol: 0 },
    { name: 'regime word: merged top', js: regime(10, 0.1, -Gm) === 'merged at the top' ? 1 : 0, expect: 1, atol: 0 },
    { name: 'regime word: free', js: regime(10, 0.1, Gf) === 'free stagnation point' ? 1 : 0, expect: 1, atol: 0 },
    { name: 'invariant: drag zero', js: forces(S0, 128).D, expect: 0, atol: 1e-9 },
    { name: 'invariant: terms add up to L', js: (t => t.c0 + t.s2 + t.cr + t.g2)(termsL(S0)) - forces(S0).L, expect: 0, atol: 1e-12 },
    { name: 'invariant: cross term = rho U Gamma', js: termsL(S0).cr, expect: 24, rtol: 1e-12 },
    { name: 'invariant: r+ r- = a^2', js: stag(10, 0.1, Gf).r * stag(10, 0.1, Gf).rm, expect: 0.01, rtol: 1e-12 },
    { name: 'invariant: L independent of a at fixed Gamma', js: forces({ U: 10, a: 0.3, G: 2 }).L - forces(S0).L, expect: 0, atol: 1e-9 },
    { name: 'invariant: psi = 0 on the body', js: psiN(Math.cos(0.7), Math.sin(0.7), 0.4, 'body'), expect: 0, atol: 1e-14 }
  ];
}

/* ---- the app ------------------------------------------------------------------------------------------------------ */
let LASTG = 2, USER_UA = false;
document.addEventListener('input', ev => {
  const w = ev.target && ev.target.closest ? ev.target.closest('[data-viz-key="param:U"], [data-viz-key="param:a"]') : null;
  if (w) { USER_UA = true; setTimeout(() => { USER_UA = false; }, 0); }
}, true);
function gamFmt(v) { const s = CUR, G = v * 4 * PI * s.a * s.U; return `${Viz.fmt(v, { sig: 3 })} · Γ ${f3(fz(s.conv === 'ccw' ? -G : G))} m²/s`; }
const CFG = {
  title: 'How does spin turn into lift?',
  subtitle: 'A cylinder in a stream with a clockwise circulation Γ: streamlines, stagnation points, the surface pressure and the force it adds up to — L = ρUΓ, D = 0',
  autoplay: false,
  params: {
    gam: { label: '$\\Gamma/4\\pi aU$', min: -2, max: 2, step: 0.001, value: 1 / (2 * PI), fmt: gamFmt, help: 'the book\'s clockwise Γ in units of 4πaU; changing U or a keeps Γ itself fixed' },
    U: { label: 'Stream $U$', min: 1, max: 30, step: 0.5, value: 10, unit: 'm/s', help: 'the free stream from the left (air, ρ = 1.2 kg/m³); Γ is kept' },
    a: { label: 'Radius $a$', min: 0.02, max: 0.5, step: 0.01, value: 0.1, unit: 'm', optional: true, help: 'Γ is kept: watch L stay put' },
    conv: { type: 'select', label: 'Γ convention', options: [['cw', 'book Γ (clockwise)'], ['ccw', 'project Γ (ccw)']], value: 'cw', display: 'chips' },
    thp: { label: 'Probe angle $\\theta$', min: -180, max: 180, step: 1, value: 45, unit: '°', optional: true, help: 'or click the cylinder\'s surface / the C_p curve' },
    band: { type: 'toggle', label: 'real flow (qualitative)', value: false, optional: true },
    frame: { type: 'select', label: 'Frame', options: [['body', 'body frame'], ['fluid', 'fluid frame']], value: 'body', display: 'chips' }
  },
  transport: { param: 'gam', rate: 0.25, end: 'hold', hold: 1.5, unit: '' },
  presets: [
    { label: 'Γ = 0', set: { gam: 0, frame: 'body' }, title: 'd\'Alembert: no circulation, no force' },
    { label: '2πaU', set: { gam: 0.5, frame: 'body' }, title: 'Γ = 2πaU: stagnation points at −30° and −150°' },
    { label: '4πaU', set: { gam: 1, frame: 'body' }, title: 'Γ = 4πaU: the two points merge at the bottom' },
    { label: '6πaU', set: { gam: 1.5, frame: 'body' }, title: 'Γ = 6πaU: a free stagnation point below the body' },
    { label: 'lift down', set: { gam: -0.5, frame: 'body' }, title: 'counterclockwise circulation (negative in the book\'s sign): lift downward' },
    { label: 'moving cylinder', set: { gam: 0, frame: 'fluid' }, title: 'seen from the still fluid: a doublet moving left (Ch. 3)' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'G', label: 'Circulation Γ', value: s => N(s).G, fmt: (x, s) => gText(s || CUR, x) },
    { id: 'th', label: 'Stagnation θ₁, θ₂', value: s => N(s).st.theta1_deg, fmt: (x, s) => stagText(N(s || CUR).st) },
    { id: 'L', label: 'Lift $L$', value: s => fz(N(s).st.L, N(s).st.L_KJ), unit: 'N/m' },
    { id: 'D', label: 'Drag $D$', value: s => fz(N(s).st.D, 1e3), unit: 'N/m' },
    { id: 'spd', label: 'Top / bottom speed', value: s => N(s).st.speed_top, fmt: (x, s) => `${f3(N(s || CUR).st.speed_top)} / ${f3(N(s || CUR).st.speed_bottom)} m/s` }
  ],
  terms: { title: 'Lift by pressure term', unit: 'N/m',
    items: [
      { id: 'c0', label: 'constant $\\tfrac12\\rho U^2$', color: Viz.color('muted'), value: s => fz(N(s).tl.c0, 1e3) },
      { id: 's2', label: 'stream $-2\\rho U^2\\sin^2\\theta$', color: Viz.color('blue'), value: s => fz(N(s).tl.s2, 1e3) },
      { id: 'cross', label: 'cross $-\\frac{\\rho U\\Gamma}{\\pi a}\\sin\\theta$', color: Viz.color('amber'), value: s => fz(N(s).tl.cr, N(s).st.L_KJ) },
      { id: 'g2', label: 'vortex $-\\frac{\\rho\\Gamma^2}{8\\pi^2a^2}$', color: Viz.color('teal'), value: s => fz(N(s).tl.g2, 1e3) }
    ],
    total: { label: 'lift $L=\\rho U\\Gamma$' } },
  stage: {
    rows: [1.25, 1],
    views: [
      { id: 'flow', row: 0, flex: 1.4, title: s => flowTitle(s) },
      { id: 'forces', row: 0, flex: 1, title: s => forcesTitle(s) },
      { id: 'cp', row: 1, flex: 1, title: s => cpTitle(s) }
    ],
    draw(g, s) { CUR = s; LASTG = N(s).G; drawFlow(g, s); drawForces(g, s); drawCp(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel' || ev.type === 'pointerleave') { const was = !!DRAG; DRAG = null; return was; }
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.viewId === 'flow' && FLOW.P) {
        const P = FLOW.P, x = P.ix(X), y = P.iy(Y), r = Math.hypot(x, y);
        if (ev.type === 'pointerdown') { if (Math.abs(r - FLOW.a) > 0.7 * FLOW.a) return false; DRAG = 'flow'; g.app.play(false); }
        else if (ev.type !== 'pointermove' || DRAG !== 'flow') return false;
        g.app.set({ thp: Math.round(Math.atan2(y, x) * 180 / PI) }); return true;
      }
      if (ev.viewId === 'cp' && CPV.P) {
        const P = CPV.P;
        if (ev.type === 'pointerdown') { if (!P.inside(X, Y)) return false; DRAG = 'cp'; }
        else if (ev.type !== 'pointermove' || DRAG !== 'cp') return false;
        g.app.set({ thp: Math.max(-180, Math.min(180, Math.round(P.ix(X)))) }); return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click the cylinder\'s surface (or the C_p curve) to put the purple probe there and see its pressure worked out.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Drag the circulation (the transport slider is the same Γ), click the surface to probe the pressure, and flip the Γ convention: only the printed sign changes.',
    controls: ['gam', 'U', 'a', 'conv', 'thp', 'band', 'frame'],
    readouts: ['G', 'th', 'L', 'D', 'spd'],
    callouts: [{ kind: 'try', html: 'Press 4πaU, then halve $U$: Γ stays, $\\Gamma/4\\pi aU$ doubles to 2 and the stagnation point leaves the body, while $L=\\rho U\\Gamma$ halves.' }]
  },
  explain: {
    html: s => explainHtml(s),
    live: s => { const n = N(s); return { gam: Viz.fmt(s.gam, { sig: 3 }), L: f3(fz(n.st.L, n.st.L_KJ)), th: stagText(n.st) }; }
  },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => {
    if ((key === 'U' || key === 'a') && USER_UA) {
      const r = LASTG / (4 * PI * s.a * s.U);
      if (isFinite(r)) { USER_UA = false; a.set({ gam: Math.max(-2, Math.min(2, r)) }); }
    }
    if (key === 'U' || key === 'a' || key === 'conv') { CUR = s; (a.controls && a.controls.gam || []).forEach(c => c.sync(s.gam)); }
  }
};
const app = Viz.app(CFG);
CUR = app.state; LASTG = N(app.state).G;
</script>
</body>
