    W.say(`<b>Left, the ζ-plane:</b> ${s.map === 'jk' ? 'the circle of radius $a$, the flow $w=U\\Big(\\zeta+\\frac{a^2}{\\zeta}\\Big)+\\frac{i\\Gamma}{2\\pi}\\ln(\\zeta/a)$ (6.68) round it — grey streamlines, dashed equipotentials, the black streamline $\\psi=0$' : 'a uniform flow net: <b class="c-blue">ψ-lines</b> solid, φ-lines dashed'}. <b>Right, the z-plane:</b> every point pushed through ${s.map === 'jk' ? '$z=\\zeta+b^2/\\zeta$ (6.65)' : `$${MAPS[s.map].tex}$`}. The <b class="c-orange">orange</b> and <b class="c-teal">teal</b> arms of the small cross and their images show the angle between two small steps; <b class="c-blue">blue</b> dots are the same particles in both planes.`) +
    W.hint('<b>Stretch round the circle</b> (hidden on phones) plots $|dz/d\\zeta|$ and the surface speed; §6 lists its numbers.');
  // 1
  o += W.step(1, 'The local stretch and turn') +
    W.say(`$\\delta w=\\frac{dw}{dz}\\delta z$ (6.63), with our map $z=f(\\zeta)$: $\\delta z=f'(\\zeta_0)\\,\\delta\\zeta$. At the cross $\\zeta_0=${ct(z0)}$ m:`) +
    W.line(`$${MAPS[s.map].fpTex}$` + (s.map === 'jk' ? ` $=1-1/(${ct(z0)})^2$` : s.map === 'z2' ? ` $=2(${ct(z0)})$` : ` $=e^{${ct(z0)}}$`), n.crit ? '0' : cf(n.fp), s.map === 'jk' ? 'the derivative of $z=\\zeta+b^2/\\zeta$ (6.65), b = 1 m' : 'the derivative of the map') +
    W.box(n.crit ? `$f'(\\zeta_0)=\\mathbf{0}$: a critical point — no single stretch or turn` : `stretch $|f'|=\\mathbf{${t3(n.mag)}}$, turn $\\arg f'=\\mathbf{${t3(n.turn)}^\\circ}$ — for every small step at $\\zeta_0$`);
  // 2
  o += W.step(2, 'Angles kept') +
    W.say(`$\\delta' w=\\frac{dw}{dz}\\delta' z$ (6.64) uses the <i>same</i> derivative, so both arms turn by the same $\\arg f'$:`) +
    W.line(`before: $\\alpha=${pn(s.erot + s.eang, 4)}^\\circ-${pn(s.erot, 4)}^\\circ$`, `${Math.round(s.eang)}°`, 'the angle between the orange and teal arms') +
    W.line(`after: $\\beta=\\arg(\\delta' z/\\delta z)$`, `${d1(n.betaDeg)}°`, 'measured from the exact images of two 10⁻⁵ m steps') +
    W.box(n.crit ? `$\\beta=2\\alpha$ here: at a critical point angles are <b>multiplied</b>, not kept` : `$\\alpha=\\beta=\\mathbf{${d1(n.betaDeg)}^\\circ}$ — fails only where $f'=0$ (${s.map === 'jk' ? '$\\zeta=\\pm b$' : s.map === 'z2' ? '$\\zeta=0$' : 'nowhere for $e^{\\zeta}$'})`);
  // 3
  o += W.step(3, 'The body') +
    W.say(`A point $\\zeta=ae^{i\\theta}$ on the circle goes to $z=ae^{i\\theta}+\\frac{b^2}{a}e^{-i\\theta}$ (6.66), the ellipse $\\frac{x^2}{(a+b^2/a)^2}+\\frac{y^2}{(a-b^2/a)^2}=1$ (6.67). With $a=${t3(a)}$ m, $b=1$ m:`) +
    W.line(`$A=a+b^2/a=${t3(a)}+1/${t3(a)}$`, f4(E.A) + ' m', 'semi-axis along x') +
    W.line(`$B=a-b^2/a=${t3(a)}-1/${t3(a)}$`, f4(E.B) + ' m', s.ab < 1.0005 ? 'zero: a flat plate' : 'semi-axis along y') +
    W.box(`foci $\\pm\\sqrt{A^2-B^2}=\\pm\\sqrt{${t4(E.A * E.A)}-${t4(E.B * E.B)}}=\\pm\\mathbf{${t3(E.foci)}}$ m $=\\pm2b$, for every $a$`);
  const CASES = [[1, 'flat plate'], [1.2, 'thin ellipse'], [1.5, 'ellipse'], [2, 'plump ellipse'], [3, 'almost a circle']];
  let cur = CASES.findIndex(c => Math.abs(c[0] - s.ab) < 0.005);
  const rowsT = CASES.map(c => { const e = ellipse(c[0]); return [`${c[0]}`, f3(e.A), f3(e.B), f3(e.thickness_ratio), c[1]]; });
  if (cur < 0) { rowsT.push([`${pn(s.ab, 3)} (yours)`, f3(E.A), f3(E.B), f3(E.thickness_ratio), 'your setting']); cur = rowsT.length - 1; }
  o += W.table(['$a/b$', '$A$ [m]', '$B$ [m]', '$B/A$', 'body'], rowsT, cur);
  // 4
  const r1 = n.stO.zeta, r2 = n.other, pz = [s.px, s.py];
  o += W.step(4, 'Back from z to ζ') +
    W.say(`$\\zeta=\\tfrac12z+\\tfrac12(z^2-4b^2)^{1/2}$ (6.69) at the probe $z=${ct(pz)}$ m has two roots:`) +
    W.line(`$\\zeta_1=\\tfrac12\\big[z+\\sqrt{z-2b}\\sqrt{z+2b}\\big]$`, `${cf(r1)} (|ζ| ${f3(n.stO.zeta_abs)} m)`, 'the product of principal roots: its only cut is the slit') +
    W.line(`$\\zeta_2=b^2/\\zeta_1$`, `${cf(r2)} (|ζ| ${f3(cabs(r2))} m)`, 'the roots multiply to b², so one is outside |ζ| = b, one inside') +
    W.line(`numpy: $\\tfrac12\\big[z+\\sqrt{z^2-4b^2}\\big]$`, `${cf(n.stP.zeta)} (|ζ| ${f3(n.stP.zeta_abs)} m)`, s.px < 0 ? 'Re z < 0: the principal root picks the inside root' : 'Re z > 0: here numpy happens to pick the outside root') +
    W.box(`${s.branch === 'principal' ? 'chosen (numpy)' : 'chosen (outside)'}: $|\\zeta|=\\mathbf{${t3(n.st.zeta_abs)}}$ m ${n.st.inside ? '$<a$ — inside the circle ⚠️' : '$\\ge a$ — in the fluid ✓'}`);
  // 5
  const st = n.st;
  o += W.step(5, 'Velocity by the chain rule') +
    W.say(`$u-iv=\\frac{dw}{d\\zeta}\\frac{d\\zeta}{dz}$ with $w=U\\Big(\\zeta+\\frac{a^2}{\\zeta}\\Big)+\\frac{i\\Gamma}{2\\pi}\\ln(\\zeta/a)$ (6.68), $U=1$ m/s, clockwise $\\Gamma=${t3(s.G)}$ m²/s${Math.abs(s.al) > 1e-9 ? `, stream turned by $\\alpha=${pn(s.al, 3)}^\\circ$` : ''}:`) +
    W.line(`$dW/d\\zeta$ at the chosen root`, cf(st.dw), 'the circle flow\'s complex velocity there') +
    W.line(`$d\\zeta/dz=1/(1-b^2/\\zeta^2)$`, cf(st.dzeta), 'where the map squeezes, the flow speeds up') +
    W.box(`$u-iv=\\mathbf{${ct(st.q)}}$ ⇒ $u=${t3(st.u)}$, $v=${t3(st.v)}$ m/s, speed ${f3(Math.hypot(st.u, st.v))} m/s`);
  // 6
  o += W.step(6, 'Stretch round the circle') +
    W.line(`$|dz/d\\zeta|$ at $\\theta=0^\\circ,\\pm180^\\circ$: $1-b^2/a^2$`, f3(1 - 1 / (s.ab * s.ab)), 'smallest: the ellipse\'s sharp ends') +
    W.line(`$|dz/d\\zeta|$ at $\\theta=\\pm90^\\circ$: $1+b^2/a^2$`, f3(1 + 1 / (s.ab * s.ab)), 'largest: the flat top and bottom') +
    W.hint('On phones this view is hidden; turn the phone sideways or read the numbers here.');
  // 7
  o += W.step(7, 'Right now') +
    W.line('tracer clock $t$', Viz.live('t') + ' s', 'the dots are the same particles in both planes; ▶ runs them') +
    W.line('particles on screen', Viz.live('np'), 'lanes that hit a stagnation point wait there');
  o += W.interpret(interpText(s), 'Reading the current setting');
  return o;
}

/* ---- selftest: parity with fluidpy (py) and invariants (expect) ---------------------------------------------------- */
function selftestRows() {
  const P0 = { a: 1.2, b: 1, U: 1, G: 0, al: 0 }, P1 = { a: 1.2, b: 1, U: 1, G: 1, al: 0 }, P2 = { a: 1.2, b: 1, U: 1, G: 1, al: 0.2 };
  const JS = (S, x, y, br) => jkState(S, x, y, br);
  const PY = (G, x, y, br) => `ch06.joukowski_state(a=1.2, b=1.0, U=1.0, Gamma_cw=${G}, x=${x}, y=${y}, branch="${br}")`;
  const e45 = cpol(1, PI / 4), e20 = cpol(1, 20 * D2R), e110 = cpol(1, 110 * D2R);
  const zz = []; for (let i = 0; i < 41; i++) for (let j = 0; j < 41; j++) { const x = -4 + 3.5 * i / 40, y = -2 + 4 * j / 40; if (Math.abs(y) > 1e-9) zz.push([x, y]); }
  const bad = zz.filter(z => cabs(jkInv(z, 1, 'principal')) < 1).length / zz.length;
  const rt = zz.map(z => cabs(csub(jk(jkInv(z, 1, 'outside')), z))).reduce((m, q) => Math.max(m, q), 0);
  return [
    { name: 'semi-axis A (a 1.2)', js: ellipse(1.2, 1).A, py: 'ch06.joukowski_ellipse(1.2, 1.0)["A"]', rtol: 1e-14 },
    { name: 'semi-axis B (a 1.2)', js: ellipse(1.2, 1).B, py: 'ch06.joukowski_ellipse(1.2, 1.0)["B"]', rtol: 1e-14 },
    { name: 'foci (a 1.2)', js: ellipse(1.2, 1).foci, py: 'ch06.joukowski_ellipse(1.2, 1.0)["foci"]', rtol: 1e-14 },
    { name: 'thickness ratio (a 3)', js: ellipse(3, 1).thickness_ratio, py: 'ch06.joukowski_ellipse(3.0, 1.0)["thickness_ratio"]', rtol: 1e-14 },
    { name: 'outside |zeta| at -3+0.5i', js: JS(P0, -3, 0.5, 'outside').zeta_abs, py: PY('0.0', '-3.0', '0.5', 'outside') + '["zeta_abs"]', rtol: 1e-12 },
    { name: 'principal |zeta| at -3+0.5i', js: JS(P0, -3, 0.5, 'principal').zeta_abs, py: PY('0.0', '-3.0', '0.5', 'principal') + '["zeta_abs"]', rtol: 1e-12 },
    { name: 'outside zeta_re at -3+0.5i', js: JS(P0, -3, 0.5, 'outside').zeta_re, py: PY('0.0', '-3.0', '0.5', 'outside') + '["zeta_re"]', rtol: 1e-12 },
    { name: 'principal zeta_im at -3+0.5i', js: JS(P0, -3, 0.5, 'principal').zeta_im, py: PY('0.0', '-3.0', '0.5', 'principal') + '["zeta_im"]', rtol: 1e-12 },
    { name: 'u at probe 0.5+1.5i (Gamma 1)', js: JS(P1, 0.5, 1.5, 'outside').u, py: PY('1.0', '0.5', '1.5', 'outside') + '["u"]', rtol: 1e-10 },
    { name: 'v at probe 0.5+1.5i (Gamma 1)', js: JS(P1, 0.5, 1.5, 'outside').v, py: PY('1.0', '0.5', '1.5', 'outside') + '["v"]', rtol: 1e-10 },
    { name: 'u, wrong branch at -3+0.5i', js: JS(P0, -3, 0.5, 'principal').u, py: PY('0.0', '-3.0', '0.5', 'principal') + '["u"]', rtol: 1e-10 },
    { name: 'u left of body, outside branch (Gamma 1)', js: JS(P1, -2.5, -0.8, 'outside').u, py: PY('1.0', '-2.5', '-0.8', 'outside') + '["u"]', rtol: 1e-10 },
    { name: 'inverse outside Re at 1-2i', js: jkInv([1, -2], 1, 'outside')[0], py: 'ch06.joukowski_inverse(1-2j, 1.0).real', rtol: 1e-12 },
    { name: 'inverse outside Im at -1.5+0.2i', js: jkInv([-1.5, 0.2], 1, 'outside')[1], py: 'ch06.joukowski_inverse(-1.5+0.2j, 1.0).imag', rtol: 1e-12 },
    { name: 'forward map Im at 1+i', js: jk([1, 1])[1], py: 'ch06.joukowski(1+1j, 1.0).imag', rtol: 1e-14 },
    { name: 'dwdz Re with alpha 0.2 (elliptic_cylinder_flow)', js: ellFlowDwdz(P2, 0.5, 1.5)[0], py: 'ch06.elliptic_cylinder_flow(1.0, 1.2, 1.0, Gamma_cw=1.0, alpha=0.2).dwdz(0.5+1.5j).real', rtol: 1e-10 },
    { name: 'dwdz Im with alpha 0.2', js: ellFlowDwdz(P2, 0.5, 1.5)[1], py: 'ch06.elliptic_cylinder_flow(1.0, 1.2, 1.0, Gamma_cw=1.0, alpha=0.2).dwdz(0.5+1.5j).imag', rtol: 1e-10 },
    { name: 'psi at 0.5+1.5i (Gamma 1)', js: ellFlowPsi(P1, 0.5, 1.5), py: 'ch06.stream_function(ch06.elliptic_cylinder_flow(1.0, 1.2, 1.0, Gamma_cw=1.0), 0.5, 1.5)', rtol: 1e-10 },
    { name: 'stagnation image x (Gamma 1)', js: jk(stagZeta(P1)[1])[0], py: 'ch06.elliptic_cylinder_flow(1.0, 1.2, 1.0, Gamma_cw=1.0).stagnation[0].real', rtol: 1e-10 },
    { name: 'stagnation image y (Gamma 1)', js: jk(stagZeta(P1)[1])[1], py: 'ch06.elliptic_cylinder_flow(1.0, 1.2, 1.0, Gamma_cw=1.0).stagnation[0].imag', rtol: 1e-10 },
    { name: 'angle z^2 at 0 (45 deg doubles)', js: angles('z2', [0, 0], [1, 0], e45).beta, py: 'ch06.angle_preservation("square", None, 0j, 1+0j, np.exp(1j*np.pi/4))[1]', rtol: 1e-9 },
    { name: 'angle Zhukhovsky at 1+i (kept)', js: angles('jk', [1, 1], [1, 0], [0, 1]).beta, py: 'ch06.angle_preservation("joukowski", None, 1+1j, 1+0j, 1j, b=1.0)[1]', rtol: 1e-8 },
    { name: 'angle exp at 0.3+0.4i (kept)', js: angles('exp', [0.3, 0.4], e20, e110).beta, py: 'ch06.angle_preservation("exp", None, 0.3+0.4j, np.exp(1j*np.radians(20)), np.exp(1j*np.radians(110)))[1]', rtol: 1e-8 },
    { name: 'angle before (alpha) exp', js: angles('exp', [0.3, 0.4], e20, e110).alpha, py: 'ch06.angle_preservation("exp", None, 0.3+0.4j, np.exp(1j*np.radians(20)), np.exp(1j*np.radians(110)))[0]', rtol: 1e-12 },
    { name: 'invariant: roots multiply to b^2', js: cabs(cmul(jkInv([-3, 0.5], 1, 'outside'), jkInv([-3, 0.5], 1, 'principal'))), expect: 1, rtol: 1e-12 },
    { name: 'invariant: principal fails at every left-half point off the slit', js: bad, expect: 1, atol: 0 },
    { name: 'invariant: round trip joukowski(inverse(z)) = z', js: rt, expect: 0, atol: 1e-12 },
    { name: 'invariant: psi = 0 on the ellipse', js: ellFlowPsi(P1, ellipse(1.2).A * Math.cos(0.7), ellipse(1.2).B * Math.sin(0.7)), expect: 0, atol: 1e-12 },
    { name: 'invariant: no flow through the ellipse (u·n = 0)', js: (() => { const th = 1.1, E = ellipse(1.2), q = ellFlowDwdz(P1, E.A * Math.cos(th), E.B * Math.sin(th)); return q[0] * E.B * Math.cos(th) + (-q[1]) * E.A * Math.sin(th); })(), expect: 0, atol: 1e-12 },
    { name: 'invariant: far field z ~ zeta', js: cabs(csub(jkInv([200, 30], 1, 'outside'), [200, 30])), expect: 0, atol: 1e-2 }
  ];
}

    { label: 'a = 3b', set: { map: 'jk', ab: 3 }, title: 'almost a circle: the map is nearly the identity' },
    { label: 'Γ = 0', set: { G: 0 }, title: 'no circulation' },
    { label: 'wrong root', set: { map: 'jk', branch: 'principal', px: -3, py: 0.5 }, title: 'numpy\'s principal root: left-half points land inside the circle' },
    { label: 'z² at 0', set: { map: 'z2', ex: 0, ey: 0, erot: 0, eang: 45 }, title: 'a critical point: the angle doubles' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'AB', label: 'Semi-axes A, B', value: s => N(s).E.A, fmt: (x, s) => { const E = N(s || CUR).E; return `${f3(E.A)} / ${f3(E.B)} m`; } },
    { id: 'foci', label: 'Foci ±√(A²−B²)', value: s => N(s).E.foci, fmt: x => `±${f3(x)} m` },
    { id: 'zabs', label: '|ζ| at the probe', value: s => N(s).st.zeta_abs, unit: 'm', tone: (x, s) => (N(s || CUR).st.inside ? 'neg' : 'pos') },
    { id: 'ang', label: 'Angle kept?', value: s => N(s).betaDeg, fmt: (x, s) => `${Math.round((s || CUR).eang)}° → ${d1(x)}°` },
    { id: 'fp', label: 'Stretch, turn f′', value: s => N(s).mag, fmt: (x, s) => (N(s || CUR).crit ? '0 (critical)' : `×${f3(x)} · ${d1(N(s || CUR).turn)}°`) },
    { id: 'uv', label: 'Velocity at probe', value: s => N(s).st.u, fmt: (x, s) => { const st = N(s || CUR).st; return `${f3(st.u)}, ${f3(st.v)} m/s`; } }
  ],
  stage: {
    rows: [1.35, 1],
    views: [
      { id: 'zeta', row: 0, flex: 1, title: s => zetaTitle(s) },
      { id: 'z', row: 0, flex: 1, title: s => zTitle(s) },
      { id: 'jac', row: 1, flex: 1, hidePortrait: true, title: s => jacTitle(s) }
    ],
    draw(g, s) {
      CUR = s;
      const n = N(s), e = extentOf(s), vz = g.view('zeta'), vw = g.view('z');
      vz.clear(); vw.clear(); VW.zeta = VW.z = null;
      const okZ = vz.w >= 40 && vz.h >= 40, okW = vw.w >= 40 && vw.h >= 40;
      const Pz = okZ ? planePlot(vz, e.zx, e.zy, ['Re ζ [m]', 'Im ζ [m]']) : null;
      const Pw = okW ? planePlot(vw, e.wx, e.wy, ['x [m]', 'y [m]']) : null;
      VW.zeta = Pz; VW.z = Pw;
      let trc = [];
      if (s.map === 'jk' && (Pz || Pw)) {
        const ref = Pw || Pz, xl = [Math.min(ref.xlim[0], Pz ? Pz.xlim[0] : 0) - 1, Math.max(ref.xlim[1], Pz ? Pz.xlim[1] : 0) + 1];
        const yl = [Math.min(ref.ylim[0], Pz ? Pz.ylim[0] : 0) - 1, Math.max(ref.ylim[1], Pz ? Pz.ylim[1] : 0) + 1];
        const dpsi = Math.max(0.2, e.R / 8);
        VW.net = flowNet(n.S, xl, yl, dpsi);
        VW.wrong = s.branch === 'principal' && Pw ? wrongNet(n.S, Pw.xlim, Pw.ylim, dpsi) : null;
        trc = tracersAt(n.S, Math.max(e.R, Pw ? Math.max(-Pw.xlim[0], Pw.ylim[1]) : e.R), s.t);
      } else {
        const lines = gridLines(s).filter(L => L.kind === 'psi'), Lx = e.zx[1] - e.zx[0];
        lines.forEach(L => { for (let m = 0; m < 4; m++) { const x = e.zx[0] + (((0.3 * s.t + m * Lx / 4) % Lx) + Lx) % Lx; trc.push({ zeta: [x, L.c] }); } });
      }
      VW.np = trc.length;
      if (Pz) drawZeta(g, s, Pz, n, trc);
      if (Pw) drawZ(g, s, Pw, n, trc);
      drawJac(g, s);
    },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel' || ev.type === 'pointerleave') { const was = !!DRAG; DRAG = null; return was; }
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.viewId === 'zeta' && VW.zeta) {
        const P = VW.zeta;
        if (ev.type === 'pointerdown') { if (!P.inside(X, Y)) return false; DRAG = 'zeta'; }
        else if (ev.type !== 'pointermove' || DRAG !== 'zeta') return false;
        let x = P.ix(X), y = P.iy(Y);
        const snaps = s.map === 'jk' ? [[BB, 0], [-BB, 0]] : s.map === 'z2' ? [[0, 0]] : [];
        snaps.forEach(q => { if (Math.hypot(x - q[0], y - q[1]) < 0.08 * (P.xlim[1] - P.xlim[0]) / 3.2) { x = q[0]; y = q[1]; } });
        g.app.set({ ex: Math.round(x * 100) / 100, ey: Math.round(y * 100) / 100 }); return true;
      }
      if (ev.viewId === 'z' && VW.z && s.map === 'jk') {
        const P = VW.z;
        if (ev.type === 'pointerdown') { if (!P.inside(X, Y)) return false; DRAG = 'z'; }
        else if (ev.type !== 'pointermove' || DRAG !== 'z') return false;
        g.app.set({ px: Math.round(P.ix(X) * 100) / 100, py: Math.round(P.iy(Y) * 100) / 100 }); return true;
      }
      if (ev.viewId === 'jac' && VW.jac && s.map === 'jk' && ev.type === 'pointerdown') {
        const P = VW.jac; if (!P.inside(X, Y)) return false;
        const th = P.ix(X) * D2R; g.app.set({ ex: Math.round(s.ab * Math.cos(th) * 100) / 100, ey: Math.round(s.ab * Math.sin(th) * 100) / 100 }); return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Drag the cross in the ζ-plane (it snaps onto the critical points); click the z-plane to move the probe.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Drag the cross in the ζ-plane and watch its image; click the z-plane to probe the inverse root; switch the root to numpy\'s and watch the rose streamlines appear on the left.',
    controls: ['ab', 'G', 'branch', 'al', 'erot', 'eang'],
    readouts: ['AB', 'zabs', 'ang', 'fp', 'uv', 'foci'],
    callouts: [{ kind: 'try', html: 'Choose <b>numpy principal</b>, then click the z-plane left and right of the body: $|\\zeta|$ drops below $a$ exactly when $\\mathrm{Re}\\,z<0$.' }]
  },
  explain: {
    html: s => explainHtml(s),
    live: s => ({ t: (s.t || 0).toFixed(2), np: String(VW.np || 0) })
  },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => {
    if (key === 'map' && s.map === 'jk' && Math.hypot(s.ex, s.ey) < 0.35) a.set({ ex: 1, ey: 1 });
  }
};
let DRAG = null;
const app = Viz.app(CFG);
CUR = app.state;
</script>
</body>
