.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }

.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }

.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }

.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }

    W.line('$r_1=\\dfrac{\\partial\\phi}{\\partial x}-\\dfrac{\\partial\\psi}{\\partial y}=' + tp(q.qx.re) + '-' + tp(q.qy.re) + '$', f3(q.cr1) + ' m/s') +
    W.line('$r_2=\\dfrac{\\partial\\phi}{\\partial y}+\\dfrac{\\partial\\psi}{\\partial x}=' + tp(-q.qy.im) + '+' + tp(q.qx.im) + '$', f3(q.cr2) + ' m/s') +
    W.box(conj ? '$r_1=2$: Cauchy–Riemann fails, so $x$ and $-y$ are not a flow\'s $\\phi$ and $\\psi$' : 'both $\\approx0$ (up to the $h^2$ error): $\\phi$ and $\\psi$ are locked together, and both obey Laplace\'s equation');
  if (s.kind === 'corner') {
    const al = alphaOf(s);
    o += W.step(5, 'The corner') +
      W.line('$\\alpha=\\pi/n=180^\\circ/' + t3(s.n) + '$', f3(deg(al)) + '°', 'walls where $\\psi=Ar^n\\sin n\\theta=0$: $\\theta=0$ and $\\theta=\\pi/n$') +
      W.line('speed exponent $n-1=(\\pi-\\alpha)/\\alpha$', f3(speedExp(s.n)), 'from $dw/dz=nAz^{n-1}$, so $|dw/dz|=nAr^{n-1}$') +
      W.box(s.n > 1 + 1e-9 ? 'positive: the speed <b>vanishes</b> at the tip — a stagnation point' : s.n > 1 - 1e-9 ? 'zero: the speed is the same everywhere — no corner' : 'negative: the speed <b>blows up</b> at the tip');
  } else if (!conj) {
    o += W.step(5, 'How fast near the centre') +
      W.say(s.kind === 'cylinder' ? 'The cylinder has no power law: along your ray the speed tends to $U=1$ m/s far away and differs from it near the surface.' : `Along any ray $|dw/dz|\\propto r^{${s.kind === 'doublet' ? '-2' : '-1'}}$: infinite at the centre, a singular point.`);
  }
  o += W.step(6, 'Speed near the tip') + W.say(conj ? 'No speed for $z^*$: it is not a flow.' : 'The third view plots $\\log_{10}|dw/dz|$ against $\\log_{10}r$ along the ray through your probe (the purple dot): a straight line of slope $n-1=(\\pi-\\alpha)/\\alpha$ for a corner. Grey dashed is the $n=2$ corner, slope 1.');
  o += W.interpret(interpText(s), 'Reading the current setting');
  return o;
}

/* ---- selftest: parity with fluidpy.ch06 (py) and invariants (expect) --------------------------------------------------------- */
function selftestRows() {
  const P2 = { A: 1, n: 2, h: 1e-4 };
  const pa = (k, x, y, P) => probe(k, x, y, P);
  return [
    { name: 'dwdz re z^2 at 1+i', js: pa('corner', 1, 1, P2).dw.re, py: 'ch06.complex_potential_probe("corner", 1.0, 1.0, A=1.0, n=2.0)["dwdz_re"]', rtol: 1e-12 },
    { name: 'v z^2 at 1+i', js: pa('corner', 1, 1, P2).v, py: 'ch06.complex_potential_probe("corner", 1.0, 1.0)["v"]', rtol: 1e-12 },
    { name: 'psi z^2 at 1.2+0.5i', js: pa('corner', 1.2, 0.5, P2).psi, py: 'ch06.complex_potential_probe("corner", 1.2, 0.5)["psi"]', rtol: 1e-12 },
    { name: 'CR for conj', js: pa('conj', 0.7, 0.2, P2).cr1, py: 'ch06.complex_potential_probe("conj", 0.7, 0.2)["cr1"]', rtol: 1e-9 },
    { name: 'CR residual function, conj', js: crResidual('conj', 0.7, 0.2, P2)[0], py: 'ch06.cauchy_riemann_residual("conj", 0.7+0.2j)[0]', rtol: 1e-9 },
    { name: 'speed exponent n=2/3', js: speedExp(2 / 3), py: 'ch06.corner_speed_exponent(0.6666666666666666)', rtol: 1e-14 },
    { name: 'speed exponent n=0.5', js: speedExp(0.5), py: 'ch06.corner_speed_exponent(0.5)', rtol: 1e-14 },
    { name: 'qx along x n=0.5', js: pa('corner', 0.3, 0.8, { A: 1, n: 0.5, h: 1e-4 }).qx.re, py: 'ch06.complex_potential_probe("corner", 0.3, 0.8, n=0.5, h=0.0001)["qx_re"]', rtol: 1e-10 },
    { name: 'psi n=0.5 below the plate (branch)', js: pa('corner', 0.3, -0.8, { A: 1, n: 0.5, h: 1e-4 }).psi, py: 'ch06.complex_potential_probe("corner", 0.3, -0.8, n=0.5)["psi"]', rtol: 1e-12 },
    { name: 'dwdz im n=2/3, third quadrant', js: pa('corner', -0.5, -0.9, { A: 1, n: 2 / 3, h: 0.3 }).dw.im, py: 'ch06.complex_potential_probe("corner", -0.5, -0.9, n=0.6666666666666666, h=0.3)["dwdz_im"]', rtol: 1e-12 },
    { name: 'qy im n=2/3, h 0.3', js: pa('corner', -0.5, -0.9, { A: 1, n: 2 / 3, h: 0.3 }).qy.im, py: 'ch06.complex_potential_probe("corner", -0.5, -0.9, n=0.6666666666666666, h=0.3)["qy_im"]', rtol: 1e-10 },
    { name: 'cr1 n=2/3, h 0.3 (finite step)', js: pa('corner', -0.5, -0.9, { A: 1, n: 2 / 3, h: 0.3 }).cr1, py: 'ch06.complex_potential_probe("corner", -0.5, -0.9, n=0.6666666666666666, h=0.3)["cr1"]', rtol: 1e-9 },
    { name: 'z^3 along iy at h 0.4 (D14 picture)', js: pa('corner', 1, 0.3, { A: 1, n: 3, h: 0.4 }).qy.re, py: 'ch06.complex_potential_probe("corner", 1.0, 0.3, n=3.0, h=0.4)["qy_re"]', rtol: 1e-12 },
    { name: 'invariant: z^3 quotients miss by +h^2 and -h^2', js: (q => (q.qx.re - q.dw.re) + (q.qy.re - q.dw.re) + Math.abs(q.qx.re - q.dw.re - 0.16))(pa('corner', 1, 0.3, { A: 1, n: 3, h: 0.4 })), expect: 0, atol: 1e-12 },
    { name: 'corner A=2.5, n=3 u', js: pa('corner', 0.9, 0.4, { A: 2.5, n: 3, h: 1e-4 }).u, py: 'ch06.complex_potential_probe("corner", 0.9, 0.4, A=2.5, n=3.0)["u"]', rtol: 1e-12 },
    { name: 'source phi', js: pa('source', 1.2, 0.5, P2).phi, py: 'ch06.complex_potential_probe("source", 1.2, 0.5)["phi"]', rtol: 1e-12 },
    { name: 'source psi', js: pa('source', 1.2, 0.5, P2).psi, py: 'ch06.complex_potential_probe("source", 1.2, 0.5)["psi"]', rtol: 1e-12 },
    { name: 'source qx re, h 0.3', js: pa('source', 1.2, 0.5, { h: 0.3 }).qx.re, py: 'ch06.complex_potential_probe("source", 1.2, 0.5, h=0.3)["qx_re"]', rtol: 1e-12 },
    { name: 'vortex u', js: pa('vortex', 1.2, 0.5, P2).u, py: 'ch06.complex_potential_probe("vortex", 1.2, 0.5)["u"]', rtol: 1e-12 },
    { name: 'vortex phi', js: pa('vortex', 1.2, 0.5, P2).phi, py: 'ch06.complex_potential_probe("vortex", 1.2, 0.5)["phi"]', rtol: 1e-12 },
    { name: 'doublet v', js: pa('doublet', 1.2, 0.5, P2).v, py: 'ch06.complex_potential_probe("doublet", 1.2, 0.5)["v"]', rtol: 1e-12 },
    { name: 'cylinder psi', js: pa('cylinder', 1.2, 0.5, P2).psi, py: 'ch06.complex_potential_probe("cylinder", 1.2, 0.5)["psi"]', rtol: 1e-12 },
    { name: 'cylinder qy re, h 0.3', js: pa('cylinder', 1.2, 0.5, { h: 0.3 }).qy.re, py: 'ch06.complex_potential_probe("cylinder", 1.2, 0.5, h=0.3)["qy_re"]', rtol: 1e-12 },
    { name: 'conj qy re', js: pa('conj', 0.7, 0.2, P2).qy.re, py: 'ch06.complex_potential_probe("conj", 0.7, 0.2)["qy_re"]', rtol: 1e-9 },
    { name: 'invariant: analytic, CR residual ~ 0 (h 1e-4)', js: Math.abs(pa('corner', 0.3, 0.8, { A: 1, n: 0.5, h: 1e-4 }).cr1), expect: 0, atol: 1e-7 },
    { name: 'invariant: velocity = mirror of dw/dz', js: (q => q.v + q.dw.im)(pa('doublet', -0.7, 0.9, P2)), expect: 0, atol: 1e-15 },
    { name: 'invariant: z^2 central quotient exact at h 0.5', js: pa('corner', 1.2, 0.5, { A: 1, n: 2, h: 0.5 }).qx.re - 2.4, expect: 0, atol: 1e-12 },
    { name: 'invariant: log-log slope = n - 1 (n 2/3)', js: (() => { const F = family('corner', { A: 1, n: 2 / 3 }), th = 2; const sp = r => cabs(F.dw(cx(r * Math.cos(th), r * Math.sin(th)))); return Math.log10(sp(1e-2) / sp(1e-3)); })(), expect: -1 / 3, atol: 1e-12 },
    { name: 'invariant: probe kept inside the wedge (n 3)', js: (z => (z.th >= 0 && z.th <= PI / 3 ? 1 : 0))(probeZ({ kind: 'corner', n: 3, A: 1, x: -1, y: 1, sig: 2 })), expect: 1, atol: 0 },
    { name: 'invariant: step across the vortex cut detected', js: crossesCut({ kind: 'vortex', n: 2, A: 1, x: -1.2, y: 0.1, sig: 0.8 }) ? 1 : 0, expect: 1, atol: 0 }
  ];
}

/* ---- the app ------------------------------------------------------------------------------------------------------------------ */
const CFG = {
  title: 'Why is the velocity u − iv?',
  subtitle: 'One complex function w draws streamlines and equipotentials; its derivative, taken along x or along iy, is the velocity mirrored — and a corner turns calm or violent with the exponent n',
  autoplay: false,
  params: {
    n: { label: 'Exponent $n$ (corner $\\alpha=\\pi/n$)', min: 0.5, max: 4, step: 0.01, value: 2, fmt: v => Viz.fmt(v, { sig: 3 }) + ' → α ' + Viz.fmt(180 / v, { sig: 3 }) + '°', help: 'n = 2: right-angle corner; n = ½: the edge of a plate' },
    sig: { label: 'Step $h=10^{-\\sigma}$', min: 0.3, max: 6, step: 0.01, value: 2, fmt: v => 'h = ' + Viz.fmt(Math.pow(10, -v), { sig: 2 }) + ' m', help: 'the size of the difference step; or click the quotient view' },
    A: { label: 'Strength $A$', min: 0.2, max: 3, step: 0.01, value: 1, unit: 'm^(2−n)/s', optional: true, help: 'scales w, so every velocity' },
    x: { label: 'Probe $x$', min: -2.2, max: 2.4, step: 0.01, value: 1.2, unit: 'm', optional: true, help: 'or click the z-plane' },
    y: { label: 'Probe $y$', min: -2.2, max: 2.4, step: 0.01, value: 0.5, unit: 'm', optional: true }
  },
  modes: { param: 'kind', label: 'w(z)', options: [['corner', 'Azⁿ'], ['source', 'source'], ['vortex', 'vortex'], ['doublet', 'doublet'], ['cylinder', 'cylinder'], ['conj', 'z*']] },
  presets: [
    { label: 'n = 2', set: { kind: 'corner', n: 2, x: 1.2, y: 0.5 }, title: 'the right-angle stagnation corner, ψ = 2Axy' },
    { label: 'n = 1', set: { kind: 'corner', n: 1, x: 1.2, y: 0.5 }, title: 'no corner: a uniform stream along a wall' },
    { label: 'n = ⅔', set: { kind: 'corner', n: 0.6667, x: -0.5, y: -0.9 }, title: 'a 270° corner (Example 6.2)' },
    { label: 'n = ½', set: { kind: 'corner', n: 0.5, x: -0.6, y: 0.7 }, title: 'the edge of a flat plate' },
    { label: 'z*', set: { kind: 'conj' }, title: 'not analytic: not a flow' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'dw', label: '$dw/dz$', unit: 'm/s', value: s => now(s).speed, fmt: (v, s) => s.kind === 'conj' ? 'none (z*)' : cstr(now(s).dw) + ' m/s' },
    { id: 'uv', label: 'Velocity $u$, $v$', unit: 'm/s', value: s => now(s).u, fmt: (v, s) => s.kind === 'conj' ? 'none' : f3(now(s).u) + ', ' + f3(now(s).v) + ' m/s' },
    { id: 'alpha', label: 'Corner angle $\\alpha$', unit: '°', value: s => deg(alphaOf(s)), fmt: (v, s) => s.kind === 'corner' ? f3(v) + '°' : '—' },
    { id: 'sexp', label: 'Speed exponent', unit: '', value: s => speedExp(s.n), fmt: (v, s) => s.kind === 'corner' ? 'r^' + f3(v) : s.kind === 'doublet' ? 'r^−2' : (s.kind === 'source' || s.kind === 'vortex') ? 'r^−1' : '—' },
    { id: 'cr1', label: 'CR residual $r_1$', unit: 'm/s', value: s => now(s).cr1 }
  ],
  stage: {
    animate: true,
    rows: [1.25, 1],
    views: [
      { id: 'plane', row: 0, flex: 1.25, title: s => planeTitle(s) },
      { id: 'loglog', row: 0, flex: 1, hidePortrait: true, title: s => loglogTitle(s) },
      { id: 'quot', row: 1, flex: 1, title: s => quotTitle(s) }
    ],
    setup(g, s) { TR = null; TRKEY = ''; },
    reset(g, s) { TR = null; TRKEY = ''; },
    step(g, s, dt) { const T = ensureTracers(s, PL.P); if (T) T.step(Math.min(dt, 0.05), 0); },
    draw(g, s) { CUR = s; drawPlane(g, s); drawLoglog(g, s); drawQuot(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel' || ev.type === 'pointerleave') { const was = !!DRAG; DRAG = null; return was; }
      if (ev.viewId === 'plane' && PL.P) {
        const P = PL.P, setZ = () => { const z = probeZ(Object.assign({}, s, { x: P.ix(X), y: P.iy(Y) })); g.app.set({ x: Math.round(z.x * 1000) / 1000, y: Math.round(z.y * 1000) / 1000 }); };
        if (ev.type === 'pointermove') { if (DRAG !== 'plane') return false; setZ(); return true; }
        if (ev.type !== 'pointerdown' || !P.inside(X, Y)) return false;
        DRAG = 'plane'; setZ(); return true;
      }
      if (ev.viewId === 'quot' && QV.P) {
        const P = QV.P, setS = () => g.app.set({ sig: Math.round(clamp(P.ix(X), 0.3, 6) * 100) / 100 });
        if (ev.type === 'pointermove') { if (DRAG !== 'quot') return false; setS(); return true; }
        if (ev.type !== 'pointerdown' || !P.inside(X, Y)) return false;
        DRAG = 'quot'; setS(); return true;
      }
      if (ev.viewId === 'loglog' && LL.P) {
        if (ev.type !== 'pointerdown' || !LL.P.inside(X, Y)) return false;
        const r = clamp(Math.pow(10, LL.P.ix(X)), 0.06, 2.2);
        g.app.set({ x: Math.round(r * Math.cos(LL.th) * 1000) / 1000, y: Math.round(r * Math.sin(LL.th) * 1000) / 1000 });
        return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click the z-plane to move the probe; the arithmetic of both quotients appears here.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Pick a $w$ above the picture, click the plane to move the probe ✚, and drag $n$ to bend the corner. Press ▶ to let the fluid move.',
    controls: ['n', 'sig', 'A', 'x', 'y'],
    readouts: ['dw', 'uv', 'alpha', 'sexp'],
    callouts: [{ kind: 'try', html: 'Predict, then check: at which $n$ does the tip turn from calm to violent? Watch the slope of the log–log line change sign.' }]
  },
  explain: { html: s => explainHtml(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => {
    CUR = s;
    if (key === 'kind') { applyMode(a); a.fit(); }
    if (key === 'kind' || key === 'n') {
      const z = probeZ(s);
      if (Math.abs(z.x - s.x) > 1e-9 || Math.abs(z.y - s.y) > 1e-9) { s.x = Math.round(z.x * 1000) / 1000; s.y = Math.round(z.y * 1000) / 1000; ['x', 'y'].forEach(k => (a.controls && a.controls[k] || []).forEach(c => c.sync(s[k]))); }
    }
  }
};
let DRAG = null;
function applyMode(a) {
  const corner = a.state.kind === 'corner';
  ['n', 'A'].forEach(k => document.querySelectorAll('.viz-side [data-viz-key="param:' + k + '"]').forEach(el => el.classList.toggle('cpc-off', !corner)));
  ['alpha'].forEach(k => document.querySelectorAll('.viz-side [data-viz-key="readout:' + k + '"]').forEach(el => el.classList.toggle('cpc-off', !corner)));
}
const app = Viz.app(CFG);
CUR = app.state;
applyMode(app); app.fit();
</script>
</body>
</html>
