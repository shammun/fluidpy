/* ---- selftest: parity with fluidpy.ch06 (py) and invariants (expect) ------------------------------------------------ */
function selftestRows() {
  const solR20 = axialState('rankine', 20).sol, solR10 = axialState('rankine', 10).sol, E3 = ellipsoidK(1, 1, 1 / 3);
  const P16 = panelState('ellipse', 16);
  const PYS = (t, N, extra = '') => `ch06.axial_state("${t}", N=${N}${extra})`;
  const PYSOL = (t, N) => `ch06.PN.axial_singularity_solve(*ch06.axisym_body_target("${t}", N=${N}), 1.0, ${N})`;
  return [
    { name: 'airship length (U = Q = a = 1)', js: airship(1, 1, 1).length, py: 'ch06.airship(1.0, 1.0, 1.0)["length"]', rtol: 1e-9 },
    { name: 'airship nose', js: airship(1, 1, 1).z_nose, py: 'ch06.airship(1.0, 1.0, 1.0)["z_nose"]', rtol: 1e-9 },
    { name: 'airship R_max', js: airship(1, 1, 1).R_max, py: 'ch06.airship(1.0, 1.0, 1.0)["R_max"]', rtol: 1e-9 },
    { name: 'airship length U = 2', js: airship(2, 1, 1).length, py: 'ch06.airship(2.0, 1.0, 1.0)["length"]', rtol: 1e-9 },
    { name: 'line sink psi, closed form, R 0.3 z -0.5', js: lineSinkPsi(0.3, -0.5, 1, 1), py: 'ch06.line_sink_stream_function(0.3, -0.5, 1.0, 1.0)', rtol: 1e-12 },
    { name: 'line sink psi, closed form vs quad', js: lineSinkPsi(0.2, 0.4, 2, 1.5), py: 'ch06.line_sink_stream_function(0.2, 0.4, 2.0, 1.5, method="quad")', rtol: 1e-9 },
    { name: 'target radius, airship N=12, point 6', js: target('airship', 12).Rb[5], py: 'ch06.axisym_body_target("airship", N=12)[1][5]', rtol: 1e-10 },
    { name: 'target radius, Rankine N=10, point 3', js: target('rankine', 10).Rb[2], py: 'ch06.axisym_body_target("rankine_oval", N=10)[1][2]', rtol: 1e-10 },
    { name: 'k_3, Rankine N=10', js: solR10.k[2], py: PYSOL('rankine_oval', 10) + '["k"][2]', rtol: 1e-9 },
    { name: 'body error, ellipsoid N=10', js: axialState('ellipsoid', 10).err, py: PYS('ellipsoid', 10) + '["body_error"]', rtol: 1e-6 },
    { name: 'cond1, ellipsoid N=10', js: axialState('ellipsoid', 10).cond, py: PYS('ellipsoid', 10) + '["cond"]', rtol: 1e-8 },
    { name: 'body error, ellipsoid fineness 5, N=12', js: axialState('ellipsoid', 12, 1, 5).err, py: PYS('ellipsoid', 12, ', fineness=5.0') + '["body_error"]', rtol: 1e-6 },
    { name: 'body error, Rankine N=10', js: axialState('rankine', 10).err, py: PYS('rankine_oval', 10) + '["body_error"]', rtol: 1e-6 },
    { name: 'cond1, Rankine N=10', js: axialState('rankine', 10).cond, py: PYS('rankine_oval', 10) + '["cond"]', rtol: 1e-8 },
    { name: 'body error, Rankine N=20', js: axialState('rankine', 20).err, py: PYS('rankine_oval', 20) + '["body_error"]', rtol: 1e-6 },
    { name: 'cond1, Rankine N=20', js: axialState('rankine', 20).cond, py: PYS('rankine_oval', 20) + '["cond"]', rtol: 1e-6 },
    { name: 'body error, Rankine N=10, U=2', js: axialState('rankine', 10, 2).err, py: PYS('rankine_oval', 10, ', U=2.0') + '["body_error"]', rtol: 1e-6 },
    { name: 'net strength, airship N=12', js: axialState('airship', 12).net, py: PYS('airship', 12) + '["net_strength"]', rtol: 1e-6 },
    { name: 'k_max, airship N=12', js: axialState('airship', 12).kmax, py: PYS('airship', 12) + '["k_max"]', rtol: 1e-6 },
    { name: 'body error, airship N=12', js: axialState('airship', 12).err, py: PYS('airship', 12) + '["body_error"]', rtol: 1e-6 },
    { name: 'body error, sphere N=8', js: axialState('sphere', 8).err, py: PYS('sphere', 8) + '["body_error"]', rtol: 1e-5 },
    { name: 'moment m1, Rankine N=20', js: solR20.m1, py: PYSOL('rankine_oval', 20) + '["k"] @ (0.5*np.diff(' + PYSOL('rankine_oval', 20) + '["xi_nodes"]**2))', rtol: 1e-8 },
    { name: 'ellipsoid K (fineness 3)', js: E3.K, py: 'ch06.ellipsoid_linear_source_strength(1.0, 1.0, 0.3333333333333333)["K"]', rtol: 1e-12 },
    { name: 'panel C_p error, ellipse N=16', js: panelCpError(16, 'ellipse'), py: 'ch06.panel_cp_error(16, body="ellipse")', rtol: 1e-8 },
    { name: 'panel C_p error, ellipse N=64', js: panelCpError(64, 'ellipse'), py: 'ch06.panel_cp_error(64, body="ellipse")', rtol: 1e-7 },
    { name: 'panel strength lambda_8, ellipse N=16', js: P16.r.lam[7], py: 'ch06.PN.source_panels(np.cos(np.linspace(0, 2*np.pi, 16, endpoint=False) + np.pi/16), 0.5*np.sin(np.linspace(0, 2*np.pi, 16, endpoint=False) + np.pi/16), 1.0)["lam"][7]', rtol: 1e-10 },
    { name: 'invariant: circle panels exact (N=12)', js: panelCpError(12, 'circle'), expect: 0, atol: 1e-13 },
    { name: 'invariant: panel closure, ellipse N=16', js: P16.r.net, expect: 0, atol: 1e-12 },
    { name: 'invariant: Rankine N=10 closes', js: solR10.net, expect: 0, atol: 1e-11 },
    { name: 'invariant: Rankine m1 -> -2Qc', js: solR20.m1, expect: -2, rtol: 1e-3 },
    { name: 'invariant: ellipsoid m1 -> 2Kc^3/3 (N=20)', js: axialState('ellipsoid', 20).m1, expect: 2 * E3.K * E3.c ** 3 / 3, rtol: 1e-3 },
    { name: 'invariant: airship closure Q - ak', js: airship(1, 1, 1).closure, expect: 0, atol: 0 },
    { name: 'invariant: psi = 0 at a collocation point', js: axialPsi(solR10, target('rankine', 10).Rb[4], target('rankine', 10).zb[4]), expect: 0, atol: 1e-13 }
  ];
}

/* ---- the app ------------------------------------------------------------------------------------------------------ */
let VIS = '';
function applyVisibility(a) {
  const s = a.state, pan = s.mode === 'panels';
  const hide = { tgt: pan, fin: pan || s.tgt !== 'ellipsoid', U: pan, pb: !pan, Np: !pan };
  const rhide = { err: pan, net: pan, cond: pan, m1: pan, len: pan || s.tgt !== 'airship', cperr: !pan, pnet: !pan };
  Object.keys(hide).forEach(k => document.querySelectorAll('[data-viz-key="param:' + k + '"]').forEach(el => el.classList.toggle('asb-off', hide[k])));
  Object.keys(rhide).forEach(k => document.querySelectorAll('[data-viz-key="readout:' + k + '"]').forEach(el => el.classList.toggle('asb-off', rhide[k])));
  const root = document.querySelector('.viz-app'); if (root) root.classList.toggle('asb-panels', pan);
  const sig = JSON.stringify([hide, rhide]);
  if (sig !== VIS) { VIS = sig; if (typeof a.fit === 'function') a.fit(); }
}
const CFG = {
  title: 'Given a shape, which sources draw it?',
  subtitle: 'Unknown sources on the axis of a body of revolution, ψ = 0 at N body points, one linear solve — and how good and how touchy the answer is; or sources on the surface (2-D panels)',
  autoplay: false,
  params: {
    tgt: { type: 'select', label: 'Target body', options: [['airship', 'airship'], ['rankine', 'Rankine oval'], ['ellipsoid', 'ellipsoid'], ['sphere', 'sphere']], value: 'airship', display: 'chips' },
    N: { label: 'Segments $N$', min: NMIN, max: NMAX, step: 2, value: 12, fmt: v => `N = ${2 * Math.round(v / 2)}`, help: 'even N: for a fore–aft symmetric body an odd N makes the square system exactly singular (fluidpy falls back to least squares)' },
    fin: { label: 'Fineness $A/B$', min: 1.5, max: 6, step: 0.1, value: 3, optional: true, help: 'ellipsoid only: length over thickness (A = 1 m)' },
    U: { label: 'Stream $U$', min: 0.5, max: 3, step: 0.1, value: 1, unit: 'm/s', optional: true, help: 'Q = 1 m³/s is fixed: a faster stream gives a slimmer airship or oval' },
    pb: { type: 'select', label: 'Panel body', options: [['ellipse', 'ellipse (1 × 0.5 m)'], ['circle', 'circle (a = 1 m)']], value: 'ellipse', display: 'chips' },
    Np: { label: 'Panels $N$', min: 8, max: 128, step: 1, value: 16, fmt: v => `N = ${Math.round(v)}` },
    pm: { label: 'Probe point $m$', min: 1, max: 128, step: 1, value: 4, optional: true, fmt: v => `m = ${Math.round(v)}`, help: 'or click a black dot (body point) or a bar' },
    hl: { type: 'select', label: 'Derivation overlay', options: [['', 'none'], ['element', 'sink element'], ['angles', 'angles']], value: '', optional: true }
  },
  modes: { param: 'mode', options: [['axial', 'axial sources (§6.8)'], ['panels', '2-D panels (extension)']] },
  transport: { param: 'N', min: NMIN, max: NMAX, rate: 5, end: 'stop', unit: '' },
  presets: [
    { label: 'airship', set: { mode: 'axial', tgt: 'airship', N: 12 }, title: 'the target of the airship: a point source plus a line sink' },
    { label: 'Rankine oval', set: { mode: 'axial', tgt: 'rankine', N: 20 }, title: 'exact: a point source and a point sink' },
    { label: 'ellipsoid', set: { mode: 'axial', tgt: 'ellipsoid', N: 20, fin: 3 }, title: 'smooth: exact k = Kξ between the foci' },
    { label: 'sphere (hard)', set: { mode: 'axial', tgt: 'sphere', N: 20 }, title: 'a point doublet: ill-conditioned' },
    { label: 'panels 8', set: { mode: 'panels', pb: 'ellipse', Np: 8 }, title: '8 source panels on the ellipse' },
    { label: 'panels 64', set: { mode: 'panels', pb: 'ellipse', Np: 64 }, title: '64 source panels on the ellipse' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'err', label: 'Body error', value: s => AXS(s).err, fmt: x => fe(x) + ' m' },
    { id: 'net', label: 'Net Σkₙ\u0394ξ', value: s => AXS(s).net, fmt: x => fe(x) + ' m³/s' },
    { id: 'cond', label: 'cond₁(A)', value: s => AXS(s).cond, fmt: x => f3(x) },
    { id: 'm1', label: 'Moment m₁', value: s => AXS(s).m1, fmt: (x, s) => `${f4(x)} (exact ${f4(AXS(s || CUR).S.m1)}) m⁴/s` },
    { id: 'len', label: 'Airship length', value: s => airship(s.U, QS, AS).length, unit: 'm' },
    { id: 'cperr', label: 'Max Cₚ error', value: s => PNL(s).err, fmt: x => fe(x) },
    { id: 'pnet', label: 'Net Σλⱼ Sⱼ', value: s => PNL(s).r.net, fmt: x => fe(x) + ' m²/s' }
  ],
  stage: {
    rows: [1.25, 1],
    views: [
      { id: 'body', row: 0, flex: 1.5, title: s => bodyTitle(s) },
      { id: 'conv', row: 0, flex: 1, hidePortrait: true, title: s => convTitle(s) },
      { id: 'bars', row: 1, flex: 1, title: s => barsTitle(s) }
    ],
    draw(g, s) {
      CUR = s;
      if (s.mode === 'panels') drawPanelBody(g, s); else drawAxialBody(g, s);
      drawBars(g, s); drawConv(g, s);
    },
    onPointer(g, ev, s) {
      if (ev.type !== 'pointerdown') return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.viewId === 'body' && BODY.P) {
        const P = BODY.P; let best = -1, bd = 900;
        if (s.mode === 'panels' && BODY.st) { const G = BODY.st.r.g; G.xm.forEach((x, i) => { const d = (P.X(x) - X) ** 2 + (P.Y(G.ym[i]) - Y) ** 2; if (d < bd) { bd = d; best = i; } }); }
        else if (BODY.a) { const T = BODY.a.T; T.zb.forEach((z, i) => { const d = Math.min((P.X(z) - X) ** 2 + (P.Y(T.Rb[i]) - Y) ** 2, (P.X(z) - X) ** 2 + (P.Y(-T.Rb[i]) - Y) ** 2); if (d < bd) { bd = d; best = i; } }); }
        if (best < 0) return false;
        g.app.play(false); g.app.set({ pm: best + 1 }); return true;
      }
      if (ev.viewId === 'bars' && BARS.P) {
        const P = BARS.P; if (!P.inside(X, Y)) return false;
        if (s.mode === 'panels') { const th = P.ix(X), r = PNL(s).r; let best = 0, bd = Infinity; r.theta.forEach((t, i) => { const d = Math.abs(t * 180 / PI - th); if (d < bd) { bd = d; best = i; } }); g.app.set({ pm: best + 1 }); return true; }
        const z = P.ix(X), xi = AXS(s).sol.xi; let n = -1; for (let i = 0; i < xi.length - 1; i++) if (z >= xi[i] && z < xi[i + 1]) n = i;
        if (n < 0) return false; g.app.play(false); g.app.set({ pm: n + 1 }); return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a black dot on the body (or a bar) to put the purple probe there and see its row of the system added up.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Pick a target and drag N (the slider under the picture; ▶ sweeps it). Click a body point to trace its row. The mode chips switch to 2-D source panels.',
    controls: ['tgt', 'fin', 'U', 'pb', 'Np', 'pm'],
    readouts: ['err', 'net', 'cond', 'm1', 'len', 'cperr', 'pnet'],
    callouts: [{ kind: 'try', html: 'Rankine oval: step N from 20 to 30. The bars swap signs and grow, yet m₁ stays at −2.000 m⁴/s and the body error drops tenfold.' }]
  },
  explain: {
    html: s => (s.mode === 'panels' ? explainPanels(s) : explainAxial(s)),
    live: s => (s.mode === 'panels' ? { N: String(Npint(s)), cond: '—' } : { N: String(Nint(s)), cond: f3(AXS(s).cond) })
  },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => { CUR = s; if (key === 'mode' || key === 'tgt') applyVisibility(a); }
};
let CUR = null;
const app = Viz.app(CFG);
CUR = app.state;
applyVisibility(app);
</script>
