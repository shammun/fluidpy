  if (m.fpp0 < 0.005) return 'sep';
  if (Math.abs(m.n) < 5e-4) return 'blasius';
  return m.n > 0 ? 'fav' : 'adv';
}

/* ---------------------------------------------------------------------------------------------------
   VIEWS, STATUS, NOTES, INSPECTOR
   Colours (one meaning each, in text, curves and bars): velocity u/U_e = f' blue; wall shear / f'' teal; curvature f''' (the
   viscous term at the wall) rose; the pressure gradient orange; inflection point and layer edge amber; Blasius ghost grey.
   --------------------------------------------------------------------------------------------------- */
const f3 = v => Viz.fmt(v, { sig: 3 }), f4 = v => Viz.fmt(v, { sig: 4 });
const tn = (v, sg) => Viz.tnum(v, sg || 3);
const nS = n => (n === 0 ? '0' : Viz.fmt(n, { sig: Math.abs(n) < 0.1 ? 4 : 3 }));
const C = k => Viz.color(k);
let PP = { prof: null, curve: null, outer: null }, XM = 6, CS = 1;   // last plots (for pointer handlers), x-range, horizontal scale factor

function verdictOf(m) {
  const k = kindOf(m), n = m.n;
  if (k === 'rev') return { kind: k, tone: 'bad', text: `↩️ reversed flow at the wall: f″(0) = ${f4(m.fpp0)} < 0 (second branch, n = ${nS(n)})` };
  if (k === 'sep') return { kind: k, tone: 'bad', text: `🛑 zero wall shear: f″(0) = ${f4(m.fpp0)} at n = ${nS(n)} (β = ${f4(m.beta)})` };
  if (k === 'blasius') return { kind: k, tone: 'info', text: `⚪ zero pressure gradient (Blasius): f″(0) = ${f4(m.fpp0)}, inflection at the wall` };
  if (k === 'fav') return { kind: k, tone: 'good', text: `🟢 favourable: n = ${nS(n)} > 0, f″(0) = ${f4(m.fpp0)}, u_yy(wall) < 0, no inflection` };
  return { kind: k, tone: 'warn', text: `🟠 adverse: n = ${nS(n)}, f″(0) = ${f4(m.fpp0)}, inflection at η = ${f3(m.infl)}` };
}
function statusOf(s) {
  const m = M(s), v = verdictOf(m), root = document.querySelector('.viz-app'), phone = window.innerWidth < 520 && root && root.getAttribute('data-layout') === 'portrait';
  let t = v.text;
  if (phone) {
    const k = kindOf(m);
    t = k === 'rev' ? `↩️ reversed wall flow · f″(0) = ${f3(m.fpp0)}` : k === 'sep' ? `🛑 zero wall shear · n = ${nS(m.n)}` : k === 'blasius' ? `⚪ Blasius · f″(0) = ${f3(m.fpp0)}` :
      k === 'fav' ? `🟢 favourable · f″(0) = ${f3(m.fpp0)}` : `🟠 adverse · f″(0) = ${f3(m.fpp0)} · η_i = ${f3(m.infl)}`;
    return { text: t, tone: v.tone };
  }
  if (s.branch === 'second' && !m.rev) t = '↩️ second branch exists only for −0.0904 < n < −0.01 · ' + t;
  else if (m.rev && !m.revProf) t += ' · profile not tabulated for n > −0.03';
  return { text: t, tone: v.tone };

/* ---- view 1: the profile f'(eta) with its wall tangent, inflection, optional f'' and f''' ---------------------------- */
function drawProf(g, s) {
  const v = g.view('prof'); v.clear();
  if (v.w < 60 || v.h < 60) return;
  const m = M(s), P0 = m.prof, book = s.axis === 'book', c = book ? Math.sqrt((m.n + 1) / 2) : 1, c0 = book ? Math.sqrt(0.5) : 1;
  const e99 = P0.fp[NE - 1] > 0.99 ? m.e99 : null;
  const xm = book ? 4.5 : Math.min(12, Math.max(5.5, 1.28 * Math.max(e99 || 12, 4.91)));
  const vis = ETA.filter(e => c * e <= xm + 0.2).length;
  let ymin = Math.min(0, ...P0.fp) - 0.04, ymax = 1.08;
  if (s.show !== 'f1') { ymax = Math.max(ymax, 1.1 * Math.max(...P0.fpp.slice(0, vis))); ymin = Math.min(ymin, 1.1 * Math.min(...P0.fpp.slice(0, vis))); }
  if (s.show === 'f3') { ymax = Math.max(ymax, 1.1 * Math.max(...P0.fppp.slice(0, vis))); ymin = Math.min(ymin, 1.1 * Math.min(...P0.fppp.slice(0, vis))); }
  const narrow = v.w < 420;
  const P = v.plot({ xlim: [0, xm], ylim: [ymin, ymax], xlabel: book ? 'scaled η·√((n+1)/2)  [–]' : 'η = y/δ(x)  [–]', ylabel: v.h < 170 ? (s.show === 'f1' ? 'f′  [–]' : 'f′, f″, f‴') : (s.show === 'f1' ? 'u/U_e = f′(η)' : 'f′, f″, f‴  [–]') }).axes();
  PP.prof = P; XM = xm; CS = c;
  const ctx = v.ctx;
  P.clip(() => {
    if (m.n !== 0) P.line(BLAS.eta.map(e => c0 * e), BLAS.fp, { color: Viz.alpha(C('muted'), 0.75), width: 1.6, dash: [5, 4] });
    if (s.show === 'f3') P.line(P0.eta.map(e => c * e), P0.fppp, { color: C('rose'), width: 2 });
    if (s.show !== 'f1') P.line(P0.eta.map(e => c * e), P0.fpp, { color: C('teal'), width: 2 });
    P.line(P0.eta.map(e => c * e), P0.fp, { color: C('blue'), width: 3 });
    // wall tangent: slope f''(0) (proportional to the wall shear)
    const et = Math.min(0.5 / Math.max(m.fpp0, 1e-3), 0.3 * xm / c);
    P.line([0, c * et], [0, m.fpp0 * et], { color: C('text'), width: 3 });
    // the curvature parabola f' ~ f''(0) eta - n eta^2 / 2 (focus: one of the two terms)
    if (s.focus) {
      const ep = Math.min(1.6, 0.4 * xm / c), es = Array.from({ length: 40 }, (_, i) => ep * i / 39);
      P.line(es.map(e => c * e), es.map(e => m.fpp0 * e - m.n * e * e / 2), { color: s.focus === 'visc' ? C('rose') : C('orange'), width: 2.6, dash: [4, 3] });
    }
    if (s.probe !== undefined && s.probe !== null) {
      const e = Math.min(s.probe, xm / c), a = atEta(P0, e);
      P.line([c * e, c * e], [ymin, ymax], { color: C('accent'), width: 1, dash: [3, 3] });
      P.dot(c * e, a.fp, 5, { color: C('accent'), stroke: '#fff', strokeWidth: 1.5 });
    }
    // inflection (u_yy = 0)
    if (m.infl !== null && m.infl <= xm / c) {
      const a = atEta(P0, m.infl);
      P.dot(c * m.infl, a.fp, 6, { color: C('amber'), stroke: '#fff', strokeWidth: 2 });
    }
  });
  // labels (pixel space, on solid boxes)
  const X = P.X, Y = P.Y, sz = 12;
  if (!narrow) Viz.text(ctx, `wall slope f″(0) = ${f3(m.fpp0)}`, X(0) + 8, Y(Math.min(ymax - 0.02, Math.max(0.12, ymin + 0.08 * (ymax - ymin)))), { size: sz, weight: 650, color: C('text'), bg: true, align: 'left', baseline: 'middle' });
  if (m.infl !== null && m.infl <= xm / c) {
    const a = atEta(P0, m.infl);
    const lab = m.infl === 0 ? (narrow ? 'at the wall' : 'inflection at the wall') : (narrow ? `η_i = ${f3(m.infl)}` : `inflection η = ${f3(m.infl)}`);
    Viz.text(ctx, lab, X(c * m.infl) + 9, Y(a.fp) + (m.infl === 0 ? -16 : 14), { size: sz, weight: 650, color: C('amber'), bg: true, align: 'left', baseline: 'middle' });
  } else if (m.n > 0) {
    Viz.text(ctx, 'no inflection', X(xm) - 8, Y(ymin + 0.14 * (ymax - ymin)), { size: sz, weight: 600, color: C('muted'), bg: true, align: 'right', baseline: 'middle' });
  }
  if (m.n !== 0 && !narrow) Viz.text(ctx, 'Blasius (n = 0)', X(c0 * 4.3), Y(BLAS.fp[Math.round(4.3 / DE)]) + 16, { size: sz, weight: 600, color: C('muted'), align: 'left', baseline: 'middle' });
  if (g.app.holding) Viz.card(ctx, X(xm * 0.6), Y(ymin + 0.45 * (ymax - ymin)), ['sweep finished', 'n = 4: f″(0) = ' + f3(pchip(NODES, FS_TAB.fpp0, 4)), 'n = −0.0904: f″(0) = 0'], { color: C('accent'), maxWidth: v.w - 20 });
}

/* ---- view 2: f''(0) against n (stretched axis), fold, second branch ------------------------------------------------ */
function drawCurve(g, s) {
  const v = g.view('curve'); v.clear();
  if (v.w < 60 || v.h < 60) return;
  const m = M(s), X0 = xw(-0.1), X1 = xw(4.3), narrow = v.w < 420, ctx = v.ctx;
  const P = v.plot({ xlim: [X0, X1], ylim: [-0.25, 2.7], xlabel: narrow ? 'exponent n' : 'exponent n  (stretched axis)', ylabel: 'f″(0)  [–]' });
  PP.curve = P;
  ctx.save();
  ctx.fillStyle = Viz.alpha(C('rose'), 0.07); ctx.fillRect(P.X(X0), P.px.y, P.X(0) - P.X(X0), P.px.h);
  ctx.fillStyle = Viz.alpha(C('teal'), 0.06); ctx.fillRect(P.X(0), P.px.y, P.X(X1) - P.X(0), P.px.h);
  ctx.restore();
  P.axes({ xticks: [] });
  const ticks = narrow ? [0, 0.3, 1, 4] : [-0.09, -0.05, 0, 0.1, 0.3, 1, 2, 4];
  ctx.save(); ctx.font = Viz.font(12, 500); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ticks.forEach(t => {
    ctx.strokeStyle = C('grid'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Math.round(P.X(xw(t))) + 0.5, P.px.y); ctx.lineTo(Math.round(P.X(xw(t))) + 0.5, P.px.y + P.px.h); ctx.stroke();

  });

  P.clip(() => {
    const us = Viz.num.linspace(xw(FOLD), xw(NMAX), 240);
    P.line(us, us.map(u => pchip(NODES, FS_TAB.fpp0, nx(u))), { color: C('blue'), width: 2.8 });
    const u2 = Viz.num.linspace(xw(FOLD), xw(RN[RN.length - 1]), 80);
    P.line(u2, u2.map(u => pchip(RN, RV, nx(u))), { color: C('amber'), width: 2.4, dash: [6, 4] });
    P.dot(xw(FOLD), 0, 6, { color: C('rose'), stroke: '#fff', strokeWidth: 2 });
    P.dot(0, BLAS.fpp[0], 4.5, { color: C('muted'), stroke: '#fff', strokeWidth: 1.5 });
    P.dot(xw(1), pchip(NODES, FS_TAB.fpp0, 1), 4.5, { color: C('muted'), stroke: '#fff', strokeWidth: 1.5 });
    P.dot(xw(m.n), m.fpp0, 7, { color: C('orange'), stroke: '#fff', strokeWidth: 2 });
  });

  if (!narrow) {
    Viz.text(ctx, 'adverse: dp/dx > 0', P.X(X0) + 6, P.px.y + 12, { size: sz, weight: 650, color: C('rose'), align: 'left', baseline: 'middle' });
    Viz.text(ctx, 'favourable: dp/dx < 0', P.X(X1) - 6, P.px.y + 12, { size: sz, weight: 650, color: C('teal'), align: 'right', baseline: 'middle' });
    Viz.text(ctx, 'Blasius', P.X(0) + 8, P.Y(BLAS.fpp[0]) + 14, { size: sz, weight: 600, color: C('muted'), align: 'left', baseline: 'middle' });
    Viz.text(ctx, 'stagnation, n = 1', P.X(xw(1)) + 8, P.Y(pchip(NODES, FS_TAB.fpp0, 1)) + 14, { size: sz, weight: 600, color: C('muted'), align: 'left', baseline: 'middle' });
    Viz.text(ctx, 'fold n = −0.0904', P.X(xw(FOLD)) + 8, P.Y(0) - 14, { size: sz, weight: 650, color: C('rose'), bg: true, align: 'left', baseline: 'middle' });
    Viz.text(ctx, 'second branch: reversed', P.X(xw(-0.06)), P.Y(-0.16), { size: sz, weight: 600, color: C('amber'), align: 'left', baseline: 'middle' });
  }
  const right = P.X(xw(m.n)) > P.px.x + P.px.w * 0.38;
  Viz.text(ctx, `f″(0) = ${f3(m.fpp0)}`, P.X(xw(m.n)) + (right ? -10 : 10), P.Y(m.fpp0) + (m.fpp0 > 2.2 ? 16 : -14), { size: sz, weight: 700, color: C('orange'), bg: true, align: right ? 'right' : 'left', baseline: 'middle' });
}

/* ---- view 3: the layer along the wall: U_e(x) above, the same profile at five stations (thickness stretched) ------------ */
function drawOuter(g, s) {
  const v = g.view('outer'); v.clear();
  if (v.w < 60 || v.h < 80) return;
  const m = M(s), n = m.n, W = v.w, H = v.h, ctx = v.ctx, a = s.a, X1 = 2.1;
  const short = H < 190, hTop = short ? 0 : Math.max(46, H * 0.34), pad = { l: 48, r: 12 };
  // top: U_e / U_e(1 m)
  const umax = Math.max(1.3, 1.1 * Math.pow(2, n));
  if (!short) {
  const PT = v.plot({ rect: { x: 0, y: 0, w: W, h: hTop }, pad: { l: pad.l, r: pad.r, t: 6, b: 4 }, xlim: [0, X1], ylim: [0, umax], ylabel: 'U_e/U_e(1 m)' }).axes({ xticks: [] });
    const tint = n > 1e-9 ? C('teal') : n < -1e-9 ? C('rose') : C('muted');
    const xs = Viz.num.linspace(0.1, 2, 80);
    PT.fillBetween(xs, 0, xs.map(x => Math.pow(x, n)), { color: tint, alpha: 0.18 });
    PT.line(xs, xs.map(x => Math.pow(x, n)), { color: C('blue'), width: 2.6 });
    Viz.text(ctx, n > 1e-9 ? 'accelerating: dp/dx < 0' : n < -1e-9 ? 'decelerating: dp/dx > 0' : 'constant U_e: dp/dx = 0', PT.X(X1) - 6, PT.Y(0.16 * umax), { size: 12, weight: 650, color: n > 1e-9 ? C('teal') : n < -1e-9 ? C('rose') : C('muted'), align: 'right', baseline: 'middle' });
  }
  // bottom: profiles at stations, y in mm
  const stations = [0.25, 0.6, 0.95, 1.3, 1.65], e99 = m.e99 || 12;
  const dmm = x => thick(x, n, a, NU) * 1000;
  const ymax = 1.25 * Math.max(...stations.map(x => e99 * dmm(x)));
  const PB = v.plot({ rect: { x: 0, y: hTop, w: W, h: H - hTop }, pad: { l: pad.l, r: pad.r, t: 6, b: 34 }, xlim: [0, X1], ylim: [0, ymax], xlabel: 'x along the wall [m]', ylabel: 'y [mm]' }).axes();
  PP.outer = PB;
  const ex = Viz.num.linspace(0.1, 2, 80);
  PB.clip(() => {
    PB.fillBetween(ex, 0, ex.map(x => e99 * dmm(x)), { color: C('amber'), alpha: 0.13 });
    PB.line(ex, ex.map(x => e99 * dmm(x)), { color: C('amber'), width: 2, dash: [5, 4] });
    stations.forEach(x => {
      const wd = 0.3, ys = m.prof.eta.map(e => e * dmm(x)), cut = m.prof.fp.findIndex((f, j) => j > 0 && f > 0.995);
      const last = cut < 0 ? NE : cut + 1;
      PB.line([x, x], [0, 1.05 * e99 * dmm(x)], { color: Viz.alpha(C('muted'), 0.5), width: 1, dash: [2, 3] });
      PB.line(m.prof.fp.slice(0, last).map(f => x + wd * f), ys.slice(0, last), { color: C('blue'), width: 2.4 });
    });
    PB.line([0, X1], [0, 0], { color: C('text'), width: 4 });
  });
    if (short) Viz.text(ctx, n > 1e-9 ? 'accelerating: dp/dx < 0' : n < -1e-9 ? 'decelerating: dp/dx > 0' : 'dp/dx = 0', PB.X(X1) - 6, PB.px.y + 11, { size: 12, weight: 650, color: n > 1e-9 ? C('teal') : n < -1e-9 ? C('rose') : C('muted'), align: 'right', baseline: 'middle' });
  Viz.text(ctx, 'layer edge (η₉₉)', PB.X(1.02), PB.Y(e99 * dmm(1.02)) - 12, { size: 12, weight: 600, color: C('amber'), bg: true, align: 'left', baseline: 'middle' });
}

/* ---- the three views on one canvas set ----------------------------------------------------------------------------- */
function drawAll(g, s) { drawProf(g, s); drawCurve(g, s); drawOuter(g, s); }
function pointer(g, ev, s) {
  const v = ev.vizView; if (!v || !v.pointer) return false;
  if (ev.type !== 'pointerdown') return false;
  const px = v.pointer.x, py = v.pointer.y;
  if (ev.viewId === 'prof' && PP.prof && PP.prof.inside(px, py)) { g.app.set({ probe: Math.max(0.05, Math.min(11.8, PP.prof.ix(px) / CS)) }); return true; }
  if (ev.viewId === 'curve' && PP.curve && PP.curve.inside(px, py)) { g.app.set({ n: Math.min(NMAX, Math.max(-0.09043, Number(nx(PP.curve.ix(px)).toPrecision(3)))) }); return true; }
  return false;
}

/* ---- inspector: click the profile ----------------------------------------------------------------------------------- */
function inspectHtml(s) {
  if (s.probe === undefined || s.probe === null) return null;
  const m = M(s), n = m.n, e = Math.max(0.05, Math.min(11.8, s.probe)), a = atEta(m.prof, e), c = (n + 1) / 2;
  const fd = (atEta(m.prof, e + 0.1).fpp - atEta(m.prof, e - 0.1).fpp) / 0.2, dl = m.delta1, u = s.a * a.fp;
  return `At $\\eta = ${tn(e)}$ ($y = \\eta\\delta = ${tn(e * dl * 1000)}$ mm at $x = 1$ m):<br>` +
    `$f' = u/U_e = ${tn(a.fp, 4)}$, $f'' = ${tn(a.fpp, 4)}$, $f = \\int_0^\\eta f'\\,d\\eta = ${tn(a.f, 4)}$<br>` +
    `$f''' = -\\tfrac{n+1}{2}ff'' + nf'^2 - n = -(${tn(c)})(${tn(a.f)})(${tn(a.fpp)}) + (${tn(n)})(${tn(a.fp)})^2 - (${tn(n)}) = \\mathbf{${tn(a.fppp, 4)}}$<br>` +
    `finite difference of $f''$ (◇): $${tn(fd, 4)}$ &nbsp;·&nbsp; $u = U_ef' = ${tn(s.a)}\\times${tn(a.fp)} = ${tn(u)}$ m/s`;
}

/* ---- notes: "Right now" ---------------------------------------------------------------------------------------------- */
function notesHtml(s) {
  const m = M(s), k = kindOf(m), n = m.n;
  if (k === 'fav') return `<p>$n = ${nS(n)} > 0$: the outer flow speeds up and the pressure falls along the wall. The layer is squeezed thin and the profile is full (shape factor $H = ${f3(m.H)}$, below Blasius' 2.59). Wall shear is large, $f''(0) = ${f3(m.fpp0)}$, and there is no inflection.</p>`;
  if (k === 'blasius') return `<p>$n = 0$: no pressure gradient. The profile is curved only by its own diffusion, so $u_{yy} = 0$ exactly at the wall and the inflection sits there; $f''(0) = ${f4(m.fpp0)}$ and $H = ${f3(m.H)}$.</p>`;
  if (k === 'adv') return `<p>$n = ${nS(n)} < 0$: the pressure rises along the wall and slows the fluid nearest the wall first. The profile flattens there ($f''(0) = ${f3(m.fpp0)}$) and bulges out: an inflection at $\\eta = ${f3(m.infl)}$. $H = ${f3(m.H)}$ is climbing towards separation.</p>`;
  if (k === 'sep') return `<p>$f''(0) = ${f4(m.fpp0)} \\approx 0$: the wall shear vanishes at every $x$ along this wedge, so the layer is on the point of leaving the surface all along it. Below $n = -0.0904$ no attached solution exists.</p>`;
  return `<p>Second branch: $f''(0) = ${f4(m.fpp0)} < 0$, so the fluid at the wall runs backwards (lowest $f' = ${f3(m.fmin)}$). It still tends to $f' \\to 1$ far out, but it is not the attached layer; it is the reversed-flow solution that meets the fold.</p>`;
}

/* ---------------------------------------------------------------------------------------------------

const PRESET_ROWS = [['1 Hiemenz', 1], ['1/3 wedge', 1 / 3], ['0 Blasius', 0], ['−0.05 adverse', -0.05], ['−0.0904 fold', FOLD]];

    const st = stateOf(n), here = !m.rev && Math.abs(n - m.n) < 6e-4, nm = lab.split(' ').slice(1).join(' ');

      '$H = ' + f3(st.H) + '$, inflection ' + (st.infl === null ? 'none' : (st.infl === 0 ? 'at the wall' : '$\\eta_i = ' + f3(st.infl) + '$')));
  }).join('');
}

  o += W.step(2, 'The similarity solution') +
    W.say('The Falkner–Skan equation is $f\'\'\' + \\frac{n+1}{2}ff\'\' - nf\'^2 + n = 0$ (9.36) with $f(0) = f\'(0) = 0$ and $f\'(\\infty) = 1$. With your $n$ it reads $f\'\'\' + ' + tn(c) + '\\,ff\'\' - (' + tn(n) + ')f\'^2 + (' + tn(n) + ') = 0$.') +

    if (n >= -0.05) { const sh = shoot(n).fpp0; o += W.line('independent check: RK4 shooting on $f\'\'(0)$', f4(sh), 'differs from the table by ' + Viz.fmt(Math.abs(sh - m.fpp0), { sig: 2 })); }
    else o += W.hint('Shooting is exponentially sensitive this close to separation (the code raises an error below $n = -0.05$), so the check uses the boundary-value solver instead.');
    o += W.box('$f\'\'(0) = \\mathbf{' + tn(m.fpp0, 4) + '}$, $H = \\mathbf{' + tn(m.H, 4) + '}$, $C_f\\sqrt{Re_x} = 2f\'\'(0) = \\mathbf{' + tn(2 * m.fpp0, 4) + '}$');

  o += W.step(6, 'Right now: the special members') + presetTable(m);

  o += W.step(7, 'At the current setting') +

}

  { id: 'ansatz', title: 'Falkner–Skan ansatz', ref: 'Eq. (9.34)', tex: '\\psi=\\sqrt{\\nu xU_e(x)}\\,f(\\eta),\\qquad \\eta=\\frac y{\\delta(x)}=\\frac yx\\sqrt{Re_x}',
    live: s => { const m = M(s); return `\\delta(x)=\\sqrt{\\nu x^{1-n}/a},\\ \\ \\delta(1\\ \\text{m}) = ${tn(m.delta1 * 1000)}\\ \\text{mm}`; },
    note: 'with $u/U_e = f\'(\\eta)$ and $Re_x = ax^{n+1}/\\nu$; the generic thickness is $\\delta(x)=\\sqrt{\\nu x/U_e}$.', symbols: [['\\psi', 'stream function', 'm²/s'], ['\\eta', 'similarity variable', '–'], ['U_e', 'outer speed $ax^n$', 'm/s'], ['\\delta', 'layer scale', 'm']] },
  { id: 'dpdx', title: 'Pressure gradient', ref: 'Eq. (9.35)', tex: '-\\frac{dp}{dx}=U_e\\frac{dU_e}{dx}=na^2x^{2n-1}',
    live: s => { const m = M(s); return `-\\tfrac1\\rho\\tfrac{dp}{dx} = ${tn(m.n * s.a * s.a)}\\ \\text{m/s}^2\\ \\text{at}\\ x=1\\ \\text{m}`; },
    note: 'as printed, per unit density; with density $-dp/dx=\\rho U_eU_e\'$. $n>0$ favourable, $n<0$ adverse.', symbols: [['n', 'exponent of $U_e = ax^n$', '–'], ['a', 'edge speed at $x = 1$ m', 'm/s']] },
  { id: 'fs', title: 'Falkner–Skan equation', ref: 'Eq. (9.36)', tex: '\\begin{aligned}f\'\'\'&+\\frac{n+1}2ff\'\'\\\\ &-nf\'^2+n=0\\end{aligned}',
    live: s => { const m = M(s); return `\\begin{aligned}f'''&+${tn((m.n + 1) / 2)}ff''\\\\ &-(${tn(m.n)})f'^2+(${tn(m.n)})=0\\\\ f''(0)&=${tn(m.fpp0, 4)}\\end{aligned}`; },
    note: 'with $f(0)=f\'(0)=0$ (9.28) and $f\'(\\infty)=1$ (9.29); $n=0$ is the Blasius equation $f\'\'\'+\\frac12ff\'\'=0$ (9.27).', symbols: [['f', 'stream-function shape', '–'], ["f'", '$u/U_e$', '–'], ["f''(0)", 'wall slope', '–']] },
  { id: 'acc', title: 'Accelerating stream', ref: 'Eq. (9.51)', tex: '\\Big(\\frac{\\partial^2u}{\\partial y^2}\\Big)_{wall}<0\\quad(\\text{accelerating})',
    live: s => { const m = M(s); return `u_{yy}(wall) = ${tn(m.uyy1)}\\ \\text{1/(m s)}\\ (x=1\\ \\text{m})`; }, note: 'from the wall relation $\\mu u_{yy}(wall) = dp/dx$ with $dp/dx < 0$.' },
  { id: 'dec', title: 'Decelerating stream', ref: 'Eq. (9.52)', tex: '\\Big(\\frac{\\partial^2u}{\\partial y^2}\\Big)_{wall}>0\\quad(\\text{decelerating})',
    live: s => { const m = M(s); return m.n < 0 ? `\\text{inflection at }\\eta_i = ${m.infl === null ? '—' : tn(m.infl)}` : `\\text{not decelerating: } n = ${nS(m.n)}`; }, note: 'positive at the wall but negative near the edge, so $u_{yy}$ changes sign: an inflection point.' },
  { id: 'wall', title: 'Wall curvature relation', ref: 'unnumbered', tex: '\\mu\\Big(\\frac{\\partial^2u}{\\partial y^2}\\Big)_{wall}=\\frac{dp}{dx}',
    live: s => { const m = M(s); return `${tn(m.mu * m.uyy1, 4)} = ${tn(m.dpdx1, 4)}\\ \\text{Pa/m}`; }, note: 'the layer equation (9.9) at the wall, where $u = v = 0$.' }
];

const QUIZ = [
  { q: 'For which sign of $n$ does the profile have an inflection point?', a: '$n<0$ (decelerating stream). Then $f\'\'\'(0) = -n > 0$ at the wall but $f\'\'\' < 0$ near the edge, so $u_{yy}$ must cross zero. For $n>0$ there is none; at $n=0$ it sits at the wall.', set: { n: -0.05 } },
  { q: 'What is $f\'\'\'(0)$ for $n=\\tfrac13$?', a: '$-\\tfrac13$: put $\\eta = 0$ in $f\'\'\'+\\frac{n+1}2ff\'\'-nf\'^2+n=0$ (9.36); $f(0)=f\'(0)=0$ leave $f\'\'\'(0) = -n$. Check the rose bar in Explore.', set: { n: 1 / 3 } },
  { q: 'Why can you not set $n = -0.1$ on the attached branch?', a: 'The attached family ends at the fold $n=-0.0904$, where $f\'\'(0) = 0$. Between $-0.0904$ and $0$ a second branch exists, with reversed flow at the wall (choose it in Explore); below the fold neither continues.', set: { n: -0.09043 } },
  { q: 'What does $\\delta(x)$ do at $n = 1$?', a: 'It stays constant, $\\delta=\\sqrt{\\nu/a}$, the same at every $x$: the stagnation-point layer. The table in Explain section 5 shows equal values at $x$ = 0.1, 0.5, 1 m.', set: { n: 1 } }
];

   THE APP
   --------------------------------------------------------------------------------------------------- */

  const iSep = NODES.indexOf(4);
  return [
    { name: 'fpp0 n=1 (RK4 shooting)', js: shoot(1).fpp0, py: 'ch09.falkner_skan_state(1.0)["fpp0"]', rtol: 1e-7 },
    { name: 'fpp0 n=0.5 (RK4 shooting)', js: shoot(0.5).fpp0, py: 'ch09.falkner_skan(0.5, method="shoot")["fpp0"]', rtol: 1e-7 },
    { name: 'fpp0 n=1/3 (table)', js: stateOf(1 / 3).fpp0, py: 'ch09.falkner_skan_state(1/3)["fpp0"]', rtol: 1e-6 },
    { name: 'fpp0 n=0 (Blasius)', js: stateOf(0).fpp0, py: 'ch09.falkner_skan_state(0.0)["fpp0"]', rtol: 1e-6 },
    { name: 'fpp0 n=0.75 (interpolated between nodes)', js: stateOf(0.75).fpp0, py: 'ch09.falkner_skan_state(0.75)["fpp0"]', rtol: 1e-5 },
    { name: 'fpp0 n=-0.05 (RK4 shooting)', js: shoot(-0.05).fpp0, py: 'ch09.falkner_skan_state(-0.05)["fpp0"]', rtol: 1e-6 },
    { name: 'f\'\'\'(0) n=-0.05 = -n', js: stateOf(-0.05).fppp0, py: 'ch09.falkner_skan_state(-0.05)["fppp0"]', rtol: 1e-6 },
    { name: 'H n=-0.05', js: stateOf(-0.05).H, py: 'ch09.falkner_skan_state(-0.05)["H"]', rtol: 1e-6 },
    { name: 'inflection eta n=-0.05', js: stateOf(-0.05).infl, py: 'ch09.falkner_skan_state(-0.05)["inflection_eta"]', rtol: 1e-3 },
    { name: 'inflection eta n=-0.0904', js: stateOf(-0.0904).infl, py: 'ch09.falkner_skan_state(-0.0904)["inflection_eta"]', rtol: 1e-3 },
    { name: 'm_sep (fold)', js: FOLD, py: 'ch09.falkner_skan_separation()["m_sep"]', rtol: 1e-9 },
    { name: 'lambda n=1', js: stateOf(1).lam, py: 'ch09.falkner_skan_state(1.0)["lam"]', rtol: 1e-6 },
    { name: 'I_theta n=4', js: stateOf(4).It, py: 'ch09.falkner_skan_state(4.0)["I_theta"]', rtol: 1e-6 },
    { name: 'second branch fpp0 n=-0.05', js: stateOf(-0.05, 'second').fpp0, py: 'ch09.falkner_skan(-0.05, branch="reversed")["fpp0"]', rtol: 1e-4 },
    { name: 'table row n=4 (fpp0)', js: FS_TAB.fpp0[iSep], py: 'ch09.falkner_skan_table([4.0], n_eta=41, eta_max=8.0)["fpp0"][0]', rtol: 1e-6 },
    { name: 'delta(0.5 m), n=1/3', js: thick(0.5, 1 / 3, 5, 1.5e-5), py: 'ch09.falkner_skan_thickness(0.5, 1/3, 5.0, 1.5e-5)', rtol: 1e-12 },
    { name: 'wall curvature dp/dx / mu', js: wallCurv(-2.0, 1.8e-5), py: 'ch09.wall_curvature(-2.0, 1.8e-5)', rtol: 1e-12 },
    { name: 'inflection of a sampled cubic', js: inflectionSampled(seg, seg.map(y => 3 * y * y - 2 * y * y * y)), py: 'ch09.profile_inflection(np.linspace(0, 1, 101), 3*np.linspace(0, 1, 101)**2 - 2*np.linspace(0, 1, 101)**3)', rtol: 1e-6 },
    { name: 'wall balance: viscous = pressure (n=0.4)', js: (() => { const m = M({ n: 0.4, branch: 'attached', a: 5 }); return m.visc - m.pres; })(), expect: 0, atol: 1e-9 },
    { name: 'shooting agrees with table (n=0.5)', js: shoot(0.5).fpp0 / stateOf(0.5).fpp0, expect: 1, rtol: 1e-6 },
    { name: 'overshoot guess reads "too big"', js: shoot(0.3).fpp0 > 0.5 ? 1 : 0, expect: 1 },
    { name: 'f(eta) integral: f(8) ~ 8 - I_delta (n=1)', js: profileAttached(1).f[80] - (8 - stateOf(1).Id), expect: 0, atol: 1e-4 }
  ];
}
