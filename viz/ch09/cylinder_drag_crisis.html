  if (n.sph) { drawSphereCurves(v, s, n, !phone()); return; }
  const ctx = v.ctx, small = v.w < 330 || v.h < 150;
  const BL = Viz.color('blue'), RO = Viz.color('rose'), OR = Viz.color('orange'), TX = Viz.color('text'), MU = Viz.color('muted');
  const P = gutterPlot(v, { xlim: [0, 180], ylim: [-3.7, 1.5], pad: small ? { l: 40, r: 8, t: 6, b: 30 } : { l: 50, r: 10, t: 8, b: 34 }, xlabel: small ? 'φ [deg]' : 'φ from the front stagnation point [deg]', ylabel: 'C_p' },
    () => ({ grid: false, xticks: [0, 45, 90, 135, 180], yticks: v.h < 170 ? [-2, 0] : [-3, -2, -1, 0, 1], xlabel: small ? 'φ [deg]' : 'φ from the front stagnation point [deg]', ylabel: 'C_p' }));
  PCP = { P };
  const shown = n.modelOn || s.showInt, phis = n.phiM, cb = n.cbM;
  const xsv = Viz.num.linspace(0, 180, 181), model = x => cpSep(x, phis, cb);
  P.clip(() => {
    if (shown) {

      const gp = [], up = [];
      for (let x = phis; x <= 180.01; x += 1) { gp.push([x, cpIdeal(Math.min(x, 180))]); up.push([Math.min(x, 180), cb]); }
      polyFill(P, gp.concat(up.reverse()), RO, 0.2);
      // ghost: the other side of the crisis
      const gh = n.blend < 0.5 ? [125, -0.6] : [82, -1.2];
      P.line(xsv, xsv.map(x => cpSep(x, gh[0], gh[1])), { color: MU, width: 1.6, dash: [3, 4], alpha: 0.75 });
    }
    P.line(xsv, xsv.map(cpIdeal), { color: TX, width: 2, dash: [7, 5] });
    if (shown) {
      P.line(xsv, xsv.map(model), { color: BL, width: 3.2 });
      P.line([phis, phis], [-3.7, 1.5], { color: RO, width: 1.4, dash: [2, 4] });
      P.dot(phis, cpIdeal(phis), 5.5, { color: RO, stroke: '#fff', strokeWidth: 2 });
      if (s.showInt) {
        const ip = xsv.map(x => [x, model(x) * Math.cos(x * RAD)]);
        polyFill(P, [[0, 0]].concat(ip, [[180, 0]]), OR, 0.28);
        P.line(ip.map(q => q[0]), ip.map(q => q[1]), { color: OR, width: 2.2 });
      }
    }
    const pr = s.probe; P.line([pr, pr], [-3.7, 1.5], { color: MU, width: 1, dash: [2, 3], alpha: 0.6 }); P.dot(pr, shown ? model(pr) : cpIdeal(pr), 4.5, { color: TX, stroke: '#fff', strokeWidth: 2 });
  });
  if (!small) {
    lab(ctx, 'ideal flow', P.X(178), P.Y(0.55), { color: TX, align: 'right' });
    if (shown) {
      lab(ctx, `model, C_b = ${f3(cb)}`, P.X(176), P.Y(cb) + (cb < -0.4 ? 14 : -14), { color: BL, weight: 700, align: 'right' });
      if (P.px.h >= 170) lab(ctx, 'missing recovery', P.X(146), P.Y((cb + cpIdeal(146)) / 2 + 0.1), { color: RO, align: 'center' });
      if (s.showInt) lab(ctx, 'C_p cos φ: area = C_D,p', P.X(4), P.Y(-3.35), { color: OR, weight: 700, align: 'left' });
      lab(ctx, `φ_s = ${f3(phis)}°`, P.X(phis) + (phis > 150 ? -5 : 5), P.Y(1.25), { color: RO, weight: 700, align: phis > 150 ? 'right' : 'left' });
    } else lab(ctx, 'separated model applies for Re ≥ 3000', P.X(90), P.Y(-3.3), { color: MU, align: 'center', maxWidth: P.px.w - 8 });
  }
}
function cpTitle(s) {
  const n = N(s);

/* ---- sphere curves: Morrison + Stokes + Oseen (view 2 zoomed at low Re, view 3 full) --------------------------------------------- */
function drawSphereCurves(v, s, n, zoom) {
  const ctx = v.ctx, AC = Viz.color('accent'), TE = Viz.color('teal'), AM = Viz.color('amber'), RO = Viz.color('rose'), TX = Viz.color('text'), MU = Viz.color('muted');
  const xr = zoom ? [-2, 1] : [-1, 7], yr = zoom ? [-0.3, 3.5] : [-1.3, 3];
  const P = logPlot(v, xr, yr, { ylabel: 'C_D' });
  if (zoom) PCP = { P, log: true }; else PCD = { P };
  const lx = s.logRe, cdv = sphereCD(n.Re);
  if (!zoom) {
    const cr = n.rough ? [Math.log10(1e5), Math.log10(8e5 / 3)] : [Math.log10(3e5), Math.log10(8e5)];
    P.clip(() => { polyFill(P, [[cr[0], yr[0]], [cr[1], yr[0]], [cr[1], yr[1]], [cr[0], yr[1]]], RO, 0.14); });
    if (v.w >= 300) lab(ctx, 'crisis', P.X((cr[0] + cr[1]) / 2), P.px.y + 10, { color: RO, weight: 700, align: 'center' });
  }
  P.clip(() => {
    const xs = Viz.num.linspace(xr[0], Math.min(xr[1], 6), 200);
    if (zoom || true) {
      const xa = Viz.num.linspace(xr[0], Math.min(xr[1], 1), 80);
      P.line(xa, xa.map(x => Math.log10(stokes(Math.pow(10, x)))), { color: TE, width: 2, dash: [7, 5] });
      P.line(xa, xa.map(x => Math.log10(oseen(Math.pow(10, x)))), { color: AM, width: 2, dash: [7, 5] });
    }
    P.line(xs, xs.map(x => Math.log10(sphereCD(Math.pow(10, x)))), { color: AC, width: 3 });
    if (lx <= 6 && lx >= xr[0] && lx <= xr[1]) { P.line([lx, lx], [yr[0], yr[1]], { color: TX, width: 1, dash: [2, 4], alpha: 0.5 }); P.dot(lx, Math.log10(cdv), 6, { color: RO, stroke: '#fff', strokeWidth: 2 }); }
  });
  if (v.w >= 300 && v.h >= 130) {
    if (zoom) { lab(ctx, 'Stokes 24/Re', P.X(-1.9), P.Y(Math.log10(stokes(0.012))) + 14, { color: TE, weight: 700, align: 'left' }); lab(ctx, 'Oseen', P.X(0.98), P.Y(Math.log10(oseen(9.5))) - 12, { color: AM, weight: 700, align: 'right' }); }
    else if (v.h >= 170) lab(ctx, 'Morrison correlation (tested), valid to Re ≈ 10⁶', P.X(xr[1]) - 4, P.px.y + P.px.h - 12, { color: AC, align: 'right', maxWidth: P.px.w - 8 });
  }
  if (lx > xr[1] || lx < xr[0]) lab(ctx, lx > xr[1] ? 'your Re is to the right →' : '← your Re is to the left', zoom ? P.X(xr[1]) - 4 : P.X(xr[1]) - 4, P.px.y + 12, { color: RO, align: 'right', weight: 700 });
  else if (lx > 6) lab(ctx, 'beyond the correlation (Re > 10⁶)', P.X(xr[1]) - 4, P.px.y + 12, { color: RO, align: 'right', weight: 700 });
}

/* ---- view 3: C_D against Re, log-log ------------------------------------------------------------------------------------------------ */
function drawCd(g, s) {
  const v = g.view('cd'); v.clear(); PCD = null;
  if (v.w < 60 || v.h < 40) return;
  const n = N(s);
  if (n.sph) { drawSphereCurves(v, s, n, false); return; }
  const ctx = v.ctx, AC = Viz.color('accent'), OR = Viz.color('orange'), RO = Viz.color('rose'), MU = Viz.color('muted'), TX = Viz.color('text');
  const xr = [-1, 7], yr = [-1, 2], P = logPlot(v, xr, yr, { ylabel: 'C_D' });
  PCD = { P };
  const edges = n.rough ? [-1, 0, 0.602, 1.602, 2.301, 3.477, 5, 7] : [-1, 0, 0.602, 1.602, 2.301, 3.477, 5.477, 5.778, 7];
  const names = n.rough ? ['creep', 'eddies', 'steady', 'street', 'irregular', 'subcritical', 'super'] : ['creep', 'eddies', 'steady', 'street', 'irregular', 'subcritical', 'crisis', 'super'];
  P.clip(() => { for (let i = 0; i < edges.length - 1; i++) if (i % 2 === 0) polyFill(P, [[edges[i], yr[0]], [edges[i + 1], yr[0]], [edges[i + 1], yr[1]], [edges[i], yr[1]]], MU, 0.1); });
  if (v.w >= 380 && v.h >= 130) {
    ctx.save(); ctx.font = Viz.font(12);
    names.forEach((nm, i) => { const wpx = P.X(edges[i + 1]) - P.X(edges[i]), tw = ctx.measureText(nm).width; if (tw + 4 <= wpx) lab(ctx, nm, (P.X(edges[i]) + P.X(edges[i + 1])) / 2, P.px.y + 10, { color: MU, align: 'center', bg: false }); });
    ctx.restore();
  }
  const xs = Viz.num.linspace(-1, 7, 320);
  P.clip(() => {
    P.line(xs, xs.map(x => Math.log10(cdQual(Math.pow(10, x)))), { color: AC, width: 2.6, dash: [8, 5] });
    const xm = xs.filter(x => x >= 3.477);
    P.line(xm, xm.map(x => Math.log10(crisis(Math.pow(10, x), false).cd)), { color: OR, width: 3 });
    if (n.rough) { const xr2 = xs.filter(x => x >= 3.477); P.line(xr2, xr2.map(x => Math.log10(crisis(Math.pow(10, x), true).cd)), { color: OR, width: 2, dash: [3, 3] }); }
    P.line([s.logRe, s.logRe], [yr[0], yr[1]], { color: TX, width: 1, dash: [2, 4], alpha: 0.5 });
    P.dot(s.logRe, Math.log10(Math.max(n.CDc, 0.11)), 6, { color: RO, stroke: '#fff', strokeWidth: 2 });
    if (n.modelOn) P.dot(s.logRe, Math.log10(n.cd), 5, { color: OR, stroke: '#fff', strokeWidth: 2 });
  });
  if (v.w >= 300) {
    lab(ctx, 'schematic C_D: qualitative, hand-drawn', P.X(-0.9), P.px.y + P.px.h - 12, { color: AC, weight: 700, align: 'left' });
    if (v.w >= 380) lab(ctx, 'model C_D,p (ours, illustrative)', P.X(6.95), P.Y(Math.log10(0.45)) + 30, { color: OR, weight: 700, align: 'right' });
  }
}
function cdTitle(s) {

/* ---- status, inspector, notes ------------------------------------------------------------------------------------------------------------ */
function statusOf(s) {

  if (n.key === 'eddies') return { text: sm ? `🔵 attached eddies · Re ${Rs}` : `🔵 ${n.sph ? 'steady wake with a doughnut eddy' : 'two steady attached eddies'}: laminar and steady (Re = ${Rs})`, tone: 'info' };

function inspectHtml(s) {
  const n = N(s), p = s.probe, sp = Math.sin(p * RAD), cpi = cpIdeal(p);
  const head = R`Probe $\varphi=${t3(p)}^\circ$: ideal $C_p=1-4\sin^2\varphi=1-4\times${t3(sp * sp)}=\mathbf{${t3(cpi)}}$`;
  if (n.sph) return head + '<br>(the cylinder formula; switch the body to the cylinder to compare with the separated model)';
  const m = n.modelOn || s.showInt;
  if (!m) return head + R`<br>Below $Re=3000$ there is no separated model here: this is the ideal-flow value.`;
  const inside = p <= n.phiM, cpm = inside ? cpi : n.cbM;
  return head + (inside ? R`<br>$\varphi\le\varphi_s=${t3(n.phiM)}^\circ$: the model follows the ideal curve, $C_p\cos\varphi=${t3(cpm)}\times${t3(Math.cos(p * RAD))}=\mathbf{${t3(cpm * Math.cos(p * RAD))}}$`
    : R`<br>$\varphi>\varphi_s=${t3(n.phiM)}^\circ$: the wake holds $C_p=C_b=\mathbf{${t3(n.cbM)}}$; ideal flow would give ${t3(cpi)}, so ${t3(n.cbM - cpi)} is missing. $C_p\cos\varphi=${t3(n.cbM * Math.cos(p * RAD))}$`);
}
function interpText(s) {

    street: 'The wake is unstable: alternating vortices are shed at St ≈ 0.2. The drag is mostly form drag (pressure), not friction.',
    irreg: 'The vortices are shed irregularly, but the beat St stays near 0.2. Form drag dominates.',
    loops: 'The sphere sheds vortex loops in an unsteady wake but no regular street; separation near 80° (rounded).',
    sub: 'A laminar layer separates near 82° (rounded). The wake pressure stays low (C_b ≈ −1.2, illustrative) and C_D stays near 1 over decades of Re.',
    crit: 'The layer turns turbulent before separating: a fuller profile, separation moves aft and the wake shrinks. The drag drops — faster is less drag. Sharp thresholds are rounded values.',

  return `<p>${b}${extra}</p><p><i>Thresholds, angles (82° / 125°), base pressures (−1.2 / −0.6), St = 0.2 and the C_D schematic are rounded or illustrative, not computed.</i></p>`;
}

    { id: 'cdp', label: 'C_D,p (model)', value: s => N(s).cd },
    { id: 'CD', label: 'C_D (curve)', value: s => N(s).CDc },
    { id: 'f', label: 'Shedding f', unit: 'Hz', value: s => (N(s).St ? N(s).f : null) }
  ],
  stage: {
    rows: [1.15, 1],
    views: [
      { id: 'flow', row: 0, flex: 1.3, title: s => flowTitle(s) },
      { id: 'cp', row: 0, flex: 1, title: s => cpTitle(s) },
      { id: 'cd', row: 1, flex: 1, hidePortrait: true, title: s => cdTitle(s) }
    ],
    draw(g, s) { drawFlow(g, s); drawCp(g, s); drawCd(g, s); },
    onPointer(g, ev, s) {
      if (ev.type !== 'pointerdown') return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const Xp = v.pointer.x, Yp = v.pointer.y;
      if (ev.viewId === 'cp' && PCP && PCP.P.inside(Xp, Yp)) {
        if (PCP.log) { g.app.set({ logRe: clamp(Number(PCP.P.ix(Xp).toFixed(2)), -1, 7) }); return true; }
        g.app.set({ probe: clamp(Math.round(PCP.P.ix(Xp)), 0, 180) }); return true;
      }
      if (ev.viewId === 'cd' && PCD && PCD.P.inside(Xp, Yp)) { g.app.set({ logRe: clamp(Number(PCD.P.ix(Xp).toFixed(2)), -1, 7) }); return true; }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click the C_p view to move the probe angle (its arithmetic appears here); click the C_D view to set the Reynolds number.',
  notes: s => interpText(s),
  explore: {
    intro: 'Press ▶ to run the clock, slide the Reynolds number across the regimes, and switch smooth / rough or cylinder / sphere.',
    controls: ['logRe', 'surface', 'showInt', 'cbman', 'cb', 'U', 'probe'],
    readouts: ['Re', 'phis', 'cdp', 'CD', 'f'],
    callouts: [{ kind: 'try', html: 'Sit at <b>Re = 10⁵</b>, then jump to <b>10⁶</b>: the separation dot slides aft, the wake narrows and C_D,p falls. Now tick <b>set the wake pressure by hand</b> and force −1.2 at 10⁶ — the drag does not fall.' },
      { kind: 'warn', html: 'Everything with a rounded threshold, the 82° / 125° angles, C_b = −1.2 / −0.6, St = 0.2 and the hand-drawn C_D curve are <b>illustrative, not computed</b>. The model drops C_D,p by a factor 0.65; the book’s experiment falls much more.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
</script>
</body>
