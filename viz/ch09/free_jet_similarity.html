function inspectHtml(s) {
  const n = N(s), e = s.pe;
  return `Probe $\\eta=y/\\delta=${t3(e)}$, i.e. $y=${tmm(e * n.d)}$ at $x=${t3(s.x)}$ m:<br>` +
    `$f'=\\mathrm{sech}^2\\!\\big(\\eta/\\sqrt6\\big)=\\mathrm{sech}^2(${t3(e / S6)})=\\mathbf{${t4(n.pr.fp)}}$<br>` +
    `$u=u_0f'=${t3(n.u0)}\\times${t4(n.pr.fp)}=\\mathbf{${t3(n.u)}}$ m/s<br>` +
    `$v=-\\frac{f-2\\eta f'}{3\\sqrt{Re_x}}\\,u_0=-\\frac{${t3(n.pr.f)}-2\\times${t3(e)}\\times${t3(n.pr.fp)}}{3\\sqrt{${t3(n.Rex)}}}\\,u_0=\\mathbf{${t3(n.vp)}}$ m/s`;

function interpText(s) {
  const n = N(s);
  if (s.wrong) return `Suppose u₀ ∝ x^(−1/2) with δ = √(νx/u₀) ∝ x^(3/4). Then ρ∫u²dy = ρu₀²δC falls like x^(−1/4): from x/4 to x it would lose ${Viz.fmt((1 - Math.pow(4, -0.25)) * 100, { sig: 2 })} % of its momentum, yet no wall or force is present. Only x^(−1/3) keeps it constant.`;
  const R = n.Rex;
  const reg = R >= 1000 ? ` Re_x = ${Viz.fmt(R, { sig: 3 })} is far above our rule-of-thumb limit (about 100 laminar, over 1000 unstable), so a real jet here would already be turbulent — the laminar solution still shows two lessons that survive in round and turbulent jets: J stays, ṁ grows.`
    : R >= 100 ? ` Re_x = ${Viz.fmt(R, { sig: 3 })} is marginal (rule of thumb, ours): the sech² profile is close to going unstable.` : ` Re_x = ${Viz.fmt(R, { sig: 3 })} is small: a laminar jet like this can really be observed.`;
  return `<b>Momentum stays, mass grows.</b> The jet slows because the same J = ${f3(n.J)} N/m is shared with more fluid: per doubling of x, u₀ × ${f3(Math.pow(2, -1 / 3))} and ṁ × ${f3(Math.pow(2, 1 / 3))}. At x = ${f3(s.x)} m it is ${mm(n.h)} half-wide at the ${s.level} % level and carries ṁ = ${f3(n.md)} kg/(m s), ${f3(n.ratio)} × its value at x/2.` + reg;
}

    { name: 'v at eta = 2', js: g2.v, py: `ch09.free_jet(0.1, 2*ch09.free_jet_thickness(${A}), 1.0, 1.2, 1.5e-5)["v"]`, rtol: 1e-11 },
    { name: 'psi at eta = 2', js: g2.psi, py: `ch09.free_jet(0.1, 2*ch09.free_jet_thickness(${A}), 1.0, 1.2, 1.5e-5)["psi"]`, rtol: 1e-11 },
    { name: 'edge inflow v = -sqrt6 u0/(3 sqrt Re)', js: vEdgeF(Rx, u0F(...a)), py: `ch09.free_jet_entrainment_velocity(ch09.free_jet_reynolds(${A})["Re_x"])*ch09.free_jet_centreline(${A})`, rtol: 1e-12 },
    { name: 'mdot (water, J 1e-4, x 0.05)', js: mdotF(0.05, 1e-4, 1000, 1e-6), py: 'ch09.free_jet_mass_flux(0.05, 1e-4, 1000.0, 1e-6)', rtol: 1e-12 },
    { name: 'v at eta = 1.5 (water)', js: gw.v, py: 'ch09.free_jet(0.05, 1.5*ch09.free_jet_thickness(0.05, 1e-4, 1000.0, 1e-6), 1e-4, 1000.0, 1e-6)["v"]', rtol: 1e-11 },
    { name: 'rho int u^2 dy (x 0.2)', js: momentumNum(0.2, 1, 1.2, 1.5e-5), py: `ch09.jet_momentum_flux(${arr}, ch09.free_jet(0.2, ${arr}, 1.0, 1.2, 1.5e-5)["u"], 1.2)`, rtol: 1e-8 },
    { name: 'invariant: rho int u^2 dy = J', js: momentumNum(0.2, 1, 1.2, 1.5e-5), expect: 1.0, rtol: 1e-6 },
    { name: 'invariant: J at x/4 equals J at x', js: momentumNum(0.05, 1, 1.2, 1.5e-5) / momentumNum(0.2, 1, 1.2, 1.5e-5), expect: 1, rtol: 1e-9 },
    { name: 'invariant: 3f\'\'\' + ff\'\' + f\'^2 = 0 at eta = 2', js: ode, expect: 0, atol: 1e-7 },
    { name: 'invariant: rho u0^2 delta C = J', js: 1.2 * u0F(...a) ** 2 * d1 * C_FJ, expect: 1, rtol: 1e-12 },
    { name: 'invariant: mdot = 2 sqrt6 rho u0 delta', js: 2 * S6 * 1.2 * u0F(...a) * d1 / mdotF(...a), expect: 1, rtol: 1e-12 },
    { name: 'invariant: u0(2x)/u0(x) = 2^(-1/3)', js: u0F(0.2, 1, 1.2, 1.5e-5) / u0F(0.1, 1, 1.2, 1.5e-5), expect: Math.pow(2, -1 / 3), rtol: 1e-12 },
    { name: 'invariant: 1 % coefficient differs from the printed 5.6152', js: atLevel(0.01).coeff, expect: 7.3319, rtol: 1e-5 },
    { name: 'invariant: the printed 5.6152 is the 4 % point', js: atLevel(0.04).coeff / H99_PRINTED, expect: 1, rtol: 2e-5 },
    { name: 'invariant: sech^2 at the 1 % point = 0.01', js: sech2(atLevel(0.01).z), expect: 0.01, rtol: 1e-12 },
    { name: 'invariant: wrong exponent loses momentum', js: Math.pow(4, -0.25), expect: 0.7071067811865476, rtol: 1e-12 }
  ];
}

/* ---- the app ------------------------------------------------------------------------------------------------------ */
const CFG = {
  title: 'Where does a jet\'s extra mass come from?',
  subtitle: 'A laminar jet keeps its momentum flux J but slows and widens as x^(−1/3) and x^(2/3) — the sech² profile carries more and more mass drawn in from the sides',
  autoplay: false,
  params: {
    logJ: { label: 'Momentum flux $J$', min: -4, max: 2, step: 0.05, value: 0, fmt: v => Viz.fmt(Math.pow(10, v), { sig: 3, unit: 'N/m' }), help: 'momentum flux per unit span, log scale' },
    fluid: { type: 'select', label: 'Fluid', options: [['air', 'air'], ['water', 'water']], value: 'air', display: 'chips' },
    x: { label: 'Station $x$', min: 0.02, max: 1, step: 0.01, value: 0.1, unit: 'm', help: 'distance from the slot; ▶ sweeps it' },
    level: { label: 'Half-width level', min: 1, max: 50, step: 1, value: 1, unit: '% of u₀', help: 'where the speed has fallen to this fraction of the centre line' },
    wrong: { type: 'toggle', label: 'Test a wrong exponent', value: false, help: 'u₀ ∝ x^(−1/2) instead of x^(−1/3)' },
    pe: { label: 'Probe $\\eta$', min: 0.1, max: 10, step: 0.05, value: 2, optional: true, help: 'or click the jet or the profiles' }
  },
  modes: { param: 'mode', label: 'Profile axes', options: [['raw', 'raw y'], ['rescaled', 'rescaled η']], value: 'raw' },
  transport: { param: 'x', min: XMIN, max: XMAX, rate: 0.1, end: 'loop', unit: 'm' },
  presets: [
    { label: 'air slot jet', set: { fluid: 'air', logJ: 0, x: 0.1 }, title: 'air, J = 1 N/m, x = 0.1 m' },
    { label: 'water jet', set: { fluid: 'water', logJ: 0, x: 0.1 }, title: 'water, J = 1 N/m, x = 0.1 m' },
    { label: 'h at 1 %', set: { level: 1 }, title: 'half-width at 1 %: coefficient 7.3319 (corrected)' },
    { label: 'h at 4 % (book\'s 5.6152)', set: { level: 4 }, title: 'the 4 % point: the coefficient the book prints for 1 %' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'J', label: 'Momentum flux $J$', value: s => Math.pow(10, s.logJ), unit: 'N/m' },
    { id: 'u0', label: 'Centre-line $u_0$', value: s => N(s).u0, unit: 'm/s' },
    { id: 'delta', label: 'Thickness $\\delta$', value: s => N(s).d * 1000, unit: 'mm' },
    { id: 'mdot', label: 'Mass flux $\\dot m$', value: s => N(s).md, unit: 'kg/(m s)' },
    { id: 'h', label: 'Half-width $h$', value: s => N(s).h * 1000, unit: 'mm' },
    { id: 'Rex', label: 'Reynolds $Re_x$', value: s => N(s).Rex, fmt: v => Viz.fmt(v, { sig: 3 }) }
  ],
  stage: {
    rows: [1.1, 1],
    views: [
      { id: 'jet', row: 0, flex: 1.3, title: s => jetTitle(s) },
      { id: 'prof', row: 0, flex: 1, title: s => profTitle(s) },
      { id: 'slopes', row: 1, flex: 1, hidePortrait: true, title: s => slopesTitle(s) }
    ],
    draw(g, s) { drawJet(g, s); drawProf(g, s); drawSlopes(g, s); },
    onPointer(g, ev, s) {
      if (ev.type !== 'pointerdown') return false;
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const Xp = v.pointer.x, Yp = v.pointer.y, n = N(s), cl = e => Number(Math.max(0.1, Math.min(10, Math.abs(e))).toPrecision(3));
      if (ev.viewId === 'jet' && JP && JP.inside(Xp, Yp)) {
        const xc = Math.min(XMAX, Math.max(XMIN, Math.round(JP.ix(Xp) * 100) / 100)), dc = deltaF(xc, n.J, n.rho, n.nu);
        g.app.set({ x: xc, pe: cl(JP.iy(Yp) / 1000 / dc) }); return true;
      }
      if (ev.viewId === 'prof' && PRP && PRP.inside(Xp, Yp)) {
        const a = PRP.iy(Yp); g.app.set({ pe: cl(RES(s) ? a : a / 1000 / n.d) }); return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click the jet or the profile view to place the probe; its exact arithmetic appears here.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Press ▶ to sweep the station along the jet. Switch the profile axes between raw y and rescaled η, change J or the fluid, and click the jet to probe a point.',
    controls: ['logJ', 'fluid', 'x', 'level', 'wrong'],
    readouts: ['u0', 'delta', 'mdot', 'h', 'Rex'],
    callouts: [{ kind: 'try', html: 'Choose <b>rescaled η</b>: three stations, one curve. Then raise <b>J</b> by 0.3 (double it) and predict u₀, δ and ṁ before reading them.' },
      { kind: 'warn', html: 'The <b>half-width</b> depends on the level. Level 1 % gives 7.3319 δ; the book\'s printed 5.6152 δ belongs to the 4 % level.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
};
const app = Viz.app(CFG);
</script>
