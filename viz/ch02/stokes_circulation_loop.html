  const reading = {
    solid: `<b>Uniform spin.</b> The whole plane spins like a disc at b = 1 rad/s; every loop, anywhere, has Γ = 2b × area = 2 × ${fz(p.area)} = ${fz(p.Gamma)} m²/s. Move the loop: Γ stays; resize it: Γ ∝ A. The wheel turns at b, half the curl.`,

import numpy as np

u = {{upy}}   # the {{preset}} preset
cx, cy, R = {{cx}}, {{cy}}, {{R}}      # loop centre, radius [m]
loop = ch02.planar_loop([cx, cy], None, R, 400)   # ccw about +e3
Gamma = ch02.circulation(u, loop)   # ∮ u·t ds = {{Gamma}}  (2.34 right)
disc = ch02.planar_disc([cx, cy], None, R, 40, 80)   # A inside, n = +e3
flux = ch02.curl_flux(u, disc, curl_fn=u.curl_fn)   # = {{flux}}  (2.34 left)
chk = ch02.stokes_theorem_check(u, loop, disc, curl_fn=u.curl_fn)
chk.lhs - chk.rhs, chk.hypothesis_ok   # gap {{gap}}, {{ok}}
w3 = ch02.integral_curl_component(u, [cx, cy], None, h=0.1)  # {{w35}} 1/s
rect = ch02.rectangle_loop([cx, cy], None, 2*R, 2*R*{{aspect}}, 100)
Gamma_rect = ch02.circulation(u, rect)   # Ex. 2.6's loop: {{Grect}} m²/s`,

      live: s => { const p = phys(s); return `${tz(p.flux)} ${p.singularInside ? '\\neq' : '='} ${tz(p.Gamma)}\\ \\text{m}^{2}/\\text{s}` + (p.singularInside ? '\\quad\\text{(core inside: hypothesis fails)}' : ''); },
      note: 'Requires u differentiable on A. The right side is the circulation Γ of u about C.', symbols: [['\\Gamma = \\oint_C \\mathbf u\\cdot\\mathbf t\\,ds', 'circulation', 'm²/s'], ['A', 'the surface bounded by C', 'm²']] },
    { id: 'per_area', title: 'Curl as circulation per unit area', ref: 'Eq. (2.35)', tex: '\\begin{aligned} \\mathbf n\\cdot(\\nabla\\times\\mathbf u) &= \\lim_{A\\to 0}\\frac{\\Gamma}{A} \\\\ \\Gamma &= \\oint_C \\mathbf u\\cdot\\mathbf t\\,ds \\end{aligned}',
      live: s => { const p = phys(s); return `\\begin{aligned} \\Gamma/A &= ${tz(p.Gamma)}/${tz(p.area)} \\\\ &= ${tz(p.ratio)}\\ \\text{1/s} \\\\ ` + (isFinite(p.curlC) ? `\\mathbf n\\cdot(\\nabla\\times\\mathbf u)(\\mathbf c) &= ${tz(p.sign * p.curlC)}\\ \\text{1/s}` : '&\\text{curl undefined at the core}') + ' \\end{aligned}'; },
      note: 'A coordinate-free definition of the curl; exact at any size when the curl is uniform.' },
    { id: 'ex26', title: 'Ex. 2.6, one rectangle', ref: '§2.13, Example 2.6', tex: '\\begin{aligned} \\oint_{\\rm rect}\\mathbf u\\cdot\\mathbf t\\,ds \\approx\\ & \\big[u_2(x_1 + \\tfrac{\\Delta x_1}{2}) - u_2(x_1 - \\tfrac{\\Delta x_1}{2})\\big]\\Delta x_2 \\\\ & - \\big[u_1(x_2 + \\tfrac{\\Delta x_2}{2}) - u_1(x_2 - \\tfrac{\\Delta x_2}{2})\\big]\\Delta x_1 \\end{aligned}',
      live: s => { const p = phys(s); if (p.loop.kind !== 'rect') return '\\text{choose the rectangle to fill this in}'; const rl = p.sides[1] + p.sides[3], bt = p.sides[0] + p.sides[2]; return `${tz(rl)} + ${tzs(bt)} = ${tz(p.Gamma)}\\ \\text{m}^{2}/\\text{s}`; },
      note: 'Midpoint values × side lengths, signs from t. The book\'s x-plane version has u_y in the second bracket (it prints u_z; the printed result ∂u_z/∂y − ∂u_y/∂z confirms).' },

      note: 'φ = x₁² − x₂² here; Ch. 6\'s potential flow is built on exactly this.' }
