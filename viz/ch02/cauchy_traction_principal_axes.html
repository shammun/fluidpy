/* ---------------------------------------------------------------------------------------------------
   The explainer's state → one model object used by every view, readout, bar, badge and explanation
   --------------------------------------------------------------------------------------------------- */
let CUR_UNIT = 'Pa';
const unitOf = s => (s.mode === 'strain' ? '1/s' : 'Pa');
const symOf = s => (s.mode === 'strain' ? 'S' : '\\tau');            // TeX symbol of the tensor
const symTxt = s => (s.mode === 'strain' ? 'S' : 'τ');
const NM = s => (s.mode === 'strain' ? 'n·S·n' : 'σn');            // name of the normal part in the current mode
const SH = s => (s.mode === 'strain' ? 's·S·n' : 'τs');            // name of the shear part
const NMW = s => (s.mode === 'strain' ? 'stretch rate' : 'normal');
const SHW = s => (s.mode === 'strain' ? 'shear rate' : 'shear');

function syncReadoutLabels(s) {
  const want = { sn: s.mode === 'strain' ? 'Stretch rate n·S·n' : 'Normal part σn', ts: s.mode === 'strain' ? 'Shear rate s·S·n (signed)' : 'Shear part τs (signed)', r: s.mode === 'strain' ? 'Max shear rate = radius' : 'Max shear = Mohr radius' };
  Object.keys(want).forEach(id => document.querySelectorAll('[data-viz-key="readout:' + id + '"] .viz-readout-label').forEach(el => { if (el.textContent !== want[id]) el.textContent = want[id]; }));
}
const tauOf = s => (s.nonsym ? [[s.t11, s.t12], [0, s.t22]] : [[s.t11, s.t12], [s.t12, s.t22]]);

  CUR_UNIT = unitOf(s);

  const pr = principal2d([[tau[0][0], 0.5 * (tau[0][1] + tau[1][0])], [0.5 * (tau[0][1] + tau[1][0]), tau[1][1]]]);   // of the symmetric part (= τ when symmetric)
  const mo = mohr(tau), inv = invariants2d(tau), alt = tractionSecondIndex(tau, d.n);

  const onPrincipal = sym && mo.radius > 1e-9 && (dphi < 0.5 || dphi > 179.5 || Math.abs(dphi - 90) < 0.5);
  const onMaxShear = sym && mo.radius > 1e-9 && (Math.abs(dphi - 45) < 0.5 || Math.abs(dphi - 135) < 0.5);

/* number formatting: three decimals everywhere (0.500, −1.000), typographic minus in HTML, plain minus in TeX */
function fx(v, d) { d = d === undefined ? 3 : d; let t = Number(v).toFixed(d); if (parseFloat(t) === 0) t = (0).toFixed(d); return t.replace('-', '−'); }

const fdeg = v => fx(v, 1) + '°';
const P2 = (a, b) => '(' + fx(a) + ', ' + fx(b) + ')';
const T2 = (a, b) => '(' + tx(a) + ',\\ ' + tx(b) + ')';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------------------------------------------------------------------------------------------------
   Drawing helpers (all views share one state and one φ)
   --------------------------------------------------------------------------------------------------- */
const COL = { n: '#1a1f36', f: '#1a1f36', normal: Viz.color('blue'), shear: Viz.color('rose'), now: Viz.color('orange'), ghost: Viz.color('muted'), alt: Viz.color('amber'), band: Viz.color('blue') };

/** Clip the square [-a,a]² to the half-plane n·x ≥ 0 (Sutherland–Hodgman with one edge). */

  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(P.X(p[0]), P.Y(p[1])); else ctx.lineTo(P.X(p[0]), P.Y(p[1])); });
  ctx.closePath(); ctx.fill(); ctx.restore();

/** View 1 — the stressed element, the cut, n, f = n·τ and its blue/rose split (C04 arrows on the faces). */
function drawElement(v, s, app) {
  v.clear(); if (v.w < 60 || v.h < 60) return;
  const m = model(s), small = Math.min(v.w, v.h) < 200;
  const P = v.plot({ xlim: [-1.35, 1.35], ylim: [-1.35, 1.35], equal: true, pad: { l: 6, r: 6, t: 6, b: 6 } });
  if (s.sketch === 'tetra' && app.tab === 'derive') { drawTetra(P, s, m, Math.min(v.w, v.h) < 170, v); return; }
  const tau = m.tau, a = 0.95, k = 0.5 / Math.max(1, Math.abs(s.t11), Math.abs(s.t22), Math.abs(s.t12));
  // the element and the removed half (the material on the +n side, which pushes with f)
  fillPoly(P, [[-a, -a], [a, -a], [a, a], [-a, a]], Viz.color('accent'), 0.07);
  fillPoly(P, halfSquare(a, m.n), Viz.color('muted'), 0.16);
  P.poly([[-a, -a], [a, -a], [a, a], [-a, a], [-a, -a]], { color: Viz.alpha(Viz.color('text'), 0.55), width: 1.2 });
  // C04: stresses on the four faces — normal (blue) and shear (rose); reversed on the − faces
  const t11 = tau[0][0], t12 = tau[0][1], t21 = tau[1][0], t22 = tau[1][1], off = 0.04;
  const nw = 2, sw = 2;
  if (Math.abs(t11) > 1e-9) { P.arrow(a, 0, k * t11, 0, { color: COL.normal, width: nw }); P.arrow(-a, 0, -k * t11, 0, { color: COL.normal, width: nw }); }
  if (Math.abs(t22) > 1e-9) { P.arrow(0, a, 0, k * t22, { color: COL.normal, width: nw }); P.arrow(0, -a, 0, -k * t22, { color: COL.normal, width: nw }); }
  if (Math.abs(t12) > 1e-9) { P.arrow(a + off, -k * t12 / 2 + 0.3, 0, k * t12, { color: COL.shear, width: sw }); P.arrow(-a - off, k * t12 / 2 - 0.3, 0, -k * t12, { color: COL.shear, width: sw }); }
  if (Math.abs(t21) > 1e-9) { P.arrow(-k * t21 / 2 + 0.3, a + off, k * t21, 0, { color: COL.shear, width: sw }); P.arrow(k * t21 / 2 - 0.3, -a - off, -k * t21, 0, { color: COL.shear, width: sw }); }
  const S = m.sym2;
  if (!small) {
    if (Math.abs(t11) > 1e-9) arrowLabel(P, a + k * t11 + (t11 > 0 ? 0.16 : -0.16), -0.16, S + '₁₁', COL.normal);
    if (Math.abs(t22) > 1e-9) arrowLabel(P, 0.2, a + k * t22 + (t22 > 0 ? 0.12 : -0.12), S + '₂₂', COL.normal);
    if (Math.abs(t12) > 1e-9) arrowLabel(P, a + 0.2, 0.3 + k * t12 / 2 + (t12 > 0 ? 0.12 : -0.12), S + '₁₂', COL.shear);
    if (Math.abs(t21) > 1e-9) arrowLabel(P, 0.3 + k * t21 / 2 + (t21 > 0 ? 0.16 : -0.16), a + 0.14, S + '₂₁', COL.shear);
    else if (s.nonsym) arrowLabel(P, 0.45, a + 0.14, S + '₂₁ = 0', COL.shear);
  }
  // ghost principal axes with their λ (symmetric case only)
  if (m.sym && m.mo.radius > 1e-9) {
    const L = 1.3, bx = m.pr.bmax, bn = m.pr.bmin;
    P.line([-L * bx[0], L * bx[0]], [-L * bx[1], L * bx[1]], { color: Viz.alpha(COL.ghost, 0.6), width: 1.2, dash: [6, 5] });
    P.line([-L * bn[0], L * bn[0]], [-L * bn[1], L * bn[1]], { color: Viz.alpha(COL.ghost, 0.6), width: 1.2, dash: [6, 5] });
    if (!small) {
      const lx = bx[1] >= 0 ? 1 : -1, ln = bn[1] >= 0 ? 1 : -1;
      // short labels at the upper end of each axis, written outward so they stay clear of the face arrows
      const al = x => (x < -0.2 ? 'right' : x > 0.2 ? 'left' : 'center');
      P.text(lx * L * bx[0] * 1.01, lx * L * bx[1] * 1.01 + 0.07, 'λmax', { color: COL.ghost, size: 12, align: al(lx * bx[0]), weight: 650, dx: lx * bx[0] > 0.2 ? 3 : lx * bx[0] < -0.2 ? -3 : 0 });
      P.text(ln * L * bn[0] * 1.01, ln * L * bn[1] * 1.01 + 0.07, 'λmin', { color: COL.ghost, size: 12, align: al(ln * bn[0]), weight: 650, dx: ln * bn[0] > 0.2 ? 3 : ln * bn[0] < -0.2 ? -3 : 0 });
    }
  }
  // the cut (perpendicular to n) through the centre
  const cs = 1.12 * a;
  P.line([-cs * m.s[0], cs * m.s[0]], [-cs * m.s[1], cs * m.s[1]], { color: COL.n, width: 3 });
  // n (thin dark), f = n·τ (bold), blue normal part, rose shear part and the parallelogram
  const fN = [k * m.sigma_n * m.n[0], k * m.sigma_n * m.n[1]], fS = [k * m.tau_s * m.s[0], k * m.tau_s * m.s[1]];
  const fV = [k * m.f[0], k * m.f[1]];
  if (Math.abs(m.sigma_n) > 1e-9) { P.arrow(0, 0, fN[0], fN[1], { color: COL.normal, width: 3 }); P.line([fN[0], fV[0]], [fN[1], fV[1]], { color: Viz.alpha(COL.shear, 0.7), width: 1, dash: [3, 3] }); }
  if (Math.abs(m.tau_s) > 1e-9) { P.arrow(0, 0, fS[0], fS[1], { color: COL.shear, width: 3 }); P.line([fS[0], fV[0]], [fS[1], fV[1]], { color: Viz.alpha(COL.normal, 0.7), width: 1, dash: [3, 3] }); }
  if (s.nonsym) P.arrow(0, 0, k * m.alt[0], k * m.alt[1], { color: COL.alt, width: 2.2, dash: [5, 4] });
  if (m.magnitude > 1e-9) P.arrow(0, 0, fV[0], fV[1], { color: COL.f, width: 3.6, head: 11 });
  P.arrow(0, 0, 0.55 * m.n[0], 0.55 * m.n[1], { color: Viz.alpha(COL.n, 0.75), width: 1.6, head: 7 });
  P.dot(0, 0, 3.5, { color: COL.now, stroke: '#fff', strokeWidth: 1.5 });
  if (!small) {
    P.text(0.62 * m.n[0], 0.62 * m.n[1], 'n', { color: COL.n, weight: 700, size: 13, align: 'center' });
    if (m.magnitude > 1e-9) P.text(fV[0] * 1.12 + 0.05, fV[1] * 1.12 + 0.05, 'f', { color: COL.f, weight: 800, size: 14, align: 'center' });
    if (Math.abs(m.sigma_n) > 0.15 / k) P.text(fN[0] * 0.55 - 0.1 * m.s[0], fN[1] * 0.55 - 0.1 * m.s[1], NM(s) + ' n', { color: COL.normal, weight: 650, size: 12, align: 'center' });
    if (Math.abs(m.tau_s) > 0.15 / k) P.text(fS[0] * 0.55 + 0.1 * m.n[0], fS[1] * 0.55 + 0.1 * m.n[1], SH(s) + ' s', { color: COL.shear, weight: 650, size: 12, align: 'center' });
    if (s.nonsym) P.text(k * m.alt[0] * 1.15, k * m.alt[1] * 1.15 - 0.08, 'τ·n', { color: COL.alt, weight: 700, size: 12.5, align: 'center' });

    P.text(0, yb + (tall ? 0.42 : 0.18), 'grey half: the material on the +n side', { color: Viz.color('text-soft'), size: cs, align: 'center' });
    P.text(0, yb + (tall ? 0.22 : 0.05), 'f = its push per unit area across the cut', { color: Viz.color('text-soft'), size: cs, align: 'center' });
    if (tall) {
      P.text(0, yt - 0.2, 'bold f = n·' + m.sym2 + ' · thin n = cut normal', { color: Viz.color('text-soft'), size: 13, align: 'center' });
      P.text(0, yt - 0.4, NMW(s) + ' ' + NM(s) + ' n', { color: COL.normal, size: 13, weight: 650, align: 'right', dx: -6 });
      P.text(0, yt - 0.4, SHW(s) + ' ' + SH(s) + ' s', { color: COL.shear, size: 13, weight: 650, align: 'left', dx: 6 });
      P.text(0, yt - 0.6, 'grey dashed = principal axes (shear-free)', { color: COL.ghost, size: 13, align: 'center' });

}

/** The 2-D analogue of D05's tetrahedron: a triangle with two coordinate faces and one slanted face. */
function drawTetra(P, s, m, small, v) {
  const sh = clamp(s.shrink === undefined ? 1 : s.shrink, 0.08, 1);
  const ph = clamp(m.phi, 20 * DEG, 70 * DEG), c = Math.cos(ph), sn = Math.sin(ph);
  const hgt = 0.85 * sh, O = [0, 0], A = [hgt / c, 0], B = [0, hgt / sn];
  const gx = (O[0] + A[0] + B[0]) / 3, gy = (O[1] + A[1] + B[1]) / 3;                  // centroid → keep it at the origin
  const sx = x => x - gx, sy = y => y - gy;
  const tri = [[sx(O[0]), sy(O[1])], [sx(A[0]), sy(A[1])], [sx(B[0]), sy(B[1])]];
  fillPoly(P, tri, Viz.color('accent'), 0.08);
  P.poly(tri.concat([tri[0]]), { color: Viz.alpha(Viz.color('text'), 0.7), width: 1.4 });
  const k = 0.5 / Math.max(1, Math.abs(s.t11), Math.abs(s.t22), Math.abs(s.t12)), tau = m.tau;
  // face midpoints
  const m1 = [sx(0), sy(B[1] / 2)], m2 = [sx(A[0] / 2), sy(0)], m3 = [sx(A[0] / 2), sy(B[1] / 2)];
  // coordinate faces: outward normals −e₁ and −e₂ → tractions −τ₁· and −τ₂· (C04)
  const f1 = [-k * tau[0][0], -k * tau[0][1]], f2 = [-k * tau[1][0], -k * tau[1][1]];
  if (Math.hypot(...f1) > 1e-6) P.arrow(m1[0], m1[1], f1[0], f1[1], { color: COL.shear, width: 2.6 });
  if (Math.hypot(...f2) > 1e-6) P.arrow(m2[0], m2[1], f2[0], f2[1], { color: COL.shear, width: 2.6 });
  // slanted face: outward normal n, traction f
  const n = [c, sn], f = traction(tau, n);
  P.arrow(m3[0], m3[1], 0.4 * n[0], 0.4 * n[1], { color: Viz.alpha(COL.n, 0.75), width: 1.6, head: 7 });
  if (Math.hypot(...f) > 1e-9) P.arrow(m3[0], m3[1], k * f[0], k * f[1], { color: COL.f, width: 3.4, head: 11 });
  // body force + inertia per unit slanted area ∝ h: shrinks with the element
  const bodyLen = 0.4 * sh;
  P.arrow(0, 0.02, 0, -bodyLen, { color: Viz.alpha(Viz.color('muted'), 0.9), width: 2, dash: [3, 3] });
  if (!small) {
    P.text(m1[0] - 0.08, m1[1] + 0.12, 'dA₁ = n₁dA', { color: Viz.color('text-soft'), size: 12, align: 'right' });
    P.text(m2[0] - 0.05, m2[1] - 0.14, 'dA₂ = n₂dA', { color: Viz.color('text-soft'), size: 12, align: 'left' });
    P.text(m3[0] + 0.42 * n[0] + 0.06, m3[1] + 0.42 * n[1] + 0.06, 'n, dA', { color: COL.n, weight: 700, size: 12.5, align: 'left' });
    // face-traction labels sit just beyond each arrow tip, on the side the arrow points to
    const tipLabel = (mid, fv, str) => { const L = Math.hypot(fv[0], fv[1]); if (L < 1e-6) return; const ux = fv[0] / L, uy = fv[1] / L;
      P.text(mid[0] + fv[0] + 0.14 * ux, mid[1] + fv[1] + 0.14 * uy, str, { color: COL.shear, weight: 650, size: 12, align: ux < -0.3 ? 'right' : ux > 0.3 ? 'left' : 'center', baseline: uy < -0.3 ? 'top' : uy > 0.3 ? 'bottom' : 'middle' }); };
    tipLabel(m1, f1, '−τ₁·'); tipLabel(m2, f2, '−τ₂·');
    if (Math.hypot(...f) > 1e-9) P.text(m3[0] + k * f[0] * 1.15 + 0.06, m3[1] + k * f[1] * 1.15, 'f', { color: COL.f, weight: 800, size: 14, align: 'left' });
    P.text(0.07, -bodyLen * 0.55, 'ρ(g−a) dV/dA ∝ h', { color: Viz.color('text-soft'), size: 12, align: 'left' });
    if (v.w > 230) P.text(0, -1.3, 'face forces per unit area stay; the volume term shrinks with h', { color: Viz.color('text-soft'), size: 12, align: 'center' });
    P.text(0, 1.27, 'element size h = ' + fx(sh, 2), { color: Viz.color('text-soft'), size: 12, align: 'center', weight: 600 });
  }
}

/** View 2 — σ_n(φ) blue and τ_s(φ) rose over one half-turn, the bounds and the special cuts. */
function drawCurves(v, s, app) {
  v.clear(); syncReadoutLabels(s); if (v.w < 60 || v.h < 60) return;
  const m = model(s), narrow = v.w < 420, small = v.h < 150;
  const N = 181, phis = Viz.num.linspace(0, Math.PI, N), sv = stressVsAngle(m.tau, phis);
  let M = Math.max(Math.abs(m.pr.lam[0]), Math.abs(m.pr.lam[1]), Viz.num.max(sv.sigma_n.map(Math.abs)), Viz.num.max(sv.tau_s.map(Math.abs)), 0.05) * 1.25;
  const P = v.plot({ xlim: [0, 180], ylim: [-M, M], xlabel: small ? null : 'φ = angle of the cut normal [°]', ylabel: narrow || small ? null : (m.sym2 === 'S' ? 'strain rate [1/s]' : 'stress [Pa]'), pad: { l: narrow ? 40 : 52, r: 12, t: 10, b: small ? 20 : 36 } });
  P.axes({ xticks: [0, 45, 90, 135, 180] });
  if (m.sym) {
    P.fillBetween([0, 180], m.pr.lam[0], m.pr.lam[1], { color: COL.band, alpha: 0.07 });
    [0, 1].forEach(i => { const L = m.pr.lam[i]; P.line([0, 180], [L, L], { color: Viz.alpha(COL.ghost, 0.8), width: 1.2, dash: [6, 4] }); if (!small) P.text(179, L, (i ? 'λmax ' : 'λmin ') + fx(L), { color: COL.ghost, size: 12, align: 'right', dy: i ? -9 : 10, weight: 600 }); });
    if (m.mo.radius > 1e-9) {
      const thp = mod180(m.thpDeg);
      [thp, mod180(thp + 90)].forEach((x, i) => { P.line([x, x], [-M, M], { color: Viz.alpha(COL.normal, 0.45), width: 1, dash: [2, 3] }); if (!small && !narrow) P.text(x, i ? -M * 0.88 : M * 0.88, SH(s) + ' = 0', { color: COL.normal, size: 12, align: x < 12 ? 'left' : x > 168 ? 'right' : 'center', weight: 600 }); });
      [mod180(thp + 45), mod180(thp + 135)].forEach((x, i) => { P.line([x, x], [-M, M], { color: Viz.alpha(COL.shear, 0.45), width: 1, dash: [2, 3] }); if (!small && !narrow) P.text(x, i ? M * 0.88 : -M * 0.88, 'max shear', { color: COL.shear, size: 12, align: x < 12 ? 'left' : x > 168 ? 'right' : 'center', weight: 600 }); });
    }
  }
  const deg = phis.map(p => p / DEG);
  P.line(deg, sv.sigma_n, { color: Viz.alpha(COL.normal, 0.3), width: 1.6 });
  P.line(deg, sv.tau_s, { color: Viz.alpha(COL.shear, 0.3), width: 1.6 });
  const upto = Math.max(1, Math.round(s.phi)) + 1;
  P.line(deg.slice(0, upto), sv.sigma_n.slice(0, upto), { color: COL.normal, width: 2.8 });
  P.line(deg.slice(0, upto), sv.tau_s.slice(0, upto), { color: COL.shear, width: 2.8 });
  P.line([s.phi, s.phi], [-M, M], { color: Viz.alpha(COL.now, 0.6), width: 1 });
  P.dot(s.phi, m.sigma_n, 5.5, { color: COL.normal, stroke: COL.now, strokeWidth: 2.5 });
  P.dot(s.phi, m.tau_s, 5.5, { color: COL.shear, stroke: COL.now, strokeWidth: 2.5 });
  if (!small && !narrow) { P.text(s.phi, m.sigma_n, NM(s) + ' ' + fx(m.sigma_n), { color: COL.normal, size: 12, weight: 700, dx: 8, dy: -10 }); P.text(s.phi, m.tau_s, SH(s) + ' ' + fx(m.tau_s), { color: COL.shear, size: 12, weight: 700, dx: 8, dy: 12 }); }
}

/** View 3 — Mohr's circle: every cut is one point (σ_n, τ_s); the current cut, its perpendicular partner, the λ's. */
function drawMohr(v, s, app) {
  v.clear(); if (v.w < 60 || v.h < 60) return;
  const m = model(s), small = Math.min(v.w, v.h) < 220;
  const c = m.mo.center, r = m.mo.radius, R = Math.max(r, 0.08 * Math.max(1, Math.abs(c)), 0.05);
  const P = v.plot({ xlim: [c - 1.5 * R, c + 1.5 * R], ylim: [-1.5 * R, 1.5 * R], equal: true, xlabel: small ? null : NM(s) + ' [' + m.unit + ']', ylabel: small ? null : SH(s) + ' [' + m.unit + ']', pad: { l: small ? 40 : 52, r: 10, t: 8, b: small ? 22 : 36 } });
  P.axes({ xticks: Viz.num.niceTicks(c - 1.5 * R, c + 1.5 * R, 3), yticks: Viz.num.niceTicks(-1.5 * R, 1.5 * R, 3) });
  if (m.sym) {
    const ts = Viz.num.linspace(0, 2 * Math.PI, 121);
    P.line(ts.map(t => c + r * Math.cos(t)), ts.map(t => r * Math.sin(t)), { color: Viz.alpha(Viz.color('accent'), 0.85), width: 2 });
    // the perpendicular cut (φ + 90°) is the antipode; the diameter joins them
    const d2 = traction2d(m.tau, m.phi + Math.PI / 2);
    P.line([m.sigma_n, d2.sigma_n], [m.tau_s, d2.tau_s], { color: Viz.alpha(COL.ghost, 0.8), width: 1.2, dash: [4, 3] });
    P.dot(d2.sigma_n, d2.tau_s, 3.5, { color: COL.ghost });
    // principal points
    P.dot(m.pr.lam[0], 0, 4, { color: COL.ghost }); P.dot(m.pr.lam[1], 0, 4, { color: COL.ghost });
    if (!small) { P.text(m.pr.lam[0], 0, 'λmin', { color: COL.ghost, size: 12, align: 'center', dy: 14, weight: 600 }); P.text(m.pr.lam[1], 0, 'λmax', { color: COL.ghost, size: 12, align: 'center', dy: 14, weight: 600 }); }
    // the double angle 2(φ − θp), measured clockwise from the λmax point
    if (r > 1e-9) {
      const psi = -2 * (m.phi - m.pr.angle), ctx = P.ctx, ar = Math.min(P.sx(r) * 0.45, 40);
      ctx.save(); ctx.strokeStyle = COL.now; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.arc(P.X(c), P.Y(0), ar, 0, -psi, psi > 0 ? false : true); ctx.stroke(); ctx.restore();
      if (!small) P.text(c, 0, '2(φ − θp) = ' + fx(-psi / DEG, 0) + '°', { color: COL.now, size: 12, align: 'center', dy: psi > 0 ? 18 + ar : -(14 + ar), weight: 600 });
      P.line([c, m.sigma_n], [0, m.tau_s], { color: Viz.alpha(COL.now, 0.8), width: 1.3 });
    }
  } else {
    // non-symmetric τ: the locus of (σ_n, τ_s) is not a circle — draw what it really is
    const phis = Viz.num.linspace(0, Math.PI, 181), sv = stressVsAngle(m.tau, phis);
    P.line(sv.sigma_n, sv.tau_s, { color: Viz.alpha(COL.alt, 0.9), width: 2 });
    if (!small) P.text(c, 1.3 * R, 'not a circle: τ is not symmetric', { color: COL.alt, size: 12, align: 'center', weight: 600 });
  }
  P.dot(m.sigma_n, m.tau_s, 6, { color: COL.now, stroke: '#fff', strokeWidth: 2 });
  if (!small) { const right = m.sigma_n > c; P.text(m.sigma_n, m.tau_s, 'your cut', { color: COL.now, size: 12, weight: 700, dx: right ? -9 : 9, dy: -9, align: right ? 'right' : 'left' }); }
  if (r < 1e-9 && m.sym && !small) P.text(c, 0.6 * R, 'hydrostatic: the circle is a point', { color: Viz.color('text-soft'), size: 12, align: 'center' });
}

/* pointer → φ (all three views) */
function setPhi(app, deg) { app.play(false); app.set({ phi: Math.round(mod180(deg)) }); }

   --------------------------------------------------------------------------------------------------- */
/** status verdict in stress names; the strain-rate mode renames σn → n·S·n, τs → s·S·n (see status:) */
function statusRaw(s) {
    // three lengths: phones (< 520 px) get the verdict + one number, landscape phones a medium line, big screens the full text
    const m = model(s), u = m.unit, Wd = window.innerWidth || 1000, short = Wd < 520, mid = Wd < 1100;
    if (s.nonsym) return { text: short ? '⚠️ n·τ ≠ τ·n: τ not symmetric' : mid ? '⚠️ non-symmetric τ: n·τ = ' + P2(m.f[0], m.f[1]) + ' ≠ τ·n = ' + P2(m.alt[0], m.alt[1]) + ' ' + u : '⚠️ non-symmetric τ: n·τ = ' + P2(m.f[0], m.f[1]) + ' ≠ τ·n = ' + P2(m.alt[0], m.alt[1]) + ' ' + u + ' — Ch. 4 shows the stress is symmetric', tone: 'warn' };
    if (m.hydro) return { text: short ? '🌊 hydrostatic: f = −p n, p = ' + fx(-m.mo.center) + ' ' + u : '🌊 hydrostatic: every plane is principal, f = −p n with p = ' + fx(-m.mo.center) + ' ' + u, tone: 'info' };
    if (m.onPrincipal) { const which = Math.abs(m.sigma_n - m.pr.lam[1]) < Math.abs(m.sigma_n - m.pr.lam[0]) ? 'λmax' : 'λmin'; return { text: short ? '🎯 principal plane: σn = ' + which + ' = ' + fx(m.sigma_n) + ' ' + u : '🎯 principal plane: τs = ' + fx(m.tau_s) + ', σn = ' + which + ' = ' + fx(m.sigma_n) + ' ' + u, tone: 'good' }; }
    if (m.onMaxShear) return { text: short ? '🔪 max-shear plane: τs = ' + fx(m.tau_s) + ' ' + u : '🔪 maximum-shear plane: τs = ±(λmax − λmin)/2 = ' + fx(m.tau_s) + ' ' + u + ', σn = centre = ' + fx(m.mo.center) + ' ' + u, tone: 'good' };
    return { text: short ? '↗ σn ' + fx(m.sigma_n) + ', τs ' + fx(m.tau_s) + ' ' + u + ' · ' + fx(m.shearPct, 0) + ' % of max shear' : mid ? '↗ f = ' + P2(m.f[0], m.f[1]) + ' ' + u + ': σn = ' + fx(m.sigma_n) + ', τs = ' + fx(m.tau_s) + ' (' + fx(m.shearPct, 0) + ' % of max shear)' : '↗ f = ' + P2(m.f[0], m.f[1]) + ' ' + u + ': σn = ' + fx(m.sigma_n) + ', τs = ' + fx(m.tau_s) + ' — ' + fx(m.shearPct, 0) + ' % of the maximum shear', tone: 'info' };
}

  explain: {
    html: s => {
      const m = model(s), t = m.tau, n = m.n, sv = m.s, S = symOf(s), St = m.sym2, u = m.unit, mo = m.mo, pr = m.pr, inv = m.inv;
      const u2 = s.mode === 'strain' ? '1/s²' : 'Pa²';
      let out = W.step(0, 'What the windows show') +
        W.say('<b>The element</b> is one point\'s ' + (s.mode === 'strain' ? 'strain-rate' : 'stress') + ' state drawn as a square in its own axes: <span class="c-blue">blue</span> arrows are the normal components, <span class="c-rose">rose</span> the shear ones, reversed on the − faces (C04\'s sign rule). The thick black line is your cut, <b>n</b> its normal, <b>f</b> the force per area that the grey half exerts across the cut, split into a <span class="c-blue">blue normal push/pull</span> and a <span class="c-rose">rose slide</span>. Faint grey dashed lines are the two directions with no slide at all. <b>The curves</b> show how the blue and rose parts change as the cut turns; <b>Mohr\'s circle</b> is the same information as one circle — every cut is a point on it, and <span class="c-orange">orange</span> marks your cut everywhere.') +
        W.hint('On portrait phones Mohr\'s circle is hidden; its centre and radius are printed in the curve window\'s title and worked out in section 6.');
      out += W.step(1, 'Your normal') +
        W.line('$\\mathbf n = (\\cos\\phi, \\sin\\phi) = (\\cos ' + tx(s.phi, 0) + '°, \\sin ' + tx(s.phi, 0) + '°)$', P2(n[0], n[1]), 'a unit vector: n₁² + n₂² = 1; the cut itself is the line perpendicular to n');
      out += W.step(2, 'Cauchy $f_i = \\tau_{ji}n_j$ (2.15) term by term') +
        W.say('$f_i = ' + S + '_{ji} n_j$ contracts the <b>first</b> index (row j = face j) with n:') +
        W.line('$f_1 = ' + S + '_{11}n_1 + ' + S + '_{21}n_2 = ' + tx(t[0][0]) + '\\times' + tx(n[0]) + ' + ' + tx(t[1][0]) + '\\times' + tx(n[1]) + '$', fx(m.f[0]) + ' ' + u, 'row 1 (face 1) and row 2 (face 2), first column') +
        W.line('$f_2 = ' + S + '_{12}n_1 + ' + S + '_{22}n_2 = ' + tx(t[0][1]) + '\\times' + tx(n[0]) + ' + ' + tx(t[1][1]) + '\\times' + tx(n[1]) + '$', fx(m.f[1]) + ' ' + u, 'second column') +
        W.line('$|\\mathbf f| = \\sqrt{f_1^2 + f_2^2} = \\sqrt{' + tx(m.f[0] * m.f[0]) + ' + ' + tx(m.f[1] * m.f[1]) + '}$', fx(m.magnitude) + ' ' + u, 'direction atan2(f₂, f₁) = ' + fdeg(m.angle / DEG) + (Math.abs(s.t11) < 1e-9 && Math.abs(s.t22) < 1e-9 && Math.abs(Math.abs(s.t12) - 1) < 1e-9 && Math.abs(s.phi - 30) < 1e-9 && !s.nonsym ? ' — Ex. 2.2\'s numbers (60° for a > 0, 240° for a < 0)' : '')) +
        W.box('$\\mathbf f = \\mathbf n\\cdot\\boldsymbol' + (s.mode === 'strain' ? '{S}' : '\\tau') + ' = \\mathbf{' + T2(m.f[0], m.f[1]) + '}$ ' + u);
      if (s.nonsym) out += W.say('<span class="c-orange">The other contraction τ·n (second index) gives ' + P2(m.alt[0], m.alt[1]) + ' ' + u + ' — different. The index order is not a formality; only symmetry makes the two agree.</span>');
      out += W.step(3, 'Normal and shear parts of f') +
        W.line('$\\sigma_n = \\mathbf f\\cdot\\mathbf n = ' + tx(m.f[0]) + '\\times' + tx(n[0]) + ' + ' + tx(m.f[1]) + '\\times' + tx(n[1]) + '$', fx(m.sigma_n) + ' ' + u, m.sigma_n > 1e-9 ? 'positive: a pull (tension)' : m.sigma_n < -1e-9 ? 'negative: a push (compression)' : 'zero: no normal load') +
        W.line('$\\tau_s = \\mathbf f\\cdot\\mathbf s,\\quad \\mathbf s = (-\\sin\\phi, \\cos\\phi) = ' + T2(sv[0], sv[1]) + '$', fx(m.tau_s) + ' ' + u, 'signed along the counter-clockwise tangent s; |τs| = |f − σn n|') +
        W.box('<span class="c-blue">σn = ' + fx(m.sigma_n) + '</span>, <span class="c-rose">τs = ' + fx(m.tau_s) + '</span> ' + u + '; check: σn² + τs² = ' + fx(m.sigma_n * m.sigma_n + m.tau_s * m.tau_s) + ' = |f|² = ' + fx(m.magnitude * m.magnitude)) +
        (s.mode === 'strain' ? W.say('In strain-rate mode <span class="c-blue">σn = n·S·n</span> is the <b>stretching rate</b> of a line element along n and <span class="c-rose">τs = s·S·n</span> the <b>shearing rate</b> across the cut (Ch. 3); the views are labelled that way.') : '') + W.say('Both are sums of $\\cos 2\\phi$ and $\\sin 2\\phi$ terms (for pure shear exactly $a\\sin 2\\phi$ and $a\\cos 2\\phi$): the double angle is why the curves repeat every 180° and why Mohr\'s circle is traversed twice as fast as the cut turns.');
      out += W.step(4, 'The invariants of your ' + St) +
        W.line('$I_1 = ' + S + '_{11} + ' + S + '_{22} = ' + tx(t[0][0]) + ' + ' + tx(t[1][1]) + '$', fx(inv.I1) + ' ' + u, 'the trace: the same in every frame (D18)') +
        W.line('$I_2 = \\det ' + S + ' = ' + S + '_{11}' + S + '_{22} - ' + S + '_{12}' + S + '_{21} = ' + tx(t[0][0] * t[1][1]) + ' - ' + tx(t[0][1] * t[1][0]) + '$', fx(inv.I2) + ' ' + u2, 'the determinant; the eigenvalues solve λ² − I₁λ + I₂ = 0');
      if (m.sym) {
        const disc = 0.25 * (t[0][0] - t[1][1]) * (t[0][0] - t[1][1]) + t[0][1] * t[0][1];
        out += W.step(5, 'Principal values and axes (D17)') +
          W.line('$\\lambda = \\tfrac{I_1}{2} \\pm \\sqrt{\\big(\\tfrac{' + S + '_{11} - ' + S + '_{22}}{2}\\big)^2 + ' + S + '_{12}^2} = ' + tx(mo.center) + ' \\pm \\sqrt{' + tx(disc) + '}$', fx(pr.lam[0]) + ', ' + fx(pr.lam[1]) + ' ' + u, 'the quadratic formula; the root is real because the discriminant is a sum of squares (D17 step 5)') +
          W.line('$\\theta_p = \\tfrac12\\,\\mathrm{atan2}(2' + S + '_{12},\\ ' + S + '_{11} - ' + S + '_{22}) = \\tfrac12\\,\\mathrm{atan2}(' + tx(2 * t[0][1]) + ', ' + tx(t[0][0] - t[1][1]) + ')$', fdeg(m.thpDeg), 'direction of the λmax axis (grey dashed); λmin is 90° away') +
          W.line('$\\mathbf b_{\\max} = ' + T2(pr.bmax[0], pr.bmax[1]) + ',\\quad \\mathbf b_{\\min} = ' + T2(pr.bmin[0], pr.bmin[1]) + '$', 'det [b_min b_max] = +1', 'unit eigenvectors, ordered as principal_axes does (λ ascending, a rotation)') +
          W.box('Rotating the axes onto them (Eq. 2.12): $' + S + '\' = \\mathbf C^{\\rm T}' + S + '\\mathbf C = \\mathrm{diag}(' + tx(pr.lam[0]) + ',\\ ' + tx(pr.lam[1]) + ')$ ' + u + (s.mode === 'strain' && Math.abs(s.t11) < 1e-9 && Math.abs(s.t22) < 1e-9 ? ' — Ex. 2.4 with Γ = ' + fx(s.t12, 1) : ''));
        out += W.step(6, 'The bounds — §2.11 fact (4), sharp form') +
          W.line('$\\lambda_{\\min} \\le \\sigma_n \\le \\lambda_{\\max}$', fx(pr.lam[0]) + ' ≤ ' + fx(m.sigma_n) + ' ≤ ' + fx(pr.lam[1]) + ' ✓', 'σn is a weighted mean of the λ\'s with weights (n·b)² (D17 steps 13–14)') +
          W.line('$|\\tau_s| \\le \\tfrac{\\lambda_{\\max} - \\lambda_{\\min}}{2} = \\tfrac{' + tx(pr.lam[1]) + ' - (' + tx(pr.lam[0]) + ')}{2}$', fx(mo.radius) + ' ' + u, 'yours is ' + fx(Math.abs(m.tau_s)) + ' = ' + fx(m.shearPct, 0) + ' % of it; the maximum is reached at θp ± 45° = ' + fdeg(mod180(m.thpDeg + 45)) + ', ' + fdeg(mod180(m.thpDeg + 135))) +
          W.box('Mohr: centre $I_1/2 = ' + tx(mo.center) + '$, radius $' + tx(mo.radius) + '$ ' + u + '; your point sits at $2(\\phi - \\theta_p) = ' + tx(2 * (s.phi - m.thpDeg), 0) + '°$ clockwise from the λmax point');
      } else {
        out += W.step(5, 'Principal axes need symmetry') + W.say('With $\\tau_{21} = 0 \\ne \\tau_{12}$ the four facts of §2.11 (real λ, perpendicular axes, diagonal form, bounds) are not guaranteed — the grey axes are those of the symmetric part only, and the Mohr locus is not a circle. Switch the toggle off to see them return.') +
          W.step(6, 'Two contractions') + W.line('$(\\mathbf n\\cdot\\boldsymbol\\tau)_i = \\tau_{ji}n_j$', P2(m.f[0], m.f[1]) + ' ' + u, 'the traction $f_i = \\tau_{ji}n_j$ (2.15), black arrow') + W.line('$(\\boldsymbol\\tau\\cdot\\mathbf n)_i = \\tau_{ij}n_j$', P2(m.alt[0], m.alt[1]) + ' ' + u, 'the amber arrow: not the traction');
      }
      out += W.step(7, 'The tetrahedron behind $f_i = \\tau_{ji}n_j$ (2.15)') +
        W.say('Open the Derivation tab: a small element with two coordinate faces and one slanted face of normal n. The coordinate faces carry the reversed rows $-' + S + '_{j\\cdot}$ (C04), the slanted face carries f, and the face areas are $dA_j = n_j\\,dA = ' + T2(n[0], n[1]) + '\\,dA$. Weight and inertia scale with the volume (h³), the face forces with the area (h²), so shrinking the element leaves $f_i = ' + S + '_{ji}n_j$.');
      out += W.step(8, 'At the current cut') +
        W.line('$\\phi$', Viz.live('phi') + '°') + W.line('<span class="c-blue">$\\sigma_n$</span>', Viz.live('sn') + ' ' + u) + W.line('<span class="c-rose">$\\tau_s$</span>', Viz.live('ts') + ' ' + u) +
        W.line('share of the maximum shear', Viz.live('pct') + ' %');
      let interp;
      if (s.nonsym) interp = 'With τ₂₁ ≠ τ₁₂ the two contractions disagree; Ch. 4 proves the stress tensor is symmetric, so for a real stress they never do — this toggle only shows why the index order in $f_i = \\tau_{ji}n_j$ (2.15) matters.';
      else if (m.hydro) interp = 'f = −p n on every cut: the stress state of a fluid at rest (Ch. 1). No direction is special, so there is no principal direction to find; the curves are flat and the circle is a point.';
      else if (s.mode === 'strain') interp = 'λ = ' + fx(pr.lam[0]) + ' and ' + fx(pr.lam[1]) + ' 1/s are the squeezing and stretching rates along the axes at θp = ' + fdeg(m.thpDeg) + ' and θp + 90° — Ex. 2.4 for pure shear; the fluid element in the strain-vs-rotation explainer does exactly this.';
      else if (m.onPrincipal) interp = 'No slide across this cut — the material here is pulled straight apart (or squeezed) by ' + fx(m.sigma_n) + ' ' + u + '; a crack would open on this plane. The other shear-free cut is 90° away.';
      else if (m.onMaxShear) interp = 'The slide is as large as it can be, ' + fx(Math.abs(m.tau_s)) + ' ' + u + ' — the plane a ductile material yields on; note it is 45° from the principal axes, where the normal stress equals the Mohr centre.';
      else interp = 'Your cut carries both: ' + fx(m.sigma_n) + ' ' + u + ' of ' + (m.sigma_n >= 0 ? 'pull' : 'squeeze') + ' and ' + fx(m.tau_s) + ' ' + u + ' of slide (' + fx(m.shearPct, 0) + ' % of the maximum). Turn φ by ±45° to trade one for the other; at θp = ' + fdeg(mod180(m.thpDeg)) + ' the slide vanishes.';
      return out + W.interpret(interp, 'Reading the current setting');
    },
    live: s => { const m = model(s); return { phi: fx(s.phi, 0), sn: fx(m.sigma_n), ts: fx(m.tau_s), pct: fx(m.shearPct, 0) }; }
  },
  derivations: [
    { id: 'D05', title: 'Cauchy\'s traction formula from a shrinking tetrahedron', short: 'D05 · (2.15)', ref: 'Eq. (2.15)', view: 'element',
      goal: 'Find the force per unit area on a plane with any unit normal n from the nine stresses on the three coordinate planes.',
      start: { tex: '\\sum\\mathbf F = m\\,\\mathbf a', plain: 'Newton\'s second law for the fluid inside a tetrahedron with three faces on the coordinate planes and one slanted face with outward normal n.' },
      plan: ['List the forces: the slanted face, the three coordinate faces, weight and inertia.', 'Write the coordinate faces\' tractions with C04\'s sign rule.', 'Relate the face areas to n.', 'Shrink: volume terms vanish faster than face terms.'],
      uses: ['free-body diagram and Newton\'s second law', 'the stress sign convention on the −e_j faces (C04)', 'vector area of a closed surface, $dA_j = n_j\\,dA$', 'orders of smallness h² vs h³', 'limits'],
      set: { sketch: 'tetra', shrink: 1, phi: 30 },
      steps: [
        { did: 'Write the force balance on the tetrahedron', tex: '\\mathbf F_{\\rm slant} + \\mathbf F_1 + \\mathbf F_2 + \\mathbf F_3 + \\mathbf F_{\\rm body} = \\rho\\,dV\\,\\mathbf a',
          why: 'Newton\'s second law for the mass ρ dV inside; every force on the boundary and in the volume is listed (free-body diagram).', plain: 'Four face forces plus the body force equal mass times acceleration.', set: { sketch: 'tetra', shrink: 1 },
          watch: 'The sketch is the 2-D version: two coordinate faces and one slanted face with normal n.' },
        { did: 'Write the slanted face\'s force', tex: '\\mathbf F_{\\rm slant} = \\mathbf f\\,dA',
          why: 'By definition $\\mathbf f$ is the force per unit area on the plane with normal n, and dA is that face\'s area. This is the unknown we want.', plain: 'The slanted face carries the traction we are after.', set: { sketch: 'tetra', shrink: 1 } },
        { did: 'Write the coordinate faces\' forces with the sign rule', tex: '(F_j)_i = -\\,\\tau_{ji}\\,dA_j\\qquad(j = 1, 2, 3\\text{, no sum})',
          why: 'The face perpendicular to axis j has outward normal $-\\mathbf e_j$; by C04\'s rule the traction on a − face is the reversed row j, so its i-component is $-\\tau_{ji}$.', plain: 'Each coordinate face pushes with minus its row of τ.', set: { sketch: 'tetra', shrink: 1 },
          watch: 'The rose arrows on the two coordinate faces are −τ₁· and −τ₂·: the rows of τ, reversed.' },
        { did: 'Write body force and inertia together', tex: '\\mathbf F_{\\rm body} - \\rho\\,dV\\,\\mathbf a = \\rho(\\mathbf g - \\mathbf a)\\,dV',
          why: 'Both are proportional to the mass, hence to the volume dV; we group them because they will share the same fate when the element shrinks.', plain: 'Weight and inertia scale with the volume.', set: { sketch: 'tetra', shrink: 1 } },
        { did: 'Assemble the i-component', tex: '\\begin{aligned} f_i\\,dA &- \\tau_{1i}dA_1 - \\tau_{2i}dA_2 - \\tau_{3i}dA_3 \\\\ &+ \\rho(g_i - a_i)\\,dV = 0 \\end{aligned}',
          why: 'Steps 2–4 substituted into step 1, component i. The book\'s first line is this one without the volume term (and for i = 1).', plain: 'Slanted face minus the three coordinate faces plus volume terms is zero.', set: { sketch: 'tetra', shrink: 1 } },
        { did: 'Relate the face areas to the normal', tex: 'dA_j = n_j\\,dA',
          why: 'The vector area of a closed surface vanishes: $\\mathbf n\\,dA - \\mathbf e_1dA_1 - \\mathbf e_2dA_2 - \\mathbf e_3dA_3 = 0$; reading component j gives this. Face j is the shadow of the slanted face.', plain: 'Each coordinate face is the slanted face times a cosine.', set: { sketch: 'tetra', shrink: 1 },
          live: s => { const n = model(s).n; return '\\begin{aligned} dA_1 &= n_1\\,dA = ' + tx(n[0]) + '\\,dA \\\\ dA_2 &= n_2\\,dA = ' + tx(n[1]) + '\\,dA \\end{aligned}'; },
          watch: 'In the sketch the vertical face has length n₁ dA and the horizontal face n₂ dA.' },
        { did: 'Substitute the areas and write the sum with an index', tex: 'f_i\\,dA - \\tau_{ji}\\,n_j\\,dA + \\rho(g_i - a_i)\\,dV = 0',
          why: 'Step 6 into step 5; the three face terms share the pattern $\\tau_{ji}n_j\\,dA$ with j summed (summation convention, C01).', plain: 'The three faces together give τ contracted with n on its first index.', set: { sketch: 'tetra', shrink: 1 } },
        { did: 'Divide by dA and compare sizes', tex: '\\begin{aligned} f_i - \\tau_{ji}n_j &+ \\rho(g_i - a_i)\\,\\frac{dV}{dA} = 0 \\\\ \\frac{dV}{dA} &\\propto h \\end{aligned}',
          why: 'dA ≠ 0. For a tetrahedron of size h, dA ∝ h² and dV ∝ h³, so dV/dA ∝ h (orders of smallness); ρ, g, a stay finite.', plain: 'The volume term is smaller than the face terms by the element\'s size.', set: { sketch: 'tetra', shrink: 0.5 },
          watch: 'The element is drawn at half its size: the face arrows (per unit area) are unchanged, the dashed volume term has shrunk to half — it scales with h.' },
        { did: 'Let the element shrink to the point', tex: 'f_i = \\tau_{ji}\\,n_j',
          why: 'As h → 0 the last term of step 8 vanishes while the others do not depend on h (stresses continuous at the point). This is $f_i = \\tau_{ji}n_j$ (2.15).', plain: 'The traction on any plane is τ contracted with the normal on its first index.', set: { sketch: 'tetra', shrink: 0.25 },
          live: s => { const m = model(s), t = m.tau, n = m.n; return '\\begin{aligned} f_1 &= ' + tx(t[0][0]) + '\\times' + tx(n[0]) + ' + ' + tx(t[1][0]) + '\\times' + tx(n[1]) + ' = ' + tx(m.f[0]) + ' \\\\ f_2 &= ' + tx(t[0][1]) + '\\times' + tx(n[0]) + ' + ' + tx(t[1][1]) + '\\times' + tx(n[1]) + ' = ' + tx(m.f[1]) + '\\ \\text{' + m.unit + '} \\end{aligned}'; },
          highlight: ['readout:f'] }
      ],
      result: { tex: 'f_i = \\tau_{ji}\\,n_j,\\qquad \\mathbf f = \\mathbf n\\cdot\\boldsymbol\\tau', plain: 'The nine numbers on the coordinate planes determine the force per area on every plane through the point. The formula contracts the first index; τ·n equals it only when τ is symmetric (Ch. 4 proves that for the stress).', set: { sketch: 'none', shrink: 1 } },
      interpret: s => { const m = model(s); return 'The black arrow on the cut is this formula evaluated with your ' + m.sym2 + ' and φ = ' + fx(s.phi, 0) + '°: f = ' + P2(m.f[0], m.f[1]) + ' ' + m.unit + '. With n = e₂ (φ = 90°) it returns row 2 of ' + m.sym2 + ' itself: the formula reproduces its inputs.'; },
      check: 'Units: Pa on both sides. Limit n = e₃: f_i = τ₃i, the traction on a coordinate face — the formula returns its inputs. Number (Ex. 2.2, a = 1 Pa, φ = 30°): f = (0·0.866 + 1·0.5, 1·0.866 + 0·0.5) = (0.5, 0.866) Pa. Pure pressure τ = −pδ: f = −p n for every n (Ch. 1\'s isotropic pressure). The selftest rows compare traction() with ch02.traction and ch02.example_2_2.' },
    { id: 'D17', title: 'Real eigenvalues, orthogonal axes, diagonal form and the bounds — for a real symmetric tensor', short: 'D17 · principal axes', ref: '§2.11 facts (1)–(4)', view: 'curves',
      goal: 'Prove the four facts §2.11 states without proof: for a real symmetric τ (1) the eigenvalues are real, (2) eigenvectors of distinct eigenvalues are perpendicular, (3) in the axes of the eigenvectors τ is diagonal, (4) the normal stress on every plane lies between the smallest and largest eigenvalue — and the shear is bounded by half their spread.',
      start: { tex: '\\tau_{ij}\\,b_j = \\lambda\\,b_i,\\qquad \\tau_{ij} = \\tau_{ji}\\ \\text{real}', plain: 'A direction b that τ only scales (no shear on the plane ⊥ b); λ and b may be complex until we prove otherwise.' },
      plan: ['Contract the eigen-equation with the conjugate eigenvector, conjugate, use symmetry: λ = λ̄.', 'Do the same with two eigenpairs: (λ¹ − λ²) b¹·b² = 0.', 'Put the unit eigenvectors as columns of C — exactly C02\'s C — and apply $\\tau\'_{mn} = C_{im}C_{jn}\\tau_{ij}$ (2.12).', 'Expand any unit n in the eigenbasis and read the normal stress as a weighted mean of the λ\'s.'],
      uses: ['eigenvalues and eigenvectors', 'complex conjugate and |z|² = z z̄', 'symmetry τ_ij = τ_ji', 'dummy renaming', 'orthonormality and completeness', 'the transformation rule $\\tau\'_{mn} = C_{im}C_{jn}\\tau_{ij}$ (2.12)', 'quadratic form / Rayleigh quotient', 'Gram–Schmidt for repeated λ'],
      set: { phi: 30, nonsym: false, sketch: 'none' },
      steps: [
        { did: 'Contract the eigen-equation with the conjugate eigenvector', tex: '\\bar b_i\\,\\tau_{ij}\\,b_j = \\lambda\\,\\bar b_i b_i',

        { did: 'Take the complex conjugate of the whole line', tex: 'b_i\\,\\bar\\tau_{ij}\\,\\bar b_j = \\bar\\lambda\\,b_i\\bar b_i',

        { did: 'Use that τ is real', tex: 'b_i\\,\\tau_{ij}\\,\\bar b_j = \\bar\\lambda\\,b_i\\bar b_i',
          why: '$\\bar\\tau_{ij} = \\tau_{ij}$ because the components are real numbers. The assumption "real" enters here.', plain: 'τ is unchanged by the mirror.' },
        { did: 'Rename the dummies and use symmetry', tex: 'b_i\\,\\tau_{ij}\\,\\bar b_j = \\bar b_j\\,\\tau_{ji}\\,b_i = \\bar b_i\\,\\tau_{ij}\\,b_j',
          why: 'Reorder the scalar factors, rename i ↔ j (both summed), then $\\tau_{ji} = \\tau_{ij}$ (symmetry, first use). The left side of step 3 has become the left side of step 1.', plain: 'Thanks to symmetry the two "normal stresses" are the same number.' },
        { did: 'Subtract step 3 from step 1', tex: '(\\lambda - \\bar\\lambda)\\,\\bar b_ib_i = 0\\ \\Rightarrow\\ \\lambda = \\bar\\lambda',
          why: 'Equal left sides give equal right sides; $\\bar b_ib_i > 0$ can be divided out, leaving λ = λ̄, so λ is real (fact 1).', plain: 'The eigenvalues of a real symmetric tensor are real numbers; a real λ makes the linear system real, so b can be chosen real too.',
          live: s => { const t = model(s).tau, disc = 0.25 * (t[0][0] - t[1][1]) * (t[0][0] - t[1][1]) + t[0][1] * t[0][1]; return '\\begin{aligned} \\big(\\tfrac{\\tau_{11} - \\tau_{22}}{2}\\big)^2 + \\tau_{12}^2 &= ' + tx(disc) + ' \\ge 0 \\\\ \\Rightarrow\\ \\lambda &\\ \\text{real (2-D check)} \\end{aligned}'; } },
        { did: 'Contract two eigen-equations crosswise', tex: '\\begin{aligned} b^2_i\\,\\tau_{ij}\\,b^1_j &= \\lambda^1\\,b^2_ib^1_i \\\\ b^1_i\\,\\tau_{ij}\\,b^2_j &= \\lambda^2\\,b^1_ib^2_i \\end{aligned}',
          why: 'Take eigenpairs (λ¹, b¹) and (λ², b²) (superscripts are labels, not powers); contract the first equation with $b^2_i$ and the second with $b^1_i$. Same trick as step 1 with two vectors.', plain: 'Two mixed "normal stresses", each equal to an eigenvalue times b¹·b².' },
        { did: 'Show the two left sides are equal', tex: 'b^1_i\\,\\tau_{ij}\\,b^2_j = b^2_j\\,\\tau_{ji}\\,b^1_i = b^2_i\\,\\tau_{ij}\\,b^1_j',

      src: `
import numpy as np
from fluidpy import ch02_cartesian_tensors as ch02
t11, t12, t22 = {{t11}}, {{t12}}, {{t22}}          # {{unit}}
tau = np.array([[t11, t12], [t12, t22]])   # row = face, column = direction
phi = np.deg2rad({{phi}})                    # cut normal, {{phi}} deg from the 1-axis
n = np.array([np.cos(phi), np.sin(phi)])   # n = ({{n1}}, {{n2}})
f = ch02.traction(tau, n)                  # (2.15): f_i = tau_ji n_j = ({{f1}}, {{f2}})
sig_n, tau_s, _ = ch02.normal_shear_stress(tau, n)  # {{sn}} normal, {{tsm}} shear`,

lam, B = ch02.principal_axes(tau)          # lam = ({{l1}}, {{l2}}), columns of B = axes
theta_p = ch02.principal_angle_2d(tau)     # {{thp}} deg: the shear-free cut
c, r = ch02.mohr_circle_2d(tau)            # centre {{c}}, radius {{r}} = max shear
C, tau_p = ch02.diagonalize(tau)           # tau' = C^T tau C = diag({{l1}}, {{l2}})`,
