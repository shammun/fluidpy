  subtitle: 'One vector, two frames: turn the axes and watch C, the new components x′ = Cᵀx and the tensor components τ′ = CᵀτC move together',
  params: {
    theta: { label: 'Rotation of the axes $\\theta$', min: -180, max: 180, step: 1, value: 30, unit: '°', help: 'positive = axes turned counterclockwise; the arrow never moves' },
    x1: { label: '$x_1$', min: -3, max: 3, step: 0.1, value: 1, help: 'first component in the teal frame (drag the arrow tip too)' },
    x2: { label: '$x_2$', min: -3, max: 3, step: 0.1, value: 2, help: 'second component in the teal frame' },
    what: { type: 'select', label: 'What rotates (book: the axes, passive)', options: [['axes', 'axes turn'], ['arrow', 'arrow turns']], value: 'axes', display: 'chips' },
    tpreset: { type: 'select', label: 'Stress state', options: [['shear', 'shear'], ['uniaxial', 'uniaxial'], ['hydro', 'hydro'], ['fixed', 'fixed']], value: 'shear', display: 'chips', optional: true },
    a: { label: 'Stress level $a$', min: 0.5, max: 2, step: 0.1, value: 1, unit: 'Pa', optional: true, help: 'scales every stress state' },
    mirror: { type: 'toggle', label: 'Mirror the 2′ axis (det C = −1)', value: false, optional: true },
    axis3d: { type: 'toggle', label: '3-D: rotate about (1, 1, 1)/√3', value: false, optional: true }
  },
  modes: { param: 'mode', label: 'Object', options: [['vector', 'vector'], ['tensor', 'tensor'], ['polar', 'polar']] },
  transport: { param: 'theta', min: -180, max: 180, rate: 30, end: 'loop', label: 'axes angle $\\theta$', unit: '°' },
  autoplay: false,   // the trace steps quote numbers at a fixed θ; only step 4 presses ▶
  presets: [
    { label: 'θ = 0', set: { theta: 0 }, title: 'same axes: C = I' },
    { label: '45°', set: { theta: 45 }, title: 'half-way; the principal axes of pure shear' },
    { label: '90°', set: { theta: 90 }, title: 'axes swapped' },
    { label: '−30°', set: { theta: -30 }, title: 'turned clockwise' },
    { label: 'polar 60°', set: { mode: 'polar', theta: 60 }, title: 'Example 2.1: the polar frame at θ = 60°' },
    { label: 'shear', set: { mode: 'tensor', tpreset: 'shear', theta: 30, what: 'axes' }, title: 'Example 2.2: pure shear seen from axes turned by 30°' }
  ],
  status: s => {
    const Q = physics(s);
    if (s.mirror) return { text: '⚠️ det C = ' + (Q.det < 0 ? '−1' : '+1') + ': a mirror, not a rotation', tone: 'warn' };
    if (s.mode === 'tensor' && s.tpreset === 'fixed') return { text: '❌ not a tensor: (2.12) residual ' + Viz.fmt(Q.fixedRes) + ' Pa', tone: 'bad' };
    if (s.mode === 'vector' && s.what === 'arrow') return { text: '🔄 active: arrow turned, axes fixed — C, not Cᵀ', tone: 'info' };
    return { text: '✅ orthogonal: CᵀC − I = ' + residTxt(Q.res) + ', det C = +' + f3(Q.det).replace('−', ''), tone: 'good' };
  },
  readouts: [
    { id: 'xp', label: 'New components', value: s => physics(s).xp[0], fmt: (v, s) => { const Q = physics(s); return s.mode === 'polar' ? pair(Q.pol) : s.mode === 'tensor' ? 'see τ′' : (s.what === 'axes' ? pair(Q.xp) : pair(Q.xa) + ' (Cx)'); } },
    { id: 'norm', label: 'Length $|\\mathbf x| = |\\mathbf x\'|$', value: s => physics(s).norm, fmt: (v, s) => f3(v) + ' = ' + f3(physics(s).normp) },
    { id: 'resid', label: 'max$|\\mathbf C^{\\rm T}\\mathbf C - \\mathbf I|$', value: s => physics(s).res, fmt: v => residTxt(v) },
    { id: 'tau', label: 'τ′₁₁, τ′₁₂, τ′₂₂', unit: 'Pa', value: s => physics(s).taup[0][0], fmt: (v, s) => { const t = physics(s).taup; return f3(t[0][0]) + ', ' + f3(t[0][1]) + ', ' + f3(t[1][1]) + ' Pa'; }, optional: true }
  ],
  stage: {
    rows: [1.3, 1],
    views: [
      { id: 'plane', row: 0, flex: 1.25, title: s => { const Q = physics(s);
          if (s.mode === 'tensor') return '<b>The plane</b> · <b class="c-teal">teal</b> element in O12, <b class="c-orange">orange</b> element in O1′2′ · <b class="c-blue">normal</b> / <b class="c-rose">shear</b> stresses';
          if (s.mode === 'polar') return '<b>The plane</b> · Ex. 2.1: the polar frame (<b class="c-orange">e_r, e_θ</b>) is the <b class="c-teal">Cartesian</b> frame turned by θ = ' + fd(s.theta);
          return '<b>The plane</b> · ' + (s.what === 'axes' ? '<b class="c-teal">old axes 1, 2</b> · <b class="c-orange">new axes 1′, 2′</b> turned by ' + fd(s.theta) + ' · drag the tip or an orange axis' : 'axes fixed, the arrow turned by ' + fd(s.theta) + ' (grey = before)'); } },
      { id: 'matrix', row: 0, flex: 1, title: s => { const Q = physics(s);
          if (s.mode === 'tensor') return '<b>C = eᵢ·e′ⱼ</b> · click a cell for τ′ₘₙ' + (Q.thetaP !== null && s.tpreset !== 'fixed' ? ' · τ′₁₂ = 0 at ' + fd(Math.round(Q.thetaP / D2R)) : '');
          return '<b>C = eᵢ·e′ⱼ</b> · click a cell · |x| = ' + f3(Q.norm) + ' at every θ'; } },
      { id: 'curves', row: 1, flex: 1, hidePortrait: true, title: s => s.mode === 'tensor' ? '<b>Stress components vs θ</b> · faint = all angles, bold = 0 → θ' : '<b>Components vs θ</b> · faint = all angles, bold = 0 → θ · grey = the length' }
    ],
    draw(g, s) {
      const Q = physics(s);
      drawPlane(g.view('plane'), s, Q);
      drawMatrix(g.view('matrix'), s, Q);
      drawCurves(g.view('curves'), s, Q);
    },
    onPointer
  },
  explore: {
    intro: 'Press ▶ to sweep the axes, or drag the arrow tip and the orange axis in the picture. Switch the object (vector · tensor · polar) above the picture.',
    controls: ['theta', 'x1', 'x2', 'what', 'tpreset', 'a', 'mirror', 'axis3d'],
    readouts: ['xp', 'norm', 'resid', 'tau'],
    callouts: [{ kind: 'try', html: 'Set θ = 90°: predict $x\'_1, x\'_2$ for $x = (1, 2)$ before you look at the readout.' }]
  },
  inspectHint: 'Click a cell of C: the two unit vectors and the angle behind that cosine appear here and in the picture.',
  inspect: s => {
    if (!s.cell) return null;
    const Q = physics(s), i = s.cell.i, j = s.cell.j, C = s.mode === 'vector' ? Q.C : Q.C2;
    if (Q.three) return `$C_{${i + 1}${j + 1}} = \\mathbf e_{${i + 1}}\\cdot\\mathbf e'_{${j + 1}} = \\mathbf{${T(C[i][j])}}$ — in 3-D this is the ${['first', 'second', 'third'][i]} component of the new axis ${j + 1}′ (Rodrigues C about (1, 1, 1)/√3).`;
    const ei = i === 0 ? 0 : 90, ej = (j === 0 ? 0 : (s.mirror ? -90 : 90)) + s.theta, ang = ((ej - ei + 540) % 360) - 180;
    return `$C_{${i + 1}${j + 1}} = \\mathbf e_{${i + 1}}\\cdot\\mathbf e'_{${j + 1}}$ = cos(angle between old ${i + 1} and new ${j + 1}′)<br>$= \\cos(${Viz.tnum(Math.round(ang))}°) = \\mathbf{${T(C[i][j])}}$` +
      `<br><span class="viz-muted">Old axis ${i + 1} points at ${ei}°, new axis ${j + 1}′ at ${Viz.fmt(ej)}°; unit vectors, so the dot product is just the cosine.</span>` +
      (s.mode === 'tensor' ? `<br>Selected entry: $\\tau'_{${i + 1}${j + 1}} = C_{i${i + 1}}C_{j${j + 1}}\\tau_{ij} = \\mathbf{${T(Q.taup[i][j])}}$ Pa (assembled in the matrix window).` : '');
  },
  notes: s => {
    const Q = physics(s), th = s.theta;
    if (s.mode === 'vector' && s.what === 'arrow') return `<p><b>Active view.</b> The axes stayed; the arrow turned by ${fd(th)}. Its components are $\\mathbf C\\mathbf x = ${pair(Q.xa)}$ — the same matrix the book applies as $\\mathbf C^{\\rm T}$. Turning the arrow by $+\\theta$ looks, to the arrow, exactly like turning the axes by $-\\theta$: $\\mathbf C(\\theta) = \\mathbf C^{\\rm T}(-\\theta)$.</p>`;
    if (s.mirror) return `<p><b>Mirror on.</b> The 2′ axis was flipped: $\\mathbf C^{\\rm T}\\mathbf C = \\mathbf I$ still holds (lengths kept: $|\\mathbf x'| = ${f3(Q.normp)}$) but $\\det\\mathbf C = −1$. A mirror cannot be reached by turning; the book\'s "rotation" excludes it, and $\\varepsilon_{ijk}$ would change sign in such a frame.</p>`;
    if (s.mode === 'tensor') {
      if (s.tpreset === 'fixed') return `<p><b>A matrix is not a tensor.</b> These numbers claim to be the same in every frame. (2.12) says the components must become $\\mathbf C^{\\rm T}\\boldsymbol\\tau\\mathbf C$; at ${fd(th)} the claim misses by ${Viz.fmt(Q.fixedRes)} Pa. Nine numbers are a tensor only if they obey the rule.</p>`;
      if (s.tpreset === 'hydro') return `<p><b>Hydrostatic.</b> $\\boldsymbol\\tau = -p\\,\\mathbf I$ looks the same in every frame: $\\mathbf C^{\\rm T}(-p\\mathbf I)\\mathbf C = -p\\,\\mathbf C^{\\rm T}\\mathbf C = -p\\,\\mathbf I$. Every axis is a principal axis; there is no shear on any cut.</p>`;
      const tpd = Q.thetaP === null ? null : Q.thetaP / D2R, near = tpd !== null && Math.abs(((th - tpd + 90) % 90 + 90) % 90) < 3;
      if (near) return `<p><b>Principal axes.</b> At θ ≈ ${fd(Math.round(tpd))} (+ multiples of 90°) the shear $\\tau'_{12} = ${T(Q.taup[0][1])}$ Pa vanishes and only normal stresses remain: $\\tau'_{11} = ${T(Q.taup[0][0])}$, $\\tau'_{22} = ${T(Q.taup[1][1])}$ Pa. §2.11 (and E2) calls these the principal axes.</p>`;
      return `<p>At θ = ${fd(th)} the same stress state reads $\\tau'_{11} = ${T(Q.taup[0][0])}$, $\\tau'_{12} = ${T(Q.taup[0][1])}$, $\\tau'_{22} = ${T(Q.taup[1][1])}$ Pa. Trace $\\tau'_{11} + \\tau'_{22} = ${T(Q.taup[0][0] + Q.taup[1][1])}$ = $\\tau_{11} + \\tau_{22}$: an invariant (C07). Drag θ to where the <b class="c-rose">rose</b> curve crosses zero.</p>`;
    }
    if (s.mode === 'polar') return `<p><b>Example 2.1.</b> The point sits at angle ${fd(th)}; $\\mathbf e_r$ is the Cartesian frame\'s 1-axis turned by that angle. So $(u_r, u_\\theta) = ${pair(Q.pol)}$ is just (2.5) with $j \\in \\{r, \\theta\\}$ — polar components are rotated Cartesian components.</p>`;
    if (Math.abs(th) < 0.5) return '<p><b>θ = 0.</b> The frames coincide: C = I and x′ = x. Every entry on the diagonal is cos 0 = 1.</p>';
    if (Math.abs(Math.abs(th) - 90) < 0.5) return `<p><b>θ = ±90°.</b> The axes have swapped roles: $x'_1 = ${T(Q.xp[0])} = ${th > 0 ? '+' : '−'}x_2$, $x'_2 = ${T(Q.xp[1])} = ${th > 0 ? '−' : '+'}x_1$. C has zeros on the diagonal.</p>`;
    if (Math.abs(Math.abs(th) - 180) < 0.5) return '<p><b>θ = ±180°.</b> Both components change sign — a half turn is still a rotation (det C = +1); C = −I.</p>';
    return `<p>At θ = ${fd(th)} the <b class="c-orange">orange shadows</b> $x' = ${pair(Q.xp)}$ are a reshuffling of the <b class="c-teal">teal ones</b> $x = ${pair(Q.x.slice(0, 2))}$; the arrow\'s length ${f3(Q.norm)} is untouched. Only the ruler moved.</p>`;
  },
  explain: {
    html: s => {
      const Q = physics(s), W = Viz.work, th = s.theta, C = Q.C2, x = [s.x1, s.x2], xp = transformVector(x, C), c = Math.cos(Q.th), sn = Math.sin(Q.th);
      let out = W.step(0, 'What the windows show') +
        W.say('<b>The plane</b>: <b class="c-teal">teal</b> axes are the original frame O12, <b class="c-orange">orange</b> axes the rotated frame O1′2′; the black arrow is one vector $\\mathbf x$ (or, in tensor mode, one stress state). Dashed teal/orange lines are its shadows on each frame — the components. <b>C</b> is the table of cosines between old and new axes; the lit column shows one entry being built. <b>Components vs θ</b> traces how the orange numbers change as you turn the axes.') +
        W.hint('On a phone held upright the curves window is hidden; the length |x| and the angle where τ′₁₂ = 0 are repeated in the C window\'s title.');
      out += W.step(1, 'The direction-cosine matrix with your angle') +
        W.line('$C_{11} = \\mathbf e_1\\cdot\\mathbf e\'_1 = \\cos\\theta = \\cos ' + T(th) + '°$', T(C[0][0]), 'old 1 and new 1′ are θ apart') +
        W.line('$C_{21} = \\mathbf e_2\\cdot\\mathbf e\'_1 = \\cos(90° - \\theta) = \\sin\\theta$', T(C[1][0]), 'old 2 leads new 1′ by 90° − θ') +
        W.line('$C_{12} = \\mathbf e_1\\cdot\\mathbf e\'_2 = \\cos(90° + \\theta) = -\\sin\\theta$', T(C[0][1]), 'new 2′ is 90° + θ from old 1') +
        W.line('$C_{22} = \\mathbf e_2\\cdot\\mathbf e\'_2 = \\cos\\theta$', T(C[1][1]), '') +
        W.box('The columns $(' + T(C[0][0]) + ', ' + T(C[1][0]) + ')$ and $(' + T(C[0][1]) + ', ' + T(C[1][1]) + ')$ are the <b class="c-orange">new unit vectors</b> written in old components — read them off the orange arrows.' + (s.mirror ? ' <b class="c-amber">Mirror on:</b> the second column has its sign flipped.' : ''));
      out += W.step(2, 'The new components term by term — Eq. (2.5)') +
        W.line('$x\'_1 = x_1C_{11} + x_2C_{21} = ' + T(x[0]) + '\\times' + T(C[0][0]) + ' + ' + T(x[1]) + '\\times' + T(C[1][0]) + '$', T(xp[0]), 'column 1 of C weights the old components') +
        W.line('$x\'_2 = x_1C_{12} + x_2C_{22} = ' + T(x[0]) + '\\times(' + T(C[0][1]) + ') + ' + T(x[1]) + '\\times' + T(C[1][1]) + '$', T(xp[1]), 'column 2 of C') +
        W.box('$\\mathbf x\' = \\mathbf C^{\\rm T}\\mathbf x = (\\mathbf{' + T(xp[0]) + '},\\ \\mathbf{' + T(xp[1]) + '})$ — the <i>first</i> index of C is summed.');
      out += W.step(3, 'Nothing was lost: orthogonality') +
        W.line('$\\max|\\mathbf C^{\\rm T}\\mathbf C - \\mathbf I|$', residTxt(orthoResidual(C)), 'round-off only: rows and columns are unit vectors at right angles') +
        W.line('$\\det\\mathbf C = C_{11}C_{22} - C_{12}C_{21} = ' + T(C[0][0] * C[1][1]) + ' - (' + T(C[0][1] * C[1][0]) + ')$', (detC(C) > 0 ? '+' : '−') + T(Math.abs(detC(C))), s.mirror ? 'a mirror (−1), not a rotation' : 'a rotation, not a mirror') +
        W.box('$|\\mathbf x\'|^2 = ' + T(xp[0] * xp[0]) + ' + ' + T(xp[1] * xp[1]) + ' = \\mathbf{' + T(xp[0] * xp[0] + xp[1] * xp[1]) + '} = |\\mathbf x|^2 = ' + T(x[0] * x[0]) + ' + ' + T(x[1] * x[1]) + '$ — a rotation keeps lengths (D02).');
      const back = inverseTransform(xp, C);
      out += W.step(4, 'Back again — Eq. (2.7)') +
        W.line('$x_1 = x\'_1C_{11} + x\'_2C_{12} = ' + T(xp[0]) + '\\times' + T(C[0][0]) + ' + ' + T(xp[1]) + '\\times(' + T(C[0][1]) + ')$', T(back[0]), 'now the <i>second</i> index of C is summed: x = Cx′ (D03)') +
        W.line('$x_2 = x\'_1C_{21} + x\'_2C_{22}$', T(back[1]), 'row 2 of C');
      if (s.mode === 'tensor') {
        const tau = Q.tau, tp = Q.taup, terms = (m, n) => { const t = []; for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) if (Math.abs(tau[i][j]) > 1e-12) t.push('C_{' + (i + 1) + (m + 1) + '}C_{' + (j + 1) + (n + 1) + '}\\tau_{' + (i + 1) + (j + 1) + '}'); return t.join(' + ') || '0'; };
        out += W.step(5, 'Tensor mode — Eq. (2.12) entry by entry') +
          W.say('Stress state: <b>' + TPRESETS[s.tpreset] + '</b>, $\\boldsymbol\\tau = \\begin{pmatrix}' + T(tau[0][0]) + ' & ' + T(tau[0][1]) + '\\\\' + T(tau[1][0]) + ' & ' + T(tau[1][1]) + '\\end{pmatrix}$ Pa. Two C\'s because τ has two indices; zero entries of τ drop out.') +
          W.line('$\\tau\'_{11} = C_{i1}C_{j1}\\tau_{ij} = ' + terms(0, 0) + '$', T(tp[0][0]) + ' Pa', '<b class="c-blue">normal</b> stress on the 1′ face') +
          W.line('$\\tau\'_{12} = C_{i1}C_{j2}\\tau_{ij} = ' + terms(0, 1) + '$', T(tp[0][1]) + ' Pa', '<b class="c-rose">shear</b> on the 1′ face') +
          W.line('$\\tau\'_{22} = C_{i2}C_{j2}\\tau_{ij} = ' + terms(1, 1) + '$', T(tp[1][1]) + ' Pa', '<b class="c-blue">normal</b> stress on the 2′ face') +
          W.box('Trace $\\tau\'_{11} + \\tau\'_{22} = ' + T(tp[0][0] + tp[1][1]) + ' = \\tau_{11} + \\tau_{22}$: an invariant (C07).' + (s.tpreset === 'shear' ? ' For pure shear: $\\tau\'_{11} = a\\sin 2\\theta = ' + T(shearRotated(s.a, Q.th)[0]) + '$, $\\tau\'_{12} = a\\cos 2\\theta = ' + T(shearRotated(s.a, Q.th)[1]) + '$ Pa (Example 2.2).' : ''));
        if (s.tpreset === 'fixed') out += W.result('The array declared "the same in every frame" differs from $\\mathbf C^{\\rm T}\\boldsymbol\\tau\\mathbf C$ by <b>' + Viz.fmt(Q.fixedRes) + ' Pa</b> at this θ — it is a matrix, not a tensor (N27).', 'warn');
      } else {
        out += W.step(5, 'Tensor mode — Eq. (2.12)') + W.hint('Switch the object to <b>tensor</b> (chips above the picture) to see $\\boldsymbol\\tau\' = \\mathbf C^{\\rm T}\\boldsymbol\\tau\\mathbf C$ worked out entry by entry with your θ.');
      }
      if (s.mode === 'polar') {
        out += W.step(6, 'Polar mode — Example 2.1') +
          W.line('$u_r = u_1\\cos\\theta + u_2\\sin\\theta = ' + T(x[0]) + '\\times' + T(c) + ' + ' + T(x[1]) + '\\times' + T(sn) + '$', T(Q.pol[0]), 'the radial component') +
          W.line('$u_\\theta = -u_1\\sin\\theta + u_2\\cos\\theta$', T(Q.pol[1]), 'the azimuthal component') +
          W.box('Exactly (2.5) with $j \\in \\{r, \\theta\\}$: the polar frame is the Cartesian frame turned by the point\'s angle θ.');
      } else {
        out += W.step(6, 'Polar mode — Example 2.1') + W.hint('Switch the object to <b>polar</b>: the same rule with $j \\in \\{r, \\theta\\}$ gives $(u_r, u_\\theta) = ' + pair(Q.pol) + '$ at θ = ' + fd(th) + '.');
      }
      const cur = s.what === 'axes' ? 0 : 1;
      out += W.step(7, 'Passive or active?') +
        W.table(['what turns', 'formula', 'x′ now'], [['axes (book)', '$\\mathbf x\' = \\mathbf C^{\\rm T}\\mathbf x$', '$' + pair(xp) + '$'], ['arrow (Wikipedia R)', '$\\mathbf x\' = \\mathbf C\\mathbf x$', '$' + pair(Q.xa) + '$']], cur) +
        W.say('Same matrix, opposite job. Turning the axes by $+\\theta$ is, from the axes\' point of view, turning the arrow by $-\\theta$: the two rows agree when θ → −θ.');
      const rows = VECTOR_TESTS.map(tst => { const r = vectorTestResidual(tst.fn, C, TEST_POINTS); return ['$' + tst.tex + '$', Viz.fmt(r), r < 1e-9 ? '<b class="c-teal">vector</b>' : '<b class="c-rose">not a vector</b>']; });
      out += W.step(8, 'Is it a vector? The test of Eq. (2.8)') +
        W.say('A triple of numbers is a vector only if its components obey $u\'_j = u_iC_{ij}$. Evaluate each rule in the old frame and in the new one at three sample points; the residual is $\\max|u\'_j - u_iC_{ij}|$ with your C.') +
        W.table(['rule', 'residual', 'verdict'], rows);
      let reading;
      if (s.mirror) reading = 'det C = −1: lengths are kept but handedness is not; ε<sub>ijk</sub> would change sign (N42). Turn the mirror off to get back to a rotation.';
      else if (s.mode === 'tensor' && s.tpreset === 'fixed') reading = 'The numbers refuse to change with the frame, so they cannot describe a physical stress: the residual ' + Viz.fmt(Q.fixedRes) + ' Pa is the size of the lie. Only (2.12)-obedient arrays are tensors.';
      else if (s.mode === 'tensor') { const tpd = Q.thetaP === null ? null : Q.thetaP / D2R; reading = tpd !== null && Math.abs((((th - tpd) % 90) + 135) % 90 - 45) > 42 ? 'τ′₁₂ = ' + T(Q.taup[0][1]) + ' Pa ≈ 0: in these axes the shear has vanished and only normal stresses remain — the principal axes of §2.11 (E2).' : 'The same stress state, described from axes turned by ' + fd(th) + ': τ′₁₁ = ' + T(Q.taup[0][0]) + ', τ′₁₂ = ' + T(Q.taup[0][1]) + ', τ′₂₂ = ' + T(Q.taup[1][1]) + ' Pa. The trace ' + T(Q.taup[0][0] + Q.taup[1][1]) + ' Pa never moves.' + (tpd !== null ? ' Drag to θ = ' + fd(Math.round(tpd)) + ' to make the shear vanish.' : ''); }
      else if (s.mode === 'polar') reading = 'The point at ' + fd(th) + ' carries u = ' + pair(x) + '; its polar components (' + T(Q.pol[0]) + ', ' + T(Q.pol[1]) + ') are the Cartesian ones read off a frame turned with the point. Nothing new was defined — one rule, one more application.';
      else if (s.what === 'arrow') reading = 'You are watching the active rotation: the arrow moved to Cx = ' + pair(Q.xa) + ' while the axes stayed. The book never does this; it turns the axes and applies Cᵀ. Same C, opposite job — flip the chip back to compare.';
      else if (Math.abs(th) < 0.5) reading = 'θ = 0: the frames coincide, C = I, x′ = x.';
      else if (Math.abs(Math.abs(th) - 90) < 0.5) reading = 'θ = ±90°: the axes have swapped roles, x′₁ = ±x₂ and x′₂ = ∓x₁.';
      else if (Math.abs(Math.abs(th) - 180) < 0.5) reading = '|θ| = 180°: both components change sign — a half turn, still a rotation (det C = +1).';
      else reading = 'The orange shadows (' + T(xp[0]) + ', ' + T(xp[1]) + ') are a reshuffling of the teal ones (' + T(x[0]) + ', ' + T(x[1]) + '); the arrow\'s length ' + T(Q.norm) + ' is untouched. The arrow never moved — only the ruler did.';
      out += W.step(9, 'At the current angle') + W.line('$\\theta$', Viz.live('theta') + '°') + W.line('$\\mathbf x\'$', Viz.live('xp')) + W.interpret(reading, 'Reading the current setting');
      return out;
    },
    live: s => { const Q = physics(s); return { theta: Viz.fmt(s.theta), xp: s.mode === 'polar' ? pair(Q.pol) : (s.what === 'axes' ? pair(Q.xp) : pair(Q.xa)) }; }
  },
  derivations: [
    { id: 'D01', title: 'The transformation rule for components', short: 'Eq. (2.5)', ref: 'Eq. (2.5)', view: 'plane',
      goal: 'Find how the three numbers that describe a vector change when the axes are rotated — the rule that will define what a vector is.',

      plan: ['Dot both spellings with one new unit vector.', 'On the primed side orthonormality kills every term but one.', 'Name the cosines that remain: that is C.', 'Do it for a general new axis, not only $\\mathbf e\'_1$.'],
      uses: ['dot product (2.2)', 'bilinearity of the dot product', 'orthonormality $\\mathbf e\'_i\\cdot\\mathbf e\'_j = \\delta_{ij}$', 'Kronecker substitution (2.17)', 'direction cosines $C_{ij} = \\mathbf e_i\\cdot\\mathbf e\'_j$'],

        { did: 'Dot both sides with $\\mathbf e\'_k$', tex: 'x_i\\,(\\mathbf e_i\\cdot\\mathbf e\'_k) = x\'_j\\,(\\mathbf e\'_j\\cdot\\mathbf e\'_k)',
          why: 'The dot product is bilinear: it distributes over the sums and lets the scalars x_i, x\'_j pull out. We dot with a new unit vector to isolate one new component.',

        { did: 'Use orthonormality of the new basis', tex: 'x_i\\,(\\mathbf e_i\\cdot\\mathbf e\'_k) = x\'_j\\,\\delta_{jk}',

    { id: 'D02', title: 'Why C is orthogonal: CCᵀ = CᵀC = I and det C = +1', short: 'CᵀC = I', ref: 'Exercise 2.8', view: 'matrix',

      uses: ['completeness $\\mathbf v = (\\mathbf v\\cdot\\mathbf e\'_j)\\mathbf e\'_j$', 'orthonormality of both bases', 'bilinearity', 'matrix product as an index sum (2.9)', '$\\det(AB) = \\det A\\det B$', 'continuity for the sign'],

          plain: 'The rows of C are perpendicular unit vectors.',
          live: s => { const C = physics(s).C2; return '\\begin{aligned} C_{11}C_{11} + C_{12}C_{12} &= ' + T(C[0][0] * C[0][0]) + ' + ' + T(C[0][1] * C[0][1]) + ' = ' + T(C[0][0] * C[0][0] + C[0][1] * C[0][1]) + ' = \\delta_{11}\\\\ C_{11}C_{21} + C_{12}C_{22} &= ' + T(C[0][0] * C[1][0]) + ' ' + (C[0][1] * C[1][1] < 0 ? '-' : '+') + ' ' + T(Math.abs(C[0][1] * C[1][1])) + ' = ' + T(C[0][0] * C[1][0] + C[0][1] * C[1][1]) + ' = \\delta_{12}\\end{aligned}'; } },
        { did: 'Swap the roles: expand a new axis in the old basis', tex: '\\mathbf e\'_i = (\\mathbf e\'_i\\cdot\\mathbf e_j)\\,\\mathbf e_j = C_{ji}\\,\\mathbf e_j',
          why: 'Completeness again, now of the old basis. The second relation does not follow from the first without this second argument — a common gap.',
          plain: 'A new axis is a sum of old axes weighted by its column of C.', set: { cell: null, selj: 0 }, watch: 'Column 1 (orange band) holds the two old components of e′₁.' },
        { did: 'Dot with $\\mathbf e\'_k$ and use orthonormality of the new basis', tex: 'C_{ji}C_{jk} = \\delta_{ik}\\qquad(\\mathbf C^{\\rm T}\\mathbf C = \\mathbf I)',
          why: 'Bilinearity and e_j·e\'_k = C_jk on the right; e\'_i·e\'_k = δ_ik on the left. Now the first indices are summed.',
          plain: 'The columns of C are perpendicular unit vectors too.', watch: 'The third line of the matrix window is exactly max|CᵀC − I|.' },
        { did: 'Take the determinant of step 6', tex: '(\\det\\mathbf C)^2 = 1\\ \\Rightarrow\\ \\det\\mathbf C = \\pm1',
          why: 'det(AB) = det A · det B and det Cᵀ = det C (P53), while det I = 1. We take determinants because the sign tells a rotation from a mirror.',
          plain: 'C cannot stretch volumes; it may or may not flip them.',
          live: s => { const C = physics(s).C2; return '\\det\\mathbf C = ' + T(C[0][0]) + '\\times' + T(C[1][1]) + ' - (' + T(C[0][1]) + ')(' + T(C[1][0]) + ') = ' + (detC(C) > 0 ? '+' : '-') + T(Math.abs(detC(C))); } },
        { did: 'Fix the sign for a rotation', tex: '\\det\\mathbf C = +1',
          why: 'Turning the axes gradually from θ = 0 changes det C continuously; it starts at det I = +1 and cannot pass through 0 (it is ±1), so it stays +1.',

      ],
      result: { tex: 'C_{ij}C_{kj} = C_{ji}C_{jk} = \\delta_{ik},\\qquad\\det\\mathbf C = +1', plain: 'Cᵀ is the inverse of C, and C is a proper rotation.', set: { mirror: false } },
      interpret: s => { const Q = physics(s); return 'Orthogonality is why the length readout shows |x| = ' + f3(Q.norm) + ' = |x′| = ' + f3(Q.normp) + ' at θ = ' + fd(s.theta) + (s.mirror ? ' even with the mirror on (det C = −1: lengths kept, handedness lost).' : '.'); },

    { id: 'D06', title: 'The tensor transformation rule from Cauchy\'s formula', short: 'Eq. (2.12)', ref: 'Eq. (2.12)', view: 'plane',
      goal: 'Show how the nine stress components must change under a rotation of axes, given only that force per area and the normal are vectors. The book states (2.12) and cites Sommerfeld\'s tetrahedron; we have the tetrahedron result (2.15) already, so we derive (2.12) from it.',

  code: [
    { id: 'main', title: 'The same rotation in Python', ref: 'Eqs. (2.5), (2.7), (2.12)',
      src: `
import numpy as np
from fluidpy import ch02_cartesian_tensors as ch02

th = np.deg2rad(theta)                        # θ = {{theta}}° → {{th}} rad
C = ch02.rotation_matrix_2d(th)               # passive: columns = new axes; C = {{C}}
x = np.array([x1, x2])                        # the fixed arrow ({{x1}}, {{x2}})
xp = ch02.transform_vector(x, C)              # (2.5): x' = Cᵀx = ({{xp1}}, {{xp2}})
back = ch02.inverse_transform_vector(xp, C)   # (2.7): x = Cx' = ({{b1}}, {{b2}})
res = ch02.orthogonality_residual(C)          # max|CᵀC − I| = {{res}}
a = {{a}}                                       # stress level [Pa]
tau = np.array([[0.0, a], [a, 0.0]])          # Example 2.2's pure shear
tau_p = ch02.transform_tensor(tau, C)         # (2.12): τ' = CᵀτC → τ'₁₁ = {{t11}}, τ'₁₂ = {{t12}} Pa
ur, ut = ch02.polar_components(x1, x2, th)    # Example 2.1: (u_r, u_θ) = ({{ur}}, {{ut}})`,
      live: s => { const th = s.theta * D2R, C = rot2d(th), xp = transformVector([s.x1, s.x2], C), b = inverseTransform(xp, C), tp = transformTensor([[0, s.a], [s.a, 0]], C), p = polar(s.x1, s.x2, th);
        return { theta: Viz.fmt(s.theta), th: th.toFixed(4), C: '[[' + f3(C[0][0]) + ', ' + f3(C[0][1]) + '], [' + f3(C[1][0]) + ', ' + f3(C[1][1]) + ']]', x1: f3(s.x1), x2: f3(s.x2), xp1: f3(xp[0]), xp2: f3(xp[1]), b1: f3(b[0]), b2: f3(b[1]), res: residTxt(orthoResidual(C)), a: s.a.toFixed(1), t11: f3(tp[0][0]), t12: f3(tp[0][1]), ur: f3(p[0]), ut: f3(p[1]) }; } }
