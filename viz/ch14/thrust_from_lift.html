  P.clip(() => {
    P.fillBetween([0, Math.min(1.5, e)], yl[0], yl[1], { color: rose, alpha: 0.14 });
    P.fn(x => x / Math.sqrt(1 + x * x), { color: Viz.alpha(purple, 0.4), width: 1.4, dash: [5, 4], x0: 0, x1: 1.5 });      // ghost: no drag
    P.line([0, 1.5], [1, 1], { color: Viz.alpha(teal, 0.45), width: 1.4, dash: [5, 4] });
    P.fn(thr, { color: purple, width: 2.6, x0: 0, x1: 1.5 });
    P.fn(x => Math.max(-1, etaOf(x, e)), { color: teal, width: 2.2, x0: Math.max(0.01, e * 0.9), x1: 1.5, n: 200 });
    P.line([s.VS, s.VS], yl, { color: Viz.alpha(text, 0.55), width: 1, dash: [3, 3] });
  });
  if (F.xBest <= 1.5 && !lowH) { const X = P.X(F.xBest), Y = P.Y(F.etaBest); ctx.save(); ctx.fillStyle = teal; ctx.beginPath(); ctx.moveTo(X, Y + 3); ctx.lineTo(X - 5, Y + 12); ctx.lineTo(X + 5, Y + 12); ctx.closePath(); ctx.fill(); ctx.restore();
    if (!nar) labelIn(ctx, W, H, 'most efficient stroke: V/U = ' + hm(F.xBest, 2), P.px.x + P.px.w - 8, P.Y(0.12), { size: 12, color: teal, align: 'right' }); }
  P.dot(s.VS, thr(s.VS), 5.5, { color: purple, stroke: '#fff', strokeWidth: 2 });
  if (s.VS > e) P.dot(s.VS, etaOf(s.VS, e), 4.5, { color: teal, stroke: '#fff', strokeWidth: 2 });
  const xn = Math.abs(F.V) / UF;                                                // where the stroke is at this instant
  if (xn > 0.01) P.dot(xn, clamp(thr(xn), yl[0], yl[1]), 4, { color: C('card'), stroke: purple, strokeWidth: 2 });
  if (!lowH && !nar && e > 0.07) labelIn(ctx, W, H, 'no thrust', P.px.x + 4, P.Y(0.62), { size: 12, color: rose, align: 'left', bg: false, halo: true });
}

/* ---- the bars ----------------------------------------------------------------------------------------------- */
function drawBars(v, s) {
  v.clear();
  const W = v.w, H = v.h; if (W < 120 || H < 70) return;
  const ctx = v.ctx, purple = C('accent'), muted = C('muted'), text = C('text'), orange = C('orange'), teal = C('teal');
  let rows, foot;
  if (isSail(s)) {
    const M = sailModel(s), r = M.r;
    rows = [['drive, along the course', r.drive, purple, 'N', 0], ['side force, across it (the keel\'s job)', r.lateral, muted, 'N', 0]];
    foot = !isFinite(M.need) ? ['no drive: nothing for the hull to balance'] : ['side force / drive = ' + hm(M.need, 2), 'the hull and keel need L/D ≥ ' + hm(M.need, 1) + ' (yours: ' + hm(s.LDh, 1) + (M.need <= s.LDh ? ', enough)' : ', not enough)')];
  } else {
    const F = foilModel(s), r = F.r;
    rows = [[F.bird ? 'power in: V × upward force' : 'power in: V × side force', r.power_in, orange, 'W', 2], ['useful power out: U × thrust', r.power_out, purple, 'W', 2]];
    foot = [isFinite(F.etaNow) ? 'efficiency now = out / in = ' + hm(F.etaNow, 2) : r.power_in < 0 ? 'the air is driving the wing: no efficiency to speak of' : 'no thrust at this instant', 'at mid-stroke: ' + (F.mid.thrust > 0 ? hm(F.mid.efficiency, 2) : '—') + ' · without drag: 1'];
  }
  const maxA = Math.max(1e-9, Math.max.apply(null, rows.map(q => Math.abs(q[1])))), neg = rows.some(q => q[1] < 0);
  const x0 = 12 + (neg ? (W - 24) * 0.38 : 0), room = (W - 24) - (x0 - 12) - 4, bh = clamp((H - 20 - 17 * foot.length) / rows.length - 22, 10, 30);
  let y = 8;
  rows.forEach(q => {
    Viz.text(ctx, q[0], 12, y + 7, { size: 12, weight: 500, color: text, maxWidth: W - 110 });
    Viz.text(ctx, hm(q[1], q[4]) + ' ' + q[3], W - 12, y + 7, { size: 12.5, weight: 700, color: q[2] === muted ? text : q[2], align: 'right' });
    const len = room * Math.abs(q[1]) / maxA * (neg ? 0.62 : 1);
    ctx.save(); ctx.fillStyle = Viz.alpha(muted, 0.14); Viz.roundRect(ctx, 12, y + 17, W - 24, bh, 4); ctx.fill();
    ctx.fillStyle = q[2]; Viz.roundRect(ctx, q[1] >= 0 ? x0 : x0 - len, y + 17, Math.max(2, len), bh, 4); ctx.fill();
    if (neg) { ctx.strokeStyle = text; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, y + 14); ctx.lineTo(x0, y + 20 + bh); ctx.stroke(); }
    ctx.restore();
    y += 22 + bh;
  });
  foot.forEach((f, i) => Viz.text(ctx, f, 12, y + 9 + 17 * i, { size: 12, weight: i ? 500 : 650, color: i ? muted : teal, maxWidth: W - 24 }));
}

/* ---------------------------------------------------------------------------------------------------
   TEXTS
   --------------------------------------------------------------------------------------------------- */
const EQ_APP = '\\mathbf U_r=\\mathbf U-\\mathbf V';
const EQ_BETA = '\\tan\\beta_a=\\dfrac{U\\sin\\theta}{U\\cos\\theta+V}';
const EQ_DRIVE = 'F_{\\text{drive}}=L\\sin\\beta_a-D\\cos\\beta_a';
const EQ_SIDE = 'F_{\\text{side}}=L\\cos\\beta_a+D\\sin\\beta_a';
const EQ_LIM = '\\beta_a=\\varepsilon_A+\\varepsilon_H';
const WORDS = '<b>Sailing words.</b> <b>Bow</b>: the front of the boat. <b>Windward / leeward</b>: the side the wind comes from / the side it blows toward. <b>Close-hauled</b>: sailing as close to the wind as the boat will go. <b>Abeam</b>: straight out to the side, so a <b>beam reach</b> has the wind from the side. <b>Run</b>: the wind from behind. <b>Tack</b>: to turn the bow through the wind, and each leg of the zig-zag. <b>In irons</b>: stuck pointing into the wind. <b>Heel</b>: to lean over sideways. <b>Keel</b>: the fin under the hull.';
const BASE = { sys: 'sail', thetaDeg: 45, VU: 0.5, LD: 6, LDh: 8, tack: false };

function explainSail(s) {
  const K = Viz.work, M = sailModel(s), r = M.r, c = Math.cos(M.th), q = Math.sin(M.th), sb = Math.sin(M.ba), cb = Math.cos(M.ba), e = steadyAt(s), bc = bestCourse(s), F = foilModel(s);
  let o = K.step(0, 'What the views show') +
    K.say('<b class="c-blue">Blue</b> arrows are velocities: the true wind, the boat\'s own motion, and what the boat feels. <b class="c-teal">Teal</b> = lift, at right angles to the felt wind; <b class="c-rose">rose</b> = drag, along it; <b class="c-accent">purple</b> = the part that drives the boat. Grey = the side force and the keel\'s answer to it.') +
    K.say(WORDS) +
    K.say('<b>Fixed on this page.</b> True wind $U = 6$ m/s; sail $C_L = 1.2$, area $A = 20\\ \\text{m}^2$; air $\\rho = 1.225\\ \\text{kg/m}^3$. You choose the course $\\theta$, the boat speed $V$ and the two lift-to-drag ratios. The sail keeps the same $C_L$ and $C_D$ on every course (a model).') +
    K.hint('On phones the bars are hidden: drive/L is in the status line and in the readouts.');
  o += K.step(1, 'The wind the boat feels') +
    K.say('The <b class="c-blue">apparent wind</b> is the true wind minus the boat\'s velocity, $' + EQ_APP + '$. Take it apart along the course and across it:') +
    K.line('from ahead: $U\\cos\\theta+V = 6\\times' + tx(c, 3) + '+' + tx(M.V, 2) + '$', hm(M.along, 2) + ' m/s', 'the wind\'s head-on part plus the boat\'s own speed') +
    K.line('from the side: $U\\sin\\theta = 6\\times' + tx(q, 3) + '$', hm(M.across, 2) + ' m/s', 'the boat\'s motion adds nothing sideways') +
    K.box('$U_r=\\sqrt{' + tx(M.along, 2) + '^2+' + tx(M.across, 2) + '^2} = \\mathbf{' + tx(r.Ur, 2) + '}$ m/s' + (r.Ur > UW ? ' — stronger than the true wind' : ''));
  o += K.step(2, 'Its angle off the bow') +
    K.line('$' + EQ_BETA + ' = \\dfrac{' + tx(M.across, 2) + '}{' + tx(M.along, 2) + '}$', hm(M.across / M.along, 3), 'side part over head-on part') +
    K.box('$\\beta_a = \\mathbf{' + tx(deg(M.ba), 1) + '^\\circ}$ off the bow' + (s.VU > 0 ? ' — ' + hm(s.thetaDeg - deg(M.ba), 1) + '° closer to the bow than the true wind\'s ' + s.thetaDeg + '°' : ' — the boat is at rest, so felt wind = true wind'));
  o += K.step(3, 'The sail\'s two forces') +
    K.line('<b class="c-teal">lift</b> $L=C_L\\tfrac12\\rho U_r^2A = 1.2\\times0.5\\times1.225\\times' + tx(r.Ur, 2) + '^2\\times20$', hm(r.L, 0) + ' N', 'at right angles to the felt wind, toward the bow') +
    K.line('<b class="c-rose">drag</b> $D=\\dfrac{L}{L/D}=\\dfrac{' + tx(r.L, 0) + '}{' + tx(s.LD, 1) + '}$', hm(r.D, 0) + ' N', 'along the felt wind: backward and to leeward, never to windward') +
    K.say('In the picture the force arrows are drawn in units of $L$, so the lift arrow always has the same length.');
  o += K.step(4, 'Along and across the course') +
    K.line('<b class="c-accent">drive</b> $' + EQ_DRIVE + ' = ' + tx(r.L, 0) + '\\times' + tx(sb, 3) + '-' + tx(r.D, 0) + '\\times' + (cb < 0 ? '(' + tx(cb, 3) + ')' : tx(cb, 3)) + '$', hm(r.L * sb, 0) + ' − ' + (r.D * cb < 0 ? '(' + hm(r.D * cb, 0) + ')' : hm(r.D * cb, 0)), 'the lift\'s forward part minus the drag\'s backward part') +
    K.box('drive $= \\mathbf{' + tx(r.drive, 0) + '}$ N $= ' + tx(M.dl, 2) + '\\,L$') +
    K.line('side force $' + EQ_SIDE + ' = ' + tx(r.L * cb, 0) + '+' + tx(r.D * sb, 0) + '$', hm(r.lateral, 0) + ' N', 'to leeward; the keel pushes back with the same force');
  o += K.step(5, 'How close to the wind') +
    K.line('the drive is zero when $\\tan\\beta_a=\\dfrac DL$: $\\varepsilon_A=\\tan^{-1}\\dfrac{1}{' + tx(s.LD, 1) + '}$', dg(M.epsA), 'the sail\'s drag angle (rose zone below it)') +
    K.line('hull and keel: $\\varepsilon_H=\\tan^{-1}\\dfrac{1}{' + tx(s.LDh, 1) + '}$', dg(M.epsH), 'their own drag angle, in water') +
    K.box('steady sailing needs $' + EQ_LIM + ' = ' + tx(deg(M.epsA), 1) + '^\\circ+' + tx(deg(M.epsH), 1) + '^\\circ = \\mathbf{' + tx(deg(M.lim), 1) + '^\\circ}$ off the apparent wind; you have $' + tx(deg(M.ba), 1) + '^\\circ$') +
    K.line('as a course, at your speed: $\\theta=\\beta_a+\\sin^{-1}\\!\\big(\\tfrac VU\\sin\\beta_a\\big)$', dg(M.thIrons) + ' (no drive) · ' + dg(M.thHold) + ' (hold)', 'the sine rule in the blue triangle; these are the edges of the rose and amber zones');
  o += K.step(6, 'Progress to windward') +
    K.line('<b class="c-teal">speed made good</b> $V\\cos\\theta = ' + tx(M.V, 2) + '\\times' + (c < 0 ? '(' + tx(c, 3) + ')' : tx(c, 3)) + '$', hm(M.vmg, 2) + ' m/s = ' + hm(M.vmg / UW, 2) + ' U', 'how fast the boat gains ground straight upwind') +
    (e.sails ? K.line('steady speed on this course (drive = hull drag, hull drag area 0.05 m² in water)', hm(e.V, 2) + ' m/s = ' + hm(e.V / UW, 2) + ' U', 'the ring on the dashed curve; it gives ' + hm(e.vmg, 2) + ' m/s made good') : K.say('On this course the sail has no drive even at rest, so there is no steady speed: no ring on the dashed curve.')) +
    (isFinite(bc.thDeg) ? K.box('best course to windward for this sail and hull: about $\\mathbf{' + bc.thDeg + '^\\circ}$ off the true wind, ' + hm(bc.vmg, 2) + ' m/s made good — then tack and do the same on the other side') : '');
  o += K.step(7, 'The bars: what the hull must do') +
    (isFinite(M.need) ? K.line('side force / drive $= \\dfrac{' + tx(r.lateral, 0) + '}{' + tx(r.drive, 0) + '}$', hm(M.need, 2), 'in steady sailing the keel\'s lift over the hull\'s drag must equal this') +
      K.box('the hull and keel need $L/D \\ge ' + tx(M.need, 1) + '$; yours is $' + tx(s.LDh, 1) + '$: ' + (M.need <= s.LDh ? 'the course can be held' : 'too close, the boat slows')) : K.say('There is no forward drive here, so the hull has nothing to balance: the boat slows down.'));
  o += K.step(8, 'Fish tail and bird wing: the same triangle') +
    K.say('Switch the system (chips above the picture). A fin moves sideways at $V$ while the fish advances at $U$, so the flow meets it at $\\tan\\theta=V/U = ' + tx(s.VS, 2) + '$. With 10 N of lift and $L/D = ' + tx(s.LDf, 1) + '$ at mid-stroke: thrust $L\\sin\\theta-D\\cos\\theta$ = <b>' + hm(F.mid.thrust, 2) + ' N</b>, efficiency <b>' + (F.mid.thrust > 0 ? hm(F.mid.efficiency, 2) : '—') + '</b>; without drag the efficiency is exactly 1.');
  o += K.interpret(reading(s), 'Reading the current setting');
  return o;
}
function explainFoil(s) {
  const K = Viz.work, F = foilModel(s), m = F.mid, th = m.theta, L = Viz.live, bird = F.bird, D0 = L0 * F.e;
  let o = K.step(0, 'What the views show') +
    K.say(bird ? 'A bird flying to the left, seen from the side, and a slice of its wing seen from the wing tip. The wing beats down, then up.' : 'A fish swimming to the left, seen from above. Its tail fin, a thin symmetric foil, sweeps from side to side.') +
    K.say('<b class="c-blue">Blue</b> arrows are velocities: the stream $U$, minus the foil\'s own motion $V$, and their sum, the flow the foil feels. <b class="c-teal">Teal</b> = lift, at right angles to that flow; <b class="c-rose">rose</b> = drag, along it; <b class="c-accent">purple</b> = thrust. Grey = the part across the swimming direction.') +
    K.say('<b>A model, not a measurement.</b> $U = 1$ m/s. The stroke speed swings as a sine, $V = V_0\\sin 2\\pi\\phi$ with $V_0/U = ' + tx(s.VS, 2) + '$. The lift is prescribed: 10 N at mid-stroke' + (bird ? ' on the way down' : '') + ', $D = |L|/(L/D)$. Forces follow the flow instant by instant (quasi-steady).') +
    K.hint('On phones the power bars are hidden: thrust and efficiency are in the status line and in the readouts.');
  o += K.step(1, 'The flow the foil feels (mid-stroke)') +
    K.line('$\\tan\\theta=\\dfrac VU$', hm(F.V0, 2) + ', so $\\theta$ = ' + dg(th), 'the foil crosses the stream, so the stream seems to come from the side it moves toward') +
    K.box('relative speed $U_r=\\sqrt{U^2+V^2} = \\mathbf{' + tx(m.Ur, 2) + '}$ m/s');
  o += K.step(2, 'Thrust and the force across') +
    K.line('<b class="c-accent">thrust</b> $=L\\sin\\theta-D\\cos\\theta = 10\\times' + tx(Math.sin(th), 3) + '-' + tx(D0, 2) + '\\times' + tx(Math.cos(th), 3) + '$', hm(m.thrust, 2) + ' N', 'the lift leans forward; the drag leans back') +
    K.line((bird ? 'upward force' : 'side force') + ' $=L\\cos\\theta+D\\sin\\theta = 10\\times' + tx(Math.cos(th), 3) + '+' + tx(D0, 2) + '\\times' + tx(Math.sin(th), 3) + '$', hm(m.side_force, 2) + ' N', bird ? 'this carries the bird\'s weight' : 'the fin must push against this');
  o += K.step(3, 'The two powers') +
    K.line('useful power out $=U\\times\\text{thrust} = 1\\times' + tx(m.thrust, 2) + '$', hm(m.power_out, 2) + ' W', 'moves the animal forward') +
    K.line('power in $=V\\times\\text{' + (bird ? 'upward' : 'side') + ' force} = ' + tx(F.V0, 2) + '\\times' + tx(m.side_force, 2) + '$', hm(m.power_in, 2) + ' W', 'what the muscles pay') +
    K.box('efficiency $=\\dfrac{\\text{out}}{\\text{in}} = \\mathbf{' + (m.thrust > 0 ? tx(m.efficiency, 3) : '\\text{—}') + '}$ · without drag: $UL\\sin\\theta = ' + tx(F.ideal.power_out, 2) + '$ W $= VL\\cos\\theta = ' + tx(F.ideal.power_in, 2) + '$ W, because $V/U=\\tan\\theta$');
  o += K.step(4, 'The best stroke speed') +
    K.line('no thrust below $\\tan\\theta=\\dfrac DL=\\dfrac{1}{' + tx(s.LDf, 1) + '}$', hm(F.e, 3), 'the rose strip of the graph: the drag\'s backward part wins') +
    K.line('efficiency is largest at $\\dfrac VU=\\dfrac DL+\\sqrt{1+\\big(\\dfrac DL\\big)^2}$', hm(F.xBest, 3) + ', where it is ' + hm(F.etaBest, 3), 'ours: the triangle on the teal curve');
  o += K.step(5, 'At this instant of the stroke') +
    K.line('phase $\\phi$', L('ph'), '0 and 0.5: the ends of the stroke · 0.25 and 0.75: mid-stroke') +
    K.line('stroke speed $V$', L('V') + ' m/s', bird ? 'positive: the wing moves down' : 'positive: one way; negative: back') +
    K.line('lift $L$', L('L') + ' N', bird ? 'positive: upward' : 'it changes sign with the stroke') +
    K.line('thrust · ' + (bird ? 'upward force' : 'side force'), L('thr') + ' N · ' + L('sdf') + ' N', 'the purple and the grey arrow') +
    K.line('power in · out', L('pin') + ' W · ' + L('pout') + ' W', 'the bars');
  let n = 6;
  if (bird) {
    const b = F.back;
    o += K.step(n++, 'The upstroke') +
      K.say('On the way up the wing moves at $-V$, so the air meets it from ahead and <b>above</b>: $\\theta = ' + tx(deg(b.theta), 1) + '^\\circ$. A lift that still points up now leans <b>backward</b>.') +
      K.line('mid-upstroke, lift ' + hm(F.k * L0, 1) + ' N: thrust $=L\\sin\\theta-D\\cos\\theta$', hm(b.thrust, 2) + ' N', F.k > 0 ? 'negative: the upstroke costs thrust' : 'the lift is reversed, so it leans forward again') +
      K.line('upward force $=L\\cos\\theta+D\\sin\\theta$', hm(b.side_force, 2) + ' N', F.k > 0.5 ? 'the weight is still carried' : F.k > 0 ? 'little is carried: the wing is feathered' : 'a downward force: no weight support on this stroke') +
      K.box('averaged over the whole beat: thrust $\\mathbf{' + tx(F.mean.thrust, 2) + '}$ N · upward force $\\mathbf{' + tx(F.mean.side, 2) + '}$ N');
  } else {
    o += K.step(n++, 'The return stroke') +
      K.say('When the fin sweeps back, $V$ changes sign and so does $\\theta$. The fin flips its angle of attack at the end of the stroke, so the lift changes sign too: $L\\sin\\theta$ is the product of two negatives, and the thrust is forward again.') +
      K.box('averaged over the whole beat: thrust $\\mathbf{' + tx(F.mean.thrust, 2) + '}$ N · side force $\\mathbf{' + tx(F.mean.side, 2) + '}$ N (the two half-strokes cancel)');
  }
  o += K.step(n++, 'The sail is the same triangle') +
    K.say('In the sail, the <em>stream</em> crosses the course; here the <em>foil</em> crosses the stream. Either way the lift is at right angles to the flow the foil feels, $' + EQ_APP + '$, and so it gets a forward part.');
  o += K.interpret(reading(s), 'Reading the current setting');
  return o;
}
function liveOf(s) {
  if (isSail(s)) return {};
  const F = foilModel(s), r = F.r;
  return { ph: fx(s.ph, 2), V: sgn(F.V, 2), L: sgn(F.L, 1), thr: sgn(r.thrust, 2), sdf: sgn(r.side_force, 2), pin: hm(r.power_in, 2), pout: hm(r.power_out, 2) };
}
const D22_NUM = s => { const M = sailModel(Object.assign({}, s, { sys: 'sail' })); return M; };

      if (ev.viewId === 'plan') {
        if (!isSail(s) || !SAILCAM) return false;
        const x = (v.pointer.x - SAILCAM.ox) / SAILCAM.sc, y = (SAILCAM.oy - v.pointer.y) / SAILCAM.sc;
        if (Math.hypot(x, y) < 0.08) return false;
        const a = deg(Math.atan2(x, y));
        g.app.set({ thetaDeg: clamp(Math.round(Math.abs(a)), 0, 180), tack: Math.abs(a) > 2 && Math.abs(a) < 178 ? a < 0 : s.tack });
        return true;
      }
      if (ev.viewId === 'curve') {
        const P = curvePlot(v, s), x = P.ix(v.pointer.x);
        if (isSail(s)) g.app.set('thetaDeg', clamp(Math.round(x), 0, 180)); else g.app.set('VS', clamp(Math.round(x * 20) / 20, 0.05, 1.5));
        return true;
      }
      return false;
    }

      goal: 'Find the force that drives a sailing boat along its course, and how close to the wind the boat can point. The book resolves the sail\'s force in words; here it is in symbols.',
      start: { tex: EQ_APP, plain: 'The wind the boat feels (the apparent wind) is the true wind minus the boat\'s own velocity. The sail\'s lift $L$ is perpendicular to $\\mathbf U_r$ and its drag $D$ is along it.' },
      plan: ['Take the apparent wind apart along and across the course.', 'Find its angle off the bow (the front of the boat).', 'Resolve lift and drag along and across the course.', 'Find where the drive vanishes, then add the hull\'s balance.'],
      uses: ['relative velocity: subtract the observer\'s velocity', 'resolving a force into two perpendicular parts', 'tangent of a difference: $\\tan(a-b)=\\dfrac{\\tan a-\\tan b}{1+\\tan a\\tan b}$', 'assumed: steady sailing, forces in the horizontal plane (no heel, i.e. no leaning over), quasi-steady sail and keel'],
      view: 'plan', set: BASE,
      steps: [
        { did: 'Choose axes on the boat', tex: '\\begin{aligned}&\\hat{\\mathbf t}\\ \\text{along the course},\\quad\\hat{\\mathbf n}\\ \\text{across it, to leeward}\\\\&\\mathbf V=V\\,\\hat{\\mathbf t}\\end{aligned}',
          why: 'Leeward is the side the wind blows toward. The boat can only use the force component along its course; the keel (the fin under the hull) resists the component across it.',
          plain: 'Forward and sideways, as the boat sees them.', set: BASE, watch: 'The dotted line ahead of the bow is the course; the grey arrows lie across it.' },
        { did: 'Resolve the true wind', tex: '\\mathbf U=-U\\cos\\theta\\,\\hat{\\mathbf t}+U\\sin\\theta\\,\\hat{\\mathbf n}',
          why: 'The wind comes from the direction at the angle $\\theta$ off the bow, on the windward side. So it blows backward ($-\\hat{\\mathbf t}$) and to leeward ($+\\hat{\\mathbf n}$).',
          plain: 'A headwind part and a crosswind part.', set: BASE,
          live: s => { const M = D22_NUM(s); return '\\mathbf U=' + tx(-UW * Math.cos(M.th), 2) + '\\,\\hat{\\mathbf t}+' + tx(M.across, 2) + '\\,\\hat{\\mathbf n}\\ \\ \\text{m/s}'; } },
        { did: 'Subtract the boat\'s velocity', tex: '\\begin{aligned}\\mathbf U_r&=-(U\\cos\\theta+V)\\,\\hat{\\mathbf t}+U\\sin\\theta\\,\\hat{\\mathbf n}\\\\ \\tan\\beta_a&=\\dfrac{U\\sin\\theta}{U\\cos\\theta+V}\\end{aligned}',
          why: 'Relative velocity: $\\mathbf U_r=\\mathbf U-\\mathbf V$. $\\beta_a$ is the angle between the bow and the direction the apparent wind comes from. Since $V>0$, $\\beta_a<\\theta$.',
          plain: 'The felt wind is stronger from ahead, and closer to the bow than the true wind.', set: BASE,
          live: s => { const M = D22_NUM(s); return '\\begin{aligned}\\mathbf U_r&=-' + tx(M.along, 2) + '\\,\\hat{\\mathbf t}+' + tx(M.across, 2) + '\\,\\hat{\\mathbf n}\\ \\text{m/s}\\\\ \\tan\\beta_a&=\\tfrac{' + tx(M.across, 2) + '}{' + tx(M.along, 2) + '},\\quad\\beta_a=' + tx(deg(M.ba), 1) + '^\\circ\\end{aligned}'; },
          watch: 'The bold blue arrow is the sum of the true wind and the dashed arrow, the headwind the boat makes for itself.' },
        { did: 'Write the sail\'s two forces', tex: '\\begin{aligned}\\mathbf D&=D\\,(-\\cos\\beta_a\\,\\hat{\\mathbf t}+\\sin\\beta_a\\,\\hat{\\mathbf n})\\\\ \\mathbf L&=L\\,(\\sin\\beta_a\\,\\hat{\\mathbf t}+\\cos\\beta_a\\,\\hat{\\mathbf n})\\end{aligned}',
          why: 'Drag points along the apparent wind, the unit vector of $\\mathbf U_r$. Lift is that direction turned by 90° toward the bow, with $L=C_L\\tfrac12\\rho U_r^2A$ and likewise $D$.',
          plain: 'Drag pulls back and to leeward; lift pulls forward and to leeward.', set: BASE,
          watch: 'The rose arrow continues the bold blue one; the teal arrow is square to both.' },
        { did: 'Add the components along the course', tex: EQ_DRIVE,
          why: 'These are the $\\hat{\\mathbf t}$-parts of the two forces of the step before: $+L\\sin\\beta_a$ from the lift and $-D\\cos\\beta_a$ from the drag.',
          plain: 'The drive is the forward part of the lift minus the backward part of the drag.', set: BASE,
          live: s => { const M = D22_NUM(s), r = M.r; return '\\begin{aligned}F_{\\text{drive}}&=' + tx(r.L, 0) + '\\times' + tx(Math.sin(M.ba), 3) + '-' + tx(r.D, 0) + '\\times' + tx(Math.cos(M.ba), 3) + '\\\\&=' + tx(r.drive, 0) + '\\ \\text{N}\\end{aligned}'; }, highlight: ['readout:dl'] },
        { did: 'Add the components across the course', tex: EQ_SIDE,
          why: 'These are the $\\hat{\\mathbf n}$-parts of the same two forces: both the lift and the drag push to leeward.',
          plain: 'A side force, usually several times the drive, pushing the boat to leeward.', set: BASE,
          live: s => { const M = D22_NUM(s), r = M.r; return 'F_{\\text{side}}=' + tx(r.L * Math.cos(M.ba), 0) + '+' + tx(r.D * Math.sin(M.ba), 0) + '=' + tx(r.lateral, 0) + '\\ \\text{N}'; }, highlight: ['readout:sl'] },
        { did: 'Find where the drive vanishes', tex: 'F_{\\text{drive}}=0\\ \\Longleftrightarrow\\ \\tan\\beta_a=\\dfrac DL\\equiv\\tan\\varepsilon_A',
          why: 'Set the drive to zero and divide by $L\\cos\\beta_a$. $\\varepsilon_A$ is the sail\'s drag angle: the angle by which its total force leans back from the lift.',
          plain: 'No sail can drive a boat when the felt wind is closer to the bow than its own drag angle.',
          set: Object.assign({}, BASE, { thetaDeg: 12 }), watch: 'The purple arrow points backward: the boat is inside the rose zone.',
          live: s => { const M = D22_NUM(s); return '\\varepsilon_A=\\tan^{-1}\\tfrac{1}{' + tx(s.LD, 1) + '}=' + tx(deg(M.epsA), 1) + '^\\circ,\\quad\\beta_a=' + tx(deg(M.ba), 1) + '^\\circ'; } },

      result: { tex: '\\begin{aligned}F_{\\text{drive}}&=L\\sin\\beta_a-D\\cos\\beta_a\\quad(0\\ \\text{at}\\ \\tan\\beta_a=D/L)\\\\ \\beta_a&=\\varepsilon_A+\\varepsilon_H,\\qquad\\varepsilon=\\tan^{-1}(D/L)\\end{aligned}',
        plain: 'Sailing upwind is a contest between two lift-to-drag ratios: the sail\'s in air and the keel\'s in water. Improve either and the boat points higher. The same triangle, with the stream and the motion exchanged, is the fish tail and the flapping wing.', set: BASE },
      interpret: s => { const M = D22_NUM(s); return 'On this course the boat feels the wind $' + tx(deg(M.ba), 1) + '^\\circ$ off the bow and gets ' + hm(100 * M.dl, 0) + ' % of the sail\'s lift as drive. It fails when the boat heels (leans over, so the forces leave the horizontal plane), in gusts, or when the sail stalls.'; },
      check: 'Units: forces in N, angles without units. Limits: $V=0$ gives $\\beta_a=\\theta$ (felt wind = true wind); $D=0$ for sail and hull gives $\\beta_a\\to0$; running, $\\theta=180^\\circ$, gives drive $=+D$: the boat is pushed. Number: $U=4$, $V=3$ m/s, $\\theta=90^\\circ$ give $\\beta_a=53.1^\\circ$; with $L=100$ N, $D=25$ N the drive is 65 N and the side force 80 N. The selftest rows compare every formula with the Python.' }

    ch14_aerodynamics as ch14)

aw = ch14.apparent_wind(
    U=U, V=V, theta=th)
# felt wind {{Ur}} m/s,
#   {{ba}} deg off the bow
sf = ch14.sail_forces(
    U=U, V=V, theta=th,
    CL=1.2, CD={{CD}},
    rho=1.225, A=20.0)
# lift {{L}} N, drag {{D}} N
# drive {{drive}} N, forward
# side {{lat}} N, to leeward
lim = (
  ch14.sailboat_course_limit(
    LD_sail={{LD}}, LD_hull={{LDh}}))
# closest: {{lim}} deg off
#   the apparent wind
vmg = ch14.velocity_made_good(
    V=V, theta=th)
# made good: {{vmg}} m/s`,

    { q: 'The boat is moving. Is the apparent wind closer to the bow than the true wind, or further from it?', a: 'Closer. The boat\'s own speed adds a headwind: $\\tan\\beta_a=\\dfrac{U\\sin\\theta}{U\\cos\\theta+V}$ has $V$ in the denominator, so $\\beta_a<\\theta$. Set the boat speed to 0 and the two angles become equal.', set: BASE },
    { q: 'With a sail of $L/D=6$, at what apparent-wind angle does the drive vanish?', a: 'At $\\tan\\beta_a=D/L$: $\\beta_a=\\tan^{-1}(1/6)=9.5^\\circ$. Turn the course to 14° at $V/U=0.5$: the felt wind is then 9.3° off the bow and the purple arrow is all but gone.', set: Object.assign({}, BASE, { thetaDeg: 14 }) },
    { q: 'Fish mode, almost no drag ($L/D=20$): how does the efficiency change with the stroke speed $V/U$?', a: 'Hardly at all, and it stays near 1. Without drag the power in, $VL\\cos\\theta$, equals the power out, $UL\\sin\\theta$, whatever $V/U$ is, because $V=U\\tan\\theta$.', set: { sys: 'fish', LDf: 20, VS: 0.75 } },
    { q: 'Bird mode: the wing keeps lifting on the upstroke. Which way does that lift lean, and what does it do to the thrust?', a: 'Backward. On the upstroke the air meets the wing from ahead and above, so a lift that points up is tilted toward the tail: the thrust is negative. A bird feathers its wing on the way up to avoid this.', set: { sys: 'bird', upLift: 'lift', ph: 0.75 } },
    { q: 'Why does a boat without a keel not sail upwind?', a: 'The side force is several times the drive (see the bars). With nothing to push back, it would simply slide the boat to leeward.', set: BASE }
  ],
  selftest: () => {
    const th = rad(45), kw = 'CL=1.2, CD=0.2, rho=1.225, A=20.0', sf = 'ch14.sail_forces(U=6.0, V=3.0, theta=np.deg2rad(45.0), ' + kw + ')';
    const eqp = 'ch14.sailboat_equilibrium(U=6.0, theta=np.deg2rad(45.0), CL=1.2, CD=0.2, rho_air=1.225, A_sail=20.0, rho_water=1000.0, CDA_hull=0.05)';
    const r = sail(6, 3, th, 1.2, 0.2, 1.225, 20), e = equil(6, th, 1.2, 0.2, 1.225, 20, 1000, 0.05);
    const G = sailGeom(th, Math.abs(r.beta_a), 1), Gm = sailGeom(th, Math.abs(r.beta_a), -1), F = [r.L * G.lift[0] + r.D * G.drag[0], r.L * G.lift[1] + r.D * G.drag[1]];
    const ur = [0 - 3 * G.t[0], -6 - 3 * G.t[1]];
    const up = foil(1, -0.75, 10, 1), Gb = foilGeom(up.theta, true), Fb = [10 * Gb.lift[0] + 1 * Gb.drag[0], 10 * Gb.lift[1] + 1 * Gb.drag[1]];
    const dn = foil(1, 0.75, 10, 1), Gd = foilGeom(dn.theta, true);
    return [
      { name: 'apparent wind speed U_r = |U − V|', js: apparent(6, 3, th).Ur, py: 'ch14.apparent_wind(U=6.0, V=3.0, theta=np.deg2rad(45.0))["Ur"]', rtol: 1e-12 },
      { name: 'apparent wind angle off the bow, beta_a', js: apparent(6, 3, th).beta_a, py: 'ch14.apparent_wind(U=6.0, V=3.0, theta=np.deg2rad(45.0))["beta_a"]', rtol: 1e-12 },
      { name: 'sail lift L = C_L ½ρU_r²A', js: r.L, py: sf + '["L"]', rtol: 1e-12 },
      { name: 'drive = L sin β_a − D cos β_a (+ forward)', js: r.drive, py: sf + '["drive"]', rtol: 1e-10 },
      { name: 'side force = L cos β_a + D sin β_a (+ to leeward)', js: r.lateral, py: sf + '["lateral"]', rtol: 1e-10 },
      { name: 'drive / L', js: r.drive_over_L, py: sf + '["drive_over_L"]', rtol: 1e-10 },
      { name: 'in the no-go zone (θ = 12°) the drive is negative', js: sail(6, 3, rad(12), 1.2, 0.2, 1.225, 20).drive, py: 'ch14.sail_forces(U=6.0, V=3.0, theta=np.deg2rad(12.0), ' + kw + ')["drive"]', rtol: 1e-10 },
      { name: 'beam reach, other tack (θ = −90°): same drive', js: sail(6, 3, rad(-90), 1.2, 0.2, 1.225, 20).drive, py: 'ch14.sail_forces(U=6.0, V=3.0, theta=np.deg2rad(-90.0), ' + kw + ')["drive"]', rtol: 1e-10 },
      { name: 'drive curve at θ = 70°', js: sail(6, 3, rad(70), 1.2, 0.2, 1.225, 20).drive, py: 'ch14.sail_drive_curve(theta=np.deg2rad(70.0), U=6.0, V=3.0, ' + kw + ')', rtol: 1e-10 },
      { name: 'running (θ = 180°): drive = +D', js: sail(6, 3, PI, 1.2, 0.2, 1.225, 20).drive, py: 'ch14.sail_forces(U=6.0, V=3.0, theta=np.pi, ' + kw + ')["drive"]', rtol: 1e-9 },
      { name: 'closest course β_a = ε_A + ε_H', js: limit(6, 8), py: 'ch14.sailboat_course_limit(LD_sail=6.0, LD_hull=8.0)', rtol: 1e-12 },
      { name: 'speed made good V cos θ', js: vmg(3, th), py: 'ch14.velocity_made_good(V=3.0, theta=np.deg2rad(45.0))', rtol: 1e-12 },
      { name: 'steady speed (drive = hull drag)', js: e.V, py: eqp + '["V"]', rtol: 1e-8 },
      { name: 'steady sailing: hull L/D required', js: e.LD_hull_required, py: eqp + '["LD_hull_required"]', rtol: 1e-7 },
      { name: 'steady sailing: speed made good', js: e.vmg, py: eqp + '["vmg"]', rtol: 1e-8 },
      { name: 'fin: efficiency with drag', js: dn.efficiency, py: 'ch14.oscillating_foil(U=1.0, V=0.75, L=10.0, D=1.0)["efficiency"]', rtol: 1e-12 },
      { name: 'fin: thrust = L sin θ − D cos θ', js: dn.thrust, py: 'ch14.oscillating_foil(U=1.0, V=0.75, L=10.0, D=1.0)["thrust"]', rtol: 1e-12 },
      { name: 'fin: side force = L cos θ + D sin θ', js: dn.side_force, py: 'ch14.oscillating_foil(U=1.0, V=0.75, L=10.0, D=1.0)["side_force"]', rtol: 1e-12 },
      { name: 'fin, return stroke (V < 0, L < 0): thrust forward again', js: foil(1, -0.75, -10, 1).thrust, py: 'ch14.oscillating_foil(U=1.0, V=-0.75, L=-10.0, D=1.0)["thrust"]', rtol: 1e-12 },
      { name: 'wing, upstroke with upward lift (V < 0, L > 0): thrust negative', js: up.thrust, py: 'ch14.oscillating_foil(U=1.0, V=-0.75, L=10.0, D=1.0)["thrust"]', rtol: 1e-12 },
      { name: 'wing, upstroke with upward lift: power in (negative)', js: up.power_in, py: 'ch14.oscillating_foil(U=1.0, V=-0.75, L=10.0, D=1.0)["power_in"]', rtol: 1e-12 },
      { name: 'resolve a force into lift', js: resolveLD(374.6, -980.9, PI + 0.52984).L, py: 'ch14.resolve_lift_drag(Fx=374.6, Fy=-980.9, alpha=np.pi + 0.52984)[0]', rtol: 1e-12 },
      { name: 'resolve a force into drag', js: resolveLD(374.6, -980.9, PI + 0.52984).D, py: 'ch14.resolve_lift_drag(Fx=374.6, Fy=-980.9, alpha=np.pi + 0.52984)[1]', rtol: 1e-12 },
      { name: 'fin without drag: efficiency 1', js: foil(1, 0.4, 10, 0).efficiency, expect: 1, rtol: 1e-12 },
      { name: 'drive is zero at tan β_a = D/L', js: driveAtBeta(Math.atan(1 / 6), 6), expect: 0, atol: 1e-12 },
      { name: 'drawn arrows: (L + D) along the course = drive', js: dot(F, G.t), expect: r.drive, rtol: 1e-12 },
      { name: 'drawn arrows: (L + D) across, to leeward = side force', js: dot(F, G.n), expect: r.lateral, rtol: 1e-12 },
      { name: 'drawn drag arrow is along the felt wind U − V', js: dot(G.drag, ur) / Math.hypot(ur[0], ur[1]), expect: 1, rtol: 1e-12 },
      { name: 'drawn drag arrow points to leeward (the true wind\'s side), not to windward', js: Math.sign(dot(G.drag, G.n)) * Math.sign(dot(G.wind, G.n)), expect: 1, rtol: 1e-12 },
      { name: 'drawn lift arrow is square to the felt wind', js: dot(G.lift, G.ur), expect: 0, atol: 1e-12 },
      { name: 'other tack: the picture is the mirror image', js: Gm.drag[0] + G.drag[0], expect: 0, atol: 1e-12 },
      { name: 'course of zero drive, back through apparent()', js: Math.tan(apparent(6, 3, courseFor(Math.atan(1 / 6), 0.5)).beta_a), expect: 1 / 6, rtol: 1e-12 },
      { name: 'bird downstroke: drawn lift points up and forward', js: Math.sign(Gd.lift[1]) + Math.sign(-Gd.lift[0]), expect: 2, rtol: 1e-12 },
      { name: 'bird upstroke: drawn upward lift leans backward', js: Math.sign(Gb.lift[1]) + Math.sign(Gb.lift[0]), expect: 2, rtol: 1e-12 },
      { name: 'bird upstroke: drawn force forward = thrust', js: dot(Fb, Gb.f), expect: up.thrust, rtol: 1e-12 },
      { name: 'best stroke speed is a maximum of the efficiency', js: (etaOf(bestX(0.1) + 1e-4, 0.1) - etaOf(bestX(0.1) - 1e-4, 0.1)) / 2e-4, expect: 0, atol: 1e-7 }
    ];
  }
});
</script>
