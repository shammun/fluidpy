.viz-work-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; margin-right: 6px;
  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }

.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

.viz-der-chain { display: flex; align-items: center; gap: 6px; }
.viz-der-chain .viz-eq-body { flex: 1 1 auto; min-width: 0; }
.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }

.viz-der-plain { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 4px 9px; }

.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-side { flex: 1 1 auto; }
.c-accent { color: var(--viz-accent); font-weight: 650; } .c-teal { color: var(--viz-teal); font-weight: 650; }

.viz-pages { position: relative; }

  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;

    if (v.w >= 320) Viz.text(ctx, l1 + ' · ' + l2, P.px.x + 5, P.px.y + 10, o);
    else { Viz.text(ctx, l1, P.px.x + 5, P.px.y + 10, o); Viz.text(ctx, l2, P.px.x + 5, P.px.y + 26, o); }
  }
  const mY = TY(m.p.x, m.p.y);
  if (P.inside(P.X(m.p.x), P.Y(mY))) {

/* ---- view 3: rule against measured -------------------------------------------------------------------------------- */
const gapWord = (g, zero) => (zero ? 'both zero' : Math.abs(g) < 5e-7 ? 'exact' : Math.abs(g) < 5e-4 ? 'agree to 0.05 %' : `rule ${pc(Math.abs(g))} ${hiLo(g)}`);
function barGroups(G) {
  return [
    { name: 'Chord / 4b', rule: 'c ≃ 4b', col: Viz.color('blue'), meas: G.c4, ruleV: 1, floor: 1, show: x => fx(x, 3),
      gap: gapWord(G.gapChord, false) },
    { name: 'Camber / chord', rule: '½β', col: Viz.color('teal'), meas: 100 * G.cc, ruleV: 100 * G.Rl.camber_ratio, floor: 2, show: x => fx(x, 2) + ' %',
      gap: gapWord(G.gapC, G.sym) },
    { name: 'Thickness / chord', rule: '(3√3/4) e', col: Viz.color('orange'), meas: 100 * G.tc, ruleV: 100 * G.Rl.thickness_ratio, floor: 2, show: x => fx(x, 2) + ' %',
      gap: gapWord(G.gapT, G.thin), warn: G.gapT >= 0.15 }
  ];
}
/** Measured t/c against e for the current β (the curve beside the bars): 31 sections of 500 points each. */
let CURVE = { key: '', es: [], tc: [] };
function gapCurve(betaDeg) {
  if (CURVE.key === String(betaDeg)) return CURVE;
  const es = [], tc = [];
  for (let k = 0; k <= 30; k++) { const e = 0.01 * k; es.push(e); tc.push(k === 0 ? 0 : measure(contour(B, e, betaDeg * D2R, 500)).thickness_ratio); }
  CURVE = { key: String(betaDeg), es, tc };
  return CURVE;
}
function drawCurve(v, s, G, rect) {
  const ctx = v.ctx, OR = Viz.color('orange'), MU = Viz.color('muted'), RO = Viz.color('rose'), TX = Viz.color('text'), Cv = gapCurve(s.betaDeg);
  const P = v.plot({ rect, xlim: [0, 0.3], ylim: [0, 42], pad: { l: 52, r: 14, t: 12, b: 38 } }).axes({ grid: true, xlabel: 'thickness parameter e  [–]', ylabel: 'thickness / chord  [%]' });
  P.line(Cv.es, Cv.es.map(e => 100 * K_RULE * e), { color: OR, width: 1.6, dash: [6, 4] });                    // the rule: a straight line
  P.line(Cv.es, Cv.tc.map(x => 100 * x), { color: Viz.alpha(OR, 0.35), width: 2.2 });                           // measured: the whole curve, faint
  const xs = Cv.es.filter(e => e <= s.e + 1e-9), ys = xs.map((e, k) => 100 * Cv.tc[k]);
  xs.push(s.e); ys.push(100 * G.tc);
  P.line(xs, ys, { color: OR, width: 3 });                                                                      // … and bold up to your e
  if (!G.thin) {
    segPx(ctx, P.X(s.e), P.Y(100 * G.tc), P.X(s.e), P.Y(100 * G.Rl.thickness_ratio), G.gapT >= 0.15 ? RO : TX, 2);
    ringPx(ctx, P.X(s.e), P.Y(100 * G.Rl.thickness_ratio), 4.5, OR, 2);
    Viz.text(ctx, `gap ${pc(G.gapT)}`, P.X(s.e) + (s.e > 0.2 ? -9 : 9), P.Y(50 * (G.tc + G.Rl.thickness_ratio)), { size: 12, weight: 700, color: G.gapT >= 0.15 ? RO : TX, align: s.e > 0.2 ? 'right' : 'left', bg: true, pad: 2 });
  }
  P.dot(s.e, 100 * G.tc, 5.5, { color: OR, stroke: '#fff', strokeWidth: 2 });
  Viz.text(ctx, 'dashed: rule (3√3/4) e', P.px.x + 8, P.px.y + 12, { size: 12, weight: 600, color: MU, bg: true, pad: 2 });
  Viz.text(ctx, 'solid: measured', P.px.x + 8, P.px.y + 28, { size: 12, weight: 600, color: OR, bg: true, pad: 2 });
}
function drawBars(v, s, G) {
  v.clear();
  const ctx = v.ctx, H = v.h, curve = v.w >= 760 && H >= 140, W = curve ? Math.round(v.w * 0.6) : v.w;
  if (W < 120 || H < 50) return;
  if (curve) drawCurve(v, s, G, { x: W, y: 0, w: v.w - W, h: H });
  const TX = Viz.color('text'), MU = Viz.color('muted'), RO = Viz.color('rose'), groups = barGroups(G);
  const cols = W >= 480, gw = cols ? W / 3 : W, gh = cols ? H : H / 3;
  groups.forEach((gr, i) => {
    const x0 = cols ? i * gw : 0, y0 = cols ? 0 : i * gh, pad = 12, scale = 1.12 * Math.max(gr.meas, gr.ruleV, gr.floor);
    const bar = (X, Y, w, h, val, solid) => {
      const L = Math.max(0, w * val / scale);
      ctx.save();
      ctx.fillStyle = Viz.alpha(MU, 0.14); ctx.fillRect(X, Y, w, h);
      if (solid) { ctx.fillStyle = gr.col; ctx.fillRect(X, Y, L, h); }
      else {
        ctx.fillStyle = Viz.alpha(gr.col, 0.22); ctx.fillRect(X, Y, L, h);
        ctx.beginPath(); ctx.rect(X, Y, L, h); ctx.clip(); ctx.strokeStyle = Viz.alpha(gr.col, 0.85); ctx.lineWidth = 1.2; ctx.beginPath();
        for (let q = -h; q < L + h; q += 7) { ctx.moveTo(X + q, Y + h); ctx.lineTo(X + q + h, Y); }
        ctx.stroke();
      }
      ctx.restore();
      if (!solid && L > 1) { ctx.save(); ctx.strokeStyle = gr.col; ctx.lineWidth = 1.4; ctx.strokeRect(X + 0.5, Y + 0.5, Math.max(L - 1, 1), h - 1); ctx.restore(); }
    };
    if (cols && gh >= 118) {                                     // title · measured (label, value, bar) · rule (the same) · gap
      const tw = gw - 2 * pad, bh = Math.max(10, Math.min(22, (gh - 104) / 2)), xr = x0 + gw - pad;
      const yT = 14, yL1 = 37, yB1 = 46, yL2 = yB1 + bh + 15, yB2 = yL2 + 9, yG = yB2 + bh + 16;
      Viz.text(ctx, gr.name, x0 + pad, y0 + yT, { size: 13, weight: 700, color: gr.col, halo: false });
      Viz.text(ctx, 'measured', x0 + pad, y0 + yL1, { size: 12, weight: 600, color: TX, halo: false });
      Viz.text(ctx, gr.show(gr.meas), xr, y0 + yL1, { size: 12.5, weight: 700, color: TX, halo: false, align: 'right' });
      bar(x0 + pad, y0 + yB1, tw, bh, gr.meas, true);
      Viz.text(ctx, 'rule ' + gr.rule, x0 + pad, y0 + yL2, { size: 12, weight: 600, color: MU, halo: false });
      Viz.text(ctx, gr.show(gr.ruleV), xr, y0 + yL2, { size: 12.5, weight: 600, color: MU, halo: false, align: 'right' });
      bar(x0 + pad, y0 + yB2, tw, bh, gr.ruleV, false);
      Viz.text(ctx, gr.gap, x0 + pad, y0 + yG, { size: 12.5, weight: 700, color: gr.warn ? RO : TX, halo: false, maxWidth: tw });
    } else {                                                     // one compact line per quantity
      const yc = y0 + gh / 2, nameW = Math.min(132, W * 0.3), gapW = Math.min(150, W * 0.3), vw = 58, tw = Math.max(16, W - 2 * pad - nameW - gapW - vw);
      const bh = Math.max(5, Math.min(11, (gh - 8) / 2));
      Viz.text(ctx, gr.name, x0 + pad, yc, { size: 12.5, weight: 700, color: gr.col, halo: false, maxWidth: nameW - 6 });
      bar(x0 + pad + nameW, yc - bh - 1, tw, bh, gr.meas, true); bar(x0 + pad + nameW, yc + 1, tw, bh, gr.ruleV, false);
      Viz.text(ctx, gr.show(gr.meas), x0 + pad + nameW + tw + 6, yc, { size: 12.5, weight: 700, color: TX, halo: false });
      Viz.text(ctx, gr.gap, x0 + W - pad, yc, { size: 12, weight: 650, color: gr.warn ? RO : TX, halo: false, align: 'right', maxWidth: gapW - 6 });
    }
    if (cols && i > 0) segPx(ctx, x0 + 0.5, 8, x0 + 0.5, H - 8, Viz.alpha(MU, 0.35), 1);
  });
}

/* ---- the one-point arithmetic of (14.4) (inspector, Explain §2) --------------------------------------------------- */
function pointLines(s) {
  const m = mark(s), p = m.p, bR = B * B / p.R;
  return [
    `$\\zeta=\\xi+i\\eta=(${tx(m.zeta.re, 3)},\\ ${tx(m.zeta.im, 3)})$, $\\theta=${tx(p.theta * R2D, 1)}^\\circ$`,
    `$R=\\sqrt{${tb(m.zeta.re, 3)}^2+${tb(m.zeta.im, 3)}^2}=${tx(p.R, 3)}$, $b^2/R=${tx(bR, 3)}$`,
    `$x=(R+b^2/R)\\cos\\theta$ $=(${tx(p.R, 3)}+${tx(bR, 3)})\\times${tb(Math.cos(p.theta), 3)}=\\mathbf{${tx(p.x, 3)}}$`,
    `$y=(R-b^2/R)\\sin\\theta$ $=(${tx(p.R, 3)}-${tx(bR, 3)})\\times${tb(Math.sin(p.theta), 3)}=\\mathbf{${tx(p.y, 3)}}$ (14.4)`
  ];
}
function statusOf(s) {
  const G = N(s), r = regime(s), nr = narrow();
  if (r === 'plate') return { text: nr ? '▬ flat plate: chord 4b' : '▬ flat plate: chord exactly 4b, no camber, no thickness', tone: 'info' };
  if (r === 'arc') return { text: nr ? `◠ arc: height ${fx(2 * B * Math.tan(G.beta), 3)} b` : `◠ circular arc: height 2b tan β = ${fx(2 * B * Math.tan(G.beta), 3)} b, no thickness`, tone: 'info' };
  if (r === 'thin') return { text: nr ? '✅ thin: rules within 5 %' : `✅ thin and ${G.sym ? 'symmetric' : 'slightly cambered'}: rules within 5 %`, tone: 'good' };
  if (r === 'mid') return { text: `≈ thickness rule ${pc(G.gapT)} high`, tone: 'warn' };
  return { text: nr ? `⚠️ e = ${fx(G.e, 2)}: rule ${pc(G.gapT, 0)} high` : `⚠️ e = ${fx(G.e, 2)}: thickness rule ${pc(G.gapT, 0)} high — first order in e only`, tone: 'bad' };
}

      live: s => { const p = mark(s).p, q = B * B / p.R; return `\\begin{aligned}x&=(${tx(p.R, 3)}+${tx(q, 3)})\\times${tb(Math.cos(p.theta), 3)}=${tx(p.x, 3)}\\\\ y&=(${tx(p.R, 3)}-${tx(q, 3)})\\times${tb(Math.sin(p.theta), 3)}=${tx(p.y, 3)}\\end{aligned}`; },
      note: '$\\theta$ is the polar angle of $\\zeta$ from the origin, not from the circle\'s centre',
      symbols: [['R', 'distance of ζ from the origin', 'b'], ['\\theta', 'polar angle of ζ from the origin', 'rad']] },
    { id: 'a', title: 'The shifted circle', ref: 'Eq. (14.7)', tex: 'a\\equiv b(1+e),\\qquad e\\ll1',
      live: s => { const G = N(s); return `a=\\dfrac{b(1+e)}{\\cos\\beta}=\\dfrac{${tx(1 + s.e, 3)}}{\\cos${tx(s.betaDeg, 2)}^\\circ}=${tx(G.C.a, 4)}\\,b`; },
      note: 'ours in general: $a=b(1+e)/\\cos\\beta$, centre $\\mu=b-a\\,e^{-i\\beta}$ — the one circle through $\\zeta=b$ that reduces to both of the book\'s cases',

    { id: 'rules', title: 'Shape rules', ref: 'Eq. (14.8)', tex: '\\begin{aligned}&c\\simeq4b,\\quad \\text{camber}\\simeq\\tfrac12\\beta c\\\\ &t_{\\max}/c\\simeq1.3\\,e\\end{aligned}',
      live: s => { const G = N(s); return `\\begin{aligned}c/4b&=${tx(G.c4, 4)}\\ \\text{(rule 1)}\\\\ \\text{camber}/c&=${tx(100 * G.cc, 2)}\\,\\%\\ \\text{(rule }${tx(100 * G.Rl.camber_ratio, 2)}\\,\\%)\\\\ t_{\\max}/c&=${tx(100 * G.tc, 2)}\\,\\%\\ \\text{(rule }${tx(100 * G.Rl.thickness_ratio, 2)}\\,\\%)\\end{aligned}`; },
      note: 'first order in $e$ and $\\beta$; the 1.3 is $3\\sqrt3/4=1.299$ rounded',

    { id: 'arc', title: 'The arc of a raised circle', ref: 'unnumbered, §14.4', tex: 'x^2+(y+2b\\cot2\\beta)^2=(2b\\csc2\\beta)^2',
      live: s => { if (s.betaDeg < 1e-9) return '\\beta=0:\\ y=0\\ \\text{(the plate)}'; const A = arc(B, s.betaDeg * D2R); return `x^2+(y+${tx(-A.centre.im, 2)})^2=(${tx(A.radius, 2)})^2`; },

    { id: 'der', title: 'Rate of the map', ref: 'unnumbered, §14.4', tex: '\\dfrac{dz}{d\\zeta}=1-\\dfrac{b^2}{\\zeta^2}',
      live: s => `\\left|\\dfrac{dz}{d\\zeta}\\right|=${tx(mark(s).dz, 3)}\\ \\text{at the marked point}`,
      note: 'zero at $\\zeta=\\pm b$: angles double there, which makes the sharp tail' }
  ],
  check: [
    { q: 'Which single point of the circle becomes the sharp tail, and why is it sharp?', a: '$\\zeta=b$: the map\'s rate $dz/d\\zeta=1-b^2/\\zeta^2$ vanishes there, so angles double and the smooth circle folds.', set: { e: 0.1, betaDeg: 8, t: 0, zoomTE: true } },
    { q: 'Set $e=0$. Does changing $\\beta$ change the chord?', a: 'No: both ends stay at $z=\\pm2b$; only the height $2b\\tan\\beta$ changes.', set: { e: 0, betaDeg: 8, zoomTE: false } },
    { q: 'At what fraction of the chord is a symmetric section thickest?', a: 'A quarter: $x=-b$, from the maximum of $\\sin\\theta(1-\\cos\\theta)$ at $\\theta=120^\\circ$.', set: { e: 0.1, betaDeg: 0, t: 120, zoomTE: false } },

      { name: 'mu im', js: circle(1, 0.08, rad(4)).mu.im, py: 'np.imag(ch14.zhukhovsky_circle(1.0, 0.08, np.deg2rad(4.0))[0])', rtol: 1e-12 },
      { name: 'a', js: circle(1, 0.08, rad(4)).a, py: 'ch14.zhukhovsky_circle(1.0, 0.08, np.deg2rad(4.0))[1]', rtol: 1e-12 },
      { name: 'inverse e', js: fromCentre(circle(1, 0.12, rad(6)).mu, 1).e, py: 'ch14.zhukhovsky_circle_from_centre(ch14.zhukhovsky_circle(1.0, 0.12, np.deg2rad(6.0))[0], 1.0)[0]', rtol: 1e-10 },
      { name: 'inverse beta', js: fromCentre(circle(1, 0.12, rad(6)).mu, 1).beta, py: 'ch14.zhukhovsky_circle_from_centre(ch14.zhukhovsky_circle(1.0, 0.12, np.deg2rad(6.0))[0], 1.0)[1]', rtol: 1e-10 },
      { name: 'inverse a', js: fromCentre(cx.of(-0.2, 0.15), 1).a, py: 'ch14.zhukhovsky_circle_from_centre(-0.2+0.15j, 1.0)[2]', rtol: 1e-12 },
      { name: 'J re', js: J(cx.of(0.62, 0.95), 1).re, py: 'np.real(ch14.joukowski(0.62+0.95j, 1.0))', rtol: 1e-12 },
      { name: 'J im', js: J(cx.of(0.62, 0.95), 1).im, py: 'np.imag(ch14.joukowski(0.62+0.95j, 1.0))', rtol: 1e-12 },
      { name: 'map x', js: mapPoint(0.62, 0.95, 1).x, py: 'ch14.map_point(0.62, 0.95, 1.0)["x"]', rtol: 1e-12 },
      { name: 'map y', js: mapPoint(0.62, 0.95, 1).y, py: 'ch14.map_point(0.62, 0.95, 1.0)["y"]', rtol: 1e-12 },
      { name: 'map R', js: mapPoint(0.62, 0.95, 1).R, py: 'ch14.map_point(0.62, 0.95, 1.0)["R"]', rtol: 1e-12 },
      { name: 'map theta', js: mapPoint(0.62, 0.95, 1).theta, py: 'ch14.map_point(0.62, 0.95, 1.0)["theta"]', rtol: 1e-12 },
      { name: 'contour x[100]', js: c1.x[100], py: 'ch14.zhukhovsky_airfoil(1.0, 0.1, np.deg2rad(8.0), 400)["x"][100]', rtol: 1e-11 },
      { name: 'contour y[100]', js: c1.y[100], py: 'ch14.zhukhovsky_airfoil(1.0, 0.1, np.deg2rad(8.0), 400)["y"][100]', rtol: 1e-11 },
      { name: 'contour y[300]', js: c1.y[300], py: 'ch14.zhukhovsky_airfoil(1.0, 0.1, np.deg2rad(8.0), 400)["y"][300]', rtol: 1e-11 },
      { name: 't/c measured', js: M1.thickness_ratio, py: 'ch14.zhukhovsky_shape(1.0, 0.08, np.deg2rad(4.0))["thickness_ratio"]', rtol: 2e-3 },
      { name: 'camber/c measured', js: M1.camber_ratio, py: 'ch14.zhukhovsky_shape(1.0, 0.08, np.deg2rad(4.0))["camber_ratio"]', rtol: 2e-3 },
      { name: 'chord measured', js: M1.chord, py: 'ch14.zhukhovsky_shape(1.0, 0.08, np.deg2rad(4.0))["chord"]', rtol: 1e-6 },
      { name: 'x_tmax/c measured', js: M1.x_tmax_over_c, py: 'ch14.zhukhovsky_shape(1.0, 0.08, np.deg2rad(4.0))["x_tmax_over_c"]', rtol: 5e-3 },
      { name: 't/c measured (same n = 2000)', js: M1.thickness_ratio, py: 'ch14.zhukhovsky_shape(1.0, 0.08, np.deg2rad(4.0), n=2000)["thickness_ratio"]', rtol: 1e-8 },
      { name: 'camber measured (same n = 2000)', js: M1.camber, py: 'ch14.zhukhovsky_shape(1.0, 0.08, np.deg2rad(4.0), n=2000)["camber"]', rtol: 1e-8 },
      { name: 't/c measured, e = 0.25', js: M2.thickness_ratio, py: 'ch14.zhukhovsky_shape(1.0, 0.25, np.deg2rad(4.0))["thickness_ratio"]', rtol: 2e-3 },
      { name: 't/c measured, symmetric e = 0.1', js: M3.thickness_ratio, py: 'ch14.zhukhovsky_shape(1.0, 0.1, 0.0)["thickness_ratio"]', rtol: 2e-3 },
      { name: 'chord measured, symmetric e = 0.1', js: M3.chord, py: 'ch14.zhukhovsky_shape(1.0, 0.1, 0.0)["chord"]', rtol: 1e-6 },
      { name: 't/c rule', js: rules(1, 0.08, rad(4)).thickness_ratio, py: 'ch14.zhukhovsky_shape(1.0, 0.08, np.deg2rad(4.0), exact=False)["thickness_ratio"]', rtol: 1e-12 },
      { name: 'camber/c rule', js: rules(1, 0.08, rad(4)).camber_ratio, py: 'ch14.zhukhovsky_shape(1.0, 0.08, np.deg2rad(4.0), exact=False)["camber_ratio"]', rtol: 1e-12 },
      { name: 'coefficient 3*sqrt(3)/4 (computed, not typed)', js: K_RULE, py: 'ch14.zhukhovsky_shape(1.0, 0.001, 0.0, exact=False)["thickness_ratio"]/0.001', rtol: 1e-12 },

      { name: 'thickness gap at e = 0.25 puts the badge in "fat"', js: regime({ e: 0.25, betaDeg: 4 }) === 'fat' ? 1 : 0, expect: 1, atol: 0 }

  }
