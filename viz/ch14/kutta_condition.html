  if (!shortV) { Viz.text(ctx, 'ρUΓ now', xa, bot + 13, { size: 12, weight: 650, color: TE, align: 'center' }); Viz.text(ctx, 'Kutta', xb, bot + 13, { size: 12, weight: 650, color: MU, align: 'center' }); }
}
function edgeTitle(s) {
  const n = N(s);
  if (narrow()) return '<b>Speed near the tail</b>';
  return `<b>Speed just behind the tail</b> against Γ/Γ_K · <span class="c-blue">bold: 0.001 chord away = ${f3(n.q3)} U now</span> · faint: 10× and 100× closer · only at <span class="c-amber">Γ = Γ_K</span> does it stay finite · bars: <span class="c-teal">lift</span>`;
}

/* ---- status, notes ------------------------------------------------------------------------------------------------ */
function statusOf(s) {
  const n = N(s), sm = narrow();
  if (n.zero) return { text: sm ? '⚖️ zero lift: Γ_K = 0' : '⚖️ zero lift: the Kutta circulation is 0 — the stream points straight at B (α = −β)', tone: 'info' };
  if (n.isK) return { text: sm ? `✅ Kutta: leaves the edge at ${f3(n.teS)} U` : `✅ Kutta: flow leaves the edge smoothly at ${f3(n.teS)} U · Γ (clockwise) = ${f3(n.G)} U·b`, tone: 'good' };
  const side = n.upper ? 'upper' : 'lower';
  return { text: sm ? `⚠️ rest point on the ${side} side, ${pctTxt(n.pct)} % c ahead · edge speed unbounded` : `⚠️ rear stagnation point on the ${side} surface, ${pctTxt(n.pct)} % of chord ahead of the edge — edge speed unbounded`, tone: s.g < 1 ? 'warn' : 'bad' };
}
function interpText(s) {
  const n = N(s);
  if (n.zero) return `The stream points straight at B ($\\alpha=-\\beta$). No circulation is needed, $\\Gamma=4\\pi Ua\\sin(\\alpha+\\beta)=0$ (14.11), and there is no lift: this is the <b>zero-lift angle</b>. The slider does nothing here — every fraction of zero is zero. Threshold: exactly $\\alpha+\\beta=0$.`;
  const flip = n.GK < 0 ? ' (Here $\\alpha+\\beta<0$: the Kutta circulation is counterclockwise, $\\Gamma<0$, and the lift points down; "upper" and "lower" swap.)' : '';
  if (s.g < 0.995) return `<b>Too little circulation</b> ($\\Gamma/\\Gamma_K<0.995$). The rear stagnation point is on the ${n.upper ? 'upper' : 'lower'} surface, ${dg(Math.abs(n.off) * R2D)}° of arc from B on the circle and ${pctTxt(n.pct)} % of the chord ahead of the tail. Fluid from the other side must turn the sharp edge to reach it, at a speed that grows without limit toward the edge. A real fluid cannot: it sheds a vortex and the circulation rises (see the starting-vortex explainer).${flip}`;
  if (s.g > 1.005) return `<b>Too much</b> ($\\Gamma/\\Gamma_K>1.005$). The rear stagnation point has passed the tail and sits on the ${n.upper ? 'upper' : 'lower'} surface, ${pctTxt(n.pct)} % of the chord ahead of it: now the fluid must turn the edge the other way. Ideal flow allows it; it is not observed.${flip}`;
  return `<b>The Kutta value</b> ($0.995\\le\\Gamma/\\Gamma_K\\le1.005$). The stagnation point of the circle sits exactly on the point that becomes the tail. The infinite stretching of the map is cancelled and the air leaves both surfaces smoothly at ${f2(n.teS)} U. This is the circulation a wing holds.${flip}`;
}

    W.say(`<b>The book counts circulation clockwise: a wing with positive lift has $\\Gamma>0$.</b> Lengths are in units of $b$ (chord ≈ 4b) and speeds in units of $U$, so $\\Gamma$ is in $Ub$.`) +

  const qs = DIST.map(d => edgeSpeed(UU, BB, s.e, n.be, n.al, d, n.G)), qk = DIST.map(d => edgeSpeed(UU, BB, s.e, n.be, n.al, d, n.GK));

CL = ch14.zhukhovsky_lift_coefficient(

# exact for this thick section: {{CLx}}
CLx = ch14.zhukhovsky_lift_coefficient(
    alpha=al, beta=be, e={{e}}, exact=True)`,

      vz.clear(); vc.clear(); VW.z = VW.zeta = null;
      const okZ = vz.w >= 60 && vz.h >= 50, okC = vc.w >= 50 && vc.h >= 50;
      const Pz = okZ ? planePlot(vz, [-2.95, 2.95], vz.h < 175 ? [-0.95, 1.05] : isSmall(vz) ? [-1.3, 1.3] : [-1.7, 1.25], ['x / b', 'y / b']) : null;
      const Pc = okC ? planePlot(vc, [-2.3, 2.0], [-1.3, 1.62],['Re ζ / b', 'Im ζ / b']) : null;
      VW.z = Pz; VW.zeta = Pc;
      if (!Pz && !Pc) { drawEdge(g.view('edge'), s, n); return; }
      const lims = [Pz, Pc].filter(Boolean);
      const xl = [Math.min(...lims.map(P => P.xlim[0])) - 1, Math.max(...lims.map(P => P.xlim[1])) + 1];
      const yl = [Math.min(...lims.map(P => P.ylim[0])) - 1, Math.max(...lims.map(P => P.ylim[1])) + 1];
      const smallAll = (Pz ? isSmall(vz) : true), nx = smallAll ? 110 : 160, ny = Math.max(50, Math.min(170, Math.round(nx * (yl[1] - yl[0]) / (xl[1] - xl[0]))));
      const net = netFor('main', n.F, xl, yl, nx, ny, smallAll ? 0.32 : 0.25);
      if (Pz) PT.ext = { x0: Pz.xlim[0], x1: Pz.xlim[1], yh: Math.max(-Pz.ylim[0], Pz.ylim[1]) };
      if (s.flow) ensureParticles(n, smallAll ? { NL: 8, M: 5 } : { NL: 12, M: 7 });
      if (Pz) {
        drawZ(vz, s, n, Pz, net, g.app);
        if (!isSmall(vz) && vz.w >= 430 && vz.h >= 215) drawTail(vz, s, n, Pz);
        if (HOLD.g === 1 && g.app && g.app.playing && !n.zero) Viz.card(vz.ctx, Pz.px.x + Math.min(0.3 * Pz.px.w, 200), Pz.px.y + Pz.px.h - 30, [`Γ = Γ_K = ${f3(n.GK)} U·b`, `the flow leaves the tail smoothly at ${f2(n.teS)} U · C_L = ${f3(n.CLex)}`], { color: Viz.color('teal'), maxWidth: Math.max(150, Math.min(0.56 * Pz.px.w, 380)) });
      }
      if (Pc) drawZeta(vc, s, n, Pc, net);
      drawEdge(g.view('edge'), s, n);
    },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel' || ev.type === 'pointerleave') { const was = !!DRAG; DRAG = null; return was; }
      const X = v.pointer.x, Y = v.pointer.y, n = N(s);
      if (ev.viewId === 'zeta' && VW.zeta && !n.zero) {
        const P = VW.zeta;
        if (ev.type === 'pointerdown') { if (!P.inside(X, Y)) return false; DRAG = 'zeta'; }
        else if (ev.type !== 'pointermove' || DRAG !== 'zeta') return false;
        const th = Math.atan2(P.iy(Y) - n.mu.im, P.ix(X) - n.mu.re) - n.al;
        if (Math.cos(th) <= 0.05) return false;
        g.app.play(false);
        g.app.set({ g: Math.round(Math.max(0, Math.min(1.5, -Math.sin(th) / Math.sin(n.al + n.be))) * 100) / 100 }); return true;
      }
      if (ev.viewId === 'edge' && VW.edge) {
        const P = VW.edge;
        if (ev.type === 'pointerdown') { if (!P.inside(X, Y)) return false; DRAG = 'edge'; }
        else if (ev.type !== 'pointermove' || DRAG !== 'edge') return false;
        g.app.play(false);
        g.app.set({ g: Math.round(Math.max(0, Math.min(1.5, P.ix(X))) * 100) / 100 }); return true;
      }
      return false;
    }
  },
  explore: {
    intro: 'Drag the slider under the picture (or the amber dot on the circle) to change the circulation; ▶ from below 1 runs the start-up to the Kutta value (above 1 it only moves the particles). Then change the angle of attack and the camber.',
    controls: ['alphaDeg', 'betaDeg', 'snap', 'e', 'flow'],
    readouts: ['G', 'GK', 'edge', 'CL', 'ab', 'rear'],
    callouts: [{ kind: 'try', html: 'Set $\\alpha=-\\beta$ (preset <b>zero-lift angle</b>): the stream points straight at B, $\\Gamma_K=0$ and the lift arrow vanishes.' }]
  },
  explain: {
    html: s => explainHtml(s),
    live: s => { const n = N(s); return { q: f3(n.q3), g: s.g.toFixed(2), G: f3(n.G) }; }
  },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange: (s, key, a) => { if (key === 'g' && !a._fromLoop) HOLD.g = null; }
};
const app = Viz.app(CFG);
CUR = app.state;
</script>
