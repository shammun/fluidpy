function pyPars(s) {
  const n = pyNum(s.nu);
  switch (s.sol) {
    case 'couette': return 'dict(U=1.0, h=1e-3, nu=' + n + ')';
    case 'poiseuille': return 'dict(G=100.0, h=1e-3, nu=' + n + (s.grav ? ', g=9.81' : '') + ')';
    case 'stokes_first': return 'dict(U=1.0, nu=' + n + ')';
    case 'taylor_green': return 'dict(U0=1.0, k=6.283185307179586, nu=' + n + ')';
    case 'lamb_oseen': return 'dict(Gamma=1e-3, t0=1.0, nu=' + n + ')';
    case 'cylinder': return 'dict(U=1.0, a=1.0, nu=' + n + ')';
    case 'solid_body': return 'dict(Omega=1.0, nu=' + n + ')';
    default: return '{}  # the toy field is JS only';
  }
}
function probeLabel(m) { return fL(m.pr.x) + ', ' + fL(m.pr.y); }
function setProbe(app, s, P, px, py) {
  const m = model(s), b = m.b, f = m.lu.f, X = P.ix(px) / f, Y = P.iy(py) / f;
  if (m.one) app.set({ py: clamp((Y - b.y0) / (b.y1 - b.y0), 0.004, 0.996) });
  else app.set({ px: clamp((X - b.x0) / (b.x1 - b.x0), -1, 2), py: clamp((Y - b.y0) / (b.y1 - b.y0), -1, 2) });
}
