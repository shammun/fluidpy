  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }

.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

.viz-der-line { display: block; min-width: 0; border-radius: 8px; padding: 2px 6px; }

.viz-der-chain { display: flex; align-items: center; gap: 6px; }

.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }
.viz-der-chain .viz-eq-body { font-size: 14px; }

.viz-der-block ol { margin: 2px 0 0 18px; padding: 0; } .viz-der-block li { margin: 0 0 2px; }

.viz-der-why { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }

.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.viz-der-pick { flex-wrap: wrap; }
.viz-app[data-dense="2"] .viz-der-block, .viz-app[data-dense="3"] .viz-der-block { font-size: 13px; line-height: 1.4; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-stage { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-side { flex: 1 1 auto; }

.c-accent { color: var(--viz-accent); font-weight: 650; } .c-teal { color: var(--viz-teal); font-weight: 650; }

/* ---- wake (Ex. 4.1) ---- */

/* ---- jet on a plate (our extension of (4.17)) ---- */

/* ---- rocket (Ex. 4.4), constant ṁ, F_S = 0, from rest ---- */

/* ---- one budget object for every mode ---- */

  if (s.mode === 'rocket') { const r = rocketState(t, rkP(s)); return kind === 'mass' ? r.M : r.M * r.b; }
  if (s.mode === 'balloon') { const B = balloonBox(s.box, t); return BL.rho0 / (1 + BL.a * t) * (B.x1 - B.x0); }
  return 0;                                                                   // wake, jet: steady
}
function wkP(s) { return { U: WK.U, D: s.deficit, b: WK.b, rho: WK.rho, H: s.H }; }

  if (BC.key === key) return BC.v;
  const kind = s.mode === 'balloon' ? 'mass' : s.budget === 'mass' ? 'mass' : 'mom';
  let R;
  if (s.mode === 'wake') { R = wakeBudget(wkP(s)); R.result = R.FD; }
  else if (s.mode === 'bore') { const q = boreGeom(s, s.t); R = boreBudget({ hin: BR.hin, hout: q.hout, b: s.b, rho: BR.rho, where: q.where }); R.geom = q; R.result = R.U; }
  else if (s.mode === 'jet') { R = jetBudget({ rho: JT.rho, V: JT.V, A: JT.A, th: s.theta * Math.PI / 180 }); R.result = R.F; }
  else if (s.mode === 'rocket') { R = rocketBudget(rkP(s)); R.result = R.r.b; }

  R.bodyK = kind === 'mass' ? 0 : R.body; R.surfK = kind === 'mass' ? 0 : R.surf;
  R.lhs = R.stor + R.out; R.rhs = R.bodyK + R.surfK; R.res = R.lhs - R.rhs;
  R.resM = R.sm + R.faces.reduce((a, f) => a + f.m, 0);

}
function resultText(s, B) {

  if (s.mode === 'bore') return { lab: 'U', v: B.U, u: 'm/s', tex: 'U' };
  if (s.mode === 'jet') return { lab: 'F', v: B.F, u: 'N', tex: 'F' };

/* ---- number formatting: 4 significant figures, minus sign, round-off → 0 ---- */
function f4(v, sig) { if (!isFinite(v)) return '—'; if (Math.abs(v) < 1e-9) v = 0; return Viz.fmt(v, { sig: sig || 4 }); }

const BOXNAME = { fixed: 'fixed', sliding: 'sliding at 1 m/s', material: 'material (b = u)' };

/* ---------------------------------------------------------------------------------------------------
   DRAWING
   --------------------------------------------------------------------------------------------------- */
let sceneP = null, resultP = null, sceneFaces = [], dragH = false;
function C() { return { in: Viz.color('blue'), out: Viz.color('orange'), st: Viz.color('accent'), f: Viz.color('rose'), g: Viz.color('muted'), text: Viz.color('text'), teal: Viz.color('teal'), amber: Viz.color('amber'), card: Viz.color('card') }; }
function pxArrow(ctx, x0, y0, x1, y1, color, width, head) {
  const L = Math.hypot(x1 - x0, y1 - y0); if (L < 1) return;
  const hd = Math.min(head || 8, L * 0.6), ang = Math.atan2(y1 - y0, x1 - x0);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width || 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - hd * 0.7 * Math.cos(ang), y1 - hd * 0.7 * Math.sin(ang)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - hd * Math.cos(ang - 0.42), y1 - hd * Math.sin(ang - 0.42));
  ctx.lineTo(x1 - hd * Math.cos(ang + 0.42), y1 - hd * Math.sin(ang + 0.42)); ctx.closePath(); ctx.fill(); ctx.restore();

  opt = opt || {}; const c = C(), mx = Math.max(1e-12, ...B.faces.map(f => Math.abs(f.m))), pk = probeOf(s);
  faces.forEach(F => {
    const f = B.faces.find(q => q.id === F.id); if (!f) return;
    if (pk === F.id) { ctx.save(); ctx.strokeStyle = Viz.color('accent'); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(F.X, F.Y, 11, 0, 2 * Math.PI); ctx.stroke(); ctx.restore(); }
    if (F.noArrow || Math.abs(f.m) < 1e-9 * mx || Math.abs(f.m) < 1e-12) return;
    const L = (opt.min || 14) + (opt.span || 34) * Math.abs(f.m) / mx;

  ctx.fillStyle = Viz.alpha(color, 0.22); ctx.fillRect(x, y, w, h);

  ctx.stroke(); ctx.restore();
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.5, y + 0.5, Math.max(1, w - 1), Math.max(1, h - 1)); ctx.restore();
}

/* ---- the scene: wake ---- */
function drawWake(v, s, app) {
  const ctx = v.ctx, c = C(), B = budget(s), p = wkP(s), small = v.w < 420;
  const P = v.plot({ xlim: [-0.5, 3], ylim: [-1.1, 1.1], xlabel: 'x [m]', ylabel: small ? '' : 'y [m]' });
  P.axes({ xticks: Viz.num.niceTicks(-0.5, 3, Math.max(2, Math.round(P.px.w / 90))).filter(x => x > -0.45 && x < 2.95), yticks: small ? [-1, 0, 1] : [-1, -0.5, 0, 0.5, 1] });
  sceneP = P;
  P.clip(() => {
    // the wake: a band shaded by the velocity deficit
    const g = ctx.createLinearGradient(0, P.Y(0.3), 0, P.Y(-0.3)), a = 0.08 + 0.3 * s.deficit / 5;
    g.addColorStop(0, Viz.alpha(c.in, 0)); g.addColorStop(0.5, Viz.alpha(c.in, a)); g.addColorStop(1, Viz.alpha(c.in, 0));
    ctx.fillStyle = g; ctx.fillRect(P.X(0.03), P.Y(0.3), P.X(3) - P.X(0.03), P.Y(-0.3) - P.Y(0.3));
    // tracers: U∞ upstream, U(y) behind the bar (slow parcels bunch up)
    const ys = [-1, -0.8, -0.6, -0.4, -0.25, -0.15, -0.06, 0.06, 0.15, 0.25, 0.4, 0.6, 0.8, 1], ds = 0.3;
    ys.forEach((y, j) => {
      const r = wakeU(y, p) / WK.U, Ls = Math.ceil((0.5 + 3.2 / r) / ds) * ds;
      for (let k = 0; k * ds < Ls; k++) {
        let sgm = (k * ds + WK.U * s.t + 0.13 * j) % Ls;
        const x = sgm < 0.5 ? sgm - 0.5 : (sgm - 0.5) * r;
        P.dot(x, y, 2.4, { color: Viz.alpha(c.text, 0.45) });
      }
    });
    // velocity profiles at the inlet (uniform, blue) and outlet (U(y), orange): arrows ∝ speed
    const k = 0.028, yy = Viz.num.linspace(-1.05, 1.05, 11);
    yy.forEach(y => { P.arrow(WK.xin - k * WK.U, y, k * WK.U, 0, { color: Viz.alpha(c.in, 0.8), width: 1.6, head: 6 }); });
    yy.forEach(y => { P.arrow(WK.xout, y, k * wakeU(y, p), 0, { color: Viz.alpha(c.out, 0.8), width: 1.6, head: 6 }); });
    P.fn(y => 0, { color: 'rgba(0,0,0,0)' });
    const yl = Viz.num.linspace(-1.1, 1.1, 120);
    P.line(yl.map(y => WK.xout + k * wakeU(y, p)), yl, { color: c.out, width: 2 });
    // the bar
    ctx.save(); ctx.fillStyle = c.text; ctx.fillRect(P.X(0) - 5, P.Y(0) - 6, 10, 12); ctx.restore();
  });
  // the control volume
  const X0 = P.X(WK.xin), X1 = P.X(WK.xout), Yt = P.Y(Math.min(s.H / 2, 1.1)), Yb = P.Y(-Math.min(s.H / 2, 1.1));
  dashRectPx(ctx, X0, Yt, X1 - X0, Yb - Yt, c.text, 2);
  // side leakage arrows (top up, bottom down), and face anchors
  const xm = (WK.xin + WK.xout) / 2;
  sceneFaces = [
    { id: 'in', X: X0, Y: (Yt + Yb) / 2, nx: -1, ny: 0, noArrow: true },
    { id: 'out', X: X1, Y: (Yt + Yb) / 2, nx: 1, ny: 0, noArrow: true },
    { id: 'top', X: P.X(xm), Y: Yt, nx: 0, ny: -1 },
    { id: 'bot', X: P.X(xm), Y: Yb, nx: 0, ny: 1 }];
  fluxArrows(ctx, sceneFaces, B, s, { min: 14, span: 0 });
  // forces: rose on the fluid (−F_D), dark on the bar (+F_D)
  const Lf = 0.12 * B.FD;
  if (Lf > 0.01) {
    P.arrow(0, -0.14, -Lf, 0, { color: c.f, width: 3, head: 9 });
    P.arrow(0, 0.14, Lf, 0, { color: c.text, width: 3, head: 9 });
  }
  if (!small) {
    Viz.text(ctx, '← on the fluid −F_D/l', P.X(0) + 9, P.Y(-0.14), { size: 12, color: c.f, bg: true });
    Viz.text(ctx, 'on the bar +F_D/l', P.X(Lf) + 6, P.Y(0.14), { size: 12, color: c.text, bg: true });
    Viz.text(ctx, 'inlet: U∞ = 10 m/s', X0 + 4, P.Y(-1.02), { size: 12, color: c.in, bg: true });
    Viz.text(ctx, 'outlet: U(y)', X1 - 4, P.Y(-1.02), { size: 12, color: c.out, align: 'right', bg: true });
  }
  if (s.H < 3 * WK.b) Viz.text(ctx, '⚠ the box cuts the wake', P.X(1.1), P.Y(0.75), { size: 12.5, color: c.f, align: 'center', bg: true });
}

/* ---- the scene: bore ---- */
function boreParcel(X0, t, q) {
  if (X0 >= 0) return X0 + q.Uo * t;                                        // deep water from the start
  const ts = -X0 / q.U;                                                     // the front reaches it at t*
  return t <= ts ? X0 : X0 + q.Uo * (t - ts);
}
function drawBore(v, s, app) {
  const ctx = v.ctx, c = C(), B = budget(s), q = B.geom, small = v.w < 420;
  const zTop = Math.max(1.8, q.hout + 0.72);
  const P = v.plot({ xlim: [q.xc - 6.3, q.xc + 6.3], ylim: [0, zTop], xlabel: 'x [m] (lab frame)', ylabel: small ? '' : 'z [m]' });
  P.axes({ yticks: small ? [0, 1] : Viz.num.niceTicks(0, zTop, 3) });
  sceneP = P;
  const h = x => BR.hin + (q.hout - BR.hin) * 0.5 * (1 + Math.tanh((x - q.xf) / 0.12));
  P.clip(() => {
    const xs = Viz.num.linspace(P.xlim[0], P.xlim[1], 200);
    P.fillBetween(xs, xs.map(h), 0, { color: c.in, alpha: 0.16 });
    P.line(xs, xs.map(h), { color: c.in, width: 2.2 });
    // parcels: still ones stay put; the front sets them moving at U_out (to the left)
    for (let X0 = -24; X0 <= 16; X0 += 0.6) {
      const x = boreParcel(X0, s.t, q);
      if (x < P.xlim[0] - 0.1 || x > P.xlim[1] + 0.1) continue;
      [0.2, 0.45, 0.7, 0.9].forEach(f => P.dot(x, f * h(x), 2.4, { color: Viz.alpha(c.text, 0.5) }));
    }
  });
  // the front and its speed
  const Yw = P.Y(q.hout + 0.5);
  if (q.xf > P.xlim[0] && q.xf < P.xlim[1]) {
    pxArrow(ctx, P.X(q.xf), Yw, P.X(q.xf) - 34, Yw, c.teal, 2.6, 8);
    Viz.text(ctx, small ? 'U' : 'wave U = ' + f4(q.U, 3) + ' m/s', P.X(q.xf) - 38, Yw, { size: 12, color: c.teal, align: 'right', bg: true });
  }
  // the box, its velocity (−b), the hydrostatic pushes
  const XL = P.X(q.xL), XR = P.X(q.xR), Yt = P.Y(q.hout + 0.12), Yb = P.Y(0);
  dashRectPx(ctx, XL, Yt, XR - XL, Yb - Yt, c.text, 2);
  const Yb2 = Yt - 11;
  if (Math.abs(s.b) > 1e-6) {
    const L = Math.min(40, 8 * Math.abs(s.b)), xa = XL + 6;
    if (s.b > 0) pxArrow(ctx, xa + L, Yb2, xa, Yb2, c.st, 2.4, 7); else pxArrow(ctx, xa, Yb2, xa + L, Yb2, c.st, 2.4, 7);
    if (!small) Viz.text(ctx, 'box velocity −b, b = ' + f4(s.b, 3) + ' m/s', xa + L + 6, Yb2, { size: 12, color: c.st, bg: true });
  } else if (!small) Viz.text(ctx, 'box fixed (b = 0)', XL + 6, Yb2, { size: 12, color: c.st, bg: true });
  const hL = B.faces[0].h, hR = B.faces[1].h, pmax = BR.rho * G * zTop, wmax = 0.12 * (XR - XL);
  [[XL, hL, 1], [XR, hR, -1]].forEach(([X, hh, sg]) => {
    ctx.save(); ctx.fillStyle = Viz.alpha(c.f, 0.22); ctx.beginPath(); ctx.moveTo(X, P.Y(hh)); ctx.lineTo(X, Yb); ctx.lineTo(X + sg * wmax * BR.rho * G * hh / pmax, Yb); ctx.closePath(); ctx.fill(); ctx.restore();
  });
  sceneFaces = [
    { id: 'left', X: XL, Y: P.Y(hL * 0.5), nx: -1, ny: 0 },
    { id: 'right', X: XR, Y: P.Y(hR * 0.5), nx: 1, ny: 0 }];
  fluxArrows(ctx, sceneFaces, B, s, { min: 14, span: 30 });
  // net pressure force on the fluid (rose)
  if (Math.abs(B.surf) > 1e-6) {
    const Xc = (XL + XR) / 2, Yc = P.Y(0.3 * BR.hin), L = 42;
    pxArrow(ctx, Xc, Yc, Xc + Math.sign(B.surf) * L, Yc, c.f, 3, 9);
    if (!small) Viz.text(ctx, 'net push ' + f4(B.surf, 4) + ' N/m', Xc, Yc - 14, { size: 12, color: c.f, align: 'center', bg: true });
  }
  if (q.where !== 'inside') Viz.text(ctx, q.where === 'deep' ? 'the front has left through the left face' : 'the front has left through the right face', (XL + XR) / 2, P.Y(zTop) + 12, { size: 12, color: c.text, align: 'center', bg: true, maxWidth: v.w - 20 });
}

/* ---- the scene: jet on a plate ---- */
function drawJet(v, s, app) {
  const ctx = v.ctx, c = C(), B = budget(s), th = s.theta * Math.PI / 180, small = v.w < 420;
  const P = v.plot({ xlim: [-9, 6], ylim: [-5.5, 5.5], equal: true, xlabel: 'x [cm]', ylabel: small ? '' : 'y [cm]' });
  P.axes({ grid: false });
  sceneP = P;
  const d = 2 * Math.sqrt(JT.A / Math.PI) * 100, d1 = d * (1 + Math.cos(th)) / 2, d2 = d * (1 - Math.cos(th)) / 2;
  const pv = [Math.cos(th), Math.sin(th)], nv = [Math.sin(th), -Math.cos(th)];   // along the plate · normal into it
  const pt = (a, b) => [a * pv[0] + b * nv[0], a * pv[1] + b * nv[1]];
  const xn = Math.max(P.xlim[0] + 1.3, -16);                                   // the nozzle exit
  P.clip(() => {
    const cot = Math.cos(th) / Math.sin(th);
    ctx.save(); ctx.fillStyle = Viz.alpha(c.in, 0.28); ctx.beginPath();
    [[xn, -d / 2], [-d / 2 * cot, -d / 2], [d / 2 * cot, d / 2], [xn, d / 2]].forEach((q, i) => i ? ctx.lineTo(P.X(q[0]), P.Y(q[1])) : ctx.moveTo(P.X(q[0]), P.Y(q[1])));
    ctx.closePath(); ctx.fill();
    [[1, d1], [-1, d2]].forEach(([sg, dd]) => {
      ctx.beginPath(); [pt(0, 0), pt(sg * 8, 0), pt(sg * 8, -dd), pt(0, -dd)].forEach((q, i) => i ? ctx.lineTo(P.X(q[0]), P.Y(q[1])) : ctx.moveTo(P.X(q[0]), P.Y(q[1])));
      ctx.closePath(); ctx.fill();
    });
    ctx.restore();
    // parcels: along the jet, then along a sheet (the split follows (1 ± cos θ)/2)
    const Lj = -xn, Ls = 7, tot = Lj + Ls, share = (1 + Math.cos(th)) / 2;
    ctx.fillStyle = Viz.alpha(c.g, 0.8); ctx.fillRect(P.X(xn - 1.2), P.Y(d), P.X(xn) - P.X(xn - 1.2), P.Y(-d) - P.Y(d));
    for (let k = 0; k * 0.4 < tot; k++) {
      const sg = (k * 0.4 + JT.V * 100 * s.t) % tot, lane = ((k * 0.618) % 1) - 0.5;
      if (sg < Lj) { P.dot(-Lj + sg, lane * d * 0.7, 2.3, { color: Viz.alpha(c.text, 0.55) }); continue; }
      const one = ((k * 0.381) % 1) < share, dd = one ? d1 : d2, q = pt((one ? 1 : -1) * (sg - Lj), -(0.5 + 0.7 * lane) * dd);
      if (dd > 0.02) P.dot(q[0], q[1], 2.3, { color: Viz.alpha(c.text, 0.55) });
    }
    // the plate
    const a = pt(-5.5, 0.18), b = pt(5.5, 0.18);
    ctx.save(); ctx.strokeStyle = c.text; ctx.lineWidth = 6; ctx.lineCap = 'butt'; ctx.beginPath(); ctx.moveTo(P.X(a[0]), P.Y(a[1])); ctx.lineTo(P.X(b[0]), P.Y(b[1])); ctx.stroke(); ctx.restore();
  });
  // the control volume: a dashed circle of radius 3.5 cm around the impact point
  const R = 3.5, Rp = P.sx(R);
  ctx.save(); ctx.strokeStyle = c.text; ctx.lineWidth = 2; ctx.setLineDash([7, 5]); ctx.beginPath(); ctx.arc(P.X(0), P.Y(0), Rp, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
  const q1 = pt(R, -d1 / 2), q2 = pt(-R, -d2 / 2);
  sceneFaces = [
    { id: 'jet', X: P.X(-R), Y: P.Y(0), nx: -1, ny: 0 },
    { id: 's1', X: P.X(q1[0]), Y: P.Y(q1[1]), nx: pv[0], ny: -pv[1] },
    { id: 's2', X: P.X(q2[0]), Y: P.Y(q2[1]), nx: -pv[0], ny: pv[1] }];
  fluxArrows(ctx, sceneFaces, B, s, { min: 14, span: 30 });
  // forces along the plate normal: rose on the fluid, dark on the plate
  const Lf = 0.3 * B.F, o = pt(0, -0.9), ob = pt(0, 0.6);
  if (Lf > 0.05) {
    P.arrow(o[0], o[1], -Lf * nv[0], -Lf * nv[1], { color: c.f, width: 3, head: 9 });
    P.arrow(ob[0], ob[1], Lf * nv[0], Lf * nv[1], { color: c.text, width: 3, head: 9 });
  }
  if (!small) {
    const e = pt(0, 0.6 + Lf);
    Viz.text(ctx, 'on the plate ' + f4(B.F, 3) + ' N', P.X(e[0]) + 6, P.Y(e[1]) + 14, { size: 12, color: c.text, bg: true });
    Viz.text(ctx, 'jet V = 10 m/s, A = 1 cm²', P.X(xn - 1.2), P.Y(-1.6), { size: 12, color: c.in, bg: true });
  }
}

/* ---- the scene: rocket ---- */
function drawRocket(v, s, app) {
  const ctx = v.ctx, c = C(), B = budget(s), p = rkP(s), r = B.r, small = v.w < 420;
  const zEnd = rocketState(RK.tb - 1e-9, p).z, zMax = zEnd * 1.12 + 120;
  const P = v.plot({ xlim: [-1, 1], ylim: [-0.04 * zMax, zMax], xlabel: '', ylabel: small ? '' : 'altitude z [m]', pad: { b: 12 } });
  P.axes({ zeroLines: false, xticks: [], yticks: Viz.num.niceTicks(0, zMax, Math.max(2, Math.round(P.px.h / 55))) });
  sceneP = P;
  const X = P.X(-0.25), Y = P.Y(r.z);
  P.clip(() => {
    ctx.save(); ctx.fillStyle = Viz.alpha(c.g, 0.35); ctx.fillRect(P.px.x, P.Y(0), P.px.w, P.px.y + P.px.h - P.Y(0)); ctx.restore();
    // the flight so far: a dot every second
    for (let k = 0; k <= Math.floor(p.t); k++) P.dot(-0.25, rocketState(k, p).z, 2.4, { color: Viz.alpha(c.teal, 0.6) });
    // plume
    if (p.t < RK.tb) {
      ctx.save(); const L = 16 + 10 * Math.min(1, s.Ve / 1500); ctx.fillStyle = Viz.alpha(c.amber, 0.85); ctx.beginPath();
      ctx.moveTo(X - 5, Y + 2); ctx.lineTo(X + 5, Y + 2); ctx.lineTo(X, Y + 2 + L); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    // the rocket (pixel sized)
    ctx.save(); ctx.fillStyle = c.text; ctx.beginPath(); ctx.moveTo(X - 6, Y); ctx.lineTo(X + 6, Y); ctx.lineTo(X + 6, Y - 26); ctx.lineTo(X, Y - 36); ctx.lineTo(X - 6, Y - 26); ctx.closePath(); ctx.fill(); ctx.restore();
  });
  // the control volume rides with the rocket
  dashRectPx(ctx, X - 15, Y - 44, 30, 46, c.text, 2);
  sceneFaces = [{ id: 'noz', X: X, Y: Y + 2, nx: 0, ny: 1 }];
  fluxArrows(ctx, sceneFaces, B, s, { min: 26, span: 0 });
  // velocity and gravity
  pxArrow(ctx, X + 26, Y - 12, X + 26, Y - 12 - Math.min(40, 8 + 32 * r.b / 1000), c.teal, 2.6, 8);
  pxArrow(ctx, X - 26, Y - 30, X - 26, Y - 8, c.g, 2.6, 8);
  const lines = [['b = ' + f4(r.b, 4) + ' m/s', c.teal], ['M = ' + f4(r.M, 3) + ' kg', c.text], ['thrust V_e ṁ = ' + f4(s.Ve * RK.mdot, 3) + ' N', c.out], ['weight Mg = ' + f4(r.M * G, 3) + ' N', c.g]];
  const x0 = P.X(0.15), y0 = P.px.y + 12;
  (small ? lines.slice(0, 2) : lines).forEach((L, i) => Viz.text(ctx, L[0], x0, y0 + i * 18, { size: 12, color: L[1], bg: true }));
}

/* ---- the scene: the balloon (1-D expanding flow) ---- */
function drawBalloon(v, s, app) {
  const ctx = v.ctx, c = C(), B = budget(s), t = s.t, sc = 1 + BL.a * t, rho = BL.rho0 / sc, small = v.w < 420;
  const P = v.plot({ xlim: [0, 6.2], ylim: [-1.05, 1.1], xlabel: 'x [m]', ylabel: '' });
  P.axes({ yticks: [], grid: false });
  sceneP = P;
  P.clip(() => {
    ctx.save(); ctx.fillStyle = Viz.alpha(c.in, 0.07 + 0.3 * rho); ctx.fillRect(P.X(0), P.Y(0.3), P.X(6.2) - P.X(0), P.Y(-0.3) - P.Y(0.3)); ctx.restore();
    for (let X = 0.25; X * sc <= 6.3; X += 0.25) [-0.15, 0, 0.15].forEach(y => P.dot(X * sc, y, 2.4, { color: Viz.alpha(c.text, 0.55) }));
    for (let x = 1; x <= 6; x += 1) P.arrow(x, 0.62, 0.3 * BL.a * x / sc, 0, { color: c.teal, width: 2, head: 7 });
    // the material interval: the particles that filled [1, 2] m at t = 0
    const m0 = BL.X0 * sc, m1 = BL.X1 * sc;
    P.line([m0, m0, m1, m1], [-0.52, -0.6, -0.6, -0.52], { color: c.teal, width: 2.6 });
  });
  if (!small) Viz.text(ctx, 'u = ax/(1 + at)', P.X(6.1), P.Y(0.9), { size: 12, color: c.teal, align: 'right', bg: true });
  Viz.text(ctx, small ? 'material' : 'material: same particles', P.X(BL.X0 * sc), P.Y(-0.78), { size: 12, color: c.teal, bg: true });
  Viz.text(ctx, 'ρ = ' + f4(rho, 3) + ' kg/m³', P.X(0.1), P.Y(0.9), { size: 12, color: c.text, bg: true });
  const bx = B.box, X0 = P.X(bx.x0), X1 = P.X(bx.x1), Yt = P.Y(0.4), Yb = P.Y(-0.4);
  dashRectPx(ctx, X0, Yt, X1 - X0, Yb - Yt, s.box === 'material' ? c.teal : c.text, 2.2);
  if (s.mark === 'both') Viz.text(ctx, t < 1e-9 ? 'V*(t) = V(t) right now' : 'V* and V have parted', (X0 + X1) / 2, Yt - 12, { size: 12, color: c.st, align: 'center', bg: true });
  // the walls' own speeds
  [[X0, bx.d0], [X1, bx.d1]].forEach(([X, d]) => { if (Math.abs(d) > 1e-9) pxArrow(ctx, X, Yb + 10, X + P.sx(0.3 * d), Yb + 10, c.g, 2, 7); });
  sceneFaces = [
    { id: 'left', X: X0, Y: P.Y(0), nx: -1, ny: 0 },
    { id: 'right', X: X1, Y: P.Y(0), nx: 1, ny: 0 }];
  fluxArrows(ctx, sceneFaces, B, s, { min: 14, span: 26 });
  if (B.faces.every(f => Math.abs(f.m) < 1e-12)) Viz.text(ctx, 'nothing crosses', (X0 + X1) / 2, P.Y(0.85), { size: 12, color: c.teal, align: 'center', bg: true });
}

function drawScene(g, s) {
  const v = g.view('scene'); v.clear();
  const app = g.app;
  if (s.mode === 'wake') drawWake(v, s, app);
  else if (s.mode === 'bore') drawBore(v, s, app);
  else if (s.mode === 'jet') drawJet(v, s, app);
  else if (s.mode === 'rocket') drawRocket(v, s, app);
  else drawBalloon(v, s, app);
  if (app && app.holding) {
    const B = budget(s);
    const card = s.mode === 'bore' ? (Math.abs(s.b - B.U) < 0.01 ? ['The box rode with the front:', 'every frame the same budget — steady.'] : ['The front moved through the box:', 'storage ≠ 0 while it was inside.'])
      : s.mode === 'rocket' ? ['Burn-out at M = 1 kg:', 'b = ' + f4(rocketDV(RK.M0, RK.M0 - RK.mdot * RK.tb, s.Ve), 4) + ' − ' + f4(G * RK.tb, 3) + ' = ' + f4(B.r.b, 4) + ' m/s.']
      : s.mode === 'balloon' ? ['Mass in the ' + s.box + ' box:', f4(balloonBudget(s.box, 0).mass, 4) + ' → ' + f4(B.mass, 4) + ' kg/m².']
      : ['Steady flow: the budget is the same', 'at every instant (storage 0).'];
    Viz.card(v.ctx, v.w / 2, Math.min(v.h * 0.3, 60), card, { color: Viz.color('accent') });
  }
}

/* ---- the budget bars (waterfall-free: every term from zero, then the balance) ---- */
function drawBars(g, s) {
  const v = g.view('bars'); v.clear();
  const ctx = v.ctx, c = C(), B = budget(s), kind = B.kind, W = v.w, H = v.h;
  const A = [{ lab: 'stor', v: B.stor, col: c.st, meas: B.meas, tag: 'a' }].concat(B.faces.map(f => ({ lab: f.short, v: kind === 'mass' ? f.m : f.p, col: f.m >= 0 ? c.out : c.in, tag: 'b', id: f.id })));
  const nA = A.length, nB = 3, split = Math.round(W * (nA + 0.9) / (nA + nB + 1.8));
  const coinc = s.mark === 'coinc', pk = probeOf(s);
  const panel = (x, w, items, ttl) => {
    let m = 0; items.forEach(it => { m = Math.max(m, Math.abs(it.v), Math.abs(it.lo || 0), Math.abs(it.hi || 0), Math.abs(it.meas || 0)); });
    m = m > 1e-12 ? m * 1.22 : 1;
    const P = v.plot({ rect: { x, y: 0, w, h: H }, pad: { l: W < 420 ? 38 : 50, r: 6, t: 18, b: 22 }, xlim: [0, items.length], ylim: [-m, m] });
    P.axes({ xticks: [], yticks: P.px.h < 70 ? [0] : Viz.num.niceTicks(-m * 0.85, m * 0.85, Math.max(2, Math.round(P.px.h / 40))) });
    const cw = P.px.w / items.length, bw = Math.min(46, cw * 0.62);
    if (P.px.h < 70) Viz.text(ctx, '±' + f4(m / 1.22, 3), P.px.x + 3, P.px.y + 8, { size: 12, color: Viz.color('text-soft'), bg: true });
    items.forEach((it, i) => {
      const Xc = P.X(i + 0.5), x0 = Xc - bw / 2;
      if (it.stack) {
        let base = 0; it.stack.forEach(q => { const y0 = P.Y(base), y1 = P.Y(base + q.v); if (Math.abs(y1 - y0) >= 0.5) { if (q.v < 0) hatchRect(ctx, x0, y0, bw, y1 - y0, q.col); else { ctx.fillStyle = Viz.alpha(q.col, 0.85); ctx.fillRect(x0, Math.min(y0, y1), bw, Math.abs(y1 - y0)); } } base += q.v; });
      } else {
        const y0 = P.Y(0), y1 = P.Y(it.v);
        if (Math.abs(y1 - y0) < 1.5) { ctx.fillStyle = it.col; ctx.fillRect(x0, y0 - 1, bw, 2); }
        else if (it.v < 0) hatchRect(ctx, x0, y0, bw, y1 - y0, it.col);
        else { ctx.fillStyle = Viz.alpha(it.col, 0.85); ctx.fillRect(x0, y1, bw, y0 - y1); }
      }
      if (it.meas !== undefined) {            // measured ◇: d/dt of the box contents by finite differences
        const Y = P.Y(it.meas); ctx.save(); ctx.fillStyle = c.card; ctx.strokeStyle = c.text; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(Xc, Y - 6); ctx.lineTo(Xc + 6, Y); ctx.lineTo(Xc, Y + 6); ctx.lineTo(Xc - 6, Y); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      }
      if (it.id && it.id === pk) { ctx.save(); ctx.strokeStyle = Viz.color('accent'); ctx.lineWidth = 2; ctx.strokeRect(x0 - 3, P.px.y + 2, bw + 6, P.px.h - 4); ctx.restore(); }
      Viz.text(ctx, cw < 46 && it.nlab ? it.nlab : it.lab, Xc, P.px.y + P.px.h + 11, { size: 12, color: it.lcol || it.col, align: 'center', halo: false });
      if (cw >= 44 && P.px.h >= 70) {
        const val = it.stack ? it.stack.reduce((a, q) => a + q.v, 0) : it.v, up = val >= 0;
        const Yv = Math.max(P.px.y + 8, Math.min(P.px.y + P.px.h - 8, P.Y(val) + (up ? -9 : 9)));
        Viz.text(ctx, f4(val, 4), Xc, Yv, { size: 12, color: c.text, align: 'center', bg: true });
      }
      if (coinc && it.tag) Viz.text(ctx, it.tag, Xc, P.px.y + 9, { size: 12.5, weight: 700, color: c.st, align: 'center', bg: true });
    });
    if (H > 120 && ttl && W >= 480) Viz.text(ctx, ttl, P.px.x + 4, 8, { size: 12, color: Viz.color('text-soft'), halo: false });
    return P;
  };
  const Fstack = { lab: 'F', v: B.rhs, col: c.f, stack: [{ v: B.bodyK, col: c.g }, { v: B.surfK, col: c.f }], lo: Math.min(0, B.bodyK, B.bodyK + B.surfK), hi: Math.max(0, B.bodyK, B.bodyK + B.surfK), tag: coinc ? 'c,d' : null };
  if (W < 330) {                        // narrow (landscape phones): one panel — storage, net outflux, forces, residual
    panel(0, W, [A[0], { lab: 'out', v: B.out, col: B.out >= 0 ? c.out : c.in, tag: coinc ? 'b' : null }, Fstack, { lab: 'res', v: B.res, col: c.text }], '');
    return;
  }
  panel(0, split, A, 'storage + outflux per face');
  const Bi = [{ lab: 'LHS', v: B.lhs, col: c.text, lcol: c.text },
    { lab: 'forces', nlab: 'F', v: B.rhs, col: c.f, stack: [{ v: B.bodyK, col: c.g }, { v: B.surfK, col: c.f }], lo: Math.min(0, B.bodyK, B.bodyK + B.surfK), hi: Math.max(0, B.bodyK, B.bodyK + B.surfK) },
    { lab: 'resid', nlab: 'res', v: B.res, col: c.text }];
  if (coinc) { Bi[1].tag = 'c,d'; }
  panel(split, W - split, Bi, '= forces ?');
}

/* ---- the result view ---- */
function drawResult(g, s) {
  const v = g.view('result'); v.clear();
  if (v.w < 60 || v.h < 60) { resultP = null; return; }
  const ctx = v.ctx, c = C(), B = budget(s), small = v.w < 420;
  let P;
  if (s.mode === 'wake') {
    const p = wkP(s), top = Math.max(1, B.FDinf * 1.15);
    P = v.plot({ xlim: [0, 2], ylim: [0, top], xlabel: 'box height H [m]', ylabel: small ? '' : 'F_D/l [N/m]' }).axes();
    P.line([0, 2], [B.FDinf, B.FDinf], { color: c.g, width: 1.4, dash: [6, 4] });
    P.fn(H => wakeBudget(Object.assign({}, p, { H: Math.max(H, 1e-4) })).FD, { color: Viz.alpha(c.f, 0.35), width: 1.6 });
    P.fn(H => wakeBudget(Object.assign({}, p, { H: Math.max(H, 1e-4) })).FD, { color: c.f, width: 2.6, x0: 0, x1: s.H });
    P.line([3 * WK.b, 3 * WK.b], [0, top], { color: Viz.alpha(c.text, 0.35), width: 1, dash: [3, 3] });
    P.dot(s.H, B.FD, 5, { color: c.f, stroke: '#fff', strokeWidth: 2 });
    if (!small) P.text(2, B.FDinf, 'converged ' + f4(B.FDinf, 4) + ' N/m', { align: 'right', dy: -10, size: 12, color: c.g });
  } else if (s.mode === 'bore') {
    const U0 = Math.sqrt(G * BR.hin);
    P = v.plot({ xlim: [1, 2], ylim: [2.5, 6], xlabel: 'depth ratio h_out/h_in', ylabel: small ? '' : 'U [m/s]' }).axes();
    P.line([1, 2], [U0, U0], { color: c.g, width: 1.4, dash: [6, 4] });
    P.fn(r => boreSpeed(BR.hin, r * BR.hin, G), { color: c.teal, width: 2.4 });
    P.dot(s.ratio, B.U, 5, { color: c.teal, stroke: '#fff', strokeWidth: 2 });
    if (Math.abs(s.b) > 0.005) P.dot(s.ratio, Math.min(5.95, Math.max(2.55, s.b)), 4, { color: c.st });
    if (!small) P.text(1.02, U0, '√(g h_in) = ' + f4(U0, 3) + ' m/s', { dy: 11, size: 12, color: c.g });
  } else if (s.mode === 'jet') {
    const Fm = JT.rho * JT.V * JT.V * JT.A;
    P = v.plot({ xlim: [0, 90], ylim: [0, Fm * 1.15], xlabel: 'plate angle θ [°]', ylabel: small ? '' : 'F [N]' }).axes();
    P.fn(d => Fm * Math.sin(d * Math.PI / 180), { color: c.f, width: 2.4 });
    P.dot(s.theta, B.F, 5, { color: c.f, stroke: '#fff', strokeWidth: 2 });
    if (!small) P.text(2, Fm, 'ρV²A = ' + f4(Fm, 3) + ' N', { dy: 11, size: 12, color: c.g });
  } else if (s.mode === 'rocket') {
    const p = rkP(s), top = rocketDV(RK.M0, RK.M0 - RK.mdot * RK.tb, s.Ve) * 1.1;
    P = v.plot({ xlim: [0, RK.tb], ylim: [0, top], xlabel: 't [s]', ylabel: small ? '' : 'b [m/s]' }).axes();
    P.fn(t => rocketDV(RK.M0, RK.M0 - RK.mdot * t, s.Ve), { color: c.g, width: 1.4, dash: [6, 4] });
    P.fn(t => rocketState(t, p).b, { color: Viz.alpha(c.teal, 0.35), width: 1.6, x0: 0, x1: RK.tb - 1e-6 });
    P.fn(t => rocketState(t, p).b, { color: c.teal, width: 2.6, x0: 0, x1: Math.max(1e-6, Math.min(s.t, RK.tb - 1e-6)) });
    P.dot(p.t, B.r.b, 5, { color: c.teal, stroke: '#fff', strokeWidth: 2 });
    if (!small) P.text(0.3, top * 0.9, 'dashed: V_e ln(M₀/M), no gravity', { size: 12, color: c.g });
  } else {
    const T = TMAX.balloon;
    P = v.plot({ xlim: [0, T], ylim: [0, 1.15], xlabel: 't [s]', ylabel: small ? '' : 'mass [kg/m²]' }).axes();
    [['fixed', c.in], ['sliding', c.amber], ['material', c.teal]].forEach(([bx, col]) => {
      const f = t => balloonBudget(bx, t).mass;
      P.fn(f, { color: Viz.alpha(col, bx === s.box ? 0.35 : 0.5), width: bx === s.box ? 1.6 : 1.3, dash: bx === s.box ? [] : [5, 4] });
      if (bx === s.box) P.fn(f, { color: col, width: 2.8, x0: 0, x1: Math.max(1e-6, s.t) });
    });
    P.dot(s.t, B.mass, 5, { color: s.box === 'fixed' ? c.in : s.box === 'sliding' ? c.amber : c.teal, stroke: '#fff', strokeWidth: 2 });
  }
  resultP = P;
}

/* ---------------------------------------------------------------------------------------------------
   TEXT: status, notes, explain, inspector
   --------------------------------------------------------------------------------------------------- */
function statusOf(s) {
  const B = budget(s), ph = narrow(), U = units(s.mode, B.kind);
  if (s.mode === 'wake') return s.H >= 3 * WK.b ? { text: (ph ? '✅ closes · F_D/l = ' : '✅ budget closes · F_D/l = ') + f4(B.FD, 4) + ' N/m', tone: 'good' }
    : { text: (ph ? '⚠️ box cuts the wake · ' : '⚠️ box too short: it cuts the wake · F_D/l = ') + f4(B.FD, 4) + ' N/m', tone: 'warn' };
  if (s.mode === 'bore') {
    if (B.where !== 'inside') return { text: ph ? 'ℹ️ front outside the box' : 'ℹ️ the front has left the box: storage 0, fluxes cancel', tone: 'info' };
    return Math.abs(s.b - B.U) < 0.01 ? { text: (ph ? '✅ riding the wave · U = ' : '✅ riding with the wave: steady budget, U = ') + f4(B.U, 4) + ' m/s', tone: 'good' }
      : { text: (ph ? '⏱ not riding · storage ' : '⏱ box not riding: storage = ') + f4(B.stor, 4) + ' ' + U.v, tone: 'warn' };
  }
  if (s.mode === 'jet') return { text: (ph ? '🚿 plate force ' : '🚿 force on the plate ρV²A sin θ = ') + f4(B.F, 4) + ' N', tone: 'info' };
  if (s.mode === 'rocket') return { text: (ph ? '🚀 thrust ' + f4(s.Ve * RK.mdot, 3) + ' N · b = ' : '🚀 thrust V_e ṁ = ' + f4(s.Ve * RK.mdot, 4) + ' N, b = ') + f4(B.r.b, 4) + ' m/s', tone: 'info' };
  if (s.box === 'material') return { text: ph ? '🎈 material box: no flux' : '🎈 material box: no flux, mass constant', tone: 'good' };
  return { text: (s.box === 'fixed' ? '📦 fixed box: ' : '🛷 sliding box: ') + (ph ? 'storage ' : 'storage = ') + f4(B.stor, 3) + ' ' + U.v, tone: 'info' };
}
function interpretText(s) {
  const B = budget(s);
  if (s.mode === 'wake') return s.H >= 3 * WK.b
    ? `The box encloses the whole wake, so its drag reading, ${f4(B.FD, 4)} N/m, is final. The side leakage is not a mistake: less fluid leaves through the outlet than enters, so ${f4(B.side, 3)} m²/s leaves through the top and bottom, carrying momentum U∞ per unit volume with it.`
    : `The box (H = ${f4(s.H, 3)} m) cuts the wake: part of the slow fluid crosses the top and bottom, where the formula assumed U∞. The reading ${f4(B.FD, 4)} N/m is too low (the whole wake gives ${f4(B.FDinf, 4)} N/m).`;
  if (s.mode === 'bore') {
    if (B.where !== 'inside') return 'The front has left the box, so the box holds only one kind of water: what enters leaves, the pushes on its two ends balance, and nothing is stored. Rewind or change b to catch the front again.';
    return Math.abs(s.b - B.U) < 0.01
      ? `In the wave's frame everything is steady: water arrives ${f4(BR.hin, 3)} m deep and fast, leaves ${f4(B.geom.hout, 3)} m deep and slower. The deeper side's hydrostatic push, ${f4(B.surf, 4)} N/m on the fluid, is what slows it.`
      : `The front moves through the box at ${f4(B.U - s.b, 3)} m/s relative to it, so the momentum inside changes: storage ${f4(B.stor, 4)} ${units('bore', B.kind).v}. Drag b until the storage vanishes — that speed is the wave's.`;
  }
  if (s.mode === 'jet') return `The plate turns the jet; the normal momentum it removes each second, ${f4(B.F, 4)} N, is the force. Along the plate nothing pushes, so the tangential momentum is kept: that sets the uneven split of the two sheets.`;
  if (s.mode === 'rocket') return `The box accelerates with the rocket; only the exhaust crosses its surface, carrying momentum V_e = ${f4(s.Ve, 4)} m/s per kilogram backwards relative to the rocket — that is the thrust, ${f4(s.Ve * RK.mdot, 4)} N, against a weight of ${f4(B.r.M * G, 4)} N.`;
  if (s.box === 'material') return 'b = u at both ends: nothing crosses, so the mass is constant — the balloon rule $\\frac{d}{dt}\\int_{V(t)}\\rho\\,dV=0$ (4.1).';
  return s.box === 'fixed' ? `The fixed box loses mass through its right face faster than it gains on the left: storage ${f4(B.stor, 4)} kg/(m² s) now.`
    : `The sliding box moves at 1 m/s: the relative velocities u − b at its ends decide the fluxes, storage ${f4(B.stor, 4)} kg/(m² s) now.`;
}
function faceInspect(s) {
  const id = probeOf(s); if (id == null) return null;
  const B = budget(s), f = B.faces.find(q => q.id === id); if (!f) return null;
  const U = units(s.mode, B.kind);
  if (s.mode === 'wake') {
    if (id === 'in') return `<b>Inlet</b> (x = −0.3 m, $\\mathbf n=-\\mathbf e_x$, height $H=${t4(s.H, 3)}$ m):<br>$(\\mathbf u-\\mathbf b)\\cdot\\mathbf n=-U_\\infty=-10$ m/s<br>mass $\\rho(\\mathbf u-\\mathbf b)\\cdot\\mathbf n\\,H=1.2\\times(-10)\\times${t4(s.H, 3)}=\\mathbf{${t4(f.m)}}$ kg/(m s)<br>x-momentum $=U_\\infty\\times\\text{mass}=\\mathbf{${t4(f.p)}}$ N/m`;
    if (id === 'out') return `<b>Outlet</b> (x = 2.5 m, $\\mathbf n=+\\mathbf e_x$):<br>$\\int U\\,dy=U_\\infty H-\\Delta b\\sqrt\\pi\\,\\mathrm{erf}(H/2b)=${t4(B.Q)}$ m²/s<br>mass $=1.2\\times${t4(B.Q)}=\\mathbf{${t4(f.m)}}$ kg/(m s)<br>x-momentum $\\rho\\int U^2dy=1.2\\times${t4(B.M)}=\\mathbf{${t4(f.p)}}$ N/m`;
    return `<b>${f.name} face</b> (length 2.8 m, outward $\\mathbf n=${id === 'top' ? '+' : '-'}\\mathbf e_y$):<br>leak $\\tfrac12\\int(U_\\infty-U)dy=\\tfrac12\\times${t4(B.side)}=${t4(B.side / 2)}$ m²/s<br>mass $=1.2\\times${t4(B.side / 2)}=\\mathbf{${t4(f.m)}}$ kg/(m s)<br>x-momentum $=U_\\infty\\times\\text{mass}=10\\times${t4(f.m)}=\\mathbf{${t4(f.p)}}$ N/m`;
  }
  if (s.mode === 'bore') {
    const sg = id === 'left' ? '-' : '+';
    return `<b>${f.name}</b> (depth $h=${t4(f.h, 3)}$ m, $\\mathbf n=${sg}\\mathbf e_x$, box velocity $-b\\,\\mathbf e_x$):<br>$(\\mathbf u-\\mathbf b)\\cdot\\mathbf n=${sg === '-' ? '-' : ''}(${t4(f.u)}+${tp(s.b, 3)})=${t4(f.un)}$ m/s<br>mass $\\rho h(\\mathbf u-\\mathbf b)\\cdot\\mathbf n=1000\\times${t4(f.h, 3)}\\times${tp(f.un)}=\\mathbf{${t4(f.m)}}$ kg/(m s)<br>x-momentum $=u\\times\\text{mass}=${tp(f.u)}\\times${tp(f.m)}=\\mathbf{${t4(f.p)}}$ N/m`;
  }
  if (s.mode === 'jet') {
    if (id === 'jet') return `<b>Jet inflow</b> ($A=1$ cm², $\\mathbf n=-\\mathbf e_x$):<br>$(\\mathbf u-\\mathbf b)\\cdot\\mathbf n=-V=-10$ m/s<br>mass $=1000\\times(-10)\\times10^{-4}=\\mathbf{-1}$ kg/s<br>normal momentum $=V\\sin\\theta\\times\\text{mass}=10\\times${t4(Math.sin(s.theta * Math.PI / 180), 3)}\\times(-1)=\\mathbf{${t4(f.p)}}$ N`;
    return `<b>${f.name}</b> (area $A${id === 's1' ? '(1+\\cos\\theta)' : '(1-\\cos\\theta)'}/2=${t4(f.A * 1e4, 3)}$ cm²):<br>$(\\mathbf u-\\mathbf b)\\cdot\\mathbf n=+V=10$ m/s<br>mass $=1000\\times10\\times${t4(f.A)}=\\mathbf{${t4(f.m)}}$ kg/s<br>normal momentum 0 (it slides along the plate); along-plate momentum $${id === 's1' ? '+' : '-'}V\\times\\text{mass}=\\mathbf{${t4(f.al)}}$ N`;
  }
  if (s.mode === 'rocket') { const r = B.r; return `<b>Nozzle exit</b> ($\\mathbf n=-\\mathbf e_z$, the only face crossed):<br>$(\\mathbf u-\\mathbf b)\\cdot\\mathbf n\\,dA=V_e\\,dA$, so mass $\\rho_eV_eA_e=\\dot m=\\mathbf{0.1}$ kg/s<br>exhaust velocity $u_z=b-V_e=${t4(r.b)}-${t4(s.Ve)}=${t4(r.b - s.Ve)}$ m/s<br>z-momentum $=\\dot m\\,(b-V_e)=\\mathbf{${t4(f.p)}}$ N`; }
  const sg = id === 'left' ? '-' : '+';
  return `<b>${f.name}</b> at $x=${t4(f.x, 3)}$ m ($\\mathbf n=${sg}\\mathbf e_x$):<br>$u=ax/(1+at)=${t4(f.u)}$ m/s, wall speed ${t4(f.wall, 3)} m/s<br>$(u-b)\\,n=${sg === '-' ? '-' : ''}(${t4(f.u)}-${tp(f.wall, 3)})=${t4(f.un)}$ m/s<br>mass flux $\\rho(u-b)\\,n=${t4(B.I.rho)}\\times${tp(f.un)}=\\mathbf{${t4(f.m)}}$ ${U.v}`;
}

function explainHtml(s) {
  const W = Viz.work, B = budget(s), kind = B.kind, U = units(s.mode, kind), kn = kindName(s.mode, kind), R = resultText(s, B);
  let o = W.step(0, 'What the views show') +
    W.say('<b>The control volume</b> is the dashed box drawn on the flow. Arrows on its faces show fluid crossing: <b class="c-blue">blue</b> entering, <b class="c-orange">orange</b> leaving; the <b class="c-rose">rose</b> arrow is the force on the fluid inside' + (s.mode === 'wake' || s.mode === 'jet' ? ', the dark arrow its reaction on the body' : '') + '. <b>Budget</b> shows <b class="c-accent">storage</b> (purple, with the measured ◇) and each face\'s outflux, then the balance: LHS = storage + outflux against the forces (<b class="c-muted">body</b> grey, <b class="c-rose">surface</b> rose); the black residual must be 0. <b>What the budget gives</b> plots the answer.') +
    W.hint('On a phone held upright the result curve is hidden; its number is in the Budget title and the readouts.');
  o += W.step(1, 'The rule for any box') +
    W.say('Mass, (4.5): $\\frac{d}{dt}\\int_{V^*}\\rho\\,dV+\\int_{A^*}\\rho(\\mathbf u-\\mathbf b)\\cdot\\mathbf n\\,dA=0$.') +
    W.say('Momentum, (4.17): $\\frac{d}{dt}\\int_{V^*}\\rho\\mathbf u\\,dV+\\int_{A^*}\\rho\\mathbf u(\\mathbf u-\\mathbf b)\\cdot\\mathbf n\\,dA=\\int_{V^*}\\rho\\mathbf g\\,dV+\\int_{A^*}\\mathbf f\\,dA$.') +
    W.line('box velocity $\\mathbf b$', s.mode === 'wake' || s.mode === 'jet' ? '0 (fixed)' : s.mode === 'bore' ? (s.b === 0 ? '0' : '−' + f4(s.b, 3) + ' e_x') + ' m/s' : s.mode === 'rocket' ? f4(B.r.b, 4) + ' e_z m/s (rides with the rocket)' : BOXNAME[s.box], 'so each face counts the relative velocity u − b') +
    W.line('budget shown', kn + ' [' + U.v + ']', s.mode === 'balloon' ? 'the balloon has a mass budget only' : 'switch mass / momentum in Explore');
  const rows = B.faces.map(f => [f.short, isFinite(f.A) ? f4(f.A, 3) : '—', f4(f.un, 4), f4(f.m, 4), s.mode === 'balloon' ? '—' : f4(f.p, 4)]);
  const pk = probeOf(s), cur = B.faces.findIndex(f => f.id === pk);
  o += W.step(2, 'Face by face') +
    W.table(['face', s.mode === 'jet' ? 'A [m²]' : s.mode === 'balloon' ? 'A' : 'A [m]', '(u−b)·n', 'mass', kind === 'mass' && s.mode === 'balloon' ? 'mom.' : 'mom.'], rows, cur) +
    W.say('Units: mass ' + units(s.mode, 'mass').v + (s.mode === 'balloon' ? '' : ', momentum ' + units(s.mode, 'mom').v) + '. Positive = out. Click a face in the picture for its arithmetic.') +
    W.line('mass: storage + Σ outflux $=' + tp(B.sm) + B.faces.map(f => '+' + tp(f.m)).join('') + '$', f4(B.resM, 4), 'mass is conserved, so this sum is 0');
  o += W.step(3, 'The forces') + W.say(s.mode === 'wake' ? 'Pressure is p∞ on every face, so its net force is zero (a constant pressure on a closed surface pushes equally in all directions — Gauss). Gravity is vertical and does not enter the x-budget. The only x-force on the fluid is the bar\'s reaction, $-F_D/l=' + t4(-B.FD) + '$ N/m.'
    : s.mode === 'bore' ? 'Hydrostatic pressure $p=p_o+\\rho g(h-z)$ on each end; $p_o$ cancels with the push on the sloping top. Net push on the fluid: $\\rho g(h_L^2-h_R^2)/2=1000\\times9.81\\times(' + t4(B.faces[0].h ** 2, 4) + '-' + t4(B.faces[1].h ** 2, 4) + ')/2=' + t4(B.surf) + '$ N/m. Gravity is vertical.'
      : s.mode === 'jet' ? 'The jet and sheets are open to the air (pressure atmospheric all round, net zero); gravity is ignored. The plate pushes the fluid back along its normal: $-F=' + t4(-B.F) + '$ N.'
        : s.mode === 'rocket' ? 'Gravity on everything inside: $-Mg=-' + t4(B.r.M, 3) + '\\times9.81=' + t4(B.body) + '$ N. Surface force $F_S=0$ (no drag, nozzle at ambient pressure).'
          : 'A mass budget has no forces: storage + net outflux must be zero by itself.');
  let res;
  if (s.mode === 'wake') res = W.line('$\\int_{-H/2}^{H/2}U(U_\\infty-U)dy=U_\\infty\\Delta I_1-\\Delta^2I_2=10\\times' + t4(s.deficit, 3) + '\\times' + t4(B.I1) + '-' + t4(s.deficit * s.deficit, 3) + '\\times' + t4(B.I2) + '$', f4(B.FD / WK.rho, 4) + ' m³/s²', '$I_1=b\\sqrt\\pi\\,\\mathrm{erf}(H/2b)$, $I_2=b\\sqrt{\\pi/2}\\,\\mathrm{erf}(H/\\sqrt2 b)$') +
    W.box('$F_D/l=\\rho\\int U(U_\\infty-U)\\,dy=1.2\\times' + t4(B.FD / WK.rho) + '=\\mathbf{' + t4(B.FD) + '}$ N/m');
  else if (s.mode === 'bore') res = W.box('$U=\\sqrt{\\frac{gh_{out}}{2h_{in}}(h_{in}+h_{out})}=\\sqrt{9.81\\times' + t4(B.geom.hout, 3) + '\\times' + t4(1 + B.geom.hout, 3) + '/2}=\\mathbf{' + t4(B.U) + '}$ m/s') +
    W.line('shallow-water speed $\\sqrt{gh_{in}}$', f4(Math.sqrt(G), 4) + ' m/s', 'the bore is faster: it is not a small wave') +
    W.line('water behind the front $U_{out}=(h_{in}-h_{out})U/h_{out}$', f4(B.Uo, 4) + ' m/s', 'it follows the wave (to the left)');
  else if (s.mode === 'jet') res = W.box('$F=\\rho V^2A\\sin\\theta=1000\\times100\\times10^{-4}\\times' + t4(Math.sin(s.theta * Math.PI / 180), 4) + '=\\mathbf{' + t4(B.F) + '}$ N') +
    W.say('<b>Why the sheets are unequal.</b> Nothing pushes along the plate (no shear, air pressure all round), so the along-plate momentum is conserved too: what comes in with the jet, $\\rho V^2A\\cos\\theta=' + t4(JT.rho * JT.V * JT.V * JT.A * Math.cos(s.theta * Math.PI / 180)) + '$ N, must leave in the sheets, $\\rho V^2(A_1-A_2)$. With $A_1+A_2=A$ (mass) this gives $A_{1,2}=A(1\\pm\\cos\\theta)/2$.') +
    W.line('sheet areas $A_1,\\ A_2$', f4(B.A1 * 1e4, 3) + ' and ' + f4(B.A2 * 1e4, 3) + ' cm²', 'mass ' + f4(B.faces[1].m, 3) + ' and ' + f4(B.faces[2].m, 3) + ' kg/s; along-plate residual ' + f4(B.resAlong, 2) + ' N');
  else if (s.mode === 'rocket') res = W.say('Ex. 4.4: $M\\frac{d^2z_R}{dt^2}=-V_e\\frac{dM}{dt}-Mg+F_S$, with $dM/dt=-\\dot m$.') +
    W.line('$b(t)=V_e\\ln\\frac{M_0}{M}-gt=' + t4(s.Ve) + '\\ln\\frac{2}{' + t4(B.r.M, 3) + '}-9.81\\times' + t4(Math.min(s.t, RK.tb), 3) + '$', f4(B.r.b, 4) + ' m/s') +
    W.box('speed now $b=\\mathbf{' + t4(B.r.b) + '}$ m/s, acceleration $V_e\\dot m/M-g=' + t4(B.r.a) + '$ m/s²');
  else res = W.line('storage $=\\int\\partial_t\\rho\\,dx+\\rho(\\dot x_1-\\dot x_0)=' + tp(B.I.local) + '+' + t4(B.I.rho) + '\\times' + tp(B.box.d1 - B.box.d0, 3) + '$', f4(B.I.storage, 4) + ' ' + U.v, 'Leibniz on the moving ends') +
    W.box('storage $=-(\\text{out}-\\text{in})=-(' + t4(B.I.flux_right) + '-' + tp(B.I.flux_left) + ')=\\mathbf{' + t4(-B.I.net) + '}$ ' + U.v);
  o += W.step(4, 'The result') + res;
  o += W.step(5, s.mode === 'wake' || s.mode === 'jet' ? 'Newton\'s third law' : 'The balance with your numbers') +
    (s.mode === 'wake' || s.mode === 'jet' ? W.say('The budget gives the force <i>on the fluid</i>, ' + f4(B.surf, 4) + ' ' + units(s.mode, 'mom').v + '; the ' + (s.mode === 'wake' ? 'bar' : 'plate') + ' feels the opposite, <b>+' + f4(-B.surf, 4) + ' ' + units(s.mode, 'mom').v + '</b>. Forgetting the minus turns ' + (s.mode === 'wake' ? 'drag' : 'the push') + ' negative.') : '') +
    W.line('LHS: storage + Σ outflux $=' + tp(B.stor) + '+' + tp(B.out) + '$', f4(B.lhs, 4) + ' ' + U.v) +
    W.line('RHS: body + surface $=' + tp(B.bodyK) + '+' + tp(B.surfK) + '$', f4(B.rhs, 4) + ' ' + U.v) +
    W.box('residual = LHS − RHS = <b>' + f4(B.res, 3) + '</b> ' + U.v + ' (round-off only)');
  o += W.step(6, 'The result view') + W.say(s.mode === 'wake' ? 'F_D/l stops changing once H ≳ 3b = 0.3 m; below that the box cuts the wake and the reading drops (dashed: the whole wake).'
    : s.mode === 'bore' ? 'U → √(gh) as the ratio → 1: small waves travel at the shallow-water speed (grey). A purple dot marks your box speed b.'
      : s.mode === 'jet' ? 'F = ρV²A sin θ: a glancing jet (small θ) hardly pushes; a head-on one pushes ρV²A.'
        : s.mode === 'rocket' ? 'Bold: the speed so far; grey dashed: the same burn without gravity, V_e ln(M₀/M) (Tsiolkovsky). Gravity costs gt.'
          : 'Mass in each box against time: the material box (teal) stays flat at 1 kg/m²; the fixed and sliding ones lose mass.') +
    W.hint('Turn a phone sideways (or use a wider window) to see this view.');
  o += W.step(7, 'At the current time') + W.line('$t$', Viz.live('t') + ' s') + W.line('storage (formula)', Viz.live('stor') + ' ' + U.v, 'purple bar') +
