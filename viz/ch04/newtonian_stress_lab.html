/* mode-dependent controls and readouts (ch03 E7 pattern) */

/* ---------------------------------------------------------------------------------------------------

const ELEM = { xlim: [-1.45, 1.45], ylim: [-1.45, 1.45], equal: true, pad: { l: 6, r: 6, t: 6, b: 6 } };

/** View 1 — the fluid element: ghost at t = 0, deformed outline, S axes, the cutting plane, n, f and its parts. */

  const a = 0.6, sq = [[-a, -a], [a, -a], [a, a], [-a, a], [-a, -a]];
  // ghost at t = 0 and the element TVIS later (exact linear-flow map e^{Gt} of the in-plane G)
  P.poly(sq, { color: Viz.alpha(c.muted, 0.8), width: 1.2, dash: [5, 4] });

        else P.arrow(sg * (1.02 + len) * e[0], sg * (1.02 + len) * e[1], -sg * len * e[0], -sg * len * e[1], { color: c.S, width: 2.2, head: 8 });

/** View 1 in cube mode — D08's cube of side h with τ12 on the x-faces, τ21 = 0 on the y-faces, arms and spin-up. */

/** View 2 — σn(θ) blue and τs(θ) rose over a half-turn (faint whole + bold so far), −p ghost, principal ticks, Mohr inset. */

    W.line('$S_{mm}=\\nabla\\cdot\\mathbf u=' + tn(S[0][0]) + '+' + tp(S[1][1]) + '+' + tp(S[2][2]) + '$', tn(m.div) + ' 1/s', 'the rate of volume change per unit volume');
  o += W.step(2, 'The Newtonian law, entry by entry') +
    W.say('(4.37), $\\tau_{ij}=-p\\delta_{ij}+2\\mu\\big(S_{ij}-\\tfrac13S_{mm}\\delta_{ij}\\big)+\\mu_vS_{mm}\\delta_{ij}$, with μ = ' + fm(s.mu) + ' Pa s, μ_v = ' + fm(s.muv) + ' Pa s, p = ' + fm(s.p) + ' Pa (gauge):') +
    [0, 1, 2].map(i => W.line('$\\tau_{' + (i + 1) + (i + 1) + '}=' + tn(-s.p) + '+2\\times' + tn(s.mu) + '\\times(' + tn(S[i][i]) + '-' + tp(thd) + ')+' + tn(s.muv) + '\\times' + tp(m.div) + '$', tn(T[i][i]) + ' Pa')).join('') +
    W.line('$\\tau_{12}=2\\mu S_{12}=2\\times' + tn(s.mu) + '\\times' + tp(S[0][1]) + '$', tn(T[0][1]) + ' Pa', 'off the diagonal only the shape part acts; τ₂₁ is the same number') +
    W.box('$\\boldsymbol\\tau=' + texM(T, U.f) + '$ ' + U.u);
  o += W.step(3, 'Traction on your plane') +
    W.line('$\\mathbf n=(\\cos\\theta,\\sin\\theta,0)=(' + tn(n[0]) + ',\\ ' + tn(n[1]) + ',\\ 0)$', '', 'θ = ' + fd(s.theta) + '; the cut is perpendicular to n') +
    W.line('$f_1=n_1\\tau_{11}+n_2\\tau_{21}=' + tn(n[0]) + '\\times' + tp(T[0][0]) + '+' + tp(n[1]) + '\\times' + tp(T[1][0]) + '$', tn(m.f[0]) + ' Pa', 'Cauchy (2.15), $f_j=n_i\\tau_{ij}$, contracts the first index') +
    W.line('$f_2=n_1\\tau_{12}+n_2\\tau_{22}=' + tn(n[0]) + '\\times' + tp(T[0][1]) + '+' + tp(n[1]) + '\\times' + tp(T[1][1]) + '$', tn(m.f[1]) + ' Pa') +
    W.line('$\\sigma_n=\\mathbf f\\cdot\\mathbf n$', tn(m.sn) + ' Pa', m.sn > 1e-15 ? 'positive: a pull' : m.sn < -1e-15 ? 'negative: a push' : 'no normal load') +
    W.line('$\\tau_s=\\mathbf f\\cdot\\mathbf t,\\ \\mathbf t=(' + tn(t[0]) + ',\\ ' + tn(t[1]) + ',\\ 0)$', tn(m.ts) + ' Pa', 'signed along the counter-clockwise tangent t') +
    W.box('<span class="c-blue">σn = ' + fS(m.sn, m) + '</span>, <span class="c-rose">τs = ' + fS(m.ts, m) + '</span>');
  if (m.pt.r > 1e-12 * Math.max(1, m.fmax)) {
    o += W.step(4, 'Principal directions') +
      W.line('$\\theta_p=\\tfrac12\\,\\mathrm{atan2}(2\\tau_{12},\\ \\tau_{11}-\\tau_{22})$', fd(mod180(m.thpDeg)) + ' and ' + fd(mod180(m.thpDeg + 90)), 'τs = 0 there: the eigenvectors of τ, which are those of S (the teal axes)') +
      W.line('$c=(\\tau_{11}+\\tau_{22})/2$', fS(m.pt.c, m), 'the centre of the Mohr circle') +
      W.line('$r=\\sqrt{(\\tau_{11}-\\tau_{22})^2/4+\\tau_{12}^2}$', fS(m.pt.r, m), 'its radius: the largest shear on any plane') +
      W.line('$\\sigma_n=c\\pm r\\ \\text{on those planes}$', fS(m.pt.lam[0], m) + ', ' + fS(m.pt.lam[1], m), 'the largest and smallest normal stress of all planes') +
      W.say('The ch02 explainer <i>cauchy_traction_principal_axes</i> proves these facts for any stress; here they come from the flow.');
  } else {
    o += W.step(4, 'Principal directions') + W.say('The in-plane stress is isotropic (f = ' + fS(m.pt.c, m) + ' × n on every plane): every direction is principal and τs = 0 everywhere.');
  }
  o += W.step(5, 'Mean and thermodynamic pressure') +
    W.line('$\\bar p=-\\tfrac13\\tau_{ii}=-\\tfrac13(' + tn(T[0][0]) + '+' + tp(T[1][1]) + '+' + tp(T[2][2]) + ')$', tn(m.pbar) + ' Pa', 'the mean pressure (4.33), $\\bar p\\equiv-\\tfrac13\\tau_{ii}$') +
    W.line('$p-\\bar p=\\mu_v\\nabla\\cdot\\mathbf u=' + tn(s.muv) + '\\times' + tn(m.div) + '$', tn(m.dp) + ' Pa', '(4.34), $p-\\bar p=(\\tfrac23\\mu+\\lambda)\\nabla\\cdot\\mathbf u$, with μ_v = λ + ⅔μ') +
    W.line('$\\lambda=\\mu_v-\\tfrac23\\mu=' + tn(s.muv) + '-\\tfrac23\\times' + tn(s.mu) + '$', tn(m.lam) + ' Pa s', 'the second viscosity coefficient; Stokes (4.36), $\\lambda+\\tfrac23\\mu=0$, is μ_v = 0') +
    W.box('$p-\\bar p=\\mathbf{' + tS(m.dp, m) + '}$ ' + U.u + (Math.abs(m.dp) < 1e-15 ? ' — zero: no expansion, or μ_v = 0' : ' — nonzero: the fluid expands and μ_v > 0'));
  o += W.step(6, 'Where each entry comes from (G → S → τ)') +
    W.say('Shear gives only <b class="c-rose">rose</b> off-diagonal entries; extension rose diagonal ones; expansion with μ_v > 0 <b class="c-accent">purple</b> diagonal ones; a gauge pressure <b class="c-orange">orange</b> diagonal ones; rotation none at all. Click any entry for its arithmetic.') +
    W.hint('Hidden on portrait phones: turn the phone or open the Derivation tab (D09, D10) where the grid is shown.');
  o += W.step(7, 'The spinning cube (why τ₁₂ = τ₂₁)') +
    W.line('$I_{33}=\\rho h^5/6=1000\\times(' + tn(m.h) + ')^5/6$', tn(RHO * m.h ** 5 / 6) + ' kg m²', 'moment of inertia of the cube about x₃') +
    W.line('$\\dot\\Omega_3=6(\\tau_{12}-\\tau_{21})/(\\rho h^2)$', '', 'D08 step 6') +
    W.line('$\\dot\\Omega_3=6\\times' + tn(s.imb) + '/(1000\\times(' + tn(m.h) + ')^2)$', tn(m.alpha) + ' rad/s²', 'torque (τ₁₂ − τ₂₁)h³ over I₃₃; ×100 for every ×10 smaller h' + (cube ? '' : ' (switch to the spinning-cube mode to see it)'));
  o += W.step(8, cube ? 'At the current cube size' : 'At the current plane angle') +
    (cube ? W.line('$h$', Viz.live('h')) + W.line('$\\dot\\Omega_3$', Viz.live('al') + ' rad/s²')
      : W.line('$\\theta$', Viz.live('th') + '°') + W.line('<span class="c-blue">$\\sigma_n$</span>', Viz.live('sn') + ' ' + U.u) + W.line('<span class="c-rose">$\\tau_s$</span>', Viz.live('ts') + ' ' + U.u));
  return o + W.interpret(readingOf(s), 'Reading the current setting');
}
