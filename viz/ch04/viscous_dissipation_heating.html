.viz-app[data-layout="landscape"][data-dense="3"] .viz-view-title { display: none; }

.viz-transport { flex: 0 0 auto; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; padding: 4px 6px; }
.viz-stage:not(.multi) .viz-transport { border-top: 1px solid var(--viz-border); }
.viz-stage.multi .viz-transport { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); }

/* ---------- explore pager items ---------- */

.viz-muted { color: var(--viz-muted); }

.viz-term { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: 8px; padding: 4px 8px; cursor: pointer; }

.viz-term-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13.5px; border-top: 2px solid var(--viz-accent); padding-top: 4px; }

/* ---------- inspector · right now ---------- */
.viz-inspect, .viz-notes { font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-inspect { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 7%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 5px 9px; }
.viz-notes { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 5px 9px; }
.viz-notes p, .viz-inspect p { margin: 0 0 4px; } .viz-notes p:last-child, .viz-inspect p:last-child { margin-bottom: 0; }

/* ---------- step-by-step working (Viz.work helpers) ---------- */
.viz-work-h { font-size: 13px; font-weight: 650; color: var(--viz-accent); margin: 4px 0 0; }

.viz-work-ln b { font-variant-numeric: tabular-nums; }
.viz-work-why { color: var(--viz-muted); font-size: 12px; margin-left: 4px; }
.viz-work-res { font-size: 13px; line-height: 1.45; padding: 4px 9px; border-radius: 8px; border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 9%, var(--viz-card)); }

.viz-work-table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.viz-work-table th, .viz-work-table td { padding: 2px 8px 2px 0; text-align: left; border-bottom: 1px solid var(--viz-border); }
.viz-work-table th { color: var(--viz-muted); font-weight: 600; }
.viz-work-table tr.cur td { background: color-mix(in srgb, var(--viz-orange) 12%, var(--viz-card)); font-weight: 600; }
.viz-work-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; margin-right: 6px;
  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-work-hint { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--viz-muted); font-style: italic; }
.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

/* ---------- derivation stepper ---------- */
.viz-der-line { display: block; min-width: 0; border-radius: 8px; padding: 2px 6px; }
.viz-der-tag { display: block; font-size: 12px; line-height: 1.2; color: var(--viz-muted); font-variant-numeric: tabular-nums; }
.viz-der-chain { display: flex; align-items: center; gap: 6px; }
.viz-der-chain .viz-eq-body { flex: 1 1 auto; min-width: 0; }
.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }
.viz-der-chain .viz-eq-body { font-size: 14px; }
.viz-der-block { font-size: 13.5px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-der-block ol { margin: 2px 0 0 18px; padding: 0; } .viz-der-block li { margin: 0 0 2px; }
.viz-der-did { font-weight: 650; color: var(--viz-orange); padding-left: 6px; }
.viz-der-why { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-why b.k { color: var(--viz-teal); }
.viz-der-plain { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp { border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.viz-der-pick { flex-wrap: wrap; }
.viz-app[data-dense="2"] .viz-der-block, .viz-app[data-dense="3"] .viz-der-block { font-size: 13px; line-height: 1.4; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-stage { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-side { flex: 1 1 auto; }
/* phones: the derivation keeps ONE view of the picture (derivation.view, else the first) and drops the strips */
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage { min-height: max(150px, 30%); flex: 0 0 auto; height: max(150px, 30%); }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage-top,
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-side { flex: 1 1 auto; }
.c-accent { color: var(--viz-accent); font-weight: 650; } .c-teal { color: var(--viz-teal); font-weight: 650; }
.c-orange { color: var(--viz-orange); font-weight: 650; } .c-rose { color: var(--viz-rose); font-weight: 650; } .c-blue { color: var(--viz-blue); font-weight: 650; }

/* ---------- code tab ---------- */

.viz-pages { position: relative; }

  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--viz-card) 45%); padding-right: 2px; }
.viz-pager-cue[hidden] { display: none; }
.viz-pages.viz-cont-top { box-shadow: inset 0 2px 0 0 color-mix(in srgb, var(--viz-accent) 45%, transparent); }
/* a paged text panel on portrait keeps exactly the height its pages were packed for: the stage stays at its floor */
.viz-app[data-layout="portrait"][data-paged] .viz-stage { flex-grow: 0; }

.viz-app[data-layout="portrait"][data-room="text"] .viz-stage { min-height: max(140px, 26%); }
.viz-app[data-layout="portrait"][data-room="text"] .viz-stage.multi { min-height: max(140px, 26%, var(--viz-stage-need, 0px)); }
.viz-app[data-layout="portrait"][data-room="text"][data-tab="derive"] .viz-stage { height: max(140px, 24%); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* chapter CSS — viscous_dissipation_heating. Colours (one meaning each): velocity and the wall's work teal; dissipation

@media (max-width: 560px) {
  .viz-app[data-layout="portrait"] .viz-presets { display: none !important; }
}
.viz-app[data-layout="landscape"] .viz-presets { display: none !important; }
.viz-app[data-layout="portrait"]:not([data-tab="explore"]) .viz-stage-top .viz-seg { display: none !important; }
.viz-stage-top .viz-seg { flex-wrap: wrap; max-width: 100%; border-radius: 14px; }
.viz-app[data-flow="couette"] [data-viz-key="param:G"],
.viz-app[data-flow="poiseuille"] [data-viz-key="param:U"] { display: none !important; }
.viz-readout-value { white-space: normal; overflow-wrap: anywhere; }

/* ---------------------------------------------------------------------------------------------------

   --------------------------------------------------------------------------------------------------- */
const FLOWS = [['couette', 'Couette'], ['poiseuille', 'Poiseuille'], ['both', 'both']];

function parsOf(s) {
  return { U: s.flow === 'poiseuille' ? 0 : s.U, G: s.flow === 'couette' ? 0 : s.G, h: H, mu: (s.neg ? -1 : 1) * s.mu, k: s.k, rho: s.rho, cp: s.cp, T0 };

const YS = Viz.num.linspace(0, H, NY);
let SINTAB = null;   // sin(nπy/h) for the NY sample heights and n = 1 … NT (h is fixed)
function sinTable() {

/* number formatting */

  for (let i = 0; i < xs.length; i++) ctx.lineTo(P.X(xs[i]), P.Y(ys[i]));

const yTicks = h => (h < 150 ? [0, 0.5, 1] : [0, 0.25, 0.5, 0.75, 1]);

/* ---- particles for the channel (visual speed ∝ u/umax) ---- */

/* ---- view 1: the sheared gap ---- */
function drawChannel(v, s, app) {

  }
}

/* ---- view 3: the energy budget per unit wall area ---- */
let BUDROWS = [];
function budgetRows(m, narrow) {
  const lab = (full, short) => (narrow ? short : full);
  return [
    { id: 'work', label: lab('work in (wall' + (m.p.G ? ' + pressure' : '') + ')', 'work in'), v: m.work, color: C().work },
    { id: 'ke', label: lab('→ force work: kinetic energy', '→ kinetic'), v: 0, color: C().ke },
    { id: 'gen', label: lab('→ deformation work = heat ∫ρε dy', '→ heat made'), v: m.gen, color: m.neg ? Viz.color('blue') : C().eps },
    { id: 'stored', label: lab('heat stored in the gap', 'stored'), v: m.f.stored, color: C().stored },
    { id: 'out', label: lab('heat conducted out', 'out'), v: m.f.out, color: C().out },
    { id: 'bal', label: lab('balance: in − kinetic − stored − out', 'balance'), v: m.balance, color: C().text }
  ];
}
function drawBudget(v, s, app) {
  v.clear(); CUR = s; if (v.w < 60 || v.h < 60) return;
  const m = model(s), c = C(), ctx = v.ctx, W = v.w, Hh = v.h, wideT = W > 560;
  const bw = wideT ? Math.round(W * 0.58) : W;
  const nar = bw < 430;
  const rows = budgetRows(m, nar), labW = nar ? 86 : 214, valW = nar ? 78 : 96, top = 8, foot = 24;
  const rh = Math.max(16, Math.min(30, (Hh - top - foot) / rows.length));
  const x0 = 6 + labW, x1 = bw - valW - 6, mx = Math.max(1e-300, ...rows.map(r => Math.abs(r.v)));
  const neg = rows.some(r => r.v < -1e-9 * mx), zx = neg ? x0 + (x1 - x0) * 0.5 : x0, sc = (neg ? (x1 - x0) * 0.5 : (x1 - x0)) / mx;
  BUDROWS = [];
  ctx.save(); ctx.strokeStyle = Viz.alpha(c.muted, 0.7); ctx.beginPath(); ctx.moveTo(zx + 0.5, top); ctx.lineTo(zx + 0.5, top + rows.length * rh); ctx.stroke(); ctx.restore();
  rows.forEach((r, i) => {
    const y = top + i * rh, yc = y + rh / 2, lit = (s.hl === 'ke' && r.id === 'ke') || (s.hl === 'split' && (r.id === 'ke' || r.id === 'gen')) || (s.hl === 'heat' && (r.id === 'gen' || r.id === 'stored' || r.id === 'out'));
    if (lit) { ctx.save(); ctx.fillStyle = Viz.alpha(r.color, 0.12); Viz.roundRect(ctx, 2, y + 1, bw - 4, rh - 2, 5); ctx.fill(); ctx.restore(); }
    Viz.text(ctx, r.label, 8, yc, { size: 12, color: r.id === 'bal' ? c.text : r.color, weight: lit ? 750 : 620, maxWidth: labW - 6 });
    const bx = r.v >= 0 ? zx : zx + r.v * sc, bwid = Math.abs(r.v) * sc, bh = Math.max(6, rh * 0.52);
    ctx.save(); ctx.fillStyle = r.id === 'bal' ? Viz.alpha(c.text, 0.7) : r.color; ctx.globalAlpha = s.hl && !lit ? 0.35 : 1;
    ctx.fillRect(bx, yc - bh / 2, Math.max(bwid, r.v ? 1.5 : 0), bh); ctx.restore();
    Viz.text(ctx, fm(Math.abs(r.v) < 1e-9 * mx ? 0 : r.v), bw - 8, yc, { size: 12, color: c.text, weight: 650, align: 'right' });
    BUDROWS.push({ id: r.id, y0: y, y1: y + rh });
  });
  const sgv = m.pr.sg, sgc = sgv >= 0 ? c.sg : Viz.color('rose');
  Viz.text(ctx, (sgv >= 0 ? '✓ ' : '✗ ') + 'entropy production at the probe ' + fp(sgv) + ' W/(kg K)' + (sgv >= 0 ? ' ≥ 0' : ' < 0'), 8, Hh - foot / 2 - 1, { size: 12, color: sgc, weight: 700, maxWidth: bw - 12 });
  if (!nar) Viz.text(ctx, 'W/m²', bw - 8, top - 1 + rows.length * rh + 9, { size: 12, color: c.soft, align: 'right' });
  if (!wideT) return;
  // the approach to steady state: stored and out as fractions of the work, faint whole run + bold so far
  const tx = bw + 8, P = v.plot({ rect: { x: tx, y: 0, w: W - tx, h: Hh }, xlim: [0, TAU_MAX], ylim: [-0.05, 1.1], pad: { l: 40, r: 10, t: 8, b: 32 }, xlabel: 'time κt/h²', ylabel: 'share of the work' });
  P.axes({ xticks: [0, 0.2, 0.4, 0.6] });
  const ws = Math.abs(m.work) > 1e-300 ? m.work : 1, tr = m.trace, xs = tr.map(r => r[0]);
  const so = tr.map(r => r[1] / ws), oo = tr.map(r => r[2] / ws);
  P.line(xs, so, { color: Viz.alpha(c.stored, 0.3), width: 2 }); P.line(xs, oo, { color: Viz.alpha(c.out, 0.3), width: 2 });
  const nNow = xs.filter(x => x <= s.tau + 1e-12).length;
  P.line(xs.slice(0, nNow).concat([s.tau]), so.slice(0, nNow).concat([m.f.stored / ws]), { color: c.stored, width: 3 });
  P.line(xs.slice(0, nNow).concat([s.tau]), oo.slice(0, nNow).concat([m.f.out / ws]), { color: c.out, width: 3 });
  P.dot(s.tau, m.f.stored / ws, 4.5, { color: c.stored }); P.dot(s.tau, m.f.out / ws, 4.5, { color: c.out });
  Viz.text(ctx, 'out', P.X(0.5), P.Y(oo[100]) - 11, { size: 12, color: c.out, weight: 700, align: 'center', bg: true });
  Viz.text(ctx, 'stored', P.X(0.5), P.Y(so[100]) - 11, { size: 12, color: c.stored, weight: 700, align: 'center', bg: true });
}

function statusOf(s) {
  const m = model(s), Wd = window.innerWidth || 1000, short = Wd < 560, mid = Wd < 1100;
  if (m.neg) return { text: '⛔ second law violated: μ < 0 ⇒ ε < 0' + (short ? '' : ' and entropy production ' + fp(m.pr.sg) + ' W/(kg K) < 0'), tone: 'bad' };
  if (!(Math.abs(m.work) > 1e-12)) return { text: '😴 no flow: no shear, no dissipation, no heating', tone: 'info' };
  const steadyNow = s.tau >= 0.47;
  const core = 'work in ' + fW(m.work) + ' = stored ' + fm(m.f.stored) + ' + out ' + fm(m.f.out);
  if (steadyNow) { const pc = Viz.fmt(100 * m.f.out / m.work, { sig: 3 }) + ' %';
    return { text: '🔥 nearly steady: ' + pc + ' of the work in' + (short ? '' : ' (' + fW(m.work) + ')') + ' leaves as heat' + (mid ? '' : ' · ΔT_max ' + fT(m.dTmaxS)), tone: 'good' }; }
  return { text: (short ? '🔥 ' : '🔥 heating up (' + Viz.fmtTime(m.t) + '): ') + core + (mid ? '' : ' W/m²'), tone: 'info' };
}
function regimeOf(s) {
  const m = model(s);
  if (m.neg) return 'neg';
  if (s.flow === 'poiseuille') return 'pois';
  if (s.mu >= 0.02) return 'oil';
  if (s.rho < 10) return 'air';
  if (s.flow === 'both') return 'both';
  return 'water';
}
function readingOf(s) {
  const m = model(s), r = regimeOf(s);
  switch (r) {
    case 'neg': return 'A negative viscosity would make ε = μ(du/dy)²/ρ negative: heat would turn back into motion by itself and the entropy production of (4.63), $\\frac{k}{\\rho T^2}|\\nabla T|^2+\\frac{\\varepsilon}{T}$, would fall below zero. The second law forbids it — that is why μ, μ_v and k are never negative.';
    case 'oil': return 'An oil film: ρε = ' + fm(m.epsAbs) + ' W/m³, ' + fm(m.epsAbs / 1000) + ' times the water case, and the film warms by ' + fT(m.dTmaxS) + '. Bearings need cooling; and since oil thins as it warms, real bearings feed back on themselves (not in this model).';
    case 'air': return 'Air: the heating is tiny (' + fT(m.dTmaxS) + ') although the wall is fast — μ is small. But air diffuses heat fast too: it settles in h²/κ = ' + Viz.fmtTime(m.tD) + '. Viscous heating in air matters only at high speed (Mach number near 1, Ch. 15).';
    case 'pois': return 'Pressure-driven flow: the shear, and so the dissipation, is largest at the walls and zero on the centre line. The heat is made near the walls, so the temperature bump is flatter than the Couette parabola; the work comes from the pressure, G∫u dy = ' + fW(m.work) + '.';
    case 'both': return 'Couette plus a pressure gradient: the shear is no longer uniform, so ρε is lopsided and the hottest point moves off the centre line (to y = ' + fm(m.peakY * 1e3) + ' mm now). The work in = wall work + pressure work = heat out still holds.';
    default: return 'Water at ' + fm(m.p.U) + ' m/s: every watt the wall puts in (' + fW(m.work) + ') becomes heat, yet the gap warms by only ' + fT(m.dTmaxS) + '. That is why viscous heating is dropped from the Boussinesq heat equation for most water and air flows.';
  }
}
function inspectOf(s) {
  const m = model(s), q = m.pr, p = m.p;

    '$\\rho\\varepsilon=\\mu\\big(\\tfrac{du}{dy}\\big)^2=' + tn(p.mu) + '\\times(' + tn(q.dudy) + ')^2=\\mathbf{' + tn(q.rhoEps) + '}$ W/m³<br>' +
