  // the table of the five settings (their own δT and L), current row lit
  const cols = ['setting', 'αδT', 'L/(c²/g)', 'heating', 'verdict'], cw = [0.27, 0.17, 0.19, 0.17, 0.2];
  const tx = 8, tw = v.w - 16, ty = hb, th = Math.min(24, (v.h - hb - 24) / 6);
  let xx = tx; const xs = cw.map(f => { const a = xx; xx += f * tw; return a; });
  cols.forEach((c, j) => Viz.text(ctx, c, xs[j] + 4, ty + th / 2, { size: 12, color: C.muted, weight: 700, maxWidth: cw[j] * tw - 6 }));
  NAMES.forEach((n, i) => {
    const p = SCEN[n], q = validity(p.alpha, p.dT, p.L, p.U, p.c, G, p.nu, p.cp), y = ty + th * (i + 1.5);
    if (n === s.sc) { ctx.save(); ctx.fillStyle = Viz.alpha(C.acc, 0.14); Viz.roundRect(ctx, tx, y - th / 2, tw, th, 5); ctx.fill(); ctx.restore(); }
    const cells = [EXTRA[n].name, fm(q.alphaDT, '', 2), fm(q.LHc, '', 2), fm(q.heat, '', 2), q.valid ? '✓ valid' : '✗ fails'];
    cells.forEach((c, j) => Viz.text(ctx, c, xs[j] + 4, y, { size: 12, color: j === 4 ? (q.valid ? C.teal : C.amber) : C.ink, weight: n === s.sc ? 700 : 500, maxWidth: cw[j] * tw - 6 }));
  });
  PL.validity = { ty, th, tx, tw };
  Viz.text(ctx, 'each setting at its own δT and L · click a row', tx + 4, Math.min(v.h - 9, ty + th * 6 + 12), { size: 12, color: C.muted, maxWidth: tw });
}

/* ---------------------------------------------------------------------------------------------------
   EXPLAIN — every number on the screen worked out with the reader's settings
   --------------------------------------------------------------------------------------------------- */
function explainHtml(s) {
  const W = Viz.work, M = model(s), P = M.P, V = M.V, X = EXTRA[s.sc], gas = M.gas;
  let o = W.step(0, 'What the views show') +
    W.say('A warm blob in cooler ' + fluidWord(s) + ' (' + X.long + '): <b class="c-rose">rose</b> = warmer. <b>Vertical momentum</b> shows the accelerations the Boussinesq equations keep — <b class="c-blue">buoyancy</b> $-g\\rho\'/\\rho_0$ is the engine, <b class="c-orange">drag</b> (our parcel model) the brake, <b class="c-teal">inertia</b> $Dw/Dt$ what is left — and, in grey, the one they drop. <b>Is Boussinesq valid?</b> compares four small numbers with their thresholds.') +
    W.hint('On phones the validity view is hidden: the verdict is in the status line and every number is worked out below.');
  o += W.step(1, 'The density change') +
    W.line('expansion coefficient $\\alpha$', fm(P.alpha, '1/K'), gas ? 'a perfect gas: α = 1/T₀ = 1/' + P.T0 + ' K' : 'measured for ' + P.fluid + ' near ' + Math.round(P.T0 - 273.15) + ' °C') +
    W.line('$\\delta\\rho/\\rho=\\alpha\\,\\delta T=' + tn(P.alpha) + '\\times' + tn(s.dT) + '$', fm(V.alphaDT), 'from the linear equation of state $' + EOS + '$') +
    W.line("$\\rho'=-\\rho_0\\alpha\\,\\delta T=-" + tn(X.rho0, 4) + '\\times' + tn(V.alphaDT) + '$', fm(M.rhoP, 'kg/m³'), 'lighter than its surroundings') +
    W.box("$|\\rho'|/\\rho_0=\\alpha\\,\\delta T=\\mathbf{" + tn(V.alphaDT) + '}$ — only ' + pct(V.alphaDT) + ' of the density');
  o += W.step(2, 'Reduced gravity') +
    W.line("$g'=g\\alpha\\,\\delta T=9.81\\times" + tn(V.alphaDT) + '$', fm(V.gp, 'm/s²'), 'the buoyancy per unit mass, $b=-g\\rho\'/\\rho_0$') +
    W.box("$g'=\\mathbf{" + tn(V.gp) + '}$ m/s² — ' + (s.buoy ? 'the blue bar' : 'switched off in the picture'));
  o += W.step(3, 'The depth limit') +
    W.line('sound speed $c$', fm(P.c, 'm/s'), 'in ' + P.fluid) +
    W.line('$H_c=c^2/g=' + tn(P.c, 4) + '^2/9.81$', fL(V.Hc), 'the height over which the fluid’s own weight squeezes it') +
    W.line('$L/H_c=' + tn(s.L) + '/' + tn(V.Hc, 4) + '$', fm(V.LHc), 'must be ≪ 1') +
    W.box('$L/(c^2/g)=\\mathbf{' + tn(V.LHc) + '}$ — ' + (V.LHc < 0.1 ? 'small: a thin layer' : 'not small: the layer is as deep as the fluid’s scale height'));
  o += W.step(4, 'Viscous heating and Mach number') +
    W.line('$\\dfrac{\\nu U}{C_p\\,\\delta T\\,L}=\\dfrac{' + tn(P.nu) + '\\times' + tn(P.U) + '}{' + tn(P.cp, 4) + '\\times' + tn(s.dT) + '\\times' + tn(s.L) + '}$', fm(V.heat), 'friction heat vs the heat the flow carries') +
    W.line('$M=U/c=' + tn(P.U) + '/' + tn(P.c) + '$', fm(V.mach), 'the §4.2 rule: M < 0.3') +
    W.box('heating ratio $\\mathbf{' + tn(V.heat) + '}$, Mach $\\mathbf{' + tn(V.mach) + '}$ — ' + (V.heat < 0.1 && V.mach < 0.3 ? 'both negligible' : 'not negligible'));
  const on = s.buoy;
  o += W.step(5, 'What is kept and what is dropped') +
    W.say('The momentum equation keeps density only next to $g$, $' + EQ86 + '$ (4.86). At the blob now:') +
    W.line("buoyancy $-g\\rho'/\\rho_0$", '<b class="c-blue">' + fm(M.b, 'm/s²') + '</b>', on ? 'kept: g is large' : 'switched off') +
    W.line('inertia $Dw/Dt$', '<b class="c-teal">' + fm(M.acc, 'm/s²') + '</b>', 'what is left after the drag') +
    W.line("dropped $(\\rho'/\\rho_0)Dw/Dt=-" + tn(V.alphaDT) + '\\times' + tn(M.acc) + '$', '<b class="c-muted">' + fm(M.dropped, 'm/s²') + '</b>', 'αδT times the inertia') +
    W.line('viscous $\\nu\\nabla^2w\\approx-2\\nu w/\\sigma^2$', fm(M.visc, 'm/s²'), 'molecular ν: tiny at this size') +
    W.box('the dropped term is $\\alpha\\,\\delta T=' + tn(V.alphaDT) + '$ of the inertia — ' + (V.alphaDT < 0.01 ? 'invisible' : V.alphaDT < 0.1 ? 'small' : 'no longer small'));
  o += W.step(6, 'The blob: rise and spread') +
    W.say('Our one-line parcel model (not the book’s): $dw/dt=g\'-w/\\tau_d$, with a drag time $\\tau_d=\\sqrt{L/(8g\'_{\\rm setting})}$ chosen so the setting’s own blob rises about half the depth in the run; the blob starts $\\sigma_0=0.1L$ wide.') +
    W.line('$\\tau_d$', fT(M.tauD), 'the run lasts 5τ_d = ' + fT(M.Tend)) +
    W.line("terminal speed $g'\\tau_d$", fm(M.b * M.tauD, 'm/s'), "scale $\\sqrt{g'L}=" + tn(M.Hsc) + '$ m/s') +
    W.line('eddy diffusivity $\\kappa=0.25\\sigma_0^2/\\tau_d$', fm(M.kappa, 'm²/s'), 'molecular κ (~10⁻⁷ m²/s in water, 2×10⁻⁵ in air) would not show') +
    W.line('$\\sigma=\\sqrt{\\sigma_0^2+2\\kappa t}$', Viz.live('sig'), 'the exact solution of $' + EQ89 + '$ (4.89)') +
    W.line('time $t$', Viz.live('t'), 'the transport clock') +
    W.line('rise speed $w$, height risen', Viz.live('wz'), 'from $w=g\'\\tau_d(1-e^{-t/\\tau_d})$') +
    W.line("peak $T'=\\delta T\\,(\\sigma_0/\\sigma)^2$", Viz.live('Tc'), 'heat spreads, the total stays');
  o += W.step(7, 'The heat equation keeps $C_p$') +
    W.say('Following the blob’s centre, $DT/Dt=\\kappa\\nabla^2T=' + tn(M.DTDt) + '$ K/s. The pressure work $p\\nabla\\cdot\\mathbf u=p\\alpha\\,DT/Dt$ (D28):') +
    W.line('$p\\alpha/(\\rho_0C_p)=' + tn(P_ATM, 4) + '\\times' + tn(P.alpha) + '/(' + tn(X.rho0, 4) + '\\times' + tn(P.cp, 4) + ')$', fm(P_ATM * P.alpha / (X.rho0 * P.cp)), gas ? '= R/C_p for a perfect gas' : 'tiny for a liquid') +
    W.box(gas ? 'the pressure work is ' + pct(P_ATM * P.alpha / (X.rho0 * P.cp)) + ' of $\\rho C_p\\,DT/Dt$ — it is what turns $C_v$ into $C_p$ in $' + EQ88 + '$ (4.88)' : 'for water the pressure work is negligible, and $C_p\\approx C_v$ anyway: $' + EQ88 + '$ (4.88) still holds');
  const rows = NAMES.map(n => { const p = SCEN[n], q = validity(p.alpha, p.dT, p.L, p.U, p.c, G, p.nu, p.cp); return [EXTRA[n].name, fm(q.alphaDT, '', 2), fm(q.LHc, '', 2), q.valid ? '✓' : '✗']; });
  const phone = (window.innerWidth || 1000) < 600;
  o += W.step(8, 'The five settings') + (phone
    ? rows.map((r, i) => W.line((NAMES[i] === s.sc ? '▶ <b>' + r[0] + '</b>' : r[0]) + ' ' + r[3], 'αδT ' + r[1], 'L/(c²/g) = ' + r[2])).join('')
    : W.table(['setting', 'αδT', 'L/(c²/g)', 'ok?'], rows, NAMES.indexOf(s.sc))) +
    W.hint('Each row uses the setting’s own δT and L; your sliders may differ.');
  let it;
  if (!s.buoy) it = 'Without the $\\rho\'\\mathbf g$ term nothing drives the blob: it only diffuses. The density still differs by ' + pct(V.alphaDT) + ' — Boussinesq keeps exactly the one term that matters.';
  else if (!V.valid && V.LHc >= 0.1) it = 'Over ' + fL(s.L) + ' the ' + P.fluid + '’s own weight compresses it: L is ' + fm(V.LHc) + ' of c²/g, so the density can no longer be treated as constant outside the gravity term — use the anelastic or fully compressible equations.' + (V.alphaDT >= 0.1 ? ' And αδT = ' + fm(V.alphaDT) + ' is not small either.' : '');
  else if (!V.valid) it = 'αδT = ' + fm(V.alphaDT) + ': the density differs by ' + pct(V.alphaDT) + '. The dropped inertia correction is now ' + pct(V.alphaDT) + ' of the inertia — Boussinesq is only a rough guide here.';
  else it = 'Density differs by only ' + pct(V.alphaDT) + ', yet the blob rises at up to ' + fm(M.b * M.tauD, 'm/s') + ': a tiny density difference acts on the whole mass through g (g′ = ' + fm(V.gp, 'm/s²') + '). Everywhere else — continuity, inertia, viscosity — the fluid behaves as if incompressible.';
  return o + W.interpret(it, 'Reading the current setting');
}

/* ---------------------------------------------------------------------------------------------------
   APP
   --------------------------------------------------------------------------------------------------- */
function SC(name, extra) { const p = SCEN[name]; return Object.assign({ sc: name, _scSet: name, dT: p.dT, L: p.L, buoy: true, tau: 0, mark: 'none', bmode: 'mom', probe: null }, extra || {}); }
function status(s) {
  const V = model(s).V, narrow = (window.innerWidth || 1000) < 600;
  if (V.valid) return { text: '✅ Boussinesq valid · αδT = ' + fm(V.alphaDT) + (narrow ? '' : ' · L/(c²/g) = ' + fm(V.LHc)) + (s.buoy ? '' : ' · buoyancy off'), tone: 'good' };
  if (V.fails.indexOf('LHc') >= 0) return { text: '⚠️ deep layer: L/(c²/g) = ' + fm(V.LHc) + (narrow ? '' : ' — use the anelastic or compressible equations'), tone: 'warn' };
  return { text: '⚠️ not Boussinesq: ' + V.verdict.replace('not Boussinesq: ', '') + (narrow ? '' : ' · αδT = ' + fm(V.alphaDT)), tone: 'warn' };
}
function inspectHtml(s) {
  const M = model(s), P = M.P, X = EXTRA[s.sc];
  const pr = s.probe || [0, M.zc], x = pr[0], z = pr[1];
  const s2 = M.sig * M.sig, r2 = x * x + (z - M.zc) * (z - M.zc), T = blob(x, z, M.t, M.bp);
  const rp = -X.rho0 * P.alpha * T, b = buoy(rp, X.rho0);
  return (s.probe ? 'At the clicked point' : 'At the blob’s centre') + ' $(x,z)=(' + tn(x) + ',\\ ' + tn(z) + ')$ m, $t=' + tn(M.t) + '$ s:<br>' +
    "$T'=\\delta T\\,\\frac{\\sigma_0^2}{\\sigma^2}e^{-r^2/2\\sigma^2}=" + tn(s.dT) + '\\times\\frac{' + tn(M.sigma0 * M.sigma0) + '}{' + tn(s2) + '}\\times e^{-' + tn(r2) + '/' + tn(2 * s2) + '}=\\mathbf{' + tn(T) + '}$ K<br>' +
    "$\\rho'=-\\rho_0\\alpha T'=-" + tn(X.rho0, 4) + '\\times' + tn(P.alpha) + '\\times' + tn(T) + '=' + tn(rp) + '$ kg/m³<br>' +
    "$b=-g\\rho'/\\rho_0=\\mathbf{" + tn(b) + '}$ m/s² ' + (s.buoy ? '' : '(the term is switched off in the picture)');
}
