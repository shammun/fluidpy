function explainHtml(s) {
  const W = Viz.work, axi = isAxi(s), gf = gateFlux(s), sp = spacing(s), lv = levelsOf(s), k = probeKind(s), x = s.px, y = s.py, u2 = U2(s);
  let o = W.step(0, 'What the views show') +
    W.say(`<b>The flow</b>: black lines are contours of ψ drawn at <b>equal steps</b> Δψ; the colours show the speed (dark = slow, yellow = fast); white tracers move with the fluid. The <b class="c-orange">orange</b> gate is a line you drag (three handles); the <b class="c-teal">teal</b> contours pass through its ends, with the band between them shaded. The <b class="c-accent">purple</b> probe carries the velocity arrow; the <b class="c-amber">amber</b> dashed line through it crosses the contours at right angles. <b>Along the gate</b> plots the velocity crossing the gate (orange) and ψ (teal). <b>Spacing = speed</b> compares the gap between contours with the local speed. Rose marks stagnation points (✕), singular points (●) and special streamlines.`) +
    W.hint('On portrait phones the Spacing view is hidden (its numbers are in section 4); outside the walkthrough, and on landscape phones, the Along-the-gate view is hidden too (its number is in the gate label and the status line).');
  // 1
  o += W.step(1, 'The flow you chose') +
    W.line(`$${PSITEX[s.flow]}$ with $${qTex(s)}$`, '', axi ? 'Stokes stream function; the view is the (z, R) plane' : FNAME[s.flow]) +
    (k === 'solid' || k === 'sing' ? W.say('The probe sits inside the body or on a singular point; move it to read ψ.') :
      W.line(`at the probe $(${tx(x, 2)},\\,${tx(y, 2)})$ m: $\\psi$`, F(psiS(s, x, y)) + ' ' + u2, axi ? '$\\tfrac12UR^2$ with R = |y|' : 'ρ = 1: ψ is a volume flux per metre of depth')) +
    W.line('contour step $\\Delta\\psi$', F(lv.d) + ' ' + (axi ? 'm³/s' : 'm²/s'), `a round number near (range of ψ)/${s.levels}`);
  // 2
  o += W.step(2, 'Velocity from ψ at the probe');
  if (k === 'solid' || k === 'sing') o += W.say('No velocity to read here: the probe is inside the cylinder or on the singular point.');
  else if (axi) {
    const R = Math.abs(y), u = R > 1e-5 ? velAxi(R, x, s.q) : [0, s.q];
    o += W.line('$u_z=\\dfrac1R\\dfrac{\\partial\\psi}{\\partial R}=\\dfrac{UR}{R}$', F(u[1]) + ' m/s', 'χ = −φ: the axisymmetric form after Fig. 4.1') +
      W.line('$u_R=-\\dfrac1R\\dfrac{\\partial\\psi}{\\partial z}$', F(u[0]) + ' m/s', 'ψ does not depend on z') +
      W.box(`<b class="c-accent">speed $=\\mathbf{${T(Math.hypot(u[0], u[1]))}}$ m/s</b> everywhere — a uniform stream along the axis.`);
  } else {
    const fd = velFD(s.flow, x, y, prm(s)), ex = vel(s.flow, x, y, prm(s));
    o += W.line('$u=\\partial\\psi/\\partial y$ (central difference, h = 10⁻⁵ m)', F(fd[0]) + ' m/s', 'D04: ρu = ∂ψ/∂y with χ = −z, ρ = 1') +
      W.line('$v=-\\partial\\psi/\\partial x$', F(fd[1]) + ' m/s', 'the minus sign comes from −e_z × ∇ψ') +
      W.line('closed form of the flow', `(${F(ex[0])}, ${F(ex[1])}) m/s`, 'the same numbers from the formula for u') +
      W.box(`<b class="c-accent">$|\\mathbf u|=\\sqrt{u^2+v^2}=\\mathbf{${T(Math.hypot(ex[0], ex[1]))}}$ m/s</b> — the purple arrow; it is tangent to the black contour through the probe.`);
  }
  // 3
  o += W.step(3, 'Flux through the gate') +
    W.line('$\\psi_1$ at the start handle', F(gf.psi1) + ' ' + u2) +
    W.line('$\\psi_2$ at the end handle', F(gf.psi2) + ' ' + u2, gf.wrapped ? `the gate crosses the line behind the source where θ jumps by 2π; following ψ continuously gives this value (the formula's principal value is ${F(gf.psiB)})` : '') +
    (axi ? W.line(`$Q=2\\pi(\\psi_2-\\psi_1)=2\\pi\\times${T(gf.dpsi)}$`, F(gf.flux) + ' m³/s', 'flow rate through the surface swept by turning the gate round the axis') : '') +
    W.box(`<b class="c-orange">${axi ? 'flow rate' : 'flux per metre of depth'} $=${axi ? '2\\pi(\\psi_2-\\psi_1)' : '\\psi_2-\\psi_1'}=\\mathbf{${T(gf.flux)}}$ ${u2}</b>`) +
    W.line(`numeric ${axi ? '$2\\pi\\int R\\,\\mathbf u\\cdot\\mathbf n\\,ds$' : '$\\int\\mathbf u\\cdot\\mathbf n\\,ds$'} along your gate (64 Gauss points per segment)`, F(gf.num, 6) + ' ' + u2, 'n points to the right of the direction start → end') +
    W.line('difference', Viz.fmt(Math.abs(gf.num - gf.flux), { sig: 2, keepTiny: true }) + ' ' + u2, gf.near ? 'the gate passes close to a singular point: the quadrature struggles there' : 'round-off: bend the gate — only the end labels matter');
  // 4
  o += W.step(4, 'Spacing and speed');
  if (sp.ok && sp.here) {
    const h = sp.here;
    o += W.line('between neighbouring contours', F(h.dpsi, 3) + ' m²/s', 'Δψ: the same flux in every band') +
      W.line('their gap along the normal through the probe', 'Δn = ' + F(h.dn, 3) + ' m', 'the amber dashed line') +
      (axi ? W.line(`$|\\mathbf u|\\approx\\dfrac{\\Delta\\psi}{R\\,\\Delta n}=\\dfrac{${T(h.dpsi, 3)}}{${T(h.R, 3)}\\times${T(h.dn, 3)}}$`, F(h.est, 3) + ' m/s', 'the ring at radius R has circumference 2πR')
        : W.line(`$|\\mathbf u|\\approx\\dfrac{\\Delta\\psi}{\\Delta n}=\\dfrac{${T(h.dpsi, 3)}}{${T(h.dn, 3)}}$`, F(h.est, 3) + ' m/s', 'a narrow band must be fast to carry the same Δψ')) +
      W.box(`estimate <b class="c-amber">${F(h.est, 3)} m/s</b> vs true speed <b class="c-accent">${F(sp.sp, 3)} m/s</b> at the probe (the estimate is the band's average; more contours make it sharper).`);
  } else o += W.say({ stag: 'The probe is at a stagnation point: ∇ψ = 0, the contours cross and the gap has no meaning — the speed is zero.', rest: 'On y = 0 the shear flow is at rest: the neighbouring contours are infinitely far apart.', axis: 'On the axis the ring has no area: move the probe off the axis.' }[sp.kind] || 'Move the probe into the fluid to measure a gap.');
  o += W.hint('The Spacing view is hidden on portrait phones; these are its numbers.');
  // 5
  const dv = divAt(s);
  o += W.step(5, 'Continuity is automatic, (4.11) $\\nabla\\cdot(\\rho\\mathbf u)=0$') +
    W.say('Any ψ gives a velocity that conserves mass, because $\\dfrac{\\partial u}{\\partial x}+\\dfrac{\\partial v}{\\partial y}=\\psi_{yx}-\\psi_{xy}=0$ (mixed derivatives are equal).') +
    (axi ? W.line('$\\dfrac1R\\dfrac{\\partial(Ru_R)}{\\partial R}+\\dfrac{\\partial u_z}{\\partial z}$', '0 s⁻¹', 'u_R = 0 and u_z does not change with z')
      : W.line('$\\partial u/\\partial x+\\partial v/\\partial y$ at the probe (central differences)', k === 'solid' || k === 'sing' ? '—' : Viz.fmt(dv, { sig: 2, keepTiny: true }) + ' s⁻¹', 'zero up to round-off'));
  // 6
  o += W.step(6, 'At the current time') + W.line('$t$', Viz.live('t') + ' s', 'the tracers have moved this long; each stays on its black contour') +
    W.line('tracers on screen', String(tracers ? tracers.list.length : 0), 'respawned when they leave the view or age');
  return o + W.interpret(readingText(s), 'Reading the current setting');
}
