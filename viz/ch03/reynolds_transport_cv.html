    if (Math.abs(s.adot) > 1e-9) Viz.text(ctx, 'ȧ = ' + fx(s.adot, 2), P.X(g0.a) + (s.adot < 0 ? 8 : -8), P.Y(ya) + 15, { size: 12, color: col(s.adot <= 0), align: s.adot < 0 ? 'left' : 'right', bg: true });
    if (Math.abs(s.bdot) > 1e-9) Viz.text(ctx, 'ḃ = ' + fx(s.bdot, 2) + ' m/s', P.X(g0.b) + (s.bdot > 0 ? -8 : 8), P.Y(ya) + 15, { size: 12, color: col(s.bdot >= 0), align: s.bdot > 0 ? 'right' : 'left', bg: true });
    legend(v, P, [['∂F/∂t·Δt in place', blue], ['swept in', orange], ['swept out', rose], ['- - F at t + Δt', muted]]) ||
      legend(v, P, [['in place', blue], ['in', orange], ['out', rose]]);
  }
}

function range2d(s) {
  let xl = Infinity, xh = -Infinity, yh = 0;
  validTimes(s).forEach(tt => [0, DTV].forEach(d => { const E = ell(s, tt + d); if (E.a <= 0 || E.b <= 0) return; xl = Math.min(xl, E.cx - E.a); xh = Math.max(xh, E.cx + E.a); yh = Math.max(yh, E.b); }));
  return { x: [xl - 0.45, xh + 0.45], y: [-yh - 0.35, yh + 0.35] };
}
function ellPt(E, sp) { return [E.cx + E.a * Math.cos(sp), E.cy + E.b * Math.sin(sp)]; }
function ellNormal(E, sp) { const c = Math.cos(sp), sn = Math.sin(sp), d = Math.hypot(E.b * c, E.a * sn); return [E.b * c / d, E.a * sn / d]; }

function draw2d(v, s, app) {
  const t = s.t, der = app.tab === 'derive' ? s.mark : null, small = v.w < 300, ctx = v.ctx;
  const R = range2d(s), c = coef(s.F);
  const P = v.plot({ xlim: R.x, ylim: R.y, equal: true, xlabel: 'x₁ [m]', ylabel: small ? '' : 'x₂ [m]' });
  cvP = P;
  // heat map of F at time t (fixed colour range over the whole run)
  let fmin = Infinity, fmax = -Infinity;
  [P.xlim[0], P.xlim[1]].forEach(x => [0, TMAX].forEach(tt => { const f = F(s.F, x, tt); fmin = Math.min(fmin, f); fmax = Math.max(fmax, f); }));
  if (fmax - fmin < 1e-9) { fmin -= 0.3; fmax += 4; }
  Viz.field.heatmap(P, (x) => F(s.F, x, t), { cmap: 'sand', vmin: fmin, vmax: fmax, nx: 90, ny: 6 });
  P.axes({ grid: false, yticks: inTicks(P, 'y', Math.max(2, Math.round(P.px.h / 60))), xticks: inTicks(P, 'x', Math.max(2, Math.round(P.px.w / 90))) });
  const blue = Viz.color('blue'), orange = Viz.color('orange'), rose = Viz.color('rose'), text = Viz.color('text'), acc = Viz.color('accent'), muted = Viz.color('muted');

  const E0 = ell(s, t), dv = Math.max(s.dt, DTV), E1 = ell(s, t + dv);
  const labels = [];
  P.clip(() => {

    if (c.c1 > 0) {
      const step = (fmax - fmin) > 3 ? 1 : 0.5;
      for (let Fl = Math.ceil(fmin / step) * step; Fl <= fmax + 1e-9; Fl += step) {
        const x = (Fl - 1 - c.c2 * t) / c.c1;
        if (x <= P.xlim[0] || x >= P.xlim[1]) continue;
        P.line([x, x], [P.ylim[0], P.ylim[1]], { color: Viz.alpha(muted, 0.55), width: 1, dash: [2, 4] });
        labels.push([x, Fl]);
      }
    }
    // inside: F changes in place (blue) when ∂F/∂t ≠ 0
    const ring = []; for (let k = 0; k <= 96; k++) ring.push(ellPt(E0, 2 * Math.PI * k / 96));
    if (Math.abs(c.c2) > 0) polyFill(P, ring, Viz.alpha(blue, der === 'vol' ? 0.38 : 0.16));
    // the swept band: orange where the wall advances (b·n > 0), rose where it retreats
    const band = der === 'band' ? 0.8 : 0.6;
    for (let k = 0; k < 96; k++) {
      const s0 = 2 * Math.PI * k / 96, s1 = 2 * Math.PI * (k + 1) / 96, sm = 0.5 * (s0 + s1), n = ellNormal(E0, sm), b = ellB(E0, sm), bn = b[0] * n[0] + b[1] * n[1];
      if (Math.abs(bn) < 1e-9) continue;
      polyFill(P, [ellPt(E0, s0), ellPt(E0, s1), ellPt(E1, s1), ellPt(E1, s0)], Viz.alpha(bn > 0 ? orange : rose, band));
    }
    P.poly(ring, { color: text, width: 2.2 });
    const ring1 = []; for (let k = 0; k <= 96; k++) ring1.push(ellPt(E1, 2 * Math.PI * k / 96));
    P.poly(ring1, { color: Viz.alpha(text, 0.7), width: 1.4, dash: [6, 5] });
    // wall velocity b at 24 boundary points (arrow = 1.2 s of motion)
    for (let k = 0; k < NB; k++) { const sp = 2 * Math.PI * k / NB, p = ellPt(E0, sp), b = ellB(E0, sp); P.arrow(p[0], p[1], b[0] * ARR, b[1] * ARR, { color: Viz.alpha(text, 0.8), width: 1.5, head: 6 }); }

    if (Math.abs(s.cdot) > 1e-9) P.arrow(E0.cx, E0.cy, s.cdot * ARR * 1.5, 0, { color: acc, width: 2.2, head: 8 });

    if (pk != null) {
      const sp = 2 * Math.PI * pk / NB, p = ellPt(E0, sp), n = ellNormal(E0, sp), b = ellB(E0, sp), L = 0.18 * Math.min(E0.a, E0.b) + 0.25;

      }

      P.arrow(p[0], p[1], b[0] * ARR, b[1] * ARR, { color: text, width: 3, head: 9 });
      P.dot(p[0], p[1], 6.5, { color: Viz.color('card'), stroke: acc, strokeWidth: 2.6 });
    }
  });
  if (!small) labels.forEach(([x, Fl]) => { if (P.X(x) > P.px.x + 30 && P.X(x) < P.px.x + P.px.w - 30) Viz.text(ctx, 'F = ' + (Math.round(Fl * 10) / 10), P.X(x), P.px.y + P.px.h - 12, { size: 12, color: muted, align: 'center', bg: true }); });
  if (!small) legend(v, P, [['swept in (b·n > 0)', orange], ['swept out', rose], ['→ b', text], ['- - t + Δt', muted]]) || legend(v, P, [['in', orange], ['out', rose], ['→ b', text]]);
}

function drawCone(v, s, app) {
  const t = s.t, small = v.w < 300, ctx = v.ctx, h = s.h;
  const r = coneR(s, t), dv = Math.max(s.dt, DTV), r1 = coneR(s, t + dv), rmax = coneR(s, TMAX);
  const P = v.plot({ xlim: [-1.12 * rmax - 0.05, 1.12 * rmax + 0.05], ylim: [-0.06 * h, 1.2 * h], equal: true, xlabel: 'R [m]', ylabel: small ? '' : 'z [m]' });
  P.axes({ grid: false, yticks: inTicks(P, 'y', Math.max(2, Math.round(P.px.h / 60))), xticks: inTicks(P, 'x', Math.max(2, Math.round(P.px.w / 90))) });
  cvP = P;
  const orange = Viz.color('orange'), text = Viz.color('text'), acc = Viz.color('accent'), teal = Viz.color('teal'), muted = Viz.color('muted');
  const th = Math.atan2(r, h), n = [Math.cos(th), -Math.sin(th)], pk = probeOf(s);
  P.clip(() => {
    polyFill(P, [[0, 0], [-r, h], [r, h]], Viz.alpha(teal, 0.14));
    polyFill(P, [[0, 0], [r, h], [r1, h]], Viz.alpha(orange, 0.6));
    polyFill(P, [[0, 0], [-r, h], [-r1, h]], Viz.alpha(orange, 0.6));
    P.poly([[-r1, h], [0, 0], [r1, h]], { color: Viz.alpha(text, 0.7), width: 1.4, dash: [6, 5] });
    P.poly([[-r, h], [0, 0], [r, h], [-r, h]], { color: text, width: 2.2 });
    // wall velocity on the sloping side: b = (z/h) ṙ e_R (arrow = 2.5 s of motion)
    [0.25, 0.5, 0.75, 1].forEach((f, k) => {
      const z = f * h, x = f * r, bl = f * s.rdot * 2.5;
      [1, -1].forEach(sd => P.arrow(sd * x, z, sd * bl, 0, { color: Viz.alpha(text, 0.85), width: pk === k && sd > 0 ? 3 : 1.7, head: 7 }));
      if (pk === k) { P.arrow(x, z, n[0] * 0.25 * h, n[1] * 0.25 * h, { color: acc, width: 2.6, head: 9 }); P.dot(x, z, 6.5, { color: Viz.color('card'), stroke: acc, strokeWidth: 2.6 }); }
    });
    if (pk == null) P.arrow(0.5 * r, 0.5 * h, n[0] * 0.22 * h, n[1] * 0.22 * h, { color: acc, width: 2.4, head: 8 });
    // base: points slide within the base plane (b ∥ base, so b·n = 0)
    [0.45, -0.45].forEach(f => P.arrow(f * r, h, f * s.rdot * 2.5, 0, { color: Viz.alpha(muted, 0.95), width: 1.6, head: 6 }));
    P.arrow(0, h, 0, 0.14 * h, { color: Viz.alpha(acc, 0.7), width: 1.8, head: 7 });
  });
  const roomy = P.px.h > 150 && P.px.w > 260;
  if (P.px.h > 100) Viz.text(ctx, 'base: b·n = 0', P.X(0) + 8, P.Y(1.1 * h), { size: 12, color: muted, bg: true });
  if (roomy) {
    Viz.text(ctx, 'h = ' + fx(h, 2) + ' m', P.X(0) - 6, P.Y(0.62 * h), { size: 12, color: text, align: 'right', bg: true });
    Viz.text(ctx, 'r = ' + fx(r, 3) + ' m', P.X(r) + 8, P.Y(h), { size: 12, color: text, bg: true });
    legend(v, P, [['swept by the side', orange], ['→ b', text], ['→ n', acc]], P.px.y + P.px.h - 12);
  }
}

function drawCV(g, s) {
  const v = g.view('cv'); v.clear(); cvP = null;
  if (v.w < 30 || v.h < 30) return;
  if (s.mode === '1d') draw1d(v, s, g.app); else if (s.mode === '2d') draw2d(v, s, g.app); else drawCone(v, s, g.app);
  if (g.app.holding && g.app.tab !== 'derive') {

    Viz.card(v.ctx, v.w / 2, 26, [`Over ${fx(T.tEnd, 1)} s: ∫F changed by ${fx(T.dI)} ${u.I};`, `∫(volume term)dt = ${fx(T.iv)}, ∫(surface term)dt = ${fx(T.is)} — they add up.`], { maxWidth: Math.min(v.w - 16, 420) });
  }
}

function drawBars(g, s) {
  const v = g.view('bars'); v.clear();
  if (v.w < 30 || v.h < 30) return;
  if (g.app.tab === 'derive' && s.mark === 'four') return drawFour(v, s);
  const B = budget(s), u = U(s), ctx = v.ctx, small = v.w < 330;
  if (B.collapsed) { Viz.card(ctx, v.w / 2, v.h / 2, ['No region left: no budget.'], { color: Viz.color('rose') }); return; }
  const c1 = B.vol, c2 = c1 + B.adv, c3 = c2 + B.ret;
  const vals = [0, c1, c2, c3, B.total, B.meas];
  let lo = Math.min(...vals), hi = Math.max(...vals); const span = Math.max(hi - lo, 0.05);
  lo -= 0.14 * span; hi += 0.36 * span; if (lo > 0) lo = 0;
  const P = v.plot({ xlim: [0, 4.3], ylim: [lo, hi], ylabel: v.h > 120 && !small ? 'rate [' + u.R + ']' : '', pad: { b: 26 } });
  P.axes({ xticks: [], yticks: inTicks(P, 'y', Math.max(2, Math.round(P.px.h / 45))) });
  const cols = [Viz.color('blue'), Viz.color('orange'), Viz.color('rose'), Viz.color('accent')];
  const bars = [[0, c1, 'in place'], [c1, c2, 'swept in'], [c2, c3, 'swept out'], [0, B.total, 'total']];
  const focus = s.focus;
  bars.forEach(([y0, y1, name], i) => {
    const X0 = P.X(i + 0.16), X1 = P.X(i + 0.84), Ya = P.Y(Math.max(y0, y1)), Yb = P.Y(Math.min(y0, y1)), hgt = Math.max(1.5, Yb - Ya);
    const dim = focus && ((focus === 'vol' && i !== 0) || (focus === 'adv' && i !== 1) || (focus === 'ret' && i !== 2)) && i !== 3;
    ctx.save(); ctx.globalAlpha = dim ? 0.3 : 1;
    if (i === 2) hatchRect(ctx, X0, Ya, X1 - X0, hgt, cols[i]);
    else { ctx.fillStyle = Viz.alpha(cols[i], 0.85); ctx.fillRect(X0, Ya, X1 - X0, hgt); }
    ctx.restore();
    if (i < 3) { ctx.save(); ctx.strokeStyle = Viz.alpha(Viz.color('text'), 0.45); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X1, P.Y(y1)); ctx.lineTo(P.X(i + 1.16), P.Y(y1)); ctx.stroke(); ctx.restore(); }
    const val = i === 3 ? B.total : y1 - y0, up = val >= 0, lab = (i === 3 ? '' : (val >= 0 ? '+' : '')) + fx(val);
    if ((X1 - X0) < 60 && hgt >= 18 && i !== 2) Viz.text(ctx, lab, 0.5 * (X0 + X1), 0.5 * (Ya + Yb), { size: 12, color: '#fff', align: 'center', halo: false, weight: 700 });
    else Viz.text(ctx, lab, 0.5 * (X0 + X1), Math.max(P.px.y + 8, Math.min(P.px.y + P.px.h - 8, up ? Ya - 9 : Yb + 9)), { size: 12, color: cols[i], align: 'center', bg: true, weight: 700 });
    Viz.text(ctx, small && name === 'swept out' ? 'out' : small && name === 'swept in' ? 'in' : small && name === 'in place' ? 'place' : name, 0.5 * (X0 + X1), P.px.y + P.px.h + 13, { size: 12, color: cols[i], align: 'center' });
  });
  // the measured rate: grey diamond on the total bar
  const X = P.X(4.04), Y = P.Y(B.meas);
  ctx.save(); ctx.beginPath(); ctx.moveTo(X, Y - 8); ctx.lineTo(X + 8, Y); ctx.lineTo(X, Y + 8); ctx.lineTo(X - 8, Y); ctx.closePath();
  ctx.fillStyle = Viz.color('card'); ctx.fill(); ctx.strokeStyle = Viz.color('muted'); ctx.lineWidth = 2.6; ctx.stroke(); ctx.restore();
}
/** D22 steps 3–5: the four terms of (3.32) on a log scale — their orders of smallness. */
function drawFour(v, s) {
  const w = sweptNow(s), ctx = v.ctx, items = [['T1 old amount', w.T1, Viz.color('muted')], ['T2 Δt·∫∂F/∂t', w.T2, Viz.color('blue')], ['T3 ∫ΔV F', w.T3, Viz.color('orange')], ['T4 dropped', w.T4, Viz.color('text')]];
  const mags = items.map(i => Math.abs(i[1])).filter(m => m > 1e-300);
  const top = Math.ceil(Math.log10(Math.max(...mags, 1e-12)) + 0.3), bot = Math.min(top - 3, Math.floor(Math.log10(Math.min(...mags, 1))) - 1);
  const P = v.plot({ xlim: [bot, top], ylim: [0, 4], xlabel: '|term| (log scale) [' + U(s).I + ']', pad: { l: 12 } });
  P.axes({ xticks: [], yticks: [], grid: false });
  const every = Math.max(1, Math.ceil((top - bot) / Math.max(2, Math.floor(P.px.w / 55))));
  ctx.save(); ctx.strokeStyle = Viz.color('grid'); ctx.beginPath();
  for (let e = bot; e <= top; e++) { const X = Math.round(P.X(e)) + 0.5; ctx.moveTo(X, P.px.y); ctx.lineTo(X, P.px.y + P.px.h); } ctx.stroke(); ctx.restore();
  for (let e = bot; e <= top; e += every) Viz.text(ctx, dec(e), P.X(e), P.px.y + P.px.h + 11, { size: 12, color: Viz.color('axis'), align: 'center', halo: false });
  items.forEach(([name, val, col], i) => {
    const yc = 3.5 - i, Y0 = P.Y(yc + 0.32), Y1 = P.Y(yc - 0.32), m = Math.abs(val), X1 = m > 0 ? P.X(Math.max(bot, Math.log10(m))) : P.X(bot);
    ctx.save(); ctx.fillStyle = Viz.alpha(col, 0.75); ctx.fillRect(P.X(bot), Y0, Math.max(1, X1 - P.X(bot)), Y1 - Y0); ctx.restore();
    Viz.text(ctx, name + ' = ' + (m > 0 ? fs3(val) : '0'), P.px.x + 6, 0.5 * (Y0 + Y1), { size: 12, color: Viz.color('text'), bg: true });
  });

function drawLimit(g, s) {
  const v = g.view('limit'); v.clear(); limP = null;
  if (v.w < 30 || v.h < 30) return;
  const ctx = v.ctx, small = v.w < 330, dts = Viz.num.linspace(-4, 0, 50).map(e => Math.pow(10, e)), ZERO = 0;
  if (budget(s).collapsed) { Viz.card(ctx, v.w / 2, v.h / 2, ['No region left.'], { color: Viz.color('rose') }); return; }
  const rows = dts.map(d => sweptFast(s, d));
  const cur = sweptFast(s, s.dt);
  const series = [['T4', 'T4 dropped', Viz.color('text'), []], ['serr', 'sliver error', Viz.color('teal'), []], ['qerr', 'quotient − RTT', Viz.color('accent'), [6, 4]]];
  let ymin = Infinity, ymax = -Infinity;
  series.forEach(sr => rows.forEach(r => { const m = Math.abs(r[sr[0]]); if (m > ZERO) { ymin = Math.min(ymin, Math.log10(m)); ymax = Math.max(ymax, Math.log10(m)); } }));
  const allZero = !isFinite(ymin);
  if (allZero) { ymin = -10; ymax = 0; }
  const yl = [Math.floor(ymin) - 0.2, Math.ceil(ymax) + 0.6];
  const P = v.plot({ xlim: [-4, 0], ylim: yl, xlabel: 'Δt [s]', ylabel: small ? '' : '|term| [' + U(s).I + ']' });
  P.axes({ xticks: [], yticks: [], grid: false });
  limP = P;
  // decade grid and labels
  const ey = []; for (let e = Math.ceil(yl[0]); e <= Math.floor(yl[1]); e++) ey.push(e);
  const everyY = Math.max(1, Math.ceil(ey.length / Math.max(2, Math.floor(P.px.h / 28))));
  ctx.save(); ctx.strokeStyle = Viz.color('grid'); ctx.beginPath();
  ey.forEach(e => { const Y = Math.round(P.Y(e)) + 0.5; ctx.moveTo(P.px.x, Y); ctx.lineTo(P.px.x + P.px.w, Y); });
  [-4, -3, -2, -1, 0].forEach(e => { const X = Math.round(P.X(e)) + 0.5; ctx.moveTo(X, P.px.y); ctx.lineTo(X, P.px.y + P.px.h); });
  ctx.stroke(); ctx.restore();
  ey.forEach((e, i) => { if (i % everyY === 0 && P.Y(e) > P.px.y + 7) Viz.text(ctx, dec(e), P.px.x - 4, P.Y(e), { size: 11.5, color: Viz.color('axis'), align: 'right', halo: false }); });
  [-4, -3, -2, -1, 0].forEach(e => { if (!small || e % 2 === 0) Viz.text(ctx, e === 0 ? '1' : dec(e), P.X(e), P.px.y + P.px.h + 10, { size: 11.5, color: Viz.color('axis'), align: 'center', halo: false }); });
  const X = dts.map(d => Math.log10(d));
  P.clip(() => {
    // slope-2 guide through the T4 (or sliver-error) curve at Δt = 10⁻², shifted up ×4
    const ref = series.find(sr => Math.abs(sweptFast(s, 0.01)[sr[0]]) > ZERO && sr[0] !== 'qerr');
    if (ref) { const y0 = Math.log10(Math.abs(sweptFast(s, 0.01)[ref[0]])) + 0.6; P.line([-4, 0], [y0 - 4, y0 + 4], { color: Viz.alpha(Viz.color('muted'), 0.8), width: 1.2, dash: [3, 4] }); }
    series.forEach(sr => {
      const ys = rows.map(r => { const m = Math.abs(r[sr[0]]); return m > ZERO ? Math.log10(m) : NaN; });
      P.line(X, ys, { color: sr[2], width: 2.4, dash: sr[3] });
      const m = Math.abs(cur[sr[0]]); if (m > ZERO) P.dot(Math.log10(s.dt), Math.log10(m), 5, { color: sr[2], stroke: '#fff', strokeWidth: 1.5 });
    });
    P.line([Math.log10(s.dt), Math.log10(s.dt)], yl, { color: Viz.alpha(Viz.color('text'), 0.5), width: 1.2 });
  });
  const LEG = [['|T4| (dropped)', Viz.color('text')], ['|sliver error|', Viz.color('teal')], ['|quotient − RTT|', Viz.color('accent')], ['slope 2', Viz.color('muted')]];
  legend(v, P, LEG) || legend(v, P, LEG.slice(0, 2)) || null;
  if (allZero && P.px.h > 50) Viz.card(ctx, P.px.x + P.px.w / 2, P.px.y + P.px.h / 2, ['Every dropped piece is exactly 0 here:', 'the box carries F with it.'], { color: Viz.color('teal') });
  else if ((s.mode === 'cone' || Math.abs(coef(s.F).c2) < 1e-12) && P.px.h > 70) Viz.text(ctx, 'T4 ≡ 0 here: ∂F/∂t = 0 (no black line)', P.px.x + P.px.w - 6, P.px.y + P.px.h - 12, { size: 12, color: Viz.color('text'), align: 'right', bg: true });
}

/* view titles: phones get the key numbers only */
function cvTitle(s) {
  const B = budget(s), u = U(s), wc = widthClass();
  if (B.collapsed) return '<b>The control volume</b> · the walls have met';
  const der = s.mark && (s.mark === 'four' || s.mark === 'limit') ? 'T4 = ' + fs3(sweptNow(s).T4) + ' · ' : '';
  const band = s.dt < DTV ? ` · bands show ${fx(DTV, 1)} s of motion` : '';
