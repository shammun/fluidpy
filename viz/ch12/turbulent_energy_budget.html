.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }

.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }

    W.say(TX`The plotted quantity is <b>minus</b> the correlation: $\overline{uv}<0$ wherever $dU/dy>0$ (slow fluid moving up, fast fluid moving down), so $-\overline{uv}\ge0$ here.`);

    W.box(TX`<b class="c-orange">production</b> $P=-\overline{uv}\,\dfrac{dU}{dy}=` + t3(b.uv_plus) + TX`\times` + t3(b.slope) + TX`=\mathbf{` + t3(b.production) + TX`}$ (in $u_*^4/\nu$)`) +
    W.say(TX`In the mean-flow budget $` + EQ46I + TX`$ (12.46) it appears as $+\overline{u_iu_j}\,\partial U_i/\partial x_j$: a <b>loss</b>, because $\overline{uv}<0$.`) +
    W.say(TX`In the turbulent budget $` + EQ47I + TX`$ (12.47) it appears as $-\overline{u_iu_j}\,\partial U_i/\partial x_j$: the same number, as a <b>gain</b>.`) +
    W.line(TX`<b class="c-accent">mean flow</b>: work $+$ transport $-$ direct $-$ $P$ $=` + t3(b.pressure_work) + (b.transport < 0 ? '-' : '+') + t3(Math.abs(b.transport)) + '-' + t3(b.mean_dissipation) + '-' + t3(b.production) + '$', '0', TX`work $=U^+/\mathrm{Re}_\tau$; transport $=d(U^+\bar\tau^+)/dy^+$`) +
    W.line(TX`<b class="c-teal">turbulence</b>: $P-\text{sink}=` + t3(b.production) + '-' + t3(b.turb_sink) + '$', '0', 'the sink (dissipation and transport together) is the remainder, not a model of either');
  out += W.step(3, 'Where production peaks') +
    W.say(TX`$P=(\bar\tau^+-s)\,s$ with $s=dU^+/dy^+$. For a given total stress the product is largest when $s=\bar\tau^+/2$: the <b class="c-rose">viscous</b> and <b class="c-orange">Reynolds</b> stresses are equal, and $P=\bar\tau^{+2}/4\le\tfrac14$.`) +
    W.line(TX`the stresses cross (◆) at $y^+=` + t4(d.pk.yeq) + TX`$: $\dfrac{\bar\tau^{+2}}4=\dfrac{{` + t4(d.pk.tau) + TX`}^2}4$`, f4(d.pk.Peq), 'both stresses are $' + t3(d.pk.tau / 2) + '$ there') +
    W.box(TX`exact maximum of $P(y^+)$: $P_{max}=\mathbf{` + t4(d.pk.P) + TX`}$ at $y^+=` + t4(d.pk.y) + '$') +
    W.say(TX`The maximum sits ` + f2(d.pk.yeq - d.pk.y) + TX` wall unit below the crossing because $\bar\tau^+$ itself falls slowly with height; the two values of $P$ differ by only ` + Viz.fmt(100 * (1 - d.pk.Peq / d.pk.P), { sig: 1 }) + ' %.') +

  const hs = [2, d.pk.y, 30, 100, 0.5 * d.Ret].filter(y => y < d.Ret), near = hs.reduce((k, y, i) => (Math.abs(Math.log(y / d.yp)) < Math.abs(Math.log(hs[k] / d.yp)) ? i : k), 0);
  out += W.step(4, 'The mean flow\'s direct loss') +
    W.line(TX`<b class="c-rose">direct dissipation</b> $2\nu\bar S_{ij}\bar S_{ij}\ \to\ \Big(\dfrac{dU^+}{dy^+}\Big)^2=` + tsq(b.slope) + '$', f3(b.mean_dissipation), 'the mean shear rubbing on itself') +

  out += W.step(5, 'The whole channel') +
    W.line(TX`work by the pressure gradient $\int_0^{\mathrm{Re}_\tau}\dfrac{U^+}{\mathrm{Re}_\tau}\,dy^+$`, f4(I.work), 'equals the bulk velocity $U_b^+$') +
    W.line(TX`<b class="c-rose">direct dissipation</b> $\int_0^{\mathrm{Re}_\tau}\Big(\dfrac{dU^+}{dy^+}\Big)^2dy^+$`, f4(I.dissipation), 'nearly all of it inside $y^+<30$') +
    W.line(TX`<b class="c-orange">production</b> $\int_0^{\mathrm{Re}_\tau}P\,dy^+$`, f4(I.production), 'transport integrates to zero (' + Viz.fmt(I.transport, { sig: 1 }) + ' numerically)') +
    W.box('$' + p3(I.work) + '=' + p3(I.dissipation) + '+' + p3(I.production) + TX`$: <b class="c-rose">` + pct(d.fD) + '</b> straight to heat, <b class="c-orange">' + pct(d.fP) + '</b> through the turbulence') +
    W.table([TX`$\mathrm{Re}_\tau$`, 'work', 'direct', 'via turbulence'], RETS.map(R => { const C = chan(R, d.Ap), J = C.integrals; return [String(R), '$' + t3(J.work) + '$', pct(J.dissipation / J.work), pct(J.production / J.work)]; }), RETS.indexOf(d.Ret));
  out += W.step(6, 'On the trip from the wall') +
    W.line('height now', Viz.live('yp'), 'press ▶ to travel from the wall to the centreline') +
    W.line('production and direct dissipation now', Viz.live('pd'), 'in $u_*^4/\\nu$') +
    W.line('share of the mean flow\'s local loss that feeds the turbulence', Viz.live('share'));
  out += W.step(7, 'What it means') + W.interpret(interpText(s), 'Reading the current setting');
  return out;
}
function explainLive(s) {
  const d = N(s);

}

    { name: 'layer name at y+=100 is "logarithmic layer"', js: b01(layerName(100, 0.1) === 'logarithmic layer'), py: 'ch12.layer_name(100.0, 0.1) == "logarithmic layer"', rtol: 0 },
    { name: 'layer name at y+=500 is "wake region"', js: b01(layerName(500, 0.5) === 'wake region'), py: 'ch12.layer_name(500.0, 0.5) == "wake region"', rtol: 0 },
    { name: 'peak production', js: peakProduction(5200, 0.41, 26).P, expect: 0.25, rtol: 0.01 },
    { name: 'P = tau²/4 where the stresses are equal', js: NPK.Peq / (NPK.tau * NPK.tau / 4), expect: 1, rtol: 1e-10 },
    { name: 'exact maximum of P within 2e-4 of the crossing value', js: NPK.P / NPK.Peq, expect: 1, rtol: 2e-4 },
    { name: 'exact maximum is not below the crossing value', js: b01(NPK.P >= NPK.Peq), expect: 1, rtol: 0 },
    { name: 'peak height at Re_tau 1000 (model)', js: NPK.y, expect: 10.4, rtol: 0.01 },
    { name: 'crossing height at Re_tau 1000 (model)', js: NPK.yeq, expect: 10.46, rtol: 0.002 },
    { name: 'the grid maximum of fluidpy lies within one node of the exact maximum', js: Math.abs(C.yplus_peak_production - NPK.y), expect: 0, atol: 0.25 },
    { name: 'crossing height without damping = sqrt(2)/kappa', js: PKND.yeq, expect: Math.SQRT2 / 0.41, rtol: 0.01 },
    { name: 'mean-flow budget closes at the cursor', js: NB.sumMean, expect: 0, atol: 1e-14 },
    { name: 'the two orange bars are equal and opposite', js: barRows(NB)[3].v + barRows(NB)[4].v, expect: 0, atol: 0 },
    { name: 'whole channel: work = direct + production', js: C.identity_residual, expect: 0, atol: 1e-4 },
    { name: 'shares add up to 100 %', js: FD1000 + FP1000, expect: 1, rtol: 1e-4 },
    { name: 'production is never negative on the grid', js: Math.min.apply(null, Array.from(C.production)), expect: 0, atol: 1e-15 },
    { name: 'trip scale round trip', js: ypOfTrip(tripOf(12, 1000), 1000), expect: 12, rtol: 1e-12 },
    { name: 'accurate U+ vs trapezoid profile at the centreline', js: budgetAt(1000, 1000, 0.41, 26).Uplus / C.U_cl_plus, expect: 1, rtol: 5e-4 }
  ];
}

/* ---- the app ---------------------------------------------------------------------------------------------------------- */
let APP = null, SYNC = false;
const curD = () => (APP ? N(APP.state) : NB);
const app = Viz.app({
  title: 'Where does turbulent energy come from and go?',
  subtitle: 'A model channel from the wall to the centreline: click a height and read two energy budgets, the mean flow\'s and the turbulence\'s, that share one term',
  autoplay: false,
  params: {
    Ret: { type: 'select', label: TX`Reynolds number $\mathrm{Re}_\tau$`, options: [[180, 'Re_τ 180'], [550, '550'], [1000, '1000'], [5200, '5200']], value: DEF.Ret, display: 'chips' },
    yp: { label: TX`Height $y^+$`, min: Y0, max: 5200, log: true, value: DEF.yp, fmt: v => { const R = curD().Ret, y = Math.min(v, R); return f3(y) + ' (y/δ = ' + f2(y / R) + ')'; }, help: 'distance from the wall in wall units, y u*/ν; the centreline is at y⁺ = Re_τ' },
    damp: { type: 'toggle', label: 'Wall damping ($A^+=26$)', value: true, help: 'off: the plain mixing length κy, which lets eddies reach into the sublayer' },
    axis: { type: 'select', label: 'Height axis', options: [['wall', 'wall units y⁺ (log)'], ['outer', 'outer units y/δ']], value: 'wall', display: 'chips', optional: true },
    trip: { label: 'Trip from the wall', min: 0, max: 1, step: 'any', value: tripOf(DEF.yp, DEF.Ret), optional: true, fmt: v => 'y⁺ = ' + f3(ypOfTrip(v, curD().Ret)) }
  },
  transport: { param: 'trip', min: 0, max: 1, rate: 0.075, end: 'hold', hold: 3.5, step: 0.02 },
  presets: [
    { label: 'sublayer', set: { yp: 2 }, title: 'y⁺ = 2: the mean flow pays viscosity directly' },
    { label: 'production peak', set: { yp: 10.4 }, title: 'y⁺ ≈ 10.4 (damped model): viscous stress = Reynolds stress' },
    { label: 'log layer', set: { yp: 100 }, title: 'y⁺ = 100: production falls like 1/(κy⁺)' },
    { label: 'centreline', set: { yp: 5200 }, title: 'y⁺ = Re_τ: no shear, no production' },
    { label: 'no damping', set: { damp: false, yp: 3.45 }, title: 'plain mixing length κy: the peak moves to y⁺ ≈ √2/κ' },
    { label: 'Re_τ 5200', set: { Ret: 5200, damp: true }, title: 'a higher Reynolds number: more of the work goes through the turbulence' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'P', label: 'Production P', value: s => N(s).b.production, fmt: v => f3(v) + ' ' + WU },
    { id: 'D', label: 'Direct dissipation', value: s => N(s).b.mean_dissipation, fmt: v => f3(v) + ' ' + WU },
    { id: 'uv', label: 'Reynolds stress −⟨uv⟩⁺', value: s => N(s).b.uv_plus, fmt: v => f3(v) + ' τ0' },
    { id: 's', label: 'Viscous stress dU⁺/dy⁺', value: s => N(s).b.slope, fmt: v => f3(v) + ' τ0' },
    { id: 'share', label: 'P ÷ local loss', value: s => N(s).share, fmt: v => pc2(v) },
    { id: 'whole', label: 'Channel: to turbulence', value: s => N(s).fP, fmt: v => pct(v) + ' of the work' }
  ],
  terms: {
    title: 'Both budgets at this height (each adds up to zero)', unit: WU,
    items: [
      { id: 'work', label: 'mean: pressure-gradient work', color: Viz.color('accent'), value: s => N(s).b.pressure_work, help: 'U⁺/Re_τ' },
      { id: 'transport', label: 'mean: transport by the stresses', color: Viz.color('muted'), value: s => N(s).b.transport, help: 'd(U⁺τ⁺)/dy⁺: moves energy toward the wall' },
      { id: 'visc', label: 'mean: direct viscous dissipation', color: Viz.color('rose'), value: s => -N(s).b.mean_dissipation, help: '−(dU⁺/dy⁺)²' },
      { id: 'loss', label: TX`mean: to turbulence $+\overline{uv}\,dU/dy$`, color: Viz.color('orange'), value: s => -N(s).b.production, help: 'a plus sign in the equation, a negative number' },
      { id: 'production', label: TX`turbulence: production $-\overline{uv}\,dU/dy$`, color: Viz.color('orange'), value: s => N(s).b.production, help: 'the same number, as a gain' },
      { id: 'sink', label: 'turbulence: dissipation + transport', color: Viz.color('rose'), value: s => -N(s).b.turb_sink, help: 'the remainder that closes the budget (not modelled separately)' }
    ],
    total: { label: 'sum of all six' }
  },
  stage: {
    rows: [1.55, 1],
    views: [
      { id: 'prof', row: 0, flex: 1.2, title: s => '<b>Channel</b> · <b class="c-accent">U⁺</b> · <b class="c-rose">viscous</b> + <b class="c-orange">Reynolds</b> stress · <b class="c-orange">shaded 4×P</b>' },
      { id: 'bars', row: 0, flex: 1, title: s => { const d = N(s); return '<b>Budgets at y⁺ = ' + f3(d.yp) + '</b> · <b class="c-orange">production ' + f3(d.b.production) + '</b>'; } },
      { id: 'whole', row: 1, flex: 1, hidePortrait: true, title: s => { const d = N(s); return '<b>Across the whole channel</b> (Re_τ = ' + d.Ret + ', model): work ' + p3(d.I.work) + ' = <b class="c-rose">direct ' + pct(d.fD) + '</b> + <b class="c-orange">via turbulence ' + pct(d.fP) + '</b>'; } }
    ],
    draw(g, s) { drawProf(g, s); drawBars(g, s); drawWhole(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const x = v.pointer.x, y = v.pointer.y, down = ev.type === 'pointerdown';
      if (ev.viewId === 'prof' && PP && (down || (ev.type === 'pointermove' && v.pointer.down))) {
        const P = PP.P; if (x < P.px.x - 8 || x > P.px.x + P.px.w + 8) return false;
        const u = clip(P.ix(x), P.xlim[0], P.xlim[1]), yp = clip(PP.outer ? u * PP.Ret : Math.pow(10, u), Y0, PP.Ret);
        g.app.play(false); g.app.set({ yp: Number(yp.toPrecision(4)) }); return true;
      }
      if (ev.viewId === 'bars' && down) {
        const h = BH.find(r => y >= r.y0 && y < r.y1); if (!h) return false;
        g.app.set('focus', s.focus === h.id ? null : h.id); return true;
      }
      return false;
    }
  },
  onChange(s, key, a) {
    if (SYNC) return; SYNC = true;
    try {
      const Ret = +s.Ret || DEF.Ret;
      if (key === 'trip') a.set('yp', Number(ypOfTrip(+s.trip, Ret).toPrecision(6)));
      else if (key === 'yp' || key === 'Ret') { const y = clip(+s.yp, Y0, Ret), ch = { trip: tripOf(y, Ret) }; if (y !== s.yp) ch.yp = y; a.set(ch); }
    } finally { SYNC = false; }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a height in the channel: its stresses and its production are worked out here.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Click or drag in the channel to choose a height, or press ▶ to travel from the wall to the centreline. Click a bar to light up its curve.',
    controls: ['yp', 'Ret', 'damp', 'axis'],
    readouts: ['P', 'D', 'uv', 's', 'share', 'whole'],
    callouts: [{ kind: 'try', html: 'Find the height where the grey transport bar changes sign. Below it the mean flow imports energy; above it, it exports.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
APP = app;
</script>
</body>
</html>
