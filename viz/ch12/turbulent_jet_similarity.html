.viz-notes p, .viz-inspect p { margin: 0 0 4px; } .viz-notes p:last-child, .viz-inspect p:last-child { margin-bottom: 0; }

.viz-work-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; margin-right: 6px;
  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-work-hint { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--viz-muted); font-style: italic; }
.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }

.viz-der-chain { display: flex; align-items: center; gap: 6px; }
.viz-der-chain .viz-eq-body { flex: 1 1 auto; min-width: 0; }
.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }
.viz-der-chain .viz-eq-body { font-size: 14px; }
.viz-der-block { font-size: 13.5px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-der-block ol { margin: 2px 0 0 18px; padding: 0; } .viz-der-block li { margin: 0 0 2px; }

.viz-der-why { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-why b.k { color: var(--viz-teal); }
.viz-der-plain { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp { border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.viz-der-pick { flex-wrap: wrap; }
.viz-app[data-dense="2"] .viz-der-block, .viz-app[data-dense="3"] .viz-der-block { font-size: 13px; line-height: 1.4; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-stage { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-side { flex: 1 1 auto; }
/* phones: the derivation keeps ONE view of the picture (derivation.view, else the first) and drops the strips */
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage { min-height: max(150px, 30%); flex: 0 0 auto; height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage.multi { min-height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage-top,
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-der-off { display: none !important; }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-side { flex: 1 1 auto; }
.c-accent { color: var(--viz-accent); font-weight: 650; } .c-teal { color: var(--viz-teal); font-weight: 650; }
.c-orange { color: var(--viz-orange); font-weight: 650; } .c-rose { color: var(--viz-rose); font-weight: 650; } .c-blue { color: var(--viz-blue); font-weight: 650; }

.viz-pages { position: relative; }
.viz-pager-cue { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; display: flex; align-items: flex-end; justify-content: flex-end;
  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;

  @media (max-height: 700px) {

    .viz-app[data-layout="portrait"]:not([data-tab="derive"]):not([data-room="stage"]) .viz-stage.multi { min-height: max(230px, 43%, var(--viz-stage-need, 0px)); }

  .viz-app[data-layout="landscape"]:not([data-tab="derive"]) .viz-views > .viz-row:nth-child(1) { flex: 0.8 1 0 !important; }

     an embedded landscape frame is only about 345 px tall, and the flow view must keep its 60 px */
  .viz-app[data-layout="landscape"] .viz-transport { display: none !important; }
  .viz-app[data-layout="landscape"] .viz-view-title { display: none !important; }

  if (d.flow === 'plane_jet') return TX`<b class="c-accent">No turbulence model was used.</b> Conservation of momentum fixed one exponent ($2n+m=0$) and shape-keeping the other ($m=1$), so $U_{CL}\propto x^{-1/2}$ and $\delta\propto x$. The only things an experiment must supply are numbers: the spreading rate (here an illustrative $\xi_{1/2}=0.10$) and the stress constant. Between 1 m and $x=` + t3(d.x) + TX`$ m the jet has swallowed enough still fluid to carry $` + t3(d.volR) + TX`$ times the volume flux.`;

}

/** one live sentence for the end of a derivation (the full reading is in Explain and in the notes) */

    W.line('$' + f.vsym + TX`\,\delta/\nu\propto x^{n+m}=` + texPow(d.re) + '$', '× ' + f3(Math.pow(x, d.re)) + ' at x = ' + f3(x) + ' m', d.re > 0 ? 'grows downstream: the flow stays turbulent' : d.re === 0 ? 'constant: it keeps the value it started with' : 'falls downstream') +
    W.say(TX`Exact exponents: plane jet $+\tfrac12$ (grows), round jet $0$, plane wake $0$, round wake $-\tfrac13$ (falls: far enough downstream it can turn laminar again), plumes $+1$ and $+\tfrac23$.`);
  const a = 0.3, gx = generalCheck(z => Math.exp(a * z), z => Math.exp(-a * z), z => Math.exp(-a * z), x), gh = generalCheck(z => Math.exp(a * z), z => Math.exp(-a * z / 2), z => 1, x), gp = generalCheck(z => Math.pow(z, 1), z => Math.pow(z, -0.5), z => 1 / z, x);
  out += W.step(7, 'A slip in the book: the exponential family') +
    W.say(TX`⚠️ <b>slip #5 — the book prints</b>, after the more general condition $\dfrac{\delta U'_{CL}}{U_{CL}}=C_8\Big(\dfrac{\delta U'_{CL}}{U_{CL}}+\delta'\Big)=C_9\dfrac{\Psi}{U_{CL}^2}$ (12.74), a second family of solutions, $\delta\sim e^{ax}$, $U_{CL}\sim e^{-ax}$, $\Psi\sim e^{-ax}$; <b>the correct statement is</b> that this family does not satisfy the condition: its middle bracket $\delta U'_{CL}/U_{CL}+\delta'$ is identically zero, so the three brackets are not proportional, and $U_{CL}^2\delta\sim e^{-ax}$ breaks the momentum invariant. (Exponentials as such are not excluded: see the last line of this section.)`) +
    W.line(TX`powers, $m=1$, $n=-\tfrac12$ at $x=` + t3(x) + TX`$: the first two brackets`, f3(gp.c1) + ', ' + f3(gp.c2), 'constant, and $U_{CL}^2\\delta=' + t3(gp.UCL2_delta) + '$ at every $x$') +
    W.line(TX`printed exponentials, $a=0.3$: first bracket $-a\,e^{ax}$`, f3(gx.c1), 'ch12.general_similarity_check; third bracket $\\Psi/U_{CL}^2=e^{ax}=' + t3(gx.c3) + '$') +
    W.line(TX`middle bracket $-a\,e^{ax}+a\,e^{ax}$`, f3(Math.abs(gx.c2) < 1e-7 ? 0 : gx.c2), 'identically zero: the three brackets are not proportional') +
    W.box(TX`$U_{CL}^2\,\delta=e^{-ax}=\mathbf{` + t3(gx.UCL2_delta) + TX`}$ at $x=` + t3(x) + TX`$ m: the momentum flux would die away, against $` + JS62 + '$ (12.62)') +
    W.line(TX`ours: $\delta\sim e^{ax}$, $U_{CL}\sim e^{-ax/2}$, $\Psi$ constant: the three brackets`, f3(gh.c1) + ', ' + f3(gh.c2) + ', ' + f3(gh.c3), 'proportional ($-\\tfrac a2e^{ax}$, $+\\tfrac a2e^{ax}$, $e^{ax}$) and $U_{CL}^2\\delta=' + t3(gh.UCL2_delta) + '$: this exponential family passes both tests, so the invariant rules out some families, not all exponentials');
  out += W.step(8, 'What it means') + W.interpret(interpText(s), 'Reading the current setting');
  return out;
}

/** ρ∫U²dy / ρ of the page's plane-jet family at x (closed form of the Gaussian integral)  [m³/s²] */
function N62(d, x) { const U = d.U(x); return U * U * d.dl(x) * IG.I2; }
function liveFlow(s) { const d = M(s), f = d.f, e = exponentsFr(d.flow); return TX`\begin{aligned}&\text{` + f.name + TX`: }` + f.eq1 + TX`,\ \ ` + f.eq2 + TX`\\&\Rightarrow\ m=` + frTex(e.width) + TX`,\ n=` + frTex(e.velocity) + TX`,\ \ \text{Re}\propto x^{` + frTex(e.reynolds) + TX`}\end{aligned}`; }

}

    { name: 'every mode: page exponents = free_shear_exponents', js: FLOW_OPTS.reduce((a, o) => { const d = M(st8({ flow: o[0] })), e = exponents(o[0]); return a + Math.abs(d.n - e.velocity) + Math.abs(d.m - e.width) + Math.abs(d.sE - e.scalar) + Math.abs(d.re - e.reynolds); }, 0), expect: 0, atol: 1e-12 }
  ]);
}

/* ---- the app ---------------------------------------------------------------------------------------------------------- */
let APP = null;
const nOf = v => r2((FL[APP ? APP.state.flow : DEF.flow] || FL.plane_jet).nc + v);
const app = Viz.app({
  title: 'How does a jet spread without a turbulence model?',
  subtitle: 'One conserved flux and one shape fix how every jet, wake and plume widens and slows: rescale the profiles, break the exponent, switch flows',
  autoplay: false,
  modes: { param: 'flow', label: 'Flow', options: FLOW_OPTS, value: DEF.flow },
  params: {
    dn: { label: 'Trial decay exponent $n$', min: -0.5, max: 0.5, step: 0.05, value: 0, fmt: v => 'n = ' + f3(nOf(v)) + (Math.abs(v) < 1e-9 ? ' ✓' : ''), help: 'the velocity scale varies as x^n; the slider is centred on the exponent that conserves this flow\'s invariant' },
    resc: { type: 'toggle', label: 'Rescaled profiles', value: false, help: 'divide each profile by the velocity scale and the width the invariant demands' },
    scalar: { type: 'toggle', label: 'Show a scalar (dye, heat)', value: false, optional: true },
    ghost: { type: 'toggle', label: 'Laminar jet ghost (Ch. 9)', value: false, optional: true },
    xs: { label: 'Station $x$', min: 1, max: XMAX, step: 0.05, value: DEF.xs, optional: true, fmt: v => f3(v) + ' m' },
    pk: { label: 'Probe', min: -9, max: 4, step: 0.01, value: -9, optional: true }
  },
  transport: { param: 'xs', min: 1, max: XMAX, rate: 1.5, end: 'hold', hold: 2.5, step: 0.5 },
  presets: [
    { label: 'correct exponents', set: { dn: 0 }, title: 'the decay exponent that conserves this flow\'s invariant' },
    { label: 'wrong decay', set: st8({ dn: 0.1 }), title: 'plane jet with n = ' + f3(NW.n) + ': the momentum flux grows as ' + txtPow(NW.p) },
    { label: 'laminar ghost', set: st8({ ghost: true }), title: 'the laminar jet of Ch. 9 for comparison: width ∝ x^(2/3), speed ∝ x^(−1/3)' },
    { label: 'with a scalar', set: st8({ scalar: true, resc: true }), title: 'dye carried by the plane jet: wider profile, second invariant' },
    { label: 'round jet', set: st8({ flow: 'round_jet' }), title: 'U_CL ∝ 1/x; the local Reynolds number stays constant' },
    { label: 'plane wake', set: st8({ flow: 'plane_wake' }), title: 'width ∝ x^(1/2): the deficit is carried at the free-stream speed' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'ucl', label: 'U_CL at x', value: s => { const d = M(s); return d.U(d.x); }, fmt: v => f3(v) + ' m/s' + (APP && APP.state.flow === 'plane_wake' ? ' deficit' : '') },
    { id: 'hw', label: 'half-width', value: s => { const d = M(s); return d.hw(d.x); }, fmt: v => f3(v) + ' m' },
    { id: 'jr', label: 'invariant ÷ at 1 m', value: s => M(s).invR, fmt: v => '× ' + f3(v), tone: v => (Math.abs(v - 1) > 1e-9 ? 'neg' : '') },
    { id: 'vr', label: 'vol. flux ÷ at 1 m', value: s => M(s).volR, fmt: v => '× ' + f3(v) + (APP && APP.state.flow === 'plane_wake' ? ' (width)' : '') },
    { id: 've', label: 'entrainment v_e', value: s => { const d = M(s); return d.ve(d.x); }, fmt: v => f3(v) + ' m/s' },
    { id: 're', label: 'Re exponent n + m', value: s => M(s).re, fmt: v => txtE(v) }
  ],
  terms: {
    title: 'Integrals across the flow ÷ their value at 1 m (click one)', unit: '×',
    items: [
      { id: 'inv', label: 'the invariant (must stay 1)', color: Viz.color('accent'), value: s => M(s).invR, help: 'momentum flux (jets), drag (wake), buoyancy flux (plume)' },
      { id: 'vol', label: 'volume flux (wake: width)', color: Viz.color('teal'), value: s => M(s).volR, help: 'grows: the flow entrains' },
      { id: 'scl', label: 'scalar flux (plume: momentum)', color: Viz.color('amber'), value: s => { const d = M(s); return d.f.thirdE ? d.thirdR : 1; }, help: 'the second invariant; for a plume the momentum flux, which grows' }
    ]
  },
  stage: {
    rows: [1, 1],
    views: [
      { id: 'field', row: 0, flex: 1, title: s => { const d = M(s); return '<b>The ' + d.f.name + '</b> · <b class="c-accent">purple</b> = ' + (d.wake ? 'deficit' : 'fast') + ' · white = half-width · <b class="c-teal">→</b> inflow · drag the bold station · ' + d.f.vtxt + ' <b class="c-accent">' + f3(d.U(d.x)) + ' m/s</b>'; } },
      { id: 'prof', row: 1, flex: 1.2, title: s => { const d = M(s); return d.resc ? '<b>Rescaled profiles</b> · ' + (d.ok ? 'five stations collapse' : '<b class="c-rose">no collapse</b>') + ' · invariant × <b class="' + (d.ok ? 'c-accent' : 'c-rose') + '">' + f3(d.invR) + '</b>' : '<b>Profiles at five stations</b> · spreading and sinking · invariant × <b class="' + (d.ok ? 'c-accent' : 'c-rose') + '">' + f3(d.invR) + '</b>'; } },
      { id: 'inv', row: 1, flex: 0.8, title: s => { const d = M(s); return '<b>What is conserved</b> · <b class="' + (d.ok ? 'c-accent' : 'c-rose') + '">' + d.f.invName + ' × ' + f3(d.invR) + '</b> · <b class="c-teal">' + d.f.volName + ' × ' + f3(d.volR) + '</b>'; } }
    ],
    draw(g, s) { drawField(g, s); drawProf(g, s); drawInv(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const x = v.pointer.x, y = v.pointer.y, down = ev.type === 'pointerdown', drag = ev.type === 'pointermove' && v.pointer.down;
      if (!down && !drag) return false;
      if (ev.viewId === 'field' && FP) {
        if (x < FP.x0 - 6 || x > FP.x1 + 6 || y < FP.y0 - 6 || y > FP.y1 + 6) return false;
        const w = FP.inv(x, y), xs = clip(Math.round(w[0] * 20) / 20, 1, XMAX), d = M(Object.assign({}, s, { xs }));
        g.app.play(false); g.app.set({ xs, pk: clip(Math.round(w[1] / d.hw(xs) * 100) / 100, -4, 4) }); return true;
      }
      if (ev.viewId === 'inv' && IP) {
        if (!IP.inside(x, y)) return false;
        g.app.play(false); g.app.set({ xs: clip(Math.round(IP.ix(x) * 20) / 20, 1, XMAX) }); return true;
      }
      if (ev.viewId === 'prof' && PP && down) {
        const P = PP.P, d = PP.d; if (!P.inside(x, y)) return false;
        const c = P.ix(x), yy = d.resc ? c * d.dc(d.x) : c;
        g.app.set({ pk: clip(Math.round(yy / d.hw(d.x) * 100) / 100, -4, 4) }); return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a point in the flow or on a profile: its velocity is worked out here. Click one of the three bars above to see its integral with your numbers.',
  notes: s => '<p>' + interpText(s) + '</p>',
  onChange(s, key, a) { if (key === 'flow' && a.controls && a.controls.dn) a.controls.dn.forEach(c => { try { c.sync(s.dn); } catch (e) { /* control not mounted */ } }); },
  explore: {
    intro: 'Pick a flow, then move the trial exponent away from ✓ and watch which line stops being flat. Drag the bold station in the flow view (or press ▶); click a point to trace its velocity.',
    controls: ['dn', 'resc', 'scalar', 'ghost'],
    readouts: ['ucl', 'hw', 'jr', 'vr', 've', 're'],
    callouts: [{ kind: 'try', html: 'Plane plume: with the correct exponent the speed does not decay at all. Which line still climbs, and why is that allowed?' }]
  },
  explain: { html: s => explainHtml(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
APP = app;
</script>
</body>
</html>
