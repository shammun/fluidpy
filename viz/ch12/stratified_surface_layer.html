.viz-step-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.viz-step-text p { margin: 0 0 6px; } .viz-step-text p:last-child { margin-bottom: 0; }
.viz-step-text { font-size: 14px; color: var(--viz-text-soft); line-height: 1.5; }
.viz-step-extras { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; min-height: 0; }
.viz-step-eq { background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 6px 8px; }
.viz-app[data-dense="2"] .viz-step-text, .viz-app[data-dense="3"] .viz-step-text { font-size: 13px; line-height: 1.4; }
.viz-app[data-dense="3"] .viz-step-title { font-size: 14.5px; }
.viz-app[data-layout="portrait"] .viz-steps-chips .viz-step-chip { min-width: 24px; height: 24px; font-size: 12px; }

/* ---------- highlight (walkthrough points at a control / readout / equation) ---------- */
.viz-hl { outline: 2px solid var(--viz-orange); outline-offset: 2px; border-radius: 8px; animation: viz-pulse 1.6s ease-in-out 2; }
@keyframes viz-pulse { 0%, 100% { outline-color: var(--viz-orange); } 50% { outline-color: transparent; } }

/* ---------- linked views (stage.views) ---------- */
.viz-stage { display: flex; flex-direction: column; }
.viz-stage.multi { background: transparent; border: 0; box-shadow: none; gap: 6px; overflow: hidden; }
.viz-views { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.viz-row { display: flex; gap: 6px; min-height: 0; }
.viz-view { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.viz-stage.multi .viz-view { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); padding: 4px 6px; }
.viz-view-title { flex: 0 0 auto; font-size: 12.5px; color: var(--viz-muted); line-height: 1.3; padding: 1px 2px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viz-view-title b { font-weight: 600; }
.viz-view-title b:not([class*="c-"]) { color: var(--viz-text); }
.viz-view-holder { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.viz-view-holder > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viz-3d-canvas { z-index: 0; } .viz-view-holder > canvas.viz-canvas { z-index: 1; }
.viz-3d-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--viz-muted); font-size: 13px; z-index: 2; }
.viz-app[data-layout="portrait"] .viz-hide-portrait { display: none !important; }
.viz-app[data-layout="portrait"] .viz-transport .viz-optional { display: none !important; }
.viz-app[data-layout="portrait"] .viz-transport .viz-control-label { display: none; }
.viz-app[data-layout="portrait"][data-dense="2"] .viz-view-title, .viz-app[data-layout="portrait"][data-dense="3"] .viz-view-title,
.viz-app[data-layout="landscape"][data-dense="3"] .viz-view-title { display: none; }
.viz-app[data-layout="portrait"][data-dense="3"] .viz-presets-label { display: none; }
.viz-step-card .viz-card-title { text-transform: none; letter-spacing: 0; }
.viz-subhead-like { margin-top: 2px; }
.viz-app[data-layout="portrait"] .viz-stage.multi { min-height: max(260px, 54%, var(--viz-stage-need, 0px)); }

/* ---------- stage top strip: modes · presets · status ---------- */
.viz-stage-top { flex: 0 0 auto; display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; padding: 4px 6px; }
.viz-stage:not(.multi) .viz-stage-top { border-bottom: 1px solid var(--viz-border); }
.viz-stage.multi .viz-stage-top { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); }
.viz-seg { display: inline-flex; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: 999px; padding: 2px; gap: 2px; }
.viz-seg-btn { border: 0; background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--viz-text-soft); min-height: 24px; white-space: nowrap; }
.viz-seg-btn[aria-pressed="true"] { background: var(--viz-accent); color: #fff; }
.viz-presets { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
.viz-presets-label { font-size: 12px; color: var(--viz-muted); }
.viz-preset { border: 1px solid color-mix(in srgb, var(--viz-orange) 45%, var(--viz-border)); background: color-mix(in srgb, var(--viz-orange) 9%, var(--viz-card));
  color: var(--viz-text); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; cursor: pointer; min-height: 24px; white-space: nowrap; }
.viz-preset[aria-pressed="true"] { background: var(--viz-orange); border-color: var(--viz-orange); color: #fff; }
.viz-status { margin-left: auto; font-size: 12.5px; font-weight: 650; padding: 2px 10px; border-radius: 999px; background: var(--viz-accent-soft); color: var(--viz-accent-dark); max-width: 100%; }
.viz-status[data-tone="good"] { background: color-mix(in srgb, var(--viz-teal) 14%, var(--viz-card)); color: var(--viz-teal); }
.viz-status[data-tone="warn"] { background: color-mix(in srgb, var(--viz-orange) 14%, var(--viz-card)); color: var(--viz-orange); }
.viz-status[data-tone="bad"] { background: color-mix(in srgb, var(--viz-rose) 12%, var(--viz-card)); color: var(--viz-rose); }
.viz-status[hidden] { display: none; }

/* ---------- transport: play · step · restart · time scrubber · speed ---------- */
.viz-transport { flex: 0 0 auto; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; padding: 4px 6px; }
.viz-stage:not(.multi) .viz-transport { border-top: 1px solid var(--viz-border); }
.viz-stage.multi .viz-transport { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); }
.viz-transport .viz-control { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; align-items: center; column-gap: 6px; }
.viz-transport .viz-control input[type="range"] { grid-column: 2; grid-row: 1; margin: 0; }
.viz-transport .viz-control .viz-control-label { grid-column: 1; grid-row: 1; font-size: 12.5px; white-space: nowrap; }
.viz-transport .viz-control .viz-control-value { grid-column: 3; grid-row: 1; }
.viz-transport .viz-scrub { flex: 3 1 180px; min-width: 150px; }
.viz-transport .viz-speed { flex: 1 1 150px; min-width: 140px; }

/* ---------- explore pager items ---------- */
.viz-subhead { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--viz-muted); margin-top: 2px; }
.viz-muted { color: var(--viz-muted); }

/* ---------- term-by-term bars ---------- */
.viz-terms { display: flex; flex-direction: column; gap: 5px; }
.viz-term { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
.viz-term[aria-pressed="true"] { border-color: var(--term-color); box-shadow: 0 0 0 2px color-mix(in srgb, var(--term-color) 25%, transparent); }
.viz-term-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.viz-term-label { color: var(--term-color); font-weight: 600; min-width: 0; }
.viz-term-val { font-family: var(--viz-mono); font-size: 12.5px; white-space: nowrap; }
.viz-term-track { height: 9px; background: var(--viz-card-2); border-radius: 5px; overflow: hidden; }
.viz-term-fill { display: block; height: 100%; border-radius: 5px; transition: width .2s; }
.viz-term.neg .viz-term-fill { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 3px, transparent 3px 6px) !important; }
.viz-term-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13.5px; border-top: 2px solid var(--viz-accent); padding-top: 4px; }

/* ---------- inspector · right now ---------- */
.viz-inspect, .viz-notes { font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-inspect { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 7%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 5px 9px; }
.viz-notes { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 5px 9px; }
.viz-notes p, .viz-inspect p { margin: 0 0 4px; } .viz-notes p:last-child, .viz-inspect p:last-child { margin-bottom: 0; }

/* ---------- step-by-step working (Viz.work helpers) ---------- */
.viz-work-h { font-size: 13px; font-weight: 650; color: var(--viz-accent); margin: 4px 0 0; }
.viz-work-ln { font-size: 13px; line-height: 1.45; padding: 2px 0; border-bottom: 1px dashed var(--viz-border); }
.viz-work-ln b { font-variant-numeric: tabular-nums; }
.viz-work-why { color: var(--viz-muted); font-size: 12px; margin-left: 4px; }
.viz-work-res { font-size: 13px; line-height: 1.45; padding: 4px 9px; border-radius: 8px; border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 9%, var(--viz-card)); }
.viz-work-res.teal { border-left-color: var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 9%, var(--viz-card)); }
.viz-work-table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.viz-work-table th, .viz-work-table td { padding: 2px 8px 2px 0; text-align: left; border-bottom: 1px solid var(--viz-border); }
.viz-work-table th { color: var(--viz-muted); font-weight: 600; }
.viz-work-table tr.cur td { background: color-mix(in srgb, var(--viz-orange) 12%, var(--viz-card)); font-weight: 600; }
.viz-work-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; margin-right: 6px;
  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-work-hint { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--viz-muted); font-style: italic; }
.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

/* ---------- derivation stepper ---------- */
.viz-der-line { display: block; min-width: 0; border-radius: 8px; padding: 2px 6px; }
.viz-der-tag { display: block; font-size: 12px; line-height: 1.2; color: var(--viz-muted); font-variant-numeric: tabular-nums; }
.viz-der-chain { display: flex; align-items: center; gap: 6px; }
.viz-der-chain .viz-eq-body { flex: 1 1 auto; min-width: 0; }
.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }
.viz-der-chain .viz-eq-body { font-size: 14px; }
.viz-der-block { font-size: 13.5px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-der-block ol { margin: 2px 0 0 18px; padding: 0; } .viz-der-block li { margin: 0 0 2px; }
.viz-der-did { font-weight: 650; color: var(--viz-orange); padding-left: 6px; }
.viz-der-why { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-why b.k { color: var(--viz-teal); }
.viz-der-plain { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp { border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.viz-der-pick { flex-wrap: wrap; }
.viz-app[data-dense="2"] .viz-der-block, .viz-app[data-dense="3"] .viz-der-block { font-size: 13px; line-height: 1.4; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-stage { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-side { flex: 1 1 auto; }
/* phones: the derivation keeps ONE view of the picture (derivation.view, else the first) and drops the strips */
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage { min-height: max(150px, 30%); flex: 0 0 auto; height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage.multi { min-height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage-top,
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-der-off { display: none !important; }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-side { flex: 1 1 auto; }
.c-accent { color: var(--viz-accent); font-weight: 650; } .c-teal { color: var(--viz-teal); font-weight: 650; }
.c-orange { color: var(--viz-orange); font-weight: 650; } .c-rose { color: var(--viz-rose); font-weight: 650; } .c-blue { color: var(--viz-blue); font-weight: 650; }

/* ---------- code tab ---------- */
.viz-code-card { min-width: 0; }
.viz-code-title { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; font-size: 13px; font-weight: 600; color: var(--viz-text-soft); margin-bottom: 3px; }
.viz-code { background: #1f2940; color: #dce6f5; border-radius: 9px; padding: 6px 8px; font-family: var(--viz-mono); font-size: 12.5px; line-height: 1.5; }
.viz-code-ln { white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 4px; padding: 0 4px 0 30px; position: relative; }
.viz-code-ln.cur { background: rgba(123,92,214,.5); box-shadow: inset 3px 0 0 #b9a5ec; }
.viz-code-no { position: absolute; left: 2px; width: 22px; text-align: right; color: #6f7fa3; user-select: none; }
.viz-code .cm { color: #8d9cc0; } .viz-code .st { color: #a5e3a0; } .viz-code .num { color: #f6b86e; }
.viz-code .kw { color: #f290c8; } .viz-code .fn { color: #7ce0d3; }
.viz-code-live { color: #ffe08a; font-weight: 700; }
.viz-step-code .viz-code { font-size: 12.5px; }

/* ---------- pager: an item taller than a page is shown in slices (Pager in viz_lib.js) ---------- */
.viz-pages { position: relative; }
.viz-pager-cue { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; display: flex; align-items: flex-end; justify-content: flex-end;
  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--viz-card) 45%); padding-right: 2px; }
.viz-pager-cue[hidden] { display: none; }
.viz-pages.viz-cont-top { box-shadow: inset 0 2px 0 0 color-mix(in srgb, var(--viz-accent) 45%, transparent); }
/* a paged text panel on portrait keeps exactly the height its pages were packed for: the stage stays at its floor */
.viz-app[data-layout="portrait"][data-paged] .viz-stage { flex-grow: 0; }
.viz-app[data-layout="portrait"][data-paged] .viz-side { flex: 1 1 0; }
.viz-pages > .viz-sliced { flex-shrink: 0; position: relative; }   /* contains KaTeX's hidden MathML, else it overflows the page */
/* room: fit() moves the portrait split between picture and text when one side cannot fit its content —
   "stage": views were squeezed below 60 px (a full text page); "text": one formula/row is taller than a text page */
.viz-app[data-layout="portrait"][data-room="stage"] .viz-stage.multi { min-height: max(300px, 62%, var(--viz-stage-need, 0px)); }
.viz-app[data-layout="portrait"][data-room="text"] .viz-stage { min-height: max(140px, 26%); }
.viz-app[data-layout="portrait"][data-room="text"] .viz-stage.multi { min-height: max(140px, 26%, var(--viz-stage-need, 0px)); }
.viz-app[data-layout="portrait"][data-room="text"][data-tab="derive"] .viz-stage { height: max(140px, 24%); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* VIZ_BASE_CSS:END */

  .viz-stage-top .viz-presets { flex-wrap: wrap; }
  .viz-pager-label { white-space: nowrap; min-width: 52px; }
  /* phones: the preset chips go (the walkthrough sets the cases; the status names the regime) */
  .viz-app[data-layout="landscape"] .viz-presets { display: none !important; }
  .viz-app[data-layout="portrait"]:not([data-tab="explore"]) .viz-presets { display: none !important; }
  @media (max-height: 700px) {
    .viz-app[data-layout="portrait"] .viz-presets { display: none !important; }
  }
  /* portrait: the two profiles stay side by side (profiles want height, not width); the budget row goes
     (Rf and Ri are readouts, its arithmetic is Explain 7) */
  .viz-app[data-layout="portrait"] .viz-views > .viz-row:nth-child(2) { display: none !important; }
  .viz-app[data-layout="portrait"] .viz-view[data-view="wind"] { flex-grow: 1.15 !important; }
  .viz-app[data-layout="portrait"] .viz-view[data-view="temp"] { flex-grow: 0.85 !important; }
  /* landscape phones: one row (wind | temperature) */
  .viz-app[data-layout="landscape"] .viz-views > .viz-row:nth-child(2) { display: none !important; }
  /* a chain line cut over two pages must not be re-centred in its slice (library: .viz-der-chain is align-items: center) */
  .viz-der-chain.viz-sliced { align-items: flex-start; }
  /* the two-convention status: two short lines, never clipped */
  .viz-status { white-space: normal; border-radius: 12px; }
  .viz-status .ssl-conv { font-weight: 500; }
</style>

<div id="app"></div>
<script id="viz-lib">

  return '<b>z = ' + f3(d.z) + ' m</b> over ' + Z0NAME(d.z0) + ':<br>' +
    TX`$\zeta=z/L_M=` + (d.stab === 0 ? '0' : zt + '/' + tp(d.L) + '=' + t3(d.zeta)) + TX`$ $=\mathrm{Rf}$, <b>` + d.regime + '</b><br>' +
    TX`$\phi_m=` + t3(d.phi) + '$' + (d.stab < 0 ? TX` $=(1-16\zeta)^{-1/4}$` : TX` $=1+5\zeta$`) + '<br>' + u + '<br>' +
    TX`<b class="c-blue">$d\theta/dz$</b> $=` + kmT(d.dth) + TX`$ K/km, $dT/dz=` + kmT(d.dTdz) + '$ K/km<br>' +
    'Kundu: ' + d.kun.own + '<br>met: ' + d.met.own;
}

/* ---- equations used in the texts (each one is written out wherever its number is mentioned) ----------------------------- */
const E107 = TX`\mathrm{Rf}=\dfrac{-g\alpha\,\overline{wT'}}{-\overline{uw}\,(dU/dz)}`;
const E108 = TX`\mathrm{Ri}\equiv\dfrac{N^2}{(dU/dz)^2}=\dfrac{\alpha g\,(d\bar T/dz)}{(dU/dz)^2}`;
const E109 = TX`\mathrm{Ri}=(\nu_T/\kappa_T)\,\mathrm{Rf}`;
const E110 = TX`L_M\equiv-\dfrac{u_*^3}{\kappa\,\alpha\,g\,\overline{wT'}}`;
const E111 = TX`\mathrm{Rf}=z/L_M`;
const EPROF = TX`U=\dfrac{u_*}{\kappa}\Big[\ln\dfrac{z}{z_0}+5\,\dfrac{z}{L_M}\Big]`;
const E47N = TX`\begin{aligned}&\frac{\partial\bar e}{\partial t}+U_j\frac{\partial\bar e}{\partial x_j}\\[6pt]&=\frac{\partial}{\partial x_j}\Big(-\frac1{\rho_0}\overline{pu_j}+2\nu\overline{u_iS'_{ij}}-\tfrac12\overline{u_i^2u_j}\Big)\\[6pt]&\quad-2\nu\overline{S'_{ij}S'_{ij}}-\overline{u_iu_j}\frac{\partial U_i}{\partial x_j}+g\alpha\overline{u_3T'}\end{aligned}`;
const E106N = TX`\begin{aligned}&\frac{\partial\bar e}{\partial t}+U\frac{\partial\bar e}{\partial x}=-\frac{\partial}{\partial z}\Big(\frac1{\rho_0}\overline{pw}+\tfrac12\overline{u_i^2w}\Big)\\[6pt]&\quad-\overline{uw}\,\frac{dU}{dz}+g\alpha\,\overline{wT'}-\bar\varepsilon\end{aligned}`;
const E106I = TX`\dfrac{\partial\bar e}{\partial t}+U\dfrac{\partial\bar e}{\partial x}=-\dfrac{\partial}{\partial z}\Big(\dfrac1{\rho_0}\overline{pw}+\tfrac12\overline{u_i^2w}\Big)-\overline{uw}\dfrac{dU}{dz}+g\alpha\,\overline{wT'}-\bar\varepsilon`;
const N2ID = TX`N^2=g\alpha\,\Big(\dfrac{dT}{dz}-\Gamma_a\Big)=g\alpha\,(\Gamma_d-\Gamma_{met})`;
const TRAP = { ok: richardsonThermal(-0.0065, 0.01, 1 / 288, GA_STD), bad: richardsonThermal(-0.0065, 0.01, 1 / 288, 0) };

/* ---- Explanation & interpretation --------------------------------------------------------------------------------------- */
function convTable(d) {
  const tx = x => x.replace('−', '-');
  return Viz.work.table(['convention', 'stable when', 'here, in K/km'],
    [[TX`Kundu: $\Gamma\equiv dT/dz$`, TX`$dT/dz>\Gamma_a$`, '$' + tx(d.kun.a) + d.kun.op + tx(d.kun.b) + '$ <b>' + d.kun.verdict + '</b>'],
      [TX`met.: $\Gamma_{met}\equiv-dT/dz$`, TX`$\Gamma_{met}<\Gamma_d$`, '$' + tx(d.met.a) + d.met.op + tx(d.met.b) + '$ <b>' + d.met.verdict + '</b>']], d.conv === 'met' ? 1 : 0);
}
function explainHtml(s) {
  const W = Viz.work, d = N(s), up = d.wT > 0 ? 'upward' : d.wT < 0 ? 'downward' : 'zero';
  let out = W.step(0, 'What the views show') +
    W.say(TX`<b>Left</b>: the mean wind against height (logarithmic height axis). <b class="c-accent">Purple</b>: the wind $U(z)$ for your heat flux; grey dashes: what it would be with no heat flux. The <b class="c-blue">blue line</b> is the height $|L_M|$; the <b class="c-orange">orange zone</b> is where shear makes the turbulence, the <b class="c-blue">blue zone</b> where buoyancy rules. <b>Right</b>: thermometer temperature $T$ (solid <b class="c-blue">blue</b>) and potential temperature $\theta$ (dashed), measured from the lowest level, with the adiabat in grey. <b>Bottom</b>: the turbulent energy budget at the black cursor (<b class="c-orange">shear production</b>, <b class="c-blue">buoyancy</b>, <b class="c-rose">what is left for dissipation</b>) and both sources against height.`) +
    W.hint(TX`Fixed here: $T=300$ K (so $\alpha=1/T$), $\rho=1.2$ kg/m³, $C_p=1005$ J/(kg K), von Kármán's $\kappa=0.4$, roughness $z_0=` + t3(d.z0) + TX`$ m (` + Z0NAME(d.z0) + TX`). Every temperature in a buoyancy term is <b>potential</b> temperature. On a phone the budget view is hidden: its numbers are in section 7 and in the readouts $\mathrm{Rf}$ and $\mathrm{Ri}$.`);
  out += W.step(1, 'From watts to the kinematic heat flux') +
    W.line(TX`$\overline{wT'}=\dfrac{H}{\rho C_p}=\dfrac{` + Math.round(d.H) + TX`}{1.2\times1005}$`, f3(d.wT) + ' K m/s', 'the heat flux as a velocity–temperature correlation; positive means upward') +
    W.say('The flux is <b>' + up + '</b>' + (d.stab > 0 ? ': the ground is colder than the air and cools it.' : d.stab < 0 ? ': the ground is warmer than the air and heats it.' : ': the ground and the air exchange no heat.'));
  out += W.step(2, 'The Monin–Obukhov length') +
    W.say('$' + E110 + TX`$ (12.110), with $\alpha=1/T=1/300$ K⁻¹ and $g=9.80665$ m/s².`) +
    (d.stab === 0 ? W.box(TX`$\overline{wT'}=0$, so $L_M=\mathbf{\infty}$: no height at which buoyancy matters.`) :
      W.line(TX`top: $u_*^3=` + t3(d.ustar) + '^3$', f3(Math.pow(d.ustar, 3)) + ' m³/s³') +
      W.line(TX`bottom: $\kappa\alpha g\,\overline{wT'}=0.4\times` + t3(ALPHA) + TX`\times9.807\times` + tp(d.wT) + '$', f3(KAPPA * ALPHA * G0 * d.wT) + ' m²/s³') +
      W.line(TX`$L_M=-\dfrac{` + t3(Math.pow(d.ustar, 3)) + '}{' + t3(KAPPA * ALPHA * G0 * d.wT) + '}$', sgnL(d.L), TX`cube of the friction velocity over the buoyancy flux $g\alpha\overline{wT'}$`) +
      W.box(TX`$L_M=\mathbf{` + tL(d.L) + '}$: ' + (d.stab > 0 ? 'positive, because the heat flux is downward (<b>stable</b>)' : 'negative, because the heat flux is upward (<b>unstable</b>)') + TX`. It is the <b class="c-blue">blue line</b> at $|L_M|$.`));
  out += W.step(3, 'The flux Richardson number') +
    W.say('$' + E107 + TX`$ (12.107) is buoyant destruction over shear production. In the logarithmic layer $-\overline{uw}=u_*^2$ and $dU/dz=u_*/(\kappa z)$, which turns it into $` + E111 + TX`$ (12.111).`) +
    W.box(TX`$\mathrm{Rf}=\dfrac{z}{L_M}=` + (d.stab === 0 ? TX`\dfrac{` + t3(d.z) + TX`}{\infty}=\mathbf{0}` : TX`\dfrac{` + t3(d.z) + '}{' + t3(d.L) + TX`}=\mathbf{` + t3(d.Rf) + '}') + '$: <b>' + d.regime + '</b>') +
    (d.stab > 0 ? W.line(TX`it reaches the observed limit $\mathrm{Rf}_{cr}\approx\tfrac14$ at $z=\dfrac{L_M}4=\dfrac{` + t3(d.L) + '}4$', f3(d.zcrit) + ' m', 'the ▲; above it turbulence cannot sustain itself') :
      d.stab < 0 ? W.line(TX`buoyant production equals shear production at $z=|L_M|$`, f3(d.absL) + ' m', 'below: the forced-convection layer; above: free convection') : '') +
    W.say(TX`Sign: an <b>upward</b> heat flux gives a <b>negative</b> $\mathrm{Rf}$ (buoyancy adds energy: "convective"); $0\le\mathrm{Rf}<\tfrac14$ is "shear-driven"; $\mathrm{Rf}\ge\tfrac14$ is "decaying". The ¼ is an observed value, not Chapter 11's stability theorem.`);
  out += W.step(4, 'The gradient Richardson number') +
    W.say('$' + E108 + TX`$ (12.108) uses mean gradients, which are easier to measure than fluxes. With eddy coefficients, $` + E109 + TX`$ (12.109); the ratio $\nu_T/\kappa_T$ is the turbulent Prandtl number $\mathrm{Pr}_T$.`) +
    W.box(TX`$\mathrm{Ri}=\mathrm{Pr}_T\,\mathrm{Rf}=` + t3(d.PrT) + TX`\times` + tp(d.Rf) + TX`=\mathbf{` + t3(d.Ri) + '}$') +
    W.line(TX`from the profiles: $N^2=g\alpha\,\dfrac{d\theta}{dz}=9.807\times` + t3(ALPHA) + TX`\times` + tp(d.dth) + '$', f3(d.N2) + ' s⁻²', TX`$d\theta/dz=-\overline{wT'}\,\mathrm{Pr}_T\,\phi_m/(\kappa u_*z)$, the flux–gradient model`) +
    W.line(TX`$\dfrac{dU}{dz}=\dfrac{u_*\phi_m}{\kappa z}=\dfrac{` + t3(d.ustar) + TX`\times` + t3(d.phi) + TX`}{0.4\times` + t3(d.z) + '}$', f3(d.dUdz) + ' s⁻¹', TX`$\phi_m=` + t3(d.phi) + TX`$ is the stability correction of section 5`) +
    W.line(TX`$\dfrac{N^2}{(dU/dz)^2}=\dfrac{` + t3(d.N2) + '}{' + tsq(d.dUdz) + '}$', f3(d.RiP), d.stab === 0 ? 'neutral: zero either way' : TX`differs from the boxed value because the book's two equations use the neutral shear $u_*/(\kappa z)$, i.e. $\phi_m=1$`);
  out += W.step(5, 'The wind at your height');
  if (d.stab >= 0) out += W.say(TX`The book's log-linear profile, $` + EPROF + TX`$ (p. 598, no number):`) +
    W.line(TX`$U=\dfrac{` + t3(d.ustar) + TX`}{0.4}\Big[\ln\dfrac{` + t3(d.z) + '}{' + t3(d.z0) + '}+5\\times' + t3(d.zeta) + TX`\Big]=` + t3(d.ustar / KAPPA) + TX`\times(` + t3(Math.log(d.z / d.z0)) + '+' + t3(BETA * d.zeta) + ')$', f3(d.U) + ' m/s', d.beyond ? TX`⚠ $z>L_M$: outside the range of the linear correction` : 'the logarithm plus a straight line');
  else out += W.say(TX`The book's log-linear profile, $` + EPROF + TX`$ (p. 598, no number), is a small-$|z/L_M|$ formula. On the unstable side its shear $1+5z/L_M$ reaches zero, so <b>the log-linear form ends at $z=|L_M|/5=` + t3(d.zEnd) + TX`$ m</b> (✕).`) +
    (d.Ull === d.Ull ? W.line(TX`log-linear (still valid at your height): $` + t3(d.ustar / KAPPA) + TX`\times(` + t3(Math.log(d.z / d.z0)) + '-' + t3(-BETA * d.zeta) + ')$', f3(d.Ull) + ' m/s', 'the thin dashed purple line') : W.say('Your height is above that, so the log-linear form gives no value here.')) +
    W.say(TX`The bold curve continues with a commonly used form (often called Businger–Dyer), $\phi_m=(1-16\zeta)^{-1/4}$ with $\zeta=z/L_M$, whose integral is $U=\dfrac{u_*}{\kappa}\Big[\ln\dfrac z{z_0}-\psi_m(\zeta)+\psi_m\Big(\dfrac{z_0}{L_M}\Big)\Big]$. It is not from the book.`) +
    W.line(TX`$U=` + t3(d.ustar / KAPPA) + TX`\times(` + t3(Math.log(d.z / d.z0)) + '-' + t3(psiBD(d.zeta)) + '+' + t3(psiBD(d.z0 / d.L)) + ')$', f3(d.U) + ' m/s', TX`$\psi_m(` + t3(d.zeta) + ')=' + t3(psiBD(d.zeta)) + '$');
  out += W.box(TX`<b class="c-accent">$U(` + t3(d.z) + TX`\ \text{m})=\mathbf{` + t3(d.U) + TX`}$ m/s</b>; neutral $\dfrac{u_*}{\kappa}\ln\dfrac z{z_0}=` + t3(d.Un) + '$ m/s (' + (d.stab > 0 ? 'stable air needs more shear to carry the same stress' : d.stab < 0 ? 'convection mixes momentum so well that less shear is needed' : 'the same') + ')');
  out += W.step(6, 'The same gradient in two conventions') +
    W.say(TX`At your height the thermometer gradient is $\dfrac{dT}{dz}=\dfrac{d\theta}{dz}+\Gamma_a=` + kmT(d.dth) + '+(' + kmT(d.Ga) + ')=' + kmT(d.dTdz) + TX`$ K/km, with the adiabatic value $\Gamma_a=-g/C_p=` + kmT(d.Ga) + TX`$ K/km. The computation uses Kundu's sign; meteorology writes the same thing with the opposite sign:`) +
    convTable(d) +
    W.say(TX`Same layer, same verdict: <b>negate the number, flip the inequality</b>. The buoyancy frequency is the same in both: $` + N2ID + '=9.807\\times' + t3(ALPHA) + TX`\times` + kmT(d.dTdz - d.Ga) + TX`\times10^{-3}=` + t3(d.N2) + TX`$ s⁻².`) +
    W.hint(TX`<b>The thermometer trap.</b> $` + E108 + TX`$ (12.108) wants the potential-temperature gradient. Take the standard atmosphere, $dT/dz=-6.5$ K/km (so $\Gamma_{met}=6.5$ K/km) with $dU/dz=0.01$ s⁻¹: subtracting $\Gamma_a$ gives $\mathrm{Ri}=+` + t4(TRAP.ok) + TX`$ (stable: $-6.5>-9.8$, or $6.5<9.8$); forgetting it gives $` + t4(TRAP.bad) + TX`$, a stable atmosphere declared unstable. The Python strings write $\Gamma_a$ in both conventions; the $+9.8$ K/km of the meteorological one is this page's $\Gamma_d$.`);
  out += W.step(7, 'The energy budget at your height') +
    W.say(TX`From $` + E106I + TX`$ (12.106), with the log-layer values. ⚠️ <b>slip #10 — the book prints</b> the triple correlation here as $\overline{ew}$<b>; the correct form is</b> $\tfrac12\overline{u_i^2w}$.`) +
    W.line(TX`<b class="c-orange">shear production</b> $-\overline{uw}\,\dfrac{dU}{dz}=u_*^2\cdot\dfrac{u_*}{\kappa z}=\dfrac{` + t3(d.ustar) + TX`^3}{0.4\times` + t3(d.z) + '}$', f3(d.P) + ' m²/s³', 'always a gain') +
    W.line(TX`<b class="c-blue">buoyancy</b> $g\alpha\,\overline{wT'}=9.807\times` + t3(ALPHA) + TX`\times` + tp(d.wT) + '$', f3(d.B) + ' m²/s³', d.stab > 0 ? 'a loss: lifting dense air' : d.stab < 0 ? 'a gain: warm air rising' : 'zero') +
    W.box(TX`$-\dfrac{\text{buoyancy}}{\text{shear}}=-\dfrac{` + t3(d.B) + '}{' + t3(d.P) + TX`}=\mathbf{` + t3(d.Rf) + TX`}=\mathrm{Rf}$`) +
    W.line(TX`<b class="c-rose">left for dissipation</b> $\bar\varepsilon=P\,(1-\mathrm{Rf})=` + t3(d.P) + TX`\times` + t3(1 - d.Rf) + '$', f3(-d.rem) + ' m²/s³', d.rem > 0 ? 'negative: there is no steady balance, the turbulence decays' : 'steady state with no transport') +
    W.say(TX`With the stability-corrected shear the production is $\phi_m=` + t3(d.phi) + TX`$ times this, $` + t3(d.Pphi) + TX`$ m²/s³, and the ratio becomes $\zeta/\phi_m=` + t3(d.RfP) + TX`$ (our refinement; the book's $\mathrm{Rf}=z/L_M$ keeps the neutral shear).`);
  out += W.step(8, 'At the current heat flux') +
    W.line('heat flux now', Viz.live('H'), 'press ▶ under the picture to sweep it from night to day') +
    W.line('Monin–Obukhov length now', Viz.live('L')) +
    W.line('wind at your height now', Viz.live('U')) +
    W.line('lapse rate now, both conventions', Viz.live('G')) +
    W.interpret(interpText(s) + ' ' + SCHEME, 'Reading the current setting');
  return out;
}
function explainLive(s) {

}

    rows: [1.5, 1],
    views: [
      { id: 'wind', row: 0, flex: 1.25, title: s => { const d = N(s); return '<b>Wind profile</b> · <b class="c-accent">' + (d.far ? 'z > 5 L_M: no turbulence to hold a profile' : 'U(' + f3(d.z) + ' m) = ' + f3(d.U) + ' m/s') + '</b> · grey: neutral ' + f3(d.Un) + ' m/s · <b class="c-blue">' + (d.stab === 0 ? 'L_M = ∞' : '|L_M| = ' + f3(d.absL) + ' m') + '</b> · drag the height'; } },
      { id: 'temp', row: 0, flex: 0.8, title: s => { const d = N(s); return '<b class="c-blue">T</b> (solid) and <b class="c-blue">θ</b> (dashed) · at ' + f3(d.z) + ' m: <b>' + d.kun.verdict + '</b>'; } },
      { id: 'bud', row: 1, flex: 1, hidePortrait: true, title: s => { const d = N(s); return '<b>Turbulent energy at z = ' + f3(d.z) + ' m</b> · <b class="c-orange">shear ' + mW(d.P) + '</b> · <b class="c-blue">buoyancy ' + mW(d.B) + '</b> ×10⁻³ m²/s³ · Rf = ' + f3(d.Rf) + ' · right: why there is a length'; } }
    ],
    draw(g, s) { drawWind(g, s); drawTemp(g, s); drawBud(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const x = v.pointer.x, y = v.pointer.y, down = ev.type === 'pointerdown', drag = down || (ev.type === 'pointermove' && v.pointer.down);
      const F = ev.viewId === 'wind' ? WF : ev.viewId === 'temp' ? TF : null;
      if (F && drag) {
        if (y < F.q.y - 8 || y > F.q.y + F.q.h + 8) return false;
        g.app.play(false); g.app.set({ z: Number(clip(zOfPointer(F, y), zMinOf(+s.z0 || DEF.z0), ZHI).toPrecision(3)) }); return true;
      }
      if (ev.viewId === 'bud') {
        if (BF && drag && x >= BF.q.x - 6 && x <= BF.q.x + BF.q.w + 6) { g.app.play(false); g.app.set({ z: Number(clip(Math.pow(10, BF.P.ix(clip(x, BF.q.x, BF.q.x + BF.q.w))), zMinOf(+s.z0 || DEF.z0), ZHI).toPrecision(3)) }); return true; }
        if (down) { const h = BH.find(r => y >= r.y0 && y < r.y1 && x < r.x1); if (h) { g.app.set('focus', s.focus === h.id ? null : h.id); return true; } }
      }
      return false;
    }
  },
  onChange(s, key, a) {
    if (SYNC) return; SYNC = true;
    try { const zm = zMinOf(+s.z0 || DEF.z0); if ((key === 'z0' || key === 'z') && +s.z < zm) a.set('z', zm); } finally { SYNC = false; }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Drag the height in a picture: the arithmetic at that height is worked out here.',
  notes: s => '<p>' + interpText(s) + '</p><p>' + SCHEME + '</p>',
  explore: {
    intro: 'The heat-flux slider is under the picture: drag it through zero, or press ▶ to sweep from a cold night to a sunny afternoon. Drag in a picture to move the height.',
    controls: ['ustar', 'z', 'z0', 'conv', 'PrT'],
    readouts: ['L', 'Rf', 'Ri', 'U', 'Un', 'zc', 'lapse'],
    callouts: [{ kind: 'try', html: 'On the "clear calm night" preset, find the height where the status turns to "decaying". Then double $u_*$: how far up does the turbulence reach now?' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
APP = app;
</script>
