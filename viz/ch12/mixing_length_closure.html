.viz-step-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.viz-step-text p { margin: 0 0 6px; } .viz-step-text p:last-child { margin-bottom: 0; }
.viz-step-text { font-size: 14px; color: var(--viz-text-soft); line-height: 1.5; }
.viz-step-extras { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; min-height: 0; }
.viz-step-eq { background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 6px 8px; }
.viz-app[data-dense="2"] .viz-step-text, .viz-app[data-dense="3"] .viz-step-text { font-size: 13px; line-height: 1.4; }
.viz-app[data-dense="3"] .viz-step-title { font-size: 14.5px; }
.viz-app[data-layout="portrait"] .viz-steps-chips .viz-step-chip { min-width: 24px; height: 24px; font-size: 12px; }

/* ---------- highlight (walkthrough points at a control / readout / equation) ---------- */
.viz-hl { outline: 2px solid var(--viz-orange); outline-offset: 2px; border-radius: 8px; animation: viz-pulse 1.6s ease-in-out 2; }
@keyframes viz-pulse { 0%, 100% { outline-color: var(--viz-orange); } 50% { outline-color: transparent; } }

/* ---------- linked views (stage.views) ---------- */
.viz-stage { display: flex; flex-direction: column; }
.viz-stage.multi { background: transparent; border: 0; box-shadow: none; gap: 6px; overflow: hidden; }
.viz-views { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.viz-row { display: flex; gap: 6px; min-height: 0; }
.viz-view { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.viz-stage.multi .viz-view { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); padding: 4px 6px; }
.viz-view-title { flex: 0 0 auto; font-size: 12.5px; color: var(--viz-muted); line-height: 1.3; padding: 1px 2px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viz-view-title b { font-weight: 600; }
.viz-view-title b:not([class*="c-"]) { color: var(--viz-text); }
.viz-view-holder { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.viz-view-holder > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viz-3d-canvas { z-index: 0; } .viz-view-holder > canvas.viz-canvas { z-index: 1; }
.viz-3d-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--viz-muted); font-size: 13px; z-index: 2; }
.viz-app[data-layout="portrait"] .viz-hide-portrait { display: none !important; }
.viz-app[data-layout="portrait"] .viz-transport .viz-optional { display: none !important; }
.viz-app[data-layout="portrait"] .viz-transport .viz-control-label { display: none; }
.viz-app[data-layout="portrait"][data-dense="2"] .viz-view-title, .viz-app[data-layout="portrait"][data-dense="3"] .viz-view-title,
.viz-app[data-layout="landscape"][data-dense="3"] .viz-view-title { display: none; }
.viz-app[data-layout="portrait"][data-dense="3"] .viz-presets-label { display: none; }
.viz-step-card .viz-card-title { text-transform: none; letter-spacing: 0; }
.viz-subhead-like { margin-top: 2px; }
.viz-app[data-layout="portrait"] .viz-stage.multi { min-height: max(260px, 54%, var(--viz-stage-need, 0px)); }

/* ---------- stage top strip: modes · presets · status ---------- */
.viz-stage-top { flex: 0 0 auto; display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; padding: 4px 6px; }
.viz-stage:not(.multi) .viz-stage-top { border-bottom: 1px solid var(--viz-border); }
.viz-stage.multi .viz-stage-top { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); }
.viz-seg { display: inline-flex; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: 999px; padding: 2px; gap: 2px; }
.viz-seg-btn { border: 0; background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--viz-text-soft); min-height: 24px; white-space: nowrap; }
.viz-seg-btn[aria-pressed="true"] { background: var(--viz-accent); color: #fff; }
.viz-presets { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
.viz-presets-label { font-size: 12px; color: var(--viz-muted); }
.viz-preset { border: 1px solid color-mix(in srgb, var(--viz-orange) 45%, var(--viz-border)); background: color-mix(in srgb, var(--viz-orange) 9%, var(--viz-card));
  color: var(--viz-text); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; cursor: pointer; min-height: 24px; white-space: nowrap; }
.viz-preset[aria-pressed="true"] { background: var(--viz-orange); border-color: var(--viz-orange); color: #fff; }
.viz-status { margin-left: auto; font-size: 12.5px; font-weight: 650; padding: 2px 10px; border-radius: 999px; background: var(--viz-accent-soft); color: var(--viz-accent-dark); max-width: 100%; }
.viz-status[data-tone="good"] { background: color-mix(in srgb, var(--viz-teal) 14%, var(--viz-card)); color: var(--viz-teal); }
.viz-status[data-tone="warn"] { background: color-mix(in srgb, var(--viz-orange) 14%, var(--viz-card)); color: var(--viz-orange); }
.viz-status[data-tone="bad"] { background: color-mix(in srgb, var(--viz-rose) 12%, var(--viz-card)); color: var(--viz-rose); }
.viz-status[hidden] { display: none; }

/* ---------- transport: play · step · restart · time scrubber · speed ---------- */
.viz-transport { flex: 0 0 auto; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; padding: 4px 6px; }
.viz-stage:not(.multi) .viz-transport { border-top: 1px solid var(--viz-border); }
.viz-stage.multi .viz-transport { background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: var(--viz-radius); box-shadow: var(--viz-shadow); }
.viz-transport .viz-control { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; align-items: center; column-gap: 6px; }
.viz-transport .viz-control input[type="range"] { grid-column: 2; grid-row: 1; margin: 0; }
.viz-transport .viz-control .viz-control-label { grid-column: 1; grid-row: 1; font-size: 12.5px; white-space: nowrap; }
.viz-transport .viz-control .viz-control-value { grid-column: 3; grid-row: 1; }
.viz-transport .viz-scrub { flex: 3 1 180px; min-width: 150px; }
.viz-transport .viz-speed { flex: 1 1 150px; min-width: 140px; }

/* ---------- explore pager items ---------- */
.viz-subhead { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--viz-muted); margin-top: 2px; }
.viz-muted { color: var(--viz-muted); }

/* ---------- term-by-term bars ---------- */
.viz-terms { display: flex; flex-direction: column; gap: 5px; }
.viz-term { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--viz-card); border: 1px solid var(--viz-border); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
.viz-term[aria-pressed="true"] { border-color: var(--term-color); box-shadow: 0 0 0 2px color-mix(in srgb, var(--term-color) 25%, transparent); }
.viz-term-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.viz-term-label { color: var(--term-color); font-weight: 600; min-width: 0; }
.viz-term-val { font-family: var(--viz-mono); font-size: 12.5px; white-space: nowrap; }
.viz-term-track { height: 9px; background: var(--viz-card-2); border-radius: 5px; overflow: hidden; }
.viz-term-fill { display: block; height: 100%; border-radius: 5px; transition: width .2s; }
.viz-term.neg .viz-term-fill { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 3px, transparent 3px 6px) !important; }
.viz-term-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13.5px; border-top: 2px solid var(--viz-accent); padding-top: 4px; }

/* ---------- inspector · right now ---------- */
.viz-inspect, .viz-notes { font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-inspect { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 7%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 5px 9px; }
.viz-notes { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 5px 9px; }
.viz-notes p, .viz-inspect p { margin: 0 0 4px; } .viz-notes p:last-child, .viz-inspect p:last-child { margin-bottom: 0; }

/* ---------- step-by-step working (Viz.work helpers) ---------- */
.viz-work-h { font-size: 13px; font-weight: 650; color: var(--viz-accent); margin: 4px 0 0; }
.viz-work-ln { font-size: 13px; line-height: 1.45; padding: 2px 0; border-bottom: 1px dashed var(--viz-border); }
.viz-work-ln b { font-variant-numeric: tabular-nums; }
.viz-work-why { color: var(--viz-muted); font-size: 12px; margin-left: 4px; }
.viz-work-res { font-size: 13px; line-height: 1.45; padding: 4px 9px; border-radius: 8px; border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 9%, var(--viz-card)); }
.viz-work-res.teal { border-left-color: var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 9%, var(--viz-card)); }
.viz-work-table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.viz-work-table th, .viz-work-table td { padding: 2px 8px 2px 0; text-align: left; border-bottom: 1px solid var(--viz-border); }
.viz-work-table th { color: var(--viz-muted); font-weight: 600; }
.viz-work-table tr.cur td { background: color-mix(in srgb, var(--viz-orange) 12%, var(--viz-card)); font-weight: 600; }
.viz-work-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; margin-right: 6px;
  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-work-hint { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--viz-muted); font-style: italic; }
.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

/* ---------- derivation stepper ---------- */
.viz-der-line { display: block; min-width: 0; border-radius: 8px; padding: 2px 6px; }
.viz-der-tag { display: block; font-size: 12px; line-height: 1.2; color: var(--viz-muted); font-variant-numeric: tabular-nums; }
.viz-der-chain { display: flex; align-items: center; gap: 6px; }
.viz-der-chain .viz-eq-body { flex: 1 1 auto; min-width: 0; }
.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }
.viz-der-chain .viz-eq-body { font-size: 14px; }
.viz-der-block { font-size: 13.5px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-der-block ol { margin: 2px 0 0 18px; padding: 0; } .viz-der-block li { margin: 0 0 2px; }
.viz-der-did { font-weight: 650; color: var(--viz-orange); padding-left: 6px; }
.viz-der-why { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-why b.k { color: var(--viz-teal); }
.viz-der-plain { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp { border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.viz-der-pick { flex-wrap: wrap; }
.viz-app[data-dense="2"] .viz-der-block, .viz-app[data-dense="3"] .viz-der-block { font-size: 13px; line-height: 1.4; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-stage { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"][data-der-picture="0"] .viz-side { flex: 1 1 auto; }
/* phones: the derivation keeps ONE view of the picture (derivation.view, else the first) and drops the strips */
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage { min-height: max(150px, 30%); flex: 0 0 auto; height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage.multi { min-height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage-top,
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-der-off { display: none !important; }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-side { flex: 1 1 auto; }
.c-accent { color: var(--viz-accent); font-weight: 650; } .c-teal { color: var(--viz-teal); font-weight: 650; }
.c-orange { color: var(--viz-orange); font-weight: 650; } .c-rose { color: var(--viz-rose); font-weight: 650; } .c-blue { color: var(--viz-blue); font-weight: 650; }

/* ---------- code tab ---------- */
.viz-code-card { min-width: 0; }
.viz-code-title { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; font-size: 13px; font-weight: 600; color: var(--viz-text-soft); margin-bottom: 3px; }
.viz-code { background: #1f2940; color: #dce6f5; border-radius: 9px; padding: 6px 8px; font-family: var(--viz-mono); font-size: 12.5px; line-height: 1.5; }
.viz-code-ln { white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 4px; padding: 0 4px 0 30px; position: relative; }
.viz-code-ln.cur { background: rgba(123,92,214,.5); box-shadow: inset 3px 0 0 #b9a5ec; }
.viz-code-no { position: absolute; left: 2px; width: 22px; text-align: right; color: #6f7fa3; user-select: none; }
.viz-code .cm { color: #8d9cc0; } .viz-code .st { color: #a5e3a0; } .viz-code .num { color: #f6b86e; }
.viz-code .kw { color: #f290c8; } .viz-code .fn { color: #7ce0d3; }
.viz-code-live { color: #ffe08a; font-weight: 700; }
.viz-step-code .viz-code { font-size: 12.5px; }

/* ---------- pager: an item taller than a page is shown in slices (Pager in viz_lib.js) ---------- */
.viz-pages { position: relative; }
.viz-pager-cue { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; display: flex; align-items: flex-end; justify-content: flex-end;
  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--viz-card) 45%); padding-right: 2px; }
.viz-pager-cue[hidden] { display: none; }
.viz-pages.viz-cont-top { box-shadow: inset 0 2px 0 0 color-mix(in srgb, var(--viz-accent) 45%, transparent); }
/* a paged text panel on portrait keeps exactly the height its pages were packed for: the stage stays at its floor */
.viz-app[data-layout="portrait"][data-paged] .viz-stage { flex-grow: 0; }
.viz-app[data-layout="portrait"][data-paged] .viz-side { flex: 1 1 0; }
.viz-pages > .viz-sliced { flex-shrink: 0; position: relative; }   /* contains KaTeX's hidden MathML, else it overflows the page */
/* room: fit() moves the portrait split between picture and text when one side cannot fit its content —
   "stage": views were squeezed below 60 px (a full text page); "text": one formula/row is taller than a text page */
.viz-app[data-layout="portrait"][data-room="stage"] .viz-stage.multi { min-height: max(300px, 62%, var(--viz-stage-need, 0px)); }
.viz-app[data-layout="portrait"][data-room="text"] .viz-stage { min-height: max(140px, 26%); }
.viz-app[data-layout="portrait"][data-room="text"] .viz-stage.multi { min-height: max(140px, 26%, var(--viz-stage-need, 0px)); }
.viz-app[data-layout="portrait"][data-room="text"][data-tab="derive"] .viz-stage { height: max(140px, 24%); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* VIZ_BASE_CSS:END */
</style>

  /* chapter-specific styles (keep small; prefer the viz_base.css tokens: var(--viz-accent) etc.) */
  .c-amber { color: var(--viz-amber, #b45309); font-weight: 650; }
  .c-muted { color: var(--viz-muted); font-weight: 650; }
  sub { font-size: max(12px, .8em); }
  .viz-stage-top .viz-presets { flex-wrap: wrap; }
  .viz-pager-label { white-space: nowrap; min-width: 52px; }
  /* phones: the preset chips go outside Explore (the walkthrough sets the cases; the status names the regime) */
  .viz-app[data-layout="landscape"] .viz-presets { display: none !important; }
  .viz-app[data-layout="portrait"]:not([data-tab="explore"]) .viz-presets { display: none !important; }
  @media (max-height: 700px) {
    .viz-app[data-layout="portrait"] .viz-presets { display: none !important; }
  }
  /* portrait: the wall-unit profile over the channel; the model row goes (its numbers are readouts and Explain 3) */
  .viz-app[data-layout="portrait"] .viz-views > .viz-row:nth-child(1) { flex-direction: column; }
  .viz-app[data-layout="portrait"] .viz-views > .viz-row:nth-child(2) { display: none !important; }
  .viz-app[data-layout="portrait"] .viz-view[data-view="semi"] { order: -1; flex-grow: 1.5 !important; }
  /* short portrait phones: the walkthrough keeps the wall-unit view only, so the step text is on the card's first page
     (the channel's key number, the laminar ÷ model ratio, is in the status line when the model is off) */
  @media (max-height: 700px) {
    .viz-app[data-layout="portrait"][data-tab="tour"] .viz-view[data-view="chan"] { display: none !important; }
    .viz-app[data-layout="portrait"][data-tab="tour"]:not([data-room]) .viz-stage.multi { min-height: max(214px, 40%); }
  }
  /* landscape phones: one row (channel | wall units) */
  .viz-app[data-layout="landscape"] .viz-views > .viz-row:nth-child(2) { display: none !important; }
  /* a chain line cut over two pages must not be re-centred in its slice (library: .viz-der-chain is align-items: center) */
  .viz-der-chain.viz-sliced { align-items: flex-start; }
</style>

<div id="app"></div>
<script id="viz-lib">

function inspectHtml(s) {
  const d = N(s), l2 = d.l * d.l;
  if (!d.on) return '<b>y⁺ = ' + f3(d.yp) + '</b>, model off (laminar):<br>' + TX`no Reynolds stress, $\nu_T=0$<br>slope $1-y^+/\mathrm{Re}_\tau$ $=\mathbf{` + t3(d.sLam) + TX`}$<br>$U^+=y^+(1-y^+/2\mathrm{Re}_\tau)$ $=` + t3(d.Ulam) + '$';
  return '<b>y⁺ = ' + f3(d.yp) + '</b>, ' + (d.Ap ? 'A⁺ = ' + pn(d.Ap, 3) : 'no damping') + TX`: $l^+=` + t3(d.l) + TX`$<br>` +
    TX`$l^{+2}s^2+s=1$: $` + t4(l2) + TX`\,s^2+s-1=0$<br>` +
    TX`$s=\dfrac{2}{1+\sqrt{1+` + t4(4 * l2) + TX`}}=\mathbf{` + t3(d.s) + TX`}$<br>` +
    '<b class="c-rose">viscous ' + pct(d.s) + '</b>, <b class="c-orange">Reynolds ' + pct(d.muv) + TX`</b> of $\tau_0$<br>` +
    TX`$\nu_T/\nu=l^{+2}s=` + t4(l2) + TX`\times` + t3(d.s) + TX`=\mathbf{` + t3(d.nuT) + '}$';
}

/* ---- Explanation & interpretation --------------------------------------------------------------------------------------- */
const EQ94 = TX`\overline{u_iu_j}=\dfrac23\bar e\,\delta_{ij}-\nu_T\Big(\dfrac{\partial U_i}{\partial x_j}+\dfrac{\partial U_j}{\partial x_i}\Big)`;
const EQ98 = TX`\nu_T,\ \kappa_T,\ \text{or}\ \kappa_{mT}\sim l_Tu_T`;
const EQ99a = TX`0=-\dfrac1\rho\dfrac{dP}{dx}+\dfrac{\partial}{\partial y}\Big(\nu\dfrac{\partial U}{\partial y}-\overline{uv}\Big)`;
const EQ100 = TX`0=-\dfrac1\rho\dfrac{dP}{dx}+\dfrac{\partial}{\partial y}\Big(\nu\dfrac{dU}{dy}+\kappa^2y^2\Big(\dfrac{dU}{dy}\Big)^2\Big)`;
const EQ101 = TX`\dfrac{dU}{dy}\cong\sqrt{\dfrac{\tau_0}{\rho}}\,\dfrac1{\kappa y},\ \text{or}\ \dfrac{U}{u_*}\cong\dfrac1\kappa\ln y+\mathit{const.}`;
const EQ101b = TX`U/u_*\cong\tfrac1\kappa\ln y+\mathit{const.}`;
const EQ81 = TX`u_*^2\equiv\tau_0/\rho`, EQ82 = TX`U^+=y^+`, EQ88 = TX`U^+=\tfrac1\kappa\ln(y^+)+B`;
const SLOPE = TX`\dfrac{dU^+}{dy^+}=\dfrac{2}{1+\sqrt{1+4l^{+2}}}`;
const RETS = [180, 550, 1000, 5200];
function explainHtml(s) {
  const W = Viz.work, d = N(s), C = d.C, l2 = d.l * d.l;
  let out = W.step(0, 'What the views show') +
    W.say(TX`<b>The channel</b> (left): the mean profile the model predicts (<b class="c-accent">purple</b>, arrows) from the wall to the centreline, against the laminar flow driven by the same pressure gradient (<b class="c-muted">grey dashed</b>, divided by the printed factor so that it fits). <b>Wall units</b> (right): the same model on a logarithmic height axis. The <b class="c-teal">teal line</b> is the straight part it tends to; its slope is $1/\kappa$ and the <b class="c-amber">amber bracket</b> at $y^+=1$ is its intercept $B$. Grey dashed: $\kappa=0.41$, $B=5.0$, a common textbook pair. <b class="c-rose">Rose dashed</b>: the sublayer line $` + EQ82 + TX`$ (12.82). Circles: a channel simulation (` + CITE + TX`), shown when $\mathrm{Re}_\tau$ is close to one of its runs.`) +
    W.say(TX`<b>Bottom</b>: what the model assumes: the <b class="c-teal">mixing length</b> $l^+$ and the <b class="c-orange">eddy viscosity</b> $\nu_T/\nu$ it produces, and how the wall stress is shared between <b class="c-rose">viscous</b> and <b class="c-orange">Reynolds</b> stress. Bold curves: the wall layer (constant stress). Dotted: the whole channel, where the stress falls to zero at the centre.`) +
    W.hint('On a phone the bottom view is hidden: its numbers at the cursor are the readouts "ν_T/ν at cursor" and "dU⁺/dy⁺ at cursor", and section 3 below. Everything is in wall units ($y^+=yu_*/\\nu$, $U^+=U/u_*$), so no unit is attached to these numbers. A closure <b>model</b>, not a simulation.');
  out += W.step(1, 'The model') +
    W.say(TX`The turbulent-viscosity hypothesis, $` + EQ94 + TX`$ (12.94), treats the Reynolds stress like a viscous stress with its own viscosity $\nu_T$. For a flow $U(y)$ only $i=1$, $j=2$ matters: $-\overline{uv}=\nu_T\,dU/dy$.`) +
    W.say(TX`A viscosity is a length times a velocity: $` + EQ98 + TX`$ (12.98). An eddy of size $l_T$ in a shear $dU/dy$ makes velocity differences $u_T\sim l_T\,dU/dy$.`) +
    W.box(TX`$-\overline{uv}=l_T^2\Big(\dfrac{dU}{dy}\Big)^2$, with $l_T=\kappa y=` + pn(d.kappa, 3) + TX`\,y$ near a wall`) +
    W.say(TX`An eddy cannot be bigger than its distance from the wall, so $l_T\propto y$; $\kappa$ is the one constant. (The code writes $l_T^2\,|dU/dy|\,dU/dy$ so that the stress keeps the sign of the shear.) Here $-\overline{uv}$ is <b>minus</b> the correlation: positive where $dU/dy>0$.`);
  out += W.step(2, 'The equation it gives') +
    W.say(TX`Put the model into the mean momentum equation: $` + EQ100 + TX`$ (12.100). Near the wall the pressure-gradient term is negligible, so the bracket does not change with $y$; at $y=0$ it is the wall stress:`) +
    W.line(TX`$\nu\dfrac{dU}{dy}+\kappa^2y^2\Big(\dfrac{dU}{dy}\Big)^2=\dfrac{\tau_0}{\rho}$`, 'constant', 'p. 594, no number: <b class="c-rose">viscous</b> + <b class="c-orange">turbulent</b> stress = wall stress') +
    W.box(TX`in wall units, with $s=dU^+/dy^+$: $\ s+l^{+2}s^2=1$`) +
    W.say(TX`Divide by $` + EQ81 + TX`$ (12.81): the first term becomes $s$, the <b class="c-rose">viscous share</b>; the second becomes $l^{+2}s^2$, the <b class="c-orange">Reynolds share</b>.`);
  out += W.step(3, 'At your height') +
    W.line('cursor', Viz.live('yp'), 'click or drag in any view');
  if (d.on) out +=
    W.line(TX`<b class="c-teal">mixing length</b> $l^+=\kappa y^+` + (d.Ap ? TX`\big(1-e^{-y^+/A^+}\big)` : '') + '=' + pn(d.kappa, 3) + TX`\times` + t3(d.yp) + (d.Ap ? TX`\times` + t3(-Math.expm1(-d.yp / d.Ap)) : '') + '$', f3(d.l), d.Ap ? 'the bracket switches the eddies off near the wall (van Driest damping)' : 'no damping: the plain model') +
    W.line(TX`<b class="c-rose">slope</b> $s=\dfrac{2}{1+\sqrt{1+4l^{+2}}}=\dfrac{2}{1+\sqrt{1+` + t4(4 * l2) + '}}$', f3(d.s), TX`the positive root of $` + t4(l2) + TX`\,s^2+s-1=0$`) +
    W.box(TX`<b class="c-orange">eddy viscosity</b> $\dfrac{\nu_T}{\nu}=l^{+2}s=` + t4(l2) + TX`\times` + t3(d.s) + TX`=\mathbf{` + t3(d.nuT) + '}$') +
    W.say('So <b class="c-rose">viscosity carries ' + pct(d.s) + '</b> of the wall stress here and the <b class="c-orange">eddies ' + pct(d.muv) + '</b> ($' + UVP + '=1-s=' + t3(d.muv) + TX`$). The profile value is $U^+=` + t4(d.U) + '$.');
  else out +=
    W.line(TX`laminar slope $\dfrac{dU^+}{dy^+}=1-\dfrac{y^+}{\mathrm{Re}_\tau}=1-\dfrac{` + t3(d.yp) + '}{' + d.Ret + '}$', f3(d.sLam), TX`model off: $\nu_T=0$, all the stress is viscous`) +
    W.box(TX`$U^+=y^+\Big(1-\dfrac{y^+}{2\mathrm{Re}_\tau}\Big)=\mathbf{` + t4(d.Ulam) + '}$') +
    W.say(TX`With the model on, the slope here would be $` + t3(d.s) + TX`$ and $\nu_T/\nu=` + t3(d.nuT) + '$.');
  out += W.step(4, 'Far from the wall') +
    W.say(TX`When $l^+\gg1$ the square root is about $2l^+$, so $s\to1/(\kappa y^+)$. In dimensional form this is $` + EQ101 + TX`$ (12.101): the logarithmic law.`) +
    W.line(TX`log slope $\dfrac1{\kappa y^+}=\dfrac1{` + pn(d.kappa, 3) + TX`\times` + t3(d.yp) + '}$', f3(d.sLog), TX`the model's slope at the cursor is $` + t3(d.s) + '$ (' + (Math.abs(d.s / d.sLog - 1) < 0.02 ? 'the same within 2 %' : f3(Math.abs(100 * (d.s / d.sLog - 1))) + ' % ' + (d.s < d.sLog ? 'below' : 'above') + ': not yet far enough') + ')') +
    W.box(TX`<b class="c-teal">slope of the straight part</b> $\dfrac1\kappa=\dfrac1{` + pn(d.kappa, 3) + TX`}=\mathbf{` + tx(1 / d.kappa, 2) + TX`}$, i.e. $\dfrac{2.303}{\kappa}=` + tx(d.perDec, 2) + TX`$ per decade of $y^+$`);
  const As = [0, 13, 26, 30].concat([0, 13, 26, 30].indexOf(d.Ap) < 0 ? [d.Ap] : []).sort((a, b) => a - b);
  out += W.step(5, 'The intercept the model implies') +
    W.line(TX`<b class="c-amber">intercept</b> $B=\lim_{y^+\to\infty}\Big[U^+-\dfrac1\kappa\ln y^+\Big]$`, fx(d.B, 2), TX`compare $` + EQ88 + TX`$ (12.88)`) +
    W.line(TX`without damping, exactly $\dfrac{\ln(4\kappa)-1}{\kappa}=\dfrac{\ln(` + t3(4 * d.kappa) + ')-1}{' + pn(d.kappa, 3) + '}$', fx(d.B0, 2), 'ours (derivation step 11)') +
    (d.Ap ? W.box(TX`<b class="c-amber">damping adds</b> $\displaystyle\int_0^\infty(s_{damped}-s_{plain})\,dy^+=` + tx(d.B - d.B0, 2) + TX`$: $\ B=` + tx(d.B0, 2) + '+' + tx(d.B - d.B0, 2) + TX`=\mathbf{` + tx(d.B, 2) + '}$') : W.box(TX`$B=\mathbf{` + tx(d.B, 2) + TX`}$, about ` + fx(-d.dB, 1) + ' below the textbook 5.0')) +
    W.table(['$A^+$', TX`$B$ for $\kappa=` + pn(d.kappa, 3) + '$', '$B-5.0$'], As.map(A => { const b = Bof(d.kappa, A); return [A ? pn(A, 3) : '0 (none)', '$' + tx(b, 2) + '$', '$' + (b - B_REF >= 0 ? '+' : '') + tx(b - B_REF, 2) + '$']; }), As.indexOf(d.Ap)) +
    W.say((d.cross === null ? TX`This log line never meets the sublayer line $` + EQ82 + TX`$ (12.82) between $y^+=1$ and 100: with $B<1$ it lies below it everywhere. ` : TX`This log line meets the sublayer line $` + EQ82 + TX`$ (12.82) at $y^+=` + t3(d.cross) + TX`$, inside the buffer layer. `) +
      TX`How good is it? With $\kappa=0.384$ (the value of Lee &amp; Moser 2015) and $A^+=26$ the model gives $B=` + tx(Bof(K_DNS, A_VD), 2) + TX`$, while the embedded dots of their $\mathrm{Re}_\tau=5186$ run give about $` + tx(BFIT_DNS, 2) + TX`$ ($350<y^+<0.15\,\mathrm{Re}_\tau$). The right size, not an agreement.`);
  const ri = RETS.indexOf(d.Ret);
  out += W.step(6, 'The whole channel') +
    W.say(TX`Across a channel the total stress is not constant but falls linearly to zero at the centre: $s+l^{+2}s^2=1-y^+/\mathrm{Re}_\tau$, and $l_T$ stops growing at $` + pn(d.cap, 2) + TX`\,\delta$ (a conventional outer-layer value, a modelling choice of ours). Integrating $s$ from the wall gives the purple profile:`) +
    W.line(TX`centreline $U_{cl}^+$ and bulk $U_{bulk}^+=\dfrac1{\mathrm{Re}_\tau}\displaystyle\int_0^{\mathrm{Re}_\tau}U^+dy^+$`, f4(C.U_cl_plus) + ' and ' + f4(C.U_bulk_plus), TX`$\mathrm{Re}_\tau=` + d.Ret + '$') +
    W.box(TX`<b class="c-accent">model</b> $C_f=\dfrac{2}{U_{bulk}^{+2}}=\dfrac2{` + t4(C.U_bulk_plus) + TX`^2}=\mathbf{` + t3(C.Cf) + '}$') +
    W.line(TX`<b class="c-muted">laminar</b>, same pressure gradient: $U_{bulk}^+=\dfrac{\mathrm{Re}_\tau}3$, $C_f=\dfrac{18}{\mathrm{Re}_\tau^2}$`, f4(d.lam.Ub) + ' and ' + f3(d.lam.Cf), TX`centreline $\mathrm{Re}_\tau/2=` + t4(d.lam.Ucl) + '$: ' + f3(d.ratio) + ' times the model\'s') +
    W.table([TX`$\mathrm{Re}_\tau$`, TX`$U_{cl}^+$ model`, '$C_f$ model', '$C_f$ laminar'], RETS.map(R => { const c = chanOf(R, d.kappa, d.Ap, d.cap); return [String(R), '$' + t4(c.U_cl_plus) + '$', '$' + t3(c.Cf) + '$', '$' + t3(18 / (R * R)) + '$']; }), ri) +
    (d.dns ? W.say(TX`Against the simulation (circles, run $\mathrm{Re}_\tau=` + d.dns.Ret.toFixed(1) + TX`$;` + CITE + TX`): the largest gap at the embedded points is $|\Delta U^+|=` + t2(d.dnsErr) + '$. ' + (d.regime === 'near' ? 'Close, for a model with two constants; it is still a model.' : 'Slide the constants and watch this number.')) : W.say('Set $\\log_{10}\\mathrm{Re}_\\tau$ near 2.26, 2.74, 3, 3.3 or 3.716 to compare with the channel simulations of ' + CITE + '.'));
  out += W.step(7, 'What it means') + W.interpret(interpText(s), 'Reading the current setting');
  return out;
}
function explainLive(s) { const d = N(s); return { yp: 'y⁺ = ' + f3(d.yp) + ' (y/δ = ' + f2(d.yp / d.Ret) + ')' }; }

/* ---- derivation D21 (steps copied from the design, Part F) ---------------------------------------------------------------- */
const BASE = st8({}), ND = st8({ Ap: 0 }), ND10 = st8({ Ap: 0, yp: 10 }), ND100 = st8({ Ap: 0, yp: 100 });
const EQ99N = TX`\begin{aligned}0&=-\frac1\rho\frac{dP}{dx}+\frac{\partial}{\partial y}\Big(\nu\frac{\partial U}{\partial y}-\overline{uv}\Big)\\[6pt]&=-\frac1\rho\frac{dP}{dx}+\frac{\partial}{\partial y}\Big([\nu+\nu_T]\Big(\frac{\partial U}{\partial y}\Big)\Big)\end{aligned}`;
const EQ94N = TX`\overline{u_iu_j}=\frac23\bar e\,\delta_{ij}-\nu_T\Big(\frac{\partial U_i}{\partial x_j}+\frac{\partial U_j}{\partial x_i}\Big)`;
const EQ100N = TX`\begin{aligned}&l_T=\kappa y:\\[6pt]&0=-\frac1\rho\frac{dP}{dx}+\frac{\partial}{\partial y}\Big(\nu\frac{dU}{dy}+\kappa^2y^2\Big(\frac{dU}{dy}\Big)^2\Big)\end{aligned}`;
const RESULT = TX`\begin{aligned}-\overline{uv}&=\kappa^2y^2\Big(\frac{dU}{dy}\Big)^2\\[6pt]\frac{dU^+}{dy^+}&=\frac{2}{1+\sqrt{1+4\kappa^2y^{+2}}}\\[6pt]\frac{U}{u_*}&\cong\frac1\kappa\ln y+\mathit{const.}\end{aligned}`;

      { did: 'Estimate the eddy velocity from the shear', tex: TX`\begin{aligned}u_T&\sim l_T\frac{dU}{dy}\\[6pt]\Rightarrow\ -\overline{uv}&=l_T^2\Big(\frac{dU}{dy}\Big)^2\end{aligned}`,

  if (!d.on) return sh ? '<b>U⁺(y⁺)</b> · <b>laminar</b> (model off)' : '<b>Wall units</b> · model off: dark = <b>laminar</b>, U⁺ = ' + f3(d.Ulam) + (wideWin() ? ' at the cursor · faint: the model and its log line' : ' · faint: the model');
  if (sh) return '<b class="c-accent">U⁺(y⁺)</b> · ' + k + ' · ' + B;
  if (!wideWin()) return '<b>Wall units</b> · <b class="c-accent">U⁺ = ' + f3(d.U) + '</b> · ' + k + ' · ' + B;
  return '<b>Wall units</b> · <b class="c-accent">model U⁺ = ' + f3(d.U) + '</b> at the cursor · <b class="c-teal">its log line: slope 1/κ = ' + fx(1 / d.kappa, 2) + '</b> · <b class="c-amber">intercept B = ' + fx(d.B, 2) + '</b> · click a height';
}
function titleChan(s) {
  const d = N(s), sh = slimWin();
  if (!d.on) return '<b>' + (sh ? 'Channel' : 'The channel') + '</b> · <b>laminar</b> ' + (sh ? '' : 'U_cl⁺ = ') + f4(d.lam.Ucl) + ' · <b class="c-accent">model ' + f3(d.C.U_cl_plus) + '</b>';
  if (sh) return '<b class="c-accent">model U⁺ ' + f3(d.C.U_cl_plus) + '</b> · <b class="c-muted">laminar ÷ ' + f3(d.ratio) + '</b>';
  return '<b>The channel</b>' + (wideWin() ? ', wall → centreline' : '') + ' · <b class="c-accent">model</b> U_cl⁺ = ' + f3(d.C.U_cl_plus) + ' · <b class="c-muted">laminar ÷ ' + f3(d.ratio) + '</b>' + (d.dns && wideWin() ? ' · ○ DNS (Lee &amp; Moser 2015)' : '');
}
function titleNut(s) {
  const d = N(s), w = wideWin();
  return '<b>' + (w ? 'What the model assumes' : 'The model') + '</b> at y⁺ = ' + f3(d.yp) + ' · <b class="c-teal">' + (w ? 'mixing length ' : '') + 'l⁺ = ' + f3(d.l) + '</b> · <b class="c-orange">' + (w ? 'eddy viscosity ' : '') + 'ν_T/ν = ' + f3(d.on ? d.nuT : 0) + '</b> · ' + (w ? 'stress: ' : '') + '<b class="c-rose">viscous ' + pct(d.on ? d.s : d.sLam) + '</b>' + (d.on ? ' + <b class="c-orange">Reynolds ' + pct(d.muv) + '</b>' + (w ? ' = τ₀' : '') : '');
}
const app = Viz.app({
  title: 'What does a closure constant do?',
  subtitle: 'The mixing-length model of a turbulent wall flow: κ turns the log line, the wall damping A⁺ slides it, and switching the model off returns the laminar parabola',
  autoplay: false,
  params: {
    kappa: { label: TX`von Kármán constant $\kappa$`, min: 0.30, max: 0.50, step: 0.002, value: DEF.kappa, help: 'mixing length l = κy; 0.41 is the textbook value, 0.384 the one of Lee & Moser (2015)' },
    Ap: { label: TX`Damping $A^+$`, min: 0, max: 40, step: 1, value: DEF.Ap, fmt: v => (v ? String(v) : '0 (none)'), help: 'eddies are switched off within about A⁺ wall units; 26 is van Driest\'s value, 0 the book\'s plain model' },
    lret: { label: TX`$\log_{10}\mathrm{Re}_\tau$`, min: 2.25, max: 4, step: 0.002, value: DEF.lret, fmt: v => fx(v, 3) + ' (Re_τ = ' + retOf(v) + ')', help: 'friction Reynolds number δu*/ν: the half-height in wall units' },
    model: { type: 'toggle', label: 'Mixing-length model on', value: true, help: 'off: no turbulent stress, the laminar flow at the same pressure gradient' },
    yp: { label: TX`Cursor height $y^+$`, min: Y0, max: 10000, log: true, value: DEF.yp, fmt: v => { const R = curD().Ret, y = Math.min(v, R); return f3(y) + ' (y/δ = ' + f2(y / R) + ')'; }, help: 'distance from the wall in wall units' },
    cap: { label: TX`Core cap of $l_T/\delta$`, min: 0.05, max: 0.2, step: 0.01, value: DEF.cap, optional: true, help: 'where the mixing length stops growing in the core (channel views only)' }
  },
  presets: [
    { label: 'no damping', set: { Ap: 0, model: true }, title: 'the book\'s plain model l = κy: the intercept is far too low' },
    { label: 'van Driest 26', set: { Ap: 26, kappa: 0.41, model: true }, title: 'A⁺ = 26 (van Driest 1956) with κ = 0.41' },
    { label: 'κ 0.384', set: { kappa: 0.384, Ap: 26, lret: 3.716, model: true }, title: 'κ = 0.384 from Lee & Moser (2015), at Re_τ = 5200' },
    { label: 'laminar', set: { model: false }, title: 'model off: the parabola driven by the same pressure gradient' },
    { label: 'Re_τ 5200', set: { lret: 3.716, model: true }, title: 'Re_τ = 5200: the largest simulation of Lee & Moser (2015) is at 5186' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'slope', label: 'Slope 1/κ', value: s => 1 / N(s).kappa, fmt: v => fx(v, 2) + ' (' + fx(v * Math.LN10, 2) + ' per decade)' },
    { id: 'B', label: 'Implied B', value: s => N(s).B, fmt: v => fx(v, 2) + ' (textbook 5.0)' },
    { id: 'nut', label: 'ν_T/ν at cursor', value: s => { const d = N(s); return d.on ? d.nuT : 0; }, fmt: v => f3(v) },
    { id: 's', label: 'dU⁺/dy⁺ at cursor', value: s => { const d = N(s); return d.on ? d.s : d.sLam; }, fmt: v => f3(v) + ' = viscous share' },
    { id: 'Ub', label: 'U_bulk⁺', value: s => { const d = N(s); return d.on ? d.C.U_bulk_plus : d.lam.Ub; }, fmt: v => f4(v) },
    { id: 'Cf', label: 'C_f (model)', value: s => N(s).C.Cf, fmt: v => f3(v) },
    { id: 'Cfl', label: 'C_f laminar', value: s => N(s).lam.Cf, fmt: v => f3(v) }
  ],
  terms: {
    title: 'The wall stress at the cursor, shared', unit: 'τ₀',
    items: [
      { id: 'visc', label: TX`viscous $\nu\,dU/dy$`, color: Viz.color('rose'), value: s => { const d = N(s); return d.on ? d.s : d.sLam; }, help: 'in wall units this is the slope dU⁺/dy⁺' },
      { id: 'rey', label: TX`Reynolds $-\overline{uv}=l_T^2(dU/dy)^2$`, color: Viz.color('orange'), value: s => { const d = N(s); return d.on ? d.muv : 0; }, help: 'minus the correlation; zero when the model is off' }
    ],
    total: { label: 'total stress' }
  },
  stage: {
    rows: [1.3, 1],
    views: [
      { id: 'chan', row: 0, flex: 1.1, title: titleChan },
      { id: 'semi', row: 0, flex: 1.3, title: titleSemi },
      { id: 'nut', row: 1, flex: 1, hidePortrait: true, title: titleNut }
    ],
    draw(g, s) { drawChan(g, s); drawSemi(g, s); drawNut(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (!(ev.type === 'pointerdown' || (ev.type === 'pointermove' && v.pointer.down))) return false;
      const x = v.pointer.x, y = v.pointer.y, Ret = N(s).Ret; let yp = null;
      const fromX = P => (x < P.px.x - 8 || x > P.px.x + P.px.w + 8 ? null : Math.pow(10, clip(P.ix(x), P.xlim[0], P.xlim[1])));
      if (ev.viewId === 'semi' && PS) yp = fromX(PS.P);
      else if (ev.viewId === 'nut') { const P = PN.find(q => x >= q.px.x - 8 && x <= q.px.x + q.px.w + 8); if (P) yp = fromX(P); }
      else if (ev.viewId === 'chan' && PC) { const P = PC.P; if (y >= P.px.y - 8 && y <= P.px.y + P.px.h + 8) yp = clip(P.iy(y), 0, 1) * Ret; }
      if (yp === null || !Number.isFinite(yp)) return false;
      g.app.set({ yp: Number(clip(yp, Y0, Ret).toPrecision(3)) }); return true;
    }
  },
  onChange(s, key, a) {
    if (SYNC) return; SYNC = true;
    try { if (key === 'lret' || key === 'yp') { const Ret = retOf(+s.lret), y = clip(+s.yp || DEF.yp, Y0, Ret); if (y !== s.yp) a.set('yp', y); } } finally { SYNC = false; }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a height in any view: the quadratic for the slope is solved there.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Slide $\\kappa$ and $A^+$ and watch the teal line and the amber bracket. Click or drag in any view to move the cursor height.',
    controls: ['kappa', 'Ap', 'lret', 'model', 'yp', 'cap'],
    readouts: ['slope', 'B', 'nut', 's', 'Ub', 'Cf', 'Cfl'],
    callouts: [{ kind: 'try', html: 'Find the $A^+$ that puts $B$ exactly on the textbook 5.0 for $\\kappa=0.41$. Then change $\\kappa$ to 0.384: does the same $A^+$ still work?' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
APP = app;
</script>
