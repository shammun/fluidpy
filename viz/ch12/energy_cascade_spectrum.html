.viz-app[data-layout="landscape"][data-dense="3"] .viz-view-title { display: none; }
.viz-app[data-layout="portrait"][data-dense="3"] .viz-presets-label { display: none; }
.viz-step-card .viz-card-title { text-transform: none; letter-spacing: 0; }

/* ---------- stage top strip: modes · presets · status ---------- */

.viz-stage:not(.multi) .viz-transport { border-top: 1px solid var(--viz-border); }

.viz-muted { color: var(--viz-muted); }

.viz-inspect, .viz-notes { font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-inspect { border-left: 3px solid var(--viz-teal); background: color-mix(in srgb, var(--viz-teal) 7%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 5px 9px; }

.viz-work-h { font-size: 13px; font-weight: 650; color: var(--viz-accent); margin: 4px 0 0; }

.viz-work-table th { color: var(--viz-muted); font-weight: 600; }

.viz-work-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; margin-right: 6px;
  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-work-hint { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--viz-muted); font-style: italic; }
.viz-work-interp { font-size: 13px; line-height: 1.45; padding: 5px 9px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); color: var(--viz-text); }
.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.viz-pop-btn.blocked { border-color: var(--viz-rose); color: var(--viz-rose); }
.viz-app:not([data-layout="wide"]) .viz-pop-btn { display: none; }

.viz-der-line { display: block; min-width: 0; border-radius: 8px; padding: 2px 6px; }
.viz-der-tag { display: block; font-size: 12px; line-height: 1.2; color: var(--viz-muted); font-variant-numeric: tabular-nums; }
.viz-der-chain { display: flex; align-items: center; gap: 6px; }
.viz-der-chain .viz-eq-body { flex: 1 1 auto; min-width: 0; }
.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }
.viz-der-chain .viz-eq-body { font-size: 14px; }
.viz-der-block { font-size: 13.5px; line-height: 1.45; color: var(--viz-text-soft); }
.viz-der-block ol { margin: 2px 0 0 18px; padding: 0; } .viz-der-block li { margin: 0 0 2px; }

.viz-der-plain { border-left: 3px solid var(--viz-accent); background: var(--viz-accent-soft); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp { border-left: 3px solid var(--viz-orange); background: color-mix(in srgb, var(--viz-orange) 8%, var(--viz-card)); border-radius: 0 8px 8px 0; padding: 4px 9px; }
.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.viz-der-pick { flex-wrap: wrap; }
.viz-app[data-dense="2"] .viz-der-block, .viz-app[data-dense="3"] .viz-der-block { font-size: 13px; line-height: 1.4; }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage { min-height: max(150px, 30%); flex: 0 0 auto; height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage.multi { min-height: max(150px, 30%); }
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-stage-top,
.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-side { flex: 1 1 auto; }
.c-accent { color: var(--viz-accent); font-weight: 650; } .c-teal { color: var(--viz-teal); font-weight: 650; }
.c-orange { color: var(--viz-orange); font-weight: 650; } .c-rose { color: var(--viz-rose); font-weight: 650; } .c-blue { color: var(--viz-blue); font-weight: 650; }

.viz-pages { position: relative; }

  font-size: 12px; line-height: 16px; font-style: italic; color: var(--viz-accent-dark); pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--viz-card) 45%); padding-right: 2px; }
.viz-pager-cue[hidden] { display: none; }

.viz-app[data-layout="portrait"][data-room="text"][data-tab="derive"] .viz-stage { height: max(140px, 24%); }

    W.say((c.ndns > 1e12 ? 'Far beyond any computer: ' : c.ndns > 1e9 ? 'A large supercomputer run: ' : 'Feasible: ') + 'this is why flows at high Reynolds number are computed with a model for the small scales.' + (s.grid ? ' ' + gridNote(c) : ''));

  o += W.step(7, 'Real cases') +
    W.say('Our own round-number examples (the same table as in the notebook), with the current setting highlighted:') +
    W.table(SLIM ? ['flow', '$\\mathrm{Re}_L$', '$\\eta$', 'dec.'] : ['flow', '$\\mathrm{Re}_L$', '$\\bar\\varepsilon$ [m²/s³]', '$\\eta$', 'decades'], tb, c.ci >= 0 ? c.ci : tb.length - 1) +

  o += W.step(8, 'What it means') + W.interpret(interpText(s), 'Reading the current setting');

}

    set: st({ dU: ABL.dU, L: ABL.L, nu: ABL.nu, grid: true }), notes: true }
];
const EQS = [
  { id: 'sup', title: 'The supply', ref: 'Eq. (12.49)', tex: R`\dot W=\bar\varepsilon,\ \ \text{so}\ \ \bar\varepsilon\sim(\Delta U)^3/L`,
    live: s => { const c = calc(s); return R`\bar\varepsilon\sim\dfrac{` + tsq(c.dU) + R`^3}{` + t3(c.L) + R`}=` + t3(c.eps) + R`\ \mathrm{m^2/s^3}`; },
    symbols: [[R`\dot W`, 'energy input to the large eddies per unit mass', 'm²/s³'], [R`\bar\varepsilon`, 'mean dissipation rate per unit mass', 'm²/s³'], [R`\Delta U`, 'outer velocity difference', 'm/s'], ['L', 'outer length: the size of the largest eddies', 'm']],
    note: 'Stationary turbulence at high Reynolds number. "∼" means "of the same order": the constant depends on the flow and is taken as 1 here.' },
  { id: 'kol', title: 'Kolmogorov scales', ref: 'Eq. (12.50)', tex: R`\eta=\big(\nu^3/\bar\varepsilon\big)^{1/4}\quad\text{and}\quad u_K=(\nu\bar\varepsilon)^{1/4}`,
    live: s => { const c = calc(s); return R`\begin{aligned}\eta&=` + t3(c.eta) + R`\ \mathrm m\\ u_K&=` + t3(c.uK) + R`\ \mathrm{m/s},\quad\eta u_K/\nu=` + t4(c.eta * c.uK / c.nu) + R`\end{aligned}`; },
    symbols: [[R`\eta`, 'Kolmogorov length: the size of the dissipating eddies', 'm'], ['u_K', 'Kolmogorov velocity', 'm/s'], [R`\nu`, 'kinematic viscosity', 'm²/s']],
    note: 'The only length and velocity that can be built from ν and ε̄. Their Reynolds number ηu_K/ν is exactly 1.' },
  { id: 'sep', title: 'Separation of scales', ref: 'Eq. (12.51)', tex: R`\eta/L\sim\mathrm{Re}_L^{-3/4},\quad\text{where }\mathrm{Re}_L=\Delta UL/\nu`,
    live: s => { const c = calc(s); return R`\begin{aligned}\mathrm{Re}_L&=` + t3(c.Re) + R`\\ \eta/L&=` + t3(c.sep) + R`\ \ (` + t3(c.dec) + R`\ \text{decades})\end{aligned}`; },
    symbols: [[R`\mathrm{Re}_L`, 'outer-scale Reynolds number', '–']],
    note: 'Obtained by eliminating ε̄ between the two equations above (D11 step 9). Every factor 10 in Re_L adds ¾ of a decade to the ladder.' },
  { id: 'tay', title: 'Taylor microscale', ref: 'Eq. (12.52)', tex: R`\dfrac{\lambda_T}{L}\propto\mathrm{Re}_L^{-1/2}`,
    live: s => { const c = calc(s); return R`\sqrt{15/\mathrm{Re}_L}=` + t3(c.lamL) + R`,\quad\lambda_T\approx` + t3(c.lam) + R`\ \mathrm m`; },
    symbols: [[R`\lambda_T`, 'Taylor microscale (either one)', 'm']],
    note: 'The end of a chain of proportionalities that holds when the fluctuation speed is proportional to ΔU. The live line takes them equal and uses the factor 15 of the isotropic relation ε̄ = 15ν u²/λ². λ_T lies between η and L but is not the size of any particular eddy.' },
  { id: 'law', title: 'Kolmogorov\'s −5/3 law', ref: 'Eq. (12.54), exponent corrected', tex: R`\begin{aligned}S_{11}(k_1)&=C_1\,\bar\varepsilon^{2/3}\,k_1^{-5/3}\\ &\text{for }2\pi/L\ll k_1\ll2\pi/\eta\end{aligned}`,
    live: s => { const c = calc(s), k = probeK(s, c); return R`\begin{aligned}k_1&=` + t3(k) + R`\ \mathrm{rad/m}:\\ S_{11}&=` + t3(S11inertial(k, c.eps, false)) + R`\ \mathrm{m^3/s^2}\end{aligned}`; },
    symbols: [['S_{11}', 'two-sided one-dimensional spectrum of the longitudinal velocity', 'm³/s²'], ['k_1', 'wavenumber along the direction of the velocity component', 'rad/m'], ['C_1', 'constant: 0.245 two-sided, 0.491 one-sided (for C ≈ 1.5)', '–']],
    note: SLIP + R`. Only the minus sign gives the units m³/s² and a finite variance.` },
  { id: 'univ', title: 'Universal small-scale spectrum', ref: 'Eq. (12.53)', tex: R`\begin{aligned}\dfrac{S_{11}(k_1)}{u_K^2\,\eta}&=\Phi(k_1\eta)\\ &\text{for }k_1\gg2\pi/L\end{aligned}`,
    live: s => { const c = calc(s); return R`\begin{aligned}u_K^2\eta&=` + t3(c.uK * c.uK * c.eta) + R`\ \mathrm{m^3/s^2}\\ 2\pi\eta/L&=` + t3(TWO_PI * c.sep) + R`\end{aligned}`; },
    symbols: [[R`\Phi`, 'one function for every high-Reynolds-number flow', '–']],
    note: 'Choose "Kolmogorov-scaled": all the grey cases and yours fall on one curve at high wavenumber; only the left end, at k₁η = 2πη/L, depends on the flow.' }
];
const Q2 = scales(2, 1, WATER), Q1 = scales(1, 1, WATER), QM = scales(1, 0.05, WATER), QW = scales(1, 0.05, AIR);
const QUIZ = [
  { q: 'Switch air → water at the same ΔU and L (mixer against wind tunnel). Which of ε̄, η and Re_L change?',
    a: R`$\eta$ (smaller: ` + fmtLen(QW.eta) + ' → ' + fmtLen(QM.eta) + R`) and $\mathrm{Re}_L$ (larger: ` + f2(QW.Re) + ' → ' + f2(QM.Re) + R`). The supply $\bar\varepsilon\sim(\Delta U)^3/L$ = ` + f2(QM.eps) + ' m²/s³ contains no viscosity, so it does not move.', set: st({ dU: 1, L: 0.05, nu: WATER }) },
  { q: 'Double ΔU from 1 to 2 m/s (L = 1 m, water). By what factor does η change?',
    a: R`$\bar\varepsilon\sim(\Delta U)^3/L$ grows 8-fold, and $\eta=(\nu^3/\bar\varepsilon)^{1/4}$, so $\eta$ is multiplied by $8^{-1/4}=0.59$: ` + fmtLen(Q1.eta, 3) + ' → ' + fmtLen(Q2.eta, 3) + '. Check it with the readout.', set: st({ dU: 2 }) },
  { q: 'How many decades lie between L and η at Re_L = 10⁸?',
    a: R`Six: $\eta/L\sim\mathrm{Re}_L^{-3/4}$, so $\log_{10}(L/\eta)=\tfrac34\times8=6$. Set $\Delta U$ = 10 m/s and $L$ = 10 m in water and read the status line. The clean $-5/3$ range is a decade or two shorter, because both ends bend.`, set: st({ dU: 10, L: 10 }) },
  { q: 'Why can the printed k₁^(+5/3) not be right? Turn the grey dotted line on.',
    a: R`Two reasons. Units: $\bar\varepsilon^{2/3}k_1^{+5/3}$ is in $\mathrm{m^{-1/3}s^{-2}}$, not the m³/s² of a spectrum. And the line climbs for ever, so the variance $\int S_{11}\,dk_1$ would be infinite. Only $S_{11}=C_1\bar\varepsilon^{2/3}k_1^{-5/3}$ passes both tests.`, set: st({ printed: true, probe: 100 }) }
];

/* ---- selftest: parity with fluidpy (py) and invariants (expect) ------------------------------------------------------- */
function selftestRows() {
  const T = tiers(1, 1, 1e-6), TA = tiers(1000, 5, 1.5e-5), cv = specCurve(1, 1e-6, 1), q8 = scales(10, 10, 1e-6);
  const E = 'lambda K, m=ch12.model_spectrum: m(K, 1.0, 1e-6, L=1.0, kind="pope")', EA = 'lambda K, m=ch12.model_spectrum: m(K, 0.125, 1.5e-5, L=1000.0, kind="pope")';
  const KS = 'np.logspace(1, 3, 50)';
  const phi = (dU, L, nu, x) => { const q = scales(dU, L, nu); return S11model(x / q.eta, q.eps, nu, L) / (q.uK * q.uK * q.eta); };
  return [
    { name: 'eps = dU^3/L', js: epsOuter(5, 1000), py: 'ch12.dissipation_outer_scaling(5.0, 1000.0)', rtol: 1e-12 },
    { name: 'eta', js: kolmogorov(1e-6, 1)[0], py: 'ch12.kolmogorov_scales(1e-6, 1.0)[0]', rtol: 1e-12 },
    { name: 'u_K', js: kolmogorov(1.5e-5, 0.125)[1], py: 'ch12.kolmogorov_scales(1.5e-5, 0.125)[1]', rtol: 1e-12 },
    { name: 'tau_eta', js: kolmogorov(1.5e-5, 20)[2], py: 'ch12.kolmogorov_scales(1.5e-5, 20.0)[2]', rtol: 1e-12 },
    { name: 'eta/L', js: separation(1e7), py: 'ch12.scale_separation(1e7)["eta_over_L"]', rtol: 1e-12 },
    { name: 'lambda_T/L (factor 15)', js: lambdaOverL(1e6), py: 'ch12.scale_separation(1e6, microscale="g")["lambdaT_over_L"]', rtol: 1e-12 },
    { name: 'decades', js: decades(3.3e8), py: 'ch12.inertial_range_decades(3.3e8)', rtol: 1e-12 },
    { name: 'DNS grid points', js: gridPoints(1e6), py: 'ch12.dns_grid_points(1e6)', rtol: 1e-12 },
    { name: 'tiers: how many', js: T.n, py: 'ch12.cascade_tiers(1.0, 1.0, 1e-6)["n_tiers"]', rtol: 0 },
    { name: 'tiers: size of tier 4', js: T.size[3], py: 'ch12.cascade_tiers(1.0, 1.0, 1e-6)["size"][3]', rtol: 1e-12 },
    { name: 'tiers: velocity of tier 4', js: T.velocity[3], py: 'ch12.cascade_tiers(1.0, 1.0, 1e-6)["velocity"][3]', rtol: 1e-12 },
    { name: 'tiers: turnover of tier 6', js: T.turnover[5], py: 'ch12.cascade_tiers(1.0, 1.0, 1e-6)["turnover"][5]', rtol: 1e-12 },
    { name: 'tiers: Re of the last tier', js: T.Re[T.n - 1], py: 'ch12.cascade_tiers(1.0, 1.0, 1e-6)["Re"][14]', rtol: 1e-11 },
    { name: 'tiers, atmosphere: how many', js: TA.n, py: 'ch12.cascade_tiers(1000.0, 5.0, 1.5e-5)["n_tiers"]', rtol: 0 },
    { name: 'S11 inertial (two-sided)', js: S11inertial(100, 1, false), py: 'ch12.inertial_spectrum_1d(100.0, 1.0)', rtol: 1e-10 },
    { name: 'S11 printed (+5/3)', js: S11inertial(100, 1, true), py: 'ch12.inertial_spectrum_1d(100.0, 1.0, printed=True)', rtol: 1e-10 },
    { name: 'two-sided C1', js: C1_TWO, py: 'ch12.kolmogorov_constants()["C1_two_sided"]', rtol: 1e-12 },
    { name: 'one-sided C1', js: C1_ONE, py: 'ch12.kolmogorov_constants()["C1_one_sided"]', rtol: 1e-12 },
    { name: 'model spectrum E(K)', js: Epao(50, 1, 1e-6, 1), py: 'ch12.model_spectrum(50.0, 1.0, 1e-6, L=1.0, kind="pope")', rtol: 1e-8 },
    { name: 'model spectrum E(K), dissipation range', js: Epao(1e4, 1, 1e-6, 1), py: 'ch12.model_spectrum(1e4, 1.0, 1e-6, L=1.0, kind="pope")', rtol: 1e-8 },
    { name: 'model spectrum E(K), energy range', js: Epao(0.5, 0.125, 1.5e-5, 1000), py: 'ch12.model_spectrum(0.5, 0.125, 1.5e-5, L=1000.0, kind="pope")', rtol: 1e-8 },
    { name: 'model S11 (two-sided) at k1 = 100', js: S11model(100, 1, 1e-6, 1), py: 'ch12.one_dimensional_from_3d(100.0, ' + E + ', one_sided=False)', rtol: 1e-6 },
    { name: 'model S11 near the roll-off, k1 = 2e4', js: S11model(2e4, 1, 1e-6, 1), py: 'ch12.one_dimensional_from_3d(2e4, ' + E + ', one_sided=False)', rtol: 1e-6 },
    { name: 'model S11 below 2 pi/L, k1 = 1', js: S11model(1, 1, 1e-6, 1), py: 'ch12.one_dimensional_from_3d(1.0, ' + E + ', one_sided=False)', rtol: 1e-6 },
    { name: 'model S11, atmosphere, k1 = 1', js: S11model(1, 0.125, 1.5e-5, 1000), py: 'ch12.one_dimensional_from_3d(1.0, ' + EA + ', one_sided=False)', rtol: 1e-6 },
    { name: 'case table: eta of the wind tunnel', js: scales(CASES[1].dU, CASES[1].L, CASES[1].nu).eta, py: 'ch12.scale_table("wind_tunnel")["eta"]', rtol: 1e-12 },
    { name: 'case table: decades of the atmosphere', js: Q_ABL.dec, py: 'ch12.scale_table("atmospheric_boundary_layer")["decades"]', rtol: 1e-12 },
    { name: 'case table: eps of the ocean', js: scales(CASES[3].dU, CASES[3].L, CASES[3].nu).eps, py: 'ch12.scale_table("ocean_thermocline")["eps"]', rtol: 1e-12 },
    { name: 'case table: Re of the mixer', js: scales(CASES[0].dU, CASES[0].L, CASES[0].nu).Re, py: 'ch12.scale_table("kitchen_mixer")["Re_L"]', rtol: 1e-12 },
    { name: 'log-log slope of the law', js: -5 / 3, py: 'ch12.fit_inertial_range(' + KS + ', ch12.inertial_spectrum_1d(' + KS + ', 2.0), (10.0, 1000.0))[0]', rtol: 1e-10 },
    { name: 'eta uK / nu', js: kolmogorov(1e-6, 3)[0] * kolmogorov(1e-6, 3)[1] / 1e-6, expect: 1, rtol: 1e-12 },
    { name: 'u^3/l = eps on every tier', js: Math.pow(TA.velocity[9], 3) / TA.size[9], expect: 0.125, rtol: 1e-12 },
    { name: 'last tier: eddy Reynolds number between 1 and 2^(4/3)', js: (T.Re[T.n - 1] >= 1 && T.Re[T.n - 1] <= Math.pow(2, 4 / 3)) ? 1 : 0, expect: 1, rtol: 0 },
    { name: 'Re_L = 1e8: six decades', js: q8.dec, expect: 6, rtol: 1e-12 },
    { name: 'model / law in the middle of a wide inertial range', js: S11model(3, 0.125, 1.5e-5, 1000) / S11inertial(3, 0.125, false), expect: 1, rtol: 0.02 },
    { name: 'slope of the model curve in the inertial range', js: (L10(S11model(10, 0.125, 1.5e-5, 1000)) - L10(S11model(1, 0.125, 1.5e-5, 1000))), expect: -5 / 3, rtol: 0.01 },
    { name: 'plotted grid curve = Simpson value (k1 = 100)', js: Math.pow(10, curveAt(cv, 2)) / S11model(100, 1, 1e-6, 1), expect: 1, rtol: 2e-3 },
    { name: 'plotted grid curve = Simpson value (k1 = 3e4)', js: Math.pow(10, curveAt(cv, L10(3e4))) / S11model(3e4, 1, 1e-6, 1), expect: 1, rtol: 5e-3 },
    { name: 'Kolmogorov scaling collapses two flows at k1 eta = 0.1', js: phi(5, 1000, 1.5e-5, 0.1) / phi(0.1, 10, 1e-6, 0.1), expect: 1, rtol: 1e-3 },
    { name: 'printed form: law x printed = (C1 eps^(2/3))^2', js: S11inertial(7, 2, false) * S11inertial(7, 2, true) / Math.pow(C1_TWO * Math.pow(2, 2 / 3), 2), expect: 1, rtol: 1e-12 }
  ];
}

/* ---- the app ---------------------------------------------------------------------------------------------------------- */
const app = Viz.app({
  title: 'What does a higher Reynolds number change?',
  subtitle: 'The big eddies fix the energy supply; viscosity only decides how far down the ladder it must go. The cascade from L to η (top) and the energy spectrum with its −5/3 range (bottom)',
  params: {
    dU: { label: R`Velocity difference $\Delta U$`, min: 0.01, max: 50, log: true, value: 1, fmt: v => f3(v) + ' m/s', help: 'the speed of the largest eddies' },
    L: { label: 'Outer length $L$', min: 0.01, max: 1e4, log: true, value: 1, fmt: v => fmtLen(v, 3), help: 'the size of the largest eddies' },
    nu: { type: 'select', display: 'chips', label: R`Fluid (viscosity $\nu$)`, options: [[AIR, 'air 1.5×10⁻⁵ m²/s'], [WATER, 'water 10⁻⁶ m²/s']], value: WATER },
    printed: { type: 'toggle', label: R`Show the printed $k_1^{+5/3}$ (slip #1)`, value: false, optional: true },
    grid: { type: 'toggle', label: 'Mark a 1 km model grid', value: false, optional: true }
  },
  modes: { param: 'scaled', label: 'Axes', options: [['phys', 'physical units'], ['kolm', 'Kolmogorov-scaled']], value: 'phys' },
  presets: CASES.map((cs, i) => ({ label: i === 2 ? 'atmosphere' : cs.short, set: { dU: cs.dU, L: cs.L, nu: cs.nu, grid: i === 2 }, title: cs.name + ': ΔU = ' + cs.dU + ' m/s, L = ' + cs.L + ' m, ' + cs.fluid }))
    .concat([{ label: 'low Re', set: { dU: 0.05, L: 0.02, nu: AIR, grid: false }, title: 'Re_L = 67: L and η too close for an inertial range' }]),
  status: s => statusOf(s),
  readouts: [
    { id: 'Re', label: '$\\mathrm{Re}_L=\\Delta UL/\\nu$', value: s => calc(s).Re, fmt: v => f3(v) },
    { id: 'eps', label: 'Supply $\\bar\\varepsilon$', value: s => calc(s).eps, fmt: v => f3(v) + ' m²/s³' },
    { id: 'eta', label: 'Smallest eddies $\\eta$', value: s => calc(s).eta, fmt: v => fmtLen(v, 3) },
    { id: 'uK', label: 'Their speed $u_K$', value: s => calc(s).uK, fmt: v => f3(v) + ' m/s' },
    { id: 'tau', label: 'Their lifetime $\\tau_\\eta$', value: s => calc(s).tau, fmt: v => Viz.fmtTime(v) },
    { id: 'lam', label: '$\\lambda_T/L$', value: s => calc(s).lamL, fmt: v => f3(v) },
    { id: 'ndns', label: 'Grid points $(L/\\eta)^3$', value: s => calc(s).ndns, fmt: v => f2(v) }
  ],
  stage: {
    animate: true,
    rows: [0.8, 1.2],
    views: [
      { id: 'ladder', row: 0, flex: 1, title: s => { const c = calc(s), T = tiers(c.L, c.dU, c.nu); return '<b>The cascade</b> · <b class="c-orange">ε̄ = ' + f3(c.eps) + ' m²/s³</b> through ' + T.n + ' tiers' + (SHORT() ? '' : ' · <b class="c-accent">L</b> ' + fmtLen(c.L) + ' → <b class="c-rose">η</b> ' + fmtLen(c.eta)); } },
      { id: 'spec', row: 1, flex: 1.4, title: s => { const c = calc(s), kol = s.scaled === 'kolm'; return '<b>Spectrum</b> · ' + (s.probe ? 'k₁ = ' + f3(s.probe) + ' rad/m: <b class="c-orange">law</b> ' + f3(S11inertial(s.probe, c.eps, false)) + ' · <b class="c-teal">model</b> ' + f3(modelAt(s.probe, c)) + ' m³/s²' : (kol ? 'Kolmogorov units: one curve for every flow' : 'two-sided S₁₁(k₁) · click to inspect')); } },
      { id: 'cases', row: 1, flex: 0.8, hidePortrait: true, title: () => (window.innerWidth < 1100 ? '<b>Real cases</b>' : '<b>Real cases</b> · our round numbers') }
    ],
    step(g, s, dt) { CLOCK += dt; },
    draw(g, s) { drawLadder(g, s); drawSpec(g, s); drawCases(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (ev.viewId === 'spec' && PS) {
        if (!(ev.type === 'pointerdown' || (ev.type === 'pointermove' && v.pointer.down))) return false;
        if (!PS.P.inside(v.pointer.x, v.pointer.y)) return false;
        g.app.set({ probe: Number(Math.pow(10, PS.P.ix(v.pointer.x) - PS.lux).toPrecision(3)) });
        return true;
      }
      if (ev.viewId === 'cases' && CASEGEO && ev.type === 'pointerdown') {
        const hit = CASEGEO.filter(q => v.pointer.y >= q.y0 && v.pointer.y < q.y1)[0];
        if (!hit || hit.idx < 0) return false;
        const cs = CASES[hit.idx]; LAST = 'dU';
        g.app.set({ dU: cs.dU, L: cs.L, nu: cs.nu, grid: hit.idx === 2 });
        return true;
      }
      return false;
    }
  },
  onChange(s, key) { const ks = [].concat(key || []); if (ks.indexOf('nu') >= 0 && ks.indexOf('dU') < 0 && ks.indexOf('L') < 0) LAST = 'nu'; else if (ks.indexOf('dU') >= 0 || ks.indexOf('L') >= 0) LAST = 'dU'; },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click the spectrum: the −5/3 law is worked out at that wavenumber, with its units.',
  notes: s => '<p>' + interpText(s) + '</p><p>' + gridNote(calc(s)) + '</p>',
  explore: {
    intro: 'Drag $\\Delta U$ and $L$, switch the fluid, and watch which end of the ladder moves. Click the spectrum to check the $-5/3$ law at any wavenumber.',
    controls: ['dU', 'L', 'nu', 'printed', 'grid'],
    readouts: ['Re', 'eps', 'eta', 'uK', 'tau', 'lam', 'ndns'],
    callouts: [{ kind: 'try', html: 'Choose <b>Kolmogorov-scaled</b> and step through the presets: every flow lies on the same curve at the right; only the <b class="c-accent">left end</b> moves. Then switch back to physical units: each flow has its own curve again.' }]
  },
  explain: { html: s => explainHtml(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
</script>
