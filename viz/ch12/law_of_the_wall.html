function drawStress(g, s) {

  drawBands(P, ctx, ax, c, false);
  semilogFrame(v, P, decTicks(ax.xr[0], ax.xr[1], P.px.w, 40), P.px.h < 70 ? [[0, '0'], [1, '1']] : [[0, '0'], [0.5, '0.5'], [1, '1']], tiny ? null : xLabel(ax, true), narrow ? null : 'stress / τ₀');

    P.line(lx, F.rey.slice(i0), { color: orange, width: 2.6 });
    P.line(lx, F.vis.slice(i0), { color: rose, width: 2.6 });
    vline(P, ctx, xc, Viz.alpha(ink, 0.5), [], 1);
  });
  if (isFinite(F.eq) && !c.rough) {
    const pq = partition(F.eq, c.Ret, c.k, c.B), X = P.X(ax.toX(F.eq)), Y = P.Y(pq[0]);
    if (X > P.px.x && X < P.px.x + P.px.w) { diamond(ctx, X, Y, 6, ink); if (!tiny) Viz.text(ctx, narrow ? 'equal: y⁺ ' + fx(F.eq, 1) : 'equal shares at y⁺ = ' + fx(F.eq, 1), X + 10, Y, { size: 12, weight: 650, color: Viz.color('text-soft'), bg: true }); }
  }
  if (!tiny && !narrow) Viz.text(ctx, 'total  1 − y/δ', P.px.x + P.px.w - 6, P.px.y + 10, { size: 12, color: Viz.color('text-soft'), align: 'right', bg: true });
  if (!c.inRough) { P.dot(xc, c.rey, 4.5, { color: orange, stroke: '#fff', strokeWidth: 1.5 }); P.dot(xc, c.vis, 4.5, { color: rose, stroke: '#fff', strokeWidth: 1.5 }); }
  GEO.stress = { P, ax };
}

function drawInd(g, s) {
  const v = g.view('ind'); v.clear(); GEO.ind = null;
  const ctx = v.ctx, W = v.w, H = v.h; if (W < 90 || H < 56) return;
  const c = calc(s), F = frameData(s, c), ax = axisOf(s, c), narrow = W < 420, tiny = H < 130, fit = fitsOf(s, c);
  const purple = Viz.color('accent'), teal = Viz.color('teal'), amber = Viz.color('amber'), ink = Viz.color('text'), soft = Viz.color('text-soft');
  const P = v.plot({ xlim: ax.xr, ylim: [0, 6.5], pad: { l: narrow ? 30 : 50, r: 10, t: 6, b: tiny ? 20 : 36 } });
  drawBands(P, ctx, ax, c, false);
  semilogFrame(v, P, decTicks(ax.xr[0], ax.xr[1], P.px.w, 40), linTicks(0, 6.5, P.px.h, 24), tiny ? null : xLabel(ax, true), narrow ? null : 'y⁺ dU⁺/dy⁺');
  const i0 = c.rough ? Math.max(0, F.yp.findIndex(y => y >= 10 * c.y0)) : 0, lx = F.yp.slice(i0).map(ax.toX), xc = ax.toX(c.yp), lev = 1 / c.k;
  let fitX = null;
  P.clip(() => {
    if (F.plat) { const xa = P.X(ax.toX(F.plat[0])), xb = P.X(ax.toX(F.plat[1])); ctx.fillStyle = Viz.alpha(teal, 0.2); ctx.fillRect(xa, P.Y(lev * 1.05), xb - xa, P.Y(lev * 0.95) - P.Y(lev * 1.05)); }
    P.line([ax.xr[0], ax.xr[1]], [lev, lev], { color: teal, width: 2, dash: [6, 4] });
    if (s.dns && c.dns >= 0) { const d = DNS[c.dns]; ctx.fillStyle = Viz.alpha(ink, 0.8); for (let j = 0; j < d.yp.length; j++) { ctx.beginPath(); ctx.arc(P.X(ax.toX(d.yp[j] * c.Ret / d.Ret)), P.Y(d.yp[j] * d.dU[j]), 2.1, 0, 2 * Math.PI); ctx.fill(); } }
    P.line(lx, F.ind.slice(i0), { color: purple, width: 3 });
    // the fit window and what a straight-line fit over it returns (a level 1/κ_fit)
    if (fit.hi > fit.lo) {
      const xa = ax.toX(fit.lo), xb = ax.toX(fit.hi), yb = P.px.y + P.px.h - 9;
      ctx.save(); ctx.strokeStyle = amber; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(P.X(xa), yb); ctx.lineTo(P.X(xb), yb); ctx.stroke();
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(P.X(xb), yb - 5); ctx.lineTo(P.X(xb), yb + 5); ctx.stroke(); ctx.restore();
      if (fit.dns) P.line([xa, xb], [1 / fit.dns.kappa, 1 / fit.dns.kappa], { color: Viz.alpha(ink, 0.85), width: 2 });
      if (fit.model) P.line([xa, xb], [1 / fit.model.kappa, 1 / fit.model.kappa], { color: amber, width: 3 });
      vline(P, ctx, xa, Viz.alpha(amber, 0.8), [3, 3], 1.4);
      fitX = P.X(xa);
      ctx.save(); ctx.fillStyle = amber; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(fitX, yb, 6.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke(); ctx.restore();
    } else { fitX = P.X(ax.toX(fit.lo)); vline(P, ctx, ax.toX(fit.lo), Viz.alpha(amber, 0.8), [3, 3], 1.4); }
    vline(P, ctx, xc, Viz.alpha(ink, 0.5), [], 1);
  });
  if (!tiny) {
    Viz.text(ctx, '1/κ = ' + fx(lev, 2), P.px.x + 6, P.Y(lev) + 11, { size: 12, weight: 650, color: teal, bg: true });
    const msg = fit.hi > fit.lo ? (narrow ? 'drag ● : fit window' : '● drag: the fit window starts at y⁺ = ' + fmtRe(fit.lo)) : 'no fit window: 0.15 δ⁺ < ' + fmtRe(fit.lo);
    Viz.text(ctx, msg, P.px.x + P.px.w - 6, P.px.y + 10, { size: 12, color: soft, align: 'right', bg: true, maxWidth: P.px.w - 12 });
    if (F.plat && !narrow) Viz.text(ctx, 'within 5 % of 1/κ', Math.min(P.X(ax.toX(Math.sqrt(F.plat[0] * F.plat[1]))), P.px.x + P.px.w - 60), P.Y(lev * 1.05) - 9, { size: 12, color: teal, align: 'center', bg: true });
  }
  if (!c.inRough && c.ind <= 6.5) P.dot(xc, c.ind, 4.5, { color: purple, stroke: '#fff', strokeWidth: 1.5 });
  GEO.ind = { P, ax, fitX };
}

    'The smooth-wall form with $B=-\\frac1\\kappa\\ln y_0^+=' + fx(c.B, 2) + '$ gives the same number: ' + fx(c.Ulog, 2) + '. ' + (c.inRough ? 'Below $10\\,y_0$ this is only an extrapolation.' : 'No viscosity in it: $y_0$ = ' + fmtLen(c.y0 * LNU) + ' is a property of the surface.');

    '<b class="c-rose">Sublayer law</b> $U^+=y^+=' + t3(c.Usub) + '$. <b class="c-accent">Profile</b> (Spalding' + (c.Pi > 0 ? ' + wake' : '') + ', a model) ' + fx(c.U, 2) + ': ' + fx(Math.abs(c.U - c.Ulog), 2) + (c.U < c.Ulog ? ' below' : ' above') + ' the log law. ' +
    'Viscous share of the stress: $\\dfrac{dU^+/dy^+}{1-y/\\delta}=\\dfrac{' + t3(c.vis) + '}{' + t3(c.tot) + '}$ = ' + pct(c.vshare) + '.';

/* ---- Explanation & interpretation ------------------------------------------------------------------------------------- */
const EQ80 = R`U^+\equiv\dfrac{U}{u_*}=f\Big(\dfrac{y\,u_*}{\nu}\Big)=f(y^+)`, EQ80s = R`U^+=U/u_*=f(y^+)`;
const EQ81 = R`u_*^2\equiv\tau_0/\rho`, EQ82 = R`U^+=y^+`, EQ84 = R`\dfrac{U_\infty-U}{u_*}=F\Big(\dfrac{y}{\delta}\Big)=F(\xi)`, EQ84s = R`(U_\infty-U)/u_*=F(y/\delta)`;
const EQ87 = R`-\xi\dfrac{dF}{d\xi}=y^+\dfrac{df}{dy^+}`, EQ87s = R`-\xi\,dF/d\xi=y^+\,df/dy^+`;
const EQ88 = R`U^+=\dfrac1\kappa\ln(y^+)+B`, EQ88s = R`U^+=\tfrac1\kappa\ln(y^+)+B`, EQ89s = R`F(\xi)=-\tfrac1\kappa\ln(\xi)+A`;
const EQ92 = R`\kappa B=1.6\,[\exp(0.1663B)-1]`, EQ93 = R`U^+=\dfrac{U}{u_*}=\dfrac1\kappa\ln\Big(\dfrac{y}{y_0}\Big)`, EQ93s = R`U^+=\tfrac1\kappa\ln(y/y_0)`;
const EQ76a = R`0=-\partial P/\partial x+\partial\bar\tau/\partial y`, EQ90s = R`dP/dx=-2\tau_0/h`, EQ91s = R`dP/dx=-4\tau_0/d`;
const CITE = 'Lee &amp; Moser, <i>J. Fluid Mech.</i> 774, 395 (2015)';
function kbSource(c) {
  if (c.rough) return 'rough wall: $B=-\\frac1\\kappa\\ln y_0^+$';
  if (Math.abs(c.k - K_TEXT) < 1e-9 && Math.abs(c.B - B_TEXT) < 1e-9) return '$\\kappa=0.41$, $B=5.0$: a common textbook pair';
  if (Math.abs(c.k - K_DNS) < 1e-9) return '$\\kappa=0.384$: the value Lee &amp; Moser (2015) report for their channel simulation at $\\mathrm{Re}_\\tau\\approx5200$' + (Math.abs(c.B - B_DNSFIT) < 1e-9 ? '; $B$ is the intercept fitted here to their profile from $y^+=350$' : '');
  return 'your own $\\kappa$ and $B$';
}

  const cur = rows.findIndex(r => r[0] === fmtRe(s.fit0));
  o += W.step(7, 'The indicator and the fit window') +
    W.box(R`$` + EQ87s + R`=\dfrac1\kappa$ (12.87): the level is $\dfrac1{` + t3(c.k) + R`}=\mathbf{` + fx(1 / c.k, 2) + R`}$; at the cursor the purple curve has $y^+\dfrac{dU^+}{dy^+}=` + fx(c.ind, 2) + '$') +
    W.say('A measured $\\kappa$ is the slope of a straight line fitted to the profile over a window. Results for windows that end at $0.15\\,\\delta^+=' + t3(c.logHi) + '$:') +
    W.table(c.dns >= 0 ? ['from $y^+$', 'model $\\kappa$, $B$', 'DNS $\\kappa$, $B$'] : ['from $y^+$', 'model: $\\kappa$, $B$'], rows, cur) +
    W.say((c.rough ? 'A pure logarithm returns its own constants from any window. ' : 'The model curve was built with $\\kappa=' + t3(c.k) + '$, $B=' + fx(c.B, 2) + '$, yet a fit that starts at $y^+=30$ does not return them: Spalding\'s curve is still below the log line there. ') +
      (c.dns >= 0 ? 'The simulation at $\\mathrm{Re}_\\tau=' + DNS[c.dns].label + '$ drifts the other way. ' : 'Choose a preset with dots (180, 1000, 5200) to fit a simulation too. ') + 'A quoted $\\kappa$ always belongs to a window.');
  o += W.step(8, 'What it means') + W.interpret(interpText(s), 'Reading the current setting');
  return o;
}

  { id: 'D17', title: 'Why the total stress is a straight line', short: 'D17 · stress', ref: 'Eqs. (12.76), (12.77), (12.90), (12.91)', view: 'stress', set: DBASE,

  { id: 'D18', title: 'Why wall units make one curve', short: 'D18 · wall law', ref: 'Eqs. (12.80), (12.81), (12.82)', view: 'prof', set: DBASE,

/* ---- the app ---------------------------------------------------------------------------------------------------------- */
function profTitle(s) {
  const c = calc(s), sh = SHORT();
  if (s.scaling === 'outer') return '<b>Defect against y/δ</b> · y/δ = ' + f2(c.xi) + ': <b class="c-accent">profile ' + fx(c.defect, 2) + '</b> · <b class="c-teal">log ' + fx(c.Flog, 2) + '</b>' + (sh ? '' : ' · grey: Re_τ 182, 1001, 5186 · dots: channel DNS (Lee &amp; Moser 2015)');
  if (sh) return '<b>U⁺(y⁺)</b> · <b class="c-accent">' + fx(c.U, 2) + '</b> · <b class="c-teal">log ' + fx(c.Ulog, 2) + '</b> · y⁺dU⁺/dy⁺ ' + fx(c.ind, 2) + ' (1/κ ' + fx(1 / c.k, 2) + ')';
  return '<b>U⁺ against y⁺</b> · y⁺ = ' + ypTxt(c.yp) + ': <b class="c-accent">profile ' + fx(c.U, 2) + '</b>' + (c.rough ? '' : ' · <b class="c-rose">U⁺ = y⁺: ' + ypTxt(c.Usub) + '</b>') + ' · <b class="c-teal">log law ' + fx(c.Ulog, 2) + '</b>' + (s.dns && window.innerWidth >= 1100 ? ' · dots: channel DNS (Lee &amp; Moser 2015)' : '');
}
function stressTitle(s) {
  const c = calc(s);
  return '<b>Who carries the stress</b> · <b class="c-rose">viscous ' + pct(c.vshare) + '</b> · <b class="c-orange">Reynolds ' + pct(1 - c.vshare) + '</b>' + (window.innerWidth < 1600 ? '' : ' of τ̄ = ' + f2(c.tot) + ' τ₀');
}
function indTitle(s) {
  const c = calc(s), f = fitsOf(s, c);
  return '<b>y⁺ dU⁺/dy⁺</b> · ' + (f.model ? '<b class="c-amber">fit: κ ' + fx(f.model.kappa, 3) + ', B ' + fx(f.model.B, 2) + '</b>' + (f.dns ? ' · DNS: κ ' + fx(f.dns.kappa, 3) + ', B ' + fx(f.dns.B, 2) : '') : 'no fit window');
}
const VIEWS = LAND
  ? [{ id: 'prof', row: 0, flex: 1.25, title: profTitle }, { id: 'stress', row: 0, flex: 1, title: s => { const c = calc(s); return '<b>Stress</b> · <b class="c-rose">visc. ' + pct(c.vshare) + '</b> · <b class="c-orange">Re. ' + pct(1 - c.vshare) + '</b>'; } }, { id: 'ind', row: 0, flex: 1, hidePortrait: true, title: indTitle }]
  : [{ id: 'prof', row: 0, flex: 1, title: profTitle }, { id: 'stress', row: 1, flex: 1, title: stressTitle }, { id: 'ind', row: 1, flex: 1, hidePortrait: true, title: indTitle }];
const app = Viz.app({
  title: 'Where does the logarithm come from?',
  subtitle: 'Wall units collapse every profile near the wall, outer units far from it; where both hold, y dU/dy can depend on neither length. Mean velocity (top), the stress shares and y⁺dU⁺/dy⁺ (bottom)',
  params: {
    lret: { label: R`Friction Reynolds number $\mathrm{Re}_\tau=\delta^+$`, min: 2, max: 6, step: 0.01, value: 3, fmt: v => fmtRe(Math.pow(10, v)), help: 'outer size over viscous length, δ u*/ν' },
    kappa: { label: R`von Kármán constant $\kappa$`, min: 0.36, max: 0.43, step: 0.002, value: K_TEXT, fmt: v => fx(v, 3), help: '0.41 with B = 5.0: a common textbook pair' },
    B: { label: 'Additive constant $B$', min: 3.5, max: 6, step: 0.05, value: B_TEXT, fmt: v => fx(v, 2), help: 'shifts the log line up or down' },
    yp: { label: 'Cursor height $y^+$', min: 0.5, max: 1e6, log: true, value: 100, fmt: v => ypTxt(v), help: 'or drag in a view; it stops at the edge δ⁺' },
    wall: { type: 'select', display: 'chips', label: 'Wall', options: [['smooth', 'smooth'], ['rough', 'rough']], value: 'smooth' },
    y0p: { label: R`Roughness length $y_0^+=y_0u_*/\nu$`, min: 3, max: 1000, log: true, value: 30, fmt: v => f3(v), optional: true, help: 'where the logarithm gives U = 0' },
    fit0: { label: 'Fit window starts at $y^+$', min: 30, max: 1000, log: true, value: 30, fmt: v => fmtRe(v), optional: true, help: 'it ends at 0.15 δ⁺' },
    Pi: { label: R`Wake strength $\Pi$`, min: 0, max: 1, step: 0.05, value: 0.2, fmt: v => fx(v, 2), optional: true, help: 'illustrative; set by the outer flow' },
    dns: { type: 'toggle', label: 'Channel DNS dots (Lee & Moser 2015)', value: true, optional: true }
  },
  modes: { param: 'scaling', label: 'Scaling', options: [['inner', 'inner: wall units'], ['outer', 'outer: defect, y/δ']], value: 'inner' },
  presets: [
    { label: 'Re_τ 180', set: { lret: L180, wall: 'smooth' }, title: 'the smallest simulation: no logarithmic layer' },
    { label: '1000', set: { lret: L1000, wall: 'smooth' }, title: 'Re_τ = 1001: a simulation with a short logarithmic layer' },
    { label: '5200', set: { lret: L5200, wall: 'smooth' }, title: 'Re_τ = 5186: the largest simulation of Lee & Moser (2015)' },
    { label: 'atmosphere 10⁶', set: { lret: 6, wall: 'smooth', yp: 1000 }, title: 'Re_τ = 10⁶, the order of the atmospheric surface layer (drawn with a smooth wall)' },
    { label: 'rough wall', set: { wall: 'rough', lret: 6, y0p: 800, yp: 1e5, scaling: 'inner' }, title: 'y₀⁺ = 800: in our example y₀ = 2.4 cm, grass' },
    { label: 'κ 0.384', set: { kappa: K_DNS, B: B_DNSFIT, lret: L5200, wall: 'smooth', fit0: 350 }, title: 'κ = 0.384 from Lee & Moser (2015); B = the intercept this page fits to their Re_τ = 5186 profile between y⁺ = 350 and 0.15 δ⁺' },
    { label: 'κ 0.41, B 5.0', set: { kappa: K_TEXT, B: B_TEXT, wall: 'smooth', fit0: 30 }, title: 'a common textbook pair' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'U', label: 'U⁺ (profile)', value: s => calc(s).U, fmt: v => fx(v, 2) },
    { id: 'Usub', label: 'U⁺ = y⁺', value: s => calc(s).Usub, fmt: v => ypTxt(v) },
    { id: 'Ulog', label: 'log law', value: s => calc(s).Ulog, fmt: v => fx(v, 2) },
    { id: 'vshare', label: 'viscous share', value: s => calc(s).vshare, fmt: v => pct(v) },
    { id: 'ind', label: 'y⁺dU⁺/dy⁺', value: s => calc(s).ind, fmt: v => fx(v, 2) },
    { id: 'dec', label: 'log layer [decades]', value: s => calc(s).dec, fmt: v => (v > 0 ? fx(v, 2) : 'none') },
    { id: 'Cf', label: 'skin friction $C_f$', value: s => calc(s).Cf, fmt: v => f3(v) },
    { id: 'kfit', label: 'fitted κ', value: s => { const f = fitsOf(s, calc(s)); return f.model ? f.model.kappa : NaN; }, fmt: v => (isFinite(v) ? fx(v, 3) : 'no window') }
  ],
  stage: {
    animate: !PHONE,
    rows: LAND ? [1] : [1.3, 1],
    views: VIEWS,
    step(g, s, dt) { CLOCK += dt; },
    draw(g, s) { document.body.classList.toggle('lw-smooth', s.wall !== 'rough'); drawProf(g, s); drawStress(g, s); drawInd(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel' || ev.type === 'pointerleave') { if (!v.pointer.down) DRAG = null; return false; }
      const G = GEO[ev.viewId]; if (!G) return false;
      const down = ev.type === 'pointerdown', move = ev.type === 'pointermove' && v.pointer.down;
      if (!down && !move) return false;
      const px = v.pointer.x, py = v.pointer.y;
      if (down) {
        if (!G.P.inside(px, py)) { DRAG = null; return false; }
        DRAG = (ev.viewId === 'ind' && G.fitX !== null && (Math.abs(px - G.fitX) < 18 || py > G.P.px.y + G.P.px.h - 22)) ? 'fit' : 'yp';
      }
      if (!DRAG) return false;
      const c = calc(s), y = G.ax.fromX(Viz.clamp(G.P.ix(px), G.ax.xr[0], G.ax.xr[1]));
      if (DRAG === 'fit') g.app.set({ fit0: Number(Viz.clamp(y, 30, 1000).toPrecision(3)) });
      else g.app.set({ yp: Number(Viz.clamp(y, 0.5, c.Ret).toPrecision(3)) });
      return true;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Drag in a view: the log law is worked out at that height.',
  notes: s => '<p>' + interpText(s) + '</p><p>' + fitNote(s) + '</p>',
  explore: {
    intro: PHONE ? 'Slide $\\mathrm{Re}_\\tau$ and watch the straight piece open. Drag in a view to move the cursor.' : 'Slide $\\mathrm{Re}_\\tau$ and watch the straight piece open. Drag in a view to move the cursor; drag the amber dot (lower right) to move the fit window.',
    controls: ['lret', 'kappa', 'B', 'yp', 'wall', 'y0p', 'fit0', 'Pi', 'dns'],
    readouts: ['U', 'Usub', 'Ulog', 'vshare', 'ind', 'dec', 'Cf', 'kfit'],
    callouts: [{ kind: 'try', html: 'Load <b>5200</b>, then drag the <b class="c-amber">amber dot</b> from $y^+=30$ to 300. The fitted $\\kappa$ of the model climbs towards the 0.41 it was built with; the simulation\'s falls towards 0.384. A measured $\\kappa$ is a statement about a window.' }]
  },
  explain: { html: s => explainHtml(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
