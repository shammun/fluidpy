.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }

    { name: 'nu_T at the default setting', js: d.nut, py: 'ch12.eddy_viscosity_from_data(ch12.parcel_uv_expected(2.0, 0.1, 0.5, 0.8), 2.0)', rtol: 1e-12 },
    { name: 'nu_T is nan at zero shear', js: b01(Number.isNaN(nuT(0, 0))), py: 'np.isnan(ch12.eddy_viscosity_from_data(0.0, 0.0))', rtol: 0 },
    { name: 'total shear stress in air (mean stress tensor)', js: stresses(1.2, 1.8e-5, 2, -0.08).total, py: TEN(0, '2.0') + '1.8e-5, 1.2, np.array([[0.04, -0.08], [-0.08, 0.25]]))[0][1]', rtol: 1e-12 },
    { name: 'viscous part alone (no fluctuations)', js: stresses(1.2, 1.8e-5, 2, 0).visc, py: TEN(0, '2.0') + '1.8e-5, 1.2, np.zeros((2, 2)))[0][1]', rtol: 1e-12 },
    { name: 'Reynolds part alone (no shear)', js: stresses(1.2, 1.8e-5, 0, -0.08).rey, py: TEN(0, '0.0') + '1.8e-5, 1.2, np.array([[0.04, -0.08], [-0.08, 0.25]]))[0][1]', rtol: 1e-12 },
    { name: 'total shear stress in water, reversed shear', js: stresses(1000, 1.0e-3, -2, 0.08).total, py: TEN(0, '-2.0') + '1.0e-3, 1000.0, np.array([[0.04, 0.08], [0.08, 0.25]]))[0][1]', rtol: 1e-12 },
    { name: 'the stress tensor is symmetric (2-1 component)', js: stresses(1.2, 1.8e-5, 2, -0.08).total, py: TEN(0, '2.0') + '1.8e-5, 1.2, np.array([[0.04, -0.08], [-0.08, 0.25]]))[1][0]', rtol: 1e-12 },
    { name: 'r_uv = −1 when parcels keep all their momentum', js: ruvExpected(1, 2, 0.1, 0), py: 'ch12.displaced_parcel_uv(2.0, 0.1, 0.5, n=1000, seed=0, correlation=1.0)["r_uv"]', rtol: 1e-9 },
    { name: 'r_uv = +1 in reversed shear', js: ruvExpected(1, -2, 0.1, 0), py: 'ch12.displaced_parcel_uv(-2.0, 0.1, 0.5, n=1000, seed=0, correlation=1.0)["r_uv"]', rtol: 1e-9 },
    { name: 'r_uv undefined when u = 0 everywhere', js: b01(Number.isNaN(ruvExpected(0.8, 0, 0.1, 0))), py: 'np.isnan(ch12.displaced_parcel_uv(0.0, 0.1, 0.5, n=100, seed=0, correlation=0.8)["r_uv"])', rtol: 0 },
    { name: 'correlation coefficient of fixed data', js: corrCoef(FA, FB), py: 'ch12.correlation_coefficient(np.array([0.1, -0.2, 0.3, -0.2]), np.array([-0.3, 0.1, -0.2, 0.4]))', rtol: 1e-12 },
    { name: 'Reynolds shear stress of four fixed samples', js: reyStress(FA.map((a, i) => [a, FB[i]]), 1.2)[0][1], py: 'ch12.reynolds_stress(np.array([[0.1, -0.3], [-0.2, 0.1], [0.3, -0.2], [-0.2, 0.4]]), 1.2)[0][1]', rtol: 1e-12 },
    { name: 'Reynolds normal stress of the same samples', js: reyStress(FA.map((a, i) => [a, FB[i]]), 1.2)[1][1], py: 'ch12.reynolds_stress(np.array([[0.1, -0.3], [-0.2, 0.1], [0.3, -0.2], [-0.2, 0.4]]), 1.2)[1][1]', rtol: 1e-12 },
    { name: 'fluidpy sample (100 000 parcels) within 5 s.e. of the closed form: z-score', js: 0, py: '(' + DP + '["uv"] - ' + DP + '["expected"]) / ' + DP + '["stderr"]', rtol: 0, atol: 5 },
    { name: 'sampled within 5 s.e. (JS, 20 000 parcels, c = 1)', js: sampledUvZ(2, 0.1, 0.5, 1, 20000), expect: 0, atol: 5 },
    { name: 'this page: 2000 parcels within 5 s.e. (default)', js: d.z, expect: 0, atol: 5 },
    { name: 'this page: sample r within 5 s.e. of −0.8', js: (sm.r + 0.8) / ((1 - 0.64) / Math.sqrt(NMAX)), expect: 0, atol: 5 },
    { name: 'share with uv < 0: ½ + arcsin(0.8)/π', js: pq, expect: 0.795167, rtol: 1e-5 },
    { name: 'this page: counted share within 5 s.e.', js: (sm.frac - pq) / Math.sqrt(pq * (1 - pq) / NMAX), expect: 0, atol: 5 },
    { name: 'centroid: mean u within 5 s.e. of zero', js: sm.ub / (d.su / Math.sqrt(NMAX)), expect: 0, atol: 5 },
    { name: 'centroid: mean v within 5 s.e. of zero', js: sm.vb / (d.sv / Math.sqrt(NMAX)), expect: 0, atol: 5 },
    { name: 'viscous + Reynolds = total', js: d.st.visc + d.st.rey - d.st.total, expect: 0, atol: 1e-15 },
    { name: 'nu_T / nu = Reynolds / viscous', js: (d.nut / d.nu) / d.ratio, expect: 1, rtol: 1e-12 },
    { name: 'no shear: every product is zero', js: N(st8({ shear: 0, n: NMAX })).sm.uv, expect: 0, atol: 0 },
    { name: 'extra u fluctuations leave uv expected unchanged', js: N(st8({ uex: 0.5 })).uve, expect: d.uve, rtol: 1e-15 },
    { name: 'r_uv with extra u: −c ℓS/√((ℓS)² + u_x²)', js: ruvExpected(0.8, 2, 0.1, 0.2), expect: -0.8 / Math.SQRT2, rtol: 1e-12 }
  ];
}

/* ---- the app ---------------------------------------------------------------------------------------------------------- */
let APP = null;
const app = Viz.app({
  title: 'How can fluctuations push the mean flow?',
  subtitle: 'Parcels swap levels in a sheared mean flow: each one lands in the (u, v) plot, the cloud tilts, and the tilt is the Reynolds stress',
  autoplay: false,
  params: {
    shear: { label: TX`Shear $dU/dy$`, min: -4, max: 4, step: 0.1, value: DEF.shear, fmt: v => sg(v) + ' s⁻¹', help: 'how fast the mean speed changes with height; negative = faster below' },
    lrms: { label: TX`Displacement $\ell_{rms}$`, min: 0.01, max: 0.5, step: 0.01, value: DEF.lrms, fmt: v => f3(v) + ' m', help: 'how far a parcel typically travels across the flow before it mixes' },
    vrms: { label: TX`$v_{rms}$`, min: 0.05, max: 2, step: 0.05, value: DEF.vrms, fmt: v => f3(v) + ' m/s', help: 'typical wall-normal velocity fluctuation' },
    keep: { label: 'Keeps its momentum $c$', min: 0, max: 1, step: 0.05, value: DEF.keep, fmt: v => f3(v), help: '1 = a parcel carries all of its old mean speed; 0 = it has forgotten where it came from' },
    fluid: { type: 'select', label: 'Fluid', options: [['air', 'air'], ['water', 'water']], value: DEF.fluid, display: 'chips', optional: true },
    uex: { label: 'Other $u$ fluctuations', min: 0, max: 1, step: 0.05, value: DEF.uex, optional: true, fmt: v => f3(v) + ' m/s', help: 'an unrelated part of u (u_extra_rms in fluidpy): fattens the cloud, leaves ⟨uv⟩ alone' },
    n: { label: 'Parcels released', min: 0, max: NMAX, step: 1, value: DEF.n, optional: true, fmt: v => Math.floor(v + 1e-9) + ' parcels' },
    sel: { label: 'Traced parcel', min: -1, max: NMAX - 1, step: 1, value: -1, optional: true }
  },
  transport: { param: 'n', min: 0, max: NMAX, rate: 100, end: 'hold', hold: 3, step: 10 },
  presets: [
    { label: 'default', set: BASE, title: 'dU/dy = 2 1/s, parcels keep 80 % of their momentum' },
    { label: 'strong shear', set: st8({ shear: 4, n: NMAX }), title: 'dU/dy = 4 1/s: twice the covariance, the same correlation coefficient' },
    { label: 'no shear', set: st8({ shear: 0, uex: 0.5, n: NMAX }), title: 'no mean gradient, u and v unrelated: a round, isotropic cloud' },
    { label: 'reversed', set: st8({ shear: -2, n: NMAX }), title: 'dU/dy = −2 1/s: the tilt flips' },
    { label: 'forgetful', set: st8({ keep: 0.3, n: NMAX }), title: 'parcels that keep only 30 % of their momentum' },
    { label: 'water', set: st8({ fluid: 'water', n: NMAX }), title: 'the same motion in water: 833 times the density' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'uvexp', label: '⟨uv⟩ expected', value: s => N(s).uve, fmt: v => sg(v) + ' m²/s²', tone: v => (v < 0 ? 'neg' : v > 0 ? 'pos' : '') },
    { id: 'uvs', label: '⟨uv⟩ sampled ± 5 s.e.', value: s => N(s).sm.uv, fmt: v => (APP ? uvsTxt(N(APP.state)) : '—') },
    { id: 'ruv', label: 'r_uv expected', value: s => N(s).r, fmt: v => (Number.isNaN(v) ? '0/0 (u = 0)' : sg2(v)) },
    { id: 'tauR', label: '−ρ⟨uv⟩', value: s => N(s).st.rey, fmt: v => f3(v) + ' Pa' },
    { id: 'ratio', label: 'Reynolds ÷ viscous', value: s => N(s).ratio, fmt: v => (Number.isNaN(v) ? '—' : f3(v)) },
    { id: 'nuT', label: 'ν_T implied', value: s => N(s).nut, fmt: v => (Number.isNaN(v) ? '0/0 (no shear)' : f3(v) + ' m²/s') }
  ],
  terms: {
    title: 'Shear stress on the mean flow (Pa)', unit: 'Pa',
    items: [
      { id: 'visc', label: TX`viscous $\mu\,dU/dy$`, color: Viz.color('rose'), value: s => N(s).st.visc, help: 'made by the molecules' },
      { id: 'rey', label: TX`Reynolds $-\rho_0\overline{uv}$`, color: Viz.color('orange'), value: s => N(s).st.rey, help: 'made by the fluctuations' }
    ],
    total: { label: TX`total $\bar\tau_{12}$` }
  },
  stage: {
    rows: [1.25, 1],
    views: [
      { id: 'flow', row: 0, flex: 1.3, title: s => '<b>Parcels in a shear</b> · <b class="c-accent">→</b> mean U(y) · ring = old level · <b class="c-orange">●</b> uv < 0 · <b class="c-blue">●</b> uv > 0 · click a parcel' },
      { id: 'scatter', row: 0, flex: 1, title: s => { const d = N(s); return '<b>(u, v)</b> of ' + d.n + ' parcels · ⟨uv⟩ ≈ <b class="c-orange">' + (d.sm.n ? f3(d.sm.uv) : '—') + '</b> (expected ' + f3(d.uve) + ') m²/s²'; } },
      { id: 'bars', row: 1, flex: 1, title: s => { const d = N(s); return '<b>The estimate settles</b> (click to jump) · <b>stress on the mean flow</b>: <b class="c-orange">Reynolds ' + f3(d.st.rey) + ' Pa</b> vs <b class="c-rose">viscous ' + f3(d.st.visc) + ' Pa</b>'; } }
    ],
    draw(g, s) { drawFlow(g, s); drawScatter(g, s); drawBars(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      const x = v.pointer.x, y = v.pointer.y, down = ev.type === 'pointerdown';
      if (ev.viewId === 'bars' && RUNP && (down || (ev.type === 'pointermove' && v.pointer.down))) {
        if (!RUNP.inside(x, y)) return false;
        g.app.play(false); g.app.set({ n: clip(Math.round(RUNP.ix(x)), 0, NMAX) }); return true;
      }
      if (!down) return false;
      if (ev.viewId === 'flow') {
        let best = -1, bd = 30 * 30;
        FH.forEach(h => { const dd = (h.x - x) * (h.x - x) + (h.y - y) * (h.y - y); if (dd < bd) { bd = dd; best = h.i; } });
        if (best < 0) return false;
        g.app.play(false); g.app.set({ sel: best }); return true;
      }
      if (ev.viewId === 'scatter' && SP) {
        const P = SP.P, d = SP.d; if (!P.inside(x, y) || d.n < 1) return false;
        let best = -1, bd = Infinity;
        for (let i = 0; i < d.n; i++) { const dx = P.X(d.C.U[i]) - x, dy = P.Y(d.C.V[i]) - y, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = i; } }
        if (best < 0) return false;
        g.app.play(false); g.app.set({ sel: best }); return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectHint: 'Click a parcel (in either view): its u = −ℓ dU/dy and its product uv are worked out here.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Press ▶ to release 2000 parcels, or drag the shear and watch the cloud tilt. Click a parcel to trace its arithmetic; in a wide window, click the bottom-left curve to jump to any count.',
    controls: ['shear', 'keep', 'lrms', 'vrms', 'fluid', 'uex'],
    readouts: ['uvexp', 'uvs', 'ruv', 'tauR', 'ratio', 'nuT'],
    callouts: [{ kind: 'try', html: 'Halve $\\ell_{rms}$ and double the shear: $u_{rms}$, $\\overline{uv}$ and the stress stay the same, but $\\nu_T$ halves. Why?' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
APP = app;
</script>
</body>
