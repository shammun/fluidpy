        W.line(R`<b class="c-rose">slope</b> of $\ln|\delta|$ from $t=` + t3(n.i0 * DT) + '$ to $' + t3(n.i1 * DT) + '$', '≈ ' + f2(lam) + ' per time unit', R`a straight-line fit from the end of the flat start until $|\delta|=0.1$, over ` + f2(n.dec) + R` decades. A rough, finite-time number: the long-time average quoted for these equations at $r=28$ is $\lambda\approx0.9$`) +
        (isFinite(n.tOne) ? W.box(R`$|\delta|$ reaches 1 at $t=\mathbf{` + t3(n.tOne) + R`}$: about ` + t3(n.i0 * DT) + R` time units of flat start, then growth at rate $\lambda$ (the fitted line crosses 1 at $t=` + t3(-n.icpt / lam) + '$; the growth comes in bursts, so the two differ a little)') : W.box(R`$|\delta|$ has not reached 1 by $t=` + TMAX + '$')) +
        W.line(R`gain per factor 10 in $\delta_0$: $\ln10/\lambda$`, f2(Math.LN10 / lam) + ' time units', 'ten times better data, a fixed small gain in time') +
        W.line(R`doubling time $\ln2/\lambda$`, f2(Math.LN2 / lam) + ' time units', 'the error doubles this often')
      : W.box(n.kind === 'chaos' || n.kind === 'coexist' ? (n.i1 > 0 ? R`<b>no slope is quoted here.</b> Between the flat start and $|\delta|=0.1$ the distance grows by only ` + f2(n.dec) + ' decades (at least ' + FITDEC + R` are needed). The growth comes in bursts, so a line through so short a stretch gives almost any number, not the rate $\lambda\approx0.9$. Start the runs closer together ($\delta_0\le10^{-6}$) to measure it.` : R`$|\delta|$ has not yet reached 0.1 by $t=` + TMAX + '$: no growth window to fit') : R`no growth: $|\delta|$ goes from $` + d0Tex(n.ld0) + '$ to $' + tt(n.sep[NSTEP]) + '$ at $t=' + TMAX + '$. Both runs approach the same steady state, so the difference is forgotten')) +
    W.say('<b>The numbers of a chaotic run are not reproducible.</b> This page steps with a fixed-step Runge–Kutta scheme ($\\Delta t=0.005$), and its short runs match fluidpy to 10 digits (the selftest). Over a long run any other method, step or rounding acts like a second $\\delta_0$' + (isDef ? ': fluidpy’s adaptive solver gives 29.1 for the time above, not ' + f3(n.tOne) : '') + '. What is reproducible is the slope and the shape of the attractor.');

    W.line('$t$', Viz.live('t'), 'time unit $d^2/((\\pi^2+k^2)\\kappa)$') +

    W.line('<b class="c-blue">run 2</b> $(X,Y,Z)$', Viz.live('s2')) +
    W.line('<b class="c-teal">distance</b> $|\\delta|$', Viz.live('sep'), 'the length of the difference of the two states') +
    W.line('the roll', Viz.live('roll'), 'from the sign of $X$ of run 1');
  out += W.step(7, 'What it means') + W.interpret(interpText(s), 'Reading the current setting');
  out += W.step(8, 'Weather and climate') +
    W.say('Lorenz met this in 1961, rerunning a small weather model from rounded numbers. The atmosphere behaves the same way: errors in the starting analysis grow roughly exponentially (doubling in a couple of days for weather systems), so better observations buy a fixed number of extra days, not a proportional gain. That is why forecasts are run as <b>ensembles</b> of slightly different starts, and why day-by-day weather has a horizon of about two weeks.') +
    W.line('time-mean of $Z$, $5\\le t\\le' + TMAX + '$', '<b class="c-orange">' + f4(n.mz1) + '</b> and <b class="c-blue">' + f4(n.mz2) + '</b>', n.kind === 'chaos' || n.kind === 'coexist' ? 'the two runs differ by ' + f2(100 * Math.abs(n.mz1 - n.mz2) / Math.max(1e-12, Math.abs(n.mz1))) + ' % in this statistic, although their states are unrelated at the end; a longer record brings them closer' : 'identical: there is no chaos to separate them') +
    W.say('<b>It does not make climate unpredictable.</b> Climate is the statistics of the attractor, not the position on it. The statistics do not depend on the start, and they shift in a definite way when a parameter is changed: move $r$ and the whole attractor moves ($\\bar Z=r-1$). A forecast is an initial-value problem; a climate projection asks how the statistics respond to the forcing.');

}

        CAM.az = DRAG.az - dx * 0.01; CAM.el = Viz.clamp(DRAG.el + dy * 0.01, -1.45, 1.45); g.app.draw(); return false;
      }
      if (ev.type === 'pointerup' || ev.type === 'pointercancel') {
        const d = DRAG; DRAG = null;
        if (ev.type === 'pointerup' && d && d.moved < 5 && PROJ) {
          let best = -1, bd = 18 * 18; const a = PROJ.a, last = PROJ.i > 0 ? PROJ.i : NSTEP;
          for (let i = 0; i <= last; i += 2) { const q = PROJ.p(a[3 * i], a[3 * i + 1], a[3 * i + 2]), dd = (q[0] - p.x) * (q[0] - p.x) + (q[1] - p.y) * (q[1] - p.y); if (dd < bd) { bd = dd; best = i; } }
          g.app.set({ pick: best >= 0 ? best : null }); return true;
        }
      }
      return false;
    }
  },
