/* ---- view 2: the (mu, Ta) stability plane ------------------------------------------------------------------------------ */

/* ---- view 3: the base flow across the gap, the two rings and the energy of the swap ------------------------------------ */
let PPR = null, dragRing = 0;
function drawProfile(g, s) {
  const v = g.view('profile'); v.clear(); PPR = null;
  if (v.w < 60 || v.h < 50) return;
  const f = F(s), ctx = v.ctx, small = v.w < 420 || v.h < 130;
  const OR = COL.U(), TE = COL.G(), C1 = COL.r1(), C2 = COL.r2(), TX = Viz.color('text'), MU = Viz.color('muted');
  const wPlot = small ? v.w : Math.round(v.w * 0.64);
  const xs = Viz.num.linspace(0, 1, 101), Us = xs.map(x => f.U(R1 + x * D) / f.Umax), Gs = xs.map(x => { const Rr = R1 + x * D; return Math.pow(TAU * Rr * f.U(Rr), 2) / f.G2max; });
  const ymin = Math.min(0, Viz.num.min(Us)) - 0.1;
  const P = v.plot({ rect: { x: 0, y: 0, w: wPlot, h: v.h }, xlim: [0, D * 1000], ylim: [ymin, 1.15], pad: small ? { l: 34, r: 6, t: 6, b: 32 } : { l: 46, r: 10, t: 8, b: 32 } });
  PPR = P;

  const mm = xs.map(x => x * D * 1000);

    // where the squared circulation falls outward (Rayleigh-unstable): a rose strip along the bottom
    const c = { A: f.A, B: f.B };
    for (let i = 0; i < 100; i++) { const Rr = R1 + (i + 0.5) / 100 * D; if (c.A * (c.A * Rr * Rr + c.B) < 0) P.fillBetween([mm[i], mm[i + 1]], ymin, ymin + 0.07 * (1.15 - ymin), { color: C1, alpha: 0.55 }); }

    [[s.x1, C1, f.G1], [s.x2, C2, f.G2]].forEach(q => {
      const X = q[0] * D * 1000;
      P.line([X, X], [ymin, 1.15], { color: q[1], width: 2, dash: [5, 4] });
      P.dot(X, q[2] * q[2] / f.G2max, 6, { color: q[1], stroke: '#fff', strokeWidth: 2 });
    });
  });

    lab(ctx, 'r₁', P.X(s.x1 * D * 1000), P.px.y + 11, { color: C1, weight: 700, align: 'center' });
    lab(ctx, 'r₂', P.X(s.x2 * D * 1000), P.px.y + 11, { color: C2, weight: 700, align: 'center' });
    if (f.frac > 0) lab(ctx, 'Γ² falls outward here', P.px.x + 6, P.px.y + P.px.h - 26, { color: C1, weight: 650 });

  }

  const bx = wPlot + 10, bw = v.w - bx - 8, top = 34, bot = v.h - 40, H = Math.max(bot - top, 10);
  const Emax = Math.max(f.ring.Ei, f.ring.Ef, 1e-300), rel = f.ring.dE < 0, cD = rel ? COL.vort() : COL.ok();
  const wb = Math.min(46, bw * 0.24), xa = bx + bw * 0.27 - wb / 2, xb = bx + bw * 0.73 - wb / 2;
  const hA = H * f.ring.Ei / Emax, hB = H * f.ring.Ef / Emax, hm = Math.min(hA, hB);

  ctx.fillStyle = cD; if (rel) ctx.fillRect(xa, bot - hA, wb, Math.max(hA - hB, 1.5)); else ctx.fillRect(xb, bot - hB, wb, Math.max(hB - hA, 1.5));

  Viz.text(ctx, 'E after swap', xb + wb / 2, bot + 11, { align: 'center', size: 12, color: TX, weight: 600 });
  Viz.text(ctx, f3(f.ring.Ei), xa + wb / 2, bot + 27, { align: 'center', size: 12, color: MU, weight: 500, maxWidth: bw / 2 - 4 });
  Viz.text(ctx, f3(f.ring.Ef), xb + wb / 2, bot + 27, { align: 'center', size: 12, color: MU, weight: 500, maxWidth: bw / 2 - 4 });

/* ---- status, notes, inspector ------------------------------------------------------------------------------------------- */
const E52 = R`\mathrm{Ta}=4\Big(\frac{\Omega_1R_1^2-\Omega_2R_2^2}{R_2^2-R_1^2}\Big)\frac{\Omega_1d^4}{\nu^2}`;
const E54 = R`\mathrm{Ta}_{cr}=\frac{1708}{\frac12(1+\Omega_2/\Omega_1)}`;
const E49 = R`U_\varphi=AR+B/R`;
function statusOf(s) {

    return { text: ph ? `✅ Rayleigh-stable: Ta = ${f3(f.Ta)} < 0` : `✅ Rayleigh-stable (μ = ${f.mu} > ${MUR.toFixed(3)}): Γ² grows outward, so Ta = ${f3(f.Ta)} ≤ 0 at any speed (here the slider only sets Ω₁ = ${f3(f.O1)} rad/s)${ng}`, tone: 'good' };
  }
  if (f.regime === 'marg') return { text: ph ? `⚖️ marginal: Ta ${f4(f.Ta)} ≈ Ta_c` : `⚖️ marginal: Ta = ${f4(f.Ta)} ≈ Ta_c = ${f4(f.Tac)} at k = ${f.kc.toFixed(2)} — vortices π/k = ${f.cell.toFixed(2)} gap tall neither grow nor decay`, tone: 'info' };
  if (f.regime === 'vort') return { text: ph ? `🌀 vortices: Ta ${f4(f.Ta)} > Ta_c ${f4(f.Tac)}` : `🌀 Taylor vortices: Ta = ${f4(f.Ta)} > Ta_c = ${f4(f.Tac)} (exact narrow gap; 1708/(½(1 + μ)) gives ${f4(f.Taa)}) · Ta/Ta_c = ${f.r.toFixed(2)}`, tone: 'bad' };
  return { text: ph ? `🧲 viscosity holds: Ta ${f4(f.Ta)} < Ta_c ${f4(f.Tac)}` : `🧲 Rayleigh-unstable but viscously stable: Ta = ${f4(f.Ta)} < Ta_c = ${f4(f.Tac)} (Γ² falls outward over ${Math.round(f.frac * 100)} % of the gap)`, tone: 'warn' };
}
function interpText(s) {
  const f = F(s), clim = ' On a rotating planet the same exchange argument, with the absolute angular momentum, gives the inertial instability of jets (Ch. 13).';
  if (f.regime === 'rs') return (f.mu <= 1
    ? R`$\Gamma^2$ grows outward everywhere: swapping two rings costs energy, so no speed can make axisymmetric vortices — $${E52}$ (11.52) is ${t3(f.Ta)} here, not positive. The dashed purple continuation is narrow-gap theory only: as $\mu\to1$ its equations become Bénard's (D15) and $\mathrm{Ta}_c\to1707.76$, but a real gap is Rayleigh-stable before that.`
    : R`The outer cylinder turns faster than the inner one: $\Gamma^2$ grows outward even more steeply. Swapping rings costs energy at every radius, so the flow is stable to axisymmetric disturbances at any speed.`) + clim;
  const e = `$${E54}$ (11.54)`;
  if (f.mu < -0.02) return R`Counter-rotation: $\Gamma^2$ falls outward only in the inner ${Math.round(f.frac * 100)} % of the gap (the rose strip), so only that part wants to overturn and viscosity holds the flow until $\mathrm{Ta}\approx${t4(f.Tac)}$. The book's ${e} gives ${f4(f.Taa)}, ${pct(f.err)} off: it assumes the onset is steady ($\sigma=0$), which is proven only for cylinders turning the same way.` + (f.regime === 'vort' ? ` You are above the curve: vortices grow.` : '') + clim;
  if (Math.abs(f.mu) <= 0.02) return R`Inner cylinder alone: $\Gamma^2$ falls outward everywhere, so every pair of rings wants to swap; viscosity resists until $\mathrm{Ta}\approx${t4(f.Tac)}$. ` + (f.regime === 'vort' ? `You are ${f.r.toFixed(2)} times above it: the disturbance grows by a factor e every ${Viz.fmtTime(f.tvis / f.sigma)}, into cells about one gap tall.` : f.regime === 'marg' ? 'You are right on the curve: the cells neither grow nor decay.' : `You are below it: a disturbance dies away in about ${Viz.fmtTime(f.tvis / Math.abs(f.sigma))} and plain Couette flow survives.`) + clim;
  return R`Co-rotation: the outer cylinder turns the same way, so the spin varies less across the gap and the forcing is weaker — but the threshold in Ta is lower too (${f4(f.Tac)}), because Ta already contains the smaller difference $\Omega_1R_1^2-\Omega_2R_2^2$. ${e} gives ${f4(f.Taa)}, within ${Math.abs(f.err * 100).toFixed(2)} % here. ` + (f.regime === 'vort' ? 'You are above the curve: vortices grow.' : f.regime === 'marg' ? 'You are on the curve.' : `You are below it; reaching it needs Ω₁ = ${f3(omegaFor(f.Tac, f.mu, R1, R2, f.nu))} rad/s.`) + clim;
}

  status: s => statusOf(s),
  readouts: [
    { id: 'Ta', label: 'Taylor number Ta', unit: '', value: s => F(s).Ta, fmt: v => f4(v), tone: v => (v <= 0 ? 'pos' : '') },
    { id: 'Tac', label: 'Ta_c exact', unit: '', value: s => F(s).Tac, fmt: v => f4(v) },
    { id: 'Taa', label: 'Ta_c ≈ 1708/(½(1+μ))', unit: '', value: s => F(s).Taa, fmt: v => f4(v) },
    { id: 'err', label: 'Error of that fit', unit: '', value: s => F(s).err, fmt: v => (isFinite(v) ? pct(v) : '—') },
    { id: 'O1', label: 'Inner speed Ω₁', unit: 'rad/s', value: s => F(s).O1 },
    { id: 'sig', label: 'Growth rate σ', unit: 'ν/d²', value: s => F(s).sigma, fmt: v => fp(v) + ' ν/d²', tone: v => (v > 0 ? 'neg' : '') },
    { id: 'dE', label: 'ΔE of the ring swap', unit: 'm²/s²', value: s => F(s).ring.dE, fmt: v => fp(v) + ' m²/s²', tone: v => (v < 0 ? 'neg' : 'pos') }
  ],
  stage: {
    rows: [1, 1.15],
    views: [
      { id: 'gap', row: 0, flex: 1, title: s => gapTitle(s) },
      { id: 'plane', row: 1, flex: 1, title: s => planeTitle(s) },
      { id: 'profile', row: 1, flex: 1.5, hidePortrait: true, title: s => profileTitle(s) }
    ],
    draw(g, s) { drawGap(g, s); drawPlane(g, s); drawProfile(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (ev.type === 'pointerup' || ev.type === 'pointercancel') { dragRing = 0; return false; }
      if (!(ev.type === 'pointerdown' || (ev.type === 'pointermove' && v.pointer.down))) return false;
      const X = v.pointer.x, Y = v.pointer.y;
      if (ev.viewId === 'plane' && PPL) {
        if (!PPL.inside(X, Y)) return false;
        g.app.set({ mu: Viz.clamp(Math.round(PPL.ix(X) * 100) / 100, MU0, MU1), lTa: Viz.clamp(Math.round(PPL.iy(Y) * 1000) / 1000, LT0, LT1) });
        return true;
      }
      if (ev.viewId === 'profile' && PPR) {
        if (!PPR.inside(X, Y) && ev.type === 'pointerdown') return false;
        const x = Viz.clamp(PPR.ix(X) / (D * 1000), 0, 1);
        if (ev.type === 'pointerdown' || !dragRing) dragRing = Math.abs(x - s.x1) <= Math.abs(x - s.x2) ? 1 : 2;
        if (dragRing === 1) g.app.set({ x1: Viz.clamp(Math.round(x * 100) / 100, 0, s.x2 - 0.05) });
        else g.app.set({ x2: Viz.clamp(Math.round(x * 100) / 100, s.x1 + 0.05, 1) });
        return true;
      }
      return false;
    }
  },
  inspect: s => inspectHtml(s),
  inspectTitle: 'The two rings',
  inspectHint: 'Drag the rings in the base-flow view to see the energy of their swap.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Drag the dot in the (μ, Ta) plane across the purple curve and the blue line, then press ▶ to see whether a small disturbance grows into vortices or dies. Drag the two rings in the base-flow view.',
    controls: ['mu', 'lTa', 'fluid', 'x1', 'x2'],
    readouts: ['Ta', 'Tac', 'Taa', 'err', 'O1', 'sig', 'dE'],
    callouts: [{ kind: 'try', html: 'Press <b>counter-rotation</b> and move ring 2 outward past the point where U_φ changes sign: the swap stops releasing energy — only the inner part of the gap is Rayleigh-unstable.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows,
  onChange(s, key, a) { if (key === 'mu') (a.controls.lTa || []).forEach(c => c.sync(s.lTa)); }
});
APP = app;
(app.controls.lTa || []).forEach(c => c.sync(app.state.lTa));
</script>
</body>
</html>
