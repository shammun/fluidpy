.viz-stage:not(.multi) .viz-transport { border-top: 1px solid var(--viz-border); }

  background: var(--viz-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; }
.viz-work-say { margin: 0; font-size: 13px; line-height: 1.45; color: var(--viz-text-soft); }

.viz-work-interp b.k, .viz-der-block b.k { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; color: var(--viz-accent-dark); }
.viz-card-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }

.viz-der-chain .viz-der-tag { flex: 0 0 auto; min-width: 16px; }
.viz-der-prev { opacity: .62; }
.viz-der-cur { background: color-mix(in srgb, var(--viz-orange) 10%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-orange) 40%, var(--viz-border)); }
.viz-der-result { background: color-mix(in srgb, var(--viz-teal) 12%, var(--viz-card)); border: 1px solid color-mix(in srgb, var(--viz-teal) 45%, var(--viz-border)); }
.viz-der-live { background: var(--viz-accent-soft); color: var(--viz-accent-dark); }

.viz-der-interp b.k { color: var(--viz-orange); }
.viz-der-check { border-left: 3px solid var(--viz-blue); padding: 3px 9px; }
.viz-der-mini { display: flex; flex-direction: column; gap: 4px; background: var(--viz-card-2); border: 1px solid var(--viz-border); border-radius: var(--viz-radius-sm); padding: 5px 7px; }
.viz-der-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }

.viz-app[data-layout="portrait"][data-tab="derive"] .viz-transport { display: none; }

/* ---- the app ---------------------------------------------------------------------------------------------------------- */
let APP = null;
const app = Viz.app({
  title: 'How can a stably stratified column overturn?',
  subtitle: 'Heat leaks out of a parcel about a hundred times faster than salt: a displaced parcel, a map of every pair of gradients and the three growth rates of the layer share one state and one clock',
  autoplay: false,
  params: {
    dTdz: { label: R`Temperature gradient $d\bar T/dz$`, min: -0.02, max: 0.02, step: 0.0001, value: DEF.dTdz, fmt: v => f3(v) + ' K/m (Γ = ' + f3(-v) + ')', help: "Kundu's sign: > 0 is warmer on top. The lapse rate Γ = −dT̄/dz is the same number negated." },
    dSdz: { label: R`Salinity gradient $dS/dz$`, min: -0.005, max: 0.005, step: 0.0001, value: DEF.dSdz, fmt: v => f3(v) + ' (g/kg)/m', help: '> 0 is saltier on top' },
    tau: { label: R`Diffusivity ratio $\kappa_s/\kappa$`, min: 0.003, max: 1, log: true, value: DEF.tau, fmt: v => f3(v), help: 'sea water: 0.0107 (salt is 93 times slower than heat)' },
    d: { label: R`Layer depth $d$`, min: 0.005, max: 0.3, log: true, value: DEF.d, fmt: v => f3(100 * v) + ' cm', help: 'the criterion grows as d⁴' },
    Pr: { label: R`Prandtl number $\Pr$`, min: 1, max: 20, step: 0.5, value: DEF.Pr, optional: true, help: 'ν/κ; water is about 7. It changes how fast, not where the finger line is.' },
    run: { label: 'time', min: 0, max: 1, step: 'any', value: 0, optional: true, fmt: v => (APP ? Viz.fmtTime(N(APP.state).tSec) : '0 s') }
  },
  transport: { param: 'run', min: 0, max: 1, rate: 0.14, end: 'hold', hold: 2.5, step: 0.02 },
  presets: [
    { label: 'thermocline', set: THERMO, title: 'subtropical thermocline: warm salty over cold fresh — fingers' },
    { label: 'Arctic', set: ARCTIC, title: 'cold fresh over warm salty — the diffusive (oscillating) regime' },
    { label: 'κ_s = κ', set: st8({ tau: 1 }), title: 'equal diffusivities: no fingers' },
    { label: 'top-heavy, stable', set: TOPS, title: 'heavier on top but below the threshold: nothing overturns' },
    { label: 'top-heavy, overturns', set: st8({ dTdz: -0.01, dSdz: 0 }), title: 'ordinary convection' },
    { label: 'thinnest layer', set: st8({ d: 0.0161 }), title: 'd = 1.61 cm: just above the finger line' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'Ra', label: 'Ra (§11.5 sign)', value: s => N(s).sf.Ra, fmt: v => f5(v) },
    { id: 'Rs', label: R`Rs (with $\kappa_s$)`, value: s => N(s).sf.Rs, fmt: v => f5(v) },
    { id: 'margin', label: 'Rs − Ra − 657.5', value: s => N(s).sf.margin, fmt: v => f5(v), tone: v => (v > 0 ? 'neg' : 'pos') },
    { id: 'Rrho', label: R`$R_\rho=\alpha\bar T_z/\beta S_z$`, value: s => N(s).sf.R_rho, fmt: v => f3(v) },
    { id: 'smax', label: 'max Re σ', value: s => N(s).lead[0], fmt: v => f3(v) + ' κ/d²', tone: v => (v > 1e-12 ? 'neg' : 'pos') },

  ],
  stage: {
    rows: [1, 1.15],
    views: [
      { id: 'column', row: 0, flex: 1.5, title: s => { const n = N(s); return '<b>A displaced parcel</b> · t = ' + Viz.fmtTime(n.tSec) + ' · <b class="c-rose">heat</b> ' + (n.dTdz !== 0 ? pct(n.heat) : '—') + ' · <b class="c-amber">salt</b> ' + (n.dSdz !== 0 ? pct(n.salt) : '—') + ' · <b>depth</b> ×' + f3(n.dep); } },
