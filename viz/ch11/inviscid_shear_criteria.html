}
function interpText(s) {
  const f = F(s), n = f.p.name;
  const tail = f.md.unstable ? ` At k = ${f3(s.k)} the wave grows at k c_i = ${f3(f.growth)} U₀/L (e-folding time ${f3(1 / f.growth)} L/U₀), below Howard's bound ${f3(f.bound)}.` : '';
  if (n === 'poiseuille') return "Plane Poiseuille flow has U″ = −2 everywhere: no inflection point, so no inviscid mode can grow. Its real instability (Re above 5772) is caused by viscosity — the Orr–Sommerfeld explainer.";
  if (n === 'blasius_like') return 'The Blasius boundary layer has U″ ≤ 0: no inflection point inside the flow, so it is inviscidly stable. Its Tollmien–Schlichting waves need viscosity; an adverse pressure gradient would add an inflection point.';
  if (n === 'wall_vorticity_max') return "An inflection point is not enough. Here U″ changes sign at y = 0, so Rayleigh's condition is met, but (U − U_I)U″ is positive on both sides: the vorticity |U′| is smallest at the inflection point and largest at the walls. Fjørtoft's condition fails and nothing grows.";
  if (n === 'shear_layer') return `The classic mixing layer: both conditions are met and it is unstable for 0 < k < 1; the fastest wave has k ≈ ${f3(f.mx.k)} with k c_i ≈ ${f4(f.mx.g)} U₀/L. The wave does not travel (c_r = 0): it sits on the inflection point.` + tail;
  if (n === 'jet') return `Jets are very unstable. Two inflection points at y = ±0.658 where U_I = 2/3; the ${f.par === 'odd' ? 'varicose (pulsing) mode grows for k < 1' : 'sinuous (flapping) mode grows for k < 2'}, fastest at k ≈ ${f3(f.mx.k)} with k c_i ≈ ${f4(f.mx.g)} U₀/L, and travels at a speed inside the range of U.` + tail;
  if (f.regime === 'counter') return `A counter-example. sin y has an inflection point at y = 0 and (U − U_I)U″ = −sin²y < 0, so both conditions are met — yet with walls at ±${f3(f.b)} (2b < π) no mode grows: the walls leave no room for the neutral wave cos(πy/2b), which needs k² = 1 − (π/2b)² > 0. The criteria only say where growth is possible.`;
  return `sin y between walls at ±${f3(f.b)} (2b > π): now the neutral wave cos(πy/2b) fits, at k = ${f3(f.sp.kn)}, and every longer wave grows; the fastest has k ≈ ${f3(f.mx.k)} with k c_i ≈ ${f3(f.mx.g)} U₀/L.` + tail;
}
function inspectHtml(s) {
  const f = F(s), p = f.p, y = probeY(s, f), U = p.U(y), U2 = p.Upp(y);
  if (!f.crit.ray) return R`At $y=${t3(y)}$: $U=${t3(U)}$, $U''=${t3(U2)}$ — ${U2 === 0 ? 'zero here' : U2 < 0 ? 'negative, as everywhere in this flow' : 'positive'}. There is no inflection point, so there is no $U_I$ and no product to test.`;
  const pr = (U - f.UI) * U2;
  return R`At $y=${t3(y)}$: $U=${t3(U)}$, $U''=${t3(U2)}$, $U_I=${t3(z0(f.UI))}$<br>$(U-U_I)\,U''=(${t3(U)}-${t3(z0(f.UI))})\times(${t3(U2)})=\mathbf{${t3(z0(pr))}}$ — ` +
    (Math.abs(pr) < 1e-9 ? 'zero: you are on the inflection point.' : pr < 0 ? '<b class="c-rose">negative</b>: this height is what Fjørtoft needs.' : '<b class="c-teal">positive</b>: this height does not help.');
}

const E81 = R`(U-c)\Big(\frac{d^2\phi}{dy^2}-k^2\phi\Big)-\frac{d^2U}{dy^2}\phi=0`;
const E84 = R`c_i\int\frac{1}{\lvert U-c\rvert^2}\frac{d^2U}{dy^2}\lvert\phi\rvert^2dy=0`;
const E71 = R`U_{\min}<c_r<U_{\max}`;
const ESEMI = R`\Big[c_r-\tfrac12(U_{\max}+U_{\min})\Big]^2+c_i^2\le\Big[\tfrac12(U_{\max}-U_{\min})\Big]^2`;
const EFJ = R`(U-U_I)\frac{d^2U}{dy^2}<0`;
function explainHtml(s) {

  o += W.step(1, "Rayleigh: is there an inflection point?") +
    W.line(R`profile $${PTEX[p.name]}$ on $${t3(p.lo)}\le y\le${t3(p.hi)}$`, PNAMES[p.name], p.name === 'blasius_like' ? 'y in displacement thicknesses δ*' : p.walls ? 'between rigid walls' : 'unbounded; the picture shows |y| ≤ 4') +
    W.line(R`$U''$ changes sign at $y_I$`, c.ray ? 'y = ' + yList(c.yI) : 'nowhere', c.ray ? 'the purple dots' : `U″ stays ${c.Upps[400] <= 0 ? '≤ 0' : '≥ 0'} across the flow`) +
    W.box(R`Growth needs $${E84}$ (11.84) with $c_i\neq0$, so $U''$ must change sign: Rayleigh's necessary condition is <b>${c.ray ? 'met' : 'not met — no inviscid mode can grow'}</b>`);
  o += W.step(2, 'Fjørtoft: is the vorticity maximum inside?') +
    (c.ray
      ? W.line(R`$U_I=U(y_I)$`, f3(z0(f.UI)) + ' U₀', 'the speed at the inflection point' + (c.yI.length > 1 ? ' (the same at both)' : '')) +
        W.line(R`smallest $(U-U_I)U''$ in the flow`, f3(z0(c.minProd)) + ' U₀²/L²', c.fj ? 'negative somewhere: the rose shading' : 'never negative: only teal shading') +
        W.line('at your probe', Viz.live('probe'), 'click the profile to move the probe') +
        W.box(R`Fjørtoft's necessary condition $${EFJ}$ somewhere in the flow is <b>${c.fj ? 'met' : 'not met'}</b>: $\lvert U'\rvert$ has its ${c.fj ? 'maximum' : 'minimum'} at the inflection point (${f3(Math.abs(p.Up(c.yI[0])))} there, ${f3(Math.abs(p.Up(p.hi)))} at the edge)`)
      : W.say('Without an inflection point there is no $U_I$: the test does not apply, and the flow is already ruled out by Rayleigh.'));
  o += W.step(3, 'The wave speed at your wavenumber') +
    (md.unstable
      ? W.line(R`<b class="c-blue">$c(k=${t3(s.k)})$</b>`, cTxt(md.cr, md.ci) + ' U₀', md.kind === 'table' ? 'a node of our fluidpy table (4 significant figures)' : `cubic interpolation between the nodes of our fluidpy table; the last node is the exact neutral point k = ${f3(f.sp.kn)}`) +
        W.line(R`growth rate $kc_i=${t3(s.k)}\times${t4(md.ci)}$`, f4(f.growth) + ' U₀/L', R`the disturbance grows like $e^{kc_it}$`) +
        W.line(R`e-folding time $1/(kc_i)$`, f3(1 / f.growth) + ' L/U₀', 'time to grow by a factor e = 2.72') +

  o += W.step(4, "Howard's semicircle") +
    W.line(R`centre $\tfrac12(U_{\max}+U_{\min})=\tfrac12(${t3(p.Umax)}+(${t3(p.Umin)}))$`, f3(z0(f.mC)) + ' U₀', 'the middle of the orange segment') +
    W.line(R`radius $\tfrac12(U_{\max}-U_{\min})$`, f3(f.Rad) + ' U₀', 'half the velocity range') +
    (md.unstable

      W.line(R`<b class="c-rose">$\int\frac{(U-c_r)U''\lvert\phi\rvert^2}{\lvert U-c\rvert^2}dy$</b> (11.85)`, fp(a), R`the book's identity says this equals $-\int(\lvert\phi'\rvert^2+k^2\lvert\phi\rvert^2)dy$, i.e. −1 here; the tiny gap is the accuracy of $c$ (${md.kind === 'table' ? '4 significant figures' : 'interpolated'})`) +
      W.line(R`<b class="c-blue">$(c_r-U_I)\int\frac{U''\lvert\phi\rvert^2}{\lvert U-c\rvert^2}dy$</b> (11.86)`, fp(z0(Math.abs(b86) < 5e-4 ? 0 : b86)), 'zero, because the integral itself is zero') +
      W.box(R`sum: $\int\frac{(U-U_I)U''\lvert\phi\rvert^2}{\lvert U-c\rvert^2}dy=\mathbf{${t3(a + b86)}}<0$ — so $(U-U_I)U''$ must be negative somewhere (Fjørtoft)`);
  } else o += W.say('These integrals exist only for a growing mode ($c_i\\neq0$). Choose the tanh layer, the jet or sin y with $2b>\\pi$ and a wavenumber inside the unstable band.');
  o += W.step(6, "The cat's eye") + (sm
    ? W.hint(`On a portrait phone the cat's-eye view is hidden: turn the phone sideways to see the eye. Its key number is the readout "Eye half-width": ${f3(f.hw)} L for A = ${f3(s.A)}.`)
    : W.line(R`critical layer: $U(y_c)=c_r=${t3(z0(f.cEye))}$`, 'y_c = ' + f3(z0(f.yc)) + ' L', md.unstable ? 'the blue dotted line' : f.sp ? "of the profile's neutral wave" : 'of a neutral wave we chose (any real c in the range of U has one)') +
      W.line(R`$U'(y_c)$`, f3(f.Uyc) + ' U₀/L', 'the shear at that height') +
      W.line(R`half-width $2\sqrt{A\phi_c/U'_c}=2\sqrt{${t3(s.A)}\times1/${t3(f.Uyc)}}$`, f3(f.hw) + ' L', 'centre line to the bold separatrix; grows like √A') +
      W.box(R`near $y_c$: $\hat\psi\cong\frac{(y-y_c)^2}{2}\Big[\frac{dU}{dy}\Big]_{y_c}+A\phi(y_c)\cos(kx)$, from $\hat\psi=\int(U-c)dy+A\phi(y)\exp\{\mathrm ikx\}$ (11.87): fluid inside the bold line is trapped and travels with the wave`));
  o += W.step(7, 'Reading the current setting') + W.interpret(interpText(s), 'Reading the current setting');
  return o;
}

/* ---- per-profile controls: b only for sin y, parity only for the jet ---------------------------------------------------------------- */
function markProfile(s, app) {
  const el = document.documentElement;
  if (el.getAttribute('data-isc-prof') === s.profile) return;
  el.setAttribute('data-isc-prof', s.profile);
  if (app && app.fit) requestAnimationFrame(() => { try { app.fit(); } catch (e) { /* not ready yet */ } });
}

/* ---- the app ------------------------------------------------------------------------------------------------------------------- */
const app = Viz.app({
  title: 'Which profiles can be unstable without viscosity?',
  subtitle: "The profile with its inflection point, the growing wave's speed inside Howard's semicircle, and the cat's eye at the critical layer — one state",
  autoplay: false,
  params: {
    profile: { type: 'select', label: 'Profile', options: [['shear_layer', 'tanh'], ['jet', 'jet'], ['sin', 'sin y'], ['wall_vorticity_max', 'sinh'], ['poiseuille', 'Poiseuille'], ['blasius_like', 'Blasius']], value: 'shear_layer', display: 'chips', optional: true },
    k: { label: 'Wavenumber $k$', min: 0.1, max: 2, step: 0.005, value: 0.445, unit: '1/L', fmt: v => v.toFixed(3) + ' L⁻¹', help: 'streamwise wavenumber of the disturbance; wavelength 2π/k' },
    b: { label: 'Wall position $b$ (sin y)', min: 1.2, max: 3, step: 0.1, value: 1.4, unit: 'L', fmt: v => v.toFixed(1) + ' L', help: 'walls at y = ±b; growth needs 2b > π, i.e. b > 1.571' },
    parity: { type: 'select', label: 'Jet mode', options: [['even', 'sinuous'], ['odd', 'varicose']], value: 'even', display: 'chips', help: 'sinuous: the jet flaps; varicose: it pulses' },
    A: { label: "Wave amplitude $A$ (cat's eye)", min: 0.01, max: 0.5, step: 0.01, value: 0.1, unit: 'U₀L', fmt: v => v.toFixed(2) + ' U₀L', help: 'amplitude of the neutral wave in the stream function of the eye' },
    yp: { label: 'Probe height $y$', min: -4, max: 6, step: 0.01, value: 0.6, unit: 'L', optional: true }
  },
  modes: { param: 'profile', options: [['shear_layer', 'tanh'], ['jet', 'jet'], ['sin', 'sin y'], ['wall_vorticity_max', 'sinh'], ['poiseuille', 'Poiseuille'], ['blasius_like', 'Blasius']] },
  presets: [
    { label: 'tanh: fastest wave', set: Object.assign({}, BASE), title: 'both conditions met; k = 0.445 grows fastest' },
    { label: 'jet, varicose', set: Object.assign({}, BASE, { profile: 'jet', parity: 'odd', k: 0.4 }), title: 'the pulsing mode of the Bickley jet' },
    { label: 'Rayleigh ✓ Fjørtoft ✗', set: Object.assign({}, BASE, { profile: 'wall_vorticity_max' }), title: 'inflection point, but the vorticity peaks at the walls' },
    { label: 'sin y, 2b < π', set: Object.assign({}, BASE, { profile: 'sin', b: 1.4, k: 0.3 }), title: 'both conditions met, yet stable' },
    { label: 'sin y, b = 2', set: Object.assign({}, BASE, { profile: 'sin', b: 2, k: 0.35 }), title: 'wider walls: now a mode grows' }
  ],
  status: s => statusOf(s),
  readouts: [
    { id: 'yI', label: 'Inflection y_I', unit: 'L', value: s => F(s).crit.yI.length, fmt: (v, s) => (v ? yList(F(s).crit.yI) + ' L' : 'none') },
    { id: 'UI', label: 'Speed there U_I', unit: 'U₀', value: s => F(s).UI, fmt: v => (isFinite(v) ? f3(z0(v)) + ' U₀' : '—') },
    { id: 'c', label: 'Wave speed c', unit: 'U₀', value: s => F(s).md.ci, fmt: (v, s) => { const f = F(s); return f.md.unstable ? cTxt(f.md.cr, f.md.ci) + ' U₀' : 'no growing mode'; } },
    { id: 'g', label: 'Growth rate k c_i', unit: 'U₀/L', value: s => F(s).growth, fmt: (v, s) => f4(v) + ' U₀/L', tone: v => (v > 0 ? 'neg' : '') },
    { id: 'bound', label: "Howard's bound", unit: 'U₀/L', value: s => F(s).bound },
    { id: 'dist', label: 'Distance to the arc', unit: 'U₀', value: s => F(s).dist },
    { id: 'eye', label: 'Eye half-width', unit: 'L', value: s => F(s).hw }
  ],
  stage: {
    rows: [1.15, 1],
    views: [
      { id: 'prof', row: 0, flex: 1.25, title: s => profTitle(s) },
      { id: 'cplane', row: 0, flex: 1, title: s => cplaneTitle(s) },
      { id: 'eye', row: 1, flex: 1, hidePortrait: true, title: s => eyeTitle(s) }
    ],
    setup(g, s) { markProfile(s, g.app); },
    draw(g, s) { markProfile(s, g.app); drawProf(g, s); drawCplane(g, s); drawEye(g, s); },
    onPointer(g, ev, s) {
      const v = ev.vizView; if (!v || !v.pointer) return false;
      if (!(ev.type === 'pointerdown' || (ev.type === 'pointermove' && v.pointer.down))) return false;
      const X = v.pointer.x, Y = v.pointer.y, f = F(s);
      if (ev.viewId === 'prof' && PPF) {
        if (Y < PPF.px.y || Y > PPF.px.y + PPF.px.h) return false;
        g.app.set({ yp: Math.round(Viz.clamp(PPF.iy(Y), f.p.lo, f.p.hi) * 100) / 100 });
        return true;
      }
      if (ev.viewId === 'cplane' && PPC && f.track) {
        let best = -1, bd = Infinity;
        f.track.ks.forEach((k, i) => { const d = Math.hypot(PPC.X(f.track.cr[i]) - X, PPC.Y(f.track.ci[i]) - Y); if (d < bd) { bd = d; best = i; } });
        if (best < 0 || bd > 60) return false;
        g.app.set({ k: Viz.clamp(Math.round(f.track.ks[best] / 0.005) * 0.005, 0.1, 2) });
        return true;
      }
      return false;
    }
  },
  terms: {
    title: "Fjørtoft's two integrals for the growing mode, divided by its norm", sig: 3,
    items: [
      { id: 'a85', label: R`$\int\!\frac{(U-c_r)U''\lvert\phi\rvert^2}{\lvert U-c\rvert^2}dy$ (11.85)`, color: Viz.color('rose'), value: s => { const f = F(s); return f.ef ? f.ef.A85 / f.ef.N : 0; } },
      { id: 'b86', label: R`$(c_r-U_I)\!\int\!\frac{U''\lvert\phi\rvert^2}{\lvert U-c\rvert^2}dy$ (11.86)`, color: Viz.color('blue'), value: s => { const f = F(s); if (!f.ef) return 0; const q = (f.md.cr - f.UI) * f.ef.I84 / f.ef.N; return Math.abs(q) < 5e-4 ? 0 : q; } }
    ],
    total: { label: R`sum $\int\!\frac{(U-U_I)U''\lvert\phi\rvert^2}{\lvert U-c\rvert^2}dy$: must be negative` }
  },
  inspect: s => inspectHtml(s),
  inspectTitle: 'The probe: Fjørtoft\'s product at one height',
  inspectHint: 'Click the profile to move the probe.',
  notes: s => '<p>' + interpText(s) + '</p>',
  explore: {
    intro: 'Pick a profile (chips above the picture), then drag $k$: the blue dot is the growing mode\'s wave speed. Click the profile to probe $(U-U_I)U\'\'$; click the track in the c-plane to jump to that wavenumber.',
    controls: ['k', 'b', 'parity', 'A'],
    readouts: ['yI', 'UI', 'c', 'g', 'bound', 'dist', 'eye'],
    callouts: [{ kind: 'try', html: 'Choose <b>sin y</b> and drag <b>b</b> from 1.4 to 3: nothing changes in the two criteria, yet the blue dot appears only once 2b &gt; π.' }]
  },
  explain: { html: s => explainHtml(s), live: s => explainLive(s) },
  derivations: DERIV,
  code: CODE,
  tour: TOUR,
  equations: EQS,
  check: QUIZ,
  selftest: selftestRows
});
