const EQ_3D = R`\begin{aligned}&\mathrm ik(U-c)\hat u+\hat v\,(dU/dy)\\ &\quad=-\mathrm ik\hat p+\tfrac{1}{\mathrm{Re}}\big[d^2\hat u/dy^2-(k^2+m^2)\hat u\big]\\ &\mathrm ik(U-c)\hat v\\ &\quad=-d\hat p/dy+\tfrac{1}{\mathrm{Re}}\big[d^2\hat v/dy^2-(k^2+m^2)\hat v\big]\\ &\mathrm ik(U-c)\hat w\\ &\quad=-\mathrm im\hat p+\tfrac{1}{\mathrm{Re}}\big[d^2\hat w/dy^2-(k^2+m^2)\hat w\big]\\ &\mathrm ik\hat u+d\hat v/dy+\mathrm im\hat w=0\end{aligned}`;
const EQ_SQ = R`\begin{aligned}&\bar k=\sqrt{k^2+m^2},\quad \bar c=c,\quad \bar k\bar u=k\hat u+m\hat w,\\ &\bar v=\hat v,\quad \bar p/\bar k=\hat p/k,\quad \bar k\,\overline{\mathrm{Re}}=k\,\mathrm{Re}\end{aligned}`;
const EQ_OS = R`\begin{aligned}&(U-c)\Big(\frac{d^2\phi}{dy^2}-k^2\phi\Big)-\frac{d^2U}{dy^2}\phi\\ &\qquad=\frac{1}{\mathrm ik\mathrm{Re}}\Big(\frac{d^4\phi}{dy^4}-2k^2\frac{d^2\phi}{dy^2}+k^4\phi\Big)\end{aligned}`;
const EQ_BC = R`\phi=\frac{d\phi}{dy}=0\quad\text{at}\ y=y_1\ \text{and}\ y_2`;
const EQ_EN = R`\frac{d}{dt}\int\frac12u_i^2\,dV=-\int u_iu_j\frac{\partial U_i}{\partial x_j}\,dV-\Lambda`;
const EQ_EN2 = R`\frac{d}{dt}\int\frac12(u^2+v^2)\,dV=-\int uv\,\frac{\partial U}{\partial y}\,dV-\Lambda`;
const EQ_EN2S = R`\begin{aligned}&\frac{d}{dt}\int\tfrac12(u^2+v^2)\,dV\\ &\quad=-\int uv\,\frac{\partial U}{\partial y}\,dV-\Lambda\end{aligned}`;
const OS_IN = R`(U-c)(\phi''-k^2\phi)-U''\phi=\tfrac{1}{\mathrm ik\mathrm{Re}}(\phi''''-2k^2\phi''+k^4\phi)`;

  id: 'D21', title: 'The Orr–Sommerfeld equation from the normal-mode equations', short: 'D21 · Orr–Sommerfeld', ref: 'Eq. (11.79)', view: 'wave',
  goal: 'Remove the pressure from the equations of one two-dimensional wave and reduce them to a single equation for the stream-function amplitude $\\phi(y)$. The book only says that the effort yields the result; here is every move.',

    { did: 'Rewrite the $x$-equation', tex: R`\begin{aligned}&\mathrm ik(U-c)\phi'-\mathrm ikU'\phi\\ &\quad=-\mathrm ik\hat p+\tfrac{1}{\mathrm{Re}}(\phi'''-k^2\phi')\end{aligned}`,

    { did: 'Differentiate step 2 in $y$', tex: R`\begin{aligned}&\mathrm ik(U-c)\phi''-\mathrm ikU''\phi\\ &\quad=-\mathrm ik\hat p'+\tfrac{1}{\mathrm{Re}}(\phi''''-k^2\phi'')\end{aligned}`,
      why: 'Product rule: $\\mathrm ik[U\'\\phi\'+(U-c)\\phi\'\']-\\mathrm ik[U\'\'\\phi+U\'\\phi\']$; the two $U\'\\phi\'$ terms cancel. We want $\\hat p\'$, which the $y$-equation also contains.', plain: 'Now both equations contain $\\hat p\'$.' },
    { did: 'Multiply step 3 by $\\mathrm ik$', tex: R`\mathrm ik^3(U-c)\phi=-\mathrm ik\hat p'+\tfrac{k^2}{\mathrm{Re}}(\phi''-k^2\phi)`,

    { did: 'Subtract step 5 from step 4', tex: R`\begin{aligned}&\mathrm ik(U-c)(\phi''-k^2\phi)-\mathrm ikU''\phi\\ &\quad=\tfrac{1}{\mathrm{Re}}\big(\phi''''-k^2\phi''-k^2\phi''+k^4\phi\big)\end{aligned}`,
      why: 'The pressure terms are identical and cancel, which was the aim. On the left the two $(U-c)$ terms are grouped.', plain: 'The pressure is gone.' },

const D23 = {
  id: 'D23', title: 'The disturbance kinetic-energy equation', short: 'D23 · energy equation', ref: 'Eq. (11.88)', view: 'map',
  goal: 'Find what makes the kinetic energy of a disturbance change: what produces it and what destroys it. The book leaves this to an exercise.',
  start: { tex: R`\begin{aligned}&\frac{\partial}{\partial t}(U_i+u_i)+(U_j+u_j)\frac{\partial}{\partial x_j}(U_i+u_i)\\ &\quad=-\frac1\rho\frac{\partial}{\partial x_i}(P+p)+\nu\frac{\partial^2}{\partial x_j\partial x_j}(U_i+u_i)\end{aligned}`,
    plain: 'The Navier–Stokes momentum equation (11.96) for the basic flow $U_i$, $P$ plus a disturbance $u_i$, $p$, in index notation: a repeated index is summed. Below, $\\partial_j$ means $\\partial/\\partial x_j$.' },
  plan: ['Subtract the equation of the basic flow.', 'Multiply by $u_i$.', 'Turn every term that can be into a divergence.', 'Integrate over a box of whole wavelengths: the divergences vanish.'],
  uses: ['index notation and Gauss’ divergence theorem (Ch. 2)', 'the product rule', 'incompressibility $\\partial_jU_j=\\partial_ju_j=0$'],
  set: ORSZAG,
  steps: [
    { did: 'Subtract the basic-flow equation', tex: R`\begin{aligned}&\partial_tu_i+U_j\partial_ju_i+u_j\partial_jU_i+u_j\partial_ju_i\\ &\quad=-\tfrac1\rho\partial_ip+\nu\partial_j\partial_ju_i\end{aligned}`,
      why: 'The steady basic flow satisfies the same equation without $u$ and $p$. The nonlinear term $u_j\\partial_ju_i$ is kept; it will drop out by itself.', plain: 'The exact equation for the disturbance.' },
    { did: 'Multiply by $u_i$', tex: R`\begin{aligned}&\partial_t\big(\tfrac12u_iu_i\big)+u_iU_j\partial_ju_i+u_iu_j\partial_jU_i\\ &\ +u_iu_j\partial_ju_i=-\tfrac1\rho u_i\partial_ip+\nu u_i\partial_j\partial_ju_i\end{aligned}`,
      why: 'Chain rule: $u_i\\partial_tu_i=\\partial_t(\\tfrac12u_iu_i)$. Multiplying by the velocity turns a momentum equation into an energy equation.', plain: 'An equation for the disturbance’s kinetic energy per unit mass.' },
    { did: 'Rewrite the advection by $U$', tex: R`u_iU_j\partial_ju_i=\partial_j\big(\tfrac12u_iu_iU_j\big)`,
      why: 'Product rule: $\\partial_j(\\tfrac12u_i^2U_j)=U_j\\partial_j(\\tfrac12u_i^2)+\\tfrac12u_i^2\\partial_jU_j$, and the last term vanishes because the basic flow is incompressible, $\\partial_jU_j=0$.', plain: 'The basic flow only carries the energy around.' },
    { did: 'Rewrite the self-advection', tex: R`u_iu_j\partial_ju_i=\partial_j\big(\tfrac12u_iu_iu_j\big)`,

    { did: 'Split the viscous term', tex: R`\nu u_i\partial_j\partial_ju_i=\partial_j(\nu u_i\partial_ju_i)-\nu(\partial_ju_i)(\partial_ju_i)`,
      why: 'The product rule read backwards: $\\partial_j(u_i\\partial_ju_i)=(\\partial_ju_i)^2+u_i\\partial_j\\partial_ju_i$, with constant $\\nu$.', plain: 'Viscous transport, plus a term that is a square with a minus sign: a loss.' },
    { did: 'Collect', tex: R`\begin{aligned}\partial_t\big(\tfrac12u_i^2\big)=&-u_iu_j\partial_jU_i-\nu(\partial_ju_i)^2\\ &-\partial_j\Big[\tfrac12u_i^2U_j+\tfrac12u_i^2u_j+\tfrac{pu_j}{\rho}-\nu u_i\partial_ju_i\Big]\end{aligned}`,
      why: 'Steps 2 to 6 put together; everything that is a divergence goes into the bracket.', plain: 'Production, loss and transport.' },
    { did: 'Integrate over the fixed box', tex: R`\begin{aligned}\frac{d}{dt}\int\tfrac12u_i^2dV=&-\int u_iu_j\partial_jU_i\,dV\\ &-\nu\int(\partial_ju_i)^2dV-\oint[\dots]_jn_j\,dA\end{aligned}`,
      why: 'The box does not move, so $d/dt$ comes outside the integral. Gauss’ theorem turns the integral of a divergence into a surface integral.', plain: 'Transport can only act through the surface of the box.' },
    { did: 'Remove the walls', tex: R`u_i=0\ \ \text{on the walls (or far away)}`,
